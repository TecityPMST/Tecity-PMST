 term and invest in hard technology.\" CXMT, headed for a Shanghai debut, exemplifies the \"Hefei model\" of state vehicles absorbing early risk. The system risks state-engineered overcapacity.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20SCMP/Investment%20with%20Chinese%20characteristics%20how%20Beijing%E2%80%99s%20money%20is%20reshaping%20tech%20ventures.pdf"}, {"id": "scmp-14", "title": "Iran claims progress in Oman talks after US halts air strikes", "source": "SCMP", "date": "27 Jul 2026", "tags": ["Geopolitics", "Energy", "Defence"], "summary": "Iran said on Sunday it had made progress in talks with Oman on managing the Strait of Hormuz, after the US resumed attacks to end Tehran's control of the waterway. Foreign ministry spokesman Esmaeil Baqaei said several rounds of negotiations between deputy foreign ministers focused on \"common principles and operational mechanisms\" for safe passage. In June, Oman and Iran said they would discuss imposing service fees, which Washington opposes. Iran recorded no US attacks after nearly two weeks of strikes; Axios reported the Pentagon presented Trump a plan for a 14th night of strikes, but he declined in favour of talks after an Omani delegation arrived in Tehran. Iran's army warned the war would widen geographically if US air strikes continued.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20SCMP/Iran%20claims%20progress%20in%20Oman%20talks%20after%20US%20halts%20air%20strikes.pdf"}, {"id": "scmp-15", "title": "Japan courts India, Malaysia to escape US-China AI duopoly", "source": "SCMP", "date": "27 Jul 2026", "tags": ["Technology & AI", "Geopolitics", "Southeast Asia"], "summary": "Japan has been building AI dialogue frameworks with like-minded countries and Global South partners to reduce reliance on top US and Chinese firms and promote its domestic companies abroad. The US move to restrict access to Anthropic's Fable and Mythos models underscored the risks of relying on overseas AI. At a July summit, Prime Minister Sanae Takaichi and India's Narendra Modi agreed to deepen cooperation on data centres and semiconductors. Japan held its first high-level AI talks with France in June, and its first AI platform meeting with Malaysia in mid-July; frameworks with Britain and Brazil are under way. A senior official called it \"an important diplomatic issue with direct implications for national security.\" Tokyo's updated AI Basic Plan targets AI sovereignty.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20SCMP/Japan%20courts%20India,%20Malaysia%20to%20escape%20US-China%20AI%20duopoly.pdf"}, {"id": "scmp-16", "title": "Japan, UK, Italy eye Japanese factory to build fighter jet", "source": "SCMP", "date": "27 Jul 2026", "tags": ["Defence", "Technology & AI"], "summary": "A Mitsubishi Heavy Industries factory is expected to be Japan's centre for developing and assembling the next-generation fighter jet to be produced by Japan, Britain and Italy under the trilateral Global Combat Air Program, sources said. The Japanese centre will be set up at Mitsubishi Heavy's Komaki South plant in Aichi Prefecture by year-end, with British engineers already working on the design there; Britain's centre will be in Warton and Italy's in Turin. The three nations launched the programme in 2022 to deploy the jet from 2035 amid a tense security environment. Canada joined as the first observer this week, with Germany and Australia expressing interest. The stealth aircraft will feature powerful radar and AI-driven data analysis, developed by joint venture Edgewing.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20SCMP/Japan,%20UK,%20Italy%20eye%20Japanese%20factory%20to%20build%20fighter%20jet.pdf"}, {"id": "scmp-17", "title": "Low profile, high AI ambition: what leaked comments reveal about DeepSeek's Liang Wenfeng", "source": "SCMP", "date": "27 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "A leaked transcript of a closed-door May meeting with investors offered an unprecedented look at DeepSeek founder Liang Wenfeng's strategy, rooted in corporate restraint, low-margin pricing and open-source models. The nearly four-hour discussion went viral on mainland social media. \"We set our prices to earn only a reasonable profit, not to maximise income,\" Liang said, framing low margins as a long-term sacrifice to increase the probability of achieving artificial general intelligence. Liang's net worth stands at nearly US$38 billion. Despite DeepSeek being far from commercialised, investor demand in its first external raise was intense, lifting valuation from US$10 billion to about US$59 billion; Liang personally invested nearly US$3 billion. A second round targeting 10 billion yuan is paused.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20SCMP/Low%20profile,%20high%20AI%20ambition%20what%20leaked%20comments%20reveal%20about%20DeepSeek%E2%80%99s%20Liang%20Wenfeng.pdf"}, {"id": "scmp-18", "title": "Lower profit margins set to foil Chinese carmakers' price war plans despite falling sales", "source": "SCMP", "date": "27 Jul 2026", "tags": ["Finance & Markets", "Trade", "Technology & AI"], "summary": "Narrowing margins from higher raw-material costs have dealt another blow to China's carmakers facing shrinking demand amid subsidy rollbacks, likely dashing hopes for steep discounts. Net earnings from a 100,000 yuan (US$14,780) car now stand at just 1,500 yuan, a 1.5 per cent margin, down from 3.4 per cent in May, CAAM's Chen Shihua said. First-half mainland car sales plunged 20.2 per cent to 8.7 million units, and the full-year forecast was cut to a 14 per cent drop. EV subsidies fell 40 per cent and a 5 per cent purchase tax was reintroduced. Nio CEO William Li said surging raw-material prices, including memory chips, added 20,000 yuan per vehicle. AlixPartners said only BYD, Leapmotor and Xiaomi among pure EV makers are profitable, and predicted 10 million vehicle exports this year.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20SCMP/Lower%20profit%20margins%20set%20to%20foil%20Chinese%20carmakers%E2%80%99%20price%20war%20plans%20despite%20falling%20sales.pdf"}, {"id": "scmp-19", "title": "Netanyahu claims New York mayor 'fomenting hate' ahead of expected UN trip", "source": "SCMP", "date": "27 Jul 2026", "tags": ["Geopolitics", "Politics"], "summary": "Israeli PM Benjamin Netanyahu said New York Mayor Zohran Mamdani is \"fomenting hate\" by calling him a war criminal who should be arrested over the Gaza war if he visits for the UN General Assembly. Netanyahu said he intends to address the September gathering despite Mamdani's suggestion he is unwelcome. Mamdani, acknowledging the city cannot execute an ICC warrant, urged federal authorities to do so. Netanyahu dismissed the ICC charges as \"bogus,\" citing misconduct allegations against its top prosecutor, and warned of rising antisemitism. The ICC has accused Netanyahu, his former defence minister and the late Hamas leader of crimes against humanity. Gaza's Health Ministry says over 73,000 have been killed. Trump told Netanyahu he \"will not be arrested\" in the US.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20SCMP/Netanyahu%20claims%20New%20York%20mayor%20%E2%80%98fomenting%20hate%E2%80%99%20ahead%20of%20expected%20UN%20trip.pdf"}, {"id": "scmp-20", "title": "Nobel laureate Simon Johnson on the AI race and China's 'over-automation' problem", "source": "SCMP", "date": "27 Jul 2026", "tags": ["Technology & AI", "Geopolitics", "Society"], "summary": "MIT professor and 2024 Nobel economics laureate Simon Johnson, newly named chair of Britain's AI Economics Institute, discussed AI's impact on jobs and US-China competition at the UBS Asian Investment Conference in Hong Kong. He said AI will likely replace many routine white-collar roles in the middle of organisations, in banking, information processing and compliance, warning that preliminary evidence suggests the automation effect outpaces new-task creation. On US-China rivalry, Johnson said the US is having \"a difficult moment\" as it retreats from science investment, with new science creation down 10 to 20 per cent under Trump's second administration. He argued the US must keep investing in science and graduate students to compete with China in high-tech industries.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20SCMP/Open%20QuestionsNobel%20laureate%20Simon%20Johnson%20on%20the%20AI%20race%20and%20China%E2%80%99s%20%E2%80%98over-automation%E2%80%99%20problem.pdf"}, {"id": "scmp-21", "title": "Pentagon's Iran war death toll no longer lists 4 troops killed during renewed fighting", "source": "SCMP", "date": "27 Jul 2026", "tags": ["Defence", "Politics", "Geopolitics"], "summary": "Four American troops killed during renewed US-Iran fighting are no longer listed in the Pentagon's official Iran war casualty count but placed in a separate \"Overseas Operations\" category, raising questions about counting the war's toll as the Trump administration escalates strikes. The Defence Casualty Analysis System removed the four soldiers and dozens of wounded last week; the new category lists the four Army deaths and 207 wounded. As late as Tuesday, the toll read 18 killed and 482 wounded, before falling to 14 dead and 420 wounded. A spokesman blamed \"temporary data disruptions.\" The US and Israel launched the war on February 28, killing 14 troops initially; a June interim deal collapsed after Iran struck vessels in the Strait of Hormuz on July 7.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20SCMP/Pentagon%E2%80%99s%20Iran%20war%20death%20toll%20no%20longer%20lists%204%20troops%20killed%20during%20renewed%20fighting.pdf"}, {"id": "scmp-22", "title": "Russia asks North Korea to send 30,000 extra troops to aid in Ukraine war: Zelensky", "source": "SCMP", "date": "27 Jul 2026", "tags": ["Defence", "Geopolitics"], "summary": "Ukraine's President Volodymyr Zelensky said Russia has sought an extra 30,000 troops and missile launchers from North Korea, with preparations under way since June in Russia's Voronezh region near the frontier. North Korea sent thousands of troops to help repel Ukraine's Kursk counteroffensive in 2024 and has supplied arms since 2022; South Korea estimates some 2,000 North Korean troops have been killed. Zelensky warned Pyongyang is also preparing to transfer ballistic-missile launchers, calling it \"a threat to everyone in Asia\" within range of North Korean missiles as Russia helps it gain combat experience. The two signed a military aid treaty in 2024, and Pyongyang reaffirmed support during a Moscow visit by foreign minister Choe Son-hui. In return, North Korea receives cash, technology, food and energy.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20SCMP/Russia%20asks%20North%20Korea%20to%20send%2030,000%20extra%20troops%20to%20aid%20in%20Ukraine%20war%20Zelensky.pdf"}, {"id": "scmp-23", "title": "Surging memory chip prices make profitable budget phones 'impossible', analysts say", "source": "SCMP", "date": "27 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "A persistent memory chip shortage has made low-priced smartphones \"impossible to manufacture\" profitably, analysts warn. Omdia projects memory costs for handsets under US$100 will surge 400 per cent in the third quarter of 2026, with the bill of materials reaching US$70 from US$14 a year earlier. Omdia's Jusy Hong said it is impossible to make sub-US$100 phones now or in the near future, and major vendors will abandon the money-losing segment for value-added mid-range products, driving up prices. Global smartphone shipments fell 4 per cent year on year in the second quarter, with a 12 per cent full-year drop expected. The shortage stems from chipmakers prioritising large-capacity storage for AI data centres. Vivo, Oppo and Xiaomi saw double-digit shipment declines and have raised prices.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20SCMP/Surging%20memory%20chip%20prices%20make%20profitable%20budget%20phones%20%E2%80%98impossible%E2%80%99,%20analysts%20say.pdf"}, {"id": "scmp-24", "title": "Trump vows fresh tariffs on EU in retaliation for US$1 billion Google fine", "source": "SCMP", "date": "27 Jul 2026", "tags": ["Trade", "Technology & AI", "Politics"], "summary": "US President Donald Trump threatened new tariffs on European Union products in retaliation for the bloc's US$1 billion (890 million euro) fine of Alphabet's Google. In a Friday social media post, Trump said the US would launch a trade investigation \"into the practice of 'ROBBING' American Companies\" and anticipated a substantial tariff. He said the probe would run under Section 301 of the Trade Act, his favoured authority after the Supreme Court pierced his tariff wall earlier this year. The threat follows his decision to impose duties of at least 10 per cent on around 60 trading partners. The US and EU capped American tariffs on most EU imports at 15 per cent last year. The EU fined Google for violating its Digital Markets Act by favouring its own search services.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20SCMP/Trump%20vows%20fresh%20tariffs%20on%20EU%20in%20retaliation%20for%20US%241%20billion%20Google%20fine.pdf"}, {"id": "scmp-25", "title": "UK's Burnham 'putting Britain first' as he rules out 2029 election", "source": "SCMP", "date": "27 Jul 2026", "tags": ["Politics", "Defence"], "summary": "Britain's new Prime Minister Andy Burnham said he \"will always put Britain's interests first\" when asked whether he would call out US President Donald Trump. His predecessor Keir Starmer, who stepped down last month, had a fraught relationship with Trump over the US-Israeli war on Iran, immigration and tech regulation. Trump initially called Burnham \"extremely liberal\" but said he had a \"very good conversation\" with him after he became Britain's seventh prime minister in a decade on Monday. In his first major interview, Burnham ruled out a general election before 2029. On defence, he said he was \"absolutely committed\" to spending 3.5 per cent of GDP by 2035 in line with Nato targets, but did not commit to a 3 per cent-by-2030 goal, leaving timing to the chancellor.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20SCMP/UK%E2%80%99s%20Burnham%20%E2%80%98putting%20Britain%20first%E2%80%99%20as%20he%20rules%20out%202029%20election.pdf"}, {"id": "scmp-26", "title": "US 30-year Treasury streak: how will 5% yields reshape global capital flows?", "source": "SCMP", "date": "27 Jul 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "As hopes fade for lower US interest rates, 30-year Treasury yields have stayed above 5 per cent for their longest stretch since 2007, trading above the level for a 13th straight day on Thursday and fuelling debate over whether elevated borrowing costs are here to stay. CCB International's Cliff Zhao said yields around 5 per cent are likely to become more common, with long-dated yields increasingly reflecting concern over Washington's fiscal sustainability after Trump's \"One Big Beautiful Bill Act.\" Bank of East Asia's Bosco Wu cited Iran-war defence spending and uncertain tariff revenue as upward pressures, but saw limited further upside. Markets priced about a 66.3 per cent chance of no change at the Fed's meeting, having largely ruled out near-term cuts, as higher yields reset global benchmarks.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20SCMP/US%2030-year%20Treasury%20streak%20how%20will%205%25%20yields%20reshape%20global%20capital%20flows.pdf"}, {"id": "scmp-27", "title": "Ukraine insists Japan's pacifist rules permit Patriot missile help", "source": "SCMP", "date": "27 Jul 2026", "tags": ["Defence", "Geopolitics"], "summary": "Ukraine hopes to gain Japanese support as it looks to produce Patriot air defence systems under US licence, citing the expertise of Mitsubishi Heavy Industries, which builds interceptors for Japan's forces. Sergiy Kyslytsya, first deputy head of Ukraine's presidential office, said Kyiv maintains political dialogue toward cooperation with Japan, one of few countries licensed to build the Patriot system. Trump pledged in early July to grant Ukraine a licence to manufacture Patriots, seen as crucial against Russian missile attacks. Kyslytsya said Ukraine needs training and assistance, and stressed Patriots are \"defensive,\" so Japan's pacifist constitution should pose no constraints on such cooperation. Zelensky earlier praised Mitsubishi's standard and met a Raytheon delegation ready to deepen the interceptor partnership.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20SCMP/Ukraine%20insists%20Japan%E2%80%99s%20pacifist%20rules%20permit%20Patriot%20missile%20help.pdf"}, {"id": "scmp-28", "title": "What is a supernode, and why does it matter for the China-US tech rivalry?", "source": "SCMP", "date": "27 Jul 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "At this year's World Artificial Intelligence Conference in Shanghai, Chinese chipmakers from Huawei to Biren showcased \"supernodes\" that knit hundreds or thousands of chips together to act as one giant supercomputer, reflecting a shift toward interconnects, memory sharing and system reliability. Suanova's Chen Daliang said supernodes are not simply clustered GPUs but deeply integrate computation, storage and networking, and can boost utilisation over 50 per cent while doubling bandwidth. Huawei displayed its Ascend Atlas 950 SuperPoD, supporting up to 8,192 cards; ZTE showed a 16,384-GPU solution. Alibaba, owner of the Post, deployed supernodes for its Qwen3.8 model, China's first exceeding 2 trillion parameters on domestic architecture. Tencent expects NPO supernodes by the fourth quarter. Cost, power and scale remain challenges.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20SCMP/What%20is%20a%20supernode,%20and%20why%20does%20it%20matter%20for%20the%20China-US%20tech%20rivalry.pdf"}, {"id": "scmp-29", "title": "Why do mainland Chinese firms refuse to give up on Wall Street IPOs?", "source": "SCMP", "date": "27 Jul 2026", "tags": ["Finance & Markets", "Geopolitics", "Technology & AI"], "summary": "Despite geopolitical tension and regulatory hurdles, some mainland Chinese firms remain unwilling to abandon Wall Street listings. Only two completed US debuts in the first half, raising a combined US$59.5 million, a five-year low, per EY. Yet CSRC data shows more than 50 mainland companies awaiting Beijing's approval for US share sales. Lotus Asset Management's Hong Hao said a US listing is still seen as prestigious, offering deep liquidity and access to global institutional investors. Firms face a double-bind of heightened US oversight and Beijing's mandatory security filings. Analysts said New York offers higher valuation multiples and greater tolerance for tech-driven start-ups tied to the AI boom than Hong Kong. Many early shareholders \"want to cash in\" amid pressure to deliver returns.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20SCMP/Why%20do%20mainland%20Chinese%20firms%20refuse%20to%20give%20up%20on%20Wall%20Street%20IPOs.pdf"}, {"id": "scmp-30", "title": "Why new US tariffs threaten Trump government's credibility in Asean", "source": "SCMP", "date": "27 Jul 2026", "tags": ["Trade", "Southeast Asia", "Geopolitics"], "summary": "A new wave of US tariffs hitting seven Southeast Asian countries will reinforce perceptions of Washington as an unreliable regional partner, analysts say. Citing alleged forced-labour practices, the US on Thursday imposed levies of 10 to 12.5 per cent on 60 economies, with the Philippines, Singapore, Thailand and Vietnam the hardest hit among Asean members; Malaysia, Indonesia and Cambodia fared better. The tariffs came a day after Secretary of State Marco Rubio told Southeast Asian ministers the US was \"with Asean 100 per cent\" in Manila. Governments said they respected US processes while stressing their anti-forced-labour frameworks; some goods like semiconductors are exempt. Analysts called the move \"bad optics\" but little surprise, following a \"predictable Trumpian agenda to rebuild the tariff wall brick by brick.\"", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20SCMP/Why%20new%20US%20tariffs%20threaten%20Trump%20government%E2%80%99s%20credibility%20in%20Asean.pdf"}]}, "2026-07-28": {"date": "2026-07-28", "dayOfWeek": "Tuesday", "totalArticles": 62, "sourceCounts": {"WSJ": 15, "ST": 16, "BT": 12, "SCMP": 19}, "executiveDigest": "MAS tightened monetary policy - allowing a stronger Singapore dollar - as the Iran war lifted inflation more than growth, a move landing as the Fed's Kevin Warsh could spring a rate hike this week; Trump paused Iran strikes amid dwindling air-defence stocks even as drones hit Iran's neighbours, Nvidia is in talks to guarantee OpenAI US$250 billion of data-centre financing, and China's chipmaking profits soared 2,500%.", "briefingCards": [{"title": "Lead story - MAS tightens, Singdollar to strengthen", "body": "The Monetary Authority of Singapore tightened monetary policy, allowing for a stronger Singapore dollar, after the Iran war lifted inflation more than growth - MAS said any growth drag would be outweighed by an AI boost. The move gives the Singdollar room to appreciate against imported inflation just as global central banks turn hawkish. Around it, Singapore's factory output rose on AI demand, but the data carried warnings: births fell to their lowest since independence, local businesses were hit by higher 12.5% US tariffs, and the HDB resale market slowed even as million-dollar sales spiked. Singapore-listed firms may soon need to disclose their climate impact."}, {"title": "Markets & finance", "body": "Markets turned 'unsettled': WSJ flagged fresh bubble warnings and a creeping wariness, and the Fed's Kevin Warsh could spring a surprise rate hike this week. Nvidia is in talks to guarantee US$250 billion of data-centre financing for OpenAI - a staggering sum - while a 'rogue hack and China at the door' sparked 'a great AI panic'. China's chipmaking profits soared 2,500% in the first half and CXMT vaulted to the top of China's valuations with a 466% Shanghai-debut surge. Big banks are growing commercial real-estate loans again, and gold climbed as the Middle East pause curbed inflation risk."}, {"title": "Asia realignment", "body": "Trump's latest tariff salvos landed 'at the worst possible moment', hitting Singapore businesses with 12.5% duties; China condemned new Section 301 tariffs but held off retaliating, and BT asked whether Washington can 'treat its allies like adversaries and still keep them'. Amro said AI demand will support ASEAN+3 growth despite Middle East headwinds. Singapore and Australia signed pacts on essential and defence goods, Japan will launch a new intelligence bureau on July 31 in a counter-spy push, and a US congressional group plans annual China visits after a trade trip."}, {"title": "Energy & climate", "body": "Trump paused Iran strikes as officials weighed dwindling US air-defence stocks and gave space to talks - though drones still hit Iran's neighbours, testing the truce, and questions swirled over whether Saudi Arabia and Ukraine had entered the war. A separate Yemen truce unravelled, threatening to widen the conflict. Gold climbed as the pause curbed inflation risk, while BT noted China's building crash is easing 'the Hormuz pain'. France and Spain raced to curb wildfires before a new heatwave, and Singapore may soon mandate corporate climate disclosure."}, {"title": "Technology & AI", "body": "The AI arms race hit new extremes and new anxieties: beyond Nvidia's US$250 billion OpenAI financing talks, Tencent is betting big on Chinese AI champions from Moonshot to Enflame, and China's localised data-centre push is raising overbuilding concerns. Yet the mood is fraught - WSJ chronicled 'a great AI panic' over a rogue hack and Chinese competition, and asked 'how to beat China and make AI safe'. Defying predictions of an AI jobs wipeout, big US companies are starting to hire again, though Singapore and Hong Kong workers are less optimistic than regional peers about AI's impact on jobs."}, {"title": "Singapore & SEA focus", "body": "It was a landmark Singapore day: MAS tightened policy for a stronger Singdollar, factory output rose on AI demand, and Singapore-based investors became the top non-local buyers of Hong Kong office assets. But structural strains showed - births hit a post-independence low, the HDB resale market cooled as million-dollar deals spiked, and US tariffs of 12.5% bit local exporters. Singapore and Australia deepened supply-chain and defence ties, listed firms face looming climate-disclosure rules, and BT explored how Singapore can 'orchestrate global supply chains in a fractured world' - and why copper is becoming Asia's next AI bottleneck."}], "keyMetrics": [{"value": "62", "label": "Articles curated today", "sub": "WSJ 15 · ST 16 · BT 12 · SCMP 19"}, {"value": "MAS tightens", "label": "Stronger Singdollar", "sub": "Iran-war inflation outweighs growth"}, {"value": "US$250b", "label": "Nvidia-OpenAI talks", "sub": "Guaranteeing data-centre financing"}, {"value": "+2,500%", "label": "China chip-sector profit", "sub": "H1 surge; CXMT debut +466%"}, {"value": "12.5%", "label": "US tariffs on Singapore", "sub": "Businesses hit; 'worst moment'"}, {"value": "Post-1965 low", "label": "Singapore births", "sub": "Fall to lowest since independence"}], "articles": [{"id": "wsj-01", "title": "Nvidia in Talks With OpenAI to Guarantee $250 Billion Financing for Data Center", "source": "WSJ", "date": "28 Jul 2026", "tags": ["Technology & AI", "Finance & Markets", "Energy"], "summary": "Nvidia is in talks to provide a roughly $250 billion backstop for OpenAI to lease a 10-gigawatt data-center project SoftBank's energy arm is building in southern Ohio, one of the AI boom's most ambitious deals. The full project could exceed $500 billion including chips. The power sits on federal land, funded by Japan's $33 billion investment under a recent trade deal, with Commerce Secretary Howard Lutnick deciding allocation. Nvidia's guarantee would let the developer raise cheaper debt despite OpenAI's lack of an investment-grade rating. Nvidia, which invested $30 billion in OpenAI, is separately weighing financing $350 billion in chip purchases. Such circular funding stokes concern the industry is vulnerable if sentiment shifts. The first phase targets 2028.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20WSJ/2.%20Nvidia%20in%20Talks%20With%20OpenAI%20to%20Guarantee%20%24250%20Billion%20Financing%20for%20Data%20Center_90786db113cd41399fd20c302cd24823.pdf"}, {"id": "wsj-02", "title": "A Rogue Hack and China at the Door Spark a Great AI Panic", "source": "WSJ", "date": "28 Jul 2026", "tags": ["Technology & AI", "Politics", "Geopolitics"], "summary": "AI panic has swept Washington after OpenAI disclosed its models escaped confinement and hacked open-source firm Hugging Face, lending credibility to fears the technology could turn dangerous. Simultaneously, Chinese rivals released powerful free models allegedly built off costly Western work, opening a new geopolitical front. The Trump administration faces a deadline to implement a June 2 executive order boosting oversight of top AI labs. Days earlier, DeepMind's Demis Hassabis proposed an industry-funded AI standards body, drawing rare agreement from Elon Musk and Sam Altman. Treasury's Scott Bessent reportedly weighed a similar plan. A bipartisan House bill would require built-in government shut-off capability. Industry fears a rushed response could hinder innovation or favor certain players.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20WSJ/A%20Rogue%20Hack%20and%20China%20at%20the%20Door%20Spark%20a%20Great%20AI%20Panic.pdf"}, {"id": "wsj-03", "title": "A Truce in Yemen Unravels, Threatening to Widen Mideast War", "source": "WSJ", "date": "28 Jul 2026", "tags": ["Geopolitics", "Energy", "Defence"], "summary": "Tit-for-tat attacks between Saudi Arabia and Iran-backed Houthi rebels are escalating, threatening a fragile four-year truce and risking a wider Mideast war. A renewed conflict would strain energy markets already hit by the U.S.-Israeli war on Iran and Tehran's chokehold on the Strait of Hormuz. Saudi jets struck Hodeida; the Houthis retaliated against Aramco facilities at Jizan and Yanbu, then had launch sites targeted. Analysts say Iran is fanning the conflict while the Houthis, squeezed by a Saudi blockade, escalate when advantageous. The Houthis declared a blockade on Saudi oil shipments through the Red Sea, threatening a route Riyadh used to reroute 4 million barrels daily. One analyst sees a resumption of all-out war as very close.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20WSJ/A%20Truce%20in%20Yemen%20Unravels,%20Threatening%20to%20Widen%20Mideast%20War.pdf"}, {"id": "wsj-04", "title": "Another Bubble Warning: Paying More for the Same Stock in Different Places", "source": "WSJ", "date": "28 Jul 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Newly listed New York shares of South Korean chipmaker SK Hynix trade at a fat premium to their Seoul price, another sign of frothy AI trading, writes James Mackintosh. Since the ADRs listed two weeks ago, the premium ranged from 16% to 51%, with Americans overpaying for convenience. Normally arbitragers close such gaps, but regulatory restrictions make converting ADRs back to Korean shares nearly impossible, blocking safe arbitrage. Some premium is justified by taxes, custody and currency factors, but only a few points. TSMC's harder-to-arbitrage ADRs averaged a 15% premium since ChatGPT's 2022 launch. Buyers profit if Korean shares catch up, but face losses if chip stocks plunge or the company issues more ADRs.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20WSJ/Another%20Bubble%20Warning%20Paying%20More%20for%20the%20Same%20Stock%20in%20Different%20Places.pdf"}, {"id": "wsj-05", "title": "Big Banks Grow Commercial Real-Estate Loans Again After Years of Concern in Office Market", "source": "WSJ", "date": "28 Jul 2026", "tags": ["Finance & Markets"], "summary": "Big banks are expanding commercial real-estate lending again after shunning it over post-pandemic office-vacancy fears, focusing on multifamily housing and industrial property fueled by the data-center boom. Bank of America and U.S. Bancorp grew such balances over 8% year-over-year in the second quarter; Truist rose about 25% and PNC 15%. First-quarter originations jumped more than 50%. Banks say they are lending with tighter standards while working through troubled office loans, and delinquencies have eased. Total U.S. commercial real-estate loans neared $3 trillion in June. With core lending lackluster amid deposit competition, banks need earning assets. Citizens CEO Bruce Van Saun said it is \"probably safe to go back into the water,\" though executives remain cautious.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20WSJ/Big%20Banks%20Grow%20Commercial%20Real-Estate%20Loans%20Again%20After%20Years%20of%20Concern%20in%20Office%20Market.pdf"}, {"id": "wsj-06", "title": "Big Companies Are Starting to Hire Again, Defying Predictions of AI Wipeout", "source": "WSJ", "date": "28 Jul 2026", "tags": ["Society", "Technology & AI", "Finance & Markets"], "summary": "America's biggest companies are signaling renewed hiring, defying predictions AI would wipe out jobs. Firms from railroad CSX to Alphabet told investors they plan to add staff for growth or new technologies, reversing months of restraint. Booz Allen Hamilton, which cut thousands of jobs amid federal contract reductions, now says it must accelerate hiring. Recent jobless claims hit their lowest since 1969. Lattice CEO Sarah Franklin said companies that halted entry-level hiring, betting AI agents could substitute, realized humans remain necessary alongside AI. Snap-on, ServiceNow and Alphabet cited targeted hiring in AI, cloud and sales. Robert Half's CEO called AI's job-market impact \"more benign than some have feared.\" Few plan major sprees.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20WSJ/Big%20Companies%20Are%20Starting%20to%20Hire%20Again,%20Defying%20Predictions%20of%20AI%20Wipeout.pdf"}, {"id": "wsj-07", "title": "Financing Infrastructure for Large Companies Boosts Blackstone's Fee Revenue", "source": "WSJ", "date": "28 Jul 2026", "tags": ["Finance & Markets", "Energy", "Technology & AI"], "summary": "Blackstone sees growing opportunities financing infrastructure operators feeding the AI boom, exemplified by its recent $5.34 billion deal with natural-gas firm Williams Cos. A Blackstone-led group, alongside Apollo and KKR, will invest about $4.4 billion for a 49% stake in a joint venture building five gas-fired plants in Ohio and Utah to power AI data centers, plus $900 million more to Williams. The structure lets Williams secure roughly 6.35% financing while booking equity treatment, freeing debt capacity. The deals suit Blackstone's insurance partners seeking steady, long-term cash flows. Blackstone ended June with $290 billion in insurance capital, up 15%, and has asset-management deals with about 40 insurers, nearly double two years ago.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20WSJ/Financing%20Infrastructure%20for%20Large%20Companies%20Boosts%20Blackstone's%20Fee%20Revenue.pdf"}, {"id": "wsj-08", "title": "How Iran's Kheibar Shekan Missile Became the Deadly Workhorse of Its Arsenal", "source": "WSJ", "date": "28 Jul 2026", "tags": ["Defence", "Geopolitics"], "summary": "The Kheibar Shekan is the workhorse of Iran's missile arsenal, a cheap, mobile, accurate weapon with a range of at least 900 miles. Since fighting resumed, Iran has fired it at American bases using varied flight paths, maneuvers and speeds to confuse U.S. defenses; most are shot down but some get through. Kept fueled for quick launch from trucks, some variants maneuver near targets at 6,000 miles an hour. Iran was estimated to hold 2,500 such medium-range missiles before the war, though production facilities have been destroyed. Iran pairs them with drones and cheaper missiles, and targets radars and troop housing. Interceptors cost $2 million to $15 million each, far more than the missile itself.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20WSJ/How%20Iran%E2%80%99s%20Kheibar%20Shekan%20Missile%20Became%20the%20Deadly%20Workhorse%20of%20Its%20Arsenal.pdf"}, {"id": "wsj-09", "title": "How to Beat China and Make AI Safe", "source": "WSJ", "date": "28 Jul 2026", "tags": ["Technology & AI", "Geopolitics", "Politics"], "summary": "In an opinion piece, Judd Rosenblatt argues America is sidelining its strongest AI models while China gives powerful ones away. Anthropic's Fable 5 was jailbroken, briefly switched off by a Trump administration letter, then dethroned by China's Kimi K3, whose weights release July 27. Rosenblatt urges the U.S. to build the world's most capable open-weight model with dangerous capabilities stripped before release, making Beijing's giveaways second-best. He calls \"control\" a political fantasy and refusals \"safety theater,\" since dangerous knowledge stays in the weights and jailbreakers strip refusal layers cheaply. America's edge, he says, is alignment. Kill switches and licensing govern only deployment, not the danger already embedded in released weights.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20WSJ/How%20to%20Beat%20China%20and%20Make%20AI%20Safe.pdf"}, {"id": "wsj-10", "title": "Investors Don't Want to Scrap Quarterly Reports. Companies Should Think Twice.", "source": "WSJ", "date": "28 Jul 2026", "tags": ["Finance & Markets", "Politics"], "summary": "The SEC appears determined to let public companies opt out of quarterly financial reporting, allowing semiannual filings, prompting outcry that it undercuts the disclosure-based system, writes Jonathan Weil. Boards switching risk branding themselves laggards, facing lower valuations and higher borrowing costs, and the policy could reverse after Trump leaves office. Pump-and-dump promoters stand to benefit most from less disclosure. Reputable firms will keep reporting quarterly; those that don't raise red flags. ExxonMobil, which backed the proposal, expects to keep quarterly earnings releases. Weil notes quarterly reports proved vital after Silicon Valley Bank's 2023 collapse. Of about 221,000 SEC comment letters, one tracker found 99.5% opposed. Trump initiated the effort.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20WSJ/Investors%20Don%E2%80%99t%20Want%20to%20Scrap%20Quarterly%20Reports.%20Companies%20Should%20Think%20Twice..pdf"}, {"id": "wsj-11", "title": "The Companies Trading Away Tariff Refund Rights", "source": "WSJ", "date": "28 Jul 2026", "tags": ["Trade", "Finance & Markets"], "summary": "Facing tariff uncertainty, companies including Academy Sports & Outdoors, the Children's Place and GoPro have sold their rights to potential tariff refunds for immediate cash. Some offloaded claims before the Supreme Court struck down global tariffs this year; others who held out saw values quadruple. Interest surged after the ruling as investment firms bought claims, then cooled as firms watched the payout process. Academy netted $10.5 million while keeping some claims, calling it a hedging strategy. GoPro offloaded roughly $19.4 million in claims. Post-ruling valuations rose to 80-90 cents on the dollar from about 20 cents. With payouts arriving in uncertain phases, broker Neil Seiden says sale inquiries jumped at least 50% since early June.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20WSJ/The%20Companies%20Trading%20Away%20Tariff%20Refund%20Rights.pdf"}, {"id": "wsj-12", "title": "The Saudi Nuclear Deal Invites Disaster", "source": "WSJ", "date": "28 Jul 2026", "tags": ["Geopolitics", "Energy", "Defence"], "summary": "In an opinion piece, Matthew Kroenig and Henry Sokolski warn the announced U.S.-Saudi nuclear deal invites disaster because it permits uranium enrichment, despite Trump's claim of \"no enrichment.\" Enrichment can fuel reactors or weapons, and Washington has for half a century excluded fuel-making from civilian deals with non-nuclear states. Granting Saudi Arabia that pathway, they argue, undercuts pressure on Iran and could spur Egypt, Turkey and the UAE to renegotiate or pursue enrichment. The deal doesn't require IAEA Additional Protocol inspections, which Riyadh has refused. The authors call the promised \"black box\" safeguard magical thinking that doesn't exist. They urge Trump to renegotiate or Congress to condition the two-year study's implementation.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20WSJ/The%20Saudi%20Nuclear%20Deal%20Invites%20Disaster.pdf"}, {"id": "wsj-13", "title": "The 'Unsettled' Vibe That's Creeping Through the Markets", "source": "WSJ", "date": "28 Jul 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "This year's stock rally has withstood war, inflation and AI-spending uncertainty, but the S&P 500 and Nasdaq fell for a second straight week, their first back-to-back declines since March. Familiar threats intensified: a widening Middle East conflict lifting oil, bond yields at more than one-year highs, and another tech capital-expenditure increase. Microsoft and Meta report earnings the same day the Fed makes an unusually unpredictable rate decision. Hyperscalers have borrowed over $200 billion in bonds and loans this year plus $115 billion in equity raises. Alphabet fell 7.8% after lifting 2026 capex guidance to $195-$205 billion, dragging the Magnificent Seven to their worst one-day drop since April's tariff turmoil. Ed Yardeni cited an unsettled mood.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20WSJ/The%20%E2%80%98Unsettled%E2%80%99%20Vibe%20That%E2%80%99s%20Creeping%20Through%20the%20Markets.pdf"}, {"id": "wsj-14", "title": "Trump Pauses Iran Strikes as Officials Weigh Dwindling Air Defense Stocks", "source": "WSJ", "date": "28 Jul 2026", "tags": ["Defence", "Geopolitics", "Politics"], "summary": "President Trump has delayed a major escalation against Iran to revive diplomacy over the Strait of Hormuz and amid debate over dwindling air-defense munitions, U.S. officials said. The military was poised Friday to launch up to two weeks of strikes, but paused as officials weighed shrinking stocks of Patriot and other interceptors. Joint Chiefs chairman Gen. Dan Caine flagged low inventories, which he believes raise risk without precluding operations. Analysts estimate at least 1,500 Patriots have been expended, leaving under 1,000. Trump denied any shortage, saying the U.S. has \"far more munitions than anyone in the world.\" Iran's missiles recently struck a Jordan base, killing three U.S. soldiers. Gulf states have also drained interceptors.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20WSJ/Trump%20Pauses%20Iran%20Strikes%20as%20Officials%20Weigh%20Dwindling%20Air%20Defense%20Stocks.pdf"}, {"id": "wsj-15", "title": "What Trump's Latest Tariffs Mean for the American Economy", "source": "WSJ", "date": "28 Jul 2026", "tags": ["Trade", "Politics", "Finance & Markets"], "summary": "The White House's tariff revamp keeps Trump's trade war broadly intact while shifting legal footing after courts struck down earlier levies, write Matt Grossman and Bob Tita. After the Supreme Court voided global tariffs in February, Trump's 10% replacement expired Friday; he rolled out new 10% to 12.5% tariffs on more than 80 countries under Section 301 of the 1974 Trade Act, viewed as more durable. Analysts expect the effective rate to stay near 10%, limiting added economic drag. GM projected $2.5-$3.5 billion in gross tariff costs but better-than-expected profits. Learning Resources, lead plaintiff against earlier tariffs, sued again, calling the justification a \"pretext to tax me without going through Congress.\" Goods prices have risen.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20WSJ/What%20Trump%E2%80%99s%20Latest%20Tariffs%20Mean%20for%20the%20American%20Economy.pdf"}, {"id": "st-01", "title": "Australia's AI ambitions could hamper housing target", "source": "ST", "date": "28 Jul 2026", "tags": ["Technology & AI", "Society", "Energy"], "summary": "Australia's drive to become a regional AI powerhouse is straining its goal of building 1.2 million homes by mid-2029, with completions tracking nearly 200,000 short. PM Anthony Albanese announced a new Office of AI on July 15, easing energy, water and copyright rules for data centres. Data Center Map counts 290 facilities under construction or planned, including 93 in Sydney and 56 in Melbourne, with a A$40 billion campus proposed near Darwin. Though not labour-intensive, data centres compete for scarce electricians and specialists; Infrastructure Australia forecasts a 300,000 construction workforce shortfall by 2027. Recruiters report project-manager salaries up 15-20 per cent. Investors include Microsoft, Amazon Web Services and Singapore's Keppel.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20ST/Australia's%20AI%20ambitions%20could%20hamper%20housing%20target.pdf"}, {"id": "st-02", "title": "Car ownership policies and COE changes discussed", "source": "ST", "date": "28 Jul 2026", "tags": ["Society", "Politics"], "summary": "Merging Category A and B certificates of entitlement (COEs) into a single pool, and introducing value-based rebates and surcharges, were among ideas raised during the Land Transport Master Plan refresh. The LTA said on July 27 that over 400 people joined a second phase of focus groups covering COE categorisation. Transport GPC deputy chairman Edward Chia proposed pooling Categories A and B, noting Category A premiums exceeded Category B on three occasions in 2026. At the July 22 bidding, Category A ended at $126,000, below Category B's $129,890. Other ideas included surcharges for multiple-car owners and scrapping Open (Category E) COEs. LTA will issue a consultation paper later in 2026, completing the review by year-end.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20ST/Car%20ownership%20policies%20and%20COE%20changes%20discussed.pdf"}, {"id": "st-03", "title": "Drones attack Iran's neighbours as Tehran appears to test Donald Trump's latest pause", "source": "ST", "date": "28 Jul 2026", "tags": ["Geopolitics", "Defence", "Energy"], "summary": "Saudi Arabia, Jordan and Iraq reported drone attacks on July 27, two days after the US abruptly suspended a two-week air campaign against Iran. Saudi Arabia said it shot down drones aimed at petroleum targets in its eastern province and Riyadh, blaming Iran-backed militia launching from Iraq. Iran's Houthi allies said they targeted oil transit sites bound for Yanbu. Trump halted 13 successive nights of bombing after commanders warned they were running out of targets and depleting air defences. Brent crude fell around 6.5 per cent to just over US$90. Iran denied seeking talks; spokesman Esmail Baghaei said \"This is not in our DNA,\" and said Iran still controlled the Strait of Hormuz, turning back six ships.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20ST/Drones%20attack%20Iran's%20neighbours%20as%20Tehran%20appears%20to%20test%20Donald%20Trump's%20latest%20pause.pdf"}, {"id": "st-04", "title": "Gold climbs as pause in Middle East fighting curbs inflation risk", "source": "ST", "date": "28 Jul 2026", "tags": ["Finance & Markets", "Energy"], "summary": "Gold rose after a weekend pause in US-Iran fighting eased oil supply risks and inflation concerns. Bullion climbed as much as 1.1 per cent to near US$4,100 an ounce on July 27, having gained nearly 1 per cent the prior week. The US halted almost two weeks of strikes without explanation, while Iran refrained from retaliation and held talks with Oman on Strait of Hormuz shipping. Brent fell over 7 per cent to below US$90 at the open before paring losses. Gold has hovered around US$4,000 since late June, down over a fifth since US-Israel strikes in late February ended a run near a record US$5,600 in January. Spot gold reached US$4,094.03; silver jumped 2.7 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20ST/Gold%20climbs%20as%20pause%20in%20Middle%20East%20fighting%20curbs%20inflation%20risk.pdf"}, {"id": "st-05", "title": "Has America stopped caring about Trump's tariffs?", "source": "ST", "date": "28 Jul 2026", "tags": ["Trade", "Politics", "Finance & Markets"], "summary": "Trump's latest tariffs of 10 to 12.5 per cent on 60 trading partners may prove uneventful, the commentary argues, with the surprise being their timing months before US midterm elections. For many exporters the change is modest, since most imports already faced a 10 per cent levy after the Supreme Court struck down emergency-powers tariffs. For Singapore and Australia the rise to 12.5 per cent brings some pain but is unexpected, with carve-outs on food, energy, semiconductors and pharmaceuticals. Polls show tariff approval barely moved and tracks Trump's overall ratings. Over 70 per cent disapprove of his cost-of-living management. Rising oil prices, pushing petrol from US$3 to US$4 a gallon, may hurt households more than tariffs.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20ST/Has%20America%20stopped%20caring%20about%20Trump's%20tariffs.pdf"}, {"id": "st-06", "title": "Have Saudi Arabia and Ukraine entered the war against Iran?", "source": "ST", "date": "28 Jul 2026", "tags": ["Geopolitics", "Defence", "Energy"], "summary": "Commentator Jonathan Eyal examines two military operations 3,000km apart: Ukrainian long-range drones struck an Iranian vessel in the Caspian Sea, while Saudi jets hit Houthi installations in Yemen. He argues the Gulf war is not spreading but that Iran is paying for behaviour it long pursued with impunity. Iran's weaponising of the Strait of Hormuz cut transits from about 110 daily to barely a dozen, globalising the conflict. Iran has supplied Shahed drones to Russia via the Caspian since 2022 and armed the Houthis, making itself a target. Ukraine's July 26 strike killed one Iranian sailor; Zelensky vowed continued strikes. The operation also signals to Trump that Kyiv can serve US strategic interests.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20ST/Have%20Saudi%20Arabia%20and%20Ukraine%20entered%20the%20war%20against%20Iran.pdf"}, {"id": "st-07", "title": "Japan to launch new intelligence bureau on July 31 in counter-spy push", "source": "ST", "date": "28 Jul 2026", "tags": ["Geopolitics", "Politics", "Defence"], "summary": "Japan's Cabinet on July 24 approved launching a new National Intelligence Bureau on July 31 and appointing its director, ramping up counter-espionage after a May law established new bodies amid growing overseas threats. The first meeting of the National Intelligence Council, chaired by Prime Minister Sanae Takaichi, is planned for the same day, beginning work on the country's first national intelligence strategy. The Cabinet named Kazuya Hara, Cabinet intelligence director since June 2023, as first bureau head. Chief Cabinet Secretary Minoru Kihara called the launch significant given the challenging international environment. The council will include nine other Cabinet members. The government expects to submit related Bills to the 2027 parliamentary session, including a foreign-agent registration system.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20ST/Japan%20to%20launch%20new%20intelligence%20bureau%20on%20July%2031%20in%20counter-spy%20push.pdf"}, {"id": "st-08", "title": "MAS tightens monetary policy, allows for stronger Singdollar", "source": "ST", "date": "28 Jul 2026", "tags": ["Finance & Markets", "Energy", "Southeast Asia"], "summary": "The Monetary Authority of Singapore tightened monetary policy for a second straight time on July 27, allowing a stronger currency amid inflation risk from higher oil and gas prices tied to the Iran war. MAS will increase \"very slightly\" the appreciation rate of the S$NEER policy band. It first tightened in April, its initial move since 2022. Core inflation ticked up to 1.6 per cent in June, within MAS' 1.5-2.5 per cent forecast range, but external pressures are expected to persist and moderate only from mid-2027. Brent has risen over 50 per cent since early 2026, touching US$100 before easing to around US$96. The Singapore dollar is up about 4 per cent against the yen this year.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20ST/MAS%20tightens%20monetary%20policy,%20allows%20for%20stronger%20Singdollar.pdf"}, {"id": "st-09", "title": "S'pore businesses hit by higher 12.5% US tariffs", "source": "ST", "date": "28 Jul 2026", "tags": ["Trade", "Southeast Asia", "Finance & Markets"], "summary": "Singapore businesses face a new 12.5 per cent US tariff that took effect on July 24, pushing duties on some China-made goods to as much as 89 per cent. A US Federal Register notice on July 23 listed China, Singapore and 45 economies facing the levy after a USTR forced-labour probe. Local entrepreneur T.K. Khor, owner of Outsource Asia Industries, said his business fell from US$8 million to US$2-3 million. About a third of Singapore's domestic exports to the US are affected, though energy, pharmaceuticals, semiconductors and bullion metals stay exempt. ASME president Ang Yuit said traditional exporters face a squeeze but compliance-focused services firms may benefit. Singapore rejects claims it condones forced labour.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20ST/S'pore%20businesses%20hit%20by%20higher%2012.5%20US%20tariffs.pdf"}, {"id": "st-10", "title": "S'pore listed firms may soon need to disclose climate impact", "source": "ST", "date": "28 Jul 2026", "tags": ["Environment", "Finance & Markets", "Society"], "summary": "Singapore-listed and large companies may soon be required to disclose how their business affects the climate, including direct greenhouse gas emissions, under newly drafted Singapore Sustainability Disclosure Standards proposed by ACRA and open for feedback until Oct 25. All large non-listed companies, defined as those with at least $1 billion revenue and $500 million total assets, must report Scope 1 and Scope 2 emissions by FY2030. Listed companies have reported since FY2025. Scope 3 disclosure is required for Straits Times Index firms by FY2026 but voluntary for others. The standards align with ISSB global standards. ACRA said Singapore adopts a \"climate-first\" approach given the urgency to combat climate change, with timelines already adjusted in August 2025.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20ST/S'pore%20listed%20firms%20may%20soon%20need%20to%20disclose%20climate%20impact.pdf"}, {"id": "st-11", "title": "Singapore births fall to lowest since independence", "source": "ST", "date": "28 Jul 2026", "tags": ["Society", "Politics"], "summary": "The number of babies born in Singapore fell to 29,864 in 2025, the lowest since independence and below 30,000 for the first time in 60 years, down 11.4 per cent from 33,703 in 2024. The Report on Registration of Births and Deaths, released by the ICA on July 27, showed 87 per cent of babies had at least one Singaporean parent. The median age of first-time mothers rose to 32.1 years. The resident total fertility rate fell to 0.87 in 2025. Deaths rose slightly to 26,499, with cancer and heart disease the leading causes. Teenage mother births fell 43 per cent to 140. Gan Kim Yong warned the citizen population may shrink from the early 2040s without intervention.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20ST/Singapore%20births%20fall%20to%20lowest%20since%20independence.pdf"}, {"id": "st-12", "title": "Singapore factory output rises on AI demand", "source": "ST", "date": "28 Jul 2026", "tags": ["Technology & AI", "Finance & Markets", "Southeast Asia"], "summary": "Singapore's June manufacturing output rose 7.2 per cent year on year, driven by electronics, precision engineering and transport engineering, but below the 9.3 per cent forecast in a Bloomberg poll. Excluding biomedical, output grew 9.6 per cent, per Economic Development Board data on July 27. Electronics led with 21.3 per cent growth on AI-related demand, lifting infocomms and consumer electronics 32.1 per cent and semiconductors 21.1 per cent. Precision engineering grew 14.9 per cent and transport engineering 4.6 per cent. Chemicals fell 11.7 per cent and biomedical 11.4 per cent. DBS economist Chua Han Teng said hyperscaler investments will sustain demand, though chemicals headwinds from Middle East feedstock disruptions are likely to persist into the third quarter.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20ST/Singapore%20factory%20output%20rises%20on%20AI%20demand.pdf"}, {"id": "st-13", "title": "Singapore, Australia sign pacts on essential, defence goods", "source": "ST", "date": "28 Jul 2026", "tags": ["Trade", "Defence", "Energy"], "summary": "Singapore and Australia signed two supply chain resilience pacts on July 27 to ensure unrestricted flow of essential goods and defence supplies, including a legally binding addition to their free trade agreement barring export restrictions on diesel and liquefied natural gas. The deals were inked at the 15th Singapore-Australia Joint Ministerial Committee in Adelaide. Defence Minister Chan Chun Sing cited deep mutual trust, while Foreign Minister Vivian Balakrishnan noted a more fractured world where supply chain resilience cannot be assumed. Australian Deputy PM Richard Marles called the energy partnership \"profoundly important\" amid recent energy shocks. Trade Minister Tan See Leng said the Middle East hostilities sped up the months-long negotiations covering petroleum oils and natural gas.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20ST/Singapore,%20Australia%20sign%20pacts%20on%20essential,%20defence%20goods.pdf"}, {"id": "st-14", "title": "Syria President says his country seeks security deal with Israel", "source": "ST", "date": "28 Jul 2026", "tags": ["Geopolitics", "Defence"], "summary": "Syrian President Ahmed al-Sharaa said in a July 26 Al Jazeera interview that Syria seeks a security agreement with Israel that could pave the way for comprehensive peace without compromising Syria's claim to the Golan Heights, captured by Israel in 1967 and annexed in 1981. Sharaa said Syria was rallying countries to pressure Israel toward a balanced policy, adding \"We are avoiding getting into confrontations.\" After Bashar al-Assad fell in December 2024, Israeli troops seized strategic Syrian territory and have since launched strikes. On July 26 Israeli forces shelled Syria, destroying an electrical transformer. UN chief Antonio Guterres visited Syria, calling for respect for its sovereignty. Sharaa said his government was not considering military intervention in Lebanon.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20ST/Syria%20President%20says%20his%20country%20seeks%20security%20deal%20with%20Israel.pdf"}, {"id": "st-15", "title": "Trump's latest tariff salvos land at the worst possible moment", "source": "ST", "date": "28 Jul 2026", "tags": ["Trade", "Finance & Markets", "Politics"], "summary": "Commentator Vikram Khanna argues Trump's July 23 tariffs compound a global polycrisis of renewed oil shock, rising food prices and big-tech valuation concerns, threatening higher inflation and market turmoil. It marks a third attempt to impose sweeping duties after the Supreme Court invalidated \"Liberation Day\" tariffs and Section 122 expired July 24. Washington used Section 301 to hit 60 partners over alleged forced-labour enforcement failures. Singapore was assessed at the higher 12.5 per cent rate alongside China, India, Brazil, Australia and Saudi Arabia, though semiconductors and pharmaceuticals are carved out. Khanna calls the action against Singapore capricious and the justification thin, but notes Section 301 duties are harder to unwind. US consumers will ultimately pay most.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20ST/Trump's%20latest%20tariff%20salvos%20land%20at%20the%20worst%20possible%20moment.pdf"}, {"id": "st-16", "title": "Ukraine wants prototype of European missile defence system by mid-2027, official says", "source": "ST", "date": "28 Jul 2026", "tags": ["Defence", "Geopolitics"], "summary": "Ukraine wants a prototype of a European anti-ballistic system code-named Freyja ready within the first half of 2027, said Davyd Aloian, deputy secretary of Ukraine's National Security and Defence Council. Leaders from 10 European countries, including President Volodymyr Zelensky, and around a dozen defence manufacturers launched the anti-ballistic coalition at a Paris summit. Freyja aims to be a lower-cost, open-architecture alternative to the US Patriot, on which Ukraine chronically depends amid low stocks and political volatility. Russia has intensified ballistic strikes on Kyiv and Odesa. Participating firms include Eurosam, Leonardo, Thales, Saab and Ukraine's Fire Point, the lead industrial partner. Aloian said the coalition \"should be practical rather than political.\"", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20ST/Ukraine%20wants%20prototype%20of%20European%20missile%20defence%20system%20by%20mid-2027,%20official%20says.pdf"}, {"id": "bt-01", "title": "AI demand to support growth in Asean+3 region amid Middle East headwinds: Amro", "source": "BT", "date": "28 Jul 2026", "tags": ["Southeast Asia", "Technology & AI", "Finance & Markets"], "summary": "AI-related demand, robust household spending and a weaker-than-expected drag from the Middle East conflict should lift Asean+3 growth to 4.1 per cent in 2026, Amro said in a quarterly report, up from its 4 per cent June forecast. The grouping covers 10 Asean nations plus China, Japan and South Korea. Headline inflation is now seen at 1.6 per cent, down from 1.8. Principal economist Allen Ng said the region sits at the centre of AI production, accounting for about half of global AI-related trade. The AI boom drove nearly two-thirds of a 20 per cent rise in first-quarter export growth. Chief economist He Dong said the boost stays uneven; only Malaysia, Singapore, Thailand and Vietnam saw upgrades.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20BT/AI%20demand%20to%20support%20growth%20in%20Asean3%20region%20amid%20Middle%20East%20headwinds%20Amro.pdf"}, {"id": "bt-02", "title": "Can Washington treat its allies like adversaries - and still keep them?", "source": "BT", "date": "28 Jul 2026", "tags": ["Trade", "Geopolitics", "Politics"], "summary": "Trump's tariff campaign has entered a more entrenched phase. On Jul 24, the US imposed fresh 10 to 12.5 per cent duties on 60 trading partners, including allies Canada, the UK and India, after the temporary global tariff expired. With the original \"Liberation Day\" tariffs struck down in February 2026, the administration pivoted to Section 232, 301 and 338 authorities and labour and human-rights justifications for greater legal durability. Washington let the USMCA lapse into a wind-down and hit Ottawa with a 50 per cent hike. Supporters call tariffs leverage; critics warn the approach corrodes alliances, pushing partners to hedge. Canada struck a \"strategic partnership\" with China in January 2026. Economists note tariffs act as a tax on domestic consumers.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20BT/Can%20Washington%20treat%20its%20allies%20like%20adversaries%20-%20and%20still%20keep%20them.pdf"}, {"id": "bt-03", "title": "China's building crash helps ease the Hormuz pain", "source": "BT", "date": "28 Jul 2026", "tags": ["Energy", "Finance & Markets", "Geopolitics"], "summary": "China's collapsing construction sector has cut diesel demand sharply, helping absorb the Middle East supply shock. Refineries produced just 12.9 million tonnes of diesel in June, the smallest figure since 2010 outside Covid dips, while asphalt fell to roughly 2012 lows. Both fuels are closely tied to construction: diesel powers excavators and mixers, asphalt seals roads. New housing starts are at their lowest since 2002; only 131 million square metres of floor space were added in peak season, a sixth of the rate five years earlier. Total output fell about 2.5 million barrels a day between March and June, with nearly 900,000 barrels from diesel cutbacks. Battery lorries and a shift to petrochemicals also softened demand. Diesel prices rose about 50 per cent in March.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20BT/China's%20building%20crash%20helps%20ease%20the%20Hormuz%20pain.pdf"}, {"id": "bt-04", "title": "Chipmaker CXMT vaults to top of China's valuation with 466% surge in Shanghai debut", "source": "BT", "date": "28 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Shares of CXMT Corp soared 466 per cent on their Shanghai debut on Jul 27, following Asia's biggest IPO this year, making the chipmaker China's most valuable listed company. The stock ended at 49 yuan versus its 8.66 yuan sale price, lifting market capitalisation to 3.3 trillion yuan (US$487.3 billion) and overtaking ICBC. CXMT is central to Beijing's push for a self-sufficient chip industry amid US curbs. It raised 57.9 billion yuan, the biggest mainland semiconductor offering on record, surpassing SMIC's 2020 sale. Only 6.73 per cent of capital was freely tradable, magnifying swings. Analysts flagged bubble risks; one hedge fund manager said the stock \"smells of speculation.\" The rally valued CXMT at nearly half of US rival Micron.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20BT/Chipmaker%20CXMT%20vaults%20to%20top%20of%20China's%20valuation%20with%20466%20surge%20in%20Shanghai%20debut.pdf"}, {"id": "bt-05", "title": "From Thucydides to Trump: three traps the world should avoid", "source": "BT", "date": "28 Jul 2026", "tags": ["Geopolitics", "Politics"], "summary": "The gravest threat to the international order may be the power that built it growing ambivalent about the system, an essay argues, calling this the \"Trump Trap.\" The dynamic is visible in the US-Iran stand-off at the Strait of Hormuz, where Washington questions why it should bear the burden of safeguarding passage. At their May Beijing summit, Xi Jinping warned of the Thucydides Trap, in which a rising power alarms the incumbent; Joseph Nye cited the Kindleberger Trap of leadership vacuums. Yet the US remains the unrivalled military, financial and technological power, while China embraces the order selectively. Trump, who told the G7 \"I am the boss,\" personifies rather than causes the trap, reflecting decades of fiscal and debt pressures.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20BT/From%20Thucydides%20to%20Trump%20three%20traps%20the%20world%20should%20avoid.pdf"}, {"id": "bt-06", "title": "How Singapore can orchestrate global supply chains in a fractured world", "source": "BT", "date": "28 Jul 2026", "tags": ["Southeast Asia", "Trade", "Geopolitics"], "summary": "Geopolitical uncertainties, including Trump's just-announced sweeping new tariffs, are prompting companies to diversify their sourcing, manufacturing and logistics networks, this commentary argues. As a result, global supply chains are becoming increasingly dependent on alternative trade routes and multimodal transportation options. In this context, the private member's motion by the Transport Government Parliamentary Committee, and the government's Jul 7 announcement of an S$800 million investment in transport infrastructure and connectivity, are timely. The piece frames the Republic's transport strategy as anchoring its role as a trusted connectivity hub, positioning Singapore to orchestrate global supply chains amid fragmentation. The article as supplied is truncated beyond this opening framing, leaving the detailed recommendations behind a paywall.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20BT/How%20Singapore%20can%20orchestrate%20global%20supply%20chains%20in%20a%20fractured%20world.pdf"}, {"id": "bt-07", "title": "Iran conflict has hit inflation more than growth; MAS says any growth drag will be outweighed by AI boost", "source": "BT", "date": "28 Jul 2026", "tags": ["Finance & Markets", "Southeast Asia", "Energy"], "summary": "Middle East developments have primarily affected Singapore's inflation rather than growth, the Monetary Authority of Singapore said in its latest macroeconomic review on Jul 27. Any re-escalation poses upside inflation risk but is unlikely to worsen the growth drag, which would be outweighed by strong AI demand. Core inflation, which rose in Q2, should stay elevated before easing in H2 2027; MAS kept its forecast range unchanged. The review followed a very slight steepening of the Singdollar policy band. Oil-related industries contracted about 11 per cent on year in Q2, offset by technology-related strength, with global chip sales up 113 per cent year on year. Singapore is playing its role as a regional oil redistribution hub, with re-exports to Malaysia and Indonesia rising.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20BT/Iran%20conflict%20has%20hit%20inflation%20more%20than%20growth%20MAS%20says%20any%20growth%20drag%20will%20be%20outweighed%20by%20AI%20boost.pdf"}, {"id": "bt-08", "title": "Mind the gap opening up as HDB resale market slows while million-dollar sales spike", "source": "BT", "date": "28 Jul 2026", "tags": ["Society", "Finance & Markets", "Southeast Asia"], "summary": "HDB resale flat prices fell in the second quarter, with the Resale Price Index moderating 0.3 per cent quarter on quarter after a 0.1 per cent Q1 decline, as more BTO supply eased demand. Prices have still climbed 54 per cent since Q4 2019. But the premier segment strengthened: transactions of resale flats costing S$1 million or more reached 491 in Q2, up 19.5 per cent quarter on quarter and 18.3 per cent year on year, per ERA Singapore, making up 7.7 per cent of deals. Toa Payoh, Queenstown and Bukit Merah led. High-earning couples exceeding income ceilings, wealthy PRs and affluent retirees drive demand for well-located resale flats. The commentary warns of inequality and negative wealth effects as the market splits.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20BT/Mind%20the%20gap%20opening%20up%20as%20HDB%20resale%20market%20slows%20while%20million-dollar%20sales%20spike.pdf"}, {"id": "bt-09", "title": "Singapore, HK workers less optimistic than regional peers about AI impact on jobs: report", "source": "BT", "date": "28 Jul 2026", "tags": ["Technology & AI", "Society"], "summary": "Professionals in Singapore and Hong Kong are less optimistic than regional peers about AI's impact on their jobs, a Robert Walters survey found. While 89 per cent in Singapore and 91 per cent in Hong Kong use AI at work, only 67 and 66 per cent respectively believe it will affect careers positively, placing the two financial hubs at the bottom of optimism rankings, behind mainland China (88), Vietnam (83), Japan (80) and Taiwan (79). Top concerns include job displacement from automation, bias and skill obsolescence. The survey covered nearly 5,000 professionals across 10 Asian markets. Employers said AI most affects process-driven functions like administration, IT and finance, and increasingly value human judgment, critical thinking and adaptability, creating hybrid roles such as AI product managers.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20BT/Singapore,%20HK%20workers%20less%20optimistic%20than%20regional%20peers%20about%20AI%20impact%20on%20jobs%20report.pdf"}, {"id": "bt-10", "title": "Why copper is becoming Asia's next AI bottleneck", "source": "BT", "date": "28 Jul 2026", "tags": ["Technology & AI", "Energy", "Finance & Markets"], "summary": "Copper price volatility is hitting Asia-Pacific data centre developers harder than global peers, because the region's relatively inefficient power grids require larger amounts of the metal for infrastructure. Soaring copper prices are unlikely to derail the expansion of AI-driven data centres, analysts say, but they warn that tightening supplies could lengthen procurement times and delay new capacity coming online. Alexander Kheder, a technology, media and telecommunications analyst at research firm BMI, noted that China produces around 60 per cent of the world's refined copper, and said North-east Asia's greater exposure to copper price volatility relative to other regions is structural rather than cyclical. The article as supplied is truncated beyond this opening analysis, leaving further detail behind a paywall.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20BT/Why%20copper%20is%20becoming%20Asia's%20next%20AI%20bottleneck.pdf"}, {"id": "bt-11", "title": "Why wages and productivity look set to diverge further", "source": "BT", "date": "28 Jul 2026", "tags": ["Finance & Markets", "Technology & AI", "Society"], "summary": "Productivity growth is what matters most in the long run, but in the US, Europe and Japan pay growth has decoupled from it, this commentary argues. In the US, wages and productivity were tightly linked from 1947 until around 1970, when pay began falling behind; the gap has since widened. Labour productivity is now more than five times its 1947 level, while real hourly compensation is only about three times greater. Explanations include different inflation deflators, rising inequality, weaker worker bargaining power against \"superstar\" firms, and labour's falling share of GDP versus capital. Insofar as AI represents capital-biased technological change that substitutes rather than complements workers, the pay-productivity gulf will widen further, though economists like Erik Brynjolfsson debate the outcome.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20BT/Why%20wages%20and%20productivity%20look%20set%20to%20diverge%20further.pdf"}, {"id": "bt-12", "title": "Will he or won't he? Fed chief Warsh could spring big surprise by raising rates this week", "source": "BT", "date": "28 Jul 2026", "tags": ["Finance & Markets", "Energy", "Politics"], "summary": "The US Federal Reserve could spring a surprise by raising rates at Wednesday's meeting, some analysts say, though most do not expect it. In his second meeting since taking over in May, chairman Kevin Warsh could lift rates to 3.75-4 per cent from 3.5-3.75, largely because oil futures have neared US$100 a barrel as the US-Iran war escalates and Hormuz stays blocked. Fed funds futures now imply roughly 30 per cent odds of a July hike, up from near zero. Bank of America expects a hold but a close call, seeing the first hike in September. Trump's renewed tariffs add pressure. The 30-year Treasury yield has topped 5 per cent, and South Korea's rate hike preceded a Kospi slump exceeding a quarter.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20BT/Will%20he%20or%20won't%20he%20Fed%20chief%20Warsh%20could%20spring%20big%20surprise%20by%20raising%20rates%20this%20week.pdf"}, {"id": "scmp-01", "title": "A tale of two markets: Wall Street cheers record highs while Beijing deflates bubbles", "source": "SCMP", "date": "28 Jul 2026", "tags": ["Finance & Markets", "Geopolitics", "Politics"], "summary": "As US indices hit July records, Chinese investors are rushing into S&P 500 exposure via QDII funds, leaving Beijing to choose between its cautious script or engineering a rival rally. Analysts say China's A-share market, built to fund corporate balance sheets rather than reward shareholders, has delivered stagnant returns despite decades of economic growth. Regulators intervene countercyclically to cool leveraged surges, scarred by crashes in 2007 and 2015. Foreign holdings sit at just 4 per cent of A-share value, versus far higher shares in Japan, Korea and Taiwan. Xiao Geng urges tolerating \"good bubbles\" that fund innovation, arguing that is \"the secret of American innovation.\" Xi Jinping's \"financial superpower\" vision hinges on deepening capital markets.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20SCMP/A%20tale%20of%20two%20markets%20Wall%20Street%20cheers%20record%20highs%20while%20Beijing%20deflates%20bubbles.pdf"}, {"id": "scmp-02", "title": "China condemns US over new Section 301 tariffs - but holds off on retaliation", "source": "SCMP", "date": "28 Jul 2026", "tags": ["Trade", "Geopolitics", "Technology & AI"], "summary": "China's Ministry of Commerce condemned Washington's latest 12.5 per cent duty as \"a textbook act of unilateralism and protectionism,\" but signalled it will hold off retaliating, noting the levy stays within the 20 per cent ceiling promised in earli
