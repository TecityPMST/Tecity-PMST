<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tecity News Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#fbfbfa; --surface:#ffffff; --surface-2:#f6f6f4;
    --text:#16181d; --muted:#6c727e; --faint:#9aa0ab;
    --border:#ececec; --border-2:#e2e2e0; --ink:#16181d;
    --hover:#f4f4f2; --ring:rgba(20,23,28,.10);
    --shadow:0 1px 2px rgba(16,18,22,.04), 0 8px 24px rgba(16,18,22,.05);
    --shadow-sm:0 1px 2px rgba(16,18,22,.05);
    --wsj:#D85A30; --st:#1D9E75; --bt:#378ADD; --scmp:#D4537E;
    --maxw:1120px;
  }
  html[data-theme="dark"]{
    --bg:#0c0d10; --surface:#15171c; --surface-2:#1b1e25;
    --text:#eceef2; --muted:#9aa1ad; --faint:#6b7280;
    --border:#252830; --border-2:#2d313b; --ink:#eceef2;
    --hover:#1c1f26; --ring:rgba(255,255,255,.12);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-feature-settings:"cv02","cv03","cv04","ss01";
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    line-height:1.6;
  }
  ::selection{background:rgba(120,120,120,.18)}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 28px}
  .num{font-variant-numeric:tabular-nums}
  .eyebrow{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); font-weight:600}

  /* header */
  header.top{position:sticky; top:0; z-index:20; backdrop-filter:saturate(180%) blur(14px);
    background:color-mix(in srgb, var(--bg) 82%, transparent); border-bottom:1px solid var(--border)}
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 28px; max-width:var(--maxw); margin:0 auto}
  .brand{display:flex; flex-direction:column; gap:2px; min-width:0}
  .brand .title{font-size:16px; font-weight:600; letter-spacing:-.01em}
  .brand .meta{font-size:12.5px; color:var(--muted)}
  .controls{display:flex; align-items:center; gap:10px}
  select.date{appearance:none; font:inherit; font-size:13px; font-weight:500; color:var(--text);
    background:var(--surface); border:1px solid var(--border-2); border-radius:10px; padding:8px 32px 8px 12px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%239aa0ab' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat; background-position:right 10px center; cursor:pointer; transition:border-color .15s}
  select.date:hover{border-color:var(--ink)}
  .toggle{display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; cursor:pointer;
    background:var(--surface); border:1px solid var(--border-2); border-radius:10px; color:var(--muted); transition:.15s}
  .toggle:hover{color:var(--text); border-color:var(--ink)}
  .toggle svg{width:17px; height:17px}

  /* hero digest */
  .hero{padding:48px 0 14px}
  .hero .eyebrow{margin-bottom:16px}
  .digest{font-size:clamp(25px,3.6vw,37px); line-height:1.22; font-weight:400; letter-spacing:-.02em;
    max-width:none; color:var(--text)}
  .digest .lead{max-width:none}

  /* metrics */
  .metrics{display:grid; grid-template-columns:repeat(6,1fr); gap:14px; padding:30px 0 8px}
  .metric{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px 18px 16px; box-shadow:var(--shadow-sm); transition:.18s}
  .metric:hover{box-shadow:var(--shadow); transform:translateY(-2px)}
  .metric .v{font-size:27px; font-weight:600; letter-spacing:-.03em; line-height:1.05}
  .metric .l{font-size:12.5px; font-weight:500; margin-top:8px}
  .metric .s{font-size:11.5px; color:var(--muted); margin-top:3px; line-height:1.4}

  /* tabs */
  .tabs{display:flex; gap:26px; margin:34px 0 0; border-bottom:1px solid var(--border)}
  .tab{position:relative; cursor:pointer; padding:0 0 14px; font-size:14px; font-weight:500; color:var(--muted); transition:color .15s}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--text)}
  .tab.active::after{content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--ink); border-radius:2px}

  .section{padding:30px 0 0}
  .section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px}
  .section-head h2{margin:0; font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); font-weight:600}
  .section-head .hint{font-size:12.5px; color:var(--muted)}

  /* lead briefing card */
  .lead-card{background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:30px 32px; box-shadow:var(--shadow); margin-bottom:16px}
  .lead-card .k{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); font-weight:600; margin-bottom:12px}
  .lead-card h3{margin:0 0 12px; font-size:23px; font-weight:600; letter-spacing:-.02em; line-height:1.2}
  .lead-card p{margin:0; font-size:15.5px; color:var(--text); line-height:1.65; max-width:none; column-width:34ch; column-gap:48px; column-fill:balance}

  /* briefing grid */
  .cards{display:grid; grid-template-columns:repeat(2,1fr); gap:16px}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:24px 26px; box-shadow:var(--shadow-sm); transition:.18s}
  .card:hover{box-shadow:var(--shadow); transform:translateY(-2px)}
  .card h3{margin:0 0 10px; font-size:16.5px; font-weight:600; letter-spacing:-.01em; line-height:1.3}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.62}

  /* coverage / bars */
  .split{display:grid; grid-template-columns:1.5fr 1fr; gap:16px; align-items:start}
  .panel{background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:24px 26px; box-shadow:var(--shadow-sm)}
  .bar-row{display:flex; align-items:center; gap:14px; margin:14px 0}
  .bar-row .name{width:42px; font-size:12.5px; font-weight:600; letter-spacing:.02em}
  .bar-track{flex:1; height:8px; background:var(--surface-2); border-radius:99px; overflow:hidden}
  .bar-fill{height:100%; border-radius:99px}
  .bar-row .cnt{width:26px; text-align:right; font-size:12.5px; color:var(--muted); font-weight:600}

  /* article */
  .feed-controls{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:4px 0 18px}
  .search{flex:1 1 260px; position:relative}
  .search svg{position:absolute; left:13px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--faint)}
  .search input{width:100%; font:inherit; font-size:14px; color:var(--text); background:var(--surface);
    border:1px solid var(--border-2); border-radius:12px; padding:11px 14px 11px 38px; outline:none; transition:.15s}
  .search input:focus{border-color:var(--ink); box-shadow:0 0 0 4px var(--ring)}
  .pills{display:flex; flex-wrap:wrap; gap:8px}
  .pill{cursor:pointer; font-size:12.5px; font-weight:500; color:var(--muted); background:var(--surface);
    border:1px solid var(--border-2); border-radius:99px; padding:7px 13px; user-select:none; transition:.14s; line-height:1}
  .pill:hover{border-color:var(--ink); color:var(--text)}
  .pill.active{color:#fff; border-color:transparent}
  .tagrow{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .count{font-size:12.5px; color:var(--muted); margin-bottom:14px}

  .article{padding:22px 4px; border-bottom:1px solid var(--border)}
  .article:first-child{padding-top:6px}
  .article .head{display:flex; align-items:center; gap:12px; margin-bottom:9px; flex-wrap:wrap}
  .src{display:inline-flex; align-items:center; gap:7px; font-size:11px; font-weight:600; letter-spacing:.04em; color:var(--muted)}
  .src .dot{width:8px; height:8px; border-radius:99px}
  .article h4{margin:0; font-size:16.5px; font-weight:600; letter-spacing:-.01em; line-height:1.32; flex:1; min-width:240px}
  .article h4 a{color:inherit; text-decoration:none; transition:color .15s}
  .article h4 a:hover{color:var(--wsj-hover, var(--muted))}
  .article .date{font-size:12px; color:var(--faint); white-space:nowrap}
  .article p{margin:6px 0 12px; font-size:14.5px; color:var(--muted); line-height:1.62; max-width:88ch}
  .tags{display:flex; flex-wrap:wrap; gap:7px}
  .tag{font-size:11px; font-weight:600; letter-spacing:.01em; border-radius:99px; padding:3px 10px; border:1px solid transparent}

  .empty{text-align:center; color:var(--muted); padding:60px 0; font-size:14px}
  footer{padding:48px 0 60px; color:var(--faint); font-size:12px; text-align:center}

  @media(max-width:980px){
    .metrics{grid-template-columns:repeat(3,1fr)}
    .cards{grid-template-columns:1fr}
    .split{grid-template-columns:1fr}
  }
  @media(max-width:560px){
    .wrap,.topbar{padding-left:18px; padding-right:18px}
    .metrics{grid-template-columns:repeat(2,1fr)}
    .hero{padding-top:34px}
  }
</style>
</head>

<script>window.ALL_DAYS = {"2026-07-27": {"date": "2026-07-27", "dayOfWeek": "Monday", "totalArticles": 70, "sourceCounts": {"WSJ": 14, "ST": 11, "BT": 15, "SCMP": 30}, "executiveDigest": "Corporate America has suddenly reined in AI spending - a sharp shift after months of records - even as WSJ noted the biggest stock selloff since Black Monday; oil's surge past US$100 rekindled an inflation threat that left global bonds reeling and pushed US 30-year yields toward 5%, while the US and Iran paused strikes after Gulf states hit Iran, and Singapore weighed the risks of an AI-led growth spurt turning into a headwind.", "briefingCards": [{"title": "Lead story - Corporate America reins in AI spending", "body": "In a notable turn, WSJ reported 'Corporate America has suddenly decided to stop blowing money on AI' - a sharp reversal after months of record capex - and framed the moment against the biggest stock selloff since Black Monday, though IBM's CEO said he isn't worried. SAP shares jumped on cloud-business resilience and Verizon is chasing AI-boom opportunities, but the mood has cooled. China, meanwhile, is in an 'all-out push' to catch up with American AI chips, Silicon Valley is divided over whether to restrict Chinese AI as the gap narrows, and DeepSeek suspended fundraising after its founder's alleged US-China AI comments went viral."}, {"title": "Markets & finance", "body": "Oil's surge past US$100 rekindled an inflation threat, leaving global bonds reeling; SCMP asked how 5% US 30-year Treasury yields will reshape global capital flows, and WSJ weighed whether the Fed is about to hike. The global economy had picked up just before the fresh energy hit. China's CXMT is poised to become the biggest China-listed firm on its trading debut amid a memory-chip frenzy, US blockbuster IPOs are minting new millionaires, and prediction markets heated up as Robinhood and Crypto.com held talks. In Singapore, GIC's new course drew scrutiny - 'should it throw caution to the wind?' - amid a structurally changed world."}, {"title": "Asia realignment", "body": "Trump's trade wars are 'back - despite the Supreme Court', with fresh tariff threats on the EU over tech fines (a US$1 billion Google penalty) and new duties that SCMP warns threaten Washington's credibility in ASEAN. Japan is courting India and Malaysia to escape a US-China AI 'duopoly', and Japan, the UK and Italy eye a Japanese factory to build their next fighter jet. China is positioning for unique access to Indonesian minerals, cracking down on offshore trusts of the wealthy, and showing 'growing AI caution' as its tech firms snubbed US Congress advisers. Russia asked North Korea for 30,000 more troops for Ukraine, Zelensky said."}, {"title": "Energy & climate", "body": "The Iran war kept reshaping energy: it spread to the Red and Caspian seas even as the Gulf went quiet and the US paused strikes, with Bahrain and Kuwait warplanes striking Iran in rare retaliation and a Houthi blockade of Saudi trade threatening a wider conflict. Chevron is scrambling to keep its Kazakh assets out of the Russia-Ukraine war. Europe's heat waves fuelled a rash of wildfires - even melting French resistance to air-conditioning - while CATL posted record quarterly profits on the green-energy boom and a Chinese energy giant's new South Korea plant intensified a power crunch."}, {"title": "Technology & AI", "body": "Beneath the capex pullback, the US-China contest sharpened: WSJ went 'inside China's all-out push' to catch up on AI chips, SCMP explained why 'supernodes' matter for the rivalry, and surging memory-chip prices are making profitable budget phones 'impossible'. Apple's biggest-ever leak - in India - may prompt firms to rethink China relocations. A Nobel laureate, Simon Johnson, warned of China's 'over-automation' problem, and leaked comments shed light on the low profile but high ambition of DeepSeek's Liang Wenfeng, whose firm paused fundraising amid the furore."}, {"title": "Singapore & SEA focus", "body": "Singapore weighed the double edge of its AI-led growth - ST asked whether it 'could turn into a headwind some day' - while Ong Ye Kung argued the 'longevity economy' must improve lives, not drive unnecessary healthcare spending. Property momentum built: the S$950 million Tan Boon Liat sale added to en-bloc momentum, Dunearn House sold 56% of 380 units at an average S$3,140 psf, and investors are homing in on Singapore co-living within Apac's US$13.8 billion 'living' boom. Temasek is eyeing defence deals as Europe rearms, GIC is charting a new course, and BT urged Temasek to state its position on a rumoured CapitaLand-Mapletree merger."}], "keyMetrics": [{"value": "70", "label": "Articles curated today", "sub": "WSJ 14 · ST 11 · BT 15 · SCMP 30"}, {"value": "Capex pullback", "label": "Corporate AI spend", "sub": "WSJ: firms stop 'blowing money'"}, {"value": "~5%", "label": "US 30-year yields", "sub": "Oil surge; global bonds reeling"}, {"value": "US$100+", "label": "Oil price", "sub": "Rekindles inflation threat"}, {"value": "Strikes paused", "label": "US-Iran", "sub": "Gulf quiet; Red/Caspian spread"}, {"value": "S$3,140 psf", "label": "Dunearn House launch", "sub": "56% of 380 units sold"}], "articles": [{"id": "wsj-01", "title": "Bahrain, Kuwait Warplanes Struck Iran in Rare Gulf Retaliation", "source": "WSJ", "date": "27 Jul 2026", "tags": ["Geopolitics", "Defence", "Energy"], "summary": "Bahrain and Kuwait secretly sent jets to strike drone- and missile-storage depots inside Iran early this month, their first direct retaliation against Tehran, people familiar said. The UAE provided intelligence and defensive air cover, signaling budding Arab cooperation. Iran had focused retaliatory strikes on the two Gulf states, both hosting US bases, targeting a Kuwaiti power plant and desalination facility. Kuwait's US ambassador denied any participation. The article details Gulf Arab governments caught between a war they didn't want and an aggrieved Iran, absorbing the bulk of the punishment. Now in its fifth month, the conflict has crippled oil exports via Iran's chokehold on the Strait of Hormuz, with a new Red Sea threat emerging.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20WSJ/Bahrain,%20Kuwait%20Warplanes%20Struck%20Iran%20in%20Rare%20Gulf%20Retaliation.pdf"}, {"id": "wsj-02", "title": "Chevron Is Trying to Keep Its Kazakh Assets Out of the Russia-Ukraine War", "source": "WSJ", "date": "27 Jul 2026", "tags": ["Energy", "Geopolitics", "Finance & Markets"], "summary": "Chevron CEO Mike Wirth lobbied Trump officials to shield the company's Kazakh operations from Ukraine-Russia crossfire. A Ukrainian drone attack hit four tankers near Novorossiysk, a hub and terminus for the Caspian Pipeline Consortium, which carries 2% of daily global oil supply and is 15%-owned by Chevron. Crude loadings were restricted, forcing Kazakhstan to curb output given limited storage. After industry talks, the administration warned Ukraine against attacking non-Russian vessels, calling CPC a vital alternative to Russian energy. Chevron holds a 50% stake in the Tengiz field, about 12% of its global production and projected to generate $6 billion free cash flow. It spent $48 billion expanding Tengiz and seeks a post-2033 extension.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20WSJ/Chevron%20Is%20Trying%20to%20Keep%20Its%20Kazakh%20Assets%20Out%20of%20the%20Russia-Ukraine%20War.pdf"}, {"id": "wsj-03", "title": "Corporate America Has Suddenly Decided to Stop Blowing Money on AI", "source": "WSJ", "date": "27 Jul 2026", "tags": ["Technology & AI", "Finance & Markets", "Geopolitics"], "summary": "Companies fed up with ballooning AI costs are adopting lower-priced models, including cheaper open-weight ones built in China, shopping a la carte alongside OpenAI and Anthropic products. Cursor, a startup SpaceX is buying for $60 billion, advises clients on \"tokenomics\"; a field CTO likened using top models for mundane tasks to driving a Lamborghini for milk. The shift is also geopolitical: US models are closed, while Chinese models like DeepSeek, MiniMax and Moonshot are cheaper and downloadable. Anthropic and OpenAI accuse them of ripping off technology, and some officials weigh bans. Nvidia, Microsoft and Palantir signed a letter backing open models. Vendors are offering aggressive free-usage deals to retain customers amid what one CEO called a bloodbath.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20WSJ/Corporate%20America%20Has%20Suddenly%20Decided%20to%20Stop%20Blowing%20Money%20on%20AI.pdf"}, {"id": "wsj-04", "title": "Europe's Heat Waves Fuel Rash of Wildfires", "source": "WSJ", "date": "27 Jul 2026", "tags": ["Environment", "Society"], "summary": "A summer of repeated heat waves has left southwestern Europe's vegetation dangerously dry, fueling wildfires that forced tens of thousands to evacuate. France ordered 40,000 people out of the Cap Ferret peninsula near Bordeaux, where at least 50 homes were destroyed; a nearby Biscarrosse fire displaced 23,000. Spain declared its first-ever national wildfire emergency, evacuating over 19,000 as two blazes southwest of Madrid merged. More than 628,606 acres have burned across Europe this year. Macron sought reinforcements including Croatian Canadair aircraft and Czech and Slovak Black Hawks. Spain has lost roughly 284,000 acres, nearly five times last year's pace, and an earlier Andalusia fire killed 13. Fontainebleau forest saw the Paris region's first water-bomber deployment.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20WSJ/Europe%E2%80%99s%20Heat%20Waves%20Fuel%20Rash%20of%20Wildfires.pdf"}, {"id": "wsj-05", "title": "Global Economy Picked Up Before Fresh Energy Hit", "source": "WSJ", "date": "27 Jul 2026", "tags": ["Finance & Markets", "Energy", "Geopolitics"], "summary": "Business activity in the US, Europe and parts of Asia picked up in July, S&P Global surveys showed, indicating moderate growth before the fresh energy-price surge from renewed US-Iran hostilities takes a toll. The US PMI rose to 53.6 from 51.9, an eight-month high, partly aided by the World Cup. The eurozone PMI climbed to 51.9, a five-month high, with German activity returning to growth and eurozone new orders rising fastest since April 2023. Japan and Australia accelerated; India slowed. Economist Chris Williamson warned Middle East events raise downside risks. The conflict's impact has been milder than feared as other producers boosted supply and reserves were drawn, but the IMF says buffers are depleting. The ECB flagged weaker growth risks.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20WSJ/Global%20Economy%20Picked%20Up%20Before%20Fresh%20Energy%20Hit.pdf"}, {"id": "wsj-06", "title": "Inside China's All-Out Push to Catch Up With American AI Chips", "source": "WSJ", "date": "27 Jul 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "China is mounting a state-driven effort to close the AI-chip gap with the US after Washington restricted access to cutting-edge chips and tools. Vice Premier Ding Xuexiang, with Xi Jinping's blessing, revived the all-out approach used for China's 1960s atomic-bomb program, forming committees across top firms and labs and warning that resisting domestic chips made users traitors. Huawei says it cut China's dependence on foreign AI chips from 90% in 2021 to under 60% by 2025, aiming for 25% within five years, and claims workarounds for near-state-of-the-art silicon without leading-edge machinery. In software, Moonshot's Kimi K3 nearly matches top US models. But China still lags in hardware, with capacity shortages forcing Moonshot to pause premium sign-ups after launch.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20WSJ/Inside%20China%E2%80%99s%20All-Out%20Push%20to%20Catch%20Up%20With%20American%20AI%20Chips.pdf"}, {"id": "wsj-07", "title": "Is the Fed About to Hike Rates?", "source": "WSJ", "date": "27 Jul 2026", "tags": ["Finance & Markets", "Politics", "Energy"], "summary": "Next week's Fed decision is unusually \"live\" after months of predictability. Futures now imply about a one-third chance of a quarter-point hike, up from near zero in May, as oil prices jumped a third this month, reigniting inflation fears. New Chair Kevin Warsh has scrapped forward guidance, pledging to follow the data, and told Congress he'd have no tolerance for inflation, now above target over five years. At the June meeting, nine of 18 participants foresaw at least one hike this year. Still, the columnist bets the Fed stands pat: commodity-driven inflation is hard to fight, market turbulence and rising bond yields are already tightening conditions, and hiking before midterms would enrage the White House. Odds of any 2026 hike topped 90%.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20WSJ/Is%20the%20Fed%20About%20to%20Hike%20Rates.pdf"}, {"id": "wsj-08", "title": "Prediction-Markets Race Heats Up as Robinhood and Crypto.com Hold Talks", "source": "WSJ", "date": "27 Jul 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Robinhood is in talks with digital-currency exchange Crypto.com to expand its prediction-markets foothold, people familiar said. The deal would add Crypto.com's business to Robinhood's hub, letting users place yes-or-no bets from the crypto exchange. Robinhood has relied on Kalshi and others for contracts, but the partnership is turning into direct competition as both push onto each other's turf. Existing partners include Interactive Brokers' ForecastEx and Rothera, a Susquehanna joint venture. Crypto.com launched its OG platform in February and struck a deal with Trump's media business for Truth Social, not yet live. Kalshi leads the surging US market, seeing $27 billion in World Cup volumes versus $1 billion for the Super Bowl, and plans to expand tradable assets. No deal is guaranteed.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20WSJ/Prediction-Markets%20Race%20Heats%20Up%20as%20Robinhood%20and%20Crypto.com%20Hold%20Talks.pdf"}, {"id": "wsj-09", "title": "SAP Shares Jump After Strong Quarter Reassures Investors of Cloud Business Resilience", "source": "WSJ", "date": "27 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "SAP shares rose more than 6% in Frankfurt after the German software group posted strong second-quarter revenue, easing fears that AI could disrupt its cloud business. Its closely watched current cloud backlog grew 26% at constant currencies, above the roughly 24% expected, prompting Jefferies and Deutsche Bank to signal accelerating growth. Total revenue rose 11% to 9.88 billion euros ($11.24 billion), with cloud revenue up 24% to 6.28 billion euros. The stock remains down about 35% since January amid the software \"SaaSpocalypse\" selloff. Net profit reached 1.83 billion euros, though operating profit of 2.74 billion euros and a 27.8% margin missed forecasts. SAP slightly trimmed full-year operating-profit guidance, citing Dremio and Prior Labs acquisitions, while maintaining cloud-revenue targets.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20WSJ/SAP%20Shares%20Jump%20After%20Strong%20Quarter%20Reassures%20Investors%20of%20Cloud%20Business%20Resilience.pdf"}, {"id": "wsj-10", "title": "The U.S. and Iran Are Stuck in a Cycle of Military Escalation", "source": "WSJ", "date": "27 Jul 2026", "tags": ["Geopolitics", "Defence", "Energy"], "summary": "The US-Iran conflict is escalating even as both sides hit the limits of military force. Iranian-allied Houthis began striking ships at a key Red Sea chokepoint, helping push oil above $100 a barrel for the first time in two months. The US intensified its bombing of Iran in the most intense fighting since Trump and Israel began strikes in late February, threatening a suspected nuclear site at Pickaxe Mountain and Iran's power plants. Secretary Rubio warned \"the price will continue to get higher every single night,\" describing US policy as \"a head for an eye.\" Analysts say neither side can achieve decisive advantage, risking months more war. Houthis declared a maritime blockade of Saudi Arabia; a Saudi vessel was struck in the Red Sea.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20WSJ/The%20U.S.%20and%20Iran%20Are%20Stuck%20in%20a%20Cycle%20of%20Military%20Escalation.pdf"}, {"id": "wsj-11", "title": "Trump Threatens New Tariffs on EU Over Tech Fines", "source": "WSJ", "date": "27 Jul 2026", "tags": ["Trade", "Politics", "Technology & AI"], "summary": "President Trump threatened additional tariffs on European Union goods after the bloc fined US tech firms, including a $1 billion penalty on Alphabet's Google for breaching digital competition rules. On Truth Social, Trump said he would open a Section 301 investigation into the EU \"robbing\" American companies, promising a substantial tariff soon. The probe, run by the US Trade Representative, allows tariffs on countries discriminating against US firms; Trump used the same provision this week for 10% to 12.5% forced-labor tariffs replacing levies the Supreme Court struck down in February. Section 301 tariffs are seen as more legally durable but require lengthy investigation. Most EU goods face 10% now, autos 15%; new tariffs could stack. A prior 15% cap deal left digital regulation unresolved.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20WSJ/Trump%20Threatens%20New%20Tariffs%20on%20EU%20Over%20Tech%20Fines.pdf"}, {"id": "wsj-12", "title": "Trump's Trade Wars Are Back-Despite the Supreme Court", "source": "WSJ", "date": "27 Jul 2026", "tags": ["Trade", "Politics", "Geopolitics"], "summary": "After the Supreme Court struck down Trump's main tariff weapon in February, he rerouted to forgotten trade statutes, treating rulings as road maps not roadblocks. This week he invoked Section 338 of the 1930 Smoot-Hawley law for the first time in its near-century existence to hit Canada with 50% tariffs. In two weeks he announced 25% on Brazil, 50% on Canada, up to 200% on generic drugs, and 10% to 12.5% across as many as 60 partners. The Court had rejected his use of the 1977 IEEPA, saying it didn't authorize tariffs. Now using Sections 122, 232 and 301, Evercore ISI estimates Trump will still raise $240 billion to $260 billion yearly, just 20% below pre-ruling levels. One expert called Section 338 \"possibly the new Ieepa.\"", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20WSJ/Trump%E2%80%99s%20Trade%20Wars%20Are%20Back-Despite%20the%20Supreme%20Court.pdf"}, {"id": "wsj-13", "title": "Verizon Seeks Opportunities From AI Boom as Turnaround Continues", "source": "WSJ", "date": "27 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Verizon beat Wall Street on postpaid phone additions, gaining a net 184,000 in the second quarter, and is pursuing new revenue from the AI infrastructure boom as its turnaround continues. Companywide revenue slipped 0.7% to $34.25 billion, below the $35.16 billion estimate, hurt by a nearly 20% drop in equipment revenue as customers hold devices longer. CEO Dan Schulman announced a Google deal worth over $1 billion to use Verizon's dark fiber connecting data centers, with more partner deals expected. Verizon is retrofitting facilities into data centers, with AI revenue starting next year. Quarterly profit fell to $3.95 billion, or 92 cents a share, on $1.8 billion in special items. Adjusted EPS of $1.30 beat estimates; Schulman's contract was extended to 2028.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20WSJ/Verizon%20Seeks%20Opportunities%20From%20AI%20Boom%20as%20Turnaround%20Continues.pdf"}, {"id": "wsj-14", "title": "Why IBM's CEO Isn't Worried About the Biggest Stock Selloff Since Black Monday", "source": "WSJ", "date": "27 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "IBM stock has languished since July 14, when a disappointing pre-announcement revealed delayed orders as customers moderated spending amid rising AI-driven IT costs. CEO Arvind Krishna says the AI boom is only a temporary disruption and expects most delayed deals to close within six months. IBM remains dominant infrastructure: 70% by value of all transactions flow through the mainframe daily, and it reported $4.8 billion in free cash flow in the first half of 2026, while Alphabet turned cash-flow negative for the first time. IBM designs its own processors, including the Power architecture and Tellum II. For every dollar spent on mainframes, customers spend $3 to $4 more across IBM. The company employs nearly 300,000 and eyes quantum computing as its next trillion-dollar business.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20WSJ/Why%20IBM%E2%80%99s%20CEO%20Isn%E2%80%99t%20Worried%20About%20the%20Biggest%20Stock%20Selloff%20Since%20Black%20Monday.pdf"}, {"id": "st-01", "title": "AI is driving GDP growth, but could it turn into a headwind some day?", "source": "ST", "date": "27 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Singapore's economy is running hot, with GDP expanding 5.7 per cent year on year in Q2 2026 after 6.3 per cent in Q1, far above the 2-4 per cent forecast, and the Straits Times Index hitting a record. The commentary attributes this to the global AI investment cycle, which has turbocharged semiconductor and electronics exports: electronics NODX surged 105.1 per cent in June. But growth is narrow and \"K-shaped\", with traditional services and SMEs squeezed by higher fuel and freight costs from the Iran war. It warns the AI tailwind could reverse if hyperscaler spending is cut, risking widening inequality, and urges policy to spread AI adoption and diversify beyond a few superstar firms.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20ST/AI%20is%20driving%20GDP%20growth,%20but%20could%20it%20turn%20into%20a%20headwind%20some%20day.pdf"}, {"id": "st-02", "title": "Burnham offers sweeteners, hopeful vibes in first week as British PM", "source": "ST", "date": "27 Jul 2026", "tags": ["Politics", "Geopolitics"], "summary": "British Prime Minister Andy Burnham, 56, used his first week to break from predecessor Keir Starmer, centring his agenda on the cost of living. He announced removing a tax on household electricity bills, a planned cap on most bus fares in England and a 20 per cent business rates cut for pubs, clubs and live music venues, framing them as a \"re-prioritisation\" of spending. Arriving in Downing Street on July 20, he spoke without notes or lectern and opened a No. 10 North office in Manchester to boost devolution. Critics question his fiscal discipline and mandate, since Labour MPs installed him without an election. Reform UK's Nigel Farage demands a national vote; the US-Iran conflict and soaring energy prices threaten his plans.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20ST/Burnham%20offers%20sweeteners,%20hopeful%20vibes%20in%20first%20week%20as%20British%20PM.pdf"}, {"id": "st-03", "title": "China bets on local consumers to power its AI ambitions", "source": "ST", "date": "27 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "On July 13, China published its first Five-Year Plan devoted entirely to consumption, aiming to rebalance an economy long driven by exports and investment. A key concept is \"AI + Consumption\", casting artificial intelligence as an engine of consumer spending by promoting AI phones, wearables, robots, smart homes and connected vehicles. The strategy tries to absorb overcapacity in EVs, batteries and semiconductors, where price wars and \"involution\" have squeezed margins and triggered foreign tariffs. It extends a trade-in subsidy programme running since 2024. Analysts warn it could deepen involution and note China's problem is weak consumer confidence, not lack of goods, driven by falling property prices, job insecurity and a thin safety net. Xi Jinping also proposed a World AI Cooperation Organization.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20ST/China%20bets%20on%20local%20consumers%20to%20power%20its%20AI%20ambitions.pdf"}, {"id": "st-04", "title": "French aversion to air-conditioning melts as homes sizzle", "source": "ST", "date": "27 Jul 2026", "tags": ["Environment", "Society"], "summary": "As a European heatwave leaves millions sweltering, more French people are abandoning their traditional aversion to air-conditioning, with units flying off shelves. France recorded its hottest day since measurements began in 1947 on June 24. A survey found eight in 10 French people view air-conditioning as environmentally unfriendly, but experts note nuclear power supplied almost 70 per cent of France's electricity in 2025, limiting the climate impact. Specialists warn AC can locally raise urban temperatures, citing a Lyon simulation showing a 1.75 deg C rise, and stress better building design and insulation. The issue has become political ahead of the 2027 presidential election, with Marine Le Pen backing \"air-conditioning for all\" and Jean-Luc Melenchon calling it a false solution.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20ST/French%20aversion%20to%20air-conditioning%20melts%20as%20homes%20sizzle.pdf"}, {"id": "st-05", "title": "Iran war spreads to Red and Caspian seas, Gulf quiet as US halts strikes", "source": "ST", "date": "27 Jul 2026", "tags": ["Geopolitics", "Defence", "Energy"], "summary": "The Iran war broadened over the weekend despite a US pause in strikes after 13 nights of escalation. Yemen's Iran-aligned Houthis attacked Saudi Aramco oil installations at Jizan and Yanbu along the Red Sea, threatening a second major shipping route beyond the blockaded Strait of Hormuz and risking reigniting Yemen's civil war. The US said its naval blockade \"remains in full effect\". The New York Times reported Trump backed away from ramping up attacks amid concerns over depleting munitions stockpiles, alienating Gulf allies and hitting energy supplies; Vance and General Dan Caine flagged stockpile worries. Iran accused Ukraine of striking an Iranian vessel in the Caspian Sea, killing one sailor. Saudi-led forces struck Houthi sites in Marib and al-Jawf.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20ST/Iran%20war%20spreads%20to%20Red%20and%20Caspian%20seas,%20Gulf%20quiet%20as%20US%20halts%20strikes.pdf"}, {"id": "st-06", "title": "Private markets for retail investors in Singapore", "source": "ST", "date": "27 Jul 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Retail investors in Singapore cannot directly buy shares of private firms like ByteDance, Carousell or Stripe, with the closest option being Temasek-linked Astrea private equity bonds listed on SGX. Options are widening: MAS proposed the Long-term Investment Fund framework in March 2025 to let retail investors access private market funds under strict guard rails. Experts explain private assets are illiquid and once required millions; ADDX has cut minimums to $5,000-$10,000, making them viable for those with $100,000-$200,000 in assets. Semi-liquid products now allow periodic withdrawals. Lawyers and executives stress education, clear risk disclosures and a food-label-style Product Highlights Sheet, cautioning investors must accept that private holdings cannot be sold at will before committing capital.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20ST/Private%20markets%20for%20retail%20investors%20in%20Singapore.pdf"}, {"id": "st-07", "title": "Schools must help students build discernment, problem-solving skills in AI age: Jasmin Lau", "source": "ST", "date": "27 Jul 2026", "tags": ["Society", "Technology & AI"], "summary": "With AI making information readily accessible, students need to develop discernment, problem-solving and communication skills key to future workplaces, said Minister of State for Education Jasmin Lau. Speaking on July 26 at a session organised by Lianhe Zaobao and supported by MOE, she said the education system must examine how to cultivate and assess such qualities and give students more chances to practise them. Her biggest concern is the gradual loss of human communication as children and parents increasingly turn to AI for answers. About 80 members of the public discussed holistic development and reduced grade emphasis. Participants suggested banning tuition for pre-primary children. MOE's Sng Chern Wei said schools should let children experience failure safely. Lau becomes Acting Manpower Minister on July 27.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20ST/Schools%20must%20help%20students%20build%20discernment,%20problem-solving%20skills%20in%20AI%20age%20Jasmin%20Lau.pdf"}, {"id": "st-08", "title": "Tan Boon Liat's $950m sale adds to en bloc momentum as sellers turn realistic on pricing", "source": "ST", "date": "27 Jul 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "The $950 million collective sale of the freehold Tan Boon Liat building in Outram signals a selective recovery in Singapore's en bloc market, following Loyang Valley's $880 million sale in April and the $810 million Thomson View deal in 2025. All three closed below initial reserve prices, sharing exceptional scale, strong locations and re-priced reserves. Analysts say pricing realism is now decisive, with owners of ageing leasehold sites facing rising maintenance costs, lease decay and competition from government land sales. Rezoning Tan Boon Liat to residential with commercial and raising its plot ratio from 3.1 to 4.9 boosted its appeal, while its Business 1 status avoids ABSD. International Plaza will hold an EGM on Aug 1 for a second sale attempt.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20ST/Tan%20Boon%20Liat's%20950m%20sale%20adds%20to%20en%20bloc%20momentum%20as%20sellers%20turn%20realistic%20on%20pricing.pdf"}, {"id": "st-09", "title": "Temasek eyes defence deals as Europe boosts military spending, executive says", "source": "ST", "date": "27 Jul 2026", "tags": ["Defence", "Finance & Markets"], "summary": "Singapore's investment company Temasek is looking to increase defence investments as the war in Ukraine prompts European governments to boost military spending, said Nagi Hamiyeh, president of global investments and head of Europe, Middle East and Africa. Defence forms part of a broader push into EMEA, which accounts for just 12 per cent of Temasek's $518 billion portfolio; it has invested about 13 billion euros there over two years and aims for up to 17 billion euros by 2029. Temasek will mainly target dual-use technologies rather than pure defence makers, adhering to ESG guidelines that exclude biological and chemical warfare. It focuses on larger deals of 500 million to 1 billion euros. Around 73 per cent of its exposure is outside Singapore.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20ST/Temasek%20eyes%20defence%20deals%20as%20Europe%20boosts%20military%20spending,%20executive%20says.pdf"}, {"id": "st-10", "title": "Trump faces midterm reckoning with 100 days to US vote", "source": "ST", "date": "27 Jul 2026", "tags": ["Politics", "Geopolitics"], "summary": "One hundred days before the US midterm elections, President Donald Trump's Republicans face polling pointing to the loss of the House and a tough fight for the Senate. Decision Desk HQ gives Democrats a 59 per cent chance of winning the House, forecasting a 224-211 majority, while narrowly favouring Republicans to hold the Senate through a 50-50 split. A Democratic House would enable investigations, subpoenas and a possible third impeachment drive. Voters are unhappy over living costs and the Iran war, with petrol above US$4 a gallon. Republicans tout border enforcement, tax cuts and favourable redistricting. Trump's approval sits near record lows at 36 per cent; analysts note approval under 40 typically means losing chambers.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20ST/Trump%20faces%20midterm%20reckoning%20with%20100%20days%20to%20US%20vote.pdf"}, {"id": "st-11", "title": "US strikes Iran amid 'existential war' threat", "source": "ST", "date": "27 Jul 2026", "tags": ["Geopolitics", "Defence", "Energy"], "summary": "The US launched two waves of attacks on Iran's coastal defences and missile sites on July 15 after re-imposing a naval blockade, while Iran struck US military sites in neighbouring countries in what it called an \"existential war\" with America. The escalation followed the collapse of a fragile truce, with Iran again threatening regional energy exports after closing the Strait of Hormuz, which carried about a fifth of global oil and gas shipments. Brent crude closed at a one-month high of US$84.95. US Central Command said it hit command centres, air defences and missile capabilities, including at Bandar Abbas. Iran's Revolutionary Guard said it targeted US bases in Bahrain, Kuwait and Jordan. July US attacks killed 35 people; Trump said Iran wants to settle.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20ST/US%20strikes%20Iran%20amid%20'existential%20war'%20threat.pdf"}, {"id": "bt-01", "title": "'Asia will be the growth engine': FedEx's Salil Chari on riding the AI boom", "source": "BT", "date": "27 Jul 2026", "tags": ["Technology & AI", "Trade", "Southeast Asia"], "summary": "FedEx Asia-Pacific regional president Salil Chari told The Business Times he wants to seize artificial intelligence-driven growth opportunities across the region while helping customers navigate the new norms of trade amid geopolitical instability. Speaking at FedEx's Singapore office, he said \"Asia will be the growth engine for FedEx\", and made realising that his goal. Global logistics is in a volatile era, but Chari says this has not derailed his focus on regional high-value trade. He frames the disruption as opportunity, positioning FedEx to support businesses adapting to shifting supply chains and evolving trade rules. His strategy centres on capturing high-value cross-border flows in a fast-growing but unstable Asia-Pacific market as the AI boom accelerates.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20BT/'Asia%20will%20be%20the%20growth%20engine'%20FedEx's%20Salil%20Chari%20on%20riding%20the%20AI%20boom.pdf"}, {"id": "bt-02", "title": "A practical pathway to AI-led productivity", "source": "BT", "date": "27 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Singapore Budget 2026 renewed a push to embed AI across the economy, establishing a National AI Council and expanding support through the National AI Impact Programme. Against uneven revenue visibility and tighter capital discipline, the writer, SGX's market strategist, argues structured, staged approaches matter more. IMDA's Open Innovation Platform (OIP) links defined business challenges to deployable solutions with measurable KPIs over a 12-to-16-week cycle. Since 2018 it has mobilised more than 450 challenge statements, offering around S$25 million total, roughly S$55,000 per challenge, and provides access to over 21,000 solvers across domains including AI, robotics and analytics. Companies fund development via prize funding, testing feasibility before scaling. OIP offers SGX-listed firms a disciplined, de-risked pathway to adopt AI and digital solutions.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20BT/A%20practical%20pathway%20to%20AI-led%20productivity.pdf"}, {"id": "bt-03", "title": "CXMT poised to become biggest China-listed firm on trading debut amid memory chip investment frenzy", "source": "BT", "date": "27 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Investor excitement over memory chips has set outsize expectations for CXMT's Shanghai debut on Monday (Jul 27). The DRAM maker, formerly ChangXin Memory Technologies, raised 66.6 billion yuan (US$9.8 billion) in a near-record IPO and is poised to become the biggest China-listed firm on day one. Its retail tranche was 212 times oversubscribed. As the world's fourth-largest DRAM maker, CXMT is central to Beijing's drive to cut reliance on foreign chips, including high-bandwidth memory for AI data centres. The IPO priced at 2.4 times book, a discount to global peers. Shadow-market futures imply a valuation near US$428 billion. A roughly 330 per cent gain would overtake ICBC as China's most valuable listed firm. Analysts see \"enormous room for growth\".", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20BT/CXMT%20poised%20to%20become%20biggest%20China-listed%20firm%20on%20trading%20debut%20amid%20memory%20chip%20investment%20frenzy.pdf"}, {"id": "bt-04", "title": "DeepSeek suspends fundraising after founder's alleged US-China AI comments go viral: sources", "source": "BT", "date": "27 Jul 2026", "tags": ["Technology & AI", "Finance & Markets", "Geopolitics"], "summary": "DeepSeek has told prospective investors it is suspending its second fundraising round, sources said, days after comments attributed to founder Liang Wenfeng about US-China AI competition went viral. Chinese media reported Liang discussed reliance on Nvidia chips and China's persistent lag in AI sophistication versus the US. The suspension reportedly stemmed from his frustration over leaks from his first round, which closed in June raising US$7 billion. DeepSeek had targeted at least 10 billion yuan (US$1.5 billion) more at a premoney valuation of at least 480 billion yuan, up from a roughly US$50 billion first-round tag. Backers included Tencent and CATL. The startup is preparing a possible 2026 IPO. Liang, now worth US$36 billion, is the richest AI-model creator, per Bloomberg.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20BT/DeepSeek%20suspends%20fundraising%20after%20founder's%20alleged%20US-China%20AI%20comments%20go%20viral%20sources.pdf"}, {"id": "bt-05", "title": "Dunearn House sells 56% of 380 units at average of S$3,140 psf at launch", "source": "BT", "date": "27 Jul 2026", "tags": ["Finance & Markets", "Society"], "summary": "Dunearn House, a Frasers Property-led development in Bukit Timah's upcoming Turf City precinct, sold 56 per cent of its 380 units at its weekend launch, with 212 units going at an average S$3,140 per square foot and all three-bedroom units sold out. Prices started at S$1.475 million for two-bedders. The project is a consortium of Frasers Property, CSC Land and Sekisui House; about 86 per cent of buyers were Singaporeans. Analysts were divided: PropNex's Kelvin Fong cited first-mover appeal in the new estate, while Nicholas Mak of Mogul.sg said take-up lagged first-half launches averaging 75.8 per cent and River Modern's 90 per cent. Mak warned of buyer fatigue after 39 projects and 17,917 units launched in 18 months.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20BT/Dunearn%20House%20sells%2056%20of%20380%20units%20at%20average%20of%20S3,140%20psf%20at%20launch.pdf"}, {"id": "bt-06", "title": "GIC is charting a new course, but should it throw caution to the wind?", "source": "BT", "date": "27 Jul 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "As GIC released FY2025/2026 results, its annualised 20-year real return slipped to 3.4 per cent, down 0.4 point and the lowest in six years, while its five-year nominal return of 3.6 per cent was the worst since FY2012/2013. Beyond the numbers, Singapore's sovereign wealth fund is overhauling its playbook. From April 2026 it adopts a \"strategic portfolio\" grouping capital, estimated at US$936 billion, into three economic-function categories: growth equities, income-generating fixed income and inflation-shielding real assets, erasing public-private walls and rigid quotas. GIC will add US$30 billion to hedge funds over three years to diversify from AI-concentration risk. Critics note it resembles GIC's 1980s four-bucket structure, but leadership warns of \"elevated uncertainty\". The piece questions whether new flexibility invites reckless return-chasing.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20BT/GIC%20is%20charting%20a%20new%20course,%20but%20should%20it%20throw%20caution%20to%20the%20wind.pdf"}, {"id": "bt-07", "title": "GIC's portfolio resilience in a structurally changed world", "source": "BT", "date": "27 Jul 2026", "tags": ["Finance & Markets", "Geopolitics", "Energy"], "summary": "In an adapted Letter from the CEO in GIC's 2025/2026 report, the chief executive argues the Middle East conflict and Strait of Hormuz disruptions show how fast the global environment shifts, with oil prices spiking and inflation risks returning. GIC frames geopolitical risk as structural, not episodic, producing enduring country risk premiums and wider divergence between winners and losers. It responds with three principles: diversification, granularity and agility. The fund has broadened exposure to durable cash flows, intellectual property, music royalties, gold and inflation-resilient real assets. On AI, it invests granularly across enablers, monetisers and adopters, backing hyperscalers, advanced semiconductors and data-centre power. On energy, it favours regulated networks and grid efficiency. Marking 45 years, its mandate to preserve Singapore's reserves is unchanged.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20BT/GIC's%20portfolio%20resilience%20in%20a%20structurally%20changed%20world.pdf"}, {"id": "bt-08", "title": "Global bonds reeling as oil surge rekindles inflation threat", "source": "BT", "date": "27 Jul 2026", "tags": ["Finance & Markets", "Energy"], "summary": "Global bonds were battered last week as resurgent energy prices rekindled inflation fears, hitting investors who bet this year's rout had ended. UK gilt yields logged their longest run of closes above 5 per cent in nearly two decades; Germany's 10-year yield hit its highest since 2011 and Japan's 40-year jumped 10 basis points Friday. The Bloomberg Global Treasury Index yield reached 3.68 per cent, the highest since the 2008 crisis. Brent topped US$100 amid renewed Middle East hostilities. Markets now see a one-in-three chance of a Fed hike at its Jul 28-29 meeting, complicated by chair Kevin Warsh's reduced forward guidance. The BoJ and Bank of England also decide soon. Moody's warned of a \"new macro regime\" of structurally higher inflation and wider deficits.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20BT/Global%20bonds%20reeling%20as%20oil%20surge%20rekindles%20inflation%20threat.pdf"}, {"id": "bt-09", "title": "Investors home in on Singapore co-living, Hong Kong student housing in Apac's US$13.8 billion living boom", "source": "BT", "date": "27 Jul 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Asia-Pacific's living real estate sector is seeing a US$13.8 billion boom, per CapitaLand Investment research, with investors targeting Singapore co-living and Hong Kong student housing. Living was the only sector to grow investment through the pandemic and the 2022-2024 rate-hiking cycle. Japan's multifamily share of Apac living volume fell from around 75 per cent in 2019 to about 50 per cent in 2025 as capital shifted to Australian build-to-rent, student housing and Singapore co-living. Singapore's co-living inventory grew 17 per cent in 2023-2025, drawing S$1.4 billion despite tight yields around 4 per cent. Hong Kong student-housing deals more than doubled to HK$3.3 billion, yielding 4.5 to 5 per cent amid a bed shortfall. BlackRock, Mapletree, Keppel and SC Capital are active, though scalability remains the main constraint.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20BT/Investors%20home%20in%20on%20Singapore%20co-living,%20Hong%20Kong%20student%20housing%20in%20Apac%E2%80%99s%20US%2413.8%20billion%20living%20boom.pdf"}, {"id": "bt-10", "title": "Should you be afraid of Elon Musk?", "source": "BT", "date": "27 Jul 2026", "tags": ["Technology & AI", "Society"], "summary": "In a wide-ranging interview, Elon Musk sets out two paradoxes and a contradiction about AI, notes this Economist opinion piece. First, the power-hungry tycoon is helping build technology he says will render all humans powerless within five to ten years. Second, the world's richest man, worth US$750 billion, says he is preparing for infinite abundance where money becomes obsolete, yet acts otherwise. Musk urges AI pioneers in America and China to vet each other's models and imbue them with a love of truth, with governments providing enforcement. The Economist calls his largely institution-free proposal flimsy and self-serving, and warns his fatalism is dangerous and potentially infectious, distracting from serious thinking about preparing society while the race for advanced AI charges ahead.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20BT/Should%20you%20be%20afraid%20of%20Elon%20Musk.pdf"}, {"id": "bt-11", "title": "Silicon Valley divided over restricting Chinese AI as China closes gap with US", "source": "BT", "date": "27 Jul 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "A long-running Silicon Valley split over open-versus-closed AI reached a boiling point this week. Anthropic and OpenAI argue advanced models are too dangerous to develop openly and lobbied Washington over Chinese open-source models; Microsoft, Nvidia, Meta, Palantir and IBM signed a letter backing open source. Nvidia's Jensen Huang said the world needs both frontier closed and open models; Microsoft's Satya Nadella called open source \"essential\". The clash stems from China's rapid progress: Z.ai and Moonshot AI released models rivalling US labs, which accuse Chinese firms of \"distilling\" their systems. US officials including Treasury Secretary Scott Bessent weighed sanctions but lean toward case-by-case national-security regulation over a blanket ban. Nearly 200 startups urged no limits; Musk, Zuckerberg, Altman and Pichai backed open source.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20BT/Silicon%20Valley%20divided%20over%20restricting%20Chinese%20AI%20as%20China%20closes%20gap%20with%20US.pdf"}, {"id": "bt-12", "title": "Singapore's longevity economy must improve lives, not drive unnecessary healthcare spending, says Ong Ye Kung", "source": "BT", "date": "27 Jul 2026", "tags": ["Society", "Finance & Markets"], "summary": "Health Minister Ong Ye Kung said Singapore, becoming a super-aged society, should build a longevity economy by strengthening biomedical sciences, nutrition and AI. Speaking at The Business Times Longevity Forum, presented by HSBC Life, he said ageing will create economic opportunities as older, wealthier generations spend on retirement living, insurance, tourism and wellness; boomers spend about three times as much as Gen Z travellers. The global wellness industry grew from about US$4 trillion a decade ago to US$7 trillion in 2024, nearing US$10 trillion by decade's end. But he warned against \"the wrong kind of growth\", citing a \"buffet syndrome\" of over-servicing from overly generous insurance. Biomedical manufacturing generated over S$30 billion in 2024. He urged government-industry partnership anchored on dignity and affordability.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20BT/Singapore's%20longevity%20economy%20must%20improve%20lives,%20not%20drive%20unnecessary%20healthcare%20spending,%20says%20Ong%20Ye%20Kung.pdf"}, {"id": "bt-13", "title": "Temasek should publicly state its position on the long-rumoured CapitaLand-Mapletree merger", "source": "BT", "date": "27 Jul 2026", "tags": ["Finance & Markets"], "summary": "The columnist argues Temasek should publicly state its position on the long-rumoured CapitaLand Investment (CLI)-Mapletree merger, which reportedly stalled over valuation, personnel and weak-business concerns. CLI shares are down more than 8.1 per cent this year amid China property weakness. Merging their Reits looks tricky: CapitaLand Integrated Commercial Trust trades at 1.14 times NAV while Mapletree Pan Asia Commercial Trust trades at 0.77 times, risking objections from minority unitholders. Citing an OECD report on concentrated Asian ownership and valuation discounts, the writer says controlling shareholders should not stay silent about intentions. Temasek, which controls both groups, previously backed transformations at Keppel, Sembcorp, CapitaLand and Sats. Stating support would align the market; boards would then structure a deal respecting minorities and installing accountable managers.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20BT/Temasek%20should%20publicly%20state%20its%20position%20on%20the%20long-rumoured%20CapitaLand-Mapletree%20merger.pdf"}, {"id": "bt-14", "title": "US blockbuster IPOs are creating new millionaires. Philanthropies want to share in the bonanza", "source": "BT", "date": "27 Jul 2026", "tags": ["Finance & Markets", "Society"], "summary": "As blockbuster US IPOs mint new ultra-wealthy, non-profits are scrambling to share in the windfall, which some estimate could add over US$100 billion annually to the sector. Stripe's Nan Ransohoff calculated the OpenAI Foundation's 26 per cent stake could free about US$220 billion at listing; Anthropic's seven founders pledged to give away 80 per cent of their wealth, roughly US$90 billion. SpaceX's IPO alone spawned an estimated 4,400 millionaires. Tax incentives drive giving: selling US$10 million of stock could trigger a US$3.5 million bill, and California weighs a one-time 5 per cent billionaire excise tax, prompting some to consider leaving. Donor-advised funds are popular among young employees. Advisers warn of a shortage of fitting philanthropic vehicles, noting many recipients want to enjoy wealth first.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20BT/US%20blockbuster%20IPOs%20are%20creating%20new%20millionaires.%20Philanthropies%20want%20to%20share%20in%20the%20bonanza.pdf"}, {"id": "bt-15", "title": "US, Iran pause more strikes after recent escalation", "source": "BT", "date": "27 Jul 2026", "tags": ["Geopolitics", "Energy", "Defence"], "summary": "The US paused nearly two weeks of strikes on Iran for a second night as Teheran said it was refraining from retaliation and held talks with Oman over the Strait of Hormuz. After 13 days of strikes, Washington held off since late Friday without explanation, raising questions over Trump's next move; he said the US was \"locked and loaded\" but had not decided. The New York Times reported advisers paused partly over dwindling Patriot interceptor stocks. Traffic through Hormuz, previously a fifth of global crude, is essentially paralysed. Houthi missile and drone attacks on Saudi Aramco facilities and tankers opened a second front in the Red Sea, drawing Saudi-led strikes. Brent has soared about 27 per cent in two weeks, closing Friday at US$96.78.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20BT/US,%20Iran%20pause%20more%20strikes%20after%20recent%20escalation.pdf"}, {"id": "scmp-01", "title": "Apple's biggest-ever leak happened in India. Will firms rethink their China relocations?", "source": "SCMP", "date": "27 Jul 2026", "tags": ["Technology & AI", "Trade", "Geopolitics"], "summary": "A June cyberattack by hacking group World Leaks hit Tata Electronics, Apple's Bengaluru-based partner, leaking over 200,000 files on the dark web, including supplier lists and photos of the unreleased iPhone 18 Pro. Analysts called it Apple's biggest-ever leak. Apple had bet on India, which was expected to produce over 25 per cent of iPhones by 2026, up from 6 per cent in 2022, to diversify away from China and dodge US tariffs. UCLA's Christopher Tang said India \"must prove it can scale trust,\" citing gaps in information governance and cyber integrity. Analysts expect remediation rather than an existential threat, but warn the breach may slow transfers of sensitive product ramps to newer manufacturing hubs.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20SCMP/Apple%E2%80%99s%20biggest-ever%20leak%20happened%20in%20India.%20Will%20firms%20rethink%20their%20China%20relocations.pdf"}, {"id": "scmp-02", "title": "Southeast Asia must embrace reforms for 'China plus one' to succeed", "source": "SCMP", "date": "27 Jul 2026", "tags": ["Southeast Asia", "Trade", "Politics"], "summary": "Southeast Asian governments viewed the \"China plus one\" strategy as their escape from the middle-income trap, but the promised wave of transformative investment has been smaller than hoped while cheap Chinese goods hurt local industries. Thailand logged record investment applications yet manufacturing wages stayed flat since mid-2023, with growth cut to 1.8-2 per cent. Indonesia's middle class shrank by 9.5 million in six years amid collapsing business confidence, \"patriotic bond\" pressure and weakened central bank independence. Malaysia proved more resilient via semiconductors and data centres. The author argues the problem is domestic: political short-termism, weak institutions and industrial strategies that reduce pressure on local firms to upgrade. Strong institutions and supply-chain upgrades are needed.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20SCMP/Asian%20AngleSoutheast%20Asia%20must%20embrace%20reforms%20for%20%E2%80%98China%20plus%20one%E2%80%99%20to%20succeed.pdf"}, {"id": "scmp-03", "title": "Burberry sales jump: are luxury goods back in fashion in China amid tech wealth?", "source": "SCMP", "date": "27 Jul 2026", "tags": ["Finance & Markets", "Society"], "summary": "Luxury brands including Burberry and Cartier posted robust China sales growth in the quarter to late June, with analysts crediting the country's strong asset market and improved consumer sentiment. Burberry saw 5 per cent year-on-year sales growth to 455 million pounds (US$606 million) in fiscal 2027's first quarter, with Greater China up 9 per cent, driven by Gen Z demand. Richemont, parent of Cartier, reported Asia-Pacific sales jumping 21 per cent. Morningstar's Jelena Sokolova cited tech wealth and pent-up Covid-era savings but warned recovery signs were tepid and \"still way off pre-pandemic peaks.\" Bain expects modest 2026 growth for China's personal luxury market despite continued volatility and youth unemployment concerns.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20SCMP/Burberry%20sales%20jump%20are%20luxury%20goods%20back%20in%20fashion%20in%20China%20amid%20tech%20wealth.pdf"}, {"id": "scmp-04", "title": "Can Southeast Asia survive more Iran war fuel shocks?", "source": "SCMP", "date": "27 Jul 2026", "tags": ["Southeast Asia", "Energy", "Geopolitics"], "summary": "Renewed US-Iran fighting has exposed how limited Southeast Asia's defences are against war-driven energy shocks, analysts warn. At the 59th Asean Foreign Ministers Meeting in Manila, diplomats expressed \"grave concern\" and urged restoration of safe transit through the Strait of Hormuz, source of about 60 per cent of Asia's crude imports. The region bore the brunt of the earlier crisis after February's outbreak; the Philippines imports over 95 per cent of its fuel. ISEAS's Joanne Lin said the region cannot fully insulate itself from prolonged conflict. Universiti Malaya's Collins Chong said Asean lacks an operational energy security system such as a strategic reserve or centralised procurement, leaving states reliant on national and bilateral fixes.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20SCMP/Can%20Southeast%20Asia%20survive%20more%20Iran%20war%20fuel%20shocks.pdf"}, {"id": "scmp-05", "title": "China cracks down on offshore trusts with new tax rules for the wealthy", "source": "SCMP", "date": "27 Jul 2026", "tags": ["Finance & Markets", "Politics"], "summary": "China will impose personal-income taxes on offshore trusts owned by wealthy individuals, closing a loophole used by rich mainland families to avoid taxation. Effective immediately, the Ministry of Finance said the tax applies to gains on assets like stocks and property placed into trusts, with trust income taxed annually. Overseas trusts, often created in Hong Kong, are popular for skirting surveillance. The move follows the inheritance dispute over late Wahaha founder Zong Qinghou's offshore wealth. Individuals who transferred assets into trusts between 2023 and 2025 get a 90-day window to declare without penalty. The overhaul carries far-reaching implications for Hong Kong, now the biggest offshore wealth hub, and comes amid rising fiscal burdens. The tax rate is 20 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20SCMP/China%20cracks%20down%20on%20offshore%20trusts%20with%20new%20tax%20rules%20for%20the%20wealthy.pdf"}, {"id": "scmp-06", "title": "China makes offer to Indonesia, positioning itself for unique access to minerals: analyst", "source": "SCMP", "date": "27 Jul 2026", "tags": ["Trade", "Southeast Asia", "Geopolitics"], "summary": "China has offered to help Indonesia improve manufacturing and add value to its commodities, a move analysts say positions Chinese firms for unique access to Indonesia's export-restricted minerals. Beijing's ambassador Wang Lutong said \"supply chain and industrial integration\" would support both countries' development. Indonesia has banned exports of unprocessed nickel, bauxite and raw copper since 2014 to force domestic refining. ISEAS's Jayant Menon said Chinese investors adding value could sell into the local market or supply chain. Chinese firms have invested over US$65 billion in Indonesian smelters and EV battery facilities over the past decade. As the US tries to push China out of supply chains, Indonesia is of great value to Beijing, Menon said.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20SCMP/China%20makes%20offer%20to%20Indonesia,%20positioning%20itself%20for%20unique%20access%20to%20minerals%20analyst.pdf"}, {"id": "scmp-07", "title": "Chinese battery giant CATL posts record quarterly profits amid green energy boom", "source": "SCMP", "date": "27 Jul 2026", "tags": ["Energy", "Finance & Markets", "Technology & AI"], "summary": "CATL, the world's largest battery maker, reported record second-quarter revenue of 147.79 billion yuan (US$21.8 billion) and record net profit of 22.5 billion yuan, up 56.9 and 36.5 per cent year on year, though both slightly missed market estimates as China's EV demand weakened. First-half revenue and profit reached 276.9 billion and 43.28 billion yuan. The firm plans to buy back up to 40 billion yuan of shares. EV battery gross margins dipped to 20.6 per cent. HSBC's Ding Yuqian said domestic demand \"softened faster than expected\" and cut its full-year forecast to a 6 per cent drop. CATL is pivoting to energy storage, buoyed by renewable demand amid the Iran-war oil shock; its storage market share rose to 29.9 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20SCMP/Chinese%20battery%20giant%20CATL%20posts%20record%20quarterly%20profits%20amid%20green%20energy%20boom.pdf"}, {"id": "scmp-08", "title": "Chinese energy giant opens new plant in South Korea as AI ambitions intensify power crisis", "source": "SCMP", "date": "27 Jul 2026", "tags": ["Energy", "Technology & AI", "Geopolitics"], "summary": "State-owned Chinese nuclear giant CGN Energy International began operations at a self-developed gas-fired power project in Seosan, South Korea, deepening Chinese participation in its neighbour's energy sector amid AI-driven electricity demand. The 557-megawatt plant, expected to generate up to 3.9 billion kilowatt-hours annually, uses hydrogen-ready turbines and an independent management model overseen by CGN's South Korean subsidiary. It brings CGN's total to five facilities and 2.2 gigawatts of capacity in the country. South Korea imports 94 per cent of its energy and faces a power crunch as it pursues top-three global AI status, unveiling plans for at least 922 billion US dollars in semiconductor and AI investment. Wood Mackenzie warned the ambition \"risks running ahead of the electricity system needed to power it.\"", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20SCMP/Chinese%20energy%20giant%20opens%20new%20plant%20in%20South%20Korea%20as%20AI%20ambitions%20intensify%20power%20crisis.pdf"}, {"id": "scmp-09", "title": "Chinese tech firms' 'snub' to US Congress advisers highlights Beijing's growing AI caution", "source": "SCMP", "date": "27 Jul 2026", "tags": ["Technology & AI", "Geopolitics", "Politics"], "summary": "China's biggest technology companies declined to meet a bipartisan delegation from the US-China Economic and Security Review Commission during its first Beijing, Hangzhou and Shanghai visit in seven years, a move analysts said reflects Beijing's increasingly selective AI diplomacy. Vice-chairman Mike Kuiken said failing to secure meetings \"is itself a data point.\" Analyst Denis Simon said the commission is viewed as a policy actor, and that access to firms like Huawei, Tencent and DeepSeek \"is effectively a state decision.\" Trivium's David Zhang said Beijing sees the Trump administration, not Congress, as the interlocutor that matters. The visit coincided with US accusations that Moonshot AI misused Anthropic's models. New AI security talks are reportedly planned for September.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20SCMP/Chinese%20tech%20firms%E2%80%99%20%E2%80%98snub%E2%80%99%20to%20US%20Congress%20advisers%20highlights%20Beijing%E2%80%99s%20growing%20AI%20caution.pdf"}, {"id": "scmp-10", "title": "Houthi blockade of Saudi trade threatens wider Middle East conflict", "source": "SCMP", "date": "27 Jul 2026", "tags": ["Geopolitics", "Defence", "Energy"], "summary": "Saudi Arabia and Yemen's Iran-allied Houthis edged closer to a new front in the Iran war after Riyadh bombed the port of Hodeidah in retaliation for a Houthi missile strike on a Saudi ship in the Red Sea. The Houthis imposed an embargo on Saudi shipping on Monday, disrupting traffic through the Bab el-Mandeb Strait. Trump warned the US would hold Iran responsible and inflict \"major military punishment.\" Pakistan, bound by a defence pact with Riyadh, warned of lawful force if its maritime interests were threatened. Analysts describe the strikes as \"brinkmanship\" rather than coordinated Iranian action, though escalation risks remain. Quincy Institute's Annelle Sheline sees Trump as most likely to escalate; the Houthis aim to pressure Riyadh to lift restrictions.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20SCMP/Houthi%20blockade%20of%20Saudi%20trade%20threatens%20wider%20Middle%20East%20conflict.pdf"}, {"id": "scmp-11", "title": "How America's 250-year China dream became its greatest strategic challenge", "source": "SCMP", "date": "27 Jul 2026", "tags": ["Geopolitics", "Trade", "Politics"], "summary": "Historians trace how US hopes of trade and reform with China gave way to rivalry, beginning with the 1784 voyage of the Empress of China to Canton, when the newborn republic \"had a dream of China.\" Trump invoked that ship during a May state banquet hosted by Xi Jinping in Beijing. HKU's Xu Guoqi notes the tea dumped in Boston harbour in 1773 was Chinese, and that America's independence dream drew partly from the China market. The belief that market access would secure America's future endured through the 19th-century Open Door Policy and China's 2001 WTO accession, when Washington and Wall Street expected opening China would reinforce the US-led order. Two and a half centuries on, the two largest economies are locked in strategic struggle.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20SCMP/How%20America%E2%80%99s%20250-year%20China%20dream%20became%20its%20greatest%20strategic%20challenge.pdf"}, {"id": "scmp-12", "title": "How Trump's Iran 'own goal' is hitting long-term US strategy to contain Chinese influence", "source": "SCMP", "date": "27 Jul 2026", "tags": ["Geopolitics", "Defence", "Trade"], "summary": "US sanctions and the war against Iran are dismantling the Iranian port of Chabahar, one of the few assets built to constrain China's regional influence, analysts say. India backed Chabahar as a trade corridor to Central Asia bypassing Pakistan and a counterweight to the Chinese-operated port of Gwadar, committing US$120 million versus the US$62 billion China poured into the China-Pakistan Economic Corridor. Trump's conciliatory China stance, reduced enthusiasm for the Quad, and renewed maximum-pressure campaign have brought Indian operations at Chabahar to a standstill and damaged infrastructure. Hudson Institute's Ken Moriyasu said great-power competition is shifting to the Eurasian heartland as China builds railways and pipelines bypassing maritime chokepoints, while Central Asia tilts away from the Iran route.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20SCMP/How%20Trump%E2%80%99s%20Iran%20%E2%80%98own%20goal%E2%80%99%20is%20hitting%20long-term%20US%20strategy%20to%20contain%20Chinese%20influence.pdf"}, {"id": "scmp-13", "title": "Investment with Chinese characteristics: how Beijing's money is reshaping tech ventures", "source": "SCMP", "date": "27 Jul 2026", "tags": ["Technology & AI", "Finance & Markets", "Politics"], "summary": "China's frontier tech sector, from DeepSeek and Zhipu AI to Unitree Robotics and memory chipmaker CXMT, superficially mirrors Silicon Valley's venture ecosystem but shares a common investor: the Chinese state. As Western venture capital and domestic private wealth retreat, Beijing has built a state-capitalist apparatus flowing through national funds, local vehicles and SOEs. Last year state-affiliated investors supplied over 90 per cent of committed capital in China's private-equity market, up from under 79 per cent in 2021. Xi Jinping urged firms to \"invest early, invest small, invest for the long
