<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tecity News Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#fbfbfa; --surface:#ffffff; --surface-2:#f6f6f4;
    --text:#16181d; --muted:#6c727e; --faint:#9aa0ab;
    --border:#ececec; --border-2:#e2e2e0; --ink:#16181d;
    --hover:#f4f4f2; --ring:rgba(20,23,28,.10);
    --shadow:0 1px 2px rgba(16,18,22,.04), 0 8px 24px rgba(16,18,22,.05);
    --shadow-sm:0 1px 2px rgba(16,18,22,.05);
    --wsj:#D85A30; --st:#1D9E75; --bt:#378ADD; --scmp:#D4537E;
    --maxw:1120px;
  }
  html[data-theme="dark"]{
    --bg:#0c0d10; --surface:#15171c; --surface-2:#1b1e25;
    --text:#eceef2; --muted:#9aa1ad; --faint:#6b7280;
    --border:#252830; --border-2:#2d313b; --ink:#eceef2;
    --hover:#1c1f26; --ring:rgba(255,255,255,.12);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-feature-settings:"cv02","cv03","cv04","ss01";
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    line-height:1.6;
  }
  ::selection{background:rgba(120,120,120,.18)}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 28px}
  .num{font-variant-numeric:tabular-nums}
  .eyebrow{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); font-weight:600}

  /* header */
  header.top{position:sticky; top:0; z-index:20; backdrop-filter:saturate(180%) blur(14px);
    background:color-mix(in srgb, var(--bg) 82%, transparent); border-bottom:1px solid var(--border)}
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 28px; max-width:var(--maxw); margin:0 auto}
  .brand{display:flex; flex-direction:column; gap:2px; min-width:0}
  .brand .title{font-size:16px; font-weight:600; letter-spacing:-.01em}
  .brand .meta{font-size:12.5px; color:var(--muted)}
  .controls{display:flex; align-items:center; gap:10px}
  select.date{appearance:none; font:inherit; font-size:13px; font-weight:500; color:var(--text);
    background:var(--surface); border:1px solid var(--border-2); border-radius:10px; padding:8px 32px 8px 12px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%239aa0ab' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat; background-position:right 10px center; cursor:pointer; transition:border-color .15s}
  select.date:hover{border-color:var(--ink)}
  .toggle{display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; cursor:pointer;
    background:var(--surface); border:1px solid var(--border-2); border-radius:10px; color:var(--muted); transition:.15s}
  .toggle:hover{color:var(--text); border-color:var(--ink)}
  .toggle svg{width:17px; height:17px}

  /* hero digest */
  .hero{padding:48px 0 14px}
  .hero .eyebrow{margin-bottom:16px}
  .digest{font-size:clamp(25px,3.6vw,37px); line-height:1.22; font-weight:400; letter-spacing:-.02em;
    max-width:none; color:var(--text)}
  .digest .lead{max-width:none}

  /* metrics */
  .metrics{display:grid; grid-template-columns:repeat(6,1fr); gap:14px; padding:30px 0 8px}
  .metric{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px 18px 16px; box-shadow:var(--shadow-sm); transition:.18s}
  .metric:hover{box-shadow:var(--shadow); transform:translateY(-2px)}
  .metric .v{font-size:27px; font-weight:600; letter-spacing:-.03em; line-height:1.05}
  .metric .l{font-size:12.5px; font-weight:500; margin-top:8px}
  .metric .s{font-size:11.5px; color:var(--muted); margin-top:3px; line-height:1.4}

  /* tabs */
  .tabs{display:flex; gap:26px; margin:34px 0 0; border-bottom:1px solid var(--border)}
  .tab{position:relative; cursor:pointer; padding:0 0 14px; font-size:14px; font-weight:500; color:var(--muted); transition:color .15s}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--text)}
  .tab.active::after{content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--ink); border-radius:2px}

  .section{padding:30px 0 0}
  .section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px}
  .section-head h2{margin:0; font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); font-weight:600}
  .section-head .hint{font-size:12.5px; color:var(--muted)}

  /* lead briefing card */
  .lead-card{background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:30px 32px; box-shadow:var(--shadow); margin-bottom:16px}
  .lead-card .k{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); font-weight:600; margin-bottom:12px}
  .lead-card h3{margin:0 0 12px; font-size:23px; font-weight:600; letter-spacing:-.02em; line-height:1.2}
  .lead-card p{margin:0; font-size:15.5px; color:var(--text); line-height:1.65; max-width:none; column-width:34ch; column-gap:48px; column-fill:balance}

  /* briefing grid */
  .cards{display:grid; grid-template-columns:repeat(2,1fr); gap:16px}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:24px 26px; box-shadow:var(--shadow-sm); transition:.18s}
  .card:hover{box-shadow:var(--shadow); transform:translateY(-2px)}
  .card h3{margin:0 0 10px; font-size:16.5px; font-weight:600; letter-spacing:-.01em; line-height:1.3}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.62}

  /* coverage / bars */
  .split{display:grid; grid-template-columns:1.5fr 1fr; gap:16px; align-items:start}
  .panel{background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:24px 26px; box-shadow:var(--shadow-sm)}
  .bar-row{display:flex; align-items:center; gap:14px; margin:14px 0}
  .bar-row .name{width:42px; font-size:12.5px; font-weight:600; letter-spacing:.02em}
  .bar-track{flex:1; height:8px; background:var(--surface-2); border-radius:99px; overflow:hidden}
  .bar-fill{height:100%; border-radius:99px}
  .bar-row .cnt{width:26px; text-align:right; font-size:12.5px; color:var(--muted); font-weight:600}

  /* article */
  .feed-controls{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:4px 0 18px}
  .search{flex:1 1 260px; position:relative}
  .search svg{position:absolute; left:13px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--faint)}
  .search input{width:100%; font:inherit; font-size:14px; color:var(--text); background:var(--surface);
    border:1px solid var(--border-2); border-radius:12px; padding:11px 14px 11px 38px; outline:none; transition:.15s}
  .search input:focus{border-color:var(--ink); box-shadow:0 0 0 4px var(--ring)}
  .pills{display:flex; flex-wrap:wrap; gap:8px}
  .pill{cursor:pointer; font-size:12.5px; font-weight:500; color:var(--muted); background:var(--surface);
    border:1px solid var(--border-2); border-radius:99px; padding:7px 13px; user-select:none; transition:.14s; line-height:1}
  .pill:hover{border-color:var(--ink); color:var(--text)}
  .pill.active{color:#fff; border-color:transparent}
  .tagrow{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .count{font-size:12.5px; color:var(--muted); margin-bottom:14px}

  .article{padding:22px 4px; border-bottom:1px solid var(--border)}
  .article:first-child{padding-top:6px}
  .article .head{display:flex; align-items:center; gap:12px; margin-bottom:9px; flex-wrap:wrap}
  .src{display:inline-flex; align-items:center; gap:7px; font-size:11px; font-weight:600; letter-spacing:.04em; color:var(--muted)}
  .src .dot{width:8px; height:8px; border-radius:99px}
  .article h4{margin:0; font-size:16.5px; font-weight:600; letter-spacing:-.01em; line-height:1.32; flex:1; min-width:240px}
  .article h4 a{color:inherit; text-decoration:none; transition:color .15s}
  .article h4 a:hover{color:var(--wsj-hover, var(--muted))}
  .article .date{font-size:12px; color:var(--faint); white-space:nowrap}
  .article p{margin:6px 0 12px; font-size:14.5px; color:var(--muted); line-height:1.62; max-width:88ch}
  .tags{display:flex; flex-wrap:wrap; gap:7px}
  .tag{font-size:11px; font-weight:600; letter-spacing:.01em; border-radius:99px; padding:3px 10px; border:1px solid transparent}

  .empty{text-align:center; color:var(--muted); padding:60px 0; font-size:14px}
  footer{padding:48px 0 60px; color:var(--faint); font-size:12px; text-align:center}

  @media(max-width:980px){
    .metrics{grid-template-columns:repeat(3,1fr)}
    .cards{grid-template-columns:1fr}
    .split{grid-template-columns:1fr}
  }
  @media(max-width:560px){
    .wrap,.topbar{padding-left:18px; padding-right:18px}
    .metrics{grid-template-columns:repeat(2,1fr)}
    .hero{padding-top:34px}
  }
</style>
</head>

<script>window.ALL_DAYS = {"2026-07-22": {"date": "2026-07-22", "dayOfWeek": "Wednesday", "totalArticles": 67, "sourceCounts": {"WSJ": 17, "ST": 14, "BT": 16, "SCMP": 20}, "executiveDigest": "China's AI event delivered a blunt message to the US - 'we're coming for you' - as models from Moonshot's Kimi K3 to Alibaba's latest narrowed the gap and prompted top American AI execs to sound the alarm in 'another DeepSeek moment'; meanwhile the Iran war escalated as a missile struck US troop housing at a Jordan base (cost now US$37.5 billion), BlackRock led a US$12 billion Meta data-centre financing, and SGX opened access for Singapore investors to buy Grab, Sea and SpaceX.", "briefingCards": [{"title": "Lead story - China's AI 'coming for you'", "body": "China's flagship AI event delivered a pointed message to Washington - 'we're coming for you' - as a wave of Chinese models narrowed the gap: Moonshot's open-weight Kimi K3 triggered 'another DeepSeek moment', Alibaba said its newest model is second only to Anthropic's Fable 5, Zhipu's shares surged 37% on a giant data centre powered by Chinese chips, and an AI agent, Qiushi Engine, was said to outperform Claude Code in autonomous research. Top American AI executives sounded the alarm, warning safety curbs may be holding US models back. Trump softened his tone on China election-meddling claims ahead of Rubio-Wang talks and signalled 'deal me in'."}, {"title": "Markets & finance", "body": "The AI build-out kept drawing record capital - BlackRock led a US$12 billion financing for new Meta data centres in Texas, and Ant International raised US$1.2 billion - though WSJ cautioned the massive supply deals feeding the frenzy are 'no sure thing'. Closer to home, Singapore inflation expectations inched up to 3.4% on geopolitical and trade fears, analysts flagged 'positive surprises' for S-Reits' H1 earnings, and SGX opened access for local investors to buy Grab, Sea and SpaceX. BT argued the Fed needs to tighten, and China signalled it will expand capital-outflow channels."}, {"title": "Asia realignment", "body": "Flashpoints multiplied: the US condemned China after a South China Sea clash and is pressing across three maritime fronts, EU lawmakers arrived in Beijing for high-stakes talks, and North Korea and Russia's foreign ministers held strategic talks in Moscow, with a fifth China-Russia rail link planned. Taiwan opened the door to Starlink, pending Elon Musk. Britain's new PM Andy Burnham stamped his authority with a Cabinet shake-up and took a call from Trump, who is betting big-government Burnham can be a partner."}, {"title": "Energy & climate", "body": "Energy risk stayed acute: a missile strike and the Houthi threat of a Saudi blockade left Asia's oil buyers facing a US$100-per-barrel risk, and China kept a tight grip on fuel exports despite eased curbs. BT asked how long energy markets can withstand the Iran war, whose US cost has reached US$37.5 billion. On the transition, SCMP examined how China's policy playbook took its EV sector 'from zero to hero', and EGP Energy offered one million public shares at S$0.51 in a Singapore mainboard listing."}, {"title": "Technology & AI", "body": "Beyond the model race, the AI economy's plumbing was in focus: WSJ asked whether AI might actually help solve the next labour crisis, even as ST probed the unease of 'training an AI that replaces you', and BT flagged 'Model Autophagy Disorder' - the risk of AI trained on AI-generated data. Singapore's Josephine Teo warned the risks of autonomous AI agents are 'not yet fully understood', and an ex-Hyundai robotics lead will spearhead a new Samsung robotics initiative. Bain found many ASEAN firms still struggle to roll AI out."}, {"title": "Singapore & SEA focus", "body": "SGX opened access for Singapore investors to buy Grab, Sea and SpaceX, and a new professional-services centre will help firms expand regionally. Singapore's military is exploring quantum computing for mission planning, while inflation expectations rose to 3.4%. In property, Kingsford Group agreed to buy the Tan Boon Liat Building at a lower reserve price of S$950 million, and EGP Energy launched a mainboard IPO. Japan is seeking South-east Asian sea lanes to avoid troubled waters, underscoring the region's rising strategic weight."}], "keyMetrics": [{"value": "67", "label": "Articles curated today", "sub": "WSJ 17 · ST 14 · BT 16 · SCMP 20"}, {"value": "Coming for you", "label": "China AI narrows gap", "sub": "Kimi K3; US execs alarmed"}, {"value": "US$12b", "label": "BlackRock-Meta centres", "sub": "AI capex keeps surging"}, {"value": "US$37.5b", "label": "US Iran war cost", "sub": "Missile hits Jordan troop base"}, {"value": "3.4%", "label": "SG inflation expectations", "sub": "Up on geopolitical, trade fears"}, {"value": "Grab, Sea, SpaceX", "label": "SGX opens access", "sub": "For Singapore investors"}], "articles": [{"id": "wsj-01", "title": "Alibaba Says New AI Model Is Just Second to Anthropic's Fable 5", "source": "WSJ", "date": "22 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Alibaba previewed Qwen3.8 Max, a flagship large language model it says ranks second only to Anthropic's Fable 5, signaling China is fast closing the technological gap with the U.S. The preview version boasts 2.4 trillion parameters and is available on Alibaba's coding platforms; the company plans to make it open-weight soon. The Sunday release came days after Moonshot's Kimi K3, a 2.8-trillion-parameter model billed as the world's biggest open-source system that surpassed Z.AI's GLM-5.2 on benchmarks. Alibaba's Hong Kong shares rose as much as 5.6%, while Z.AI and MiniMax fell 13% and 5.7%. Analysts expect intensifying competition to leave only a small group of frontier-model developers standing.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20WSJ/Alibaba%20Says%20New%20AI%20Model%20Is%20Just%20Second%20to%20Anthropic%E2%80%99s%20Fable%205.pdf"}, {"id": "wsj-02", "title": "BlackRock Leads $12 Billion Financing for New Meta Data Centers in Texas", "source": "WSJ", "date": "22 Jul 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "BlackRock is leading a debt sale targeting at least $12 billion for its massive new El Paso data-center project backed by Meta Platforms, people familiar said. BlackRock and its infrastructure and private-credit arms own an 80% stake, while Meta, which will use the centers, owns 20%; the complex is expected to have roughly 1 gigawatt of capacity. JPMorgan Chase and Morgan Stanley are leading the jumbo debt sale. BlackRock has poured tens of billions into data-center investments, including a $40 billion deal to buy Aligned Data Centers. CEO Larry Fink's purchases of Global Infrastructure Partners and HPS make the $15 trillion asset manager more active in owning assets. The structure mirrors Meta's $27 billion Louisiana deal.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20WSJ/BlackRock%20Leads%20%2412%20Billion%20Financing%20for%20New%20Meta%20Data%20Centers%20in%20Texas.pdf"}, {"id": "wsj-03", "title": "China's Top AI Event Delivers Message to the U.S.: We're Coming for You", "source": "WSJ", "date": "22 Jul 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "China's biggest AI convention, the ninth World Artificial Intelligence Conference in Shanghai, showcased the country's rapid advances and its message to American rivals. On the first day, Beijing-based Moonshot AI jolted markets with a new model ranked among the world's best; two days later Alibaba claimed to top it. Some 20 football fields of exhibition space displayed AI hardware and robots dancing, making cappuccinos and massaging visitors. Beijing flaunted its prowess at overcoming U.S. sanctions that largely block access to the best chips. Not everything worked: humanoids remain better at tricks than chores, and export controls forced Moonshot to halt new premium subscriptions after Kimi K3 demand strained computing. China's advances dashed U.S. hopes of an impregnable AI lead.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20WSJ/China%E2%80%99s%20Top%20AI%20Event%20Delivers%20Message%20to%20the%20U.S.%20We%E2%80%99re%20Coming%20for%20You.pdf"}, {"id": "wsj-04", "title": "Iran Missile Struck Housing Units for U.S. Troops at Jordan Base", "source": "WSJ", "date": "22 Jul 2026", "tags": ["Geopolitics", "Defence"], "summary": "An Iranian ballistic missile that killed two U.S. servicemembers at Jordan's Muwaffaq Salti Air Base struck prefabricated housing units where troops slept, U.S. officials said. It was one of three strikes on the base in 24 hours; a third person's remains were found. That three missiles slipped through defenses underscores the challenge of protecting an estimated 50,000 regional troops from Iran's ballistic missiles and drones. Trump threatened retaliation, and the U.S. launched new strikes to degrade Iran's ability to attack Strait of Hormuz shipping. \"Every time Iran kills an American Soldier they will pay,\" Trump wrote. Seventeen servicemembers have been killed since the war began; an 18th is missing. No evidence shows Iran specifically targeted the quarters.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20WSJ/Iran%20Missile%20Struck%20Housing%20Units%20for%20U.S.%20Troops%20at%20Jordan%20Base.pdf"}, {"id": "wsj-05", "title": "Iran War Mediators Push for Traction on New Ceasefire", "source": "WSJ", "date": "22 Jul 2026", "tags": ["Geopolitics", "Energy"], "summary": "Mediators worked Monday to push the U.S. and Iran toward a new ceasefire, fearing a prolonged low-grade conflict that disrupts regional economies and risks escalation. The effort follows a ninth straight night of U.S. attacks, Iranian retaliation against Kuwait and Bahrain, and two more vessels struck in the Strait of Hormuz. Trump threatened retaliation after Iranian strikes killed at least two servicemembers. Strait traffic is crippled, averaging 10 ships daily, and Yemen's Houthis announced a blockade of Saudi shipping. Qatar floated a 10-day ceasefire and an end to shipping restrictions, but Iran's Revolutionary Guard hasn't responded. Diplomats face mutually exclusive demands over who administers the waterway's reopening, making mediation \"nearly an impossible task,\" one researcher said.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20WSJ/Iran%20War%20Mediators%20Push%20for%20Traction%20on%20New%20Ceasefire.pdf"}, {"id": "wsj-06", "title": "Iran's Fortitude Is Its Decisive Edge", "source": "WSJ", "date": "22 Jul 2026", "tags": ["Geopolitics", "Politics"], "summary": "This opinion piece argues Tehran holds a wartime advantage over Washington because Iran's ruling elite wants to fight and will endure far more pain than Trump. The authors contend the revolutionary faithful have embraced such tests since the Iran-Iraq war and Syria's civil war, using conflict to bond the IRGC and security forces. Team Trump and Israel believed sustained bombing could defang a fragile Islamic Republic, but no collapse came. The writers criticize JD Vance for entertaining illusions of Iranian moderates, noting counterparts Ghalibaf and Araghchi are committed revolutionaries. They argue the regime, unified by the brutal suppression of a January 2026 insurrection, is more determined than at any point since 1980, and has shrewdly relaxed hijab enforcement.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20WSJ/Iran%E2%80%99s%20Fortitude%20Is%20Its%20Decisive%20Edge.pdf"}, {"id": "wsj-07", "title": "Israel Believes Iran Moved Nuclear Centrifuges Into Pickaxe Mountain", "source": "WSJ", "date": "22 Jul 2026", "tags": ["Geopolitics", "Defence"], "summary": "Israeli intelligence believes Iran moved thousands of uranium-enrichment centrifuges into tunnels deep inside Pickaxe Mountain last fall, Israeli and U.S. officials say, raising fears Tehran could reconstitute its nuclear program. The transfer allegedly followed June's 12-day war, when U.S. and Israeli strikes hit Iran's three main nuclear sites. As war aims diverge, Netanyahu has pressed Trump to resume all-out attacks; Trump said the U.S. was prepared to strike Pickaxe, calling it \"a possible target for a nice big fat shot.\" Known as Mount Kolang, the site reaches 300 to 450 feet beneath rock and presents challenges to airstrikes. Experts warn a covert breakout is the worst-case scenario and the IAEA must inspect the unverified facility.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20WSJ/Israel%20Believes%20Iran%20Moved%20Nuclear%20Centrifuges%20Into%20Pickaxe%20Mountain.pdf"}, {"id": "wsj-08", "title": "Lockheed Martin Plans Bargain-Rate Patriot Missile to Replenish Low Stockpiles", "source": "WSJ", "date": "22 Jul 2026", "tags": ["Defence", "Finance & Markets"], "summary": "Lockheed Martin said it would field a new, cheaper Patriot missile that could reach the battlefield faster as global stockpiles of high-end interceptors dwindle. The planned PAC-3 Adapted Capability Effector can be built more quickly and will cost buyers less than half of Lockheed's bestselling MSE version, which runs over $4 million a round. It targets cruise missiles and close- and short-range ballistic missiles, not longer-range threats. Lockheed will ask European defense firms to supply parts like rocket motors and seekers, aiming to produce in Europe. Flight testing is planned for 2028. The U.S. Army separately launched a competition for a sub-$1 million interceptor. Cahill said the design would \"thin the herd\" of drones and cruise missiles.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20WSJ/Lockheed%20Martin%20Plans%20Bargain-Rate%20Patriot%20Missile%20to%20Replenish%20Low%20Stockpiles.pdf"}, {"id": "wsj-09", "title": "Netanyahu Won't Be Arrested After New York City Mayor's Comments, Says Trump", "source": "WSJ", "date": "22 Jul 2026", "tags": ["Politics", "Geopolitics"], "summary": "Trump said Monday that Benjamin Netanyahu wouldn't be arrested \"in any way, shape or form\" in the U.S., after New York City Mayor Zohran Mamdani said he would explore whether local authorities could detain the Israeli premier. Mamdani, a Democratic socialist and sharp critic of Israel, called Netanyahu a \"war criminal\" who \"belongs in The Hague,\" where the ICC issued an arrest warrant over alleged Gaza war crimes. Netanyahu is expected in New York in September for the U.N. General Assembly. Critics called the arrest idea \"third-world behavior,\" and legal scholars said Mamdani's authority is tenuous: the U.S. doesn't recognize the ICC, and a 2002 federal law bars local police from cooperating with it.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20WSJ/Netanyahu%20Won%E2%80%99t%20Be%20Arrested%20After%20New%20York%20City%20Mayor%E2%80%99s%20Comments,%20Says%20Trump.pdf"}, {"id": "wsj-10", "title": "The Massive Supply Deals Feeding the AI Frenzy Are No Sure Thing", "source": "WSJ", "date": "22 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Multibillion-dollar contracts to supply AI computing power have become the glue holding the boom together, but investors shouldn't rely on them if demand fades. The memory-chip business is the most extreme example: explosive growth of memory-intensive AI agents has turned a cutthroat, cyclical industry into something more stable. Samsung, SK Hynix and Micron are posting record profits and tout a shortage lasting into 2028. Micron's five-year, take-or-pay agreements will supply more than half its future revenue, CEO Sanjay Mehrotra said. Micron's stock roughly tripled this year. Yet if demand ebbs before contracts expire, deals will likely be renegotiated or extended, since suppliers avoid forcing unwanted chips on customers. A similar shift during the Covid-era shortage was reversed when glut returned.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20WSJ/The%20Massive%20Supply%20Deals%20Feeding%20the%20AI%20Frenzy%20Are%20No%20Sure%20Thing.pdf"}, {"id": "wsj-11", "title": "The Pentagon Is Finally Buying (Some) Weapons From Startups", "source": "WSJ", "date": "22 Jul 2026", "tags": ["Defence", "Technology & AI"], "summary": "Defense Secretary Pete Hegseth has rewritten Pentagon procurement rules, showering money on high-tech defense startups while also expanding spending on traditional vendors he calls slow and bloated. Investor exuberance has sent valuations soaring; Anduril doubled to $61 billion by May. Contract spending on the 15 highest-valued defense-tech startups tripled from 2022, yet still accounts for under 1% of total defense dollars. Roughly 10,000 new defense companies entered the market in two years, and nontraditional firms received over $122 billion last fiscal year, though the Pentagon also doubled prime-contractor spending to $372 billion. Spending has climbed amid Taiwan concerns and Ukraine's drone lessons. Startups fear Congress may slow funding amid scrutiny of Hegseth and the Iran war.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20WSJ/The%20Pentagon%20Is%20Finally%20Buying%20(Some)%20Weapons%20From%20Startups.pdf"}, {"id": "wsj-12", "title": "The U.S. Puts Once-Unthinkable Ideas on the Table to Disarm Hezbollah", "source": "WSJ", "date": "22 Jul 2026", "tags": ["Geopolitics", "Defence"], "summary": "With Israel having battered Hezbollah over two years and many Lebanese turning against it, U.S., Israeli and Lebanese officials see growing consensus that the militia must give up its weapons, but no easy path. Israel's continuing occupation of southern Lebanon complicates cooperation. Three ideas are emerging: training and vetting elite Lebanese Armed Forces units to disarm Hezbollah town by town, with operations beginning Monday to clear three southern villages; Trump's suggestion that Syria's new government under former jihadist Ahmed al-Sharaa choke off supply lines; and using the Israeli military directly. Critics warn each carries fatal flaws. The weak Lebanese army harbors Hezbollah sympathizers, and vetting risks fracturing it along sectarian lines. Rome talks set a handover structure.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20WSJ/The%20U.S.%20Puts%20Once-Unthinkable%20Ideas%20on%20the%20Table%20to%20Disarm%20Hezbollah.pdf"}, {"id": "wsj-13", "title": "Top American AI Execs Sound Alarm on Chinese Models", "source": "WSJ", "date": "22 Jul 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "OpenAI and Anthropic executives are warning that cheap, powerful new Chinese AI models will lead to a \"dystopian\" future and pose security risks without regulation, as Washington and Silicon Valley debate whether U.S. firms should use them. Critics say the two companies, preparing for public listings, simply want to eliminate competition. Highly capable open-weight systems like Moonshot's Kimi K3 and Alibaba's Qwen 3.8 Max, competitive on some benchmarks, have upended the race. OpenAI strategist Dean Ball warned of \"full AI communism\" and a \"dystopian hellscape,\" though he said it wasn't OpenAI's position. Anthropic CEO Dario Amodei called freely downloadable models with cyber capabilities \"a serious concern.\" Use of cheaper Chinese models is surging at U.S. companies.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20WSJ/Top%20American%20AI%20Execs%20Sound%20Alarm%20on%20Chinese%20Models.pdf"}, {"id": "wsj-14", "title": "Trump to China: Deal Me In", "source": "WSJ", "date": "22 Jul 2026", "tags": ["Geopolitics", "Politics"], "summary": "This opinion column argues Trump put his dealmaker reputation on the line with China. Beijing's Commerce Ministry welcomed his decision not to renew a 2020 emergency order that sanctioned nine Hong Kong and mainland officials, though sanctions on 39 others, including Chief Executive John Lee, remain. Critics call the relief a kowtow, seeing no clear return; the Hong Kong government termed it a \"positive shift.\" Mark Clifford, a Jimmy Lai biographer, called it a significant softening coming the same week as more bookseller arrests. Trump did press China to free pastor Ezra Jin and continues advocating for imprisoned newsman Jimmy Lai, the world's most famous political prisoner. The author, McGurn, is close to Lai's family.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20WSJ/Trump%20to%20China%20Deal%20Me%20In.pdf"}, {"id": "wsj-15", "title": "U.K.'s New Leader Andy Burnham Bets Big Government Can Save the Country", "source": "WSJ", "date": "22 Jul 2026", "tags": ["Politics", "Energy"], "summary": "Andy Burnham, Britain's seventh prime minister in a decade, arrived at Downing Street Monday promising a bigger, more muscular state can solve economic woes and restore stability. The 56-year-old former Manchester mayor pledged to roll back 40 years of neoliberalism, devolve power to the regions, bring \"life's essentials under state control,\" and end rough sleeping. Policies under consideration include rent controls and subsidies for energy bills and bus fares; U.K. 10-year borrowing costs rose to a two-month high. Burnham replaced Keir Starmer, ousted after Labour cratered in polls behind Reform UK. He named centrist John Healey treasury chief to reassure investors. Trump urged Burnham to allow North Sea oil drilling to enrich the country.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20WSJ/U.K.%E2%80%99s%20New%20Leader%20Andy%20Burnham%20Bets%20Big%20Government%20Can%20Save%20the%20Country.pdf"}, {"id": "wsj-16", "title": "USA Rare Earth Names Serra Verde CEO Moraitis to Lead Combined Company", "source": "WSJ", "date": "22 Jul 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "USA Rare Earth named Serra Verde Group Chief Executive Thras Moraitis to lead the company after completing a $2.8 billion combination of the two mining firms. Moraitis's appointment is effective Oct. 1, succeeding Barbara Humpton, who is retiring from the company and board. The firm also named board chair Michael Blitzer executive chairman, effective immediately. USA Rare Earth agreed in April to buy Serra Verde, which owns a rare-earth mine and processing plant in Brazil, to strengthen its mine-to-magnets supply chain amid heightened U.S.-China tensions; the cash-and-stock deal is expected to close by the end of August. Humpton, previously Siemens USA CEO, helped secure public-private partnerships. Moraitis built Serra Verde into a major producer outside Asia.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20WSJ/USA%20Rare%20Earth%20Names%20Serra%20Verde%20CEO%20Moraitis%20to%20Lead%20Combined%20Company.pdf"}, {"id": "wsj-17", "title": "Why AI Might Actually Help Solve the Next Labor Crisis", "source": "WSJ", "date": "22 Jul 2026", "tags": ["Technology & AI", "Society"], "summary": "Fears that AI will leave too few jobs may be misplaced; the bigger challenge could be a sharp slowing in workforce entrants leading to unprecedented labor scarcity, according to demographer Steven Ruggles. He forecasts the U.S. labor force will expand by just 9.1 million over the decade ending 2030, the fewest since 1960, then contract by 2.1 million over the following decade. Rising women's participation and immigration long cushioned the decline, but both have run their course, while falling fertility since the mid-2000s means fewer young workers. Ruggles says scarcity could lift wages and workers' bargaining power. That, he argues, is where AI's productivity boost could help, though a rebound in immigration could ease the shortage.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20WSJ/Why%20AI%20Might%20Actually%20Help%20Solve%20the%20Next%20Labor%20Crisis.pdf"}, {"id": "st-01", "title": "Britain's new PM Andy Burnham stamps his authority with Cabinet shake-up", "source": "ST", "date": "22 Jul 2026", "tags": ["Politics", "Society"], "summary": "New British PM Andy Burnham took power on July 20, replacing Keir Starmer and purging the Cabinet of his predecessor's loyalists while signalling a leftward tilt. Burnham, 56, the former Greater Manchester mayor nicknamed \"King of the North\", sacked Rachel Reeves and David Lammy, made John Healey finance minister, Ed Miliband foreign minister, and Wes Streeting defence minister; Angela Rayner returned. He pledged a 10-year plan to ease cost-of-living pressures, end rough sleeping, reindustrialise Britain and build public housing. Burnham held early calls with Trump and Zelensky. Installed without a leadership contest, he inherits a tepid economy, high borrowing costs and rising Reform UK support, drawing opposition calls for a snap election.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20ST/Britain's%20new%20PM%20Andy%20Burnham%20stamps%20his%20authority%20with%20Cabinet%20shake-up.pdf"}, {"id": "st-02", "title": "Ex-Hyundai robotics lead to spearhead Samsung robotics initiative", "source": "ST", "date": "22 Jul 2026", "tags": ["Technology & AI"], "summary": "Samsung Electronics said on July 21 it will set up a robotics division, RX or \"Robotics eXperience\", reporting directly to the chief executive to accelerate development and commercialisation and establish robotics as a major growth engine. The division will oversee mid- to long-term strategy, core technology and business execution while expanding research at home and overseas. Executive vice-president Lee Dong-kun, who previously led robotics strategy at Hyundai Motor Group including Boston Dynamics, will head the Robotics Strategy Team. Samsung plans research hubs in the US, China and Japan. The move builds on earlier pledges to achieve tangible humanoid robotics results in 2026 and to consider investments and acquisitions, aided by advances in physical AI.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20ST/Ex-Hyundai%20robotics%20lead%20to%20spearhead%20Samsung%20robotics%20initiative.pdf"}, {"id": "st-03", "title": "Iranian forces target Bahrain and Kuwait after US hits Iran's south", "source": "ST", "date": "22 Jul 2026", "tags": ["Geopolitics", "Energy"], "summary": "US forces bombed southern Iran overnight after Trump warned Tehran would pay for American deaths, while Iran struck US sites in Bahrain, Kuwait and Jordan and a tanker was hit in the Strait of Hormuz. US troop deaths rose to 17. US Central Command said it struck command centres, missile and drone sites and air defences. Iran's Revolutionary Guards targeted Amazon infrastructure and a US air base in Bahrain, plus bases in Kuwait; Jordan intercepted five drones. Yemen's Houthis threatened a naval blockade on Saudi Arabia, raising energy-supply risks. A senior Iranian official said Tehran received a mediators' proposal for a 10-day ceasefire to salvage the collapsing interim deal.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20ST/Iranian%20forces%20target%20Bahrain%20and%20Kuwait%20after%20US%20hits%20Iran's%20south.pdf"}, {"id": "st-04", "title": "Israel watches tensely as US-Iran conflict escalates", "source": "ST", "date": "22 Jul 2026", "tags": ["Geopolitics", "Defence"], "summary": "Israel has stayed on the sidelines of the escalating US-Iran clashes, but analysts question whether that will hold. Trump launched the war on Iran alongside Israel in late February, but later diverged from PM Benjamin Netanyahu, telling him to stop escalating and signing a short-lived June ceasefire against Israeli opposition. Iran has not directly bombarded Israel since, a move that would herald full-blown war. Netanyahu warned Israel would inflict \"much more powerful\" retaliation if attacked. Fighting has crept closer: on July 19 Israeli forces fired interceptors at missile debris from an Iran barrage aimed at Jordan. Facing October elections and unfinished war aims, Netanyahu weighs resuming fighting against risking ties with Washington.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20ST/Israel%20watches%20tensely%20as%20US-Iran%20conflict%20escalates.pdf"}, {"id": "st-05", "title": "Lebanese army deployed in southern town after Israeli withdrawal, official says", "source": "ST", "date": "22 Jul 2026", "tags": ["Geopolitics", "Defence"], "summary": "Lebanese army troops began deploying in the southern town of Zawtar al-Gharbiyeh on July 21 after Israeli forces withdrew, under a US-brokered plan, a senior security official said. The plan, called the pilot zone programme, foresees Lebanese troops confiscating Hezbollah weapons and phased Israeli withdrawals; the handover is its first test. Lebanon hopes to restore control over a strip about 10km deep still occupied by Israel, where villages have been razed and infrastructure destroyed. Army engineering teams are sweeping for unexploded ordnance. Mayor Abed Ezzeddin said more than half the town was destroyed and it remains uninhabitable, questioning safety with Israeli forces nearby. President Joseph Aoun was due to meet Trump in Washington.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20ST/Lebanese%20army%20deployed%20in%20southern%20town%20after%20Israeli%20withdrawal,%20official%20says.pdf"}, {"id": "st-06", "title": "North Korea, Russia foreign ministers hold strategic talks in Moscow, says report", "source": "ST", "date": "22 Jul 2026", "tags": ["Geopolitics"], "summary": "North Korean Foreign Minister Choe Son Hui and Russian Foreign Minister Sergei Lavrov held their third strategic dialogue in Moscow on July 20, KCNA reported, reaching consensus on all issues discussed. Talks focused on implementing their comprehensive strategic partnership treaty signed in June 2024. Russia backed North Korean measures against \"hostile acts\", while Pyongyang voiced \"invariable support\" for Russia's policies in Ukraine. Choe met President Vladimir Putin on July 19, conveying greetings from Kim Jong Un. The two sides discussed high-level visits and diplomatic coordination. North Korea sent an estimated 14,000 troops to help Russia repel Ukraine's Kursk incursion. Analysts watch for signs of another Kim visit to Russia, as Pyongyang also deepens ties with China.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20ST/North%20Korea,%20Russia%20foreign%20ministers%20hold%20strategic%20talks%20in%20Moscow,%20says%20report.pdf"}, {"id": "st-07", "title": "S'pore professional services centre to aid regional expansion", "source": "ST", "date": "22 Jul 2026", "tags": ["Trade", "Southeast Asia"], "summary": "The Singapore Professional Services (PS) Centre, launched July 21 at ISCA House, will anchor a regional network helping home-grown companies expand across Asia. It links businesses to PS centres in Shanghai, Nanjing and Ho Chi Minh City, with Jakarta planned later in 2026 and Bangkok, Johor Bahru and Shenzhen on the cards. The centre gives access to legal, accounting, tax, HR, valuation, sustainability and consulting expertise under one roof. Existing centres have served over 700 visitors and facilitated 65-plus connections. Second Finance Minister Indranee Rajah said internationalisation is not easy and trusted professional services have a role to play. A new Business Growth Clinic will let owners bring challenges to expert panels covering expansion, AI adoption and succession.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20ST/S'pore%20professional%20services%20centre%20to%20aid%20regional%20expansion.pdf"}, {"id": "st-08", "title": "SGX allows Singapore investors to buy Grab, Sea & SpaceX", "source": "ST", "date": "22 Jul 2026", "tags": ["Finance & Markets"], "summary": "The Singapore Exchange on July 21 announced its first US Singapore Depository Receipts (SDRs), letting retail investors buy US-listed Grab, Sea Limited and SpaceX from July 22 through local brokerages without Wall Street's higher costs. SDRs represent fractions of foreign shares, trade in Singapore dollars during local hours, and allow a minimum of 10 lots versus 100 for other SDRs. Sea and SpaceX trade at US$107 and US$122 respectively. Officials said the aim is not new market access but adding familiar globally recognised names. Risks include forex exposure and thinner liquidity than underlying stocks. SGX's SDR business has grown over 300 per cent year-on-year; total holdings reached $280 million, over 80 per cent retail.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20ST/SGX%20allows%20Singapore%20investors%20to%20buy%20Grab,%20Sea%20SpaceX.pdf"}, {"id": "st-09", "title": "Singapore military explores quantum computing for mission planning", "source": "ST", "date": "22 Jul 2026", "tags": ["Technology & AI", "Defence"], "summary": "Singapore's military is assessing whether quantum computers can optimise mission planning, potentially using unmanned drones to identify hostile forces. On July 21, IBM, the SAF's Digital and Intelligence Service (DIS) and the Defence Science and Technology Agency (DSTA) announced a tie-up, giving DIS and DSTA access to IBM's quantum resources and building expertise. Other applications include efficient routing of supply trucks and fuel bowsers. Commander Guo Jinghua cited national-security advantages despite the tech being nascent, noting 20 trucks across 50 locations create a quintillion route combinations. Experts project reliable self-correcting quantum computers by 2030. Singapore's ports and banks, including OCBC for fraud detection, are also exploring the technology, which speakers called convergent with AI.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20ST/Singapore%20military%20explores%20quantum%20computing%20for%20mission%20planning.pdf"}, {"id": "st-10", "title": "Trump speaks to new British PM Andy Burnham, gets invite to visit Manchester", "source": "ST", "date": "22 Jul 2026", "tags": ["Geopolitics", "Politics"], "summary": "US President Donald Trump said on July 20 he had a \"very good conversation\" with new British PM Andy Burnham and that they would meet in the \"not too distant future\", signalling potentially warmer ties after tensions with predecessor Keir Starmer. Trump said they discussed North Sea oil, trade and demining the Strait of Hormuz, pledging US support. Relations had strained after Starmer refused initial military support for Trump's attack on Iran; renewed US-Iran hostilities could be an early test for Burnham over allowing British bases. Burnham, before taking office, said he plans to be \"upfront\" with Trump. He congratulated Trump on the World Cup, invited him to Manchester, and outlined UK commitment to securing Hormuz shipping.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20ST/Trump%20speaks%20to%20new%20British%20PM%20Andy%20Burnham,%20gets%20invite%20to%20visit%20Manchester.pdf"}, {"id": "st-11", "title": "US condemns China in South China Sea clash", "source": "ST", "date": "22 Jul 2026", "tags": ["Geopolitics", "Southeast Asia"], "summary": "The United States condemned \"dangerous and aggressive actions\" by China after a clash with the Philippine Navy in the South China Sea, as Secretary of State Marco Rubio arrived in Manila on July 21 for an ASEAN foreign ministers' meeting. The State Department said China's provocations undermine regional stability. The Philippine military accused the Chinese coast guard of wounding a Filipino sailor on July 20; Beijing called the account a \"complete distortion of the truth\". Rubio, open to meeting Chinese counterpart Wang Yi, heralded US commitment to freedom of navigation in an op-ed alluding to China. He plans Quad talks with Australia, Japan and India, and meetings with South Korea and possibly Vietnam, raising energy, critical minerals and AI cooperation.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20ST/US%20condemns%20China%20in%20South%20China%20Sea%20clash.pdf"}, {"id": "st-12", "title": "Ukraine's Zelensky meets commanders as street protests mount", "source": "ST", "date": "22 Jul 2026", "tags": ["Geopolitics", "Defence"], "summary": "President Volodymyr Zelensky met top military commanders on July 20 to ease growing discontent with defence leadership that has triggered Ukraine's largest street protests since Russia's 2022 invasion. Thousands in Kyiv and other cities defied martial law for days, protesting last week's removal of reformer Mykhailo Fedorov as defence minister and demanding the dismissal of commander-in-chief Oleksandr Syrskyi, criticised for Soviet-style command and high casualties. Zelensky met five generals and a colonel seen as potential replacements, including Mykhailo Drapatyi and Volodymyr Horbatyuk. A poll showed 61 per cent opposed Fedorov's dismissal; he reportedly wants to return only as defence minister. Organisers threatened an indefinite general protest unless Syrskyi is removed and Fedorov reappointed by July 24.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20ST/Ukraine's%20Zelensky%20meets%20commanders%20as%20street%20protests%20mount.pdf"}, {"id": "st-13", "title": "What does Trump want? Gulf states have no answer as Iran war escalates", "source": "ST", "date": "22 Jul 2026", "tags": ["Geopolitics", "Energy"], "summary": "In this commentary, Joseph Chinyong Liow argues the June 17 US-Iran ceasefire is all but dead, with both locked in a dangerous escalatory spiral and the US risking another long Middle East war without clear strategy. Trump's shifting justifications, from degrading Iran's nuclear and missile capabilities to regime change and reopening the Strait of Hormuz, reveal deep inconsistencies. Gulf Arab states cannot drop backchannel talks with Tehran even while targeted, yet cannot cut ties with Washington as no alternative security provider exists; China, Russia and Europe are absent. Divergent positions among the UAE, Bahrain, Oman, Saudi Arabia and Qatar have rendered the Gulf Cooperation Council ineffective. Their security, Liow warns, has become collateral in a transactional test of wills.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20ST/What%20does%20Trump%20want%20Gulf%20states%20have%20no%20answer%20as%20Iran%20war%20escalates.pdf"}, {"id": "st-14", "title": "Why would you agree to train an AI that replaces you?", "source": "ST", "date": "22 Jul 2026", "tags": ["Technology & AI", "Society"], "summary": "This Financial Times commentary likens today's AI push to Frederick Winslow Taylor's early 20th-century drive to extract workers' tacit knowledge via stopwatches and notebooks. It argues the knowledge needed to make AI genuinely powerful in many white-collar jobs is locked inside employees' heads and hard to codify, echoing Michael Polanyi's line that \"we can know more than we can tell.\" Bridgewater found general models parsed news correctly only about 50 per cent of the time, but a fine-tuned bespoke model reached 85 per cent. Ford rehired veteran engineers to train its systems. Training bespoke AI requires employee consent, giving workers with tacit knowledge unexpected leverage. Workplaces marked by mistrust, or where staff doubt they will share AI gains, will struggle.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20ST/Why%20would%20you%20agree%20to%20train%20an%20AI%20that%20replaces%20you.pdf"}, {"id": "bt-01", "title": "'Positive surprises' in store for S-Reits' H1 earnings as valuations lag fundamentals, say analysts", "source": "BT", "date": "22 Jul 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Analysts expect Singapore-listed Reits to post low-to-mid single-digit year-on-year DPU growth in the H1 reporting season starting late July, with possible upside from office and industrial sectors. The rally lags fundamentals: the iEdge S-Reit Index is down about 4.6 per cent year to date, while the Straits Times Index gained 19.1 per cent, reflecting rate uncertainty and fund flows into banks and AI counters. RHB sees a \"rising disconnect\" suggesting a bottom is near. OCBC trimmed DPU forecasts by about 1 per cent but still expects marginal growth. DBS notes Singapore-focused assets are insulated from rate shocks. OUE Reit reports first, on Jul 22.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20BT/'Positive%20surprises'%20in%20store%20for%20S-Reits'%20H1%20earnings%20as%20valuations%20lag%20fundamentals,%20say%20analysts.pdf"}, {"id": "bt-02", "title": "AI can boost productivity, potentially increase revenue, but many Asean firms struggle with roll-out: Bain", "source": "BT", "date": "22 Jul 2026", "tags": ["Technology & AI", "Southeast Asia"], "summary": "South-east Asian companies are receptive to artificial intelligence as a growth tool but struggle to scale adoption, according to Bain & Company. Fewer than 20 per cent of the firms Bain works with in the region are meaningfully scaling AI investments, and two-thirds remain stuck at the pilot and planning stage. Financial services firms lead adoption, while other sectors are hindered by wariness over unsystematic roll-outs and fear of employee resistance. Asia-Pacific managing partner Shintaro Okuno advises picking two or three \"commercial plays\" and going deep to build success cases. Bain sees the biggest time savings in financial services, followed by consumer and healthcare, plus significant sales uplift.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20BT/AI%20can%20boost%20productivity,%20potentially%20increase%20revenue,%20but%20many%20Asean%20firms%20struggle%20with%20roll-out%20Bain.pdf"}, {"id": "bt-03", "title": "Ant International raises US$1.2 billion in global expansion push", "source": "BT", "date": "22 Jul 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Ant International, the global arm of the Jack Ma-backed fintech, raised US$1.2 billion in a Series A round to expand cross-border payments and AI-enabled commerce. Proceeds will build operations in merchant payment, account management and other financial services for small businesses. It drew capital from Ant Group, affiliate Alibaba and international investors, having sought a valuation of US$10 billion or more from existing shareholders including General Atlantic and Silver Lake. The funding could help prepare a potential Hong Kong listing as soon as this year. Ant International, more independent since forming its own board in 2024, saw revenue reach US$3 billion in 2024, growing about 25 per cent in 2025.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20BT/Ant%20International%20raises%20US1.2%20billion%20in%20global%20expansion%20push.pdf"}, {"id": "bt-04", "title": "China is solving the wrong consumption problem", "source": "BT", "date": "22 Jul 2026", "tags": ["Geopolitics", "Finance & Markets"], "summary": "Beijing's first-ever five-year consumption road map, unveiled last week, failed to deliver the bold measures needed to make personal spending a higher strategic priority, this commentary argues. Many details point in the opposite direction. The official target of 60 trillion yuan (US$8.9 trillion) in retail sales by 2030 implies annual expansion slowing to just 3.7 per cent from 2026 onward, far below the 5.3 per cent recorded during the previous plan, which included the pandemic peak. The piece contends China is trying to make shopping more satisfying, when consumers already enjoy a wide choice of high-quality goods, misdiagnosing what actually constrains household spending in the economy.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20BT/China%20is%20solving%20the%20wrong%20consumption%20problem.pdf"}, {"id": "bt-05", "title": "China's dual-velocity economy: export ascendancy amid domestic stagnation", "source": "BT", "date": "22 Jul 2026", "tags": ["Geopolitics", "Trade"], "summary": "China's economy in 2026 presents a striking paradox, this commentary argues: exports surge while domestic demand drifts in protracted torpor. On the external front, China posted a record trade surplus approaching US$1.2 trillion in 2025, with aggregate exports expanding about 5.5 per cent to some US$3.8 trillion. Domestically, however, consumption remains anaemic: retail sales growth languishes near 1 per cent, property transactions have contracted 65 per cent from their 2020 peak, and households have retreated into unprecedented precautionary thrift. The author calls this bifurcation among the most consequential predicaments facing the world's second-largest economy, with implications extending well beyond China's borders.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20BT/China's%20dual-velocity%20economy%20export%20ascendancy%20amid%20domestic%20stagnation.pdf"}, {"id": "bt-06", "title": "EGP Energy offers 1 million public shares at S$0.51 each in mainboard listing", "source": "BT", "date": "22 Jul 2026", "tags": ["Finance & Markets", "Energy"], "summary": "Electrical infrastructure provider EGP Energy Corporation launched its IPO on Jul 21, seeking about S$30.6 million in gross proceeds ahead of a Singapore Exchange mainboard listing. The offering comprises 18,823,500 shares at S$0.51 each, with 17,823,500 placed to institutional investors and 1,000,000 offered to the public. Cornerstone investors including Amova, Avanda and Value Partners subscribed for 41,176,500 new shares, raising about S$21 million. EGP will be the fourth mainboard listing this year, after Foundation Healthcare, JustCo and UI Boustead Reit. UOB and UOB Kay Hian are joint issue managers. The IPO closes noon Jul 27, with trading expected Jul 29. Implied market capitalisation is around S$115 million.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20BT/EGP%20Energy%20offers%201%20million%20public%20shares%20at%20S0.51%20each%20in%20mainboard%20listing.pdf"}, {"id": "bt-07", "title": "How long can energy markets withstand the Iran war?", "source": "BT", "date": "22 Jul 2026", "tags": ["Energy", "Geopolitics"], "summary": "Global oil markets have twice priced in a Strait of Hormuz closure and twice priced it back out, this analysis notes. Brent spiked past US$120 a barrel when war between the US and Iran began, fell to US$72.24 by June after the strait reopened, then climbed to the US$80 range when the ceasefire collapsed in early July. Markets held up because Opec+, led by Saudi Arabia and the UAE, entered with ample spare capacity, and IEA members released around 400 million barrels from stockpiles. But strain is showing: US refinery utilisation nears 97 per cent, and the Strategic Petroleum Reserve has fallen to about 316 million barrels, the lowest since 1983.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20BT/How%20long%20can%20energy%20markets%20withstand%20the%20Iran%20war.pdf"}, {"id": "bt-08", "title": "Investing in a K-shaped economy", "source": "BT", "date": "22 Jul 2026", "tags": ["Finance & Markets", "Society"], "summary": "This investment commentary examines the widely discussed K-shaped economy, in which a yawning gap separates high earners who are spending and growing their wealth from low-income households living hand to mouth. The same divergence appears at the corporate level, where rich companies expand rapidly while smaller businesses struggle to pay their bills. The author argues that for investors, the key task is discerning which companies are thriving and which are struggling amid this uneven landscape. Understanding the split matters for positioning portfolios, as beneficiaries and casualties of the bifurcation increasingly diverge in performance, valuation and resilience across both consumer and corporate segments of the economy.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20BT/Investing%20in%20a%20K-shaped%20economy.pdf"}, {"id": "bt-09", "title": "Kingsford Group inks deal to buy Tan Boon Liat Building at lower reserve price of S$950m", "source": "BT", "date": "22 Jul 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Freehold Tan Boon Liat Building has been sold en bloc to a Kingsford Group unit for S$950 million, likely Singapore's largest collective sale so far this year, said adviser Cushman & Wakefield. The price is 5 per cent below the revised S$1 billion reserve and 17.4 per cent under the original S$1.15 billion asking price from its February 2025 launch. The sale is conditional on 80 per cent owner support. The Urban Redevelopment Authority plans to rezone the Business 1 industrial site to residential with commercial on the first storey, lifting the plot ratio to 4.9 and allowing twin towers up to 48 storeys, a 50 per cent uplift in allowable gross floor area.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20BT/Kingsford%20Group%20inks%20deal%20to%20buy%20Tan%20Boon%20Liat%20Building%20at%20lower%20reserve%20price%20of%20S950m.pdf"}, {"id": "bt-10", "title": "Risks of autonomous AI agents not yet fully understood: Josephine Teo", "source": "BT", "date": "22 Jul 2026", "tags": ["Technology & AI", "Politics"], "summary": "Autonomous AI agents pose risks that are not yet fully understood, warned Minister for Digital Development and Information Josephine Teo at the IBM Think on Tour Singapore event on Jul 21. Her comments came six months after Singapore released its governance framework for agentic AI. Unlike traditional large language models, agentic AI can initiate and execute tasks with limited human interaction, and Teo said it will be \"quite a long time\" before the full range of problems is understood. Trust Bank's Rajay Rai cited a 50 per cent deflection rate from AI customer service. Panellists from the SAF's Digital and Intelligence Service and IBM stressed human accountability and tiered governance based on use-case risk.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20BT/Risks%20of%20autonomous%20AI%20agents%20not%20yet%20fully%20understood%20Josephine%20Teo.pdf"}, {"id": "bt-11", "title": "Singapore inflation expectations inch up to 3.4% on geopolitical and trade fears: survey", "source": "BT", "date": "22 Jul 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Singapore households modestly raised near-term price expectations amid global uncertainties, supply chain disruptions and tariff fears, according to the DBS-SMU Singapore Index of Inflation Expectations. One-year-ahead headline inflation expectations climbed to 3.4 per cent in June from 3.3 per cent in March, with core expectations mirroring the move. Of 536 respondents, 87.7 per cent expect higher prices, with 57.8 per cent citing geopolitical conflicts involving Hamas, Israel, Ukraine, Russia and Iran. DBS economist Taimur Baig noted a 2026 rebound in global inflation from Middle East energy constraints and AI-cycle demand. The uptick follows MAS's April tightening, its first since October 2022. Five-year headline expectations rose to 4.3 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20BT/Singapore%20inflation%20expectations%20inch%20up%20to%203.4%20on%20geopolitical%20and%20trade%20fears%20survey.pdf"}, {"id": "bt-12", "title": "Singdollar bonds: Let quality carry and credit do more of the work", "source": "BT", "date": "22 Jul 2026", "tags": ["Finance & Markets"], "summary": "The first half of 2026 saw a sharp reversal in interest-rate expectations, this fixed-income commentary notes. Markets entered the year anticipating further monetary easing, but the Middle East conflict and disruption to energy supplies reignited inflation concerns. Singapore Overnight Rate Average Overnight Indexed Swap (Sora-OIS) rates rose by around 45 to 60 basis points across medium tenors in March before partially retracing as oil prices eased. Despite the abrupt repricing, Singapore dollar bonds remained relatively resilient. The author argues investors should let quality carry and credit selection do more of the work, favouring higher-quality issuers and disciplined credit exposure over duration bets in the current volatile rate environment.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20BT/Singdollar%20bonds%20Let%20quality%20carry%20and%20credit%20do%20more%20of%20the%20work.pdf"}, {"id": "bt-13", "title": "Takaichi's popularity dips after prioritising controversial laws", "source": "BT", "date": "22 Jul 2026", "tags": ["Politics", "Geopolitics"], "summary": "Approval ratings for Japanese Prime Minister Sanae Takaichi fell after she pushed through divisive bills despite cost-of-living concerns. Support dropped to 53 per cent from 60 per cent in an Asahi poll, while ANN found her popularity fell over 10 points to 49.2 per cent and Mainichi recorded 41 per cent. The polls followed passage of controversial laws, including one that effectively shuts women out from inheriting Japan's Imperial throne and another criminalising desecration of the national flag. In the Asahi poll, 57 per cent said Takaichi wasn't doing enough to counter inflation. Japan's first female premier, who took office in October 2025, faces pressure as her honeymoon period closes.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20BT/Takaichi's%20popularity%20dips%20after%20prioritising%20controversial%20laws.pdf"}, {"id": "bt-14", "title": "The US Federal Reserve needs to tighten monetary policy", "source": "BT", "date": "22 Jul 2026", "tags": ["Finance & Markets", "Politics"], "summary": "Pressure on US Federal Reserve chair Kevin Warsh to tighten monetary policy has receded somewhat, this commentary observes. The June consumer price index report was benign: the overall inflation rate fell, helped by a sharp drop in petrol prices, and the core measure excluding food and energy was also much better behaved. Meanwhile, payroll employment growth stalled last month after rising briskly earlier in the year, and wage inflation sits at a level consistent with 2 per cent price inflation, given strong underlying productivity growth. Despite the easing pressure, the author argues the Fed still needs to tighten policy to keep inflation durably contained, cautioning against premature complacency about the disinflation trend.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20BT/The%20US%20Federal%20Reserve%20needs%20to%20tighten%20monetary%20policy.pdf"}, {"id": "bt-15", "title": "The risk of Model Autophagy Disorder: why firms need a Plan B for their data", "source": "BT", "date": "22 Jul 2026", "tags": ["Technology & AI"], "summary": "As businesses embed artificial intelligence deeper into daily operations, public Internet content is becoming a less reliable source for the context the technology needs, this commentary warns. Much of the Web's readily available information has already been heavily mined and fed to large language models, and a growing share of what remains is now generated by AI rather than people. Whenever the quality of the Internet's information declines, so does the reliability of AI outcomes built on top of it, a phenomenon known as Model Autophagy Disorder, where models feed on their own outputs. The author argues firms need a Plan B for sourcing trustworthy, human-generated data to sustain AI performance.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20BT/The%20risk%20of%20Model%20Autophagy%20Disorder%20why%20firms%20need%20a%20Plan%20B%20for%20their%20data.pdf"}, {"id": "bt-16", "title": "What is China's Moonshot AI and why is it roiling markets?", "source": "BT", "date": "22 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Chinese startup Moonshot AI released its Kimi K3 model on Jul 17, delivering benchmark performance that rivals top offerings from OpenAI and Anthropic and sending AI and semiconductor stocks tumbling worldwide. Investors feared China's rise could force US leaders to pull back investment, hitting demand at Nvidia, SK Hynix and Samsung Electronics. Founded in early 2023 by former Tsinghua professor Yang Zhilin, Moonshot reached a US$20 billion valuation and is raising up to US$2 billion more at a US$30 billion valuation, while dismantling its offshore structure ahead of a Hong Kong IPO. Annual recurring revenue topped US$200 million in April. Chinese models undercut US rivals aggressively on price.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20BT/What%20is%20China's%20Moonshot%20AI%20and%20why%20is%20it%20roiling%20markets.pdf"}, {"id": "scmp-01", "title": "Another 'DeepSeek moment'? What China's Kimi K3 means for the global AI industry", "source": "SCMP", "date": "22 Jul 2026", "tags": ["Technology & AI", "Finance & Markets", "Geopolitics"], "summary": "Moonshot AI's Kimi K3, a 2.8-trillion-parameter open-weight model, has revived the debate over whether China can match US frontier AI despite chip curbs, performing close to OpenAI and Anthropic systems. Banks including Morgan Stanley and Goldman Sachs call it an \"all-round catch-up\" narrowing the model gap to weeks. UBS strategist Sunil Tirumalai argues cheaper Chinese models may not cut hardware demand, since efficiency spurs wider adoption. Nomura data shows K3 costs about US$0.94 per task, near GPT-5.6. Analysts expect the main pressure to fall on model-provider margins rather than compute demand, potentially benefiting chipmakers and cloud operators. Moonshot is racing to add GPUs after K3 demand overwhelmed its capacity.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20SCMP/Another%20%E2%80%98DeepSeek%20moment%E2%80%99%20What%20China%E2%80%99s%20Kimi%20K3%20means%20for%20the%20global%20AI%20industry.pdf"}, {"id": "scmp-02", "title": "As Iran war drags on, China keeps tight grip on fuel exports despite eased curbs", "source": "SCMP", "date": "22 Jul 2026", "tags": ["Energy", "Geopolitics", "Trade"], "summary": "Beijing lifted refined fuel export restrictions this month amid high oil prices and ample reserves, but imposed compliance rules to protect domestic stockpiles, three sources said. Refiners can only ship under allocated quotas while keeping inventories above end-February levels, with quotas going mostly to state-owned refiners. Curbs began in March after the US-Israeli war on Iran. China shipped 23.6 million tonnes of fuel in the first half, down 13.2 per cent year-on-year, with April dropping nearly 38 per cent. Renewed US strikes near Abadan pushed Brent above US$90. Analysts said exports were unlikely to rebound immediately because refiners must maintain high product inventories and arrange cargo allocations.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20SCMP/As%20Iran%20war%20drags%20on,%20China%20keeps%20tight%20grip%20on%20fuel%20exports%20despite%20eased%20curbs.pdf"}, {"id": "scmp-03", "title": "As US-Chinese AI model gap narrows, what next for Washington?", "source": "SCMP", "date": "22 Jul 2026", "tags": ["Technology & AI", "Geopolitics", "Politics"], "summary": "New models from Moonshot AI and Alibaba have narrowed the US-China AI gap from months to weeks, leaving Washington's policy at a crossroads over controlling frontier models, restricting Chinese open-weight models, and driving global adoption. China continues releasing powerful open-weight models like Kimi K3 and Qwen3.8, and Xi Jinping endorsed \"inclusive\" open AI at Shanghai's WAIC, where 28 mostly Global South countries signed on. US users complain safety guard rails block routine coding tasks. The Trump administration recently forced Anthropic to suspend Fable 5 and Mythos 5 over security concerns. Officials remain divided between broad bans on Chinese models and a hands-off pro-competition approach amid persistent indecision.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20SCMP/As%20US-Chinese%20AI%20model%20gap%20narrows,%20what%20next%20for%20Washington.pdf"}, {"id": "scmp-04", "title": "Asia's oil buyers face US$100-per-barrel risk as Houthis threaten Saudi blockade", "source": "SCMP", "date": "22 Jul 2026", "tags": ["Energy", "Geopolitics", "Trade"], "summary": "Asia's oil buyers face a second chokepoint risk after Iran-aligned Houthi militants threatened a naval blockade of Saudi Arabia, while Strait of Hormuz shipping stays disrupted by the US-Iran conflict. A full closure of the Bab el-Mandeb Strait could hit about 7.4 million barrels per day, roughly 7 per cent of global output. Saudi Arabia raised Yanbu exports to about 4 million barrels daily to bypass Hormuz, with 2.5 million moving through Bab el-Mandeb. Analysts at Rystad Energy warned prices could rebound above US$100 if disruptions persist. Asia sources nearly 60 per cent of crude from the Middle East. Washington also backed tariffs of up to 100 per cent on top Russian oil buyers.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20SCMP/Asia%E2%80%99s%20oil%20buyers%20face%20US%24100-per-barrel%20risk%20as%20Houthis%20threaten%20Saudi%20blockade.pdf"}, {"id": "scmp-05", "title": "Can Beijing's stock support deliver a long bull run and fuel its high-stakes tech drive?", "source": "SCMP", "date": "22 Jul 2026", "tags": ["Finance & Markets", "Technology & AI", "Politics"], "summary": "China's rapid move to stem a stock market rout through state buying and stabilisation pledges underscores its resolve to protect tech innovation financing and safeguard over 200 million individual investors. Beijing wants a durable bull run on the US$15 trillion market to fund tech self-sufficiency via equity financing. On Tuesday the Star Market 50 Index jumped 11 per cent after five state-backed insurers pledged more equity investment and two state buyers poured about 60 billion yuan (US$8.9 billion) into stocks. Regulators aim to avoid a repeat of the 2015 boom-to-bust cycle. Analysts expect further policy support from a Politburo meeting next week, though not all interventions reliably halt falling stocks.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20SCMP/Can%20Beijing%E2%80%99s%20stock%20support%20deliver%20a%20long%20bull%20run%20and%20fuel%20its%20high-stakes%20tech%20drive.pdf"}, {"id": "scmp-06", "title": "China, Russia plan fifth rail link to keep trade chugging along in harsh winter months", "source": "SCMP", "date": "22 Jul 2026", "tags": ["Trade", "Geopolitics"], "summary": "Plans for a fifth cross-border railway linking China and Russia are advancing as Heilongjiang province issued a tender for a feasibility study and preliminary design. The line would connect Heihe with Blagoveshchensk, capital of Russia's Amur Oblast, cutting through the Amur River and reaching the Trans-Siberian Railway. It would join existing crossings at Manzhouli, Suifenhe, Tongjiang and Hunchun, overcoming road and waterway bottlenecks that constrain winter shipping. Planning follows Vladimir Putin's May visit to Beijing, when both sides agreed to add a Zabaykalsk-Manzhouli line. Sanctions-hit Moscow relies increasingly on China as an economic lifeline. First-half bilateral trade grew 25.6 per cent year-on-year to US$134.1 billion, customs data showed.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20SCMP/China,%20Russia%20plan%20fifth%20rail%20link%20to%20keep%20trade%20chugging%20along%20in%20harsh%20winter%20months.pdf"}, {"id": "scmp-07", "title": "China's Kimi K3 fuels fears safety curbs are holding back US AI", "source": "SCMP", "date": "22 Jul 2026", "tags": ["Technology & AI", "Defence", "Politics"], "summary": "Moonshot AI's new Kimi K3 rivals top US systems at spotting cybersecurity flaws, stoking fears in Washington that strict safety guard rails disadvantage American AI firms. Swiss firm Aikido Security said the 2.8-trillion-parameter open-weight model performed \"extremely close\" to OpenAI's GPT-5.6 Sol at a fraction of the cost, detecting 23 of 26 known vulnerabilities. Aikido called it the strongest open-weight model for cybersecurity. Former White House AI adviser David Sacks cited cases where US models refused to patch flaws that Kimi K3 fixed. Hugging Face reportedly turned to Zhipu's GLM-5.2 after US models refused a threat analysis. Elon Musk's xAI said it would soon finish a rival 2-trillion-parameter model.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20SCMP/China%E2%80%99s%20Kimi%20K3%20fuels%20fears%20safety%20curbs%20are%20holding%20back%20US%20AI.pdf"}, {"id": "scmp-08", "title": "China's policy playbook took its EV sector from zero to hero - can other countries follow?", "source": "SCMP", "date": "22 Jul 2026", "tags": ["Technology & AI", "Trade", "Environment"], "summary": "China's rise from automotive latecomer to EV powerhouse has prompted emerging markets to copy its state-led playbook, using incentives to build demand while localising production. Electrification lowered entry barriers by reducing the importance of engines, and China's supply chain eases component sourcing. Vietnam's VinFast became the country's bestselling brand in 2025 with 175,099 vehicles, backed by tax and land incentives. Turkey's Togg outsold Tesla and BYD domestically, while India protects local players like Tata and Mahindra with tariffs near 100 per cent. Analysts warn the model is hard to replicate: many nations depend on Chinese batteries from CATL, Gotion and others, limiting how much higher-value supply chain they can capture at home.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/22%20Jul%202026/22%20Jul%20SCMP/China%E2%80%99s%20policy%20playbook%20took%20its%20EV%20sector%20from%20zero%20to%20hero%20%E2%80%93%20can%20other%20countries%20follow.pdf"}, {"id": "scmp-09", "title": "China's youth jobless rate edges down in June for third consecutive month", "source": "SCMP", "date": "22 Jul 2026", "tags": ["Society", "Finance & Markets"], "summary": "China's urban youth unemployment rate fell for a third straight month in June, easing to 14.9 per cent for 16-to-24-year-olds excluding students, a 0.7 percentage point monthly drop, the National Bureau of Statistics said. Officials cred
