g the shift could \"intensify strategic mutual suspicion\". Anthropic's Dario Amodei recently warned open-source models could aid \"authoritarian governments\".", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20SCMP/Could%20Silicon%20Valley%E2%80%99s%20lobbying%20create%20%E2%80%98mutual%20suspicion%E2%80%99%20between%20US%20and%20China.pdf"}, {"id": "scmp-09", "title": "Democratic US states sue to challenge Trump's latest round of tariffs", "source": "SCMP", "date": "4 Aug 2026", "tags": ["Trade", "Politics"], "summary": "Twenty-five Democratic-led US states sued the Trump administration on Monday, arguing his latest tariffs on goods from 60 trading partners exceed his legal authority to tax imports. The suit, filed in the US Court of International Trade in New York, follows earlier challenges by small businesses. On July 24 the administration imposed new 10 per cent and 12.5 per cent tariffs, citing partners' alleged failure to curb forced-labour goods, just as a prior 10 per cent global tariff expired. The Supreme Court ruled in February that IEEPA does not authorise such tariffs; the new round instead invokes Section 301 of the 1974 Trade Act. Plaintiffs argue Section 301 has historically targeted specific nations, not covered over 99 per cent of imports.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20SCMP/Democratic%20US%20states%20sue%20to%20challenge%20Trump%E2%80%99s%20latest%20round%20of%20tariffs.pdf"}, {"id": "scmp-10", "title": "Iran war could still alter Beijing's policy calculus: economist", "source": "SCMP", "date": "4 Aug 2026", "tags": ["Geopolitics", "Finance & Markets"], "summary": "Prominent economist Mao Zhenhua says the US-Israel war on Iran, now in its sixth month, has had only a \"small\" impact on China but could still reshape Beijing's macroeconomic calculus and sharpen focus on domestic woes. Speaking in Hong Kong, Mao - co-director of Renmin University's Institute of Economic Research and a University of Hong Kong professor - said China faced the smallest impact among major economies, having weathered initial shocks well. He argued the economy's slowdown stemmed from internal, not external, factors, with second-quarter GDP growth at 4.3 per cent, the weakest since 2022. He expects policy \"adjustments\" in the second half, including stimulus and direct cash subsidies to households to lift weak demand and prices.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20SCMP/Iran%20war%20could%20still%20alter%20Beijing%E2%80%99s%20policy%20calculus%20economist.pdf"}, {"id": "scmp-11", "title": "Is China's climate returning to that of Tang dynasty golden age? Experts warn of a trap", "source": "SCMP", "date": "4 Aug 2026", "tags": ["Environment", "Society"], "summary": "Chinese state media have celebrated rising rainfall across arid northwest China, comparing it to the prosperous Tang dynasty \"warm period\" and promising \"climate dividends\" as greening expands farmland. Ningxia, which averages about 300mm of rain yearly, has gained roughly 12mm annually, with the vital 400mm precipitation line shifting northward. Broadcasters called it the \"restart of a millennia-long climate cycle\". Climate scientists urge caution, warning that framing it as a \"return to a golden age\" is misleading and risky for policy. Benjamin Horton of City University of Hong Kong noted rising temperatures increase evaporation, potentially offsetting rainfall gains amid persistent drought risk. On July 26, intense storms hit Guyuan, forcing evacuations - underscoring volatile extremes accompanying the warming-wetting trend.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20SCMP/Is%20China%E2%80%99s%20climate%20returning%20to%20that%20of%20Tang%20dynasty%20golden%20age%20Experts%20warn%20of%20a%20trap.pdf"}, {"id": "scmp-12", "title": "South Korea tightens grip on high-risk ETFs as investor losses mount", "source": "SCMP", "date": "4 Aug 2026", "tags": ["Finance & Markets"], "summary": "South Korea's financial authorities are weighing tighter curbs on high-risk leveraged exchange-traded funds after heavy retail losses destabilised its volatile market. Proposals include cutting the leverage ratio of single-stock ETFs and raising minimum investment requirements to deter inexperienced investors. Such products, tied to firms like Samsung Electronics or SK Hynix, use derivatives to double daily returns and magnify losses. Many investors who bought near June peaks suffered steep losses after chip shares tumbled; some reportedly lost up to 70 per cent. Economist Kim Sang-bong noted the Kospi tripled over 18 months to above 9,000 before correcting. Margin borrowing surged: investors in their 20s held 423.9 billion won by April, while those aged 70-plus jumped 224.4 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20SCMP/South%20Korea%20tightens%20grip%20on%20high-risk%20ETFs%20as%20investor%20losses%20mount.pdf"}, {"id": "scmp-13", "title": "Trump accounts were closed in 2021 over money-laundering concerns, Capital One says", "source": "SCMP", "date": "4 Aug 2026", "tags": ["Finance & Markets", "Politics"], "summary": "Capital One disclosed in a weekend court filing that it closed President Donald Trump's bank accounts in 2021 after flagging activity with \"characteristics of money laundering\", following the January 6 Capitol attack. The bank said the closures resulted from months of analysis by its anti-money-laundering team \"in accordance with bank policies and regulatory guidance\", and wants Trump's lawsuit dismissed. Trump, who sued Capital One and JPMorgan Chase for allegedly debanking him for political reasons, filed an amended complaint in July; the JPMorgan suit seeks US$5 billion. Both banks deny closing accounts politically. Trump's legal team called the conduct \"disgraceful\" but did not address the bank's internal findings. Conservatives and the crypto industry have long alleged politically motivated debanking.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20SCMP/Trump%20accounts%20were%20closed%20in%202021%20over%20money-laundering%20concerns,%20Capital%20One%20says.pdf"}, {"id": "scmp-14", "title": "Trump claims 'last chance' for Iran to strike deal in latest warning", "source": "SCMP", "date": "4 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "President Donald Trump said Monday that Iran faced its \"last chance\" to reach a deal with Washington to reopen the Strait of Hormuz and end the five-month war, warning of action \"before decapitation\". He claimed negotiations were \"going on right now\" at Iran's request, backed by Saudi Arabia, the UAE and Qatar - though Tehran denied any direct talks, saying it was negotiating only with Oman over shipping security. Trump suggested the strait could reopen \"literally by tomorrow\", outlining phases beginning with reopening and later denuclearisation. Iran's closure of the strait, which carried a fifth of global oil and LNG, has driven up energy prices. Washington enforces a maritime blockade; CENTCOM said it had redirected 44 vessels.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20SCMP/Trump%20claims%20%E2%80%98last%20chance%E2%80%99%20for%20Iran%20to%20strike%20deal%20in%20latest%20warning.pdf"}, {"id": "scmp-15", "title": "US State Department to close consulates in Canada, Japan and Indonesia, sources say", "source": "SCMP", "date": "4 Aug 2026", "tags": ["Geopolitics", "Politics"], "summary": "The US State Department has notified Congress it plans to close five foreign missions in a rare downsizing of America's diplomatic footprint, according to people familiar with the notice. The posts targeted are consulates in Nagoya, Japan; Medan, Indonesia; and Winnipeg, Canada; an embassy in St George's, Grenada; and an embassy branch office in Douala, Cameroon. The closures, not tied to a specific geopolitical event, follow earlier Trump-administration preparations to shut nearly a dozen missions; the White House budget office had sought up to 30. The department did not confirm the plan but said it was ensuring an efficient footprint. Critics warn cuts, alongside USAID's dismantling, risk ceding ground to China and Russia.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20SCMP/US%20State%20Department%20to%20close%20consulates%20in%20Canada,%20Japan%20and%20Indonesia,%20sources%20say.pdf"}, {"id": "scmp-16", "title": "US signs deal to boost Patriot and THAAD missile parts production", "source": "SCMP", "date": "4 Aug 2026", "tags": ["Defence"], "summary": "The US has signed a more than US$3 billion deal with Lockheed Martin and Northrop Grumman to ramp up production of Patriot and THAAD interceptor missile parts, as conflicts in Iran and Ukraine strain stockpiles. Announced Monday by the Pentagon and Northrop, it follows last week's contract for Lockheed worth up to US$58.6 billion to produce Patriot interceptors. The framework would let Patriot production triple and THAAD quadruple. The Centre for Strategic and International Studies estimates the US holds fewer than 1,000 Patriot and under 250 THAAD interceptors, both heavily used in the Middle East. The deal establishes a second source for PAC-3 solid rocket motors. A similar RTX deal targets 1,000 Tomahawks yearly.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20SCMP/US%20signs%20deal%20to%20boost%20Patriot%20and%20THAAD%20missile%20parts%20production.pdf"}, {"id": "scmp-17", "title": "US tech giants invited to discuss AI security tests at White House", "source": "SCMP", "date": "4 Aug 2026", "tags": ["Technology & AI", "Politics"], "summary": "Meta, Anthropic, Google and OpenAI are among tech companies invited to the White House on Tuesday to discuss a voluntary framework giving the government early access to their most advanced AI models to test hacking capabilities. Reuters reported the Trump administration has finalised voluntary cybersecurity tests and will review them this week, a cautious shift from its hands-off approach. Under details from a June executive order, firms could provide \"covered frontier models\" for up to 30 days of federal testing before trusted partners gain access. The scheme aims to identify models with advanced cyber capabilities and protect critical infrastructure, but stays voluntary and cannot license or block releases. Trump earlier dropped a longer review to avoid slowing competition with China.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20SCMP/US%20tech%20giants%20invited%20to%20discuss%20AI%20security%20tests%20at%20White%20House.pdf"}, {"id": "scmp-18", "title": "Why Chinese brokers forecast an A-share tech and chip rebound", "source": "SCMP", "date": "4 Aug 2026", "tags": ["Finance & Markets"], "summary": "Leading Chinese brokerages forecast a rebound in domestic tech and chip shares in August, distinguishing A-shares from the sharp sell-off battering South Korea. Citic Securities called the mainland move a correction after crowding into AI sectors, rather than the deleveraging shock seen in Seoul, saying the impact on non-core AI shares had \"largely subsided\". In July the Kospi lost 22 per cent, its steepest fall since the global financial crisis, while China's CSI 300 fell 7.9 per cent and the S&P 500 slipped 0.1 per cent. Citic expects a broad A-share recovery, favouring energy, non-ferrous metals and pharmaceuticals. China Securities and Huatai also see selling easing, with late August a key test as Nvidia results loom.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20SCMP/Why%20Chinese%20brokers%20forecast%20an%20A-share%20tech%20and%20chip%20rebound.pdf"}, {"id": "scmp-19", "title": "'Surprising' how quickly China's military is closing gap with US: analyst Lyle Goldstein", "source": "SCMP", "date": "4 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "Analyst Lyle Goldstein says China's military modernisation over the past decade has been \"very impressive\" and possibly \"unprecedented in its scale\", likening the accelerating pace to a car shifting into fourth gear. A senior fellow at Brown University's Watson Institute and director of Asia engagement at Defence Priorities, Goldstein says the PLA has largely achieved its goal of becoming a world-class military, though programmes like aircraft carriers remain immature. He downplays fixation on 2027, calling modernisation an ongoing process, and notes China will be far stronger by 2037. Growing capability gaps stir palpable regional anxiety, he says, urging greater transparency now that \"transparency is a luxury for the strong\". Beijing's challenge is avoiding a \"hammer looking for a nail\".", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20SCMP/%E2%80%98Surprising%E2%80%99%20how%20quickly%20China%E2%80%99s%20military%20is%20closing%20gap%20with%20US%20analyst%20Lyle%20Goldstein.pdf"}]}};</script>
