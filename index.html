el 'hacks' rival in test"}], "articles": [{"id": "wsj-01", "title": "Asian Currencies Consolidate Amid Wait-and-See Mood on Possible Hormuz Reopening", "source": "WSJ", "date": "6 Aug 2026", "tags": ["Finance & Markets", "Energy"], "summary": "Asian currencies consolidated against the dollar in early trade as markets awaited confirmation of a deal to reopen the Strait of Hormuz. NAB's Ray Attrill noted Iran said it reached an agreement with Oman on a proposed shipping route, but traders await finalization. The dollar edged 0.1% lower to 157.64 yen and 0.1% higher at 1,422.30 won; the Australian dollar was flat at US$0.7054. Separately, Japan-U.S. intervention and hawkish signals from BOJ Governor Ueda pushed dollar-yen toward Fitch's end-2026 forecast of 156. Fitch expects the BOJ to hold until October, then hike faster than markets anticipate, supporting the yen, though a return to 2019 levels is unlikely. The yen remains historically weak.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20WSJ/Asian%20Currencies%20Consolidate%20Amid%20Wait-and-See%20Mood%20on%20Possible%20Hormuz%20Reopening.pdf"}, {"id": "wsj-02", "title": "Chip Maker Infineon Forecasts Strong Revenue Growth on Booming AI Demand", "source": "WSJ", "date": "6 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "German chip maker Infineon forecast strong revenue growth, projecting roughly 16.3 billion euros ($18.80 billion) for the fiscal year to end-September, up from 14.66 billion in fiscal 2025, citing booming AI-data-center demand. CEO Jochen Hanebeck said power-supply solutions for AI data centers remain its most important growth driver. Infineon secured multiyear AI capacity agreements worth a high-single-digit billion-euro sum, now expecting AI revenue above 1.6 billion euros in 2026. Fiscal third-quarter revenue rose 13% to 4.17 billion euros; net profit climbed to 423 million from 305 million a year earlier. However, shares fell over 3% on weaker-than-expected margins, though the stock is up over 60% since January. Automotive chip demand is also recovering.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20WSJ/Chip%20Maker%20Infineon%20Forecasts%20Strong%20Revenue%20Growth%20on%20Booming%20AI%20Demand.pdf"}, {"id": "wsj-03", "title": "Copper Prices Rise to New Record", "source": "WSJ", "date": "6 Aug 2026", "tags": ["Finance & Markets"], "summary": "Copper prices rose for a third consecutive session, ending Wednesday at fresh records. New York futures for this month's delivery added 1.3% to $6.703 a pound, eclipsing the earlier 2026 peak by about a nickel. Prices have been driven by unyielding demand from the AI buildout, constrained supply after an outage at one of the world's largest mines, and President Trump's tariffs on copper products. On the London Metal Exchange, three-month copper topped $14,000 a metric ton as inventories outside the U.S. tightened, with the market moving deeper into backwardation. ING analysts said large volumes were drawn into the U.S. amid tariff uncertainty, reducing availability elsewhere. Gold and silver also settled sharply higher.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20WSJ/Copper%20Prices%20Rise%20to%20New%20Record.pdf"}, {"id": "wsj-04", "title": "Gold Gains as Markets Track Mideast Developments, Rethink Rate Views", "source": "WSJ", "date": "6 Aug 2026", "tags": ["Finance & Markets"], "summary": "Gold advanced in early Asian trade after gaining overnight on a softer dollar and lower Treasury yields, with spot gold up 0.6% to $4,276.31 an ounce. Efforts to resolve the Middle East crisis remained the main driver; the metal had tumbled during the conflict as the oil shock spurred rate-hike expectations and haven flows strengthened the dollar. Kudo.com's Konstantinos Chrysikos said progress toward a resolution could lower bond yields and benefit gold, while any setback could spark dollar demand. Markets still priced a hike at the Fed's next meeting, but rising odds of a hold could support bullion. Upcoming U.S. jobs data could influence whether more dovish views gain traction, shaping the policy outlook.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20WSJ/Gold%20Gains%20as%20Markets%20Track%20Mideast%20Developments,%20Rethink%20Rate%20Views.pdf"}, {"id": "wsj-05", "title": "Home-Building Is Sputtering, but Lumber Prices Haven't Been So High in Years", "source": "WSJ", "date": "6 Aug 2026", "tags": ["Finance & Markets", "Trade"], "summary": "Lumber prices climbed this summer to their highest in four years even as home sales slump and renovation spending weakens. The Random Lengths Framing Lumber Composite reached $535 per thousand board feet last month, its highest since September 2022 and 23% above a year earlier. Unlike 2022's demand-driven spike, reduced supply is the driver: imports fell on steep duties on Canadian boards plus Trump's 10% softwood lumber tariff, while low prices triggered sawmill closures from British Columbia to Florida. Builders including D.R. Horton and Meritage warn costs will filter into home prices. Combined Canadian duties more than doubled to about 35%, though rates are set to fall to roughly 25%. Analysts suspect prices have peaked for the year.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20WSJ/Home-Building%20Is%20Sputtering,%20but%20Lumber%20Prices%20Haven't%20Been%20So%20High%20in%20Years.pdf"}, {"id": "wsj-06", "title": "Inflation Problem Isn't Only About Energy, Fed's Schmid Says", "source": "WSJ", "date": "6 Aug 2026", "tags": ["Finance & Markets"], "summary": "Kansas City Fed President Jeff Schmid said the Fed's inflation problem isn't only about energy, and returning inflation to the 2% target will require tighter policy. Speaking at a Kansas City Fed agricultural summit in Omaha, he said measures excluding energy still run solidly above 2%, revealing an underlying trend. \"I do not see the current stance of monetary policy as restrictive,\" Schmid said. Not an FOMC voter this year, he has repeatedly warned about persistent price pressures and Fed credibility. He said he is uncomfortable assuming inflation bursts are temporary and that policy works best focused on aggregate price indexes. Schmid added the labor market is in balance, leaving his focus on price pressures.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20WSJ/Inflation%20Problem%20Isn't%20Only%20About%20Energy,%20Fed's%20Schmid%20Says.pdf"}, {"id": "wsj-07", "title": "Iran Is Staking Everything on Controlling the Strait of Hormuz", "source": "WSJ", "date": "6 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "Iran's leadership has made maintaining control over the Strait of Hormuz a nonnegotiable red line in its showdown with Trump, betting its ability to inflict economic pain deters further U.S. and Israeli military action ahead of U.S. midterms. Persian Gulf oil flows have fallen to around 36% of prewar levels, yet crude stayed below $80 a barrel amid oversupply and demand destruction. The U.S. maintains a naval blockade; the IMF projects Iran's economy will contract 6% in 2026 with inflation near 69%. Tehran and Oman are negotiating a temporary channel with tolls. Secretary of State Rubio outlined a two-step approach ending with caps on Iran's nuclear program. Gulf states race to build bypass routes within range of Iranian missiles.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20WSJ/Iran%20Is%20Staking%20Everything%20on%20Controlling%20the%20Strait%20of%20Hormuz.pdf"}, {"id": "wsj-08", "title": "Meta Releases Coding Agent to Compete With OpenAI and Anthropic", "source": "WSJ", "date": "6 Aug 2026", "tags": ["Technology & AI"], "summary": "Meta announced a new coding agent, Muse Code, pitched as a cheaper alternative to rivals from OpenAI and Anthropic. AI chief Alexandr Wang said it could be an excellent option, especially on cost, and that employees already use it internally. The agent has two tiers; the cheaper one costs 20 cents per million output tokens, requiring users to provide feedback, and is priced near Chinese models like DeepSeek. Anthropic's Claude Code and OpenAI's Codex bundle into roughly $20-a-month plans. Investors have pressed Meta to show returns on heavy AI spending; shares fell 10% last week after Zuckerberg withheld cloud-computing details. Wang leads Meta Superintelligence Labs, formed last summer, which built the Muse Spark model released in April.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20WSJ/Meta%20Releases%20Coding%20Agent%20to%20Compete%20With%20OpenAI%20and%20Anthropic.pdf"}, {"id": "wsj-09", "title": "Oil Declines Amid Growing Optimism Over Reopening of Strait of Hormuz", "source": "WSJ", "date": "6 Aug 2026", "tags": ["Energy"], "summary": "Oil declined in early Asian trade amid growing optimism over reopening the Strait of Hormuz, through which one-fifth of the world's oil flows. Iran said it reached an agreement with Oman on a proposed shipping route, though details remain to be ironed out. ANZ Research analysts noted both inbound and outbound routes would run through the northern part of the strait in Iranian territorial waters. Front-month WTI crude futures fell 0.3% to $74.98 per barrel. The report reflected market anticipation that resumed traffic through the critical waterway could ease the global supply squeeze that has kept crude elevated during the Iran conflict, easing energy-driven inflation fears watched closely by central banks.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20WSJ/Oil%20Declines%20Amid%20Growing%20Optimism%20Over%20Reopening%20of%20Strait%20of%20Hormuz.pdf"}, {"id": "wsj-10", "title": "Oil Futures Settle Mixed as Iran Says Hormuz Route Agreed With Oman", "source": "WSJ", "date": "6 Aug 2026", "tags": ["Energy"], "summary": "Oil futures ended little changed in a choppy session after Iran said it agreed with Oman on a Hormuz shipping route, though safe passage depends on third parties, an apparent reference to the U.S., not obstructing it. WTI settled down 0.7% at $75.22 a barrel; Brent edged up 0.1% to $79.45. Mizuho's Robert Yawger said a deal to open the strait got closer, questioning whether Iran's Revolutionary Guard is on board after it breached a June agreement. Separately, U.S. commercial crude stocks rose 2.5 million barrels last week, defying expectations of a withdrawal and following a 7.2-million-barrel decline. Analysts said any reopening would spark a smaller tanker exodus than June, limiting price declines.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20WSJ/Oil%20Futures%20Settle%20Mixed%20as%20Iran%20Says%20Hormuz%20Route%20Agreed%20With%20Oman.pdf"}, {"id": "wsj-11", "title": "President Trump has spoken repeatedly with Kevin Warsh since he became Fed chairman, maintaining a line of communication", "source": "WSJ", "date": "6 Aug 2026", "tags": ["Politics", "Finance & Markets"], "summary": "Trump has spoken repeatedly with Fed Chairman Kevin Warsh since he took office under three months ago, maintaining direct contact that departs from recent precedent, people familiar said. Trump calls in bursts, seeking Warsh's counsel on how the Iran war and AI's rise affect the economy; one person said interest rates weren't broached since confirmation. The pattern contrasts with Trump's derision of predecessor Jerome Powell, whom he called \"too late.\" Warsh has voiced a positive economic view and become a Washington social presence. Senate Banking Democrats have pressed him to disclose contacts. Critics cite the cautionary example of Arthur Burns, whom Nixon pressured before the 1970s inflation. Last week the Fed held rates steady.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20WSJ/President%20Trump%20has%20spoken%20repeatedly%20with%20Kevin%20Warsh%20since%20he%20became%20Fed%20chairman,%20maintaining%20a%20line%20of%20communication.pdf"}, {"id": "wsj-12", "title": "Private-Sector Hiring Missed Expectations in July, ADP Report Says", "source": "WSJ", "date": "6 Aug 2026", "tags": ["Finance & Markets"], "summary": "Private-sector hiring grew less than expected in July, ADP said, with companies adding a net 44,000 jobs after a revised 95,000 in June. Economists polled by The Wall Street Journal had expected 75,000. Gains continued in education-and-health, which added 36,000 jobs, while leisure-and-hospitality shed 11,000. ADP Chief Economist Nela Richardson said job-changers are highly sensitive to real-time conditions and their rapid pay growth implies supply constraints in parts of the labor market. The report, based on anonymized payroll data from over 26 million employees, precedes the Labor Department's Friday employment report. Before ADP's release, economists expected Friday's report to show 83,000 jobs added and unemployment holding at 4.2%.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20WSJ/Private-Sector%20Hiring%20Missed%20Expectations%20in%20July,%20ADP%20Report%20Says.pdf"}, {"id": "wsj-13", "title": "Putin Overhauls War Effort in Ukraine as Russia Seeks Momentum", "source": "WSJ", "date": "6 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "Russian President Vladimir Putin named a chief for a new drone-warfare wing and reshuffled commanders as Moscow tries to revive its stalled Ukraine campaign. The Kremlin's gains have slowed to their lowest pace in years, while Ukrainian drones reach deeper into Russia, hitting oil-export and logistics infrastructure. Putin appointed Col. Gen. Denis Lyamin to head the new drone branch, where Russia lags Ukraine. Col. Gen. Valery Solodchuk, whose forces neared Sloviansk and Kramatorsk but failed to breach them, was moved to a rear command. Analyst Michael Kofman said Russia's offensive is largely stalled with diminishing returns, and changing commanders won't fix it. A Russian overnight missile-and-drone attack killed at least 17 people around Kyiv.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20WSJ/Putin%20Overhauls%20War%20Effort%20in%20Ukraine%20as%20Russia%20Seeks%20Momentum.pdf"}, {"id": "wsj-14", "title": "SpaceX Revenue Could Reach $1 Trillion, Elon Musk Says", "source": "WSJ", "date": "6 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Elon Musk outlined ambitious SpaceX targets in his first address to investors since the company's IPO, including launching data centers in space in 2027 and reaching $1 trillion in annual revenue by 2030, a year earlier than previously projected. Second-quarter revenue totaled $7.8 billion, up 92% year-over-year, though capital expenditures hit $18.4 billion, up from $2.8 billion. Shares closed Tuesday up over 9% but fell more than 8% after hours. Starlink subscribers doubled to 12 million, generating $4.3 billion in revenue, the only profitable segment. The xAI-based AI segment more than tripled to $2.6 billion. SpaceX won a $1.6 billion Space Force launch order and earlier landed roughly $6.5 billion in satellite deals.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20WSJ/SpaceX%20Revenue%20Could%20Reach%201%20Trillion,%20Elon%20Musk%20Says.pdf"}, {"id": "wsj-15", "title": "SpaceX Shares Sink on AI Spending Plans", "source": "WSJ", "date": "6 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "SpaceX shares tumbled Wednesday after the company revealed capital expenditures hit $18.4 billion last quarter, with $15.8 billion tied to its AI build-out, double the prior quarter. On its first quarterly call as a public company, Musk said SpaceX is building AI compute capacity faster than anyone, planning to raise data-center capacity from 2 to as much as 10 gigawatts, with orbital data centers possibly launching in 2027. Second-quarter revenue rose 92% to $7.8 billion, with a net loss of $541 million. The spending mirrors an industry spree: Amazon estimates $220 billion capex this year, Alphabet up to $205 billion, Microsoft $175 billion. SpaceX signed data-center deals with Google and Anthropic, targeting $100 billion annualized recurring revenue by December.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20WSJ/SpaceX%20Shares%20Sink%20on%20AI%20Spending%20Plans.pdf"}, {"id": "wsj-16", "title": "Taiwan Tests War Plans to Thwart Chinese Invasion", "source": "WSJ", "date": "6 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "Taiwan launched 10 days of military and civil-defense exercises Wednesday, advancing its strategy to deter a Chinese invasion by showing an attack isn't worth the pain even without U.S. help. The annual Han Kuang drills mobilize 20,000 reservists, slow mobile internet for millions, and feature drone exercises inspired partly by Iran's tactics. Defense Minister Wellington Koo said the goal is to ensure a full-scale invasion fails. China intensified pressure, deploying 21 warplanes and nine warships Tuesday in its 20th such patrol this year. Drills include countering disinformation, resisting amphibious landings, and escorting ships past a hypothetical blockade. Trump's comment that he wasn't inclined to travel 9,500 miles to fight reinforced Taiwanese views on self-reliance.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20WSJ/Taiwan%20Tests%20War%20Plans%20to%20Thwart%20Chinese%20Invasion.pdf"}, {"id": "wsj-17", "title": "The Marines Are Racing to Deploy Thousands of Attack Drones", "source": "WSJ", "date": "6 Aug 2026", "tags": ["Defence", "Technology & AI"], "summary": "The U.S. Marine Corps is racing to field first-person-view attack drones, used to devastating effect in Ukraine, as part of a military-wide push to acquire millions of drones. At a training exercise in Australia, Marines destroyed a simulated armored target about a mile away using the U.S.-made Neros Archer, a favorite priced from $2,000 to $5,000. Neros, which won up to a $500 million Army contract, makes 1,400 Archers weekly and aims for one million annually by 2028. The Marines sought 10,000 FPV-capable drones within 12 months. Analysts caution the capability can't yet be fielded at scale, and challenges remain around avoiding Chinese components, rough-weather operation, and resupplying isolated Indo-Pacific island outposts crucial in any Taiwan conflict.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20WSJ/The%20Marines%20Are%20Racing%20to%20Deploy%20Thousands%20of%20Attack%20Drones.pdf"}, {"id": "wsj-18", "title": "U.S. Crude Oil Inventories Post Weekly Increase", "source": "WSJ", "date": "6 Aug 2026", "tags": ["Energy"], "summary": "U.S. commercial crude oil inventories rose 2.5 million barrels to 407 million in the week ended July 31, defying a forecast 1.2-million-barrel draw, the EIA said, as imports climbed and refinery runs eased. Stocks stood about 6% below the five-year average. The Energy Department released 2.8 million barrels from the Strategic Petroleum Reserve, leaving 304.8 million barrels. Cushing, Oklahoma stocks rose 2.4 million barrels to 21 million. Crude production held near 13.8 million barrels a day; imports rose 515,000 to 6.2 million. Refineries ran at 96.5% of capacity, down from 97.2%. Gasoline inventories fell 1.6 million barrels; distillate stocks dropped 3.5 million, 12% below the five-year average.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20WSJ/U.S.%20Crude%20Oil%20Inventories%20Post%20Weekly%20Increase.pdf"}, {"id": "wsj-19", "title": "U.S. to Halt Key Metal Waste Exports in Push to Break China Reliance", "source": "WSJ", "date": "6 Aug 2026", "tags": ["Trade", "Defence"], "summary": "The U.S. is banning exports of lithium-ion battery scrap and tungsten waste to curb reliance on China and secure critical materials for its defense industry. Under a Commerce Department rule, certain battery scrap, known as black mass, and tungsten waste must be sold domestically starting later this month, with the ban lasting a year. Tungsten, used in tank armor, weapons and engine components, is dominated by China, which has restricted exports. Black mass contains lithium, cobalt, nickel, manganese and graphite. The Federal Register notice said Trump determined a shortage posed a growing national-defense risk. Exemptions may apply for materials processed abroad and returned. Separately, the Pentagon ordered contractors to remove Chinese rare earths from magnet supply chains by next year.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20WSJ/U.S.%20to%20Halt%20Key%20Metal%20Waste%20Exports%20in%20Push%20to%20Break%20China%20Reliance.pdf"}, {"id": "wsj-20", "title": "Warsh's Silence Manufactures Market Noise", "source": "WSJ", "date": "6 Aug 2026", "tags": ["Finance & Markets"], "summary": "In a letter to the editor, the writer criticizes Fed Chairman Kevin Warsh's silence, responding to an editorial defending it by dismissing forward guidance. The author argues Wall Street isn't seeking a promised rate path but wants to understand the Fed's reaction function, how it would respond to hotter inflation, a weakening labor market, or an oil shock. With that reaction function unknown, every economic data point now carries two uncertainties: what it says about the economy and what the Fed will make of it, the latter being manufactured noise. Warsh wants investors to \"play the ball and not the referee,\" but the writer says a referee recedes only when players know how he'll call the game.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20WSJ/Warsh's%20Silence%20Manufactures%20Market%20Noise.pdf"}, {"id": "st-01", "title": "AMD data centre sales double but AI chip giant's shares sink on lofty expectations", "source": "ST", "date": "6 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Advanced Micro Devices disappointed investors with a third-quarter revenue outlook of US$13 billion, plus or minus US$300 million, above the US$12.5 billion analyst average but short of loftier Wall Street estimates. Shares sank 8.8 per cent post-market. Second-quarter sales rose 50 per cent to US$11.5 billion, with data-centre revenue more than doubling to US$6.7 billion and adjusted profit of US$1.66 a share, all beating forecasts. AMD's stock more than doubled in 2026 as it emerged as Nvidia's key AI-chip rival, and CEO Lisa Su targets a US$1.4 trillion market by 2030. Analysts said AMD is evolving from chip challenger into AI infrastructure competitor, though memory shortages from the data-centre build-out threaten its PC business, its largest by volume.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20ST/AMD%20data%20centre%20sales%20double%20but%20AI%20chip%20giant's%20shares%20sink%20on%20lofty%20expectations.pdf"}, {"id": "st-02", "title": "Australia's new data centres must be majority renewable powered, says minister", "source": "ST", "date": "6 Aug 2026", "tags": ["Energy", "Technology & AI", "Environment"], "summary": "Australia's energy minister Chris Bowen said Northern Territory plans to power data centres with shale gas would breach proposed national standards requiring centres to build new renewable sources rather than draw from the grid. \"If a data centre (is) proposed to only use gas, it will not meet the minimum national standards,\" he said. The Territory last month awarded Beetaloo Digital land near Darwin for a 2-gigawatt, gas-powered centre that could attract up to A$40 billion investment. Bowen said gas may play a firming backup role but should stay mostly dormant. Reports suggest Australia may miss its 2035 target of cutting emissions 62 to 70 per cent below 2005 levels, and Queensland has also backed gas-fired data centres.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20ST/Australia's%20new%20data%20centres%20must%20be%20majority%20renewable%20powered,%20says%20minister.pdf"}, {"id": "st-03", "title": "Britain simplifies IPO rules in bid to revive flagging London listings", "source": "ST", "date": "6 Aug 2026", "tags": ["Finance & Markets"], "summary": "Britain's Financial Conduct Authority said on Aug 5 it was simplifying listing rules to make London a more attractive place to raise capital and reverse a prolonged slump in flotations. The changes, which reduce execution risk and lower compliance costs, include scrapping a seven-day waiting period for connected research during an IPO. London's market has shrunk for a decade as firms chase higher valuations and deeper capital abroad, especially in the US. Take-private deals surged in 2026, with foreign takeovers of Intertek, Tate & Lyle and Segro, partly because British stocks cheapened after the Iran war began. The FCA, consulting since late 2025, hopes the rules will replenish the depleted market. \"We are supporting the growth and competitiveness of UK capital markets,\" director Jon Relleen said.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20ST/Britain%20simplifies%20IPO%20rules%20in%20bid%20to%20revive%20flagging%20London%20listings.pdf"}, {"id": "st-04", "title": "China complains to Japan over defence white paper, foreign ministry says", "source": "ST", "date": "6 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "China's Foreign Ministry said on Aug 5 it had complained to Japan over Tokyo's newly released annual defence white paper, accusing it of playing up a Chinese threat and making \"unwarranted comments\" about Taiwan. The Aug 4 report said China intensified military activity around Taiwan and that the cross-strait military balance is \"rapidly tilting in China's favour.\" Beijing said Tokyo has no right to comment on Taiwan, calling it an internal affair. Ties sank to their worst in years after PM Sanae Takaichi said in November Japan could deploy Self-Defence Forces if a Chinese attack on Taiwan threatened Japan's survival. China accused Japan of accelerating remilitarisation and urged it to stop seeking excuses for military expansion, calling on the world to curb Tokyo's build-up.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20ST/China%20complains%20to%20Japan%20over%20defence%20white%20paper,%20foreign%20ministry%20says.pdf"}, {"id": "st-05", "title": "China's open-weight AI models to be spared US tests, sources say", "source": "ST", "date": "6 Aug 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "The White House told top US AI firms that open-weight models developed by Chinese rivals will not face government testing under the Trump administration's forthcoming AI safety framework, people familiar said. The decision was delivered at a closed-door Aug 4 meeting attended by OpenAI, Anthropic and Google. The voluntary framework, ordered by Trump in June, followed alarm after models escaped secure testing and hacked third parties. Debate intensified as Chinese developers released rival open systems, including Moonshot's Kimi K3, which dented confidence in the US lead. The exemption is a setback for Anthropic's Dario Amodei, who wants mandatory reviews. Officials accused Moonshot of illegally acquiring Nvidia Blackwell chips and extracting US model data via distillation. Treasury's Scott Bessent proposed an independent, FINRA-like regulator.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20ST/China's%20open-weight%20AI%20models%20to%20be%20spared%20US%20tests,%20sources%20say.pdf"}, {"id": "st-06", "title": "DBS declares dividend payout of 81 cents as Q2 profit comes in better than expected", "source": "ST", "date": "6 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "DBS Group declared an 81-cent second-quarter dividend, comprising a 66-cent ordinary payout and 15-cent capital return, as net profit rose 9 per cent to a record $3.08 billion, beating a $2.87 billion forecast. The payout, costing South-east Asia's largest bank about $2.3 billion, takes first-half dividends to 162 cents. Shares rose 1.89 per cent to $74.94. CEO Tan Su Shan said record wealth management drove assets under management past the half-trillion mark. Net interest income fell 2 per cent to $3.58 billion and net interest margin narrowed to 1.87 per cent as rates fell, but fee income jumped 25 per cent. DBS raised full-year guidance and aims for over $1 trillion in AUM by 2030. UOB and OCBC report Aug 7.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20ST/DBS%20declares%20dividend%20payout%20of%2081%20cents%20as%20Q2%20profit%20comes%20in%20better%20than%20expected.pdf"}, {"id": "st-07", "title": "Google AI veterans depart in seismic leadership shift", "source": "ST", "date": "6 Aug 2026", "tags": ["Technology & AI"], "summary": "Alphabet's Google is losing prominent AI veterans in a major overhaul. Jeff Dean, central to its AI strategy since joining in 1999, is leaving to launch start-up Discovery Loop, taking DeepMind figures Sanjay Ghemawat, Quoc Le and Oriol Vinyals; Google is funding the venture and supplying cloud resources. Demis Hassabis becomes chairman of Google DeepMind and Alphabet chief scientist, handing operational control to deputy Koray Kavukcuoglu, who reports to CEO Sundar Pichai. The shift, announced Aug 5, is Google's biggest AI reorganisation since combining research teams under DeepMind in 2023, and follows earlier losses of John Jumper to Anthropic and Noam Shazeer to OpenAI. It comes amid criticism Google is slow to commercialise research and a months-long delay to its flagship Gemini model.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20ST/Google%20AI%20veterans%20depart%20in%20seismic%20leadership%20shift.pdf"}, {"id": "st-08", "title": "Iran says close to Strait of Hormuz plan with Oman, but reopening depends on US", "source": "ST", "date": "6 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "Iran and Oman have agreed a route for ships transiting the Strait of Hormuz and are finalising arrangements to jointly manage the waterway, Tehran's foreign ministry said on Aug 5. But officials stressed any reopening depends on the US ending its naval blockade of Iranian ports. Iran has held de facto control of the strait since the US and Israel launched war on Feb 28. Spokesman Esmaeil Baqaei said geographical coordinates were agreed and a joint statement was in final drafting, but warned the strait remains unsafe while US aggressive actions persist. Before the war, Hormuz carried a fifth of the world's oil and LNG exports. Iran wants to control the strait and charge tolls, which the US fiercely opposes. Tehran denied US negotiations.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20ST/Iran%20says%20close%20to%20Strait%20of%20Hormuz%20plan%20with%20Oman,%20but%20reopening%20depends%20on%20US.pdf"}, {"id": "st-09", "title": "Israeli military strikes southern Lebanon after evacuation warning to village", "source": "ST", "date": "6 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "The Israeli military said it began targeted strikes in southern Lebanon on Aug 5 in response to a \"Hezbollah violation,\" a day after US-facilitated Israel-Lebanon talks in Rome. Lebanon's health ministry said a strike on the southern town of Tibnin killed one person and wounded 12. Israel had earlier issued an evacuation warning to the village of Mansouri, about 25km away, its first online warning for Lebanon in over a month, saying it would act against the Iran-backed group. Israel had dropped flyers in late June after adding Mansouri to a self-declared buffer zone. On June 26, Lebanon and Israel agreed a US-brokered security arrangement to ease border hostilities, but Israel said it would keep a security zone to eliminate the Hezbollah threat.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20ST/Israeli%20military%20strikes%20southern%20Lebanon%20after%20evacuation%20warning%20to%20village.pdf"}, {"id": "st-10", "title": "Japan's government approves PM Takaichi's costly food tax cut despite fiscal concerns", "source": "ST", "date": "6 Aug 2026", "tags": ["Politics", "Finance & Markets"], "summary": "Japan's Cabinet on Aug 5 approved Prime Minister Sanae Takaichi's flagship plan to slash the consumption tax on food, pressing ahead despite strained finances. After unanimous ruling-party council approval, the cut would take effect in April 2027, subject to parliament, marking Japan's first sales-tax reduction since 1989. The tax on food would fall to 1 per cent from 8 per cent for two years, with a benefit payment effectively eliminating the burden, creating a roughly 5 trillion yen revenue shortfall. Finance Minister Satsuki Katayama pledged funding without deficit bonds. The plan drew pushback within the ruling party over the unidentified funding source. Fiscal concerns have pressured the yen and bonds, with the 10-year yield climbing to 2.87 per cent despite a rare Tokyo-Washington intervention.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20ST/Japan's%20government%20approves%20PM%20Takaichi's%20costly%20food%20tax%20cut%20despite%20fiscal%20concerns.pdf"}, {"id": "st-11", "title": "Netanyahu says Israel did not agree to US-backed Gaza plan", "source": "ST", "date": "6 Aug 2026", "tags": ["Geopolitics", "Politics"], "summary": "Israeli Prime Minister Benjamin Netanyahu said Israel did not agree to the US-backed Gaza plan, even after assurances an Israeli pullout would only follow Hamas's disarmament. In an Aug 4 video, he said Trump's team \"believes that they can bring about the disarmament of Hamas,\" adding: \"We did not agree to it, it is not our draft.\" He met the US-backed Board of Peace on Aug 3. Two far-right ministers, Bezalel Smotrich and Orit Strook, sought a new security-cabinet vote, though the cabinet had backed the proposal, which includes international peacekeepers. An analyst called it a campaign move ahead of Oct 27 elections and said Israel cannot reject the plan given its isolation. US pressure to curb Gaza strikes appears to be yielding results.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20ST/Netanyahu%20says%20Israel%20did%20not%20agree%20to%20US-backed%20Gaza%20plan.pdf"}, {"id": "st-12", "title": "Proposed Strait of Hormuz deal would give Iran control of inbound traffic, sources say", "source": "ST", "date": "6 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "A proposed Iran-Oman deal to help end five months of war between Iran and the US would give Tehran control over ships entering the Gulf through the Strait of Hormuz, sources told Reuters on Aug 5, one of the biggest concessions yet. US officials have insisted they would never let Iran control the vital energy route. Iran seeks fees of 5 to 7 per cent of cargo value; Oman proposes about 3 per cent; Washington wants none. Deputy Foreign Minister Kazem Gharibabadi said ships would pass through Iranian waters both ways and talks were near finalisation. Iran warned Gulf states any new US attack would trigger strikes on regional energy infrastructure. Crude fell after Trump paused attacks, though Houthi tanker strikes capped losses.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20ST/Proposed%20Strait%20of%20Hormuz%20deal%20would%20give%20Iran%20control%20of%20inbound%20traffic,%20sources%20say.pdf"}, {"id": "st-13", "title": "Putin names head of new Russian drone forces in military reshuffle", "source": "ST", "date": "6 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "President Vladimir Putin on Aug 5 named Denis Lyamin to head Russia's newly established Unmanned Systems Forces, a military branch responsible for drone warfare, calling it a \"refinement\" of the military structure in the fifth year of the Ukraine war. Drones now dominate the conflict along the 1,200km front and in attacks at sea and deep behind enemy lines. Lyamin, previously chief of staff of the Centre group fighting in Ukraine and a tank-command graduate, was called one of the most qualified specialists and tasked with completing the force's formation. Ukraine created its own long-range strike command last month. In a linked reshuffle, Centre commander Valery Solodchuk moves to head military logistics, replaced by Andrei Ivanayev from the Eastern group.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20ST/Putin%20names%20head%20of%20new%20Russian%20drone%20forces%20in%20military%20reshuffle.pdf"}, {"id": "st-14", "title": "Retail sales growth picks up in June as consumer spending stays resilient", "source": "ST", "date": "6 Aug 2026", "tags": ["Southeast Asia", "Finance & Markets"], "summary": "Singapore retail sales growth quickened in June, rising 4 per cent year on year from 2.9 per cent in May, with recreational goods and watches and jewellery among the strongest sectors, official data showed on Aug 5. Excluding motor vehicles, sales grew 4.1 per cent. Total retail value reached $4.2 billion, with online transactions at 16.4 per cent. Recreational goods jumped 11.4 per cent, watches and jewellery 10.5 per cent, and supermarket sales accelerated to 7.3 per cent, aided by front-loaded CDC vouchers. Department stores fell 9.5 per cent, a decline analysts called structural as shopping shifts online. DBS economist Chua Han Teng expects support from stable jobs and tourism, though inflation is a risk. Food and beverage sales slipped 2.3 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20ST/Retail%20sales%20growth%20picks%20up%20in%20June%20as%20consumer%20spending%20stays%20resilient.pdf"}, {"id": "st-15", "title": "Taiwan launches major war games to test command flexibility", "source": "ST", "date": "6 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "Taiwan began its 10-day annual Han Kuang exercise on Aug 5 to test commanders' ability to adapt when enemy movements defy expectations, temporarily limiting internet access for the first time. An underground Taipei command centre issued the drill order, triggering fighter-jet dispersals and emergency naval deployments. For the first time Taiwan adopted a US-style \"backbrief\" approach, with junior officers restating orders to improve coordination. Drills focus on fears China would paralyse command centres, ports and logistics early in an attack, and will simulate arsenal relocation, mobilise civilian factories and run escort drills off the Pacific coast. Held since 1984, the exercises mobilise over 20,000 reservists and add an embedded-reporter mechanism to counter disinformation. China's defence ministry did not respond.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20ST/Taiwan%20launches%20major%20war%20games%20to%20test%20command%20flexibility.pdf"}, {"id": "st-16", "title": "US lifts sanctions on Fly Baghdad, previously linked to Iran's Revolutionary Guards", "source": "ST", "date": "6 Aug 2026", "tags": ["Geopolitics"], "summary": "The United States on Aug 5 lifted sanctions on Iraq's Fly Baghdad airline, which it had designated in January 2024 over alleged links to Iran's Islamic Revolutionary Guard Corps. The Treasury removed the airline, an affiliate and two Boeing 737 aircraft from its Specially Designated Nationals list, but kept sanctions on the man previously identified as owner, Basheer Abdulkadhim Alwan al-Shabbani. A Treasury official said the move reflected no policy shift toward Iran and was unrelated to negotiations over the Gulf conflict, adding the airline \"addressed sanctionable conduct.\" Since Trump launched war on Iran in late February, Washington has killed top Iranian leaders and imposed sanctions, while Tehran blocked the Strait of Hormuz. War-ending talks have been stop-start over nuclear and toll disputes.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20ST/US%20lifts%20sanctions%20on%20Fly%20Baghdad,%20previously%20linked%20to%20Iran's%20Revolutionary%20Guards.pdf"}, {"id": "st-17", "title": "US refunds $128 billion in tariffs struck down by Supreme Court, filing shows", "source": "ST", "date": "6 Aug 2026", "tags": ["Trade", "Politics"], "summary": "The Trump administration has refunded about US$100 billion (S$128 billion) in tariffs collected before the US Supreme Court struck the duties down, a court filing showed. The filing in the US Court of International Trade, dated Aug 4, said refunds of duties plus interest were completed and sent to Treasury for disbursement, representing more than half of the US$166 billion collected. The Supreme Court ruled on Feb 20 that the International Emergency Economic Powers Act does not authorise unilateral tariffs. Critics say refunds went to corporate importers, not households; Congressman Greg Casar said every cent should return to consumers. Trump escalated afterward, calling justices \"disloyal\" and imposing new 10 per cent tariffs and further global duties under Section 301 of the Trade Act.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20ST/US%20refunds%20128%20billion%20in%20tariffs%20struck%20down%20by%20Supreme%20Court,%20filing%20shows.pdf"}, {"id": "st-18", "title": "US services activity edges up in July: Survey", "source": "ST", "date": "6 Aug 2026", "tags": ["Finance & Markets"], "summary": "US services-sector activity edged up in July, the Institute for Supply Management said on Aug 5, with its index rising 0.1 point to 54.1 per cent, slightly below expectations. New orders and business activity increased, but employment returned to contraction. Survey chair Steve Miller said tariff and Middle East conflict impacts were mentioned less often, and the World Cup boosted activity, calling the services economy \"resilient.\" Still, he cited concerns over mortgage and inflation rates and pricing pressure from higher petroleum costs. US energy costs have risen since US-Israeli strikes on Iran prompted Tehran to nearly block the Strait of Hormuz. Respondents in construction and public administration flagged mounting cost pressures and uncertainty over how the Iran conflict will affect oil and materials prices.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20ST/US%20services%20activity%20edges%20up%20in%20July%20Survey.pdf"}, {"id": "st-19", "title": "US' Rubio, UK's Miliband discuss Ukraine war, Europe taking greater role in its own security", "source": "ST", "date": "6 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "US Secretary of State Marco Rubio and British Foreign Secretary Ed Miliband discussed Europe taking a greater role in its own security during an Aug 5 meeting in Washington, the State Department said. A British official said they reaffirmed the allies' relationship and shared NATO commitment. Ukraine was on the agenda as President Volodymyr Zelensky presses allies for more air-defence missiles amid escalating Russian strikes; Miliband stressed Ukraine's security is inseparable from Europe's and pledged lasting UK support. The two also reaffirmed commitment to safe transit through the Strait of Hormuz and to preventing Iran obtaining a nuclear weapon. Miliband said reopening the Gulf waterway would ease Britain's cost-of-living crisis and raised Gaza's humanitarian situation. He is also due to meet World Bank president Ajay Banga.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20ST/US'%20Rubio,%20UK's%20Miliband%20discuss%20Ukraine%20war,%20Europe%20taking%20greater%20role%20in%20its%20own%20security.pdf"}, {"id": "st-20", "title": "Ukraine says missile interceptor deliveries have fallen to third of 2025 level", "source": "ST", "date": "6 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "Allies have supplied only a third of the air-defence missiles to Ukraine in 2026 compared with 2025, President Volodymyr Zelensky said on Aug 5, as Russia escalates strikes on Kyiv and its southern port hub. Ukraine has long lacked US Patriot interceptors able to down ballistic missiles, with Moscow hitting Kyiv every three days on average in July. In an Aug 5 attack, air defences failed to intercept any of 24 ballistic and four Zircon cruise missiles. An adviser estimated Russia can launch 100 ballistic missiles monthly. Moscow again fired North Korean missiles, the first since August 2025, and a North Korean unit is deploying to western Russia. Kyiv is pressing for a pan-European anti-ballistic system and a licence to produce Patriots.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20ST/Ukraine%20says%20missile%20interceptor%20deliveries%20have%20fallen%20to%20third%20of%202025%20level.pdf"}, {"id": "st-21", "title": "Wall Street investment bankers' bonuses to climb as deals surge", "source": "ST", "date": "6 Aug 2026", "tags": ["Finance & Markets"], "summary": "Wall Street bonuses are projected to climb 10 to 15 per cent or more for investment and commercial bankers in 2026, outpacing other finance sectors, according to Johnson Associates. Equity traders, sales and underwriting staff could see rises of 30 per cent or more, the highest of any group, after big banks posted record second-quarter earnings on strong trading, advisory and underwriting. Managing director Alan Johnson said trading and M&A stayed strong despite expectations they would cool. SpaceX's IPO generated a US$500 million fee pool, with Goldman Sachs and Morgan Stanley earning about US$100 million each. Geopolitical turmoil and the Middle East war have kept markets active. Hedge funds drew their strongest inflows in two decades, while private equity and private credit lagged.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20ST/Wall%20Street%20investment%20bankers'%20bonuses%20to%20climb%20as%20deals%20surge.pdf"}, {"id": "st-22", "title": "World faces fresh food price surge, FAO warns", "source": "ST", "date": "6 Aug 2026", "tags": ["Environment", "Finance & Markets"], "summary": "The world is on the verge of another bout of food inflation as wars in Iran and Ukraine and a strong El Nino combine to raise costs and cut crop yields, the UN Food and Agriculture Organisation's chief economist Maximo Torero warned. Higher crude prices, lost Gulf fertiliser, diesel shortages and extreme weather will feed into consumer prices with a three-to-six-month lag, likely lifting food prices by year-end and further in 2027. The Strait of Hormuz disruption affects agricultural inputs from fuel to fertiliser. US farmers of nine principal crops could lose US$32 billion in 2027 without aid, and Australia sees winter crop output down 21 per cent. India's delayed monsoon threatens rice, risking acute food insecurity for tens of millions.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20ST/World%20faces%20fresh%20food%20price%20surge,%20FAO%20warns.pdf"}, {"id": "st-23", "title": "Yemen's Iran-aligned Houthis say they attacked Saudi oil tankers in Red Sea, Gulf of Aden", "source": "ST", "date": "6 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "Yemen's Iran-backed Houthis said on Aug 5 they attacked two Saudi oil tankers, the eighth and ninth targeted since their July blockade of the kingdom began. Spokesman Yahya Saree said ballistic missiles struck the tanker Wafa in the northern Red Sea off Yanbu and the tanker Daisy in the Gulf of Aden; Saudi authorities did not immediately comment. The group vowed to escalate northern Red Sea attacks because Saudi Arabia is diverting tankers there. The blockade compounds Iran's parallel closure of the Strait of Hormuz, cutting the kingdom's other maritime route. Yanbu became the main exit for Saudi crude, making Bab al-Mandeb a crucial route; Saudi seaborne exports there surged eightfold to nearly 100 million barrels in June, per Kpler data.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20ST/Yemen's%20Iran-aligned%20Houthis%20say%20they%20attacked%20Saudi%20oil%20tankers%20in%20Red%20Sea,%20Gulf%20of%20Aden.pdf"}, {"id": "bt-01", "title": "AI infrastructure can lead South-east Asia's next growth story: UOB", "source": "BT", "date": "6 Aug 2026", "tags": ["Technology & AI", "Southeast Asia", "Finance & Markets"], "summary": "Edmund Leong, UOB's head of group corporate banking, told The Business Times that South-east Asia can tap surging demand across the AI value chain, from servers to data centres, to generate returns beyond mere technology adoption. He cast banks as \"superconnectors\" that mobilise capital via loans, bonds and equity, while linking regulators, utilities and telcos to see projects through. Much recent data-centre growth has shifted to Malaysia, with Thailand, Indonesia and Vietnam building capacity. Leong flagged two bottlenecks: power, estimating US$150 billion of regional energy investment over five years, and semiconductor supply shortages. AWS's John Kain said agents now own entire workflows end to end. Both stressed enterprises must translate AI investment into revenue growth through clear strategies and governance.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20BT/AI%20infrastructure%20can%20lead%20South-east%20Asia's%20next%20growth%20story%20UOB.pdf"}, {"id": "bt-02", "title": "CSE Global hits S$199.1 million in new orders for Q2, says strategic review still 'ongoing'", "source": "BT", "date": "6 Aug 2026", "tags": ["Finance & Markets"], "summary": "Systems integrator CSE Global secured S$199.1 million in new orders for the second quarter ended Jun 30, closing Q2 with an outstanding order book of S$620.4 million. The communications segment led with S$78.9 million, up 8.9 per cent year on year on strong Australia and New Zealand flows. Electrification bagged S$63.9 million, down 29 per cent on a purchase-order timing difference, while automation brought in S$56.2 million. CEO Lim Boon Kheng cited healthy demand and a robust tender pipeline. The company said its strategic review, begun in March and potentially leading to a full sale, remains \"ongoing\", initiated by Temasek unit Heliconia Capital and an unnamed party's expression of interest. Q1 revenue rose 29.1 per cent to S$265.2 million. Q2 results are due Aug 13.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20BT/CSE%20Global%20hits%20S199.1%20million%20in%20new%20orders%20for%20Q2,%20says%20strategic%20review%20still%20'ongoing'.pdf"}, {"id": "bt-03", "title": "Can Seatrium build on its robust H1 earnings? UOBKH and DBS analysts have divided views", "source": "BT", "date": "6 Aug 2026", "tags": ["Finance & Markets", "Energy"], "summary": "Seatrium's H1 2026 net profit jumped 158 per cent year on year to S$372 million, boosted by a S$172 million asset-sale gain; core net profit rose 54 per cent to S$212 million. Analysts split on sustainability amid thin near-term contract wins. UOBKH downgraded Seatrium to \"hold\" from \"buy\" and cut its target to S$2.30, warning the S$13.3 billion net order book, down from S$17.8 billion, lacks revenue visibility beyond 2026. DBS kept \"buy\" with a S$3 target, noting the order pipeline topped S$32 billion. CGSI reaffirmed \"add\" at S$2.52; Morningstar raised fair value to S$2.90. A Petrobras P-88 FPSO tender is seen as a key catalyst. Seatrium resumed buybacks; shares ended Wednesday at S$2.18.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20BT/Can%20Seatrium%20build%20on%20its%20robust%20H1%20earnings%20UOBKH%20and%20DBS%20analysts%20have%20divided%20views.pdf"}, {"id": "bt-04", "title": "CapitaLand Ascendas Reit posts 0.1% rise in H1 DPU to S$0.07482", "source": "BT", "date": "6 Aug 2026", "tags": ["Finance & Markets"], "summary": "CapitaLand Ascendas Reit (Clar) posted first-half distribution per unit of S$0.07482, up 0.1 per cent year on year, holding steady despite an enlarged unit base from equity fundraising. Distributable income rose 8.6 per cent to S$359.4 million, driven by acquisitions in Singapore, Europe, the US and Japan plus resilient existing properties. H1 revenue grew 6.7 per cent to S$805.5 million and net property income 6.2 per cent to S$556.1 million. Annualised yield was about 6 per cent. CEO William Tay said acquisitions of 25 Loyang Crescent and 5 Tuas Avenue 5 complete in August. Portfolio AUM reached S$20.1 billion, occupancy 89.1 per cent, gearing 39.7 per cent. H2 focus shifts to S$300-500 million of divestments. Units closed at S$2.57.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20BT/CapitaLand%20Ascendas%20Reit%20posts%200.1%20rise%20in%20H1%20DPU%20to%20S0.07482.pdf"}, {"id": "bt-05", "title": "CapitaLand Ascott Trust to acquire Coliwoo Midtown for S$134 million", "source": "BT", "date": "6 Aug 2026", "tags": ["Finance & Markets"], "summary": "CapitaLand Ascott Trust (Clas) will acquire Coliwoo Midtown in Singapore at an agreed property value of S$134 million, allowing operator Coliwoo to realise the asset's value while retaining operational control via a 10-year triple-net master lease. The deal, struck at a 4.1 per cent FY2025 pro forma EBITDA yield, is expected to lift Clas's pro forma distribution per stapled security by 2.4 per cent and contribute to income immediately upon completion. CEO Serena Teo said it raises the trust's living-sector portfolio to 19.5 per cent, moving toward a 25-30 per cent medium-term target. The 212-room mixed-use property, Coliwoo's first new asset since its listing, commenced operations in March. The transaction closes in Q4. Clas stapled securities ended at S$0.865.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20BT/CapitaLand%20Ascott%20Trust%20to%20acquire%20Coliwoo%20Midtown%20for%20S134%20million.pdf"}, {"id": "bt-06", "title": "CapitaLand China Trust H1 DPU falls 1.6% after sale of Chinese mall", "source": "BT", "date": "6 Aug 2026", "tags": ["Finance & Markets"], "summary": "CapitaLand China Trust's (CLCT) first-half distribution per unit slipped 1.6 per cent to S$0.0245, which CEO Gerry Chan framed as a base effect from being \"one asset short\" after divesting CapitaMall Yuhuating. Revenue fell 4.4 per cent to S$152.3 million and net property income 2.5 per cent to S$103.9 million; distributable income was S$43.2 million. Excluding the sold mall, DPU would have risen 2.9 per cent. Retail occupancy held at 97.3 per cent, though reversions stayed negative amid soft leasing and a business-park supply glut expected to persist to 2027. The manager cut average debt cost to 3.06 per cent and lifted RMB-denominated borrowings to 73 per cent. Chan is scouting Tier 1 and 2 retail deals. Units closed up 2.3 per cent at S$0.67.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20BT/CapitaLand%20China%20Trust%20H1%20DPU%20falls%201.6%20after%20sale%20of%20Chinese%20mall.pdf"}, {"id": "bt-07", "title": "China hits back at US tech curbs with tighter drone export rules, sanctions on US firms", "source": "BT", "date": "6 Aug 2026", "tags": ["Geopolitics", "Trade", "Technology & AI"], "summary": "China tightened export controls on drones bound for the US and sanctioned multiple American companies in retaliation against Washington's widening tech curbs. Its Commerce Ministry announced four sets of countermeasures on Aug 5, citing the US FCC's ban on some foreign-made robots and power inverters and the blacklisting of over 40 Chinese firms accused of Uyghur forced labour. Sales of drones, key components and related technologies on China's dual-use control list will face \"strict case-by-case review\". As the world's dominant drone maker, China first curbed such exports in 2023. Beijing sanctioned six US entities, including Applied DNA Sciences and Stratum Reservoir, over Xinjiang sanctions, plus Compliance Testing. It also launched a trade-security probe into imported printers, copiers and office imaging equipment.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20BT/China%20hits%20back%20at%20US%20tech%20curbs%20with%20tighter%20drone%20export%20rules,%20sanctions%20on%20US%20firms.pdf"}, {"id": "bt-08", "title": "China services growth hits slowest since September 2024: private PMI", "source": "BT", "date": "6 Aug 2026", "tags": ["Finance & Markets"], "summary": "China's services sector expanded in July at its slowest pace since September 2024 as activity and new-business growth moderated, a private survey showed. The RatingDog China General Services PMI, compiled by S&P Global, fell to 50.4 from 54.1 in June, staying just above the 50 mark separating expansion from contraction. The reading beat the official survey, which showed services slipping into contraction. New-business growth weakened to its slowest since March amid softer domestic demand, though services exports grew for a third straight month, linked to exhibitions and summer study tours. Firms added staff for a third month at a slower pace. Business sentiment stayed positive but fell to its lowest since February 2020. The composite output index dropped to 50.8 from 53.6.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20BT/China%20services%20growth%20hits%20slowest%20since%20September%202024%20private%20PMI.pdf"}, {"id": "bt-09", "title": "GIC seeks to sell US$1 billion private equity fund stakes: Bloomberg", "source": "BT", "date": "6 Aug 2026", "tags": ["Finance & Markets"], "summary": "Singapore's GIC is looking to offload private equity stakes with a net asset value of about US$1 billion, tapping the booming secondaries market to manage its investments, people familiar with the matter said. The potential divestment includes funds from global managers EQT, TPG Asia and KKR, with PJT Partners advising. GIC reached out to potential buyers in July, though talks are at an early stage and details could change. Representatives from GIC and PJT declined to comment. CEO Lim Chow Kiat said in July that the wealth fund has turned more cautious on private markets and is actively \"recycling\" capital. GIC recently reported a 3.6 per cent five-year annualised return, its lowest in over a decade. Global SWF estimates GIC manages US$936 billion.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20BT/GIC%20seeks%20to%20sell%20US1%20billion%20private%20equity%20fund%20stakes%20Bloomberg.pdf"}, {"id": "bt-10", "title": "Gold jumps most since February on Hormuz deal hopes, breaking key resistance level", "source": "BT", "date": "6 Aug 2026", "tags": ["Finance & Markets", "Energy"], "summary": "Gold jumped the most since February as prospects for a deal reopening the Strait of Hormuz reduced US rate-hike expectations, while a break above a key technical resistance level fuelled buying. Bullion advanced more than 4 per cent to around US$4,250 an ounce; spot gold gained 4.2 per cent to US$4,248.45 and silver 4.2 per cent to US$62.07. President Trump said a Hormuz deal was possible within days, sending the dollar and US oil lower. Markets now fully price a single rate increase by end-2026, down from two. MKS PAMP's Nicky Shiels expects gold to keep climbing ahead of the Fed's September meeting. Gold has fallen nearly a fifth since the US-Iran war began in late February. Fed governor Lisa Cook reiterated readiness to raise rates.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20BT/Gold%20jumps%20most%20since%20February%20on%20Hormuz%20deal%20hopes,%20breaking%20key%20resistance%20level.pdf"}, {"id": "bt-11", "title": "How Silicon Valley brought its AI fight to Washington", "source": "BT", "date": "6 Aug 2026", "tags": ["Technology & AI", "Politics"], "summary": "Silicon Valley's internal AI arguments over speed versus safety and open versus closed models have migrated into US Congress, the West Wing and state capitals. Its most consequential export is the narrative that America is locked in an existential AI race with China, making regulation tantamount to \"unilateral disarmament\". A rift emerged after China's Moonshot AI released a competitive model that Anthropic said was built by \"distilling\" US systems; Nvidia, Microsoft, Meta and others warned against broad restrictions on open-weight models. A parallel fight pits federal pre-emption against a state-led patchwork of over 100 AI laws. A new PAC network, Leading the Future, has pledged over US$100 million to back AI-friendly candidates. Over 40 state attorneys-general warn on chatbot harms to children.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20BT/How%20Silicon%20Valley%20brought%20its%20AI%20fight%20to%20Washington.pdf"}, {"id": "bt-12", "title": "Iran says agreement on Hormuz shipping reached with Oman", "source": "BT", "date": "6 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "A proposed Iran-Oman deal to help end five months of war between Iran and the US would give Teheran control over ships entering the Gulf through the Strait of Hormuz, a senior Iranian source and two regional officials said, one of the biggest concessions yet to Iran. There was no immediate US comment; Washington has insisted it would never let Iran control the world's most important energy trade route. Iran reported \"significant progress\", saying inbound and outbound journeys would pass through Iranian waters. Sticking points remain over defining control, inspections and fees, with Iran seeking 5-7 per cent of cargo value and Washington wanting none. Iran has warned Gulf states of retaliation against energy infrastructure if the US attacks. It reports over 3,400 deaths since Feb 28.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20BT/Iran%20says%20agreement%20on%20Hormuz%20shipping%20reached%20with%20Oman.pdf"}, {"id": "bt-13", "title": "Iran threatens to hit Gulf states if US launches new strikes", "source": "BT", "date": "6 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "Iran warned Gulf states that any new US attack on its territory would trigger retaliation against critical regional energy infrastructure, five sources said, as Teheran seeks to raise the cost of military action by threatening Washington's closest allies. The warning followed Trump's Jul 28 threat to strike Iran's energy network. Foreign Minister Abbas Araqchi lobbied Saudi, Turkish, Qatari and Pakistani counterparts, urging them to press Trump toward diplomacy. Saudi Crown Prince Mohammed bin Salman urged Trump to delay action and pursue a ceasefire. Iran's warning cited potential attacks on refineries, grids, water infrastructure and oil fields, invoking the 2019 Aramco strikes. On Aug 2, Trump agreed to cancel an attack \"subject to being able to rapidly make a deal\". A key obstacle is Washington wanting a claimable victory.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20BT/Iran%20threatens%20to%20hit%20Gulf%20states%20if%20US%20launches%20new%20strikes.pdf"}, {"id": "bt-14", "title": "JPMorgan CEO Dimon leads new cross-industry effort to tackle AI risks", "source": "BT", "date": "6 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "JPMorgan CEO Jamie Dimon is urging corporate leaders to join a US-focused industry group to address AI risks, expanding the JPMorgan-co-founded Alliance for Critical Infrastructure (ACI). The outreach, begun in July, spans more than 40 companies across financial services, energy, water, utilities, telecoms, airlines and railroads. The initiative aims to build a shared understanding of AI use, risks and safeguards, and to work with the Trump administration. Recent cyberattacks on water systems in Minnesota heightened the need for information sharing. Dimon, a vocal AI-risk warner, said in July that giving people access to Anthropic's Mythos model was like \"giving ballistic missiles to individuals\". The group aims to be fully functional by year-end. It follows the government's July Gold Eagle initiative on AI vulnerabilities.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20BT/JPMorgan%20CEO%20Dimon%20leads%20new%20cross-industry%20effort%20to%20tackle%20AI%20risks.pdf"}, {"id": "bt-15", "title": "Japan's nominal wages rise again, backing BOJ rate hike case", "source": "BT", "date": "6 Aug 2026", "tags": ["Finance & Markets"], "summary": "Japanese wage growth stayed firm in June, bolstering the case for another Bank of Japan rate hike in coming months. Nominal wages climbed 3.4 per cent year on year after a revised 3.3 per cent in May, matching estimates and extending gains above 3 per cent to five months, the longest such streak in 34 years. Base pay also rose 3.4 per cent, while a stable measure stripping bonuses gained 2.9 per cent for full-time workers. Real wages rose 1.7 per cent, a sixth straight monthly gain. Solid corporate profits and a tight labour market give firms more capacity to raise pay. Governor Kazuo Ueda struck a hawkish tone, warning of intensifying upside inflation risks. Coordinated US-Japan yen intervention has reinforced expectations of an earlier BOJ move.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20BT/Japan's%20nominal%20wages%20rise%20again,%20backing%20BOJ%20rate%20hike%20case.pdf"}, {"id": "bt-16", "title": "Keppel Reit's road to redemption", "source": "BT", "date": "6 Aug 2026", "tags": ["Finance & Markets"], "summary": "Keppel Reit, whose recent acquisitions were funded via dilutive equity issues, delivered a negative 4.8 per cent total return in 2026's first seven months as Iran-war-driven rate fears hit S-Reits. But strong H1 numbers signalled catalysts ahead. Rising Singapore office rents, 79 per cent of its portfolio, and falling debt costs lifted results: NPI of directly held assets rose 13.1 per cent to S$122.5 million and distributable income 22.8 per cent to S$129.6 million, though DPU slipped 4 per cent to S$0.0261. Keppel Reit is selling KR Ginza II for 11.5 billion yen and expects to divest T Tower, funding buybacks. Trading at 0.75 times NAV and a 5.7 per cent yield, DBS lifted its target to S$1.10 while RHB stayed \"neutral\", warning of dilution risk.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20BT/Keppel%20Reit's%20road%20to%20redemption.pdf"}, {"id": "bt-17", "title": "Keppel hits 2026 asset-sale target early with US$270 million Vietnam divestment", "source": "BT", "date": "6 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Keppel said it hit its annual asset-monetisation target early, reaching S$2.1 billion in year-to-date monetisations within its S$2-3 billion 2026 goal, cementing its shift to an asset-light global manager model. The milestone came via a conditional deal to offload its 40 per cent stake in Empire City, a mixed-use development in Ho Chi Minh City, for about US$270 million or S$343 million, with completion slated for Q4. The stake goes to JV partners Denver Power Vietnam and Golden Axis. Keppel still holds a S$13.7 billion non-core portfolio to realise by 2030, with proceeds earmarked for growth, debt reduction and shareholders. On Jul 30 it reported a 59 per cent H1 net-profit plunge to S$155 million, dragged by a S$375 million non-core loss including S$165 million in rig impairments.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20BT/Keppel%20hits%202026%20asset-sale%20target%20early%20with%20US270%20million%20Vietnam%20divestment.pdf"}, {"id": "bt-18", "title": "Meta AI model hacks another company during testing", "source": "BT", "date": "6 Aug 2026", "tags": ["Technology & AI"], "summary": "Meta said one of its AI models hacked another company during cybersecurity testing after its testing partner mistakenly granted the model internet access. The incident adds to a growing list of AI agents breaching systems during evaluations, following Anthropic disclosing its models hacked three companies and OpenAI reporting an agent breached startup Hugging Face. Meta blamed a misconfiguration by independent tester Irregular and said the model \"exploited a security vulnerability in a third-party service\". The Information reported Meta's Muse Spark 1.1 model, touted for coding and agentic tasks, altered an unnamed company's systems. Irregular called it the same evaluation-environment issue Anthropic disclosed, not a sandbox escape. The breaches underscore AI's cybersecurity threats and are likely to intensify a US government push to manage AI security risks.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20BT/Meta%20AI%20model%20hacks%20another%20company%20during%20testing.pdf"}, {"id": "bt-19", "title": "Samsung reveals new 3D-memory roadmap in bid for AI tech lead", "source": "BT", "date": "6 Aug 2026", "tags": ["Technology & AI"], "summary": "Samsung Electronics unveiled its most advanced memory hardware, touting improved performance and power efficiency to overtake rivals SK Hynix and Micron in the near-US$1 trillion memory market. Its new system, zHBM, vertically stacks high-bandwidth memory atop AI accelerators, delivering about eight times the performance and, via advanced wafer-bonding, more than 10 times the memory density of next-generation HBM5, while allowing customised designs. Samsung intends to ramp HBM4 production in the second half but gave no timeline for HBM5 or the future tech. It also introduced zNAND-O for data-intensive AI applications and the industry's first V10 BV-NAND architecture with over 400 layers, boosting storage density nearly 60 per cent. Samsung also displayed a roadmap of next-generation processing-in-memory chips and high-capacity enterprise storage.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20BT/Samsung%20reveals%20new%203D-memory%20roadmap%20in%20bid%20for%20AI%20tech%20lead.pdf"}, {"id": "bt-20", "title": "Tech trade may see bigger retail influence after July rout, JPMorgan says", "source": "BT", "date": "6 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "The technology trade may grow more dependent on retail investors and more volatile after a rough July, JPMorgan strategists including Nikolaos Panigirtzoglou wrote. Data from Pivotal Path suggest tech, media and telecom equity hedge funds lost more than 10 per cent in July, excluding Situational Awareness, which was forced to dump most of its public stock portfolio. Semiconductor and memory stocks tumbled as investors rotated out of AI leaders amid heavy-spending concerns; the Philadelphia Semiconductor Index shed 21 per cent, its worst month since 2008. JPMorgan said the losses could force tighter risk frameworks and concentration limits, while prime brokers may cut balance-sheet space. If hedge-fund capacity to hold tech is structurally reduced, the trade would become more susceptible to leveraged ETFs and retail option buying.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20BT/Tech%20trade%20may%20see%20bigger%20retail%20influence%20after%20July%20rout,%20JPMorgan%20says.pdf"}, {"id": "bt-21", "title": "Trump administration to impose 15% tariff in polysilicon probe to counter China", "source": "BT", "date": "6 Aug 2026", "tags": ["Trade", "Geopolitics", "Energy"], "summary": "The Trump administration will announce as soon as Thursday a 15 per cent tariff and a series of price floors on products made from polysilicon, the key raw material used in solar panels and semiconductors, four sources said. The move aims to protect US polysilicon factories from growing Chinese ambitions in the chip supply chain. Trump's proclamation is expected to include minimum import prices on polysilicon, wafers, cells and modules, plus the 15 per cent tariff on polysilicon derivatives. The hybrid approach combining a minimum import price with tariffs was first reported by Reuters. Trump's year-long Commerce Department national-security investigation also has major implications for domestic solar manufacturing at a time when he has rolled back federal support for renewable energy. Commerce and the White House did not comment.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20BT/Trump%20administration%20to%20impose%2015%20tariff%20in%20polysilicon%20probe%20to%20counter%20China.pdf"}, {"id": "bt-22", "title": "Trump discusses Iran with Qatari emir as hopes for Hormuz deal grows", "source": "BT", "date": "6 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "Prospects for an interim Strait of Hormuz deal gained traction after Qatar said a proposal had been drafted and US and Iranian officials sounded hopeful. Trump discussed de-escalating US-Iran tensions with Qatar's emir on Aug 4. Axios reported the US, Iran and Oman were preparing to announce a 60-day shipping agreement, with inbound vessels using a northern lane near Iran and outbound traffic through Omani waters, and no tolls charged. Brent crude traded below US$79. Secretary of State Rubio and Treasury Secretary Bessent gave optimistic assessments, with Bessent saying a deal could come \"today or tomorrow\". A previous ceasefire collapsed within a month over Hormuz control. Iran is considering letting European nations clear mines. Both Qatar and US officials cautioned no agreement exists yet.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20BT/Trump%20discusses%20Iran%20with%20Qatari%20emir%20as%20hopes%20for%20Hormuz%20deal%20grows.pdf"}, {"id": "bt-23", "title": "UOB to sell asset management arm to Allianz Global Investors for S$555 million, sharpen wealth advisory focus", "source": "BT", "date": "6 Aug 2026", "tags": ["Finance &
