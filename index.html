<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tecity News Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#fbfbfa; --surface:#ffffff; --surface-2:#f6f6f4;
    --text:#16181d; --muted:#6c727e; --faint:#9aa0ab;
    --border:#ececec; --border-2:#e2e2e0; --ink:#16181d;
    --hover:#f4f4f2; --ring:rgba(20,23,28,.10);
    --shadow:0 1px 2px rgba(16,18,22,.04), 0 8px 24px rgba(16,18,22,.05);
    --shadow-sm:0 1px 2px rgba(16,18,22,.05);
    --wsj:#D85A30; --st:#1D9E75; --bt:#378ADD; --scmp:#D4537E;
    --maxw:1120px;
  }
  html[data-theme="dark"]{
    --bg:#0c0d10; --surface:#15171c; --surface-2:#1b1e25;
    --text:#eceef2; --muted:#9aa1ad; --faint:#6b7280;
    --border:#252830; --border-2:#2d313b; --ink:#eceef2;
    --hover:#1c1f26; --ring:rgba(255,255,255,.12);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-feature-settings:"cv02","cv03","cv04","ss01";
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    line-height:1.6;
  }
  ::selection{background:rgba(120,120,120,.18)}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 28px}
  .num{font-variant-numeric:tabular-nums}
  .eyebrow{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); font-weight:600}

  /* header */
  header.top{position:sticky; top:0; z-index:20; backdrop-filter:saturate(180%) blur(14px);
    background:color-mix(in srgb, var(--bg) 82%, transparent); border-bottom:1px solid var(--border)}
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 28px; max-width:var(--maxw); margin:0 auto}
  .brand{display:flex; flex-direction:column; gap:2px; min-width:0}
  .brand .title{font-size:16px; font-weight:600; letter-spacing:-.01em}
  .brand .meta{font-size:12.5px; color:var(--muted)}
  .controls{display:flex; align-items:center; gap:10px}
  select.date{appearance:none; font:inherit; font-size:13px; font-weight:500; color:var(--text);
    background:var(--surface); border:1px solid var(--border-2); border-radius:10px; padding:8px 32px 8px 12px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%239aa0ab' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat; background-position:right 10px center; cursor:pointer; transition:border-color .15s}
  select.date:hover{border-color:var(--ink)}
  .toggle{display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; cursor:pointer;
    background:var(--surface); border:1px solid var(--border-2); border-radius:10px; color:var(--muted); transition:.15s}
  .toggle:hover{color:var(--text); border-color:var(--ink)}
  .toggle svg{width:17px; height:17px}

  /* hero digest */
  .hero{padding:48px 0 14px}
  .hero .eyebrow{margin-bottom:16px}
  .digest{font-size:clamp(25px,3.6vw,37px); line-height:1.22; font-weight:400; letter-spacing:-.02em;
    max-width:none; color:var(--text)}
  .digest .lead{max-width:none}

  /* metrics */
  .metrics{display:grid; grid-template-columns:repeat(6,1fr); gap:14px; padding:30px 0 8px}
  .metric{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px 18px 16px; box-shadow:var(--shadow-sm); transition:.18s}
  .metric:hover{box-shadow:var(--shadow); transform:translateY(-2px)}
  .metric .v{font-size:27px; font-weight:600; letter-spacing:-.03em; line-height:1.05}
  .metric .l{font-size:12.5px; font-weight:500; margin-top:8px}
  .metric .s{font-size:11.5px; color:var(--muted); margin-top:3px; line-height:1.4}

  /* tabs */
  .tabs{display:flex; gap:26px; margin:34px 0 0; border-bottom:1px solid var(--border)}
  .tab{position:relative; cursor:pointer; padding:0 0 14px; font-size:14px; font-weight:500; color:var(--muted); transition:color .15s}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--text)}
  .tab.active::after{content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--ink); border-radius:2px}

  .section{padding:30px 0 0}
  .section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px}
  .section-head h2{margin:0; font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); font-weight:600}
  .section-head .hint{font-size:12.5px; color:var(--muted)}

  /* lead briefing card */
  .lead-card{background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:30px 32px; box-shadow:var(--shadow); margin-bottom:16px}
  .lead-card .k{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); font-weight:600; margin-bottom:12px}
  .lead-card h3{margin:0 0 12px; font-size:23px; font-weight:600; letter-spacing:-.02em; line-height:1.2}
  .lead-card p{margin:0; font-size:15.5px; color:var(--text); line-height:1.65; max-width:none; column-width:34ch; column-gap:48px; column-fill:balance}

  /* briefing grid */
  .cards{display:grid; grid-template-columns:repeat(2,1fr); gap:16px}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:24px 26px; box-shadow:var(--shadow-sm); transition:.18s}
  .card:hover{box-shadow:var(--shadow); transform:translateY(-2px)}
  .card h3{margin:0 0 10px; font-size:16.5px; font-weight:600; letter-spacing:-.01em; line-height:1.3}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.62}

  /* coverage / bars */
  .split{display:grid; grid-template-columns:1.5fr 1fr; gap:16px; align-items:start}
  .panel{background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:24px 26px; box-shadow:var(--shadow-sm)}
  .bar-row{display:flex; align-items:center; gap:14px; margin:14px 0}
  .bar-row .name{width:42px; font-size:12.5px; font-weight:600; letter-spacing:.02em}
  .bar-track{flex:1; height:8px; background:var(--surface-2); border-radius:99px; overflow:hidden}
  .bar-fill{height:100%; border-radius:99px}
  .bar-row .cnt{width:26px; text-align:right; font-size:12.5px; color:var(--muted); font-weight:600}

  /* article */
  .feed-controls{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:4px 0 18px}
  .search{flex:1 1 260px; position:relative}
  .search svg{position:absolute; left:13px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--faint)}
  .search input{width:100%; font:inherit; font-size:14px; color:var(--text); background:var(--surface);
    border:1px solid var(--border-2); border-radius:12px; padding:11px 14px 11px 38px; outline:none; transition:.15s}
  .search input:focus{border-color:var(--ink); box-shadow:0 0 0 4px var(--ring)}
  .pills{display:flex; flex-wrap:wrap; gap:8px}
  .pill{cursor:pointer; font-size:12.5px; font-weight:500; color:var(--muted); background:var(--surface);
    border:1px solid var(--border-2); border-radius:99px; padding:7px 13px; user-select:none; transition:.14s; line-height:1}
  .pill:hover{border-color:var(--ink); color:var(--text)}
  .pill.active{color:#fff; border-color:transparent}
  .tagrow{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .count{font-size:12.5px; color:var(--muted); margin-bottom:14px}

  .article{padding:22px 4px; border-bottom:1px solid var(--border)}
  .article:first-child{padding-top:6px}
  .article .head{display:flex; align-items:center; gap:12px; margin-bottom:9px; flex-wrap:wrap}
  .src{display:inline-flex; align-items:center; gap:7px; font-size:11px; font-weight:600; letter-spacing:.04em; color:var(--muted)}
  .src .dot{width:8px; height:8px; border-radius:99px}
  .article h4{margin:0; font-size:16.5px; font-weight:600; letter-spacing:-.01em; line-height:1.32; flex:1; min-width:240px}
  .article h4 a{color:inherit; text-decoration:none; transition:color .15s}
  .article h4 a:hover{color:var(--wsj-hover, var(--muted))}
  .article .date{font-size:12px; color:var(--faint); white-space:nowrap}
  .article p{margin:6px 0 12px; font-size:14.5px; color:var(--muted); line-height:1.62; max-width:88ch}
  .tags{display:flex; flex-wrap:wrap; gap:7px}
  .tag{font-size:11px; font-weight:600; letter-spacing:.01em; border-radius:99px; padding:3px 10px; border:1px solid transparent}

  .empty{text-align:center; color:var(--muted); padding:60px 0; font-size:14px}
  footer{padding:48px 0 60px; color:var(--faint); font-size:12px; text-align:center}

  @media(max-width:980px){
    .metrics{grid-template-columns:repeat(3,1fr)}
    .cards{grid-template-columns:1fr}
    .split{grid-template-columns:1fr}
  }
  @media(max-width:560px){
    .wrap,.topbar{padding-left:18px; padding-right:18px}
    .metrics{grid-template-columns:repeat(2,1fr)}
    .hero{padding-top:34px}
  }
</style>
</head>

<script>window.ALL_DAYS = {"2026-07-20": {"date": "2026-07-20", "dayOfWeek": "Monday", "totalArticles": 68, "sourceCounts": {"WSJ": 21, "ST": 8, "BT": 12, "SCMP": 27}, "executiveDigest": "The US and Iran crept toward a wider war as American airstrikes followed troop deaths and Trump threatened Iran's fortified 'Pickaxe Mountain'; his fresh claims of Chinese election-meddling stirred US-China tensions amid a week of policy U-turns, while a China-driven AI surge - Alibaba calling its new Qwen model second only to Claude, and Moonshot's advances - fuelled a Wall Street chip selloff, and Singapore's Q2 growth eased even as AI demand drove GDP.", "briefingCards": [{"title": "Lead story - US and Iran creep toward wider war", "body": "The US and Iran edged toward a broader conflict: US airstrikes targeted Iran after American troop deaths, Trump said the US 'hit Iran very hard', and he threatened to bomb Iran's fortified 'Pickaxe Mountain'. The Houthi threat to Saudi Arabia's Red Sea oil-export route is growing, and the UAE is trialling a Hormuz workaround to bypass the chokepoint at its economic heart, while Chinese shipbuilders snap up supertanker orders as the turmoil drags on. Separately, Trump stirred fresh US-China tensions with claims Beijing meddled in US elections - part of what WSJ called a week of policy U-turns and election allegations - as his military-funding demands collided with GOP politics."}, {"title": "Markets & finance", "body": "A China-driven AI surge rattled US chips: Moonshot AI added fuel to a Wall Street chip selloff, and Nvidia - challenged by Apple - only narrowly retained Wall Street's crown. WSJ warned sky-high deficits threaten the bond market, US import prices unexpectedly rose in June, and BT asked how long until a 'US markets reckoning over Trump's damage'. Beijing stepped in with US$8.9 billion of state stock purchases to stem a decline, gold is testing whether a US$4,000 floor can hold, and BT flagged that South Korea's AI-heavy market is now setting the tone for global stocks - 'we are all Korean investors now'."}, {"title": "Asia realignment", "body": "China pressed its AI-and-resources advantage: Alibaba said its newest Qwen model is second only to Anthropic's Claude Fable 5 and unveiled an open-source stack targeting Nvidia's software moat, while Chinese Nvidia alternatives projected massive sales. Xi Jinping warned against creating 'new historical injustices' in the AI era. Meanwhile the US is 'trampling allies' in the global hunt for rare earths, a Chinese firm demanded UK compensation over British Steel's nationalisation, and SCMP noted America's own China expertise is fading. Lebanon's president heads to the White House to press for an Israeli withdrawal."}, {"title": "Energy & climate", "body": "Energy stayed central to the geopolitics: gas prices are set to stay higher for longer even if oil falls, the Houthi threat menaces Saudi oil exports, and China ramped up ethylene output - 'industrial gold' - amid Iran-war disruptions. SCMP flagged the AI boom's 'dirty secret', the coal that powers it, even as investors turned upbeat on the long-delayed ASEAN power grid and China touted city-level 'clean-power AI token factories'. More provocatively, one piece asked whether the atmosphere itself - 'weather weapons' - could become the next geopolitical battleground."}, {"title": "Technology & AI", "body": "The AI race went structural: SpaceX is in talks to supply computing power for the Pentagon's AI push, Meta plans to hire a top Amazon cloud executive as it weighs a cloud play, and Chinese tech giants from Ant to Tencent are deploying AI agents to win enterprise clients. A new 'AI token' economy is emerging as a corporate currency, though BT cautioned 'AI is running on borrowed money'. In Singapore, OpenAI is expanding its team amid surging Apac startup demand, while rising AI bills are pushing local firms to chase ROI over 'tokenmaxxing'."}, {"title": "Singapore & SEA focus", "body": "AI demand drove Singapore's GDP even as Q2 growth eased and global chipmakers were hit, and DBS's S$200 billion market-cap milestone prompted debate on creating more high-performing big-caps. OpenAI is expanding its Singapore team on surging Apac demand, and rising AI bills are pushing companies toward measurable ROI. On property, Lentor Gardens Residences sold 54% of 499 units over its launch weekend as mall owners reposition amid a shifting consumer landscape. Investors turned upbeat on the long-delayed ASEAN power grid, and Singapore is working to nurture global business champions."}], "keyMetrics": [{"value": "68", "label": "Articles curated today", "sub": "WSJ 21 · ST 8 · BT 12 · SCMP 27"}, {"value": "Wider war", "label": "US strikes Iran", "sub": "After US troop deaths"}, {"value": "Chip selloff", "label": "China AI surge", "sub": "Alibaba Qwen challenges Nvidia"}, {"value": "US$8.9b", "label": "Beijing stock buying", "sub": "State steps in to stem decline"}, {"value": "S$200b", "label": "DBS market cap", "sub": "Milestone; big-cap debate"}, {"value": "Q2 eases", "label": "Singapore GDP", "sub": "AI demand up; chipmakers hit"}], "articles": [{"id": "wsj-01", "title": "AI's Wider Availability Is Good for China, Not Great for OpenAI and Anthropic", "source": "WSJ", "date": "20 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "AI is becoming a widely available commodity as prices plunge, lightweight models proliferate and the compute bottleneck eases. Xi Jinping championed open-weights models in a Shanghai speech, while Chinese systems like GLM 5.2 and Kimi K3 catch up to top U.S. labs. On OpenRouter, the top five models are Chinese, handling roughly 45% of tracked tokens. ChatGPT's global consumer share fell below 50% in March amid Gemini and Claude competition. Commoditization is driven by diffusion of AI knowledge and distillation, which Microsoft's Satya Nadella defended as \"ironic\" to restrict. Poised for IPOs, OpenAI and Anthropic face price wars and mounting data-center spending that threaten their competitive edge and future profitability.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20WSJ/AI%E2%80%99s%20Wider%20Availability%20Is%20Good%20for%20China,%20Not%20Great%20for%20OpenAI%20and%20Anthropic.pdf"}, {"id": "wsj-02", "title": "China's Moonshot AI Adds More Fuel to Wall Street's Chip Selloff", "source": "WSJ", "date": "20 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "China's Moonshot AI unveiled its Kimi K3 large language model Friday, intensifying a chip-stock selloff and stoking \"DeepSeek 2.0 concerns.\" The PHLX Semiconductor index, holding Nvidia, Broadcom and Micron, plunged 10% for the week, its steepest drop since April 2025, entering bear-market territory. The S&P 500 fell 1% and the Nasdaq slid 1.4%. Billed as the world's largest open-source model, Kimi K3 topped Anthropic's Opus 4.8 and OpenAI's GPT 5.5 on some coding benchmarks. Cheaper, customizable open-weight models threaten frontier labs whose compute demand underpins U.S. capital spending. Netflix fell 7.3% and SpaceX dropped 5.4% after aborting a Starship test. The Dow shed 0.8%, or 407 points.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20WSJ/China%E2%80%99s%20Moonshot%20AI%20Adds%20More%20Fuel%20to%20Wall%20Street%E2%80%99s%20Chip%20Selloff.pdf"}, {"id": "wsj-03", "title": "Gas Prices Will Stay Higher for Longer, Even if Oil Falls", "source": "WSJ", "date": "20 Jul 2026", "tags": ["Energy", "Finance & Markets"], "summary": "Trump has calmed crude markets during the Iran war, but has less sway over gasoline prices that matter more to consumers. U.S. crude hovers near $80 a barrel, about 18% above pre-war levels, while gasoline is 32% higher at $3.94 a gallon. Gasoline crack spreads average 90 cents, a four-year high. Crude had shock absorbers—China slashed imports to 5.7 million barrels a day and reserves were released—but fuel markets lacked buffers. Conflict curtailed refining in the Middle East and Russia, which banned diesel exports. Global gasoline inventories run below average. In the U.S., higher biofuel-blending quotas added compliance-credit costs of 14 cents a gallon, keeping fuel prices elevated even if Hormuz reopens.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20WSJ/Gas%20Prices%20Will%20Stay%20Higher%20for%20Longer,%20Even%20if%20Oil%20Falls.pdf"}, {"id": "wsj-04", "title": "Houthi Threat to Saudi Arabia's Red Sea Oil-Export Route Is Growing", "source": "WSJ", "date": "20 Jul 2026", "tags": ["Geopolitics", "Energy"], "summary": "Escalating hostilities between Saudi Arabia and Yemen's Iran-backed Houthis threaten a crucial oil-export route the kingdom uses to bypass the blocked Strait of Hormuz. A pipeline carries crude west to a Red Sea port, letting tankers sail through Bab al-Mandeb to Asian markets. The Houthis fired drones and missiles at a Saudi airport after accusing Riyadh of bombing San'a's runway, and their leader threatened Saudi oil facilities, declaring \"airports for airports, seaports for seaports.\" A 2022 truce is breaking down. Saudi Arabia exports about four million barrels a day via the Red Sea, down from 7.3 million pre-war. Capital Economics warns simultaneous waterway closures could tip the global economy into recession.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20WSJ/Houthi%20Threat%20to%20Saudi%20Arabia%E2%80%99s%20Red%20Sea%20Oil-Export%20Route%20Is%20Growing.pdf"}, {"id": "wsj-05", "title": "How Sky-High Deficits Threaten the Bond Market", "source": "WSJ", "date": "20 Jul 2026", "tags": ["Finance & Markets", "Politics"], "summary": "Near-record peacetime deficits force the U.S. to issue roughly $2 trillion a year in extra Treasurys as the market's structure grows fragile. Surface metrics look healthy—$1.2 trillion daily turnover, solid auction bids—but the 30-year yields 0.5 point above the 10-year, signaling wariness over deficits and inflation. Dealers now buy just 10-15% of auction Treasurys, down from 40-50% in 2010. \"Price insensitive\" holders fell to 52% from 75% in 2007. Hedge funds' share jumped to 8.5%, funded by fragile repo loans that could trigger fire sales like March 2020. Fed Chair Kevin Warsh disavowed bailouts but flagged a crisis escape clause. Trump is tinkering with markets rather than cutting deficits.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20WSJ/How%20Sky-High%20Deficits%20Threaten%20the%20Bond%20Market.pdf"}, {"id": "wsj-06", "title": "Meta Plans to Hire Top Amazon Computing Executive Dave Brown as It Weighs Cloud Push", "source": "WSJ", "date": "20 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Dave Brown, one of Amazon Web Services' most senior executives, plans to join Meta Platforms within weeks to focus on its data-center build-out, reporting to infrastructure head Santosh Janardhan. The move signals Meta's growing ambitions in computing and a possible cloud business. Meta and Anthropic have discussed an early-stage deal for Meta to rent extra compute to the AI startup. CEO Mark Zuckerberg said a cloud is \"definitely on the table,\" with firms approaching Meta weekly for compute. Meta expects $125-$145 billion in capital expenditures this year, much for AI data centers. Brown, a 19-year Amazon veteran and S-team member, joins amid soaring demand for infrastructure talent. AWS posted $37.6 billion first-quarter revenue.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20WSJ/Meta%20Plans%20to%20Hire%20Top%20Amazon%20Computing%20Executive%20Dave%20Brown%20as%20It%20Weighs%20Cloud%20Push%20-%20WSJ.pdf"}, {"id": "wsj-07", "title": "Nvidia, Challenged by Apple, Narrowly Retains Wall Street's Crown", "source": "WSJ", "date": "20 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Apple momentarily overtook Nvidia as the most valuable U.S. public company Friday before Nvidia closed slightly ahead at $4.908 trillion versus Apple's $4.902 trillion. Apple's market cap hit $4.91 trillion intraday. Nvidia, Wall Street's darling amid chip scarcity, has been volatile as doubts grow over the AI build-out; its stock is up 15.7% over the year but 15% below its May high, when it peaked near $5.5 trillion. Apple rose 57.8%, buoyed by iPhone 17 sales and a coming Siri AI, shrugging off memory-chip cost hikes. Nvidia dethroned Microsoft last June and has led for 266 trading days. Alphabet trails at $4.2 trillion, with pending Anthropic and OpenAI IPOs threatening the hierarchy.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20WSJ/Nvidia,%20Challenged%20by%20Apple,%20Narrowly%20Retains%20Wall%20Street%E2%80%99s%20Crown.pdf"}, {"id": "wsj-08", "title": "Saab Backs Guidance as Defense Demand Remains Strong", "source": "WSJ", "date": "20 Jul 2026", "tags": ["Defence", "Finance & Markets"], "summary": "Swedish defense company Saab backed its medium-term growth guidance after signing several large orders, citing continued strong demand amid the Ukraine war and Middle East conflict. CEO Micael Johansson said customers keep investing in immediate readiness and long-term capabilities. Saab booked its largest-ever export deal in the second quarter, a 47 billion kronor ($4.87 billion) agreement to deliver three submarines to Poland. Since quarter-end it signed a 24.6 billion kronor deal for 16 Gripen jets to Ukraine, was selected by NATO for up to 10 GlobalEye surveillance aircraft, and won an 8.7 billion kronor German frigate order. Saab still targets around 22% organic sales growth for 2023-27. Second-quarter net profit rose to 2.14 billion kronor as sales climbed 28%.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20WSJ/Saab%20Backs%20Guidance%20as%20Defense%20Demand%20Remains%20Strong.pdf"}, {"id": "wsj-09", "title": "SpaceX in Talks to Provide Computing Power for Pentagon's AI Push", "source": "WSJ", "date": "20 Jul 2026", "tags": ["Technology & AI", "Defence"], "summary": "SpaceX is in talks with the Defense Department to provide data-center capacity worth up to several billion dollars for running AI models, deepening Elon Musk's Pentagon ties. The talks are ongoing and could collapse. SpaceX has signed similar deals with Anthropic and Google and plans to expand cloud computing, aiming to undercut providers like CoreWeave. Some officials worry the Pentagon is too reliant on Musk. The department recently approved SpaceX, Amazon, Google, Microsoft and Oracle for classified AI use, seeking to avoid single-provider lock-in. The Pentagon wants $30 billion for an \"Artificial Intelligence Arsenal\" focused on high-end chips. SpaceX, which absorbed xAI and went public, built massive Memphis data centers. Compute deals could yield tens of billions in annual revenue.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20WSJ/SpaceX%20in%20Talks%20to%20Provide%20Computing%20Power%20for%20Pentagon%E2%80%99s%20AI%20Push.pdf"}, {"id": "wsj-10", "title": "The Investors With a New Way to Win in Silicon Valley", "source": "WSJ", "date": "20 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "A new generation of investors is transforming venture capital as companies stay private far longer, locking the public out of key wealth-creation phases. Spark Capital's Yasmin Razavi, the only outside investor on Anthropic's board, led its Series C in May 2023 when others balked at a $4 billion valuation. SpaceX's IPO and expected Anthropic and OpenAI debuts have vaulted little-known firms like Spark, Gigafund and Greenoaks atop the investing world. Rather than seeking influence, they write check after check to help startups scale—a riskier, IPO-like model. U.S. startups raised $321 billion last year versus $84 billion in 2016; average late-stage rounds swelled past $1 billion. Michael Moritz says \"the business has changed entirely.\"", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20WSJ/The%20Investors%20With%20a%20New%20Way%20to%20Win%20in%20Silicon%20Valley.pdf"}, {"id": "wsj-11", "title": "The SAVE America Act: Key Provisions and Political Hurdles for Trump's Election Bill", "source": "WSJ", "date": "20 Jul 2026", "tags": ["Politics", "Society"], "summary": "After alleging in a prime-time speech that U.S. elections were compromised, Trump pressed Congress to pass the SAVE America Act, which would require approved voter ID and documentary proof of citizenship to register for federal elections and let officials purge noncitizens anytime. Trump demands an expanded version banning most mail-in voting and restricting transgender healthcare and sports participation. Democrats warn it could disenfranchise millions, and some Republicans say it is unworkable before the midterms. The Senate has voted five times without passage, needing 60 votes; House versions stalled. In 2024, 37% of Democrats voted by mail versus 24% of Republicans. Qualifying citizenship documents include passports and birth certificates; a REAL ID alone won't necessarily suffice.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20WSJ/The%20SAVE%20America%20Act%20Key%20Provisions%20and%20Political%20Hurdles%20for%20Trump%E2%80%99s%20Election%20Bill.pdf"}, {"id": "wsj-12", "title": "The Tax Strategy for People Suffering From Stock-Market Success", "source": "WSJ", "date": "20 Jul 2026", "tags": ["Finance & Markets", "Society"], "summary": "A long bull market leaves investors with concentrated winners they can't diversify without triggering huge capital-gains taxes. One solution is a 351 exchange, where investors contribute stocks or ETFs to a launching ETF and receive equal-value shares, deferring tax until sale and gaining instant diversification. Held until death, heirs get a stepped-up basis that erases most gains. Since 2021, at least 80 ETFs launched this way, raising over $18 billion; Plancorp clients contributed $361 million to one Dimensional fund. But federal rules cap a single stock at 25% of the contributed portfolio and five stocks at 50%, so heavily concentrated holders often don't qualify. The Treasury Department is reportedly weighing clearer guidance, though a block is not expected.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20WSJ/The%20Tax%20Strategy%20for%20People%20Suffering%20From%20Stock-Market%20Success.pdf"}, {"id": "wsj-13", "title": "The U.K. Gets Another New Leader on Monday. His First Task: Reassure the Markets.", "source": "WSJ", "date": "20 Jul 2026", "tags": ["Politics", "Finance & Markets"], "summary": "Andy Burnham, the Manchester mayor who executed an understated coup, becomes Britain's sixth prime minister in seven years, formalized by King Charles on Monday. The telegenic 56-year-old, a lawmaker only since last month, won the Labour leadership uncontested after Keir Starmer resigned following dire local-election results behind Reform UK. Burnham has floated decentralizing power, tax reform, nationalizing utilities and scrapping the electoral system, but faces tight fiscal limits: gilt yields are the G7's highest, the tax burden is the heaviest since World War II, and debt is 94% of output. Investors, scouring his Reddit posts, will punish lavish spending. His first task is reassuring markets, though analysts doubt his plans will lift growth before the next election.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20WSJ/The%20U.K.%20Gets%20Another%20New%20Leader%20on%20Monday.%20His%20First%20Task%20Reassure%20the%20Markets..pdf"}, {"id": "wsj-14", "title": "The U.S. Is Trampling Allies in the Global Hunt for Rare Earths", "source": "WSJ", "date": "20 Jul 2026", "tags": ["Geopolitics", "Trade", "Defence"], "summary": "Europe's push to loosen Beijing's grip on critical minerals has hit a snag: America's deep pockets. The U.S. is on a global shopping spree for rare earths needed for jet fighters, tanks and ammunition, outspending Europe and sparking fears an increasingly protectionist Trump administration will hoard supplies and leave Europeans dependent on China. Over five years to February, the U.S. allocated about $46 billion for critical raw-material projects, roughly eight times the EU's level, per a French think tank. Washington negotiated preferential access in Congo and Ukraine and uses Export-Import Bank financing tied to selling into the U.S. The Pentagon ordered contractors to remove Chinese rare earths by next year. Officials call the U.S. both a potential partner and competitor.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20WSJ/The%20U.S.%20Is%20Trampling%20Allies%20in%20the%20Global%20Hunt%20for%20Rare%20Earths.pdf"}, {"id": "wsj-15", "title": "The U.S. and Iran Creep Toward a Wider War With Escalating Attacks", "source": "WSJ", "date": "20 Jul 2026", "tags": ["Geopolitics", "Defence", "Energy"], "summary": "Fighting between the U.S. and Iran has expanded, with American forces striking a broader range of targets and moving jet fighters into the Middle East while Tehran launches attacks across the Persian Gulf. The conflict centers on control of the Strait of Hormuz after a deal to open the waterway collapsed last week. The U.S. is hitting bridges and interior targets to pressure Iran, including near Bandar Abbas, which handles 90% of container traffic, and repeatedly striking Chabahar. Oil prices have risen more than 10% this week. More than 2,000 Marines are operating in the region enforcing a port blockade. An Iran expert warned \"this escalation is rapidly intensifying,\" with a risk of total war neither side wants.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20WSJ/The%20U.S.%20and%20Iran%20Creep%20Toward%20a%20Wider%20War%20With%20Escalating%20Attacks.pdf"}, {"id": "wsj-16", "title": "Trump Has Threatened to Bomb Iran's Pickaxe Mountain. What Is Hidden There?", "source": "WSJ", "date": "20 Jul 2026", "tags": ["Geopolitics", "Defence"], "summary": "As Trump escalates rhetoric against Iran, he has named a new target: Pickaxe Mountain, a subterranean complex under construction near the Natanz nuclear site. \"Pickaxe Mountain is a possible target for a nice big fat shot,\" Trump told broadcaster Hugh Hewitt. Iran began the site in 2020 after sabotage damaged Natanz, and an official said it would house \"sensitive\" equipment. Construction appears incomplete and it wasn't struck in earlier attacks. Former U.S. and Israeli officials argue it could help Tehran revive its nuclear program. Sitting over 5,200 feet up, it has hardened tunnels at 100 and 145 meters below the peak, suggesting multiple levels. A think tank estimated a workspace exceeding 53,000 square feet. Iran has denied the IAEA design information.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20WSJ/Trump%20Has%20Threatened%20to%20Bomb%20Iran%E2%80%99s%20Pickaxe%20Mountain.%20What%20Is%20Hidden%20There.pdf"}, {"id": "wsj-17", "title": "Trump Stirs China Tensions With Claims That It Meddled in U.S. Elections", "source": "WSJ", "date": "20 Jul 2026", "tags": ["Geopolitics", "Politics"], "summary": "Trump's televised claim Thursday that China interfered in the 2020 U.S. elections adds a new irritant to a tenuous detente with Beijing already strained by trade and tech competition. The allegations jarred with the calm since his May Beijing trip, where he and Xi Jinping sought to stabilize ties. China denied meddling, with spokesman Lin Jian saying the claims \"have no factual ground.\" Analysts say the remarks, driven by domestic politics ahead of November midterms where Republicans risk losing Congress, are unlikely to derail relations unless followed by punitive measures. A Fudan scholar cited GOP pressure over inflation and weak economic satisfaction. A March 2021 U.S. assessment found Beijing considered but ultimately didn't deploy a 2020 influence campaign.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20WSJ/Trump%20Stirs%20China%20Tensions%20With%20Claims%20That%20It%20Meddled%20in%20U.S.%20Elections.pdf"}, {"id": "wsj-18", "title": "Trump's Man in Canada Practices a No-Holds-Barred Diplomacy", "source": "WSJ", "date": "20 Jul 2026", "tags": ["Geopolitics", "Politics", "Trade"], "summary": "U.S. Ambassador to Canada Pete Hoekstra, a former Michigan Republican congressman, has become a household name in Ottawa by embracing Trump's blunt tone. His July Fourth guest list included Tamara Lich, under house arrest for leading the 2022 \"Freedom Convoy\" blockades. Hoekstra has called Canadian responses to Trump's 51st-state talk \"nasty,\" demanded a newspaper apology, and drawn rebukes for undiplomatic behavior. He says he came to represent the president, not to be liked. Trump's tariffs and annexation threats have strained the neighbors' bonds, weighing on Canadian manufacturing and clouding North American free trade. A Pew poll found just 35% of Canadians now see the U.S. as a reliable partner, down from 83% in 2022, which Hoekstra called \"a problem.\"", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20WSJ/Trump%E2%80%99s%20Man%20in%20Canada%20Practices%20a%20No-Holds-Barred%20Diplomacy.pdf"}, {"id": "wsj-19", "title": "Trump's Military-Funding Demands Collide With Internal GOP Politics", "source": "WSJ", "date": "20 Jul 2026", "tags": ["Politics", "Defence"], "summary": "House Republicans are advancing extra military spending four months into the Iran war, but the package is far smaller than Trump sought and its passage is uncertain amid party divides. The Budget Committee advanced a $95 billion framework providing up to $73 billion in defense and intelligence funding, $12 billion in farm assistance and $10 billion to tighten voting rules. Speaker Mike Johnson aims to pass it before the August recess. Some GOP lawmakers call it dead on arrival, citing missing spending cuts and lack of Iran-war details; the narrow 219-212 majority allows few defections. Democrats questioned funding an \"unauthorized\" war. The Senate is cool; Majority Leader John Thune doubts 50 votes exist, asking \"is the juice worth the squeeze?\"", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20WSJ/Trump%E2%80%99s%20Military-Funding%20Demands%20Collide%20With%20Internal%20GOP%20Politics.pdf"}, {"id": "wsj-20", "title": "Trump's Week of Policy U-Turns and Election Allegations", "source": "WSJ", "date": "20 Jul 2026", "tags": ["Politics", "Geopolitics"], "summary": "Trump's prime-time Thursday address casting doubt on U.S. election integrity capped a week of decisions that baffled senior Republicans, many of whom opposed the speech. Eighteen months into his second term, the president has little interest in hearing no, brushing aside advice to stop relitigating the 2020 election and empowering loyalists over moderating voices. Watching were Bill Pulte, acting director of national intelligence, and journalist John Solomon, both given authority to probe election fraud; some aides fear Pulte will funnel unverified information. Republicans worry Trump is neglecting cost-of-living concerns and the grinding Iran war ahead of midterms where they risk losing Congress. The week also featured high-profile policy U-turns as Trump pressed his SAVE America Act.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20WSJ/Trump%E2%80%99s%20Week%20of%20Policy%20U-Turns%20and%20Election%20Allegations.pdf"}, {"id": "wsj-21", "title": "U.S. Import Prices Unexpectedly Rise in June", "source": "WSJ", "date": "20 Jul 2026", "tags": ["Finance & Markets", "Trade"], "summary": "U.S. import prices unexpectedly ticked up in June from May, driven by nonfuel imports as petroleum prices finally pulled back, Bureau of Labor Statistics data showed. Overall import prices rose 0.3%, less than the downwardly revised 1.7% increase in May. Year-on-year, prices were up 7.1%. Import prices exclude duties such as Trump-administration tariffs, as well as transportation costs. Petroleum import prices fell 0.7%, offering relief after the Iran war drove crude sharply higher earlier this year, while prices for nonpetroleum imports rose 0.5%, offsetting the lower fuel costs.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20WSJ/U.S.%20Import%20Prices%20Unexpectedly%20Rise%20in%20June.pdf"}, {"id": "st-01", "title": "7th PM in a decade: Is Andy Burnham and Labour's survival tactic a cure for UK's woes?", "source": "ST", "date": "20 Jul 2026", "tags": ["Politics", "Finance & Markets"], "summary": "Andrew Burnham, 56, becomes Britain's seventh prime minister in a decade on July 20, taking over from Keir Starmer after Labour's historic May 2026 local election defeats. The former Manchester mayor won an uncontested leadership \"coronation\" and promises the most radical economic rupture in 50 years, vowing to reverse Thatcher-era privatisation by renationalising water, energy and transport, starting with Thames Water. He also plans to shift government functions from London to Manchester. Analysts warn the midterm-replacement mechanism is a party survival tactic, not a cure for deep problems: 95 per cent debt-to-GDP, stagnant incomes and NHS decay. Markets may punish his left-wing tilt, echoing Liz Truss's 49-day collapse, while allies question Britain's reliability.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20ST/7th%20PM%20in%20a%20decade%20Is%20Andy%20Burnham%20and%20Labour's%20survival%20tactic%20a%20cure%20for%20UK's%20woes.pdf"}, {"id": "st-02", "title": "AI demand drives Singapore GDP but Q2 growth eases; global chipmakers hit hard", "source": "ST", "date": "20 Jul 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Singapore's economy grew 5.7 per cent year on year in the second quarter of 2026, easing from the first quarter's 6.3 per cent but beating the 5.5 per cent forecast, MTI said on July 14. AI-related demand for semiconductors drove electronics and precision engineering, though construction and retail slowed. Renewed US-Iran hostilities and a Strait of Hormuz blockade lifted crude to about US$81 a barrel, clouding the outlook. Chipmakers had a torrid week: SK Hynix, freshly Nasdaq-listed, plunged 15.5 per cent as investors locked profits; Samsung fell over 8 per cent despite a 19-fold profit jump. Micron, Western Digital and SanDisk slid, dragging Singapore's AEM, UMS and Frencken lower. Sheng Siong plans a $520 million headquarters.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20ST/AI%20demand%20drives%20Singapore%20GDP%20but%20Q2%20growth%20eases%20global%20chipmakers%20hit%20hard.pdf"}, {"id": "st-03", "title": "China wants the world to use its AI - but not all of it", "source": "ST", "date": "20 Jul 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "At Shanghai's World Artificial Intelligence Conference on July 17, President Xi Jinping pledged to help other countries develop AI, promote Chinese open-source models and shape global governance. Yet regulators were simultaneously weighing whether to restrict overseas access to China's most advanced models, revealing a dilemma between spreading Chinese tech and guarding strategic assets. June semiconductor exports jumped 122 per cent by value; computing equipment rose 53 per cent. Beijing strengthened oversight of overseas tech transactions from July 1 and reportedly met Alibaba and ByteDance over model access. The moves mirror Washington's curbs on Anthropic's Fable and Mythos. China now leads high-impact research in 69 of 74 critical technologies, posing a \"high monopoly risk\" in 41. It ordered Meta to unwind its Manus acquisition.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20ST/China%20wants%20the%20world%20to%20use%20its%20AI%20-%20but%20not%20all%20of%20it.pdf"}, {"id": "st-04", "title": "Lebanon's Aoun to meet Trump at White House, hoping to generate pressure on Israel", "source": "ST", "date": "20 Jul 2026", "tags": ["Geopolitics", "Politics"], "summary": "Lebanese President Joseph Aoun will make his first White House visit on July 21, presenting Donald Trump a written plan to disarm Iran-backed Hezbollah and secure Israel's withdrawal from occupied southern Lebanon. Aoun, 62, a former army commander elected in 2025, is the first Lebanese head of state to visit in nearly 20 years. He will ask Trump to \"exert the necessary pressure on Israel\" to implement a US-brokered June 26 agreement. A new war erupted when Hezbollah fired at Israel on March 2 supporting Iran, triggering an Israeli campaign that killed over 4,300 people, per Lebanon's health ministry. Aoun sought direct talks with Israel, drawing fierce Hezbollah criticism, but has declined Trump's call to meet Netanyahu directly.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20ST/Lebanon's%20Aoun%20to%20meet%20Trump%20at%20White%20House,%20hoping%20to%20generate%20pressure%20on%20Israel.pdf"}, {"id": "st-05", "title": "New York mayor still considering Netanyahu arrest during UN meet", "source": "ST", "date": "20 Jul 2026", "tags": ["Politics", "Geopolitics"], "summary": "New York Mayor Zohran Mamdani said in a July 18 New York Times interview that he is in talks over whether to try to arrest Israeli Prime Minister Benjamin Netanyahu during the UN General Assembly in September, calling him a \"war criminal\" who \"belongs in The Hague.\" Mamdani, who has labelled Israel an \"apartheid regime,\" admitted he is unsure he has power to order the NYPD to detain a foreign leader and is consulting the city's legal team. The ICC said in 2024 it had reasonable grounds to believe Netanyahu bore responsibility for alleged war crimes in Gaza. Israel's UN ambassador Danny Danon rebuked Mamdani on X, saying Netanyahu will attend and address the assembly with pride.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20ST/New%20York%20mayor%20still%20considering%20Netanyahu%20arrest%20during%20UN%20meet.pdf"}, {"id": "st-06", "title": "Russia pounds Kyiv with ballistic missiles in escalating air war", "source": "ST", "date": "20 Jul 2026", "tags": ["Defence", "Geopolitics"], "summary": "Russia fired more than 40 missiles at Ukraine overnight on July 19, including 25 ballistic missiles targeting Kyiv, killing one person and wounding 16 across six districts, President Volodymyr Zelensky said. Strikes damaged apartment buildings, supermarkets and an entertainment centre. Ukraine faces a shortage of interceptors for its US-designed Patriot systems since the US-Israeli war on Iran began, letting Russia intensify weekly ballistic barrages. Domestic instability adds pressure, with thousands protesting the ousting of popular defence minister Mykhailo Fedorov. Ukrainian drones struck Russia, damaging Kazakh oil tankers at Novorossiysk and destroying warehouses near Moscow, killing eight. The UN said June was Ukraine's deadliest month for civilians since April 2022, with at least 293 killed. Peace talks remain frozen.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20ST/Russia%20pounds%20Kyiv%20with%20ballistic%20missiles%20in%20escalating%20air%20war.pdf"}, {"id": "st-07", "title": "Singapore nurtures global business champions", "source": "ST", "date": "20 Jul 2026", "tags": ["Trade", "Society"], "summary": "Singapore is expanding efforts to nurture homegrown companies into global industry leaders, moving beyond its longstanding strategy of attracting multinationals, EDB executive vice-president Choo Heng Tong said at an NUS Business School conference on July 16. Speaking to 400 founders, investors and alumni, he said EDB is working with venture capital and private equity firms to identify and support high-growth companies, taking a long-term approach. The push follows Economic Strategy Review recommendations identifying two pillars: nurturing globally leading companies, especially in AI and technology, and sustaining a vibrant entrepreneurial ecosystem. Choo cited Singapore's 29 free trade agreements, 150 diplomatic ties, 7,000 multinationals and 300 investment firms. Business China chairman Lee Yi Shyan said Singapore's future depends on attracting talent and maintaining social cohesion.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20ST/Singapore%20nurtures%20global%20business%20champions.pdf"}, {"id": "st-08", "title": "US airstrikes target Iran after troop deaths", "source": "ST", "date": "20 Jul 2026", "tags": ["Geopolitics", "Defence", "Energy"], "summary": "The US and Iran traded missiles and airstrikes on July 19 as Washington sought to \"punish\" Tehran for its first military losses since Middle East hostilities resumed. A preliminary deal collapsed amid deadlock over the Strait of Hormuz, key to global oil supply. Iran said it targeted two US bases in Kuwait; Jordan and Bahrain intercepted missiles. American military fatalities reached 17 since the US-Israel war began on Feb 28. Iran said the US struck its unfinished Darkhovin nuclear plant, which the IAEA said held no nuclear material. Kuwait reported a power and water plant hit for a second day. Iran's health ministry said 50 were killed recently. Supreme leader Mojtaba Khamenei vowed to teach Americans \"unforgettable lessons.\"", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20ST/US%20airstrikes%20target%20Iran%20after%20troop%20deaths.pdf"}, {"id": "bt-01", "title": "'We are all Korean investors now': Why South Korea's AI-heavy market is setting the tone for global stocks", "source": "BT", "date": "20 Jul 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "South Korea's US$4 trillion equity market has become an early global read on AI risk appetite, with fund managers in London, New York and Tokyo checking Seoul before trading. Swings in Samsung Electronics and SK Hynix ripple through global chip stocks, and SK Hynix's US listing extended that influence to Wall Street. The Kospi's 60-day correlation with the Nasdaq 100 has climbed to 0.46, near a two-year high, while leveraged trading has made it one of the world's most volatile benchmarks. \"We are all Korean investors now,\" said PineBridge's Hani Redha. The index has plunged 25 per cent since its June peak, a US$1 trillion wipeout, but remains up 62 per cent for 2026.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20BT/'We%20are%20all%20Korean%20investors%20now'%20Why%20South%20Korea's%20AI-heavy%20market%20is%20setting%20the%20tone%20for%20global%20stocks.pdf"}, {"id": "bt-02", "title": "AI is running on borrowed money", "source": "BT", "date": "20 Jul 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Big tech's colossal AI data-centre spending is increasingly financed by debt, raising systemic risk. Oracle, whose building spree helped fund Larry Ellison's media ambitions, had its debt cut by S&P Global on Jul 9 to one notch above junk. Alphabet, Microsoft, Amazon, Meta and Oracle are pouring over US$800 billion into AI this year, planning US$1.2 trillion in 2027, exceeding the US military budget request. Bank of America says their combined capex now exceeds free cash flow, making them as capital-intensive as ExxonMobil. Accounting rules let firms treat the outlays as capital expenditure, flattering earnings and propelling stocks. Oracle, Amazon and SpaceX bonds have been hit as the bond market charges premiums for heightened risk.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20BT/AI%20is%20running%20on%20borrowed%20money.pdf"}, {"id": "bt-03", "title": "DBS' S$200 billion milestone: What will it take to create more high-performing big-cap stocks?", "source": "BT", "date": "20 Jul 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "DBS's market capitalisation breached S$200 billion on Jul 13, delivering a 29.1 per cent year-to-date total return, the fourth-best Straits Times Index performer. The columnist argues Singapore needs more high-performing, globally relevant big-caps. DBS, aiming for over S$1 trillion in wealth assets by 2030, trades at 2.95 times NAV on a 17 per cent ROE, dwarfing peers. It held a 27.6 per cent STI weighting at Jun 30, nearly twice OCBC's, while Singtel and UOB are about a third of its size. The author suggests a broader benchmark including mid-caps, weighted or capped, and says fostering more DBS-scale firms requires capable CEOs and regional scale, much as banks were once encouraged to merge.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20BT/DBS'%20S200%20billion%20milestone%20What%20will%20it%20take%20to%20create%20more%20high-performing%20big-cap%20stocks.pdf"}, {"id": "bt-04", "title": "Gold at a crossroads: Can the US$4,000 floor hold?", "source": "BT", "date": "20 Jul 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "After a historic rally, gold has corrected sharply in 2026, retreating from record highs near US$5,600 to around US$4,000. The article frames US$4,000 as key psychological support and the 61.8 per cent Fibonacci retracement, the \"golden ratio\", where buyers and central banks have repeatedly stepped in. But macro forces will drive the next move: renewed US-Iran tensions threaten Strait of Hormuz energy supplies and inflation, while easing US inflation data reflected an earlier lull. If inflation reaccelerates, the Fed may hold rates higher for longer, strengthening the dollar and pressuring non-yielding bullion. Should US$4,000 break, the next support lies between US$3,500 and US$3,700. Gold's path hinges on inflation, Fed policy and geopolitics.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20BT/Gold%20at%20a%20crossroads%20Can%20the%20US4,000%20floor%20hold.pdf"}, {"id": "bt-05", "title": "How long until there is a US markets reckoning over Trump's damage?", "source": "BT", "date": "20 Jul 2026", "tags": ["Finance & Markets", "Politics", "Geopolitics"], "summary": "The columnist questions why markets remain sanguine about the economic damage from Donald Trump. His re-escalation around the Strait of Hormuz raises supply-shock and stagflation risks, while tariff wars and the weaponisation of trade unravel globalisation's efficiencies. Though the IMF projects 3.0 per cent global growth in 2026, the US runs unusually loose policy, a deficit near 6 per cent of GDP and postwar-high public debt. The BIS warns the AI investment boom echoes historic manias that ended in recessions. Rising long-term Treasury yields hint at an \"incipient Trump discount\", yet do not fully price inflation risks. De-anchored expectations, fiscal and financial dominance, and short-duration debt held by leveraged hedge funds leave central banks dangerously exposed.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20BT/How%20long%20until%20there%20is%20a%20US%20markets%20reckoning%20over%20Trump's%20damage.pdf"}, {"id": "bt-06", "title": "Lentor Gardens Residences sells 54% of 499 units over launch weekend", "source": "BT", "date": "20 Jul 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Lentor Gardens Residences, the seventh private launch in Singapore's Lentor precinct, sold 270 of 499 units, about 54 per cent, over its Jul 18-19 launch weekend at an average S$2,350 per square foot. All three commercial units sold at S$2,550 psf, developer Kingsford Group said. Three-bedroom units led at 42 per cent of transactions; Singaporeans made up 91 per cent of buyers. Analysts called it a solid result, noting six earlier Lentor projects have sold 99.2 per cent of units. Prices from about S$1.4 million for two-bedders sit within mass-market reach, aided by proximity to Lentor MRT and schools. Resilient Outside Central Region demand, pent-up buying after May cooling measures, and tight supply underpinned the strong take-up.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20BT/Lentor%20Gardens%20Residences%20sells%2054%20of%20499%20units%20over%20launch%20weekend.pdf"}, {"id": "bt-07", "title": "London landlords head for the exit as rent laws deal final blow", "source": "BT", "date": "20 Jul 2026", "tags": ["Finance & Markets", "Society"], "summary": "UK landlords, squeezed for a decade, are exiting the buy-to-let market, with London hardest hit. The Renters' Rights Act, effective May 1, bars no-fault evictions, replaces fixed terms with rolling contracts, limits rent hikes and deposits, and bans bidding above advertised rent. London had 5 per cent fewer rooms to rent in the second quarter year-on-year, per SpareRoom, as landlord confidence fell. Savills estimates 30 per cent of London homes listed in the year to March were former buy-to-lets. Rents hit records as supply dropped, while buy-to-let is now 13.8 per cent of individuals' mortgage debt, a 12-year low. Critics warn tenants ultimately pay through higher rents and reduced maintenance. New PM Andy Burnham offers landlords no reprieve.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20BT/London%20landlords%20head%20for%20the%20exit%20as%20rent%20laws%20deal%20final%20blow.pdf"}, {"id": "bt-08", "title": "OpenAI grapples with surging startup demand in Apac even as it expands Singapore team", "source": "BT", "date": "20 Jul 2026", "tags": ["Technology & AI", "Southeast Asia"], "summary": "Surging Asia-Pacific startup demand has become the biggest challenge for Thomas Jeng, OpenAI's regional head of startups, as companies race to adopt AI. \"We have so much demand,\" he said, returning to 800 emails after a week away. OpenAI, which pledged over US$300 million and 200-plus roles in Singapore over coming years, is expanding Jeng's team. Singapore is a top-five global market for its coding agent Codex, with adoption up roughly 17 times since late last year. OpenAI courts startups by demonstrating model performance directly, running workshops, hackathons and a credits programme, having extended over US$30 million in token credits across Apac. Jeng stresses building an ecosystem and availability over competing for market share, connecting founders across South-east Asia, Japan and the US.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20BT/OpenAI%20grapples%20with%20surging%20startup%20demand%20in%20Apac%20even%20as%20it%20expands%20Singapore%20team.pdf"}, {"id": "bt-09", "title": "Retail resets: Mall owners reposition shopping centres as Singapore's consumer landscape evolves", "source": "BT", "date": "20 Jul 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Major Singapore mall owners are launching a new wave of asset enhancement initiatives, investing hundreds of millions to reposition centres for shifting consumer habits and better returns. CapitaLand Integrated Commercial Trust's S$160 million revamp of Plaza Singapura and The Atrium@Orchard, running from Q3 2026 to end-2028, targets 6 to 7 per cent ROI and introduces experiential entertainment and themed dining, prompting closures like Golden Village and Tim Ho Wan. Frasers Centrepoint Trust's S$90 million NEX upgrade targets 7 per cent, converting carpark into retail and office space. Unlike 2000s refreshes, today's initiatives respond to e-commerce and declining anchor tenants. Well-capitalised Reits and institutional owners, with deep data and pockets, are best placed; enhancement yields beat low-4 per cent acquisition yields.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20BT/Retail%20resets%20Mall%20owners%20reposition%20shopping%20centres%20as%20Singapore's%20consumer%20landscape%20evolves.pdf"}, {"id": "bt-10", "title": "Rising AI bills push Singapore companies to chase ROI over 'tokenmaxxing'", "source": "BT", "date": "20 Jul 2026", "tags": ["Technology & AI", "Southeast Asia"], "summary": "Singapore companies are moving past AI experimentation to demand clearer returns as bills climb. Bain & Co found token prices halved between 2024 and 2025, but consumption surged 4.5 times, lifting overall spending. Singtel CEO Yuen Kuan Moon said not everything needs the latest frontier model, \"where you are maxing out your tokens.\" Google says Singapore is Gemini's highest per-capita adoption market and GIC notes it leads in Claude use, yet only 6 per cent of Singaporean desk workers use AI daily versus 11 per cent globally. Firms are matching models to workloads, reserving costly frontier models for complex reasoning and using open-weight models for classification and summarisation. Agentic workflows drive rising token use, pressuring costs at firms like AvePoint.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20BT/Rising%20AI%20bills%20push%20Singapore%20companies%20to%20chase%20ROI%20over%20'tokenmaxxing'.pdf"}, {"id": "bt-11", "title": "South Korea to ease forex rules for foreigners to trade won in push to liberalise market", "source": "BT", "date": "20 Jul 2026", "tags": ["Finance & Markets", "Trade"], "summary": "South Korea has unveiled a detailed plan to make the won freely tradable among foreigners, its boldest step yet toward full convertibility. From January 2027, foreign investors can conduct unlimited won transactions through pre-registered foreign firms, ending the need for local won accounts, the finance ministry said with the central bank and regulators. Settlements will run through a new 24-hour Bank of Korea network piloting in September. The package eases reporting thresholds, exempts most foreigner-to-foreigner transfers from advance reporting, and permits securities lending of treasury bonds via Euroclear and Clearstream. Forex restrictions have long blocked MSCI developed-market status. Building on July's 24-hour won trading, the reforms aim to internationalise the currency and attract global reserve managers and pension funds.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20BT/South%20Korea%20to%20ease%20forex%20rules%20for%20foreigners%20to%20trade%20won%20in%20push%20to%20liberalise%20market.pdf"}, {"id": "bt-12", "title": "The due diligence that investors in family businesses must not skip", "source": "BT", "date": "20 Jul 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "For minority shareholders in family-controlled companies, common across Asia and Singapore's exchange, the true risk is how the family exercises control, not just business performance. Value can drift away through incremental, disclosed decisions: a listed firm buying property from the chairman's private vehicle, recurring management fees, licensing charges and supply contracts with family companies, and large cash balances that governance research links to lower valuations. Placements dilute outsiders while cheaply handing families more shares, and privatisation offers can be pitched low. Research by Claessens, Djankov and Lang shows East Asian families control through pyramids, with voting power exceeding ownership. Singapore's safeguard: related-party transactions above 3 per cent of net tangible assets must be announced, and above 5 per cent need a shareholder vote with the family abstaining.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20BT/The%20due%20diligence%20that%20investors%20in%20family%20businesses%20must%20not%20skip.pdf"}, {"id": "scmp-01", "title": "Alibaba says newest Qwen AI model is second only to Anthropic's Claude Fable 5", "source": "SCMP", "date": "20 Jul 2026", "tags": ["Technology & AI"], "summary": "Alibaba previewed Qwen3.8-Max-Preview, its strongest next-generation AI model, calling it \"second only\" to Anthropic's Claude Fable 5. With 2.4 trillion parameters, it ranks among the most powerful models available and is offered via Alibaba's Token Plan subscription and Qoder agentic platforms. The unveiling at Shanghai's World AI Conference highlights Chinese labs entering the \"multi-trillion parameter\" age. Days earlier, Moonshot AI launched the 2.8-trillion-parameter Kimi K3, the world's largest open-source model, which surpassed Fable 5 and GPT-5.6 in some coding benchmarks. Alibaba said Qwen3.8 will soon release as open-weight. President Xi backed open-source collaboration at the summit. Alibaba owns the South China Morning Post.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20SCMP/Alibaba%20says%20newest%20Qwen%20AI%20model%20is%20second%20only%20to%20Anthropic%E2%80%99s%20Claude%20Fable%205.pdf"}, {"id": "scmp-02", "title": "Alibaba targets Nvidia's dominant software ecosystem with open-source AI stack", "source": "SCMP", "date": "20 Jul 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "Alibaba's chip unit T-Head will open-source its proprietary software stack SAIL, the foundational architecture for its Zhenwu AI chips, to challenge Nvidia's dominant CUDA ecosystem. Announced at Shanghai's World AI Conference, the move joins similar campaigns by Huawei and Moore Threads to offer alternatives to Nvidia's toolkit, which locks programmers into its hardware. T-Head said developers can migrate existing code to mainstream frameworks in under seven days. The strategy supports Chinese tech self-sufficiency amid US-China rivalry and export controls on Nvidia's top processors. T-Head aims to commercialise its Zhenwu chips; Alibaba had shipped 560,000 to over 400 clients by April. Alibaba is building full-stack AI capabilities and owns the SCMP.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20SCMP/Alibaba%20targets%20Nvidia%E2%80%99s%20dominant%20software%20ecosystem%20with%20open-source%20AI%20stack.pdf"}, {"id": "scmp-03", "title": "Asia's AI boom has a dirty secret: the coal that powers it", "source": "SCMP", "date": "20 Jul 2026", "tags": ["Energy", "Technology & AI", "Southeast Asia"], "summary": "Asia's rush to build AI data centres is being powered heavily by coal, the region's top \"stopgap source\" as renewable capacity lags surging electricity demand. Analysts say solar and wind cannot deliver the round-the-clock baseload data centres need. In Malaysia's Cyberjaya, dozens of data centres run already, straining water and power supplies that worry residents. Backup power systems now face two-year-plus waits amid manufacturing shortages. The US-Israel war on Iran has whipsawed oil prices from around US$60 to nearly US$120 a barrel, driving Singapore electricity tariffs to record highs and pushing the Philippines toward solar. Malaysia's subsidised rates have held, but analysts warn of eventual electricity and water choke points across Southeast Asia.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20SCMP/Asia%E2%80%99s%20AI%20boom%20has%20a%20dirty%20secret%20the%20coal%20that%20powers%20it.pdf"}, {"id": "scmp-04", "title": "Beijing steps in to stem China's stock market decline with US$8.9b in state purchases", "source": "SCMP", "date": "20 Jul 2026", "tags": ["Finance & Markets", "Politics"], "summary": "Two state-backed firms bought about 60 billion yuan (US$8.86 billion) of Chinese stocks to halt a market slide, a clear sign of government intervention. China Reform Holdings spent over 50 billion yuan on mainland-listed shares of centrally owned companies, while China Chengtong Holdings bought nearly 10 billion yuan of stocks and ETFs. The purchases follow brutal sell-offs, with the tech-heavy Star Market 50 Index tumbling more than 20 per cent from a record high into bear-market territory. The intervention underscores Beijing's push to stabilise its US$15 trillion market, seen as key to technological independence. Other state-backed shareholders announced stake increases or buybacks. The securities regulator convenes Monday with brokerages and fund firms to discuss stabilisation.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20SCMP/Beijing%20steps%20in%20to%20stem%20China%E2%80%99s%20stock%20market%20decline%20with%20US%248.9b%20in%20state%20purchases.pdf"}, {"id": "scmp-05", "title": "Changzhou says it is building China's first city-level clean-power AI token factory", "source": "SCMP", "date": "20 Jul 2026", "tags": ["Technology & AI", "Energy"], "summary": "The eastern Chinese city of Changzhou is building what it calls the country's first city-level \"green token factory,\" answering Beijing's call to power AI computing with clean energy. Announced during Shanghai's World AI Conference, the project would produce 60 trillion tokens a year once completed, though no timeline was given. It would connect directly to renewable plants under a national policy allowing green power to bypass public grids, with token output expected to rise 62.5 per cent using the same computing resources. The agreement involves seven parties including Alibaba Cloud. Tokens are the basic unit for billing AI services. China's daily token consumption surged over 1,000-fold in two years. Beijing and Wenzhou have launched similar token facilities. Alibaba owns the SCMP.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20SCMP/Changzhou%20says%20it%20is%20building%20China%E2%80%99s%20first%20city-level%20clean-power%20AI%20token%20factory.pdf"}, {"id": "scmp-06", "title": "China ramps up ethylene output, aka 'industrial gold', amid Iran war disruptions", "source": "SCMP", "date": "20 Jul 2026", "tags": ["Energy", "Trade"], "summary": "China is expanding ethylene production in its oil-and-gas-rich west as Middle East conflict raises supply-chain concerns. PetroChina subsidiary Dushanzi Petrochemical brought a new line online in Xinjiang, adding 1.2 million tonnes of annual capacity to reach 3 million tonnes, making it central and western China's largest ethylene hub. The move rebalances output away from eastern coastal regions, which accounted for 65 per cent of national capacity. Ethylene, dubbed \"industrial gold,\" is critical for plastics, fibres and advanced materials; China is the world's top producer at over 62 million tonnes. The US-Israel war on Iran has disrupted naphtha supplies, cutting Japanese plant operating rates to record lows. PetroChina calls the solar-powered base its first \"fully green\" production chain, supporting 2030 carbon-peak goals.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20SCMP/China%20ramps%20up%20ethylene%20output,%20aka%20%E2%80%98industrial%20gold%E2%80%99,%20amid%20Iran%20war%20disruptions.pdf"}, {"id": "scmp-07", "title": "China team cuts 3D optical chip production time from hours to seconds", "source": "SCMP", "date": "20 Jul 2026", "tags": ["Technology & AI"], "summary": "A Chinese research team says it has overcome a major manufacturing hurdle for photonic chips, cutting production time for complex three-dimensional optical structures from hours to seconds. Published in Advanced Materials on July 4, the study was led by scientists from the Chinese Academy of Sciences' Institute of Physics with the University of Hong Kong and others. Instead of a focused ion beam sculpting devices one at a time, the team developed a parallel process that transforms 2D patterns into 3D architectures across an entire 10cm wafer simultaneously, combining broad ion beam etching with a self-folding \"origami\" strategy. It achieves angular uniformity exceeding 97 per cent and cuts fabrication time by over two orders of magnitude, advancing photonics for AI computing amid intensifying global competition.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20SCMP/China%20team%20cuts%203D%20optical%20chip%20production%20time%20from%20hours%20to%20seconds.pdf"}, {"id": "scmp-08", "title": "China's AI weather warning system Mazu expanding across Global South", "source": "SCMP", "date": "20 Jul 2026", "tags": ["Technology & AI", "Environment"], "summary": "China's AI-powered weather warning system Mazu is now used on the ground in seven developing countries to help prepare for disasters such as typhoons and rainstorms. China Meteorological Administration chief engineer Pan Jinjun called it an international public good providing \"tailored early warning services\" and the first national project answering the UN Early Warnings for All initiative. The public cloud version has been tested by 40 Global South countries, while the full system is deployed in Pakistan, Djibouti, Ethiopia, Jordan, Mongolia, the Solomon Islands and Sri Lanka. Upgrades cut spatial resolution from 9km to 3km and enabled six-hourly forecasts. It integrates Chinese AI models and satellite data with partner-country observations. Officials say building Global South AI capabilities is a new governance focus, though data limits persist.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20SCMP/China%E2%80%99s%20AI%20weather%20warning%20system%20Mazu%20expanding%20across%20Global%20South.pdf"}, {"id": "scmp-09", "title": "China's state agencies are hiring retirees as the workforce rapidly ages", "source": "SCMP", "date": "20 Jul 2026", "tags": ["Society", "Politics"], "summary": "Chinese public-sector employers, from universities and hospitals to government agencies, are increasingly rehiring retirees to cope with a rapidly ageing society and shrinking working-age population. One 62-year-old former engineering professor in Sichuan returns as a research fellow at about 10,000 yuan monthly, less than before but without social security contributions since he draws a pension. More than 323 million people, roughly 23 per cent of the population, were aged 60 or above late last year. Beijing plans to gradually raise the retirement age from 60 to 63 for men and 55 to 58 for female office workers. Yunnan's transport bureau plans to hire 42 retired engineers as consultants, while universities across many provinces and a Xinjiang hospital have issued rehiring notices for \"silver-haired professionals.\"", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20SCMP/China%E2%80%99s%20state%20agencies%20are%20hiring%20retirees%20as%20the%20workforce%20rapidly%20ages.pdf"}, {"id": "scmp-10", "title": "China's tech giants fuel the rise of AI tokens as a new corporate currency", "source": "SCMP", "date": "20 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "AI tokens are becoming a new corporate currency in China as tech giants push staff to embed AI into daily work. One ByteDance employee says he burns close to a billion tokens monthly, yet is not near his department's top consumers. A token, called ciyuan in China, is the unit for measuring and billing AI use, like kilowatt-hours for electricity. A brutal price war is fuelling adoption: DeepSeek slashed its flagship V4-Pro price 75 per cent in May before later raising prices. Firms are experimenting with allocation: 360 Security distributed 100 million tokens across employee accounts without approval, Tencent handed out free tokens via internal tools with quotas reaching 40 million per day, and Alibaba granted allowances for tools like Qoder. Alibaba owns the SCMP.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20SCMP/China%E2%80%99s%20tech%20giants%20fuel%20the%20rise%20of%20AI%20tokens%20as%20a%20new%20corporate%20currency.pdf"}, {"id": "scmp-11", "title": "Chinese Nvidia alternatives project massive sales as AI chip demand surges", "source": "SCMP", "date": "20 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Chinese chip designers Moore Threads and Hygon, positioning as home-grown Nvidia alternatives, projected sharp first-half revenue growth on surging domestic AI computing demand. Moore Threads, a GPU developer, expects revenue to jump 135 to 149 per cent year on year to between 1.65 and 1.75 billion yuan, citing demand for its full-function GPUs and Kua'e AI clusters. Hygon, which designs CPUs and AI accelerators, projected 56 to 70 per cent growth to between 8.5 and 9.3 billion yuan. The forecasts reflect strong appetite for computing infrastructure as US export controls restrict Nvidia's advanced hardware in China. Shares of both fell Friday amid a broader AI chip retreat. Rivals include Biren, MetaX, Iluvatar CoreX and Enflame; Bernstein calls Hygon the key CPU beneficiary.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20SCMP/Chinese%20Nvidia%20alternatives%20project%20massive%20sales%20as%20AI%20chip%20demand%20surges.pdf"}, {"id": "scmp-12", "title": "Chinese company demands compensation from the UK over British Steel nationalisation", "source": "SCMP", "date": "20 Jul 2026", "tags": ["Trade", "Geopolitics"], "summary": "Jingye Group, the Chinese firm that formerly owned British Steel, demanded compensation from the UK government for investment losses after last week's nationalisation of the manufacturer. Britain took operational control after Jingye considered closing the blast furnaces at its Scunthorpe plant, the last in the UK making \"virgin steel\" from raw materials. Jingye said the move tarnished the government's credibility, spooked international investors and caused great losses, urging the UK to stop \"trampling on international investment rules.\" It has begun negotiation procedures under bilateral investment agreements, reserving the right to arbitration. The plant employs about 2,700 people; Jingye bought British Steel in 2020. The UK will conduct an independent evaluation on compensation. China's Foreign Ministry urged Britain to respect market principles.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/20%20Jul%202026/20%20Jul%20SCMP/Chinese%20company%20demands%20compensation%20from%20the%20UK%20over%20British%20Steel%20nationalisation.pdf"}, {"id": "scmp-13", "title": "Chinese shipbuilders snap up more supertanker orders as Iran war turmoil drags on", "source": "SCMP", "date": "20 Jul 2026", "tags": ["Trade", "Geopolitics", "Energy"], "summary": "Chinese shipbuilders have emerged as beneficiaries of Middle East turbulence and volatile oil prices, capturing 82 per cent of this year's global tanker orders by carrying capacity. BIMCO data showed crude oil tanker orders surged to a record 234 vessels totalling 60 million deadweight tons, most for very large crude carriers; Chinese yards bagged 133 of 151 VLCC orders placed worldwide. Official statistics show China led global completion volu
