 Markets"], "summary": "UOB is exiting fund manufacturing, selling its asset management arm to Allianz Global Investors (AllianzGI) for S$555 million as it moves toward an open-architecture wealth model focused on advisory and distribution. Excluding one-off costs, the sale generates a pre-tax gain of about S$330 million and lifts CET1 by around 14 basis points. A long-term strategic distribution partnership gives UOB clients access to AllianzGI's global product suite. The deal covers UOB Asset Management across eight markets with about S$42 billion in AUM; all 500 employees transfer to AllianzGI, which doubles its Singapore AUM. CEO Wee Ee Cheong said it sharpens focus on wealth advisory. Analysts noted UOB lags local peers in wealth. The transaction closes in 2027. UOB shares ended at S$43.06.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20BT/UOB%20to%20sell%20asset%20management%20arm%20to%20Allianz%20Global%20Investors%20for%20S555%20million,%20sharpen%20wealth%20advisory%20focus.pdf"}, {"id": "bt-24", "title": "US Fed's Cook ready to raise rates if inflation doesn't start easing", "source": "BT", "date": "6 Aug 2026", "tags": ["Finance & Markets"], "summary": "Federal Reserve Governor Lisa Cook said she is open to raising the central bank's short-term rate target to tackle \"too high\" US inflation, adding: \"I am prepared to act by raising rates, if necessary.\" Speaking in Anchorage, Cook said inflation risks now outweigh job-market risks and the Fed is running out of space, with PCE inflation at 3.7 per cent against the 2 per cent target. She warned inflation could become entrenched, saying policymakers lack the luxury of waiting. Cook voted last week to hold the 3.5-3.75 per cent target range, which drew three dissents favouring a hike; New York's Williams and Philadelphia's Paulson have signalled openness to raising. Chairman Kevin Warsh has withheld guidance. Cook said tariffs, the Middle East war and AI investment could ease price pressures.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20BT/US%20Fed's%20Cook%20ready%20to%20raise%20rates%20if%20inflation%20doesn't%20start%20easing.pdf"}, {"id": "bt-25", "title": "US ban on Chinese AI components unlikely to dent export engine", "source": "BT", "date": "6 Aug 2026", "tags": ["Trade", "Technology & AI", "Geopolitics"], "summary": "A US ban on Chinese data-centre components risks straining a fragile trade truce but is unlikely to hurt China's export engine. The FCC is drafting an order targeting optical transceivers; China exported US$61.6 million of them to the US in June, 8.7 per cent of worldwide shipments but a fraction of overall exports. The US was the biggest destination but has been overtaken by Malaysia, which received US$260 million that month, illustrating how firms can pivot to fast-growing markets. Chinese optical-equipment stocks slid, with Zhongji Innolight falling up to 14 per cent, while overseas rivals rallied. ANZ's Vicky Zhou said AI-related exports, nearly 23 per cent of shipments last year, will stay solid. The People's Daily accused Washington of \"unilateral bullying\" and vowed countermeasures.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20BT/US%20ban%20on%20Chinese%20AI%20components%20unlikely%20to%20dent%20export%20engine.pdf"}, {"id": "bt-26", "title": "US private payrolls increase moderately in July: ADP report", "source": "BT", "date": "6 Aug 2026", "tags": ["Finance & Markets"], "summary": "US private payroll growth slowed in July, the ADP national employment report showed. Private employment rose by 44,000 jobs after a downwardly revised 95,000 gain in June, missing the 70,000 economists had forecast. Education and health services added the bulk, 36,000 positions, while leisure and hospitality shed 11,000, with losses also in trade, transportation and utilities and in natural resources and mining. Manufacturing added 2,000 and construction 1,000. Pantheon's Samuel Tombs said firms are hiring less amid energy-price and AI cost pressures. The report, developed with the Stanford Digital Economy Lab, preceded Friday's more closely watched BLS jobs report. Economists expected nonfarm payrolls to rise 80,000 with unemployment steady at 4.2 per cent, though a Conference Board survey suggested the jobless rate could edge higher.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20BT/US%20private%20payrolls%20increase%20moderately%20in%20July%20ADP%20report.pdf"}, {"id": "bt-27", "title": "US tariff affects S$9.5 billion of Singapore's domestic exports: Gan Kim Yong", "source": "BT", "date": "6 Aug 2026", "tags": ["Trade", "Politics"], "summary": "About S$9.5 billion of Singapore's annual domestic exports to the US, roughly one-third of the total, are affected by Washington's new 12.5 per cent tariff, Deputy Prime Minister Gan Kim Yong told Parliament, adding that none of the 60 covered economies received a full exemption. Affected goods include optical instruments and chemical products, while energy, certain electronics, aerospace, pharmaceuticals and semiconductors are excluded. The measure, effective Jul 24, raises the effective tariff rate by an estimated 0.7 percentage point and followed a forced-labour supply-chain probe. Singapore was assessed at 12.5 per cent as it does not prohibit forced-labour goods imports. Gan said pursuing a lower rate via a reciprocal-trade agreement could carry heavy compliance costs and wider trade implications; the immediate priority is helping businesses and workers adjust.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20BT/US%20tariff%20affects%20S9.5%20billion%20of%20Singapore's%20domestic%20exports%20Gan%20Kim%20Yong.pdf"}, {"id": "bt-28", "title": "Yen drifts after intervention whirlwind; Iran optimism dents US dollar", "source": "BT", "date": "6 Aug 2026", "tags": ["Finance & Markets"], "summary": "The Japanese yen steadied on Aug 5 after its most volatile few days in months following historic intervention, while the US dollar traded near six-week lows as revived hopes of ending the Iran war blunted safe-haven demand. The yen held at 157.55 per dollar, having hit 155.2 on Monday after touching a 40-year low near 164 a week earlier. Treasury Secretary Scott Bessent said the US would do \"whatever it takes\" to support yen stabilisation, echoing Draghi. Friday's joint Tokyo-Washington purchases were the first US yen-buying intervention since 1998. Analysts called intervention a \"sticking plaster\" absent BOJ hikes, lower Fed odds or cheaper oil. Bessent's comments lifted expectations for a BOJ hike at its Sep 17-18 meeting. The dollar index fell 0.1 per cent to 99.71.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20BT/Yen%20drifts%20after%20intervention%20whirlwind%20Iran%20optimism%20dents%20US%20dollar.pdf"}, {"id": "scmp-01", "title": "Beijing decries 'bullying' US tech curbs that ensnare Chinese firms and products", "source": "SCMP", "date": "6 Aug 2026", "tags": ["Technology & AI", "Geopolitics", "Trade"], "summary": "A People's Daily commentary urged Washington to expand cooperation rather than its restrictive \"Covered List\", after the FCC added foreign-made power inverters and advanced robotics, including humanoids, barring new models from equipment authorisation. Chinese firms bear the brunt: China supplied a third of US power inverter imports in 2024, and Chinese vendors accounted for over 80 per cent of 13,000 robots shipped worldwide in 2025. The party mouthpiece branded the moves \"unilateral bullying\" that would force supply chains to diversify faster and backfire on America. A Qiushi Journal article defended AI \"distillation\" as standard practice, decrying US framing as \"AI hegemony\" amid frictions ahead of Xi Jinping's expected autumn US visit.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20SCMP/Beijing%20decries%20'bullying'%20US%20tech%20curbs%20that%20ensnare%20Chinese%20firms%20and%20products.pdf"}, {"id": "scmp-02", "title": "China competition looms large in 2027 US defence bill", "source": "SCMP", "date": "6 Aug 2026", "tags": ["Defence", "Geopolitics", "Politics"], "summary": "The financial year 2027 National Defence Authorisation Act reflects broad bipartisan consensus on countering Beijing, with House and Senate versions targeting Taiwan, AI, supply chains and South China Sea contingencies. The Senate bill would create a \"War Reserve Stock Programme\" pre-positioning munitions for Taiwan and redesignate a security initiative to add the Philippines. China's Washington embassy said it \"strongly deplores and firmly opposes\" the Taiwan provisions, warning of \"grave consequences\". Both versions seek to remove Chinese products from defence supply chains, banning Chinese optical fibre, humanoid robots, solar modules and connected vehicles. Experts flagged momentum for export controls on AI chips. The Senate has yet to debate after Democrats blocked a procedural vote.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20SCMP/China%20competition%20looms%20large%20in%202027%20US%20defence%20bill.pdf"}, {"id": "scmp-03", "title": "China urged to protect underwater cables amid growing fears of ocean sabotage", "source": "SCMP", "date": "6 Aug 2026", "tags": ["Geopolitics", "Technology & AI", "Defence"], "summary": "Shanghai Maritime University law professor Guo Ran urged Beijing to enact a law protecting undersea fibre-optic cables, which carry about 99 per cent of global intercontinental data, amid rising sabotage fears at chokepoints like the Red Sea and Baltic Sea. Writing in the state-supervised journal Democracy and Legal System, Guo said the 1982 UN Convention on the Law of the Sea offers little protection against grey-zone warfare, leaving coastal nations minimal enforcement power. He proposed no-anchor zones, expanded repair capacity, satellite surveillance, underwater drones and seabed sensors, and designating cables as critical information infrastructure. Beijing has accused Washington of \"politicising\" cable networks after a reported US$175.8 million US plan to replace Caribbean lines blocking Chinese firms.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20SCMP/China%20urged%20to%20protect%20underwater%20cables%20amid%20growing%20fears%20of%20ocean%20sabotage.pdf"}, {"id": "scmp-04", "title": "China's AI revenue projected to reach US$13b on breakthroughs, adoption: Goldman Sachs", "source": "SCMP", "date": "6 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Goldman Sachs raised its year-end run-rate revenue forecast for China's AI model market 30 per cent to US$13 billion, citing aggressive price cuts, technical breakthroughs and rising corporate adoption from players like DeepSeek and MiniMax. The bank lifted projected annualised revenues for Zhipu AI and MiniMax to US$2.5 billion and US$1 billion respectively. MiniMax launched its open-weight H3 multi-modal model priced at 30-50 per cent of incumbents, while DeepSeek released V4 Flash and Alibaba rolled out its 2.4-trillion-parameter Qwen3.8 Max, outperforming OpenAI's GPT-5.6 Sol at lower cost. Chinese open-weight models now command nearly 70 per cent of global token consumption on platforms like OpenRouter. Goldman warned of possible curbs on foreign model-weight downloads.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20SCMP/China's%20AI%20revenue%20projected%20to%20reach%20US13b%20on%20breakthroughs,%20adoption%20Goldman%20Sachs.pdf"}, {"id": "scmp-05", "title": "China's Moonshot AI aims for US$50b round as year-end Hong Kong IPO targeted: sources", "source": "SCMP", "date": "6 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Chinese unicorn Moonshot AI has begun a financing round expected to close by month-end at a valuation of up to US$50 billion, as it dismantles its offshore structure to enable a possible Hong Kong IPO as early as year-end, two sources said. The round, its final before listing, follows a roughly US$30 billion round last month; the sharp valuation jump reflects strong investor appetite after the mid-July release of its Kimi K3 model, which the company says outperformed leading Anthropic and OpenAI systems in certain capabilities. Moonshot notified investors in May it would unwind its variable interest entity structure, held via a Cayman Islands parent, amid Beijing's tightening scrutiny of offshore entities. The process could take months.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20SCMP/China's%20Moonshot%20AI%20aims%20for%20US50b%20round%20as%20year-end%20Hong%20Kong%20IPO%20targeted%20sources.pdf"}, {"id": "scmp-06", "title": "China's Palantir? Private tech firms surge into defence AI, aiming to match US giants", "source": "SCMP", "date": "6 Aug 2026", "tags": ["Defence", "Technology & AI", "Geopolitics"], "summary": "A growing number of Chinese private firms are entering defence AI under Beijing's military-civil fusion strategy, aspiring to rival US software makers like Palantir. Hangzhou-based Jingan Technology markets its Jingqi platform as a counterpart to Palantir's Gotham, claiming it predicted US strikes on Iran over 50 days in advance; its customers include major state defence conglomerates. Others include satellite-imagery firm MizarVision, US-sanctioned during the Iran conflict, and start-up EverReach AI. Analysts say Chinese tech proficiency may be closing gaps, but the US remains far ahead in integrating AI into operational decision-making. SCSPI's Hu Bo said, \"The gap doesn't lie in the technology.\" Long procurement cycles, cost controls and lack of combat validation remain obstacles.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20SCMP/China's%20Palantir%20Private%20tech%20firms%20surge%20into%20defence%20AI,%20aiming%20to%20match%20US%20giants.pdf"}, {"id": "scmp-07", "title": "China's baby boom depends on gender equality, not cash handouts", "source": "SCMP", "date": "6 Aug 2026", "tags": ["Society", "Politics"], "summary": "This opinion piece argues China's new national childcare subsidy, allocated 99.9 billion yuan (US$14.8 billion) this year to pay families 3,600 yuan annually per child under three, is welcome but insufficient to reverse falling births. More than 25 million babies' families have received it. The author, drawing on her own experience in a 1980s Nanjing state factory, contends the true cost of motherhood lies in time and career damage, not money. A 2024 survey found women spent 3 hours 29 minutes daily on unpaid care versus 1 hour 52 minutes for men, and mothers face a workplace \"penalty\". She urges affordable childcare, substantial non-transferable paternity leave, stronger anti-discrimination enforcement and greater household gender equality.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20SCMP/China's%20baby%20boom%20depends%20on%20gender%20equality,%20not%20cash%20handouts.pdf"}, {"id": "scmp-08", "title": "China's foreign reserves hold steady as external earnings stay in private hands", "source": "SCMP", "date": "6 Aug 2026", "tags": ["Finance & Markets"], "summary": "China's foreign exchange reserves barely moved last year despite a record US$1.18 trillion trade surplus, as external earnings increasingly accrued to households, banks and companies rather than the central bank, an Institute of International Finance report shows. In 2025, the non-reserve sector became a net creditor in its own right for the first time; residents acquired a record US$808 billion in non-reserve foreign assets, pushing total non-reserve external assets past US$8 trillion. Resident portfolio outflows surged 70 per cent to US$361 billion. Beijing's crackdown on informal capital flight and platforms like Futu and Tiger Brokers is channelling flows through Stock Connect. Hong Kong absorbed nearly two-thirds of outflows and holds about half the external portfolio stock.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20SCMP/China's%20foreign%20reserves%20hold%20steady%20as%20external%20earnings%20stay%20in%20private%20hands.pdf"}, {"id": "scmp-09", "title": "China's moves to fuel growth driven by consumption are strategic", "source": "SCMP", "date": "6 Aug 2026", "tags": ["Finance & Markets", "Trade", "Politics"], "summary": "This SCMP editorial welcomes Beijing's first stand-alone five-year plan for consumption, targeting 60 trillion yuan (US$8.9 trillion) in retail sales by 2030, as an essential pivot from export reliance to domestic demand. It argues subsidies, which drove over 1.1 trillion yuan in electronics and appliance sales in early 2026, are temporary fixes. The EV market illustrates the dilemma: weak domestic demand pushed carmakers into \"involution\" price wars, with BYD's exports up nearly 74 per cent while home sales fell 38.5 per cent, antagonising the EU and threatening German producers like BMW, Porsche and Volkswagen. The plan requires annual growth of at least 3.66 per cent and hinges on improving labour markets, incomes and consumer confidence.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20SCMP/China's%20moves%20to%20fuel%20growth%20driven%20by%20consumption%20are%20strategic.pdf"}, {"id": "scmp-10", "title": "China's retaliation against US shows depth of its trade war strategy, analysts say", "source": "SCMP", "date": "6 Aug 2026", "tags": ["Trade", "Geopolitics", "Politics"], "summary": "China's latest export controls and sanctions against American firms underscore Beijing's expanding economic toolkit, analysts said. The commerce ministry announced tighter drone export controls, sanctions on seven US companies, and its first foreign trade-related national security investigation, targeting imported printing equipment using foreign software. Moves responded to US actions including 43 Chinese firms sanctioned under a forced-labour law and FCC bans on Chinese drones, robots and inverters. Asia Society's Wendy Cutler called the response a \"sharp contrast\" to Trump's first term. Analysts noted Beijing's calibrated \"countermeasures framework\" has \"come of age\" while leaving room to de-escalate. A US official said Washington was \"deeply disappointed\", warning escalation threatens stabilisation ahead of Xi's September visit.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20SCMP/China's%20retaliation%20against%20US%20shows%20depth%20of%20its%20trade%20war%20strategy,%20analysts%20say.pdf"}, {"id": "scmp-11", "title": "Chinese and Western firms are teaming up even as governments fight", "source": "SCMP", "date": "6 Aug 2026", "tags": ["Trade", "Geopolitics", "Finance & Markets"], "summary": "This opinion piece argues that even as Beijing, Washington and Brussels wage tariff and export-control battles, Chinese and Western manufacturers are increasingly forming joint ventures as a hedge against government friction. It cites Geely and Ford agreeing to build NEVs at Ford's Valencia, Spain plant, giving Geely a \"Made in Europe\" badge to dodge tariffs while Ford gains Geely's EV architecture. Battery maker CATL is licensing production technology to a Ford-owned Michigan plant to avoid US security reviews, while BASF and WuXi AppTec deepen China ties. The author says fragmented global governance rewards localised production, creating a \"third space\": factories Chinese in technology, Western in management, locally registered. Such alliances remain fragile amid intensifying investment screening.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20SCMP/Chinese%20and%20Western%20firms%20are%20teaming%20up%20even%20as%20governments%20fight.pdf"}, {"id": "scmp-12", "title": "Chinese optical-module stocks rebound as analysts downplay 'mild' AI curbs proposed by US", "source": "SCMP", "date": "6 Aug 2026", "tags": ["Technology & AI", "Finance & Markets", "Trade"], "summary": "Shares of China's leading optical-module makers clawed back early losses on Wednesday after analysts said proposed US restrictions barring new Chinese optical transceivers from American AI data centres would be relatively mild. Zhongji Innolight closed down 7.3 per cent in Shenzhen while US rivals Coherent and Lumentum had surged. A Reuters report said the FCC-drafted rule, targeting new models this year, would leave existing supply chains intact, akin to earlier robot and inverter rules. China's foreign ministry \"firmly opposes\" the move. Chinese makers dominate supply, holding nearly two-thirds of unit shipments and 60 per cent of revenue; Counterpoint's Neil Shah said replacing that capacity within years \"would be very difficult\". Chinese firms remain reliant on US and allied components.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20SCMP/Chinese%20optical-module%20stocks%20rebound%20as%20analysts%20downplay%20'mild'%20AI%20curbs%20proposed%20by%20US.pdf"}, {"id": "scmp-13", "title": "Copper floods US as traders try to get the jump on Trump tariffs, but 'Taco' trend looms", "source": "SCMP", "date": "6 Aug 2026", "tags": ["Trade", "Finance & Markets", "Energy"], "summary": "Spurred by Trump's proposed tariffs on cathode imports, more than 200,000 tonnes of copper landed in US ports in July, a 12-year monthly high, pushing combined Comex and LME US inventories above 740,000 tonnes. The rush is draining stocks elsewhere: Shanghai-area bonded warehouse copper fell below 30,000 tonnes from over 300,000 at year's start. Traders are exploiting arbitrage, with Comex trading at a premium to LME of up to US$600 per tonne. Trump directed commerce secretary Howard Lutnick to weigh phased refined-copper tariffs starting at 15 per cent in January 2027. Analysts warn a \"Taco\" scenario, where \"Trump always chickens out\", would collapse the US copper pool and sink Comex prices sharply short-term.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20SCMP/Copper%20floods%20US%20as%20traders%20try%20to%20get%20the%20jump%20on%20Trump%20tariffs,%20but%20'Taco'%20trend%20looms.pdf"}, {"id": "scmp-14", "title": "Disputes over AI, robotics, trade mount ahead of planned Xi-Trump summit in US", "source": "SCMP", "date": "6 Aug 2026", "tags": ["Geopolitics", "Technology & AI", "Trade"], "summary": "A series of trade and technology rifts has emerged between the US and China ahead of Xi Jinping's planned September Washington visit. After Moonshot AI's Kimi K3 launch, White House official Michael Kratsios accused it of distilling Anthropic's Claude Fable model, while Scott Bessent warned of possible sanctions; Beijing called it \"AI hegemonism\". The FCC expanded its Covered List to ban new advanced robots and connected inverters, and is drafting a ban on Chinese optical transceivers. Washington added 43 Chinese firms to a forced-labour blacklist under the Uygur Forced Labour Prevention Act. On Wednesday Beijing retaliated with case-by-case drone export scrutiny and blacklisted seven US entities, accusing them of aiding Xinjiang sanctions and FCC measures.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20SCMP/Disputes%20over%20AI,%20robotics,%20trade%20mount%20ahead%20of%20planned%20Xi-Trump%20summit%20in%20US.pdf"}, {"id": "scmp-15", "title": "Does Beijing really have the power to lift up the Australian dollar?", "source": "SCMP", "date": "6 Aug 2026", "tags": ["Finance & Markets", "Energy"], "summary": "While markets watched a Washington-Tokyo move to prop up the yen, Australian dollar traders focused on China, believing Beijing stimulus could lift the currency. A Goldman Sachs report says the link is more selective than assumed, resting mainly on commodity demand. Australia ranks as the G10 economy most exposed to Chinese final domestic demand, but much of the Aussie-yuan correlation reflects shared US dollar moves. Copper explains currency moves more than iron ore, despite China buying US$73.8 billion of Australian iron ore last year. Housing and investment-driven Chinese growth historically generates larger spillovers than consumer demand. Beijing refrained from broad stimulus at its late-July Politburo despite Q2 growth slowing to 4.3 per cent. Goldman warned persistent property weakness limits any boost.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20SCMP/Does%20Beijing%20really%20have%20the%20power%20to%20lift%20up%20the%20Australian%20dollar.pdf"}, {"id": "scmp-16", "title": "Japan tests long-range Type 12 missile as counterstrike capability against China grows", "source": "SCMP", "date": "6 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "Japan began flight testing the air-launched variant of its upgraded Type 12 anti-ship missile, a weapon with a reported 1,000km range, marking a milestone in efforts to counter Chinese naval power. Photos on July 30 at Gifu airbase showed a Mitsubishi F-2B carrying two inert missiles. The ground-launched variant entered service in March as the Type 25, extending Japan's anti-ship range from about 200km; ship- and air-launched versions arrive around next financial year, with a submarine-launched version in development. Experts said air-launch platform flexibility complicates Chinese defence planning and reinforces the US alliance, while enabling domestic production in larger numbers than imported Tomahawks. Analysts cautioned that a resilient sensor and targeting network remains \"the biggest challenge\".", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20SCMP/Japan%20tests%20long-range%20Type%2012%20missile%20as%20counterstrike%20capability%20against%20China%20grows.pdf"}, {"id": "scmp-17", "title": "Most Americans say US has not achieved war goals in Iran, survey finds", "source": "SCMP", "date": "6 Aug 2026", "tags": ["Geopolitics", "Energy", "Society"], "summary": "A Marquette Law School poll released Wednesday found 88 per cent of Americans believe the Trump administration has not achieved its war objectives against Iran, up seven points from April, while just 12 per cent thought it had. Some 75 per cent considered the war not worth the cost. The findings came amid intensified talks to reopen the Strait of Hormuz, with Iran negotiating via Oman; Secretary of State Marco Rubio cited \"progress in talks, but not finality yet\". Over 40 per cent believed Iran now had greater control over the strait. After coordinated US-Israeli strikes in February and Tehran's closure of the strait, energy prices surged; US petrol now averages about US$4.10 a gallon, up over 30 per cent. The July survey sampled 1,076 adults.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20SCMP/Most%20Americans%20say%20US%20has%20not%20achieved%20war%20goals%20in%20Iran,%20survey%20finds.pdf"}, {"id": "scmp-18", "title": "PLA scientists say submarine cables carrying 99% of global data could be 'easy target'", "source": "SCMP", "date": "6 Aug 2026", "tags": ["Defence", "Technology & AI", "Geopolitics"], "summary": "Undersea cables that carry 99 per cent of intercontinental data and support an estimated US$10 trillion in daily cross-border transactions are increasingly vulnerable to low-cost drones, Chinese military researchers warned. Writing in Science and Technology Daily, National Defence University's Shi Guanglei and Shi Haiming said the seabed is becoming a \"new arena for great power rivalry\" as unmanned undersea vehicles lower the barrier to undersea warfare. They cited the 2022 Nord Stream sabotage and Red Sea cable cuts, and accused the Aukus pact of building a seabed monitoring network under the \"guise\" of protecting cables. They envisioned AI-enabled \"undersea wolf packs\" of hundreds of UUVs. The International Cable Protection Committee notes accidental damage remains the predominant cause.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20SCMP/PLA%20scientists%20say%20submarine%20cables%20carrying%2099%20of%20global%20data%20could%20be%20'easy%20target'.pdf"}, {"id": "scmp-19", "title": "Tencent ramps up overseas AI push with wider roll-out of flagship Hy3 model", "source": "SCMP", "date": "6 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Tencent is expanding the global roll-out of its flagship Hy3 AI model, offering it to developers, enterprises and users via its WorkBuddy agent, Design Miora studio and TokenHub platform, free on WorkBuddy until August 31. Hy3, Tencent's most powerful model with 295 billion parameters, is the first major update since former OpenAI researcher Yao Shunyu joined to lead foundational AI. API call volume rose more than 68-fold versus the prior generation, and the model briefly topped OpenRouter's usage leaderboard before slipping to third behind DeepSeek's V4 Flash and Xiaomi's MiMo-V2.5. WorkBuddy was June's most popular desktop workplace AI agent with nearly 21 million users. Tencent is battling Alibaba, ByteDance, DeepSeek and Zhipu after Hunyuan was surpassed domestically. Alibaba owns the SCMP.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20SCMP/Tencent%20ramps%20up%20overseas%20AI%20push%20with%20wider%20roll-out%20of%20flagship%20Hy3%20model.pdf"}, {"id": "scmp-20", "title": "US hawks push Trump on multibillion-dollar Taiwan arms deal ahead of Xi summit", "source": "SCMP", "date": "6 Aug 2026", "tags": ["Geopolitics", "Defence", "Politics"], "summary": "Washington has reopened discussions on a US$14 billion arms package for Taiwan, casting a shadow over a leaders' summit weeks away. Republican lawmaker Michael McCaul said in Taiwan on Tuesday he was confident Trump would soon forward the package to Congress, noting last December's record US$11 billion sale. Trump earlier called the deal \"a very good negotiating chip\" but paused it in May to prioritise Iran-war weapons stockpiles. Analysts warned Taiwan is a strict red line that could derail talks. Fudan's Wu Xinbo said McCaul's remarks were largely domestic, aimed at placating China hawks. International Crisis Group's William Yang said Trump would likely prioritise the September summit and that pressing arms sales could be a \"miscalculation\", risking escalation.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20SCMP/US%20hawks%20push%20Trump%20on%20multibillion-dollar%20Taiwan%20arms%20deal%20ahead%20of%20Xi%20summit.pdf"}, {"id": "scmp-21", "title": "US-Japan trade thaw driven by shared yen for stronger currency", "source": "SCMP", "date": "6 Aug 2026", "tags": ["Finance & Markets", "Trade", "Geopolitics"], "summary": "A rare joint US-Japan intervention to stabilise the yen has lifted bilateral relations near-term, analysts said, though durability depends on the currency. Friday's operation, Washington's first yen purchase since 1998, came after the yen slumped to a four-decade low near 164 per dollar; it briefly rose to 155.2 before easing to 157.44 by Wednesday. Trump framed the move as helping Japan after months of tense talks over a US$63.9 billion trade deficit. A stronger yen makes US imports cheaper, could aid Japan's promised US$550 billion investment, and halts Japanese Treasury selling. Bessent said he would \"not hesitate\" to intervene again. But analysts including BMI doubt a sustained turnaround absent Bank of Japan rate hikes, especially as oil-import costs and a food-tax cut pressure the yen.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20SCMP/US-Japan%20trade%20thaw%20driven%20by%20shared%20yen%20for%20stronger%20currency.pdf"}, {"id": "scmp-22", "title": "Why did a Chinese bomber carry a nuclear-capable missile in an anti-ship exercise?", "source": "SCMP", "date": "6 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "The PLA has released the first official footage of a nuclear-capable air-launched ballistic missile, the Jing Lei-1, mounted on an H-6N bomber in combat-ready status during a joint anti-ship exercise. Aired on CCTV's documentary Securing Victory for the PLA's 99th anniversary, the JL-1 is regarded as the final piece of China's nuclear triad, giving strategic bombers a long-range air-based deterrent. Analyst Fu Qianshao said its role would be striking high-value strategic nodes like command centres rather than mere ships, with the H-6N-JL-1 combination covering \"almost the entire Pacific Ocean\"; the missile's range exceeds 5,000km. The Southern Theatre Command drill also showed the first confirmed firing of a YJ-20 hypersonic missile from a Type 052D destroyer, plus a YJ-12 \"aircraft-carrier killer\".", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/06%20Aug%202026/06%20Aug%20SCMP/Why%20did%20a%20Chinese%20bomber%20carry%20a%20nuclear-capable%20missile%20in%20an%20anti-ship%20exercise.pdf"}]}, "2026-08-07": {"date": "2026-08-07", "dayOfWeek": "Friday", "totalArticles": 75, "sourceCounts": {"WSJ": 13, "ST": 21, "BT": 20, "SCMP": 21}, "executiveDigest": "A Hormuz breakthrough curdled into fresh doubt: even as the Oman deal advanced, Iran struck targets in the strait and moved to bar US and Israeli vessels, sending US stocks down and oil up while gold logged its biggest jump in six months. The dollar sat near a six-week low as Bessent's yen intervention showed 'unintended consequences', and Singapore's big banks delivered - OCBC and UOB lifted interim dividends on double-digit Q2 profit gains - even as an AI-stock sell-off hammered Asia hedge funds and SoftBank borrowed US$10 billion against its OpenAI stake.", "briefingCards": [{"title": "Lead story - Hormuz deal advances, then wobbles", "body": "The strait swung from hope to alarm in a day: SCMP reported 'Iran seeks to bar US ships as the Hormuz deal with Oman advances', BT said Tehran is reviewing a bill to ban US and Israeli vessels, and ST reported Iran struck targets inside the strait - so oil extended gains while WSJ marked 'U.S. stocks down on Hormuz deal doubts'. WSJ asked whether 'Iran's diminished diplomats can deliver a deal', BT framed Trump's 'menu of bad options', and SCMP described a US 'trapped in a dreadful situation of its own making'. Around it, Houthis wounded 11 in a Saudi attack, Sinopec stepped up Russian crude to offset Mideast cuts, and commentators urged the world to 'reckon with rising pressure on maritime choke points'."}, {"title": "Markets & finance", "body": "The yen intervention dominated: WSJ said 'Bessent's yen trade has unintended consequences', the dollar sat near a six-week low on Iran and payroll jitters, and SCMP warned US efforts to prop up the yen 'risk doing more harm than good'. Gold jumped the most in six months as Hormuz progress lowered rate-hike odds - and SCMP said its potential is still 'explosive' on Beijing hoarding - while the Fed's Daly defended July's hold and Q2 productivity accelerated. Singapore's banks shone: OCBC will pay a 47-cent interim dividend after Q2 profit jumped 22% to $2.22 billion, and UOB an 88-cent dividend on a 10% rise to $1.48 billion; SGX flagged an IPO pipeline of ~50 names amid record results."}, {"title": "Asia realignment", "body": "US-China friction escalated before a possible Xi-Trump summit: China opened a probe into Palo Alto Networks as trade tensions intensified, Trump unveiled trade actions on solar and chips, and SCMP asked whether the latest 'speed bump' could stall the summit. Beijing flexed elsewhere - Argentina renewed a US$19 billion currency swap 'brushing off Washington', and China's embassy accused the US of obstruction. Security signals multiplied: Chinese and Russian warships were seen circling Japan, SCMP weighed whether China's missiles target the US Kadena base, Pacific ministers will debate a China missile statement, and Indonesia moved to take over a state stake in a troubled China-funded rail line."}, {"title": "Energy & climate", "body": "Oil rose as Iran struck Hormuz targets and reviewed a vessel ban, and BT noted crude 'settled up US$3'; Sinopec stepped up Russian imports to offset Middle East cuts, and Australia posted a surprise trade surplus on commodity exports. Gold logged its biggest jump in six months. Climate stress was acute: SCMP reported a record heatwave hitting Asia with 'fears of an energy crisis and health risks', ST flagged China's 'coal-power lock-in' as a sign of green growing pains, and Google's US$19 billion India data-centre project drew water and wildlife concerns."}, {"title": "Technology & AI", "body": "Money and anxiety surged together: SoftBank borrowed US$10 billion against its OpenAI stake, Alphabet raised US$25 billion in a sought-after bond sale, and disclosures suggested OpenAI made up ~70% of Microsoft's AI sales. Yet the trade cracked - Asia multi-strategy hedge funds saw big drawdowns 'amid a brutal AI-stock sell-off', Chinese fund managers' AI bets backfired, and WSJ said once-hot software firms face an 'AI apocalypse'. China's low-cost push advanced: DeepSeek signalled a 'significant' price hike and invested US$20.8 million in Unitree's IPO, while its cheap AI shifted investor focus to internet stocks. The Bank of England said AI is boosting UK productivity but harming jobs, and Trump's tech ties drew bipartisan fire 'after AI agents went rogue'."}, {"title": "Singapore & SEA focus", "body": "Bank results led: OCBC will pay a 47-cent interim dividend after Q2 net profit jumped 22% to $2.22 billion, and UOB an 88-cent dividend on a 10% rise to $1.48 billion, underscoring resilient franchises. SGX pointed to an IPO pipeline of around 50 companies amid record results, and co-working firm JustCo narrowed its H1 loss 52% to US$839,000 in its first post-IPO results. On the watch list, Deutsche Bank and KBC froze some of Radiant World's Singapore accounts, Hong Kong data-centre prices soared on the Chinese AI boom, and Indonesia moved to take over a state firm's stake in a troubled China-funded high-speed railway - a reminder of the region's China-exposure calculus."}], "keyMetrics": [{"value": "75", "label": "Articles curated today", "sub": "WSJ 13 · ST 21 · BT 20 · SCMP 21"}, {"value": "Deal doubts", "label": "Hormuz wobbles", "sub": "Iran strikes; US stocks down, oil up"}, {"value": "6-mo high", "label": "Gold's biggest jump", "sub": "Rate-hike odds ease"}, {"value": "47c / 88c", "label": "OCBC & UOB dividends", "sub": "Q2 profit +22% / +10%"}, {"value": "6-week low", "label": "US dollar vs yen", "sub": "Bessent trade backfires"}, {"value": "~70%", "label": "OpenAI of MSFT AI sales", "sub": "SoftBank borrows US$10b on stake"}], "articles": [{"id": "wsj-01", "title": "America Needs to Go on Offense With AI", "source": "WSJ", "date": "7 Aug 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "In an opinion piece, Hillspire CTO Jonathan Zhukovsky argues the US is losing the open-weight AI race to China and that banning Chinese models would backfire. Citing the ATOM Report, he notes Chinese models overtook American ones in cumulative downloads by summer 2025, opening a 400-million gap; 70% of new fine-tuned models now build on Chinese foundations, with Alibaba's Qwen at 69% while Meta's Llama collapsed from 44% to 11%. Chinese labs release frequently, in multiple sizes, with permissive licenses, capturing the research \"contribution loop.\" He urges America to release top models openly and regularly, in multiple sizes, with raw versions, free licenses and funded shared tools. \"The real scoreboard is in Berkeley, and we are behind.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20WSJ/America%20Needs%20to%20Go%20on%20Offense%20With%20AI.pdf"}, {"id": "wsj-02", "title": "Can Iran's Diminished Diplomats Deliver a Hormuz Deal?", "source": "WSJ", "date": "7 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "Arab mediators fear Iran's diplomats, squeezed by hard-liners in Tehran, lack the clout to guarantee compliance with any deal to reopen the Strait of Hormuz. Negotiators Abbas Araghchi and Mohammad Bagher Ghalibaf embraced a plan splitting traffic into inbound and outbound lanes, but the Islamic Revolutionary Guard Corps demanded fee-charging rights, explicit recognition of Iran's role, and assurances the US will lift its blockade and sanctions. Talks have widened to include relief from the suspended June memorandum. Hard-line editor Hossein Shariatmadari called a Hormuz deal \"opening an escape route for the enemy,\" and one lawmaker is gathering documents to impeach Araghchi. Supreme Leader Mojtaba Khamenei, absent publicly since March, is described as more radical than his slain father.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20WSJ/Can%20Iran's%20Diminished%20Diplomats%20Deliver%20a%20Hormuz%20Deal.pdf"}, {"id": "wsj-03", "title": "Eurozone Retail Sales Retreat as Consumers Still Fret Over War", "source": "WSJ", "date": "7 Aug 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "Eurozone retail sales fell 0.3% on month in June, the second decline in four months since the war in Iran began, per Eurostat. The drop was led by Germany (-1.1%) and France (-0.5%), the bloc's largest economies. Food, drink and tobacco sales fell 0.5% and nonfood 0.4%, while automotive fuel rose 1.5% as oil prices eased. Consumer confidence had sunk in April to its lowest since 2022 on higher energy prices, though an ECB bulletin attributed much of the slowdown to war-related uncertainty rather than lost purchasing power. Confidence rose for a third month in July. Analysts said reopening the Strait of Hormuz could lift spending, but ING's Peter Vanden Houte warned a genuine consumption boom \"looks unlikely at this stage.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20WSJ/Eurozone%20Retail%20Sales%20Retreat%20as%20Consumers%20Still%20Fret%20Over%20War.pdf"}, {"id": "wsj-04", "title": "Facing AI 'Apocalypse,' Once-Hot Software Companies Race to Reinvent Themselves", "source": "WSJ", "date": "7 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Generative AI is upending software-as-a-service, prompting a \"SaaSpocalypse\" as AI agents replace subscription tools. Shares of Workday, Salesforce and Adobe have fallen over 30% from peaks; IBM lost $69 billion in a day in July; Bending Spoons agreed to buy Airtable for $1.3 billion, far below its $11 billion private valuation. Sahil Aggarwal's startup Rattle, once valued above $100 million, cut staff from 70 to 15 and rebuilt as an AI-native product, Von. Insight Partners is pushing portfolio companies to adapt or be sold for parts. Some pivots work: Intercom's Fin agent hit $400 million in recurring revenue and Salesforce agreed to buy it for $3.6 billion. \"All the pre-AI guys are gone,\" said SaaStr's Jason Lemkin.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20WSJ/Facing%20AI%20'Apocalypse,'%20Once-Hot%20Software%20Companies%20Race%20to%20Reinvent%20Themselves.pdf"}, {"id": "wsj-05", "title": "Israel Steps Up Attacks on Hezbollah, Clouding Talks With Lebanon", "source": "WSJ", "date": "7 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "Israel intensified strikes in southern Lebanon after two soldiers were killed by an explosive device in a booby-trapped building in Majdal Zoun, hitting what it called a Hezbollah command center and weapons-storage sites. The escalation complicated a seventh round of US-brokered, ambassador-level talks in Rome between Israeli and Lebanese diplomats, held since April. Both governments seek Hezbollah's disarmament, but officials concede force alone cannot achieve it and a political deal is needed. Israel handed back several villages last month but resisted returning more, first demanding a third party, likely Italy, verify areas are cleared of fighters and arms. Lebanese officials expect no major breakthrough before Israeli elections in October, when Netanyahu faces a difficult vote and withdrawals could anger his right-wing base.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20WSJ/Israel%20Steps%20Up%20Attacks%20on%20Hezbollah,%20Clouding%20Talks%20With%20Lebanon.pdf"}, {"id": "wsj-06", "title": "Russia's Drones Test Europe's Defenses", "source": "WSJ", "date": "7 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "A WSJ editorial argues Europe's military sites and critical infrastructure need better air defenses after a drone carrying military-grade explosives was found near a runway at Germany's Leipzig/Halle airport, a hub for arms transit to Ukraine; its detonator failed. An IISS report counted at least 144 suspicious drone sightings across 13 countries from August 2024 to February 2026, describing a sustained Russian campaign probing gaps, including near naval bases and sites hosting US nuclear weapons. Russia benefits from plausible deniability using commercial models and vessels. The board notes legal ambiguity over who may intercept drones, cites NATO's target to spend 5% of GDP on security by 2035, and warns Putin will keep testing Europe with \"substantial impunity.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20WSJ/Russia's%20Drones%20Test%20Europe's%20Defenses.pdf"}, {"id": "wsj-07", "title": "Scott Bessent's Yen Trade Has Unintended Consequences for the Markets", "source": "WSJ", "date": "7 Aug 2026", "tags": ["Finance & Markets"], "summary": "Columnist James Mackintosh examines the joint US-Japan effort to support the weak yen, financed by the Fed lending Japan dollars via repurchase agreements, expanding its balance sheet and easing conditions just as it is expected to tighten. Treasury Secretary Scott Bessent wants the Fed to lift the $60 billion cap and pledged \"whatever it takes.\" The yen in June hit its weakest trade-weighted, inflation-adjusted level since 1970, despite five BOJ rate rises against six Fed cuts. Speculative bets against the yen reached record highs, raising the risk of a disorderly reversal like 2024's carry-trade unwind, which triggered a 12% one-day Japanese stock plunge. Mackintosh warns the mechanism hints at a hidden Treasury-market worry and wrongly loosens US policy.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20WSJ/Scott%20Bessent's%20Yen%20Trade%20Has%20Unintended%20Consequences%20for%20the%20Markets.pdf"}, {"id": "wsj-08", "title": "Sen. Warren is pressing the Commerce Department for details on coming changes to official inflation numbers, the latest corner of the typically obscure federal statistics system to spark a political squabble", "source": "WSJ", "date": "7 Aug 2026", "tags": ["Politics", "Finance & Markets"], "summary": "Senator Elizabeth Warren is pressing the Commerce Department for details on coming changes to the Fed's preferred inflation gauge, the personal-consumption expenditures price index, warning tweaks warrant scrutiny amid a politicized data environment. Starting with August data published in September, the Bureau of Economic Analysis will change how it measures computer software, legal fees and investment advice, likely shaving about two-tenths of a point off inflation. The PCE index showed 3.7% in June, 3.3% excluding food and energy. Economists largely view the changes as defensible; there is no evidence of political motivation, and the BEA is led by civil servant Vipin Arora. Warren also challenged a ban on \"noise infusion\" used to protect census respondents' privacy.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20WSJ/Sen.%20Warren%20is%20pressing%20the%20Commerce%20Department%20for%20details%20on%20coming%20changes%20to%20official%20inflation%20numbers,%20the%20latest.pdf"}, {"id": "wsj-09", "title": "SoftBank Uses OpenAI Stake to Borrow $10 Billion", "source": "WSJ", "date": "7 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "SoftBank borrowed $10 billion from banks against its OpenAI stake, an unusual margin-style loan on private, loss-making shares, to help fund a final $10 billion tranche of its $30 billion OpenAI investment due by October. Lenders include Goldman Sachs, JPMorgan, Apollo, Mizuho and Sumitomo Mitsui; SoftBank must inject cash if OpenAI's valuation falls. By October, Masayoshi Son's group will have invested $64 billion for a 13% stake, concentrating its bets even as rival Anthropic overtakes OpenAI on revenue and valuation. SoftBank also plans to start building a 10-gigawatt Ohio data-center campus this year. Quarterly profit fell 18% to $2.2 billion. Executive Mark Agne said it was their choice to put \"all of our eggs in OpenAI.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20WSJ/SoftBank%20Uses%20OpenAI%20Stake%20to%20Borrow%2010%20Billion.pdf"}, {"id": "wsj-10", "title": "The Crypto Lobby Objects on the Clarity Act", "source": "WSJ", "date": "7 Aug 2026", "tags": ["Finance & Markets", "Politics"], "summary": "A WSJ editorial responds to crypto-industry pushback on its critique of the Senate's Clarity Act, focusing on stablecoin payments. Last year's Genius Act barred stablecoin issuers from paying interest, to stop them draining deposits from small banks, but didn't stop exchanges and wallets from paying returns. The Clarity Act purports to close that loophole yet, the board argues, its language would still permit cash back, rebates and even zero-interest loans as long as rewards aren't based solely on holdings. Small banks would lose most from this arbitrage. The board warns crypto remains entangled with banking, citing Circle breaking its dollar peg after Silicon Valley Bank's failure, and that taxpayers could face rescue calls. It also traded barbs with Ohio Senator Bernie Moreno.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20WSJ/The%20Crypto%20Lobby%20Objects%20on%20the%20Clarity%20Act.pdf"}, {"id": "wsj-11", "title": "There is concern about how AI is affecting work as each new month brings a wave of job-cut announcements from large employers. Here's how this year's layoffs are stacking up", "source": "WSJ", "date": "7 Aug 2026", "tags": ["Technology & AI", "Society"], "summary": "This WSJ Staff data feature tracks how AI is reshaping employment, compiling the wave of job-cut announcements that large employers unveil each month and charting how 2026's layoffs are stacking up against prior periods. Presented as an interactive graphic, it aggregates corporate layoff disclosures to gauge the scale and pace of workforce reductions amid mounting concern that artificial intelligence is automating tasks and displacing roles. The piece frames the cuts within the broader anxiety over AI's effect on white-collar and technology work, letting readers compare running monthly and cumulative totals. Because the article is chart-driven, its narrative text is limited to this framing; the underlying figures are conveyed through the visualizations rather than prose.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20WSJ/There%20is%20concern%20about%20how%20AI%20is%20affecting%20work%20as%20each%20new%20month%20brings%20a%20wave%20of%20job-cut%20announcements%20from%20large%20empl.pdf"}, {"id": "wsj-12", "title": "U.S. Intel Finds Putin Could Test NATO's Resolve With Limited Incursion", "source": "WSJ", "date": "7 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "New US intelligence assessments warn President Vladimir Putin could test NATO's resolve within a few years through scenarios ranging from a cyberattack to a small-scale land incursion on the alliance's eastern flank, timed between this fall and 2029. A limited land assault is deemed low-probability but rising, as it would trigger Article 5. The reports coincide with shortfalls in critical munitions, including Precision Strike and Army Tactical Missiles, Stingers, Patriot and THAAD interceptors, depleted by transfers to Ukraine and the war with Iran; CSIS estimates 1,060-1,430 Patriots expended. Officials say Putin, squeezed in Ukraine, may grow more dangerous when cornered, aiming to fracture the alliance. Pentagon spokesman Sean Parnell rejected shortage claims, insisting America has a \"deep, ready arsenal.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20WSJ/U.S.%20Intel%20Finds%20Putin%20Could%20Test%20NATO's%20Resolve%20With%20Limited%20Incursion.pdf"}, {"id": "wsj-13", "title": "U.S. Stocks Down on Hormuz Deal Doubts", "source": "WSJ", "date": "7 Aug 2026", "tags": ["Finance & Markets", "Energy"], "summary": "US stocks fell in a jittery session on doubts about reopening the Strait of Hormuz. The Dow dropped 464.02 points (0.85%) to 53885.10, the S&P 500 lost 0.18% to 7709.96 and the Nasdaq slipped 0.06% to 26348.35. Oil futures gained 2.8% to $77.29 a barrel as traders feared the US could reject any deal granting Iran formal control of the strait. The 10-year Treasury yield rose to 4.670% ahead of July jobs data, with investors anticipating a possible Fed rate hike. Housing stocks fell as mortgage rates hit 6.69%. SaaS fears hit HubSpot (-19%) and Datadog; UWM Holdings plunged 35% after suspending its dividend. Apollo agreed to buy easyJet for about $7.7 billion.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20WSJ/U.S.%20Stocks%20Down%20on%20Hormuz%20Deal%20Doubts.pdf"}, {"id": "st-01", "title": "AI is boosting UK productivity and harming jobs, says Bank of England", "source": "ST", "date": "7 Aug 2026", "tags": ["Technology & AI", "Finance & Markets", "Society"], "summary": "Bank of England staff analysis finds British firms developing and adopting artificial intelligence are becoming more productive, but at the cost of jobs. Software and IT consulting firms increased their contribution to annual productivity growth tenfold versus the pre-pandemic decade, adding 0.1 percentage point in 2023-2025, while information-service providers shifted from drag to driver. Gains are clearest in office administrative and business services, where repetitive tasks like scheduling and invoicing are automated. However, vacancies for jobs most exposed to AI fell 15 per cent over three years, versus 10 per cent for medium and 6 per cent for low exposure; customer-service and administrative roles dropped more than 20 per cent. Governor Andrew Bailey expects AI's productivity effect to follow a J-curve.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/AI%20is%20boosting%20UK%20productivity%20and%20harming%20jobs,%20says%20Bank%20of%20England.pdf"}, {"id": "st-02", "title": "As Japan PM Sanae Takaichi's support slips, can a food tax cut shore up her popularity", "source": "ST", "date": "7 Aug 2026", "tags": ["Politics", "Finance & Markets"], "summary": "Facing sliding support, Japanese PM Sanae Takaichi is pushing a high-stakes gamble: her Cabinet on Aug 5 approved cutting the food consumption tax from 8 to 1 per cent for two years from April 2027. It marks Japan's first consumption-tax reduction since 1989, raising a two-year revenue shortfall of up to 10 trillion yen (S$81.2 billion). Takaichi frames it as relief for households hit by inflation, but analysts warn it could worsen inflation, weaken the yen and compromise public services. Her Cabinet support has eroded from 60-75 per cent to 41-59 per cent amid perceptions she prioritised ideological legislation. Party heavyweights including Shigeru Ishiba have rebelled, and communication missteps have soured her leadership.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/As%20Japan%20PM%20Sanae%20Takaichi's%20support%20slips,%20can%20a%20food%20tax%20cut%20shore%20up%20her%20popularity.pdf"}, {"id": "st-03", "title": "Australia secures US missiles amid supply concerns", "source": "ST", "date": "7 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "Australia said on Aug 6 it would buy up to 450 of Lockheed Martin's AIM-260 Joint Advanced Tactical Missiles for its fighter jets in an A$736 million (S$664.10 million) deal, becoming the first country outside the US to field the new air-to-air missile. Defence Minister Richard Marles said they will arm Super Hornets, Growlers and F-35s. The purchase is smaller than a US$3.16 billion package approved by US Congress in March. It comes as US lawmakers warn of depleted missile stockpiles from the Iran war; a CSIS analysis said Patriot and THAAD stocks were slashed, risking US readiness against China. Australia will spend up to A$36 billion over a decade on domestic guided-weapons manufacturing.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/Australia%20secures%20US%20missiles%20amid%20supply%20concerns.pdf"}, {"id": "st-04", "title": "China's coal power lock-in a sign of green growing pains: Report", "source": "ST", "date": "7 Aug 2026", "tags": ["Energy", "Environment"], "summary": "A report by non-profits CREA and Global Energy Monitor found an estimated 360 terawatt-hours of Chinese solar and wind power went untapped in January-June 2026, enough to power the UK for a year and up 49 per cent year on year. The waste stems from curtailment caused by grid constraints, long-distance transmission gaps and contracts locking operators into buying coal power. China is adding 10 gigawatts of coal capacity for every gigawatt retired, with 274GW more in the pipeline, though coal's share of generation fell below half for the first time, to 49.7 per cent. Analysts see a structural shift under way and describe the challenges as growing pains of a large-scale energy transition.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/China's%20coal%20power%20lock-in%20a%20sign%20of%20green%20growing%20pains%20Report.pdf"}, {"id": "st-05", "title": "China's embassy in Argentina accuses US of obstructing cooperation", "source": "ST", "date": "7 Aug 2026", "tags": ["Geopolitics", "Trade"], "summary": "China's embassy in Argentina accused the United States of using visa revocations to obstruct cooperation between a local company and China's Huawei, calling it an affront to sovereignty and free-market principles. In a statement on social media, the embassy said the US embassy had \"deliberately promoted the so-called 'China threat theory'\" and broadened national-security concepts to hinder normal cooperation. The US embassy did not immediately respond. President Donald Trump's administration, a close ally of Argentine President Javier Milei, has expressed concern about Chinese influence in Latin America, including Argentina, where Beijing is the second-largest trading partner. Chinese and Argentine central banks this week renewed a bilateral currency swap for five years totalling 130 billion yuan (US$19.3 billion).", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/China's%20embassy%20in%20Argentina%20accuses%20US%20of%20obstructing%20cooperation.pdf"}, {"id": "st-06", "title": "Chinese AI boom sends Hong Kong data centre prices soaring", "source": "ST", "date": "7 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Chinese tech firms, from Bytedance to AI start-ups, are driving demand for Hong Kong's data centres, nearly doubling lease prices in 2026. The AI boom, fuelled partly by DeepSeek's success, has more Chinese firms using Hong Kong as a springboard to test models and expand overseas. Analyst Jason Zhou of Structure Research said leasing is \"almost entirely a Chinese market now,\" roughly 90 per cent Chinese. Wholesale pricing for hyperscalers rose 90 per cent since January to as much as US$180 per kilowatt, still behind Singapore's US$300-490 range. Hyperscalers Alibaba and Tencent are expanding capacity, drawn by Hong Kong's free data flows. Operators including SUNeVision, DayOne and Equinix are raising billions in debt; finance customers remain key demand.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/Chinese%20AI%20boom%20sends%20Hong%20Kong%20data%20centre%20prices%20soaring.pdf"}, {"id": "st-07", "title": "Deutsche Bank and KBC freeze some of Radiant World's Singapore bank accounts, sources say", "source": "ST", "date": "7 Aug 2026", "tags": ["Finance & Markets", "Trade"], "summary": "Iron ore trading house Radiant World is under mounting pressure after Deutsche Bank and KBC Group froze some of its Singapore bank accounts for compliance reviews and other banks suspended credit lines. The moves followed a Bloomberg report that major commodity firms stopped dealing with Radiant World over concerns it provided banks falsified documents about iron ore trades. Miners Rio Tinto and Vale struck it from approved-customer lists; Arab Bank Switzerland halted new letters of credit and ICBC Standard Bank suspended repo financing. The private firm, with about US$12 billion (S$15.4 billion) annual revenue, denies wrongdoing, saying it \"remains well capitalised with healthy liquidity.\" Iron ore prices this week fell to their lowest in more than a year.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/Deutsche%20Bank%20and%20KBC%20freeze%20some%20of%20Radiant%20World's%20Singapore%20bank%20accounts,%20sources%20say.pdf"}, {"id": "st-08", "title": "Explainer: What we know about North Korean forces joining Russia's war against Ukraine", "source": "ST", "date": "7 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "North Korea has deployed troops, weapons and now, per a Ukrainian intelligence official, a missile unit to support Russia's war on Ukraine, its most significant war involvement since the 1950s. The roughly 90-person unit, deploying to Russia's Voronezh region, could field up to 120 ballistic missiles and six launchers. Earlier assessments put deployments at 10,000-15,000 troops in Kursk, where Russia and North Korea confirmed combat in April 2025. Pyongyang has supplied millions of artillery rounds and 148 KN-23/KN-24 missiles, meeting about half of Russia's frontline munitions needs. A June 2024 strategic partnership treaty underpins the ties; analysts say Pyongyang gains hard currency, oil and military technology. The US and allies say the transfers violate UN resolutions.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/Explainer-What%20we%20know%20about%20North%20Korean%20forces%20joining%20Russia's%20war%20against%20Ukraine.pdf"}, {"id": "st-09", "title": "Gold jumps most in 6 months as Hormuz deal progress lowers rate-hike odds", "source": "ST", "date": "7 Aug 2026", "tags": ["Finance & Markets", "Energy"], "summary": "Gold extended its biggest gain in six months as signs of progress reopening the Strait of Hormuz eased energy-led pressure on the US Federal Reserve to raise rates. Bullion rose 1 per cent to US$4,347.90 an ounce on Aug 6, after jumping 4.1 per cent the prior session, the largest rise since Feb 3. Iran said it reached agreement with Oman on a temporary shipping route lasting \"two to four months,\" though not a full reopening. Brent traded near US$79 and WTI around US$75. Markets now price only a single US rate increase by end-2026, down from two. Gold has fallen nearly a fifth since the US-Iran war began in late February. Fed governor Lisa Cook signalled readiness to hike if inflation persists.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/Gold%20jumps%20most%20in%206%20months%20as%20Hormuz%20deal%20progress%20lowers%20rate-hike%20odds.pdf"}, {"id": "st-10", "title": "Google's $19 billion India data centre project battles water, wildlife concerns", "source": "ST", "date": "7 Aug 2026", "tags": ["Technology & AI", "Environment"], "summary": "Google's planned US$15 billion (S$19.2 billion) data centre hub in Visakhapatnam, its biggest-ever India investment, faces mounting opposition and legal challenges over water supplies and proximity to a wildlife sanctuary home to leopards and pangolins. Activists and children have marched with banners reading \"We cannot drink DATA.\" The city receives 410 million litres of water daily against a 480-million requirement, with rationing common for its 2.5 million people. The Andhra Pradesh High Court will hear a public-interest case on Aug 24; three more cases sit at India's environmental court. The state, governed by a Modi ally, denies fast-tracking and says no rural or residential water will be used. Google, partnering Gautam Adani's group, pledges advanced air cooling and sound-dampening.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/Google's%2019%20billion%20India%20data%20centre%20project%20battles%20water,%20wildlife%20concerns.pdf"}, {"id": "st-11", "title": "Hong Kong insurers' shares slump on report China to tax offshore insurance income", "source": "ST", "date": "7 Aug 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "Hong Kong-listed shares of major insurers slumped on Aug 6 after reports China's mainland tax authorities are levying taxes on income from offshore insurance policies. Beijing and Hangzhou authorities have begun applying 20 per cent personal income tax on returns from Hong Kong policies, including dividends and interest on prepaid premiums, sources told Reuters. AIA fell 6 per cent, Prudential 4.3 per cent and FWD 6 per cent, dragging the Hang Seng Index 1.5 per cent lower. Hong Kong insurance has long channelled Chinese overseas wealth; mainland deposits have risen about 50 per cent since 2023 to US$237 billion. Analysts called the sell-off \"panic-driven and overdone,\" noting a tax is less severe than an outright ban, but warned of a share-price overhang.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/Hong%20Kong%20insurers'%20shares%20slump%20on%20report%20China%20to%20tax%20offshore%20insurance%20income.pdf"}, {"id": "st-12", "title": "Houthi attack on Saudi Arabia wounds 11 civilians as kingdom warns of wider threat", "source": "ST", "date": "7 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "A Houthi attack on southern Saudi Arabia's Najran province wounded 11 civilians on Aug 6, including a four-year-old with second-degree burns, as Riyadh warned coordinated attacks by the Houthis and Iran-backed Iraqi militias were imminent. Coalition spokesman Major-General Turki al-Maliki accused the Iran-aligned Houthis of indiscriminately shelling civilian areas. A senior Saudi official said intelligence found threats to energy infrastructure, ports and airports supervised by Iran's Revolutionary Guard, possibly to disrupt diplomacy. Riyadh is deepening security ties: Turkey, Saudi Arabia and Pakistan were due to sign a defence agreement on Aug 7. The decade-old Houthi conflict has become entangled with the five-month US-Israeli war on Iran, including a Red Sea blockade disrupting Saudi oil exports.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/Houthi%20attack%20on%20Saudi%20Arabia%20wounds%2011%20civilians%20as%20kingdom%20warns%20of%20wider%20threat.pdf"}, {"id": "st-13", "title": "In Taiwan drill, armoured carrier takes President to command centre", "source": "ST", "date": "7 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "Taiwan President Lai Ching-te made a late-night dash in an armoured personnel carrier to a command centre during the annual Han Kuang war games, which began Aug 5 and run 10 days. The presidential office showed images of Lai in body armour drilling on commanding defensive operations and keeping government functioning during emergencies. It was the first time Lai took part as president in the \"Wan Chun\" plan to evacuate Taiwan's leader, dating to the Cold War. Taiwan has long feared a Chinese \"decapitation\" strike. The drills test counter-blockade and coastal-strike operations; next week Taiwan will deliberately slow mobile internet to test emergency communications. China, which claims Taiwan, flew 14 aircraft and sailed nine warships near the island on Aug 5.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/In%20Taiwan%20drill,%20armoured%20carrier%20takes%20President%20to%20command%20centre.pdf"}, {"id": "st-14", "title": "Indonesia government to take over state firm's stake in troubled China-funded high-speed railway", "source": "ST", "date": "7 Aug 2026", "tags": ["Southeast Asia", "Trade"], "summary": "Indonesia's government will take over a controlling 60 per cent stake in PT Kereta Cepat Indonesia China, operator of the US$7.3 billion (S$9.4 billion) China-funded \"Whoosh\" high-speed railway linking Jakarta and Bandung. Finance Minister Purbaya Yudhi Sadewa said on Aug 5 he will appoint an agency under his ministry to take over the stake, currently held by a consortium led by state railway firm PT Kereta Api Indonesia. The agency will repay the project's outstanding loan without using the state budget, with the transaction completed by mid-September. The 142km project has been mired in land procurement issues, pandemic delays and ballooning costs. Chinese state firms retain a 40 per cent stake. Sovereign wealth fund Danantara, which controls all state firms, joined the announcement.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/Indonesia%20government%20to%20take%20over%20state%20firm's%20stake%20in%20troubled%20China-funded%20high-speed%20railway.pdf"}, {"id": "st-15", "title": "OCBC shareholders to receive 47-cent interim dividend as Q2 profit jumps 22% to $2.22 billion", "source": "ST", "date": "7 Aug 2026", "tags": ["Finance & Markets"], "summary": "OCBC Bank's second-quarter net profit grew 22 per cent to $2.22 billion, up from $1.82 billion a year ago and beating a $1.91 billion forecast, as strong non-interest income led by wealth management offset lower interest rates. The bank declared a 47-cent interim dividend, up from 41 cents, an estimated $2.11 billion payout, about 50 per cent of first-half net profit. Net interest income fell 1 per cent to $2.26 billion and net interest margin dropped to 1.70 per cent, but non-interest income rose 51 per cent to $1.91 billion. OCBC raised its 2026 loan-growth guidance to high-single to low-double digits and plans to hire 600 relationship managers. DBS earlier reported $3.08 billion profit; UOB and OCBC reported on Aug 7.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/OCBC%20shareholders%20to%20receive%2047-cent%20interim%20dividend%20as%20Q2%20profit%20jumps%2022%20to%202.22%20billion.pdf"}, {"id": "st-16", "title": "Oil extends gains as Iran strikes targets in Strait of Hormuz", "source": "ST", "date": "7 Aug 2026", "tags": ["Energy", "Geopolitics"], "summary": "Oil extended gains after reports Iran attacked \"hostile targets\" in the Strait of Hormuz, with Tehran seeking to bar US ships from the waterway in a deal with Oman. Brent crude surged 1.4 per cent to US$83.62 a barrel, after jumping 4.9 per cent the previous session, while WTI rose 1.2 per cent to US$78.25. The attacks followed explosions near Qeshm Island. Crude erased earlier-week declines as optimism over a full Hormuz reopening evaporated. Under the proposed Iran-Oman agreement, Tehran also intends to ban Israeli ships and require compensation from hostile countries. The US insists on free transit; Iran wants a fee structure. The conflict is widening, with Iran-backed Houthis conducting a \"large-scale\" attack on Yemen's Saudi-aligned government forces.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/Oil%20extends%20gains%20as%20Iran%20strikes%20targets%20in%20Strait%20of%20Hormuz.pdf"}, {"id": "st-17", "title": "Pacific ministers to debate China missile statement", "source": "ST", "date": "7 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "Pacific Island foreign ministers were expected to debate on Aug 7 whether to issue a joint statement on China's July missile launch into the Pacific, with New Zealand pushing for a response but acknowledging divisions could block agreement. NZ Foreign Minister Winston Peters said talks at the Pacific Islands Forum meeting in Suva would test whether members could overcome \"predetermined\" positions. China's test-firing alarmed regional powers but initially failed to produce a unified response, exposing divisions over strategic competition. Forum chair, Solomon Islands' Rick Houenipwela, said the Pacific's agenda must be shaped \"only by the Pacific.\" Peters called the earlier absence of a unified response a \"missed opportunity,\" referencing the 2025 \"Ocean of Peace\" declaration. Energy security and institutional arrangements may also be discussed.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/Pacific%20ministers%20to%20debate%20China%20missile%20statement.pdf"}, {"id": "st-18", "title": "Trump unveils trade actions to compete with China on solar and chips", "source": "ST", "date": "7 Aug 2026", "tags": ["Trade", "Energy"], "summary": "The White House on Aug 6 imposed price floors and a 15 per cent tariff on products made from polysilicon, the raw material for semiconductors and solar panels primarily produced by China. President Trump's Section 232 proclamation aims to support domestic chip and solar supply chains needed to compete with Beijing on AI and energy. Minimum import prices were set at US$21 per kilogram for polysilicon, US$100 for ingots and wafers, US$0.22 per watt for solar cells and US$0.38 for panels. The US has two polysilicon plants, run by Hemlock Semiconductor and Wacker Chemie. Protections take effect Dec 4; solar makers including T1 Energy, First Solar and Qcells applauded, though a trade attorney warned the delay could trigger an import surge.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/Trump%20unveils%20trade%20actions%20to%20compete%20with%20China%20on%20solar%20and%20chips.pdf"}, {"id": "st-19", "title": "Trump's tech ties come under bipartisan fire after AI agents go rogue", "source": "ST", "date": "7 Aug 2026", "tags": ["Technology & AI", "Politics"], "summary": "Democrats and Trump's conservative supporters both blame the President's ties to the tech industry for his limited response to recent hacks carried out by OpenAI and Anthropic AI agen
