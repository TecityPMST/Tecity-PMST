er talks. The US imposed fresh 10 to 12.5 per cent tariffs on 60 trading partners, including the EU, Japan and South Korea, following a Section 301 forced-labour investigation. A separate probe into excess industrial capacity covers 16 economies. Beijing also rejected US claims that Chinese firms \"distilled\" American AI models, calling them baseless. White House adviser Michael Kratsios alleged Moonshot AI trained Kimi K3 by distilling Anthropic's Claude, offering no evidence and sparking researcher debate over feasibility.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20SCMP/China%20condemns%20US%20over%20new%20Section%20301%20tariffs%20%E2%80%93%20but%20holds%20off%20on%20retaliation.pdf"}, {"id": "scmp-03", "title": "China's localised data centre push drives AI ambitions amid overbuilding concerns", "source": "SCMP", "date": "28 Jul 2026", "tags": ["Technology & AI", "Energy"], "summary": "A nationwide scramble for data centres is underway in China, with towns and counties often outbidding major cities for the AI backbone facilities. Shatian in Dongguan plans a 100 billion yuan (US$14.7 billion), 9,000-acre computing park by 2030, while Jiashan county, Yangzhou and Ulanqab are building hyperscale sites backed by Alibaba, Tencent and China Telecom. Unlike the US, where states such as New York and Virginia curb permits over grid and emissions concerns, Chinese regional officials embrace the buildout. Researcher Tang Dajie warned of \"irrational\" investments driven by local tenure targets, but said building in low-cost western regions makes sense under the \"east data, west computing\" policy. Cheaper infrastructure could hand China a competitive edge.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20SCMP/China%E2%80%99s%20localised%20data%20centre%20push%20drives%20AI%20ambitions%20amid%20overbuilding%20concerns.pdf"}, {"id": "scmp-04", "title": "China's 'K-shaped' economy is divided not just by sector, but geography", "source": "SCMP", "date": "28 Jul 2026", "tags": ["Finance & Markets", "Technology & AI", "Politics"], "summary": "China's K-shaped divide between booming hi-tech industries and a stagnant consumer sector is now mirrored geographically, first-half provincial data shows. Zhejiang, home to Alibaba, DeepSeek and Unitree, led with 5.7 per cent growth to nearly 4.8 trillion yuan, beating the 4.7 per cent national rate. Anhui, Shandong, Shanghai and Jiangsu also outperformed on hi-tech manufacturing and exports. Regions reliant on tourism, mining or heavy industry lagged: Hainan grew just 2 per cent, Yunnan and rust-belt Liaoning 2.5 per cent. Economists cite Beijing's campaign against overcapacity in steel, coal and property. Peking University's Su Jian expects divergence to widen; Nomura says the gap will force faster fiscal reforms to rebuild local tax bases.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20SCMP/China%E2%80%99s%20%E2%80%98K-shaped%E2%80%99%20economy%20is%20divided%20not%20just%20by%20sector,%20but%20geography.pdf"}, {"id": "scmp-05", "title": "Fortune roller-coaster: as Elon Musk loses US$130b, Chinese chip and AI founders gain", "source": "SCMP", "date": "28 Jul 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Elon Musk called himself a \"(former) trillionaire\" after losing about US$130 billion in five trading days, as Tesla shares tumbled 18 per cent and SpaceX hit its post-IPO low. Meanwhile Chinese tech founders gained: ChangXin Memory Technologies (CXMT) soared 466 per cent on its Shanghai debut, valuing it at 3.28 trillion yuan and lifting executives' fortunes, with chairman Zhu Yiming holding stock worth nearly 80 billion yuan. Zhipu founder Tang Jie is worth about US$4.6 billion, and MiniMax's Yan Junjue roughly HK$18.2 billion after Hong Kong listings. Analysts noted much is volatile paper wealth. Liu Shengjun said tech magnates \"create huge societal wealth,\" contrasting them with property tycoons like Hui Ka-yan.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20SCMP/Fortune%20roller-coaster%20as%20Elon%20Musk%20loses%20US%24130b,%20Chinese%20chip%20and%20AI%20founders%20gain.pdf"}, {"id": "scmp-06", "title": "France and Spain race to curb wildfires before new heatwave arrives", "source": "SCMP", "date": "28 Jul 2026", "tags": ["Environment", "Society"], "summary": "Firefighters exploited a brief window of milder weather to subdue massive wildfires threatening Bordeaux and sites across Spain, racing another heatwave due later in the week. France has evacuated about 220,000 people, including tourists, while roughly 100,000 in Spain were told to flee or shelter. PM Sebastien Lecornu called it an \"unprecedented fire season,\" with area burned already surpassing 2022's record; 80 firefighters were injured near Bordeaux. In Spain, the Avila blaze is the largest in recent history, and crews near Castellon faced exploding Civil War-era ordnance. Pedro Sanchez blamed a \"climate emergency\" fuelling fiercer \"sixth-generation\" fires. Turkey, Italy, Greece, Portugal and Switzerland sent aircraft and crews to help.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20SCMP/France%20and%20Spain%20race%20to%20curb%20wildfires%20before%20new%20heatwave%20arrives.pdf"}, {"id": "scmp-07", "title": "From Moonshot to Enflame: how Tencent is betting big on China's AI champions", "source": "SCMP", "date": "28 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Tencent has assembled a sprawling AI portfolio spanning model makers and chip designers. It was an early backer of Moonshot AI, whose Kimi K3 sparked a fresh \"DeepSeek moment\" and which is nearing a US$30 billion valuation ahead of a Hong Kong IPO. Tencent joined DeepSeek's US$7 billion Series A, reportedly contributing 10 billion yuan, and is moving to become the largest external shareholder in Manus operator Butterfly Effect. Its early stakes in Zhipu and MiniMax rallied over 1,000 per cent and 130 per cent post-listing. Tencent is the largest outside shareholder and primary client of AI chip start-up Enflame, which supplied 84 per cent of 2025 revenue, and holds stakes in photonics chipmaker Lightelligence.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20SCMP/From%20Moonshot%20to%20Enflame%20how%20Tencent%20is%20betting%20big%20on%20China%E2%80%99s%20AI%20champions.pdf"}, {"id": "scmp-08", "title": "Hong Kong banks in early stages of preparing for quantum computing threats, HKMA says", "source": "SCMP", "date": "28 Jul 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Hong Kong's banking sector remains early in preparing for cybersecurity risks from quantum computing, the Hong Kong Monetary Authority said as it unveiled a new benchmark. Its first Quantum Preparedness Index scored the industry 2.3 out of 10, with the regulator targeting full readiness by 2030. The survey found 68 per cent of banks had begun raising awareness, planning or piloting projects, while 32 per cent had taken no steps and about half lacked a formal road map for adopting post-quantum cryptography. Quantum computers could eventually break widely used encryption. To help, the HKMA will partner with HKUST to build a PQC toolkit and hold workshops, part of its 2026 Fintech Promotion Blueprint.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20SCMP/Hong%20Kong%20banks%20in%20early%20stages%20of%20preparing%20for%20quantum%20computing%20threats,%20HKMA%20says.pdf"}, {"id": "scmp-09", "title": "Hong Kong set for stronger storms and wetter winter this year as El Nino intensifies", "source": "SCMP", "date": "28 Jul 2026", "tags": ["Environment", "Society"], "summary": "Hong Kong should brace for stronger storms and a warmer, wetter winter as the current El Nino is likely to intensify into a super event, green group Friends of the Earth (HK) and a leading meteorologist warned. Rising sea temperatures will feed typhoons more moisture and energy, potentially turning expected tropical cyclones into super typhoons. The group cautioned that heatwaves, intense downpours, higher sea levels and landslides pose growing risks, citing HKU research that heat kills about 300 people yearly. Former Observatory director Shun Chi-ming said a super El Nino could form between October and December, driving global temperatures to record highs in 2026 and 2027. NOAA puts the super-threshold chance at 81 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20SCMP/Hong%20Kong%20set%20for%20stronger%20storms%20and%20wetter%20winter%20this%20year%20as%20El%20Nino%20intensifies.pdf"}, {"id": "scmp-10", "title": "Iran halts strikes as Trump gives space to talks", "source": "SCMP", "date": "28 Jul 2026", "tags": ["Geopolitics", "Defence", "Energy"], "summary": "Iran and the US held their fire on Monday, giving Gulf shipping and oil markets a respite, as Trump's UN envoy said the president was \"giving talks some space.\" Tehran said it halted retaliatory attacks; ambassador Mike Waltz said forces remained \"locked and loaded\" but Trump would allow room for negotiation. The US had struck Iran for 13 consecutive nights in the almost five-month war before three quiet nights. Brent crude plunged 8 per cent to around US$89 a barrel, easing inflation fears and lifting equities. American media suggested the pause may reflect strained Patriot interceptor stockpiles. Netanyahu, due at the White House Tuesday, is expected to press Trump to keep pressure on Iran's nuclear programme.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20SCMP/Iran%20halts%20strikes%20as%20Trump%20gives%20space%20to%20talks.pdf"}, {"id": "scmp-11", "title": "Is Kim Yo-jong's rebuke a sign North Korea is ditching Asean diplomacy?", "source": "SCMP", "date": "28 Jul 2026", "tags": ["Geopolitics", "Southeast Asia", "Defence"], "summary": "A rare rebuke of Asean by Kim Yo-jong, sister of North Korean ruler Kim Jong-un, signals the bloc's waning relevance to the nuclear-armed state, analysts say. She condemned Asean's call for denuclearisation as having \"distorted the essence of the situation in the Korean peninsula,\" made at the Asean Regional Forum in the Philippines, which North Korea skipped for a second straight year. Analysts including RSIS's Sarah Teo said Pyongyang has treated denuclearisation as \"no longer up for negotiation\" since enshrining nuclear force in its constitution in 2023. Ratih Indraswari warned the criticism could limit Pyongyang's multilateral engagement, though bilateral ties should endure. It is unclear whether North Korea will attend when Singapore chairs Asean next year.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20SCMP/Is%20Kim%20Yo-jong%E2%80%99s%20rebuke%20a%20sign%20North%20Korea%20is%20ditching%20Asean%20diplomacy.pdf"}, {"id": "scmp-12", "title": "Israel to allow international force into Gaza under Trump ceasefire plan", "source": "SCMP", "date": "28 Jul 2026", "tags": ["Geopolitics", "Defence"], "summary": "Israel will permit a multinational security force into Gaza as proposed under Trump's ceasefire plan, an Israeli official said Sunday, after Netanyahu's security cabinet approved the legal framework. The International Stabilisation Force would include 200 members from \"friendly countries such as Uganda and Morocco,\" deploying in areas outside Israeli control, with each contingent requiring separate approval. Netanyahu was due in Washington to meet Trump on Tuesday. Trump's stalled peace plan envisions surging aid, Palestinian technocrat administration, Hamas disarmament and Israeli withdrawal, overseen by a \"Board of Peace.\" Israel controls an estimated 64 per cent of Gaza and plans to expand to 70 per cent; Hamas has refused to disarm. Board envoy Nickolay Mladenov welcomed the decision.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20SCMP/Israel%20to%20allow%20international%20force%20into%20Gaza%20under%20Trump%20ceasefire%20plan.pdf"}, {"id": "scmp-13", "title": "Profits in China's chipmaking sector soar 2,500% in first half amid AI boom", "source": "SCMP", "date": "28 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "China's major chip manufacturers saw first-half 2026 profits skyrocket 2,579.5 per cent, fuelled by unprecedented AI and computing demand, National Bureau of Statistics data showed. The NBS credited accelerating AI integration for generating massive computing-power demand, which also lifted the broader electronics industry's profits 97 per cent. Overall industrial profits at major enterprises rose 18.7 per cent to 4 trillion yuan, a stark reversal from a 1.8 per cent decline a year earlier before the global data centre buildout. China's integrated circuit output grew 23 per cent to nearly 280 billion units, over 1.5 billion chips daily. Longsys projected a 600-fold profit surge, GigaDevice roughly 1,099 per cent, and AI chipmaker Hygon up to 52.3 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20SCMP/Profits%20in%20China%E2%80%99s%20chipmaking%20sector%20soar%202,500%25%20in%20first%20half%20amid%20AI%20boom.pdf"}, {"id": "scmp-14", "title": "Singapore-based investors now the top non-local buyers of Hong Kong office assets", "source": "SCMP", "date": "28 Jul 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Singapore-based investors have become the largest non-local buyers of Hong Kong commercial property, drawn by steep price corrections in distressed office assets, according to Colliers. In the April-June quarter, non-local and mainland investment totalled HK$5.46 billion, of which Singaporean buyers contributed HK$3.37 billion, or 62 per cent, unseating mainland Chinese investors who had led the prior quarter. Colliers' Thomas Chak said office prices have fallen up to 50 per cent, making quality assets attractive at a discount. Notable deals included DBS Bank buying space at The Center for about HK$2.62 billion and Wee Hur acquiring One Bedford Place. Central's Grade-A office rents rose 7.3 per cent in the first half, the biggest six-month gain in 15 years.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20SCMP/Singapore-based%20investors%20now%20the%20top%20non-local%20buyers%20of%20Hong%20Kong%20office%20assets.pdf"}, {"id": "scmp-15", "title": "The former military chief aiming to unseat Netanyahu in Israel", "source": "SCMP", "date": "28 Jul 2026", "tags": ["Politics", "Defence", "Geopolitics"], "summary": "Former military chief Gadi Eisenkot has emerged as the principal challenger to Benjamin Netanyahu ahead of Israel's October 27 election, widely seen as a referendum on the premier's leadership after the October 7, 2023 attacks. A Channel 12 poll put Eisenkot's new Yashar party at 23 Knesset seats to Likud's 22, with 43 per cent naming him most suitable prime minister. Israel's military chief from 2015 to 2019 and architect of the \"Dahiya Doctrine,\" Eisenkot promises a state inquiry into the 2023 attack, a new security doctrine and universal national service extending conscription to ultra-Orthodox Jews and Arabs. The son of Moroccan immigrants who lost his son in Gaza, his understated style appeals to centrist voters seeking to defeat Netanyahu.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20SCMP/The%20former%20military%20chief%20aiming%20to%20unseat%20Netanyahu%20in%20Israel.pdf"}, {"id": "scmp-16", "title": "Trump administration urges Supreme Court to allow order targeting mail-in voting", "source": "SCMP", "date": "28 Jul 2026", "tags": ["Politics"], "summary": "The Trump administration asked the Supreme Court on Monday to clear the way for an executive order that could dramatically reshape mail-in voting before November's midterms. The Justice Department sought to halt lower-court rulings blocking the changes in nearly half the country. Trump's March order directs agencies to build a \"state citizenship list\" and deliver mail ballots only to those on it, with ballots carrying bar codes and federal funding withheld from non-compliant states. Democratic officials in 23 states and DC sued, arguing the Constitution gives states and Congress, not the president, authority over election rules. Solicitor General D. John Sauer called the injunction \"indefensible.\" Non-citizen voting is rare; a response to the appeal is due August 3.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20SCMP/Trump%20administration%20urges%20Supreme%20Court%20to%20allow%20order%20targeting%20mail-in%20voting.pdf"}, {"id": "scmp-17", "title": "Trump, tariffs and ties with China at stake in Brazilian presidential race", "source": "SCMP", "date": "28 Jul 2026", "tags": ["Geopolitics", "Politics", "Trade"], "summary": "China is closely watching Brazil's October election, where Beijing-friendly incumbent Lula da Silva runs neck-and-neck with pro-Washington Senator Flavio Bolsonaro, son of jailed ex-president Jair Bolsonaro. Days after the US added a 12.5 per cent Section 301 tariff, pushing Brazil's cumulative duty to 37.5 per cent, Xi Jinping told Lula that Beijing would support Brazil in \"safeguarding its own sovereignty.\" Lula called the levies \"unfair\" and a \"strategic mistake.\" Analysts warn a Bolsonaro win could bring \"automatic alignment\" with Washington, though pragmatic China ties would likely endure given trade in soybeans and beef. A Datafolha poll shows Lula leading 48 to 43 per cent in a run-off. Bolsonaro wants the US to replace China as Brazil's top trading partner.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20SCMP/Trump,%20tariffs%20and%20ties%20with%20China%20at%20stake%20in%20Brazilian%20presidential%20race.pdf"}, {"id": "scmp-18", "title": "US congressional group plans annual visits to China after trade trip", "source": "SCMP", "date": "28 Jul 2026", "tags": ["Geopolitics", "Trade"], "summary": "The US-China Economic and Security Review Commission (USCC) returned from a fact-finding trip to Beijing, Shanghai and Hangzhou, its first since 2019, with commissioners pledging to make such visits annual. Vice Chair Mike Kuiken said the panel is committed to returning \"at least annually\" to keep its analysis current. The independent advisory body, which reports to Congress on trade and security, met US diplomats, Chinese officials, think tanks and businesses, discussing AI, biotechnology and economic security, though it could not visit some technology companies it requested. Beijing often views the USCC as unfriendly given its critical annual reports; the Chinese Embassy welcomed the visit. Chair Randy Schriver said honest disagreement is more useful than politeness.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20SCMP/US%20congressional%20group%20plans%20annual%20visits%20to%20China%20after%20trade%20trip.pdf"}, {"id": "scmp-19", "title": "What CXMT must do to grow global memory market share and build on its surge: analysts", "source": "SCMP", "date": "28 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "ChangXin Memory Technologies (CXMT) shares could more than double from Monday's close as it expands its global DRAM market share to 18 per cent by 2028, Nomura said, setting a 116 yuan target. The chipmaker surged 466 per cent to 49 yuan on debut, reaching a 3.28 trillion yuan (US$484.6 billion) market cap that tops Intel's. Nomura sees monthly wafer capacity rising from 280,000 to 550,000 by end-2028, aided by AI demand and tight inventories. But CXMT lags Samsung, SK Hynix and Micron, generates no revenue from high-bandwidth memory, and trails leaders by about five years. Roughly 40 per cent of its equipment is domestic, exposing it to any tightening of US-led export restrictions on advanced lithography.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20SCMP/What%20CXMT%20must%20do%20to%20grow%20global%20memory%20market%20share%20and%20build%20on%20its%20surge%20analysts.pdf"}]}, "2026-07-29": {"date": "2026-07-29", "dayOfWeek": "Wednesday", "totalArticles": 66, "sourceCounts": {"WSJ": 17, "ST": 13, "BT": 16, "SCMP": 20}, "executiveDigest": "Singapore's central bank sounded the alarm - the MAS chief flagged the AI investment boom as a key risk to global financial stability - as China's CXMT IPO flopped and Singapore tech stocks slid in a spreading chip sell-off; MAS itself posted a record S$20 billion profit and the financial sector's assets hit S$6.7 trillion, while oil sank after the US paused Iran strikes, reviving hopes for diplomacy.", "briefingCards": [{"title": "Lead story - MAS warns on AI boom as chips wobble", "body": "Singapore's central bank turned cautionary: the MAS chief flagged the AI investment boom as a key risk to global financial stability, a pointed warning as the frenzy shows cracks. China's CXMT - days after a 466% debut pop - saw its US$12.7 billion IPO branded 'a flop', and Singapore tech stocks slid as a chip sell-off spread across Asia. ST likened the 'Kimi panic' to a 'Sputnik moment' for open-source AI. Even so, MAS posted a record S$20 billion profit on strong investment gains, and Singapore's financial sector grew 4.3% in 2025, adding about 4,200 jobs a year over five years, with assets under management up 10.1% to S$6.7 trillion."}, {"title": "Markets & finance", "body": "Beyond MAS's warning, the AI-finance machine kept whirring: Nvidia invested in Ilya Sutskever's Safe Superintelligence lab and led a defence of open-source AI, WSJ dubbed Main Street banks 'a cheaper way to play the AI banking boom', and BT posed 'the trillion-dollar question hanging over AI'. Markets showed froth - 'the ETF crazy train is picking up speed' - even as US durable-goods orders rose less than expected and Fed chair Kevin Warsh's first two months drew scrutiny. In Singapore, DBS rolled out agentic AI to 350,000 corporate clients, while mortgagee-sale listings hit a six-year high as financing conditions tightened."}, {"title": "Asia realignment", "body": "The US-China tech contest hardened: Anthropic's CEO urged Washington to tighten China chip-export bans, Nvidia's Jensen Huang met US officials amid scrutiny over China access, and the US banned new Chinese robots and power inverters. China pushed back - waiving panda-bond fees through 2028, expanding offshore-yuan clearing, and touting rare-earth reserves 'much larger than reported'. Trump, impressed by Ukraine's battlefield gains, warmed to Zelensky in a 'good meeting', and Western powers raced to reshore explosives production, while Taiwan drilled relocating arms production under a hypothetical Chinese attack."}, {"title": "Energy & climate", "body": "Oil sank after the US paused its Iran strikes, reviving hopes for diplomacy - Oman offered Iran a Gulf-backed plan for voluntary Hormuz fees - though Saudi Arabia said it intercepted more drones (some launched from Iraq) at oil facilities, and two wars converged in the Caspian as Ukraine hit an Iranian supply line to Russia. KKR and Blackstone signed a US$16 billion Kuwait oil deal, Australia weighed its first new refinery in 60 years, and CATL and BYD battled for the Middle East energy-storage market. WSJ flagged America's soaring power demand and the rising cost of building out the grid."}, {"title": "Technology & AI", "body": "'Kimi panic' crystallised the moment: Moonshot's K3 triggered a Silicon Valley debate over banning Chinese open-source models, which ST called a 'Sputnik moment for open AI', while Alibaba's AI-and-chip portfolio (CXMT to Zhipu) is paying off. Analysts said China's home-grown DUV progress isn't yet the biggest threat to ASML. BT explored why Asia-Pacific governments are taking different approaches to 'sovereign AI' and why 'AI advantage starts with organisational memory' - even as MAS warned the boom itself is now a systemic financial risk."}, {"title": "Singapore & SEA focus", "body": "A dense Singapore day: MAS posted a record S$20 billion profit and flagged AI-boom risks, the financial sector grew 4.3% with AUM up 10.1% to S$6.7 trillion, and DBS scaled agentic AI to 350,000 corporate clients. On housing, the 15-month wait-out period for private owners buying HDB resale flats was scrapped (Chee Hong Tat) and the ABSD deadline for large en-bloc projects was extended - though mortgagee-sale listings hit a six-year high. Mapletree launched its first China onshore logistics fund (US$221 million AUM), and BT examined why Japan's 'new fiscal era' matters for ASEAN."}], "keyMetrics": [{"value": "66", "label": "Articles curated today", "sub": "WSJ 17 · ST 13 · BT 16 · SCMP 20"}, {"value": "MAS warns", "label": "AI boom = stability risk", "sub": "Central bank flags systemic danger"}, {"value": "S$20b", "label": "MAS record profit", "sub": "On strong investment gains"}, {"value": "Flop", "label": "CXMT US$12.7b IPO", "sub": "SG tech stocks slide on chips"}, {"value": "S$6.7t", "label": "Singapore AUM", "sub": "Up 10.1%; sector grew 4.3%"}, {"value": "Oil sinks", "label": "US pauses Iran strikes", "sub": "Diplomacy hopes revive"}], "articles": [{"id": "wsj-01", "title": "America's Big Cities Are Rapidly Losing Kids", "source": "WSJ", "date": "29 Jul 2026", "tags": ["Society"], "summary": "The number of children under 18 in large U.S. cities fell 6% over the past decade, versus a 1% decline nationwide, a Wall Street Journal analysis of census data from 2015 to 2024 found. The drop is starkest among the youngest: children under five in big cities fell 15%, and in San Jose the under-five count plunged 34%, the most of any large city. Roughly two-thirds of the 38 cities with over 500,000 residents lost children. Families cite high costs, housing unaffordability, safety, daycare expenses and quality-of-life concerns, while more childless residents opt to stay that way. Even growing cities are losing kids, straining tax bases and school enrollments as families relocate to smaller, cheaper towns.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20WSJ/America%E2%80%99s%20Big%20Cities%20Are%20Rapidly%20Losing%20Kids.pdf"}, {"id": "wsj-02", "title": "America's Demand for Power Is Soaring-and So Are the Costs of Building Out the Grid", "source": "WSJ", "date": "29 Jul 2026", "tags": ["Energy", "Technology & AI"], "summary": "Record U.S. electricity-generation development is becoming far more expensive as AI data-center demand, equipment backlogs, permitting delays, tariffs and grid-connection waits push up construction costs for every plant type. Costs for natural-gas plants and large-scale solar and wind have risen more than 10% since last year, per Lazard. Large-scale solar climbed to $69 per megawatt hour from $58; adding batteries pushed costs to $109 from $91. Electricity prices rose 4% in June year-over-year, outpacing inflation, and higher build costs will eventually reach utility bills. Capital-spending plans for 51 investor-owned utilities reached $1.4 trillion over five years, up over 20%. Gas-turbine makers face yearslong backlogs; GE Vernova's Scott Strazik said customers are ordering equipment for delivery into the 2030s.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20WSJ/America%E2%80%99s%20Demand%20for%20Power%20Is%20Soaring-and%20So%20Are%20the%20Costs%20of%20Building%20Out%20the%20Grid.pdf"}, {"id": "wsj-03", "title": "Impressed by Ukraine's Battlefield Gains, Trump Warms to Zelensky", "source": "WSJ", "date": "29 Jul 2026", "tags": ["Geopolitics", "Politics"], "summary": "After more than a year insisting privately that Ukraine was losing, President Trump has expressed fresh optimism about Ukraine and Volodymyr Zelensky, people who spoke to him said. Trump has been impressed by Zelensky's resilience and Ukraine's drone industry, especially its ability to counter the same drones the U.S. faces in the Iran war. The warming follows summit-sideline meetings and a European campaign to repair ties badly damaged in 2025, when Trump called Zelensky a dictator and paused military aid after a tense Oval Office clash. The leaders meet Tuesday in Washington, where Zelensky attends Sen. Lindsey Graham's funeral. Officials caution Trump's views shift quickly and Putin has proved persuasive; U.S. officials say Putin still aims to subjugate Ukraine.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20WSJ/Impressed%20by%20Ukraine%E2%80%99s%20Battlefield%20Gains,%20Trump%20Warms%20to%20Zelensky.pdf"}, {"id": "wsj-04", "title": "Iran Is a Hedgehog, Trump Is a Fox", "source": "WSJ", "date": "29 Jul 2026", "tags": ["Geopolitics", "Politics"], "summary": "In this opinion column, Walter Russell Mead argues President Trump, who claims to have ended eight wars, has now ended the on-again, off-again U.S.-Iran war at least three times. American forces struck Iran last Friday, then halted, while hostilities flared in Yemen as Houthis pressed to close the Red Sea. Mead calls 2026 the era of the \"slop of war,\" where decoy diplomacy and military head-fakes obscure reality, partly by Trump's deliberate misdirection and appetite for ambitious goals at limited cost. Iran, a \"hedgehog,\" has murdered its way to domestic security, blunting U.S. air power since regime change would require a costly ground invasion. Iran can also hold the region hostage, threatening bases, shipping and desalination plants.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20WSJ/Iran%20Is%20a%20Hedgehog,%20Trump%20Is%20a%20Fox.pdf"}, {"id": "wsj-05", "title": "KKR, Blackstone Sign $16 Billion Kuwait Oil Deal", "source": "WSJ", "date": "29 Jul 2026", "tags": ["Finance & Markets", "Energy"], "summary": "The state firms managing Kuwait's oil sector signed a $16 billion lease agreement with an investor group led by Blackstone, Brookfield and KKR, the largest foreign direct investment in Kuwait's history. The deal follows President Trump reversing his 20% Strait of Hormuz transit-fee plan after Middle Eastern countries pledged to invest more in the U.S. Kuwait Petroleum Corp. and subsidiary Kuwait Oil Co. signed the agreement covering all domestic and export pipelines. KOC and the consortium will form a joint venture, with KOC holding a 51% majority and investors 49%. The venture leases usage rights to KOC's 13 pipelines spanning roughly 200 miles for 20.5 years, generating about $7.85 billion for KOC at closing to support KPC's expansion plans.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20WSJ/KKR,%20Blackstone%20Sign%20%2416%20Billion%20Kuwait%20Oil%20Deal.pdf"}, {"id": "wsj-06", "title": "Kevin Warsh's First Two Months as Fed Chair: What He Changed, and What Could Happen Next", "source": "WSJ", "date": "29 Jul 2026", "tags": ["Finance & Markets", "Politics"], "summary": "New Federal Reserve Chairman Kevin Warsh has moved quickly to remake the central bank, launching five panels of outside experts to reexamine how the Fed reads the economy and communicates. At a June 15 dinner, Governor Christopher Waller challenged the effort, suggesting Warsh was importing outside authority to ratify long-held views. The task forces, covering communications, the inflation framework and asset holdings, are led by 15 people including a Nobel laureate and former central bankers, drawing praise even from skeptics. Warsh's signature early move is saying less about the economy and policy, generating tension ahead of this week's uncertain meeting, where rates may hold but a renewed inflation scare has put a surprise increase in play. Warsh claims a \"sea change in new thinking.\"", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20WSJ/Kevin%20Warsh%E2%80%99s%20First%20Two%20Months%20as%20Fed%20Chair%20What%20He%20Changed,%20and%20What%20Could%20Happen%20Next.pdf"}, {"id": "wsj-07", "title": "Lindsey Graham's Death Leaves Israel With a Bigger Problem in America", "source": "WSJ", "date": "29 Jul 2026", "tags": ["Geopolitics", "Politics"], "summary": "The sudden death of Sen. Lindsey Graham, 71, deprives Israel of a rare, powerful advocate as factions in both U.S. parties turn against the country amid the Gaza and Iran wars. Graham served as a conduit between Prime Minister Netanyahu and President Trump, helping persuade Trump to attack Iran in February and coaching Netanyahu on lobbying. Netanyahu is expected at Tuesday's National Cathedral funeral and to meet Trump. His death comes as U.S. views of Israel deteriorate: an April Pew poll found 60% of adults view Israel unfavorably, up from 42% in 2022, and a Gallup poll showed more Americans sympathizing with Palestinians for the first time. Analysts call it a \"changing of the guard,\" leaving Israel with fewer levers.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20WSJ/Lindsey%20Graham%E2%80%99s%20Death%20Leaves%20Israel%20With%20a%20Bigger%20Problem%20in%20America.pdf"}, {"id": "wsj-08", "title": "Main Street Banks Are a Cheaper Way to Play the AI Banking Boom", "source": "WSJ", "date": "29 Jul 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Regional banks are evolving to resemble their Wall Street peers, potentially offering upside investors are overlooking. Last week's jump in Treasury yields, with 2-year notes at a one-year high, stoked worries that depositors would pull cash and squeeze lenders lacking large trading desks. But regional banks are benefiting from the same forces lifting megabanks, including companies scrambling to adapt to the AI boom. Noninterest income at KBW-index regionals jumped 12% quarter-over-quarter, near megabanks' 13%, and now equals roughly half their net interest income, up from about 40% in early 2023. Regionals are shifting from risky consumer loans toward commercial clients to stack fees. Truist's net interest margin narrowed slightly, yet return on tangible common equity rose to 15.4% from 12.3%.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20WSJ/Main%20Street%20Banks%20Are%20a%20Cheaper%20Way%20to%20Play%20the%20AI%20Banking%20Boom.pdf"}, {"id": "wsj-09", "title": "Nvidia Invests in Sutskever's Safe Superintelligence AI Lab", "source": "WSJ", "date": "29 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Nvidia is making a \"substantial\" investment in former OpenAI chief scientist Ilya Sutskever's secretive lab, Safe Superintelligence, as part of a long-term partnership announced Monday; financial terms weren't disclosed. The deal gives the startup access to enough of Nvidia's flagship GPUs to raise its computing resources by an \"order of magnitude,\" after it had relied primarily on Google's TPUs. The partnership illustrates how chip makers secure high-profile customers and helps Nvidia fend off a rival; it mirrors a March deal with Mira Murati's Thinking Machines Lab. Founded in 2024, Safe Superintelligence has raised about $2 billion from Andreessen Horowitz and Sequoia and reached a roughly $30 billion valuation. Sutskever, once central to ChatGPT, has publicly doubted whether scaling current paradigms suffices.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20WSJ/Nvidia%20Invests%20in%20Sutskever%E2%80%99s%20Safe%20Superintelligence%20AI%20Lab%20-%20WSJ.pdf"}, {"id": "wsj-10", "title": "Nvidia Leads Defense of Open-Source AI With New Cybersecurity Initiative", "source": "WSJ", "date": "29 Jul 2026", "tags": ["Technology & AI", "Politics"], "summary": "Nvidia is leading a new coalition urging the U.S. government and allies to view open-source AI as a cybersecurity asset rather than a threat. The Open Secure AI Alliance, announced Monday, aims to build and deploy open-source AI tools any company can use to defend against cyberattacks, and includes SpaceX, Microsoft, Palantir and dozens of others opposed to restricting open-model access. The move escalates a battle over open-weights AI amid rising fears such systems could enable cyberattacks, prompting the White House to increase oversight. Scrutiny grew after capable models from Chinese developers Moonshot and Z.AI won U.S. users. Critics at Anthropic and OpenAI warn open models pose national-security risks and officials have weighed a ban; defenders say open tools \"democratize defensive capabilities.\"", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20WSJ/Nvidia%20Leads%20Defense%20of%20Open-Source%20AI%20With%20New%20Cybersecurity%20Initiative.pdf"}, {"id": "wsj-11", "title": "Oil Sinks After U.S. Pauses Iran Strikes, Reviving Hopes for Diplomacy", "source": "WSJ", "date": "29 Jul 2026", "tags": ["Energy", "Finance & Markets"], "summary": "Oil prices plunged more than 5% Monday after the U.S. paused military strikes against Iran, reviving hopes for diplomacy to end the five-month conflict. The front-month Brent contract fell 5.5% to $91.44 a barrel, the second-month contract dropped 4.6% to $87.47, and West Texas Intermediate declined 5.1% to $84.76. Brent had topped $100 last week after the conflict spilled into the Red Sea, with Houthi attacks on Saudi vessels raising fears over crude exports to Asia via the Bab al-Mandeb Strait. ING analysts said the move reflected \"the market's desperation for positive news.\" Risks remain, including Houthi attacks and unresolved disputes over the Strait of Hormuz and Iran's nuclear program; shipping traffic has yet to normalize through both chokepoints.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20WSJ/Oil%20Sinks%20After%20U.S.%20Pauses%20Iran%20Strikes,%20Reviving%20Hopes%20for%20Diplomacy.pdf"}, {"id": "wsj-12", "title": "Saudi Arabia Says It Intercepted Drones Launched From Iraq at Oil Facilities", "source": "WSJ", "date": "29 Jul 2026", "tags": ["Geopolitics", "Energy"], "summary": "Saudi Arabia said Monday it intercepted a \"number of drones\" that Iran-backed Iraqi militias launched at its oil facilities, though the militias didn't claim responsibility and Yemen's Houthis said they had attacked Saudi oil sites, leaving culpability unclear. Iraq's prime minister ordered an investigation, vowing its territory wouldn't be used against friendly countries. A Saudi assessment found up to half of nearly 1,000 drone attacks on the kingdom originated in Iraq since the U.S. and Israel launched war on Iran in February. A Gulf official said Monday's attack caused minor damage to the Abqaiq facility, the world's largest, handling about 7 million barrels daily. The Houthis threaten a crucial Red Sea export route Riyadh uses to bypass the closed Strait of Hormuz.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20WSJ/Saudi%20Arabia%20Says%20It%20Intercepted%20Drones%20Launched%20From%20Iraq%20at%20Oil%20Facilities.pdf"}, {"id": "wsj-13", "title": "The ETF Crazy Train Is Picking Up Speed", "source": "WSJ", "date": "29 Jul 2026", "tags": ["Finance & Markets"], "summary": "Exchange-traded fund launches are booming as speculative investors and issuers chase the next big thing. In the U.S., 728 funds launched in the first half of 2026, per CFRA Research, on pace to break 2025's record. Issuers register dozens or hundreds of thin ETFs knowing most will lose money, betting a few hit the jackpot like the memory-focused DRAM fund, the fastest-growing ever. Themes and catchy tickers proliferate across space, robots and meme revivals, while inverse and leveraged single-stock products surge, some tracking SpaceX days after its IPO. Option-selling and buffered \"boomer candy\" ETFs keep luring buyers, and wealthy investors embrace tax-avoiding 351 exchanges. The top 100 ETFs control $10 trillion, but a coming wave of closures could blindside owners with tax bills.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20WSJ/The%20ETF%20Crazy%20Train%20Is%20Picking%20Up%20Speed.pdf"}, {"id": "wsj-14", "title": "Two Wars Converge in the Caspian Sea as Ukraine Hits Iranian Supply Line to Russia", "source": "WSJ", "date": "29 Jul 2026", "tags": ["Geopolitics", "Defence"], "summary": "Ukrainian drones struck military-supply lines linking Russia and Iran across the Caspian Sea, opening a new front where two intertwined wars converge. President Zelensky claimed responsibility, saying strikes hit vessels used in military cargo shipments involving Iran and a warship. Ukraine's Security Service said it targeted a Russian oil field, a missile boat and ships transporting Iranian drones to Russia. Iran, which has supplied lethal drones to Russia while receiving Kremlin intelligence, blamed Zelensky for a strike it said killed a sailor and summoned Ukraine's charge d'affaires. The Caspian offers Iran a route to Russia and Central Asia unfettered by U.S. interdiction, circumventing a potential blockade. Analysts say the strikes let Kyiv signal alignment with Trump and disrupt Moscow-Tehran links over 430 miles away.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20WSJ/Two%20Wars%20Converge%20in%20the%20Caspian%20Sea%20as%20Ukraine%20Hits%20Iranian%20Supply%20Line%20to%20Russia.pdf"}, {"id": "wsj-15", "title": "U.S. Durable-Goods Orders Rose Less Than Expected in June", "source": "WSJ", "date": "29 Jul 2026", "tags": ["Finance & Markets"], "summary": "Demand for U.S. durable goods rose less than expected in June, Commerce Department data showed. Total orders for durable goods, meaning items meant to last three years or more, increased 0.3% to $334.8 billion from May, well below the 2.1% rise economists polled by The Wall Street Journal had expected. Computers and electronic products, up in nine of the last 10 months, led the increase with a 3.1% gain. Excluding transportation, new orders rose 0.6%. Excluding defense, new orders increased 0.3%. The softer-than-forecast reading suggests business investment momentum cooled during the month even as technology-related categories continued to show strength.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20WSJ/U.S.%20Durable-Goods%20Orders%20Rose%20Less%20Than%20Expected%20in%20June.pdf"}, {"id": "wsj-16", "title": "U.S. Environmentalists Go Easy on China", "source": "WSJ", "date": "29 Jul 2026", "tags": ["Environment", "Geopolitics"], "summary": "This opinion piece argues the Environmental Law Institute, a federally funded Washington nonprofit that has trained thousands of American judges on climate issues, applies a double standard favoring Beijing. A report, \"ELI and Communist China,\" from State Armor alleges ELI promotes a pro-China agenda, citing a 2023 seminar featuring a senior Chinese Supreme Court judge praising Xi Jinping's climate policies. In the U.S., ELI's Climate Judiciary Project advances legal theories like \"attribution science\" to pressure domestic energy producers through private litigation, drawing a House Judiciary Committee investigation. In China, ELI avoids private litigation, running softer regulatory programs. The author calls the asymmetry a win-win for Beijing, whose emissions have risen since the 1990s while U.S. energy faces mounting legal pressure.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20WSJ/U.S.%20Environmentalists%20Go%20Easy%20on%20China.pdf"}, {"id": "wsj-17", "title": "Western Powers Race to Bring the Production of Explosives Back Home", "source": "WSJ", "date": "29 Jul 2026", "tags": ["Defence", "Trade"], "summary": "Western governments are unleashing spending to reshore explosives and propellant production after Russia's invasion of Ukraine exposed the West's struggle to churn out ammunition. At least 24 new propellant or explosive projects are under way across NATO countries, per a Wall Street Journal tally, with three factories set for Arkansas alone. Producers still depend on constricted supplies of dangerous chemicals from a chokepoint-laden global supply chain. Regulus Global plans a triple-base propellant site, a powerful variant the U.S. hasn't made since 1986; the U.S. has only one propellant factory, a WWII-era Virginia plant. D&M Holding and South Korea's Hanwha also plan Arkansas plants. TNT will soon be produced in the U.S. again, three European TNT plants are rising, and the U.K. plans six energetics factories by 2030.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20WSJ/Western%20Powers%20Race%20to%20Bring%20the%20Production%20of%20Explosives%20Back%20Home.pdf"}, {"id": "st-01", "title": "No more 15-month wait-out period for private home owners to buy HDB resale flats: Chee Hong Tat", "source": "ST", "date": "29 Jul 2026", "tags": ["Society", "Finance & Markets"], "summary": "National Development Minister Chee Hong Tat lifted, with immediate effect, the 15-month wait-out period requiring private home owners to sell before buying a non-subsidised HDB resale flat. Introduced in September 2022 to cool cash-rich downgrader demand, the measure has met its purpose as resale price growth moderated from 10.4% in 2022 to 2.9% in 2025, with prices falling for two straight quarters. Owners of all ages now face no wait. HDB processed about 5,500 waiver appeals, approving roughly a quarter. Analysts expect more million-dollar and larger-flat transactions but limited overall market impact given ample supply. Chee also said the Government is reviewing lowering the age-35 threshold for singles buying flats.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20ST/1.%20No%20more%2015-month%20wait-out%20period%20for%20private%20home%20owners%20to%20buy%20HDB%20resale%20flats%20Chee%20Hong%20Tat.pdf"}, {"id": "st-02", "title": "ABSD deadline for large en bloc projects extended", "source": "ST", "date": "29 Jul 2026", "tags": ["Finance & Markets", "Society"], "summary": "Developers of large residential collective-sale sites will get more time to build and sell units to qualify for the 35% additional buyer's stamp duty (ABSD) remission, National Development Minister Chee Hong Tat announced. For sites bought from July 29, large sites yielding 700 to under 1,400 units get six years (up from 5.5), while mega sites of 1,400-plus units get seven years. Mega-site developers must sell half their units by year six or face full clawback. Projects meeting extra criteria gain further six-month extensions. Chee said the changes set \"the right incentives\" to rejuvenate larger estates and avoid a \"lose-lose outcome.\" REDAS and Colliers welcomed the move, saying it reduces execution risk on lengthy en bloc redevelopments.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20ST/ABSD%20deadline%20for%20large%20en%20bloc%20projects%20extended.pdf"}, {"id": "st-03", "title": "Asia isn't waiting for America to quit its Iran distraction", "source": "ST", "date": "29 Jul 2026", "tags": ["Geopolitics", "Defence"], "summary": "Ravi Velloor argues Asian powers are hedging as US attention stays fixed on Iran and Donald Trump adopts a softer China stance. Quad foreign ministers met in Manila, tentatively floating a 2026 summit, though Trump's pique at India's Narendra Modi has stalled momentum. Japan, under Prime Minister Sanae Takaichi, is filling the void via \"Official Security Assistance,\" arms-export reforms, a revamped Free and Open Indo-Pacific framework and deeper defence ties with India, Australia, the Philippines and South Korea. India remains wary of overtly targeting China while accepting subsidised weapons. Smaller states like New Zealand are boosting defence spending. Velloor concludes regional powers must prepare for any US retrenchment: there is trust, but governments will \"tie down their camels.\"", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20ST/Asia%20isn't%20waiting%20for%20America%20to%20quit%20its%20Iran%20distraction.pdf"}, {"id": "st-04", "title": "Australia's sudden housing chill seeps into economy", "source": "ST", "date": "29 Jul 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "Australia's housing market is suffering its worst slowdown since the pandemic, as higher borrowing costs and reversed investor tax breaks sap confidence. Sydney and Melbourne prices have fallen nearly 5% in 2026, with auction clearances, loan inquiries and sales sliding. The Reserve Bank raised rates three times between February and May to tame Iran-war-driven inflation, reversing 2025 easing. Mortgage inquiries dropped 14% in June year-on-year; New South Wales cut stamp-duty forecasts by A$5.3 billion over four years. Bank shares have tumbled 12% since February. With about two-thirds of households owning homes, the wealth effect threatens consumer spending; retailer Myer warned of a June-July slump. High oil prices have dimmed hopes of a quick turnaround.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20ST/Australia's%20sudden%20housing%20chill%20seeps%20into%20economy.pdf"}, {"id": "st-05", "title": "Chinese chip giant CXMT's $12.7 billion IPO is a flop", "source": "ST", "date": "29 Jul 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Bloomberg columnist Shuli Ren argues Chinese memory-chip champion CXMT's $12.7 billion Shanghai Star board IPO, though raising 66.61 billion yuan, was a flop. Its shares jumped 466% on the July 27 debut, a pop analysts called evidence of severe underpricing at just 2.4 times book value, far below global and domestic peers. Ren blames politics: half the offering went to strategic investors like state social-security and insurance funds demanding guaranteed profits, while CXMT lacks a controlling shareholder or powerful backer to negotiate a fair price. The raise pales beside SK Hynix's $26.5 billion US listing. Ren says the US-China AI race has shifted to financing, where China's overly political markets prevent national champions from raising capital at fair prices.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20ST/Chinese%20chip%20giant%20CXMT's%2012.7%20billion%20IPO%20is%20a%20flop.pdf"}, {"id": "st-06", "title": "Kimi panic is a Sputnik moment for 'open' AI", "source": "ST", "date": "29 Jul 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "Bloomberg columnist Catherine Thorbecke calls the panic over Moonshot's Kimi K3 a \"Sputnik moment\" for open AI. Washington officials, including Treasury's Scott Bessent, threatened sanctions and Entity List designations, accusing Chinese firms of IP theft via distillation. But Silicon Valley revolted: 179 start-ups and founders, plus a letter signed by Microsoft, Google and OpenAI and shared by Nvidia's Jensen Huang, defended open-weight models and legitimate distillation. Thorbecke says open models redistribute rather than erode revenue, benefiting chipmakers and cloud providers while exposing Anthropic and OpenAI. A ban would backfire, disadvantaging US researchers without stopping global access. She argues embracing open models would strengthen American AI more than suppression, especially as Beijing pursues home-grown chips.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20ST/Kimi%20panic%20is%20a%20Sputnik%20moment%20for%20'open'%20AI.pdf"}, {"id": "st-07", "title": "MAS net profit of $20 billion on strong investment gains", "source": "ST", "date": "29 Jul 2026", "tags": ["Finance & Markets"], "summary": "The Monetary Authority of Singapore reported a $20 billion net profit for the fiscal year ended March 31, 2026, up from $19.7 billion, as $39.8 billion in investment gains offset a $16.4 billion drag from a stronger Singapore dollar. Managing director Chia Der Jiun cited resilient global equity and bond markets, with returns above MAS's 10-year average of $18.3 billion. MAS incurred $2.4 billion in money-market operation costs and will contribute $1 billion to the consolidated fund plus return $2.5 billion to the Government. Chia said it is too early to conclude AI-infrastructure financing poses systemic risks, but warned dangers could mount as debt-and-equity-funded investments pile up in coming years.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20ST/MAS%20net%20profit%20of%2020%20billion%20on%20strong%20investment%20gains.pdf"}, {"id": "st-08", "title": "Singapore's financial sector grew 4.3% in 2025, created 4,200 jobs annually over five years", "source": "ST", "date": "29 Jul 2026", "tags": ["Finance & Markets", "Society"], "summary": "Singapore's financial services sector grew 4.3% in 2025, slowing from 7.3% in 2024 but meeting the industry transformation map's 4-5% target and matching the 4.6% five-year average, MAS's annual report said. The sector, 14% of GDP, created an average 4,200 net jobs yearly from 2021-2025, all going to locals. Assets under management rose 10% to $6.7 trillion; insurance assets grew 7.6% to $493.5 billion; net inflows jumped 29%. Managing director Chia Der Jiun flagged priorities including growth capital, gold trading, fintech and defences against AI-enabled and quantum threats, announcing a new banking cyber task force. He warned the global economy could diverge sharply depending on whether the AI investment boom persists.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20ST/Singapore's%20financial%20sector%20grew%204.3%20in%202025,%20created%204,200%20jobs%20annually%20over%20five%20years.pdf"}, {"id": "st-09", "title": "South Korea to write nuclear non-proliferation into submarine law", "source": "ST", "date": "29 Jul 2026", "tags": ["Defence", "Geopolitics"], "summary": "South Korea's Defence Ministry plans to legislate a ban on diverting submarine nuclear fuel to weapons, addressing proliferation concerns over its nuclear-powered submarine programme. A legislative notice for the Bill was expected as early as July 29. It would be Seoul's first explicit statutory prohibition on using nuclear material for weapons and require compliance with the Nuclear Non-Proliferation Treaty and IAEA safeguards. The move follows May's Jangbogo-N project, agreed by President Lee Jae Myung and Donald Trump in 2025. South Korea seeks three roughly 8,000-tonne submarines using low-enriched uranium below 20% U-235, with the lead vessel launching in the mid-2030s. A Prime Minister-chaired committee would oversee it, but progress hinges on a US fuel-supply agreement.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20ST/South%20Korea%20to%20write%20nuclear%20non-proliferation%20into%20submarine%20law.pdf"}, {"id": "st-10", "title": "Taiwan drills to test relocating arms production under Chinese attack", "source": "ST", "date": "29 Jul 2026", "tags": ["Defence", "Geopolitics"], "summary": "Taiwan will test relocating weapons-production lines and converting civilian factories for military use during its annual Han Kuang war games from Aug 5-14, the Defence Ministry said, aiming to sustain combat if Chinese attacks hit supply hubs. Drills assume China uses routine exercises to mask preparations for a full invasion, prompting rapid mobilisation. They will simulate relocating Taipei's 202nd Arsenal and test keeping sea lanes open, with navy and coast guard live-fire exercises. The move follows a sharp rise in Chinese coast guard activity; the US de facto embassy disclosed rare coast-guard coordination, publishing an image of vessels sailing with cutter Midgett. For the first time, Taiwan will deliberately slow mobile internet speeds to test emergency communications.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20ST/Taiwan%20drills%20to%20test%20relocating%20arms%20production%20under%20Chinese%20attack.pdf"}, {"id": "st-11", "title": "US Justice Dept asks Supreme Court to restore Trump mail-in voting order", "source": "ST", "date": "29 Jul 2026", "tags": ["Politics"], "summary": "The Trump administration asked the US Supreme Court to let federal officials proceed with overhauling mail-in voting before November's midterm elections, after lower courts blocked the plan in nearly half the country. The Justice Department filed an emergency request on July 27 seeking to lift a Boston judge's order that barred agencies from acting on President Donald Trump's March executive order in 23 suing states plus Washington, DC. Solicitor-General D. John Sauer said the injunction was premature while agencies still deliberate rules. The judge found key provisions unlawful and the states already harmed; an appeals panel declined to pause her order. The court sought a response by Aug 3. Other challenges, including a Democratic National Committee lawsuit, remain pending.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20ST/US%20Justice%20Dept%20asks%20Supreme%20Court%20to%20restore%20Trump%20mail-in%20voting%20order.pdf"}, {"id": "st-12", "title": "Ukraine, Iran and how regional wars go global", "source": "ST", "date": "29 Jul 2026", "tags": ["Geopolitics", "Defence"], "summary": "This Financial Times commentary argues once-distinct regional wars are beginning to overlap into a potentially global conflict. Iran said Ukraine sank an Iranian merchant vessel in the Caspian Sea; Kyiv acknowledged striking military cargo ships heading to Russia. President Volodymyr Zelensky warned North Korea is preparing to send another 30,000 troops to fight for Russia. Strategists label Russia, China, Iran and North Korea an \"axis of adversaries\" seeking to hasten American decline, though Trump's friction with allies complicates any counter-bloc. Kyiv may be striking Iran to court Washington and forge cohesion. China discreetly aids Russia and Iran with dual-use goods. Invoking the \"Thucydides trap,\" the writer warns regional conflict and great-power miscalculation could prove deadly.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20ST/Ukraine,%20Iran%20and%20how%20regional%20wars%20go%20global.pdf"}, {"id": "st-13", "title": "Why North Korea will keep backing Russia in the Ukraine war", "source": "ST", "date": "29 Jul 2026", "tags": ["Geopolitics", "Defence"], "summary": "North Korea's troop deployment to fight for Russia has evolved into a long-term strategic investment, analysts told The Straits Times, amid reports Pyongyang could send another 30,000 soldiers. Since a June 2024 mutual defence treaty, roughly 14,000 elite troops and thousands of engineers have gone, gaining battlefield experience and access to advanced military technology despite receiving perhaps only 20% of projected compensation. Analysts say Kim Jong Un is playing a long game, valuing Russia as a counterweight to reliance on China and a source of missile know-how, evident in the upgraded Hwasong-11. Zelensky warned the threat extends to \"everyone in Asia.\" A delayed Tumen River bridge would symbolise the deepening partnership, ultimately boosting Kim's leverage over South Korea.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20ST/Why%20North%20Korea%20will%20keep%20backing%20Russia%20in%20the%20Ukraine%20war.pdf"}, {"id": "bt-01", "title": "Australian central bank chief says economy cooling, unsure rates high enough", "source": "BT", "date": "29 Jul 2026", "tags": ["Finance & Markets"], "summary": "Reserve Bank of Australia governor Michele Bullock said the economy is cooling as anticipated but it remains unclear whether this year's three rate hikes, which lifted the cash rate to 4.35%, are enough to return inflation to the 2-3% target. Speaking in Sydney on Jul 28, she said further easing in demand is likely needed and the board is prepared to raise rates again if required. Markets price a one-in-four chance of an August hike and over 90% odds by December. Bullock flagged oil-driven fuel costs feeding through to prices, weak productivity, easing labour markets and modest housing-price falls concentrated in Sydney and Melbourne, noting negative equity affects under 1% of borrowers.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20BT/Australian%20central%20bank%20chief%20says%20economy%20cooling,%20unsure%20rates%20high%20enough.pdf"}, {"id": "bt-02", "title": "CapitaLand Ascott Trust H1 DPS flat at S$0.0253", "source": "BT", "date": "29 Jul 2026", "tags": ["Finance & Markets"], "summary": "CapitaLand Ascott Trust posted a first-half distribution per stapled security of S$0.0253 for the six months ended Jun 30, unchanged from a year earlier. The payout will be made on Aug 28, after an Aug 5 record date. Distributable income rose 11% to S$107.1 million from S$96.5 million, while total distribution edged up 1% year on year to S$97.5 million after the manager retained S$9.6 million in non-periodic items. Following the divestment of The Robertson House, the manager expects at least one more divestment this year as it continues reshaping its portfolio of serviced residences and hospitality assets across its markets.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20BT/CapitaLand%20Ascott%20Trust%20H1%20DPS%20flat%20at%20S0.0253.pdf"}, {"id": "bt-03", "title": "Count the companies worth owning, not the ones listed", "source": "BT", "date": "29 Jul 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "This commentary argues exchanges wrongly measure success by the number of listings rather than how many firms become well-run, investable businesses. It cites Parkway's 2010 delisting from Singapore, which resurfaced in 2012 as regional hospital giant IHH Healthcare with a Bursa Malaysia primary and SGX secondary listing, showing delistings can create value. The Philippine Stock Exchange, by contrast, is studying whether to halt involuntary delisting to preserve back-door-listing prospects. The writer notes South-east Asian bourses are spending heavily and relaxing rules to court issuers, citing Singapore's Equity Market Development Programme, Malaysia's MY Value Up, Thailand's Vayupak Fund and Vietnam's reforms. The better test, it says, is whether exchanges keep producing companies that flourish and reward shareholders.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20BT/Count%20the%20companies%20worth%20owning,%20not%20the%20ones%20listed.pdf"}, {"id": "bt-04", "title": "DBS rolls out agentic AI to 350,000 corporate clients", "source": "BT", "date": "29 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "DBS on Jul 28 rolled out an agentic AI assistant, DBS Joy, to 350,000 corporate clients in Singapore, including SMEs, letting them retrieve and analyse account and transaction data within a single conversation and act on requests. The capability extends to 100,000 Hong Kong users in September, then other markets. DBS Joy, launched in 2018 and revamped with generative AI in 2025, saw first-half chats rise 22% and active users 61%, cutting service calls and e-mails 7%. Its retail chatbot, DBS digibot, now uses generative AI and resolved nine in 10 queries digitally; it will integrate into wealth platform digiWealth in August. DBS generated S$1 billion in AI economic value in 2025, up a third on 2024.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20BT/DBS%20rolls%20out%20agentic%20AI%20to%20350,000%20corporate%20clients.pdf"}, {"id": "bt-05", "title": "Keppel Infrastructure Trust posts 1% higher H1 DPU of S$0.0199", "source": "BT", "date": "29 Jul 2026", "tags": ["Finance & Markets", "Energy"], "summary": "Keppel Infrastructure Trust posted a first-half distribution per unit of S$0.0199, up 1% from S$0.0197 a year earlier, for the six months ended Jun 30. Revenue rose 13.8% to S$1.3 billion. The trust cited limited direct exposure to the Middle East conflict, with a defensive portfolio backed by long-term contracts and cost pass-through mechanisms; units Ixom and City Energy saw fuel-cost under-recovery in Q2 but cost measures contained the impact. Distributable income fell 15.3% to S$101.1 million, reflecting a prior-year divestment gain; excluding that, it would have risen 1.2%. Net gearing stood at 44.2% with 8.3-times interest coverage and about S$700 million of dry powder. Units closed at S$0.535 before results.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20BT/Keppel%20Infrastructure%20Trust%20posts%201%20higher%20H1%20DPU%20of%20S0.0199.pdf"}, {"id": "bt-06", "title": "MAS chief flags AI investment boom as key risk to global financial stability", "source": "BT", "date": "29 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "MAS managing director Chia Der Jiun flagged the sustainability of the AI investment boom as a key risk to global growth and financial stability, as markets grow dependent on rising data-centre and chip spending in the US and Asia. Near-term investment is backed by committed orders and hyperscaler cash flows, but medium-term revenue must justify financing risks; a pullback could sharply weaken growth and tighten financial conditions. MAS and the Association of Banks in Singapore launched an AI-Driven Cyber and Technology Risk Taskforce, including DBS, OCBC, UOB and SGX, to counter AI-enabled scams, deepfakes and quantum threats. MAS will issue supervisory expectations on quantum resilience and is testing cross-bank AI models to detect scam transactions.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20BT/MAS%20chief%20flags%20AI%20investment%20boom%20as%20key%20risk%20to%20global%20financial%20stability.pdf"}, {"id": "bt-07", "title": "Mapletree launches first China onshore logistics fund with US$221-million AUM", "source": "BT", "date": "29 Jul 2026", "tags": ["Finance & Markets"], "summary": "Mapletree Investments launched its first China onshore renminbi logistics fund with China Life Capital, holding about 1.5 billion yuan (US$221.6 million) in assets under management. The fund, seeded with commitments from international insurers, owns five stabilised logistics assets in Nanjing, Wuxi and Chengdu totalling roughly 382,000 square metres at 95% occupancy, leased to logistics firms, e-commerce operators and manufacturers. Mapletree Logistics Trust proposed divesting two Wuxi warehouses to the fund for 724 million yuan as part of capital recycling. Regional CEO Goh Chye Boon cited an improving China real-estate environment. Mapletree is exploring C-Reit listings and private Reits; since 2006 it has developed over 10 million sq m of logistics space across 130 Chinese properties.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20BT/Mapletree%20launches%20first%20China%20onshore%20logistics%20fund%20with%20US221-million%20AUM.pdf"}, {"id": "bt-08", "title": "Moonshot AI heralds new generation of Asian AI champions", "source": "BT", "date": "29 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "This OCBC commentary says Chinese startup Moonshot AI's Kimi K3 model, seen as rivalling Anthropic and OpenAI, triggered a tech and semiconductor sell-off, with the Philadelphia Semiconductor Index down 20% in a month. Yet the writer argues the moment signals AI opportunity broadening, not ending: more entrants mean cheaper, more accessible models, wider adoption and long-term gains across chips, memory, networking, cloud and data centres. It highlights Asia's rising role, citing memory maker CXMT, one of China's largest IPOs, plus Z.AI and Moonshot's planned Hong Kong IPO potentially valuing it at up to US$50 billion. Capital is rotating toward less-crowded parts of the market as a new generation of Asian AI champions emerges.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20BT/Moonshot%20AI%20heralds%20new%20generation%20of%20Asian%20AI%20champions.pdf"}, {"id": "bt-09", "title": "Mortgagee-sale listings hit six-year high in H1 2026 as financing conditions tighten", "source": "BT", "date": "29 Jul 2026", "tags": ["Finance & Markets", "Society"], "summary": "Mortgagee-sale listings in Singapore's property auction market hit a near seven-year high of 216 in H1 2026, the most since 2019, as tighter financing conditions pressured borrowers, an ETC report showed. That was up 31% from the prior half and 29% year on year, making up nearly three-quarters of 292 auction listings. Knight Frank recorded 109 mortgagee listings in Q2, a second straight quarter above 100. Residential properties led with 144 listings (49%), followed by industrial at 87 (30%), while retail and owner-sale listings fell. Auction sales totalled S$27.7 million across 13 deals. Analysts expect activity to stay resilient in H2, particularly residential and industrial, calling the market selective rather than distressed.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20BT/Mortgagee-sale%20listings%20hit%20six-year%20high%20in%20H1%202026%20as%20financing%20conditions%20tighten.pdf"}, {"id": "bt-10", "title": "Singapore AUM up 10.1% at S$6.7 trillion as MAS eyes competitiveness push", "source": "BT", "date": "29 Jul 2026", "tags": ["Finance & Markets"], "summary": "Singapore's total assets under management rose 10.1% to S$6.7 trillion at end-2025 on strong markets and net inflows, MAS said in its annual report. The financial sector grew 4.3%, slower than 2024's 6.8%. Net AUM inflows jumped 29% to S$376 billion; traditional AUM grew 9% while alternatives edged up 0.4% after one large manager downsized. Some 76% of funds came from abroad and 88% were invested overseas. Licensed fund managers numbered 1,320. MAS reported a S$20 billion net profit and said it is in talks with industry to sharpen competitiveness against rivals like Hong Kong, with a review due shortly. Chia Der Jiun stayed cautious given energy disruption, inflation and high valuations.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20BT/Singapore%20AUM%20up%2010.1%20at%20S6.7%20trillion%20as%20MAS%20eyes%20competitiveness%20push.pdf"}, {"id": "bt-11", "title": "Singapore tech stocks slide as chip sell-off spreads in Asia despite CXMT surge", "source": "BT", "date": "29 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Singapore technology and semiconductor stocks fell on Jul 28 as a global memory-chip rout spread across Asia. Applied Materials suppliers Frencken and UMS dropped 8.9% and 8.5%, while AEM fell 8.5%. The sell-off followed a 5.8% slide in ASML after reports a Chinese state-backed firm can mass-produce immersive DUV lithography machines, hitting Nikon and Canon too. US names Nvidia, AMD and Micron fell on AI financing-risk fears, including Nvidia's reported US$250 billion OpenAI backstop. Samsung and SK Hynix sank up to 9.5% and 10.9%. The moves contrasted with CXMT, which surged 466% on debut to become China's most valuable company, though Morningstar analysts called it considerably overvalued and two generations behind peers.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20BT/Singapore%20tech%20stocks%20slide%20as%20chip%20sell-off%20spreads%20in%20Asia%20despite%20CXMT%20surge.pdf"}, {"id": "bt-12", "title": "The trillion-dollar question hanging over AI", "source": "BT", "date": "29 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "This Arta Finance commentary examines whether AI leaders can generate revenue to justify enormous spending, citing Anthropic CEO Dario Amodei's suggestion his firm needs US$1 trillion in annual revenue within years. Big tech now reinvests nearly all operating cash flow into data centres, chips and power, lifting depreciation, compressing returns and increasingly funding the gap with debt and equity. With valuations pricing near-perfect outcomes, future returns depend on earnings growth and the widening spread between winners and laggards. Key risks include models becoming commoditised as cheaper Chinese rivals narrow the quality gap, and a wall of tech debt needing refinancing. The writer favours owning suppliers and enablers, notably power and grid infrastructure, plus hedges and diversification.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20BT/The%20trillion-dollar%20question%20hanging%20over%20AI.pdf"}, {"id": "bt-13", "title": "Why AI advantage starts with organisational memory", "source": "BT", "date": "29 Jul 2026", "tags": ["Technology & AI"], "summary": "This commentary argues AI advantage begins with organisational memory, urging leaders to ask what knowledge would vanish if their most experienced people left, and to capture, structure and govern it. As foundation models converge, proprietary context, policies, customer history and institutional judgment become the differentiator, especially in Asian firms where knowledge sits in relationships and founder judgment. The writer proposes an abundance test to decide where AI should be applied, and urges redesigning workflows rather than automating existing handoffs. Tomorrow's enterprise agents will resemble digital employees needing identities, permissions and audit trails, so they must be governed as organisational actors. Firms should measure real change in work, not licences or prompts, citing Singapore's IMDA agentic-AI framework.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20BT/Why%20AI%20advantage%20starts%20with%20organisational%20memory.pdf"}, {"id": "bt-14", "title": "Why Asia-Pacific governments are taking different approaches to sovereign AI", "source": "BT", "date": "29 Jul 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "This Dell commentary notes sovereign AI jumped from the seventh to second-highest investment priority for Asia-Pacific governments between 2024 and 2025, per IDC. Rather than full-stack autonomy, a pragmatic model of operational sovereignty is emerging, with national control where essential and reliance on global ecosystems elsewhere. It identifies four approaches: governance as an accelerator (Singapore, Malaysia, Philippines), national self-reliance (India's 38,000-GPU mission and Japan's local LLMs), sector selectivity (Australia and New Zealand protecting critical systems) and rapid public-sector adoption (South Korea, Thailand, Indonesia). Singapore committed over S$1 billion to AI R&D alongside its agentic-AI framework. Governments increasingly judge vendors on long-term partnership, responsible-AI maturity and knowledge transfer, prioritising adaptable ecosystems that align public and private sectors.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20BT/Why%20Asia-Pacific%20governments%20are%20taking%20different%20approaches%20to%20sovereign%20AI.pdf"}, {"id": "bt-15", "title": "Why Japan's new fiscal era matters for advanced economies and Asean", "source": "BT", "date": "29 Jul 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "This commentary says the Bank of Japan looks likely to raise rates again even as Tokyo advances a 370 trillion yen (US$2.3 trillion) investment programme in economic security, AI and next-generation industries, making Japan the first major economy to confront fiscal pressures many advanced economies will face. Decades of near-zero rates rested on high savings, loyal domestic investors and BOJ bond-buying; those buffers are weakening as inflation returns, the BOJ tapers purchases and an ageing population erodes savings. A wide US rate gap fed the yen carry trade. The writer says fiscal credibility, not just debt size, now matters. Implications extend to Asean and Singapore through returning Japanese savings, deeper supply chains and technology partnerships.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/29%20Jul%202026/29%20Jul%20BT/Why%20Japan's%20new%20fiscal%20era%20matters%20for%20advanced%20eco
