ty%20News%20Dashboard/28%20Jul%202026/28%20Jul%20ST/Drones%20attack%20Iran's%20neighbours%20as%20Tehran%20appears%20to%20test%20Donald%20Trump's%20latest%20pause.pdf"}, {"id": "st-04", "title": "Gold climbs as pause in Middle East fighting curbs inflation risk", "source": "ST", "date": "28 Jul 2026", "tags": ["Finance & Markets", "Energy"], "summary": "Gold rose after a weekend pause in US-Iran fighting eased oil supply risks and inflation concerns. Bullion climbed as much as 1.1 per cent to near US$4,100 an ounce on July 27, having gained nearly 1 per cent the prior week. The US halted almost two weeks of strikes without explanation, while Iran refrained from retaliation and held talks with Oman on Strait of Hormuz shipping. Brent fell over 7 per cent to below US$90 at the open before paring losses. Gold has hovered around US$4,000 since late June, down over a fifth since US-Israel strikes in late February ended a run near a record US$5,600 in January. Spot gold reached US$4,094.03; silver jumped 2.7 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20ST/Gold%20climbs%20as%20pause%20in%20Middle%20East%20fighting%20curbs%20inflation%20risk.pdf"}, {"id": "st-05", "title": "Has America stopped caring about Trump's tariffs?", "source": "ST", "date": "28 Jul 2026", "tags": ["Trade", "Politics", "Finance & Markets"], "summary": "Trump's latest tariffs of 10 to 12.5 per cent on 60 trading partners may prove uneventful, the commentary argues, with the surprise being their timing months before US midterm elections. For many exporters the change is modest, since most imports already faced a 10 per cent levy after the Supreme Court struck down emergency-powers tariffs. For Singapore and Australia the rise to 12.5 per cent brings some pain but is unexpected, with carve-outs on food, energy, semiconductors and pharmaceuticals. Polls show tariff approval barely moved and tracks Trump's overall ratings. Over 70 per cent disapprove of his cost-of-living management. Rising oil prices, pushing petrol from US$3 to US$4 a gallon, may hurt households more than tariffs.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20ST/Has%20America%20stopped%20caring%20about%20Trump's%20tariffs.pdf"}, {"id": "st-06", "title": "Have Saudi Arabia and Ukraine entered the war against Iran?", "source": "ST", "date": "28 Jul 2026", "tags": ["Geopolitics", "Defence", "Energy"], "summary": "Commentator Jonathan Eyal examines two military operations 3,000km apart: Ukrainian long-range drones struck an Iranian vessel in the Caspian Sea, while Saudi jets hit Houthi installations in Yemen. He argues the Gulf war is not spreading but that Iran is paying for behaviour it long pursued with impunity. Iran's weaponising of the Strait of Hormuz cut transits from about 110 daily to barely a dozen, globalising the conflict. Iran has supplied Shahed drones to Russia via the Caspian since 2022 and armed the Houthis, making itself a target. Ukraine's July 26 strike killed one Iranian sailor; Zelensky vowed continued strikes. The operation also signals to Trump that Kyiv can serve US strategic interests.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20ST/Have%20Saudi%20Arabia%20and%20Ukraine%20entered%20the%20war%20against%20Iran.pdf"}, {"id": "st-07", "title": "Japan to launch new intelligence bureau on July 31 in counter-spy push", "source": "ST", "date": "28 Jul 2026", "tags": ["Geopolitics", "Politics", "Defence"], "summary": "Japan's Cabinet on July 24 approved launching a new National Intelligence Bureau on July 31 and appointing its director, ramping up counter-espionage after a May law established new bodies amid growing overseas threats. The first meeting of the National Intelligence Council, chaired by Prime Minister Sanae Takaichi, is planned for the same day, beginning work on the country's first national intelligence strategy. The Cabinet named Kazuya Hara, Cabinet intelligence director since June 2023, as first bureau head. Chief Cabinet Secretary Minoru Kihara called the launch significant given the challenging international environment. The council will include nine other Cabinet members. The government expects to submit related Bills to the 2027 parliamentary session, including a foreign-agent registration system.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20ST/Japan%20to%20launch%20new%20intelligence%20bureau%20on%20July%2031%20in%20counter-spy%20push.pdf"}, {"id": "st-08", "title": "MAS tightens monetary policy, allows for stronger Singdollar", "source": "ST", "date": "28 Jul 2026", "tags": ["Finance & Markets", "Energy", "Southeast Asia"], "summary": "The Monetary Authority of Singapore tightened monetary policy for a second straight time on July 27, allowing a stronger currency amid inflation risk from higher oil and gas prices tied to the Iran war. MAS will increase \"very slightly\" the appreciation rate of the S$NEER policy band. It first tightened in April, its initial move since 2022. Core inflation ticked up to 1.6 per cent in June, within MAS' 1.5-2.5 per cent forecast range, but external pressures are expected to persist and moderate only from mid-2027. Brent has risen over 50 per cent since early 2026, touching US$100 before easing to around US$96. The Singapore dollar is up about 4 per cent against the yen this year.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20ST/MAS%20tightens%20monetary%20policy,%20allows%20for%20stronger%20Singdollar.pdf"}, {"id": "st-09", "title": "S'pore businesses hit by higher 12.5% US tariffs", "source": "ST", "date": "28 Jul 2026", "tags": ["Trade", "Southeast Asia", "Finance & Markets"], "summary": "Singapore businesses face a new 12.5 per cent US tariff that took effect on July 24, pushing duties on some China-made goods to as much as 89 per cent. A US Federal Register notice on July 23 listed China, Singapore and 45 economies facing the levy after a USTR forced-labour probe. Local entrepreneur T.K. Khor, owner of Outsource Asia Industries, said his business fell from US$8 million to US$2-3 million. About a third of Singapore's domestic exports to the US are affected, though energy, pharmaceuticals, semiconductors and bullion metals stay exempt. ASME president Ang Yuit said traditional exporters face a squeeze but compliance-focused services firms may benefit. Singapore rejects claims it condones forced labour.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20ST/S'pore%20businesses%20hit%20by%20higher%2012.5%20US%20tariffs.pdf"}, {"id": "st-10", "title": "S'pore listed firms may soon need to disclose climate impact", "source": "ST", "date": "28 Jul 2026", "tags": ["Environment", "Finance & Markets", "Society"], "summary": "Singapore-listed and large companies may soon be required to disclose how their business affects the climate, including direct greenhouse gas emissions, under newly drafted Singapore Sustainability Disclosure Standards proposed by ACRA and open for feedback until Oct 25. All large non-listed companies, defined as those with at least $1 billion revenue and $500 million total assets, must report Scope 1 and Scope 2 emissions by FY2030. Listed companies have reported since FY2025. Scope 3 disclosure is required for Straits Times Index firms by FY2026 but voluntary for others. The standards align with ISSB global standards. ACRA said Singapore adopts a \"climate-first\" approach given the urgency to combat climate change, with timelines already adjusted in August 2025.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20ST/S'pore%20listed%20firms%20may%20soon%20need%20to%20disclose%20climate%20impact.pdf"}, {"id": "st-11", "title": "Singapore births fall to lowest since independence", "source": "ST", "date": "28 Jul 2026", "tags": ["Society", "Politics"], "summary": "The number of babies born in Singapore fell to 29,864 in 2025, the lowest since independence and below 30,000 for the first time in 60 years, down 11.4 per cent from 33,703 in 2024. The Report on Registration of Births and Deaths, released by the ICA on July 27, showed 87 per cent of babies had at least one Singaporean parent. The median age of first-time mothers rose to 32.1 years. The resident total fertility rate fell to 0.87 in 2025. Deaths rose slightly to 26,499, with cancer and heart disease the leading causes. Teenage mother births fell 43 per cent to 140. Gan Kim Yong warned the citizen population may shrink from the early 2040s without intervention.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20ST/Singapore%20births%20fall%20to%20lowest%20since%20independence.pdf"}, {"id": "st-12", "title": "Singapore factory output rises on AI demand", "source": "ST", "date": "28 Jul 2026", "tags": ["Technology & AI", "Finance & Markets", "Southeast Asia"], "summary": "Singapore's June manufacturing output rose 7.2 per cent year on year, driven by electronics, precision engineering and transport engineering, but below the 9.3 per cent forecast in a Bloomberg poll. Excluding biomedical, output grew 9.6 per cent, per Economic Development Board data on July 27. Electronics led with 21.3 per cent growth on AI-related demand, lifting infocomms and consumer electronics 32.1 per cent and semiconductors 21.1 per cent. Precision engineering grew 14.9 per cent and transport engineering 4.6 per cent. Chemicals fell 11.7 per cent and biomedical 11.4 per cent. DBS economist Chua Han Teng said hyperscaler investments will sustain demand, though chemicals headwinds from Middle East feedstock disruptions are likely to persist into the third quarter.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20ST/Singapore%20factory%20output%20rises%20on%20AI%20demand.pdf"}, {"id": "st-13", "title": "Singapore, Australia sign pacts on essential, defence goods", "source": "ST", "date": "28 Jul 2026", "tags": ["Trade", "Defence", "Energy"], "summary": "Singapore and Australia signed two supply chain resilience pacts on July 27 to ensure unrestricted flow of essential goods and defence supplies, including a legally binding addition to their free trade agreement barring export restrictions on diesel and liquefied natural gas. The deals were inked at the 15th Singapore-Australia Joint Ministerial Committee in Adelaide. Defence Minister Chan Chun Sing cited deep mutual trust, while Foreign Minister Vivian Balakrishnan noted a more fractured world where supply chain resilience cannot be assumed. Australian Deputy PM Richard Marles called the energy partnership \"profoundly important\" amid recent energy shocks. Trade Minister Tan See Leng said the Middle East hostilities sped up the months-long negotiations covering petroleum oils and natural gas.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20ST/Singapore,%20Australia%20sign%20pacts%20on%20essential,%20defence%20goods.pdf"}, {"id": "st-14", "title": "Syria President says his country seeks security deal with Israel", "source": "ST", "date": "28 Jul 2026", "tags": ["Geopolitics", "Defence"], "summary": "Syrian President Ahmed al-Sharaa said in a July 26 Al Jazeera interview that Syria seeks a security agreement with Israel that could pave the way for comprehensive peace without compromising Syria's claim to the Golan Heights, captured by Israel in 1967 and annexed in 1981. Sharaa said Syria was rallying countries to pressure Israel toward a balanced policy, adding \"We are avoiding getting into confrontations.\" After Bashar al-Assad fell in December 2024, Israeli troops seized strategic Syrian territory and have since launched strikes. On July 26 Israeli forces shelled Syria, destroying an electrical transformer. UN chief Antonio Guterres visited Syria, calling for respect for its sovereignty. Sharaa said his government was not considering military intervention in Lebanon.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20ST/Syria%20President%20says%20his%20country%20seeks%20security%20deal%20with%20Israel.pdf"}, {"id": "st-15", "title": "Trump's latest tariff salvos land at the worst possible moment", "source": "ST", "date": "28 Jul 2026", "tags": ["Trade", "Finance & Markets", "Politics"], "summary": "Commentator Vikram Khanna argues Trump's July 23 tariffs compound a global polycrisis of renewed oil shock, rising food prices and big-tech valuation concerns, threatening higher inflation and market turmoil. It marks a third attempt to impose sweeping duties after the Supreme Court invalidated \"Liberation Day\" tariffs and Section 122 expired July 24. Washington used Section 301 to hit 60 partners over alleged forced-labour enforcement failures. Singapore was assessed at the higher 12.5 per cent rate alongside China, India, Brazil, Australia and Saudi Arabia, though semiconductors and pharmaceuticals are carved out. Khanna calls the action against Singapore capricious and the justification thin, but notes Section 301 duties are harder to unwind. US consumers will ultimately pay most.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20ST/Trump's%20latest%20tariff%20salvos%20land%20at%20the%20worst%20possible%20moment.pdf"}, {"id": "st-16", "title": "Ukraine wants prototype of European missile defence system by mid-2027, official says", "source": "ST", "date": "28 Jul 2026", "tags": ["Defence", "Geopolitics"], "summary": "Ukraine wants a prototype of a European anti-ballistic system code-named Freyja ready within the first half of 2027, said Davyd Aloian, deputy secretary of Ukraine's National Security and Defence Council. Leaders from 10 European countries, including President Volodymyr Zelensky, and around a dozen defence manufacturers launched the anti-ballistic coalition at a Paris summit. Freyja aims to be a lower-cost, open-architecture alternative to the US Patriot, on which Ukraine chronically depends amid low stocks and political volatility. Russia has intensified ballistic strikes on Kyiv and Odesa. Participating firms include Eurosam, Leonardo, Thales, Saab and Ukraine's Fire Point, the lead industrial partner. Aloian said the coalition \"should be practical rather than political.\"", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20ST/Ukraine%20wants%20prototype%20of%20European%20missile%20defence%20system%20by%20mid-2027,%20official%20says.pdf"}, {"id": "bt-01", "title": "AI demand to support growth in Asean+3 region amid Middle East headwinds: Amro", "source": "BT", "date": "28 Jul 2026", "tags": ["Southeast Asia", "Technology & AI", "Finance & Markets"], "summary": "AI-related demand, robust household spending and a weaker-than-expected drag from the Middle East conflict should lift Asean+3 growth to 4.1 per cent in 2026, Amro said in a quarterly report, up from its 4 per cent June forecast. The grouping covers 10 Asean nations plus China, Japan and South Korea. Headline inflation is now seen at 1.6 per cent, down from 1.8. Principal economist Allen Ng said the region sits at the centre of AI production, accounting for about half of global AI-related trade. The AI boom drove nearly two-thirds of a 20 per cent rise in first-quarter export growth. Chief economist He Dong said the boost stays uneven; only Malaysia, Singapore, Thailand and Vietnam saw upgrades.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20BT/AI%20demand%20to%20support%20growth%20in%20Asean3%20region%20amid%20Middle%20East%20headwinds%20Amro.pdf"}, {"id": "bt-02", "title": "Can Washington treat its allies like adversaries - and still keep them?", "source": "BT", "date": "28 Jul 2026", "tags": ["Trade", "Geopolitics", "Politics"], "summary": "Trump's tariff campaign has entered a more entrenched phase. On Jul 24, the US imposed fresh 10 to 12.5 per cent duties on 60 trading partners, including allies Canada, the UK and India, after the temporary global tariff expired. With the original \"Liberation Day\" tariffs struck down in February 2026, the administration pivoted to Section 232, 301 and 338 authorities and labour and human-rights justifications for greater legal durability. Washington let the USMCA lapse into a wind-down and hit Ottawa with a 50 per cent hike. Supporters call tariffs leverage; critics warn the approach corrodes alliances, pushing partners to hedge. Canada struck a \"strategic partnership\" with China in January 2026. Economists note tariffs act as a tax on domestic consumers.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20BT/Can%20Washington%20treat%20its%20allies%20like%20adversaries%20-%20and%20still%20keep%20them.pdf"}, {"id": "bt-03", "title": "China's building crash helps ease the Hormuz pain", "source": "BT", "date": "28 Jul 2026", "tags": ["Energy", "Finance & Markets", "Geopolitics"], "summary": "China's collapsing construction sector has cut diesel demand sharply, helping absorb the Middle East supply shock. Refineries produced just 12.9 million tonnes of diesel in June, the smallest figure since 2010 outside Covid dips, while asphalt fell to roughly 2012 lows. Both fuels are closely tied to construction: diesel powers excavators and mixers, asphalt seals roads. New housing starts are at their lowest since 2002; only 131 million square metres of floor space were added in peak season, a sixth of the rate five years earlier. Total output fell about 2.5 million barrels a day between March and June, with nearly 900,000 barrels from diesel cutbacks. Battery lorries and a shift to petrochemicals also softened demand. Diesel prices rose about 50 per cent in March.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20BT/China's%20building%20crash%20helps%20ease%20the%20Hormuz%20pain.pdf"}, {"id": "bt-04", "title": "Chipmaker CXMT vaults to top of China's valuation with 466% surge in Shanghai debut", "source": "BT", "date": "28 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Shares of CXMT Corp soared 466 per cent on their Shanghai debut on Jul 27, following Asia's biggest IPO this year, making the chipmaker China's most valuable listed company. The stock ended at 49 yuan versus its 8.66 yuan sale price, lifting market capitalisation to 3.3 trillion yuan (US$487.3 billion) and overtaking ICBC. CXMT is central to Beijing's push for a self-sufficient chip industry amid US curbs. It raised 57.9 billion yuan, the biggest mainland semiconductor offering on record, surpassing SMIC's 2020 sale. Only 6.73 per cent of capital was freely tradable, magnifying swings. Analysts flagged bubble risks; one hedge fund manager said the stock \"smells of speculation.\" The rally valued CXMT at nearly half of US rival Micron.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20BT/Chipmaker%20CXMT%20vaults%20to%20top%20of%20China's%20valuation%20with%20466%20surge%20in%20Shanghai%20debut.pdf"}, {"id": "bt-05", "title": "From Thucydides to Trump: three traps the world should avoid", "source": "BT", "date": "28 Jul 2026", "tags": ["Geopolitics", "Politics"], "summary": "The gravest threat to the international order may be the power that built it growing ambivalent about the system, an essay argues, calling this the \"Trump Trap.\" The dynamic is visible in the US-Iran stand-off at the Strait of Hormuz, where Washington questions why it should bear the burden of safeguarding passage. At their May Beijing summit, Xi Jinping warned of the Thucydides Trap, in which a rising power alarms the incumbent; Joseph Nye cited the Kindleberger Trap of leadership vacuums. Yet the US remains the unrivalled military, financial and technological power, while China embraces the order selectively. Trump, who told the G7 \"I am the boss,\" personifies rather than causes the trap, reflecting decades of fiscal and debt pressures.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20BT/From%20Thucydides%20to%20Trump%20three%20traps%20the%20world%20should%20avoid.pdf"}, {"id": "bt-06", "title": "How Singapore can orchestrate global supply chains in a fractured world", "source": "BT", "date": "28 Jul 2026", "tags": ["Southeast Asia", "Trade", "Geopolitics"], "summary": "Geopolitical uncertainties, including Trump's just-announced sweeping new tariffs, are prompting companies to diversify their sourcing, manufacturing and logistics networks, this commentary argues. As a result, global supply chains are becoming increasingly dependent on alternative trade routes and multimodal transportation options. In this context, the private member's motion by the Transport Government Parliamentary Committee, and the government's Jul 7 announcement of an S$800 million investment in transport infrastructure and connectivity, are timely. The piece frames the Republic's transport strategy as anchoring its role as a trusted connectivity hub, positioning Singapore to orchestrate global supply chains amid fragmentation. The article as supplied is truncated beyond this opening framing, leaving the detailed recommendations behind a paywall.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20BT/How%20Singapore%20can%20orchestrate%20global%20supply%20chains%20in%20a%20fractured%20world.pdf"}, {"id": "bt-07", "title": "Iran conflict has hit inflation more than growth; MAS says any growth drag will be outweighed by AI boost", "source": "BT", "date": "28 Jul 2026", "tags": ["Finance & Markets", "Southeast Asia", "Energy"], "summary": "Middle East developments have primarily affected Singapore's inflation rather than growth, the Monetary Authority of Singapore said in its latest macroeconomic review on Jul 27. Any re-escalation poses upside inflation risk but is unlikely to worsen the growth drag, which would be outweighed by strong AI demand. Core inflation, which rose in Q2, should stay elevated before easing in H2 2027; MAS kept its forecast range unchanged. The review followed a very slight steepening of the Singdollar policy band. Oil-related industries contracted about 11 per cent on year in Q2, offset by technology-related strength, with global chip sales up 113 per cent year on year. Singapore is playing its role as a regional oil redistribution hub, with re-exports to Malaysia and Indonesia rising.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20BT/Iran%20conflict%20has%20hit%20inflation%20more%20than%20growth%20MAS%20says%20any%20growth%20drag%20will%20be%20outweighed%20by%20AI%20boost.pdf"}, {"id": "bt-08", "title": "Mind the gap opening up as HDB resale market slows while million-dollar sales spike", "source": "BT", "date": "28 Jul 2026", "tags": ["Society", "Finance & Markets", "Southeast Asia"], "summary": "HDB resale flat prices fell in the second quarter, with the Resale Price Index moderating 0.3 per cent quarter on quarter after a 0.1 per cent Q1 decline, as more BTO supply eased demand. Prices have still climbed 54 per cent since Q4 2019. But the premier segment strengthened: transactions of resale flats costing S$1 million or more reached 491 in Q2, up 19.5 per cent quarter on quarter and 18.3 per cent year on year, per ERA Singapore, making up 7.7 per cent of deals. Toa Payoh, Queenstown and Bukit Merah led. High-earning couples exceeding income ceilings, wealthy PRs and affluent retirees drive demand for well-located resale flats. The commentary warns of inequality and negative wealth effects as the market splits.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20BT/Mind%20the%20gap%20opening%20up%20as%20HDB%20resale%20market%20slows%20while%20million-dollar%20sales%20spike.pdf"}, {"id": "bt-09", "title": "Singapore, HK workers less optimistic than regional peers about AI impact on jobs: report", "source": "BT", "date": "28 Jul 2026", "tags": ["Technology & AI", "Society"], "summary": "Professionals in Singapore and Hong Kong are less optimistic than regional peers about AI's impact on their jobs, a Robert Walters survey found. While 89 per cent in Singapore and 91 per cent in Hong Kong use AI at work, only 67 and 66 per cent respectively believe it will affect careers positively, placing the two financial hubs at the bottom of optimism rankings, behind mainland China (88), Vietnam (83), Japan (80) and Taiwan (79). Top concerns include job displacement from automation, bias and skill obsolescence. The survey covered nearly 5,000 professionals across 10 Asian markets. Employers said AI most affects process-driven functions like administration, IT and finance, and increasingly value human judgment, critical thinking and adaptability, creating hybrid roles such as AI product managers.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20BT/Singapore,%20HK%20workers%20less%20optimistic%20than%20regional%20peers%20about%20AI%20impact%20on%20jobs%20report.pdf"}, {"id": "bt-10", "title": "Why copper is becoming Asia's next AI bottleneck", "source": "BT", "date": "28 Jul 2026", "tags": ["Technology & AI", "Energy", "Finance & Markets"], "summary": "Copper price volatility is hitting Asia-Pacific data centre developers harder than global peers, because the region's relatively inefficient power grids require larger amounts of the metal for infrastructure. Soaring copper prices are unlikely to derail the expansion of AI-driven data centres, analysts say, but they warn that tightening supplies could lengthen procurement times and delay new capacity coming online. Alexander Kheder, a technology, media and telecommunications analyst at research firm BMI, noted that China produces around 60 per cent of the world's refined copper, and said North-east Asia's greater exposure to copper price volatility relative to other regions is structural rather than cyclical. The article as supplied is truncated beyond this opening analysis, leaving further detail behind a paywall.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20BT/Why%20copper%20is%20becoming%20Asia's%20next%20AI%20bottleneck.pdf"}, {"id": "bt-11", "title": "Why wages and productivity look set to diverge further", "source": "BT", "date": "28 Jul 2026", "tags": ["Finance & Markets", "Technology & AI", "Society"], "summary": "Productivity growth is what matters most in the long run, but in the US, Europe and Japan pay growth has decoupled from it, this commentary argues. In the US, wages and productivity were tightly linked from 1947 until around 1970, when pay began falling behind; the gap has since widened. Labour productivity is now more than five times its 1947 level, while real hourly compensation is only about three times greater. Explanations include different inflation deflators, rising inequality, weaker worker bargaining power against \"superstar\" firms, and labour's falling share of GDP versus capital. Insofar as AI represents capital-biased technological change that substitutes rather than complements workers, the pay-productivity gulf will widen further, though economists like Erik Brynjolfsson debate the outcome.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20BT/Why%20wages%20and%20productivity%20look%20set%20to%20diverge%20further.pdf"}, {"id": "bt-12", "title": "Will he or won't he? Fed chief Warsh could spring big surprise by raising rates this week", "source": "BT", "date": "28 Jul 2026", "tags": ["Finance & Markets", "Energy", "Politics"], "summary": "The US Federal Reserve could spring a surprise by raising rates at Wednesday's meeting, some analysts say, though most do not expect it. In his second meeting since taking over in May, chairman Kevin Warsh could lift rates to 3.75-4 per cent from 3.5-3.75, largely because oil futures have neared US$100 a barrel as the US-Iran war escalates and Hormuz stays blocked. Fed funds futures now imply roughly 30 per cent odds of a July hike, up from near zero. Bank of America expects a hold but a close call, seeing the first hike in September. Trump's renewed tariffs add pressure. The 30-year Treasury yield has topped 5 per cent, and South Korea's rate hike preceded a Kospi slump exceeding a quarter.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20BT/Will%20he%20or%20won't%20he%20Fed%20chief%20Warsh%20could%20spring%20big%20surprise%20by%20raising%20rates%20this%20week.pdf"}, {"id": "scmp-01", "title": "A tale of two markets: Wall Street cheers record highs while Beijing deflates bubbles", "source": "SCMP", "date": "28 Jul 2026", "tags": ["Finance & Markets", "Geopolitics", "Politics"], "summary": "As US indices hit July records, Chinese investors are rushing into S&P 500 exposure via QDII funds, leaving Beijing to choose between its cautious script or engineering a rival rally. Analysts say China's A-share market, built to fund corporate balance sheets rather than reward shareholders, has delivered stagnant returns despite decades of economic growth. Regulators intervene countercyclically to cool leveraged surges, scarred by crashes in 2007 and 2015. Foreign holdings sit at just 4 per cent of A-share value, versus far higher shares in Japan, Korea and Taiwan. Xiao Geng urges tolerating \"good bubbles\" that fund innovation, arguing that is \"the secret of American innovation.\" Xi Jinping's \"financial superpower\" vision hinges on deepening capital markets.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20SCMP/A%20tale%20of%20two%20markets%20Wall%20Street%20cheers%20record%20highs%20while%20Beijing%20deflates%20bubbles.pdf"}, {"id": "scmp-02", "title": "China condemns US over new Section 301 tariffs - but holds off on retaliation", "source": "SCMP", "date": "28 Jul 2026", "tags": ["Trade", "Geopolitics", "Technology & AI"], "summary": "China's Ministry of Commerce condemned Washington's latest 12.5 per cent duty as \"a textbook act of unilateralism and protectionism,\" but signalled it will hold off retaliating, noting the levy stays within the 20 per cent ceiling promised in earlier talks. The US imposed fresh 10 to 12.5 per cent tariffs on 60 trading partners, including the EU, Japan and South Korea, following a Section 301 forced-labour investigation. A separate probe into excess industrial capacity covers 16 economies. Beijing also rejected US claims that Chinese firms \"distilled\" American AI models, calling them baseless. White House adviser Michael Kratsios alleged Moonshot AI trained Kimi K3 by distilling Anthropic's Claude, offering no evidence and sparking researcher debate over feasibility.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20SCMP/China%20condemns%20US%20over%20new%20Section%20301%20tariffs%20%E2%80%93%20but%20holds%20off%20on%20retaliation.pdf"}, {"id": "scmp-03", "title": "China's localised data centre push drives AI ambitions amid overbuilding concerns", "source": "SCMP", "date": "28 Jul 2026", "tags": ["Technology & AI", "Energy"], "summary": "A nationwide scramble for data centres is underway in China, with towns and counties often outbidding major cities for the AI backbone facilities. Shatian in Dongguan plans a 100 billion yuan (US$14.7 billion), 9,000-acre computing park by 2030, while Jiashan county, Yangzhou and Ulanqab are building hyperscale sites backed by Alibaba, Tencent and China Telecom. Unlike the US, where states such as New York and Virginia curb permits over grid and emissions concerns, Chinese regional officials embrace the buildout. Researcher Tang Dajie warned of \"irrational\" investments driven by local tenure targets, but said building in low-cost western regions makes sense under the \"east data, west computing\" policy. Cheaper infrastructure could hand China a competitive edge.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20SCMP/China%E2%80%99s%20localised%20data%20centre%20push%20drives%20AI%20ambitions%20amid%20overbuilding%20concerns.pdf"}, {"id": "scmp-04", "title": "China's 'K-shaped' economy is divided not just by sector, but geography", "source": "SCMP", "date": "28 Jul 2026", "tags": ["Finance & Markets", "Technology & AI", "Politics"], "summary": "China's K-shaped divide between booming hi-tech industries and a stagnant consumer sector is now mirrored geographically, first-half provincial data shows. Zhejiang, home to Alibaba, DeepSeek and Unitree, led with 5.7 per cent growth to nearly 4.8 trillion yuan, beating the 4.7 per cent national rate. Anhui, Shandong, Shanghai and Jiangsu also outperformed on hi-tech manufacturing and exports. Regions reliant on tourism, mining or heavy industry lagged: Hainan grew just 2 per cent, Yunnan and rust-belt Liaoning 2.5 per cent. Economists cite Beijing's campaign against overcapacity in steel, coal and property. Peking University's Su Jian expects divergence to widen; Nomura says the gap will force faster fiscal reforms to rebuild local tax bases.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20SCMP/China%E2%80%99s%20%E2%80%98K-shaped%E2%80%99%20economy%20is%20divided%20not%20just%20by%20sector,%20but%20geography.pdf"}, {"id": "scmp-05", "title": "Fortune roller-coaster: as Elon Musk loses US$130b, Chinese chip and AI founders gain", "source": "SCMP", "date": "28 Jul 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Elon Musk called himself a \"(former) trillionaire\" after losing about US$130 billion in five trading days, as Tesla shares tumbled 18 per cent and SpaceX hit its post-IPO low. Meanwhile Chinese tech founders gained: ChangXin Memory Technologies (CXMT) soared 466 per cent on its Shanghai debut, valuing it at 3.28 trillion yuan and lifting executives' fortunes, with chairman Zhu Yiming holding stock worth nearly 80 billion yuan. Zhipu founder Tang Jie is worth about US$4.6 billion, and MiniMax's Yan Junjue roughly HK$18.2 billion after Hong Kong listings. Analysts noted much is volatile paper wealth. Liu Shengjun said tech magnates \"create huge societal wealth,\" contrasting them with property tycoons like Hui Ka-yan.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20SCMP/Fortune%20roller-coaster%20as%20Elon%20Musk%20loses%20US%24130b,%20Chinese%20chip%20and%20AI%20founders%20gain.pdf"}, {"id": "scmp-06", "title": "France and Spain race to curb wildfires before new heatwave arrives", "source": "SCMP", "date": "28 Jul 2026", "tags": ["Environment", "Society"], "summary": "Firefighters exploited a brief window of milder weather to subdue massive wildfires threatening Bordeaux and sites across Spain, racing another heatwave due later in the week. France has evacuated about 220,000 people, including tourists, while roughly 100,000 in Spain were told to flee or shelter. PM Sebastien Lecornu called it an \"unprecedented fire season,\" with area burned already surpassing 2022's record; 80 firefighters were injured near Bordeaux. In Spain, the Avila blaze is the largest in recent history, and crews near Castellon faced exploding Civil War-era ordnance. Pedro Sanchez blamed a \"climate emergency\" fuelling fiercer \"sixth-generation\" fires. Turkey, Italy, Greece, Portugal and Switzerland sent aircraft and crews to help.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20SCMP/France%20and%20Spain%20race%20to%20curb%20wildfires%20before%20new%20heatwave%20arrives.pdf"}, {"id": "scmp-07", "title": "From Moonshot to Enflame: how Tencent is betting big on China's AI champions", "source": "SCMP", "date": "28 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Tencent has assembled a sprawling AI portfolio spanning model makers and chip designers. It was an early backer of Moonshot AI, whose Kimi K3 sparked a fresh \"DeepSeek moment\" and which is nearing a US$30 billion valuation ahead of a Hong Kong IPO. Tencent joined DeepSeek's US$7 billion Series A, reportedly contributing 10 billion yuan, and is moving to become the largest external shareholder in Manus operator Butterfly Effect. Its early stakes in Zhipu and MiniMax rallied over 1,000 per cent and 130 per cent post-listing. Tencent is the largest outside shareholder and primary client of AI chip start-up Enflame, which supplied 84 per cent of 2025 revenue, and holds stakes in photonics chipmaker Lightelligence.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20SCMP/From%20Moonshot%20to%20Enflame%20how%20Tencent%20is%20betting%20big%20on%20China%E2%80%99s%20AI%20champions.pdf"}, {"id": "scmp-08", "title": "Hong Kong banks in early stages of preparing for quantum computing threats, HKMA says", "source": "SCMP", "date": "28 Jul 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Hong Kong's banking sector remains early in preparing for cybersecurity risks from quantum computing, the Hong Kong Monetary Authority said as it unveiled a new benchmark. Its first Quantum Preparedness Index scored the industry 2.3 out of 10, with the regulator targeting full readiness by 2030. The survey found 68 per cent of banks had begun raising awareness, planning or piloting projects, while 32 per cent had taken no steps and about half lacked a formal road map for adopting post-quantum cryptography. Quantum computers could eventually break widely used encryption. To help, the HKMA will partner with HKUST to build a PQC toolkit and hold workshops, part of its 2026 Fintech Promotion Blueprint.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20SCMP/Hong%20Kong%20banks%20in%20early%20stages%20of%20preparing%20for%20quantum%20computing%20threats,%20HKMA%20says.pdf"}, {"id": "scmp-09", "title": "Hong Kong set for stronger storms and wetter winter this year as El Nino intensifies", "source": "SCMP", "date": "28 Jul 2026", "tags": ["Environment", "Society"], "summary": "Hong Kong should brace for stronger storms and a warmer, wetter winter as the current El Nino is likely to intensify into a super event, green group Friends of the Earth (HK) and a leading meteorologist warned. Rising sea temperatures will feed typhoons more moisture and energy, potentially turning expected tropical cyclones into super typhoons. The group cautioned that heatwaves, intense downpours, higher sea levels and landslides pose growing risks, citing HKU research that heat kills about 300 people yearly. Former Observatory director Shun Chi-ming said a super El Nino could form between October and December, driving global temperatures to record highs in 2026 and 2027. NOAA puts the super-threshold chance at 81 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20SCMP/Hong%20Kong%20set%20for%20stronger%20storms%20and%20wetter%20winter%20this%20year%20as%20El%20Nino%20intensifies.pdf"}, {"id": "scmp-10", "title": "Iran halts strikes as Trump gives space to talks", "source": "SCMP", "date": "28 Jul 2026", "tags": ["Geopolitics", "Defence", "Energy"], "summary": "Iran and the US held their fire on Monday, giving Gulf shipping and oil markets a respite, as Trump's UN envoy said the president was \"giving talks some space.\" Tehran said it halted retaliatory attacks; ambassador Mike Waltz said forces remained \"locked and loaded\" but Trump would allow room for negotiation. The US had struck Iran for 13 consecutive nights in the almost five-month war before three quiet nights. Brent crude plunged 8 per cent to around US$89 a barrel, easing inflation fears and lifting equities. American media suggested the pause may reflect strained Patriot interceptor stockpiles. Netanyahu, due at the White House Tuesday, is expected to press Trump to keep pressure on Iran's nuclear programme.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20SCMP/Iran%20halts%20strikes%20as%20Trump%20gives%20space%20to%20talks.pdf"}, {"id": "scmp-11", "title": "Is Kim Yo-jong's rebuke a sign North Korea is ditching Asean diplomacy?", "source": "SCMP", "date": "28 Jul 2026", "tags": ["Geopolitics", "Southeast Asia", "Defence"], "summary": "A rare rebuke of Asean by Kim Yo-jong, sister of North Korean ruler Kim Jong-un, signals the bloc's waning relevance to the nuclear-armed state, analysts say. She condemned Asean's call for denuclearisation as having \"distorted the essence of the situation in the Korean peninsula,\" made at the Asean Regional Forum in the Philippines, which North Korea skipped for a second straight year. Analysts including RSIS's Sarah Teo said Pyongyang has treated denuclearisation as \"no longer up for negotiation\" since enshrining nuclear force in its constitution in 2023. Ratih Indraswari warned the criticism could limit Pyongyang's multilateral engagement, though bilateral ties should endure. It is unclear whether North Korea will attend when Singapore chairs Asean next year.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20SCMP/Is%20Kim%20Yo-jong%E2%80%99s%20rebuke%20a%20sign%20North%20Korea%20is%20ditching%20Asean%20diplomacy.pdf"}, {"id": "scmp-12", "title": "Israel to allow international force into Gaza under Trump ceasefire plan", "source": "SCMP", "date": "28 Jul 2026", "tags": ["Geopolitics", "Defence"], "summary": "Israel will permit a multinational security force into Gaza as proposed under Trump's ceasefire plan, an Israeli official said Sunday, after Netanyahu's security cabinet approved the legal framework. The International Stabilisation Force would include 200 members from \"friendly countries such as Uganda and Morocco,\" deploying in areas outside Israeli control, with each contingent requiring separate approval. Netanyahu was due in Washington to meet Trump on Tuesday. Trump's stalled peace plan envisions surging aid, Palestinian technocrat administration, Hamas disarmament and Israeli withdrawal, overseen by a \"Board of Peace.\" Israel controls an estimated 64 per cent of Gaza and plans to expand to 70 per cent; Hamas has refused to disarm. Board envoy Nickolay Mladenov welcomed the decision.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20SCMP/Israel%20to%20allow%20international%20force%20into%20Gaza%20under%20Trump%20ceasefire%20plan.pdf"}, {"id": "scmp-13", "title": "Profits in China's chipmaking sector soar 2,500% in first half amid AI boom", "source": "SCMP", "date": "28 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "China's major chip manufacturers saw first-half 2026 profits skyrocket 2,579.5 per cent, fuelled by unprecedented AI and computing demand, National Bureau of Statistics data showed. The NBS credited accelerating AI integration for generating massive computing-power demand, which also lifted the broader electronics industry's profits 97 per cent. Overall industrial profits at major enterprises rose 18.7 per cent to 4 trillion yuan, a stark reversal from a 1.8 per cent decline a year earlier before the global data centre buildout. China's integrated circuit output grew 23 per cent to nearly 280 billion units, over 1.5 billion chips daily. Longsys projected a 600-fold profit surge, GigaDevice roughly 1,099 per cent, and AI chipmaker Hygon up to 52.3 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20SCMP/Profits%20in%20China%E2%80%99s%20chipmaking%20sector%20soar%202,500%25%20in%20first%20half%20amid%20AI%20boom.pdf"}, {"id": "scmp-14", "title": "Singapore-based investors now the top non-local buyers of Hong Kong office assets", "source": "SCMP", "date": "28 Jul 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Singapore-based investors have become the largest non-local buyers of Hong Kong commercial property, drawn by steep price corrections in distressed office assets, according to Colliers. In the April-June quarter, non-local and mainland investment totalled HK$5.46 billion, of which Singaporean buyers contributed HK$3.37 billion, or 62 per cent, unseating mainland Chinese investors who had led the prior quarter. Colliers' Thomas Chak said office prices have fallen up to 50 per cent, making quality assets attractive at a discount. Notable deals included DBS Bank buying space at The Center for about HK$2.62 billion and Wee Hur acquiring One Bedford Place. Central's Grade-A office rents rose 7.3 per cent in the first half, the biggest six-month gain in 15 years.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20SCMP/Singapore-based%20investors%20now%20the%20top%20non-local%20buyers%20of%20Hong%20Kong%20office%20assets.pdf"}, {"id": "scmp-15", "title": "The former military chief aiming to unseat Netanyahu in Israel", "source": "SCMP", "date": "28 Jul 2026", "tags": ["Politics", "Defence", "Geopolitics"], "summary": "Former military chief Gadi Eisenkot has emerged as the principal challenger to Benjamin Netanyahu ahead of Israel's October 27 election, widely seen as a referendum on the premier's leadership after the October 7, 2023 attacks. A Channel 12 poll put Eisenkot's new Yashar party at 23 Knesset seats to Likud's 22, with 43 per cent naming him most suitable prime minister. Israel's military chief from 2015 to 2019 and architect of the \"Dahiya Doctrine,\" Eisenkot promises a state inquiry into the 2023 attack, a new security doctrine and universal national service extending conscription to ultra-Orthodox Jews and Arabs. The son of Moroccan immigrants who lost his son in Gaza, his understated style appeals to centrist voters seeking to defeat Netanyahu.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20SCMP/The%20former%20military%20chief%20aiming%20to%20unseat%20Netanyahu%20in%20Israel.pdf"}, {"id": "scmp-16", "title": "Trump administration urges Supreme Court to allow order targeting mail-in voting", "source": "SCMP", "date": "28 Jul 2026", "tags": ["Politics"], "summary": "The Trump administration asked the Supreme Court on Monday to clear the way for an executive order that could dramatically reshape mail-in voting before November's midterms. The Justice Department sought to halt lower-court rulings blocking the changes in nearly half the country. Trump's March order directs agencies to build a \"state citizenship list\" and deliver mail ballots only to those on it, with ballots carrying bar codes and federal funding withheld from non-compliant states. Democratic officials in 23 states and DC sued, arguing the Constitution gives states and Congress, not the president, authority over election rules. Solicitor General D. John Sauer called the injunction \"indefensible.\" Non-citizen voting is rare; a response to the appeal is due August 3.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20SCMP/Trump%20administration%20urges%20Supreme%20Court%20to%20allow%20order%20targeting%20mail-in%20voting.pdf"}, {"id": "scmp-17", "title": "Trump, tariffs and ties with China at stake in Brazilian presidential race", "source": "SCMP", "date": "28 Jul 2026", "tags": ["Geopolitics", "Politics", "Trade"], "summary": "China is closely watching Brazil's October election, where Beijing-friendly incumbent Lula da Silva runs neck-and-neck with pro-Washington Senator Flavio Bolsonaro, son of jailed ex-president Jair Bolsonaro. Days after the US added a 12.5 per cent Section 301 tariff, pushing Brazil's cumulative duty to 37.5 per cent, Xi Jinping told Lula that Beijing would support Brazil in \"safeguarding its own sovereignty.\" Lula called the levies \"unfair\" and a \"strategic mistake.\" Analysts warn a Bolsonaro win could bring \"automatic alignment\" with Washington, though pragmatic China ties would likely endure given trade in soybeans and beef. A Datafolha poll shows Lula leading 48 to 43 per cent in a run-off. Bolsonaro wants the US to replace China as Brazil's top trading partner.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20SCMP/Trump,%20tariffs%20and%20ties%20with%20China%20at%20stake%20in%20Brazilian%20presidential%20race.pdf"}, {"id": "scmp-18", "title": "US congressional group plans annual visits to China after trade trip", "source": "SCMP", "date": "28 Jul 2026", "tags": ["Geopolitics", "Trade"], "summary": "The US-China Economic and Security Review Commission (USCC) returned from a fact-finding trip to Beijing, Shanghai and Hangzhou, its first since 2019, with commissioners pledging to make such visits annual. Vice Chair Mike Kuiken said the panel is committed to returning \"at least annually\" to keep its analysis current. The independent advisory body, which reports to Congress on trade and security, met US diplomats, Chinese officials, think tanks and businesses, discussing AI, biotechnology and economic security, though it could not visit some technology companies it requested. Beijing often views the USCC as unfriendly given its critical annual reports; the Chinese Embassy welcomed the visit. Chair Randy Schriver said honest disagreement is more useful than politeness.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20SCMP/US%20congressional%20group%20plans%20annual%20visits%20to%20China%20after%20trade%20trip.pdf"}, {"id": "scmp-19", "title": "What CXMT must do to grow global memory market share and build on its surge: analysts", "source": "SCMP", "date": "28 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "ChangXin Memory Technologies (CXMT) shares could more than double from Monday's close as it expands its global DRAM market share to 18 per cent by 2028, Nomura said, setting a 116 yuan target. The chipmaker surged 466 per cent to 49 yuan on debut, reaching a 3.28 trillion yuan (US$484.6 billion) market cap that tops Intel's. Nomura sees monthly wafer capacity rising from 280,000 to 550,000 by end-2028, aided by AI demand and tight inventories. But CXMT lags Samsung, SK Hynix and Micron, generates no revenue from high-bandwidth memory, and trails leaders by about five years. Roughly 40 per cent of its equipment is domestic, exposing it to any tightening of US-led export restrictions on advanced lithography.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/28%20Jul%202026/28%20Jul%20SCMP/What%20CXMT%20must%20do%20to%20grow%20global%20memory%20market%20share%20and%20build%20on%20its%20surge%20analysts.pdf"}]}};</script>
