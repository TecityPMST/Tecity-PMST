ovacs, Dreame, Xiaomi and Narwal held 68 per cent of the global robot-vacuum market in 2025, with Roborock leading at 24 per cent. Roborock's overseas sales jumped 63 per cent and Ecovacs' US sales surged 110 per cent last year. China exported nearly US$600 million of robots in June, roughly 8 per cent US-bound.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20SCMP/China%E2%80%99s%20smart-vacuum%20giants%20swept%20up%20in%20US%20robot%20ban,%20hitting%20top%20options%20for%20Americans.pdf"}, {"id": "scmp-09", "title": "Chinese shipbuilders secure new vessel orders as Beijing pushes for high-margin shift", "source": "SCMP", "date": "31 Jul 2026", "tags": ["Trade", "Finance & Markets"], "summary": "Chinese shipbuilders have secured a string of new large-vessel orders from domestic and international buyers, extending strong first-half momentum as Beijing pushes the industry up the value chain. Hengli Heavy Industry won contracts for six very large ammonia carriers from three international owners within a week, following its June launch of the world's first 93,000-cubic-metre VLAC built on a slipway. Waigaoqiao Shipbuilding secured a 5.28 billion yuan order for 10 bulk carriers from Cosco Shipping Development. China's first-half new orders jumped 173.1 per cent to 121.06 million dwt, accounting for 82.3 per cent of global orders, with some yards booked through 2029-30. The NDRC targets the sector for higher-end upgrading over 2026-30.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20SCMP/Chinese%20shipbuilders%20secure%20new%20vessel%20orders%20as%20Beijing%20pushes%20for%20high-margin%20shift.pdf"}, {"id": "scmp-10", "title": "Could US subterranean warfare be a future threat to China's military defences?", "source": "SCMP", "date": "31 Jul 2026", "tags": ["Defence", "Technology & AI"], "summary": "Chinese think tanks have warned that the United States could be developing underground warfare capabilities that threaten China's national security. Anduril founder Palmer Luckey has promoted a \"subterrene\" - a vehicle able to move through the Earth's crust like a submarine underwater. The Guodong Think Tank said such technology could bypass China's mountainous borders to reach the hinterland via tunnels, undermining its reliance on geographic depth and early-warning satellites and radars that cannot detect deep tunnelling. It urged a national underground security strategy, geological surveys and detection investment. The US Army issued subterranean warfare doctrine in 2019; West Point's John Spencer argues the underground shields forces from surveillance and precision strikes, favouring defenders over attackers.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20SCMP/Could%20US%20subterranean%20warfare%20be%20a%20future%20threat%20to%20China%E2%80%99s%20military%20defences.pdf"}, {"id": "scmp-11", "title": "Foreign buying of US homes falls 14% as Chinese remain top spenders despite state curbs", "source": "SCMP", "date": "31 Jul 2026", "tags": ["Finance & Markets", "Society"], "summary": "Foreign purchases of US homes fell 14 per cent year on year to 67,100 properties between April 2025 and March 2026, the second-lowest level since tracking began in 2009, the National Association of Realtors reported. Chinese buyers slipped to third by volume behind Canada and Mexico, but remained first in dollar terms at US$7.6 billion, implying roughly US$1 million average purchases concentrated in California. Chief economist Lawrence Yun said the drop mirrored falling international visitor numbers, with a weaker dollar failing to lift activity. Florida was the top destination but has restricted non-citizen Chinese buyers; a new Texas law effective September bars purchases by individuals from China, Russia, Iran and North Korea. Total foreign purchases reached US$45.3 billion.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20SCMP/Foreign%20buying%20of%20US%20homes%20falls%2014%25%20as%20Chinese%20remain%20top%20spenders%20despite%20state%20curbs.pdf"}, {"id": "scmp-12", "title": "Russia strikes Ukrainian cities in major attack, Poland's airspace violated", "source": "SCMP", "date": "31 Jul 2026", "tags": ["Defence", "Geopolitics"], "summary": "Russia pounded Ukraine with more than 70 missiles and about 280 drones overnight, killing at least nine people, President Volodymyr Zelensky said, decrying air-defence shortages and urging allied help. Kyiv and the western Lviv region on the Polish border were the main targets. Poland, an EU and Nato member, scrambled fighter jets, and Ukraine said a Russian cruise missile crossed into Polish airspace, where a crater and debris were found. Ukrainian air defences downed 55 missiles and 265 drones, but only one of nine ballistic missiles; the US-made Patriot is the sole system able to intercept them and is in chronically short supply. Six people, including three children, died in Dnipropetrovsk. Ukrainian drones struck Russian retailer Wildberries warehouses.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20SCMP/Russia%20strikes%20Ukrainian%20cities%20in%20major%20attack,%20Poland%E2%80%99s%20airspace%20violated.pdf"}, {"id": "scmp-13", "title": "Russia used North Korean missile in deadly strike on Ukraine village, Zelensky says", "source": "SCMP", "date": "31 Jul 2026", "tags": ["Defence", "Geopolitics"], "summary": "Russia used a North Korean missile in a strike that killed five members of one family in the village of Radushne near Kryvyi Rih, President Volodymyr Zelensky said - the first such weapon fired in nearly a year, suggesting Moscow has fresh stocks. The strike came during an overnight barrage that killed at least nine as Ukraine grapples with acute air-defence shortages. A military source said radars tracked two missiles characteristic of North Korean KN-23 or KN-24 short-range ballistic missiles, which carry larger warheads and longer range than Russia's Iskander but are less accurate; only US Patriot systems can intercept them. Russia began firing North Korean missiles in late 2023. Pyongyang has also sent troops and artillery shells.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20SCMP/Russia%20used%20North%20Korean%20missile%20in%20deadly%20strike%20on%20Ukraine%20village,%20Zelensky%20says%20(2).pdf"}, {"id": "scmp-14", "title": "The PLA at 99: how China's military went from ragtag rifles to world-class force", "source": "SCMP", "date": "31 Jul 2026", "tags": ["Defence", "Geopolitics"], "summary": "Marking the PLA's 99th anniversary on August 1, one year before its 2027 centenary, this feature traces China's military evolution from ill-equipped revolutionaries to a hi-tech force. Founded in the 1927 Nanchang uprising, the Red Army relied on Mao's guerrilla doctrines, \"millet plus rifles\" and political commissars. After the Korean war it pursued Soviet-aided mechanisation, then the \"two bombs, one satellite\" nuclear programme after the Sino-Soviet split. The 1991 Gulf war exposed technological inferiority, prompting a 1993 strategy shift and, under Xi Jinping, sweeping 2015-17 reforms creating theatre commands and new space, cyber and logistics branches. Analysts credit world-class hardware like the J-20 and Type 055, but say becoming a world-class military remains an ongoing process.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20SCMP/The%20PLA%20at%2099%20how%20China%E2%80%99s%20military%20went%20from%20ragtag%20rifles%20to%20world-class%20force.pdf"}, {"id": "scmp-15", "title": "Trading hub ambitions see Hong Kong's gold imports hit 11-year high in June", "source": "SCMP", "date": "31 Jul 2026", "tags": ["Finance & Markets", "Trade"], "summary": "Hong Kong's gross gold imports crossed 150 tonnes in June for the first time in over a decade, reaching 150.48 tonnes - a nearly 29 per cent month-on-month surge and the highest since late 2014, official data showed. Analysts attribute the jump to renewed investor appetite after a price correction, a stronger yuan and the city's ambition to become a premier international precious-metals trading hub. Hong Kong is launching a gold clearing and settlement system with 11 initial participants and aims to lift storage capacity above 2,000 tonnes within three years. Local gold jewellery demand rose 15 per cent, bucking a global decline, while mainland China's bar and coin sales fell 7 per cent to 107 tonnes.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20SCMP/Trading%20hub%20ambitions%20see%20Hong%20Kong%E2%80%99s%20gold%20imports%20hit%2011-year%20high%20in%20June.pdf"}, {"id": "scmp-16", "title": "Trump weighs US$100,000 fee for foreign students to work in US after graduation", "source": "SCMP", "date": "31 Jul 2026", "tags": ["Politics", "Society"], "summary": "The Trump administration is weighing a US$100,000 charge for international students to stay and work in the US after graduating, a person familiar said, a potentially devastating blow for visa holders already squeezed by immigration crackdowns. A White House official said no policy change was imminent but did not deny it was under consideration. The fee would target Optional Practical Training, a postgraduate extension that officials say enables visa fraud and overstays; nearly 300,000 students were on OPT last fall, about a quarter of the foreign-student population. It follows a Homeland Security move limiting student stays to four years and echoes a similar US$100,000 H-1B fee that a federal judge ruled illegal.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20SCMP/Trump%20weighs%20US%24100,000%20fee%20for%20foreign%20students%20to%20work%20in%20US%20after%20graduation.pdf"}, {"id": "scmp-17", "title": "US government map of Africa gets every country wrong at global conference", "source": "SCMP", "date": "31 Jul 2026", "tags": ["Politics", "Technology & AI"], "summary": "A US State Department map mislabelled every African country during a presentation at the Aids 2026 conference in Rio de Janeiro, prompting attendees to screenshot and post it online. A Reuters analysis found the image carried an AI watermark indicating it was made with OpenAI tools, which said it was investigating. The map showed Nigeria landlocked in the Sahara, relocated Mozambique to the Horn of Africa and placed Ivory Coast on the wrong side of the continent. The State Department took \"full responsibility,\" blaming a team member who hastily changed the slide deck. Speaker Jeff Graham oversees PEPFAR. The department called conference discussions substantive despite the error, as the US scales back HIV prevention and surveillance spending.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20SCMP/US%20government%20map%20of%20Africa%20gets%20every%20country%20wrong%20at%20global%20conference.pdf"}, {"id": "scmp-18", "title": "US-led drills edge Japan and South Korea closer on defence", "source": "SCMP", "date": "31 Jul 2026", "tags": ["Defence", "Geopolitics"], "summary": "Key command roles played by Japan and South Korea in this year's US-led Rim of the Pacific exercise have fuelled speculation the neighbours could deepen defence cooperation despite historical tensions. Rimpac, the world's largest maritime drill, involves 30 nations and over 30,000 troops off Hawaii; South Korean Rear Admiral In-ho Kim commanded the maritime component and Japan's Takuo Kobayashi served as task-force vice-commander. Analysts said the senior roles signal both can plan operationally together and act as regional security providers, but history caps how far ties go. Seoul remains cautious on a logistics-sharing pact, and President Lee Jae Myung ruled out partnership until Tokyo resolves historical grievances. Experts said US involvement remains crucial as a go-between amid the shared North Korean threat.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20SCMP/US-led%20drills%20edge%20Japan%20and%20South%20Korea%20closer%20on%20defence.pdf"}, {"id": "scmp-19", "title": "US-listed Chinese stocks benefit as Fed policy haze drives rotation amid AI slump", "source": "SCMP", "date": "31 Jul 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "US-listed Chinese stocks are emerging as a shelter for global investors as confusion over the Federal Reserve's policy path drives diversification away from US equities and bonds amid a stumbling AI trade. The Nasdaq Golden Dragon China Index rose 1.7 per cent since the Fed's July meeting, while the Nasdaq-100 fell 2.1 per cent, after the central bank kept rates unchanged despite above-target inflation. New Fed chairman Kevin Warsh abandoned policy guidance and the dot-plot, adding uncertainty. Analysts call Chinese ADRs defensive, uncrowded bets; the Golden Dragon index gained 7.4 per cent in July versus a 10 per cent Nasdaq-100 drop. Hong Kong tech also rallied. Banks split over whether the Fed will hike or cut. Alibaba owns the SCMP.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20SCMP/US-listed%20Chinese%20stocks%20benefit%20as%20Fed%20policy%20haze%20drives%20rotation%20amid%20AI%20slump.pdf"}, {"id": "scmp-20", "title": "Unitree to launch IPO next week as US-China robotics rivalry intensifies", "source": "SCMP", "date": "31 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Unitree Robotics will launch its Shanghai initial public offering next week, selling 40.45 million shares, or 10 per cent of enlarged capital, as Chinese robotics start-ups race to go public amid intense rivalry with the US. The Hangzhou firm begins book-building on August 5, sets its offer price the next day, with results on August 14. Founder Wang Xingxing and related parties will retain 31.29 per cent of shares and 65.31 per cent of voting rights. Unitree booked 1.7 billion yuan revenue and 591 million yuan adjusted profit last year, unusual profitability in a cash-burning sector. The listing follows a US ban on new foreign-made robots. Peers AgiBot, Leju and Deep Robotics are also pursuing listings.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20SCMP/Unitree%20to%20launch%20IPO%20next%20week%20as%20US-China%20robotics%20rivalry%20intensifies.pdf"}, {"id": "scmp-21", "title": "'Quite disappointed'? Trump's mixed signals ahead of Xi's September trip", "source": "SCMP", "date": "31 Jul 2026", "tags": ["Geopolitics", "Politics"], "summary": "President Donald Trump sent mixed signals on China ahead of Xi Jinping's planned September 24 US visit, warning Xi against arming Iran while renewing attacks on Beijing. Reuters reported Iran was expected to receive 300 to 400 Chinese-made shoulder-fired air-defence missiles within weeks under a US$60 million-70 million deal; Beijing rejected the claim as \"untrue and not factual.\" Trump said he would find it surprising, recalling Xi promised not to partake and warning he would be \"quite disappointed.\" Separately, Trump accused former health official Anthony Fauci of shielding China over Covid-19's origins, repeating his Wuhan-lab theory. The exchange typifies Trump's approach of public attacks alongside open diplomacy; despite earlier election-hacking claims, no new sanctions have followed as summit planning continues.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20SCMP/%E2%80%98Quite%20disappointed%E2%80%99%20Trump%E2%80%99s%20mixed%20signals%20ahead%20of%20Xi%E2%80%99s%20September%20trip.pdf"}]}, "2026-08-03": {"date": "2026-08-03", "dayOfWeek": "Monday", "totalArticles": 68, "sourceCounts": {"WSJ": 21, "ST": 12, "BT": 11, "SCMP": 24}, "executiveDigest": "The AI boom entered its 'nasty' phase as economic realities bit: OpenAI lost its crown and slashed some model prices up to 80% amid Chinese rivals, and tech-stock whiplash raised risks for Singapore's real economy; the Iran war passed six months with Trump seen to have 'no good options', Big Oil reaped the chaos, and the US Treasury warned it might intervene in the dollar-yen rate as inflation squeezed Singapore's middle-income households.", "briefingCards": [{"title": "Lead story - AI boom enters its 'nasty' phase", "body": "SCMP declared the AI boom has entered its 'nasty' phase as economic realities set in - and the cracks showed: WSJ chronicled 'how OpenAI lost its AI crown', and OpenAI 'blinked' in its face-off with Chinese rivals, cutting prices on some models by up to 80%. BT warned that tech stocks' whiplash 'could signal risks for Singapore's real economy', and a sell-off at a flashy AI-focused US hedge fund was cast as a wake-up call for Chinese investors. Amazon and Apple earnings delivered late-month drama, WSJ floated taxing capital not labour to address AI job loss, and ST asked whether Singapore has an AI deployment plan to match its strategy."}, {"title": "Markets & finance", "body": "Currency and rates dominated: the US Treasury warned banks it might intervene in the dollar-yen rate, Japan signalled joint US action on the yen, and the Singdollar strengthened as the yen recovered. Eurozone inflation rose to 2.9% on energy, Fed officials called it a 'close call' whether rates are high enough, and new chair Warsh floated cutting the number of Fed meetings - even as WSJ warned a 'bear steepener' is 'no Goldilocks moment for stocks'. Singapore office REITs delivered a robust H1 on strong occupancy, Great Eastern rallied on activist interest, and CPF's glide-path portfolios drew 25 proposals."}, {"title": "Asia realignment", "body": "The US and allies put frictions aside to show China combined naval might, New Zealand sealed a trio of Pacific defence pacts to counter Beijing, and China warned Manila of a 'powerful' South China Sea 'toolbox'. China closed the satellite gap with the US in the space race, its offshore yuan hit a three-year high on policy-support signals, and an ex-PLA colonel said Beijing's goal is to stand 'neck and neck' with America. Washington moved to decouple its defence industry from Chinese rare earths, while US and EU curbs on Chinese power inverters risk upending green supply chains."}, {"title": "Energy & climate", "body": "The Iran war passed six months: Trump ordered a fresh attack even as he later signalled the US and Israel would 'hold off', Iran's foreign minister warned against any 'adventurous action', and evidence widened that Iran was behind hacks on US water supplies. Big Oil is 'reaping rewards from the chaos' - BP is selling its UK North Sea assets - while the war pushed companies to raise prices on beer, paint and fries. China faces deadly floods (Gansu's toll rising) and is betting quantum tech can banish blackouts, while analysts asked whether gold's bear market has run its course."}, {"title": "Technology & AI", "body": "Beyond OpenAI's price cuts, the contest intensified: a visit to China's AI labs revealed the battle for global soft power, Chinese police deployed an AI algorithm tracking bitcoin laundering with 90% accuracy, and the AIIB is exploring digital payments with a Hong Kong hub. The through-line is a shift from hype to hard economics - who actually profits. For Singapore, the open question ST posed is deployment: a clear national AI strategy now needs a plan to turn it into productivity, even as tech-stock volatility threatens to spill into the real economy."}, {"title": "Singapore & SEA focus", "body": "Inflation is squeezing Singapore's middle-income households, and ST spelled out 'the wider bargain' behind a lower US tariff for Singapore. Markets and property sent mixed signals: office REITs posted a robust H1 on higher rents, but loss-making private-home resale deals rose in Q2 as price growth moderated, and calls grew for clearer rules on condo 'VIP' sales. CPF's glide-path investment portfolios attracted 25 offeror proposals, Great Eastern rallied on activist involvement, and BT argued the Johor-Singapore RTS 'will make Singaporeans better off' - though it will take time."}], "keyMetrics": [{"value": "68", "label": "Articles curated today", "sub": "WSJ 21 · ST 12 · BT 11 · SCMP 24"}, {"value": "'Nasty' phase", "label": "AI boom reckoning", "sub": "OpenAI cuts prices up to 80%"}, {"value": "6 months", "label": "Iran war grinds on", "sub": "Trump 'no good options'"}, {"value": "Dollar-yen", "label": "US Treasury warns", "sub": "Intervention on the table"}, {"value": "2.9%", "label": "Eurozone inflation", "sub": "Rises on energy prices"}, {"value": "Robust H1", "label": "Singapore office REITs", "sub": "Strong occupancy, higher rents"}], "articles": [{"id": "wsj-01", "title": "A Simple Answer to AI Job Loss: Tax Capital, Not Labor", "source": "WSJ", "date": "3 Aug 2026", "tags": ["Technology & AI", "Politics", "Society"], "summary": "More than 1,000 economists, including 17 Nobel laureates, signed a petition warning of \"large scale job displacement\" from AI. Columnist Greg Ip argues one policy response is gaining traction: stop taxing capital more favorably than labor. In the U.S., the effective marginal rate on workers is 27%, versus 14% on new business assets and 4% on equipment. Economists including Harvard's Doug Elmendorf say higher capital taxes could protect labor demand as AI threatens jobs. A March survey saw 10 million jobs permanently lost by 2050 in a severe scenario. Other proposed responses, retraining, wage insurance, universal basic income and \"robot\" or compute taxes, each face limits.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20WSJ/A%20Simple%20Answer%20to%20AI%20Job%20Loss%20Tax%20Capital,%20Not%20Labor.pdf"}, {"id": "wsj-02", "title": "Amazon and Apple Deliver the Drama to Close a Turbulent Month", "source": "WSJ", "date": "3 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Diverging earnings from two tech giants pulled indexes in opposite directions Friday. Apple fell 7.4%, shedding a record $357.8 billion in market value after weak September-quarter guidance, its largest drop since 2014. Amazon surged 15% on accelerating cloud sales, its biggest-ever market-cap gain. The Nasdaq rose 1%, the S&P 500 gained 0.7% and the Dow added 0.5%. July proved turbulent, with AI cost worries, the Iran war and the Fed whipsawing markets. Treasury yields extended gains after three Fed officials explained dissents favoring rate hikes; the 10-year hit 4.743% and the 30-year reached a 19-year high of 5.274%. Amazon's results lifted battered AI hyperscaler bonds.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20WSJ/Amazon%20and%20Apple%20Deliver%20the%20Drama%20to%20Close%20a%20Turbulent%20Month.pdf"}, {"id": "wsj-03", "title": "BP to Sell U.K. North Sea Assets", "source": "WSJ", "date": "3 Aug 2026", "tags": ["Energy", "Finance & Markets"], "summary": "BP is putting its U.K. North Sea business up for sale, moving toward ending oil production in its home country after more than half a century. New CEO Meg O'Neill is reviewing the portfolio in a shake-up targeting $20 billion in asset sales by end-2027 to cut net debt and refocus on higher-returning oil and gas. The assets include five production hubs off Scotland and west of Shetland, employing about 1,100 people, and produced 117,000 barrels of oil equivalent daily in 2025, a fraction of BP's 2.3 million total. The mature basin faces higher profit taxes; Trump and industry groups urge the U.K. to relax drilling curbs. BP retains its U.K. headquarters and other operations.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20WSJ/BP%20to%20Sell%20U.K.%20North%20Sea%20Assets.pdf"}, {"id": "wsj-04", "title": "Big Oil Is Reaping Rewards From the Chaos in Energy Markets", "source": "WSJ", "date": "3 Aug 2026", "tags": ["Energy", "Finance & Markets", "Geopolitics"], "summary": "America's largest oil companies posted blockbuster quarters after the Iran war caused a historic market dislocation. ExxonMobil's profit more than doubled to $14.5 billion, its highest since 2022, while Chevron reported record earnings of $12.1 billion, up nearly fivefold. Both benefited from the prolonged closure of the Strait of Hormuz, which cut world fuel supplies and pushed U.S. oil to $112.95 a barrel and gasoline to four-year highs. Refining margins for jet fuel, diesel and gasoline hit records. Exxon delivered results despite losing roughly 10% of upstream production. Both firms rewarded investors: Exxon paid $9.4 billion in dividends and buybacks and cut net debt $7 billion; Chevron spent $6.6 billion.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20WSJ/Big%20Oil%20Is%20Reaping%20Rewards%20From%20the%20Chaos%20in%20Energy%20Markets.pdf"}, {"id": "wsj-05", "title": "Buyer Beware: Private Funds Come With Big Tax Bills", "source": "WSJ", "date": "3 Aug 2026", "tags": ["Finance & Markets", "Society"], "summary": "Columnist Jason Zweig warns that private funds, which advisers could push $2 trillion of client assets into over five years, almost certainly raise investors' taxes. John West of Flatrock Wealth Partners replicated an endowment-style portfolio of stocks, bonds and private assets: it returned 8.6% annually pretax over 10 years but only 6.6% after tax for upper-income investors. A simple basket, 60% stock-index ETFs and 40% muni bonds, matched pretax returns yet delivered 8% after tax. Private credit, hedge funds and private equity generate heavy short-term gains and payouts, while ETFs minimize taxes. Zweig notes advisers often place these funds in taxable accounts, and a 2025 endowment tax is already prompting some to reconsider.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20WSJ/Buyer%20Beware%20Private%20Funds%20Come%20With%20Big%20Tax%20Bills.pdf"}, {"id": "wsj-06", "title": "China Closes the Satellite Gap in Space Race With the U.S.", "source": "WSJ", "date": "3 Aug 2026", "tags": ["Geopolitics", "Defence", "Technology & AI"], "summary": "China is catching up fast with the U.S. as a space power, especially in satellites, giving Beijing the potential to impair rival networks and blunt U.S. military might. It has upgraded its GPS-rivaling navigation system and remote-sensing capabilities, ranking top in five of 11 categories in a 2024 CSIS report versus four for the U.S. China's military, which launched a space force in 2024, has more than 510 intelligence, surveillance and reconnaissance satellites tracking U.S. carriers and forces across the Pacific. The Pentagon warns this supports \"long-range kill chains.\" AI-analyzed imagery can identify even stealth aircraft. The State Department sanctioned startup MizarVision for posting analyses of U.S. deployments and accused Chinese firms of aiding Iran.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20WSJ/China%20Closes%20the%20Satellite%20Gap%20in%20Space%20Race%20With%20the%20U.S..pdf"}, {"id": "wsj-07", "title": "Eurozone Inflation Rises to 2.9% as Energy Prices Jump", "source": "WSJ", "date": "3 Aug 2026", "tags": ["Finance & Markets", "Energy"], "summary": "Eurozone annual inflation rose to 2.9% in July from 2.8% in June, further above the ECB's 2% target and slightly above forecasts. Energy inflation rebounded to 10% from 8.5% as renewed U.S.-Iran hostilities lifted oil prices and a German fuel tax cut lapsed. Services inflation ticked up to 3.3% and core inflation to 2.5%, with economists warning higher energy costs are beginning to pass through more broadly. The ECB held rates this month, and most investors expect a hike at September's meeting. President Christine Lagarde said the energy shock's full impact has yet to play out. The economy grew a faster-than-expected 0.4% in the second quarter, outpacing the U.S. Food inflation fell to 1.2%.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20WSJ/Eurozone%20Inflation%20Rises%20to%202.9%25%20as%20Energy%20Prices%20Jump.pdf"}, {"id": "wsj-08", "title": "Fed's Tom Barkin Says It's a 'Close Call' Whether Interest Rates Are High Enough", "source": "WSJ", "date": "3 Aug 2026", "tags": ["Finance & Markets", "Politics"], "summary": "Richmond Fed President Tom Barkin said it is \"a close call\" whether the Fed's rate setting is high enough to bring inflation down, and he was unsure whether he would have joined three regional presidents who voted this week for higher rates. The Fed held its benchmark at 3.5% to 3.75%, where it has been since December, at Chairman Kevin Warsh's second meeting. Inflation has defied forecasts, pressured by tariffs, the Iran war's energy shock and the AI build-out. Barkin, who doesn't vote until next year, said it \"does not feel like a tight labor market\" and that price increases are moving unevenly, with business-to-business firms passing along 3% to 4% while consumer-facing companies struggle. Inventory costs suggest more inflation ahead.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20WSJ/Fed%E2%80%99s%20Tom%20Barkin%20Says%20It%E2%80%99s%20a%20%E2%80%98Close%20Call%E2%80%99%20Whether%20Interest%20Rates%20Are%20High%20Enough%20-%20WSJ.pdf"}, {"id": "wsj-09", "title": "Health Insurance Coverage Falls for Millions, Straining Healthcare Economy", "source": "WSJ", "date": "3 Aug 2026", "tags": ["Society", "Politics", "Finance & Markets"], "summary": "Millions of Americans are going without health insurance after federal subsidies that kept Affordable Care Act premiums down expired at the start of the year, straining the healthcare economy. ACA enrollment fell about 2.6 million as of February, with the steepest drops in Ohio, Oklahoma and Arizona; nearly all are dropping coverage entirely. Hospital operators including Tenet, Universal Health, Community Health and HCA, hit by a $400 million second-quarter profit drag, cited rising costs from treating uninsured patients. Uninsured patients skip elective care but crowd emergency rooms, generating unpaid bills and bad debt. FMOL Health's monthly write-offs jumped 23%; Banner Health saw ER visits climb. Medicaid work requirements next year threaten a further 4.1 million losing coverage by 2027.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20WSJ/Health%20Insurance%20Coverage%20Falls%20for%20Millions,%20Straining%20Healthcare%20Economy.pdf"}, {"id": "wsj-10", "title": "How OpenAI Lost Its AI Crown-and the Fight to Win It Back", "source": "WSJ", "date": "3 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "OpenAI, which sparked the AI boom, has fallen behind rival Anthropic and is fighting for a comeback. ChatGPT's growth has slowed, Sam Altman's heir apparent Fidji Simo departed, and sales staff are locked in a costly battle for business customers. Anthropic's revenue growth and valuation, nearing $1 trillion, have surpassed OpenAI's, powered by coding tool Claude Code, and it is accelerating a fall IPO. Leaders misread the market by betting on consumer ChatGPT rather than developer tools. OpenAI has released coding-focused models, put Greg Brockman over its product lineup, struck an Amazon deal and hired a chief revenue officer. It may delay its IPO to next year. Its Codex enterprise pricing remains unsettled amid margin pressure.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20WSJ/How%20OpenAI%20Lost%20Its%20AI%20Crown-and%20the%20Fight%20to%20Win%20It%20Back.pdf"}, {"id": "wsj-11", "title": "Inside Trump's Unprecedented Fundraising Operation Run by Meredith O'Rourke, the 'Princess of Darkness'", "source": "WSJ", "date": "3 Aug 2026", "tags": ["Politics", "Finance & Markets"], "summary": "President Trump has taken personal control of an unprecedented fundraising operation, calling fundraiser Meredith O'Rourke nightly to review which companies and donors have paid. He often demands larger asks, from $5 million to $50 million, and supplies names, telling executives \"the boss wants this money.\" Trump has nicknamed O'Rourke the \"princess of darkness.\" No sitting president has raised such sums for pet projects; he has collected more than $800 million since returning to office, funding a White House ballroom, the Freedom 250 celebrations, his library and a super PAC. Chevron was asked for $50 million; Meta gave to multiple funds, including $22 million to the library after settling a lawsuit. Companies have grown attentive as Trump reshapes regulatory power.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20WSJ/Inside%20Trump%E2%80%99s%20Unprecedented%20Fundraising%20Operation%20Run%20by%20Meredith%20O%E2%80%99Rourke,%20the%20%E2%80%98Princess%20of%20Darkness%E2%80%99%20-%20WSJ.pdf"}, {"id": "wsj-12", "title": "Iran War Pushes Companies to Raise Prices on Beer, Paint, Fries and More", "source": "WSJ", "date": "3 Aug 2026", "tags": ["Finance & Markets", "Energy", "Geopolitics"], "summary": "The continuing closure of the Strait of Hormuz is hitting American wallets far beyond the pump, as companies raise prices on french fries, beer, paint and packaging to offset rising commodity and freight costs. Boston Beer, Sherwin-Williams, International Paper and Unilever have told investors of increases. Sherwin-Williams will raise prices 8% from September; its shares jumped over 8%. Investors have cheered the hikes, buoying consumer-staples and materials stocks even as data-center worries drag tech. But higher prices threaten a new inflation round that could complicate rates and shape autumn midterms. Benchmark U.S. crude traded near $85, up about 25% since the war began; gasoline averaged $4.11 versus $2.98 at the outset. The Fed held rates 9-3.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20WSJ/Iran%20War%20Pushes%20Companies%20to%20Raise%20Prices%20on%20Beer,%20Paint,%20Fries%20and%20More.pdf"}, {"id": "wsj-13", "title": "Latest Gaza Peace Plan Runs Up Against Reality", "source": "WSJ", "date": "3 Aug 2026", "tags": ["Geopolitics", "Politics"], "summary": "A day after Trump announced a breakthrough he predicted would see Hamas relinquish weapons and power in Gaza, Israel and Hamas appeared at odds over what was agreed and who should move first. Israel is deeply distrustful Hamas would disarm, setting up a potential clash with Prime Minister Netanyahu, who faces elections and demands genuine demilitarization before withdrawing troops. National security minister Itamar Ben-Gvir called the draft \"not acceptable to Israel.\" Hamas said Israel must halt attacks first and agreed only to relinquish heavy weapons, not light arms. The central dilemma remains sequencing. Trump's original 20-point plan, which paused fighting via an October ceasefire, envisioned phased progress. Israel now controls almost 70% of Gaza; about 80% of 2.1 million residents are displaced.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20WSJ/Latest%20Gaza%20Peace%20Plan%20Runs%20Up%20Against%20Reality.pdf"}, {"id": "wsj-14", "title": "New York Sues Kalshi After Talks to Rein In Prediction Market Break Down", "source": "WSJ", "date": "3 Aug 2026", "tags": ["Finance & Markets", "Politics"], "summary": "New York sued Kalshi, alleging the biggest U.S. prediction-market operator runs an illegal gambling operation, after weeks of talks over tax revenue and customer protections collapsed. Attorney General Letitia James wants the court to bar Kalshi without a gambling license and force it to forfeit gains, potentially $36 billion in penalties and disgorgement. Kalshi had proposed frameworks, including a 6% tax like North Carolina's, far below the 23% on traditional gambling, that would have raised $10 billion over five years. Kalshi argues states can't regulate a federally licensed exchange overseen by the CFTC, calling the suit \"political theater.\" CFTC chief Michael Selig, a Trump appointee, has also sued states. The suit targets sports-style bets on Kalshi's site.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20WSJ/New%20York%20Sues%20Kalshi%20After%20Talks%20to%20Rein%20In%20Prediction%20Market%20Break%20Down.pdf"}, {"id": "wsj-15", "title": "Rise of Bond E-Trading Underpins NYSE Owner's $6 Billion MarketAxess Deal", "source": "WSJ", "date": "3 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Intercontinental Exchange, owner of the New York Stock Exchange, is acquiring MarketAxess for $6 billion, betting bond trading will keep going electronic. Historically it has been harder to build electronic markets for bonds than stocks because a company may issue many bond series. Still, e-trading has grown: 49% of U.S. investment-grade bonds traded electronically last year, up from 20% a decade earlier, and high-yield rose to 32% from 6%. ICE, led by founder Jeffrey Sprecher, has a history of digitizing marketplaces, from futures exchanges to mortgage plumbing. Its biggest fixed-income business is data and analytics, and it hopes combining that with a trading platform makes it ubiquitous. MarketAxess has lagged, handling 35% of corporate-bond volume, down from 61% in 2020, as Tradeweb and Trumid gained.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20WSJ/Rise%20of%20Bond%20E-Trading%20Underpins%20NYSE%20Owner%E2%80%99s%20%246%20Billion%20MarketAxess%20Deal.pdf"}, {"id": "wsj-16", "title": "This 'Bear Steepener' Is No Goldilocks Moment for Stocks", "source": "WSJ", "date": "3 Aug 2026", "tags": ["Finance & Markets"], "summary": "Columnist Spencer Jakab warns that a \"bear steepener\" in Treasurys is no benign backdrop for stocks. Microsoft posted a record $450 billion single-day market-value gain, while Apple's results set to erase about $350 billion. The Fed held rates Wednesday, yet stocks sold off after Chair Kevin Warsh's press conference, and long-term yields hit a 19-year high. Steepening welcome in recoveries like 2003, 2009 and 2021 looks instead like 1966 and 1987, episodes of stagnation and crashes. Inflation has topped target for over five years with no job-market weakness, yet Warsh took a hands-off stance, saying markets are \"learning how to play ball.\" Rising U.S. debt, headed past $40 trillion, and multidecade-high real yields add to worries for bond and stock owners.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20WSJ/This%20%E2%80%98Bear%20Steepener%E2%80%99%20Is%20No%20Goldilocks%20Moment%20for%20Stocks.pdf"}, {"id": "wsj-17", "title": "Treasury Warns Banks It Might Intervene in Dollar-Yen Exchange Rate", "source": "WSJ", "date": "3 Aug 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "The U.S. Treasury told banks it might make currency trades Friday to support the Japanese yen and strengthen it against the dollar, delivered via the New York Fed. Some banks were told to ready trades exchanging yen for euros. The alert came amid speculation of a coordinated international effort, with Japanese authorities also intervening. The yen strengthened past 160 to the dollar from near 164. Given suspected Japanese intervention estimated at up to $70 billion and limited yen gains, analysts warn a coordinated effort risks failing and wasting credibility. Under Secretary Scott Bessent, Treasury has taken a more active role, doing a January rate check and October support for Argentina's peso. Bessent called the yen \"very undervalued\" and plans to meet the BOJ governor next month.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20WSJ/Treasury%20Warns%20Banks%20It%20Might%20Intervene%20in%20Dollar-Yen%20Exchange%20Rate.pdf"}, {"id": "wsj-18", "title": "Trump Orders Fresh Attack Against Iran as War Enters Sixth Month", "source": "WSJ", "date": "3 Aug 2026", "tags": ["Geopolitics", "Defence", "Politics"], "summary": "President Trump has ordered the military to launch a fresh attack on Iran that could begin as soon as this weekend and last a few days, U.S. officials said. He said he would resume heavy strikes to force the regime to negotiate, predicting it would eventually \"peter out.\" Trump authorized the plan at Camp David, though diplomatic progress could halt it. The threats contrasted with his earlier claim of \"very friendly negotiations\"; since then Iran attacked U.S. troops in Jordan, prompting a Wednesday retaliation. Trump has privately called the Iranians \"crazy\" and the interim deal meaningless. One potential target is Pickaxe Mountain, where Iran stashed centrifuges. As the war enters its sixth month, neither side is softening; dwindling munitions are cited as a risk.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20WSJ/Trump%20Orders%20Fresh%20Attack%20Against%20Iran%20as%20War%20Enters%20Sixth%20Month.pdf"}, {"id": "wsj-19", "title": "U.S., Allies Put Frictions Aside, Showing China Combined Naval Might", "source": "WSJ", "date": "3 Aug 2026", "tags": ["Defence", "Geopolitics", "Southeast Asia"], "summary": "At the \"Rim of the Pacific\" exercise ending Friday, dozens of warships docked at Pearl Harbor, led by carrier USS Theodore Roosevelt, in the world's largest maritime drill. U.S. allies turned out in record numbers, 30 nations and roughly 30,000 personnel over five weeks. Even as Trump lambastes allies and threatens to withdraw support, Pacific military cooperation is deepening in response to Chinese aggression and North Korea's nuclear expansion. Lacking a NATO-like Asian alliance, partners use multilateral drills; Japan and other allies took senior command roles, with just three of Rimpac's top posts American. Other exercises are also growing: Talisman Sabre, Cobra Gold, which added the U.S. Space Force, and Balikatan in the Philippines, which doubled to seven countries and 17,000 personnel.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20WSJ/U.S.,%20Allies%20Put%20Frictions%20Aside,%20Showing%20China%20Combined%20Naval%20Might.pdf"}, {"id": "wsj-20", "title": "Warsh Floats Cut in Number of Fed Rate-Setting Meetings", "source": "WSJ", "date": "3 Aug 2026", "tags": ["Finance & Markets", "Politics"], "summary": "Federal Reserve Chairman Kevin Warsh floated to colleagues the idea of the Federal Open Market Committee meeting less often, a substantial shift in operations. The FOMC currently meets in Washington eight times a year; a brief discussion centered on whether six meetings would bring benefits. The idea, presented for discussion rather than as a formal proposal, offers a window into the Fed Warsh is building, one that speaks less often and commands less market attention; he has already issued shorter statements. Any change faces practical constraints, since dates are published through January 2028 and futures contracts are set around them. Law requires at least four meetings yearly; the eight-meeting schedule dates to 1981. Warsh made a similar recommendation to the Bank of England in 2014.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20WSJ/Warsh%20Floats%20Cut%20in%20Number%20of%20Fed%20Rate-Setting%20Meetings.pdf"}, {"id": "wsj-21", "title": "We Live in 'a New World of Counterhistory'", "source": "WSJ", "date": "3 Aug 2026", "tags": ["Society", "Geopolitics"], "summary": "In a Weekend Interview, historian Simon Sebag Montefiore describes a \"huge crisis of Anglo Jewry\" since Oct. 7, with British Jews asking \"Where could we go?\" amid terrorist attacks, fortress-like synagogues and Hackney's move to end its twin-city ties with Haifa. A scion of Anglo-Jewish aristocracy descended from Sephardic and Mizrahi Jews, Montefiore has written sweeping histories including \"Jerusalem\" and \"The World.\" His new book, \"The Cauldron: The Making of the Modern Middle East,\" traces the region from 1900 to February 2026, when the Iran war began, spanning 19 countries from Morocco to Iran. He calls Gaza a semi-independent \"statelet,\" arguing Hamas ruled with ministries and 40,000 paramilitaries, and reflects on history's contested, contested narratives.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20WSJ/We%20Live%20in%20%E2%80%98a%20New%20World%20of%20Counterhistory%E2%80%99.pdf"}, {"id": "st-01", "title": "76% in Japan support upholding 3 non-nuclear principles: Poll", "source": "ST", "date": "3 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "A poll reported on Aug 2 by the Tokyo Shimbun found 76 per cent of people in Japan support upholding the country's three non-nuclear principles of not producing, possessing or allowing nuclear weapons on its territory, while 77 per cent oppose US nuclear sharing. Support for joining the Treaty on the Prohibition of Nuclear Weapons fell 5 points to 55 per cent. A combined 90 per cent opposed US military action against Iran and Venezuela. Some 63 per cent saw a strong or moderate chance nuclear weapons would be used within 10 years, down 9 points. The survey of 3,000 people aged 18 and over was conducted in June and July.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20ST/76%20in%20Japan%20support%20upholding%203%20non-nuclear%20principles%20Poll.pdf"}, {"id": "st-02", "title": "Condo VIP sales need clearer rules to ensure transparency", "source": "ST", "date": "3 Aug 2026", "tags": ["Society", "Finance & Markets"], "summary": "VIP sales at Singapore condominium launches face scrutiny after property agents reportedly bought up to 20 per cent of units at some projects before public bookings began. At Sim Lian's Emerald of Katong in November 2024, agents bought 173 of 846 units. Between September 2024 and October 2025, agents purchased 635 units through priority queues, The Business Times reported. The Council for Estate Agencies has engaged agencies over the practice. Developers defend early sales as helping gauge demand, fine-tune pricing and save commissions, but critics say regular buyers face reduced choice and possible conflicts of interest when agents marketing a project also buy units. Higher prices and greater awareness have sharpened concerns over fairness and disclosure.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20ST/Condo%20VIP%20sales%20need%20clearer%20rules%20to%20ensure%20transparency.pdf"}, {"id": "st-03", "title": "How are middle powers and small states surviving in this brave new world?", "source": "ST", "date": "3 Aug 2026", "tags": ["Geopolitics", "Trade"], "summary": "PM Lawrence Wong's July Cabinet reshuffle, which folded energy into an expanded Ministry of Energy, Trade and Industry, reflects a world where trade is leverage for geopolitical ends. Trump's return and \"America First\" policies have accelerated the decline of the rules-based multilateral order through punitive tariffs, while US-China rivalry drives fragmentation, protectionism and contested chokepoints. US-Israel attacks on Iran turned energy into a security issue. Small states and middle powers like Australia, the EU, India and Japan are diversifying through flexible coalitions such as the CPTPP and Ukraine's coalition of the willing. China's 2025 trade surplus hit US$1.19 trillion, straining Germany and prompting rebalancing, though experts warn informal groupings may weaken the UN and WTO.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20ST/How%20are%20middle%20powers%20and%20small%20states%20surviving%20in%20this%20brave%20new%20world.pdf"}, {"id": "st-04", "title": "Inflation's squeeze on middle-income households in Singapore", "source": "ST", "date": "3 Aug 2026", "tags": ["Society", "Finance & Markets"], "summary": "Inflation rose across all Singapore income groups in the first half of 2026, but middle-income earners felt the biggest squeeze. SingStat data on July 23 showed their inflation doubling to 1.8 per cent, or 2.2 per cent excluding owner-occupied rents, the highest bracket. Overall household inflation was 1.7 per cent, driven by food, cars, health insurance and petrol, partly cushioned by lower pre-school fees. The February Iran war disrupted supply chains, raising costs; F&B owner Jason Chua's ingredient bills rose $300 to $500 monthly. On July 29 the Government announced a $900 million support package atop April's $1 billion, including $300 more in CDC vouchers per household and utility rebates. Experts cited job uncertainty and lifestyle creep.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20ST/Inflation's%20squeeze%20on%20middle-income%20households%20in%20Singapore.pdf"}, {"id": "st-05", "title": "Japan to announce Tokyo, Washington took joint action on yen, sources say", "source": "ST", "date": "3 Aug 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "Japanese Finance Minister Satsuki Katayama will announce on Aug 3 that Tokyo and Washington took joint action in the currency market to arrest the yen's slide to 40-year lows, two government officials told Reuters. It would be the first joint yen intervention since 2011, following rounds of yen-buying to lift the currency from its weakest against the dollar since 1986. Japan bought yen on July 30, with BOJ data suggesting sales of up to US$58.97 billion. The BOJ held policy steady on July 31 while signalling a rate rise soon. Treasury Secretary Scott Bessent's notepad reportedly listed buying US$5-10 billion in yen. Analysts said Washington's concern over rising Treasury yields helped drive the cooperation.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20ST/Japan%20to%20announce%20Tokyo,%20Washington%20took%20joint%20action%20on%20yen,%20sources%20say.pdf"}, {"id": "st-06", "title": "Scope of hacks on US water supply widens as evidence points to Iran", "source": "ST", "date": "3 Aug 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "Cyberattacks on US water systems have spread to at least seven states and may be wider, officials warned, with evidence increasingly pointing to Iran. Minnesota and Michigan reported intrusions targeting computers that monitor water quality and pressure, though no supply was made unsafe. The FBI and EPA said in a July 30 advisory that since July 27 at least seven states reported incidents, some degrading operations. Officials said Iran had escalated cyberattacks since the US-Israel war began five months ago. President Trump downplayed the threat, saying \"I think Minnesota is behind it,\" a claim Governor Tim Walz rejected. Experts called direct effects on live US industrial control systems unprecedented; CISA urged unplugging vulnerable controllers.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20ST/Scope%20of%20hacks%20on%20US%20water%20supply%20widens%20as%20evidence%20points%20to%20Iran.pdf"}, {"id": "st-07", "title": "Signal from Johor and Negeri Sembilan: PH needs to change", "source": "ST", "date": "3 Aug 2026", "tags": ["Politics", "Southeast Asia"], "summary": "Prime Minister Anwar Ibrahim's Pakatan Harapan lost Negeri Sembilan on Aug 1 after two terms, following heavy defeats in Sabah and Johor, signalling eroding support. Analysts say PH can no longer explain away losses and must change its campaign and leaders. DAP, which won just four of 49 seats across three states, will hold a referendum on staying in Cabinet, while PKR faces pressure over Anwar's future. The UMNO-PAS Malay unity pact drove near-total vote transfers, winning UMNO 52 of 53 wards contested. Transport Minister Anthony Loke apologised after losing his seat; PKR's Amirudin Shari blamed \"extraordinary racial campaigning.\" A general election must be held within 18 months.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20ST/Signal%20from%20Johor%20and%20Negeri%20Sembilan%20PH%20needs%20to%20change.pdf"}, {"id": "st-08", "title": "Singapore has an AI strategy, but does it have a deployment plan?", "source": "ST", "date": "3 Aug 2026", "tags": ["Technology & AI", "Society"], "summary": "Singapore has ample AI strategies, funding and research, but the harder question is whether they change how firms and agencies actually work. A July visit to Beijing's Global Digital Economy Conference showed China shifting from impressive demonstrations to deploying AI inside factories, transport, healthcare and city management. A Manpower Ministry survey found 71.5 per cent of firms had not adopted AI, and only 3.8 per cent had integrated it into core processes. Singapore has committed over $1 billion to public AI research for 2025-2030 and aims to support 10,000 enterprises. The writers argue every project should specify which core process changes, and that Singapore's edge lies in making AI deployment trusted, auditable and interoperable across borders.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20ST/Singapore%20has%20an%20AI%20strategy,%20but%20does%20it%20have%20a%20deployment%20plan.pdf"}, {"id": "st-09", "title": "Singdollar strengthens, yen recovers: Markets this week", "source": "ST", "date": "3 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "The Monetary Authority of Singapore surprised markets on July 27 by allowing the Singdollar to appreciate at a slightly faster pace to curb inflation, its second tightening since April. Core inflation rose to 1.5 per cent in the second quarter amid surging fuel prices and higher import costs. MAS warned inflation could climb further if energy prices spike, while strong AI spending should support growth. The yen recovered against the Singdollar to 122.78 on Aug 2 after reported Japanese and US intervention. Sheng Siong said it may adjust prices ahead of the January 2027 Johor Bahru-Singapore RTS Link, which is projected to draw $1.05 billion more Singaporean spending across the Causeway.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20ST/Singdollar%20strengthens,%20yen%20recovers%20Markets%20this%20week.pdf"}, {"id": "st-10", "title": "The wider bargain for Singapore behind a lower US tariff", "source": "ST", "date": "3 Aug 2026", "tags": ["Trade", "Geopolitics"], "summary": "Effective July 24, Washington placed Singapore in a higher 12.5 per cent tariff tier, rather than 10 per cent, over policies on imports made with forced labour. Seventeen of 60 economies investigated, including Malaysia, Indonesia and India, secured the lower rate by banning such imports or signing an Agreement on Reciprocal Trade. Jordan signed an ART on July 21, committing to a ban within five years and alignment with US export controls, with provisions targeting China-linked firms. Analysts say such deals press partners to adopt US policy on China. MTI estimates the tariff hits about one-third of Singapore's domestic exports to the US; the article argues Singapore should engage Washington directly rather than accept wide-ranging commitments.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20ST/The%20wider%20bargain%20for%20Singapore%20behind%20a%20lower%20US%20tariff.pdf"}, {"id": "st-11", "title": "Trump says US, Israel to hold off on Iran strikes", "source": "ST", "date": "3 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "President Donald Trump said on Aug 1 that the US and Israel had agreed to hold off on new strikes on Iran, provided a deal to end the months-long conflict was reached quickly. He said he cancelled a planned attack after speaking with Saudi Crown Prince Mohammed bin Salman, and after Tehran spoke to Riyadh and mediators Pakistan and Turkey. Trump said any deal must include the \"immediate, complete and total\" reopening of the Strait of Hormuz and an end to Iran's nuclear threat. Iran's Mehr agency denied asking the US to refrain, calling it \"a new lie.\" The war began Feb 28; Iran controls Hormuz navigation, and renewed hostilities have pushed oil prices back up.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20ST/Trump%20says%20US,%20Israel%20to%20hold%20off%20on%20Iran%20strikes.pdf"}, {"id": "st-12", "title": "Why Taiwan's eastern islands are increasingly crucial for its defence", "source": "ST", "date": "3 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "Taiwan's outlying Green Island and Orchid Island, long deemed strategically marginal, are gaining defence significance amid escalating Chinese grey-zone pressure east of Taiwan. On July 16, Taiwan's Second Theatre Command held drills there for the first time in 30 years, rehearsing equipment transport and defensive positions. Since June, China has staged patrols and \"special maritime traffic law enforcement\" operations, and on June 7 the coast guard radioed merchant ships for crew details. Analysts warn the islands could become forward operating bases if captured and threaten wartime logistics corridors. Orchid Island sits at the Bashi Channel chokepoint linking the South China Sea to the Pacific, central to Taiwan's survivability and external lifelines during a crisis.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20ST/Why%20Taiwan's%20eastern%20islands%20are%20increasingly%20crucial%20for%20its%20defence.pdf"}, {"id": "bt-01", "title": "150 days into the Iran war, Trump seems to have no good options", "source": "BT", "date": "3 Aug 2026", "tags": ["Geopolitics", "Defence", "Energy"], "summary": "More than 150 days after the US-Iran conflict reignited despite a June memorandum of understanding, Trump faces three strategic options: escalation, status quo flare-ups, or a face-saving climbdown. With November's Congressional elections nearing, allies fear escalation or drift into 2026's second half. Hegseth sought an extra US$87.6 billion for defence, most for Iran operations, while a London meeting with the UK's Wes Streeting was postponed. Allies, still stung by Trump's insults, resist forming a diplomatic coalition. Iran's regime has proven surprisingly resilient, with hardliners entrenched after Mojtaba Khamenei's anointment as supreme leader. Analysts warn the Strait of Hormuz may not fully reopen this autumn, keeping oil prices volatile and damaging oil-reliant Asia.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20BT/150%20days%20into%20the%20Iran%20war,%20Trump%20seems%20to%20have%20no%20good%20options.pdf"}, {"id": "bt-02", "title": "BYD's July sales rise on strong exports, but meeting its annual target remains a challenge", "source": "BT", "date": "3 Aug 2026", "tags": ["Trade", "Technology & AI", "Environment"], "summary": "Chinese EV maker BYD's July sales rose 22 per cent year on year to about 420,000 vehicles, a third straight month of growth but still behind the pace needed to hit its annual target. After selling 1.8 million cars in H1, it must average roughly 530,000 monthly for the rest of 2026 to reach the lower end of its five million to five-and-a-half million goal. Exports, 43 per cent of the total, grew strongly across South America and Europe, while domestic demand stayed weak. New models include the Seal 6, a refreshed European Seal line and Japan's electric Racco kei car. Its Hungarian Szeged plant faces labour-abuse scrutiny, subsidy probes and delays to Q4 2026.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20BT/BYD's%20July%20sales%20rise%20on%20strong%20exports,%20but%20meeting%20its%20annual%20target%20remains%20a%20challenge.pdf"}, {"id": "bt-03", "title": "China's central bank pledges timely policy tool adjustment", "source": "BT", "date": "3 Aug 2026", "tags": ["Finance & Markets", "Politics"], "summary": "China's central bank pledged to adjust monetary policy tools in a timely manner and facilitate panda bond issuance, according to a statement on Sunday. The People's Bank of China will maintain an appropriately loose stance and ample liquidity, per a work meeting mapping the year's second half. It vowed to \"steadily promote the high-level opening of the financial market\", support debt-risk resolution for local government financing vehicles, help Shanghai on cross-border finance and consolidate Hong Kong's offshore yuan hub. The meeting, led by governor Pan Gongsheng, followed a Politburo call to accelerate fiscal spending. Q2 growth of 4.3 per cent was the slowest in over three years, missing the 4.5-to-5 per cent full-year target.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20BT/China's%20central%20bank%20pledges%20timely%20policy%20tool%20adjustment.pdf"}, {"id": "bt-04", "title": "Glide-path portfolios for CPF attract 25 proposals from interested offerors", "source": "BT", "date": "3 Aug 2026", "tags": ["Finance & Markets", "Society"], "summary": "The CPF Board's call for solutions providers for its planned glide-path portfolios drew 25 proposals by the Jul 24 deadline, signalling keen industry interest. The \"new investment scheme\", expected to launch in 2028, will automatically rebalance members from equities toward bonds as they near retirement age. Morningstar will evaluate submissions, with two to three providers likely chosen and announced in H1 2027. Offerors face a challenging all-in fee cap of 50 basis points, far below existing CPFIS caps. DBS, Endowus, AutoWealth (partnering Aberdeen and Lion Global), iFast and PhillipCapital are among participants, while UOB, OCBC and some large managers declined comment. US target-date strategies, comparable to the scheme, held US$4.8 trillion at end-2025.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20BT/Glide-path%20portfolios%20for%20CPF%20attract%2025%20proposals%20from%20interested%20offerors.pdf"}, {"id": "bt-05", "title": "Great Eastern's big rally - activist investors can be crucial part of market ecosystem", "source": "BT", "date": "3 Aug 2026", "tags": ["Finance & Markets", "Society"], "summary": "Great Eastern (GEH) shareholders who resisted OCBC's 2024 buyout attempt appear vindicated after strong results and a share surge. Q2 2026 profit jumped nearly 103 per cent to S$503.2 million, lifting H1 profit to S$849.5 million. Shares closed Friday at S$21.78, up 34.6 per cent since July began, giving a 150.5 per cent total return since OCBC's May 2024 offer and a S$20.6 billion market cap. Drivers include anticipated results, Allianz's HSBC Life Singapore purchase, and rotation into value stocks. GEH will pay a S$0.35 interim dividend. The columnist argues MAS and SGX should make responsible shareholder activism more culturally acceptable, noting minority investors can help unlock value amid Singapore's market revitalisation.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20BT/Great%20Eastern's%20big%20rally%20-%20activist%20investors%20can%20be%20crucial%20part%20of%20market%20ecosystem.pdf"}, {"id": "bt-06", "title": "Has gold's bear market run its course?", "source": "BT", "date": "3 Aug 2026", "tags": ["Finance & Markets"], "summary": "Gold has shed roughly 28 per cent from its Jan 29 all-time high near US$5,600 an ounce, trading around US$4,040 by Jul 30 and finding a floor at the US$4,000 psychological support. Through July it consolidated between US$3,959 and US$4,200. Though price sits below the 20-, 50- and 200-day EMAs, the Phillip Nova strategist sees two reversal signals: a Jul 22 trendline breakout that flipped resistance into support, and a bullish RSI divergence since June as selling momentum faded. Immediate resistance is US$4,200, then US$4,400; a 20-day EMA crossing above the 50-day would strengthen the bullish case. The bias holds while US$3,960 support holds; a break could send gold toward US$3,450.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20BT/Has%20gold's%20bear%20market%20run%20its%20course.pdf"}, {"id": "bt-07", "title": "Loss-making private home resale deals on the rise in Q2 as price growth moderates", "source": "BT", "date": "3 Aug 2026", "tags": ["Finance & Markets", "Society"], "summary": "Loss-making private home resales in Singapore hit a four-year high in Q2 2026 as price growth eased, Cushman & Wakefield data showed. Some 4.7 per cent of resale transactions were at a loss, up from 3.7 per cent, the highest proportion since Q2 2022, at 134 units. Most (64 per cent) were in the Core Central Region. The overall price index rose just 0.5 per cent, with non-landed prices dipping 0.1 per cent. The biggest loss by quantum was S$2.1 million on an Orchard Residences unit; The Scotts Tower saw multiple heavy losses. Research head Wong Xian Yang still expects prices to rise 2 to 4 per cent in 2026, keeping loss-making deals low.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20BT/Loss-making%20private%20home%20resale%20deals%20on%20the%20rise%20in%20Q2%20as%20price%20growth%20moderates.pdf"}, {"id": "bt-08", "title": "Singapore office Reits deliver robust H1 performance on strong occupancy and higher rents", "source": "BT", "date": "3 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Singapore office S-Reits posted robust first-half results on strong occupancy and rising rents even as borrowing costs fell. Suntec, Keppel and OUE Reits, exposed to CBD assets, reported strong distributable income growth, aided by tight supply, flight to quality and expansion from global AI players. Knight Frank pegged CBD occupancy at 95.3 per cent. Keppel Reit's net property income rose 13.1 per cent with a 12.8 per cent rental reversion, though DPU slipped 4 per cent on a larger unit base. Suntec's distributable income climbed 25.5 per cent and OUE's DPU jumped 28.6 per cent. Knight Frank projects rents rising 3 to 5 per cent in 2026. DBS prefers CICT, Keppel Reit and CapitaLand Ascendas Reit.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20BT/Singapore%20office%20Reits%20deliver%20robust%20H1%20performance%20on%20strong%20occupancy%20and%20higher%20rents.pdf"}, {"id": "bt-09", "title": "Sound the AIarm: Tech stocks' whiplash could signal risks for Singapore's real economy", "source": "BT", "date": "3 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "MAS managing director Chia Der Jiun and Fitch Ratings warned that the AI investment boom poses major medium-term uncertainty, with Fitch ranking an AI correction alongside Middle East tensions as a top credit risk. Days later, chip stocks lost over US$1 trillion in a three-day sell-off after a Shanghai firm began mass-producing lithography machines and Alphabet and Tesla flagged weak cash flow. Sentiment then flipped: Microsoft surged over 15 per cent, its best day since 2008, adding roughly US$450 billion, while Amazon's AWS grew 37 per cent. Singapore is directly exposed, with June electronics exports up 105 per cent. AEM, UMS and Frencken rebounded. Analysts call the swings a mid-cycle reset, not a broader collapse.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20BT/Sound%20the%20AIarm%20Tech%20stocks'%20whiplash%20could%20signal%20risks%20for%20Singapore's%20real%20economy.pdf"}, {"id": "bt-10", "title": "The RTS will make Singaporeans better off, but it will take time", "source": "BT", "date": "3 Aug 2026", "tags": ["Southeast Asia", "Society", "Trade"], "summary": "The Johor Bahru-Singapore Rapid Transit System (RTS) Link will let Singaporeans cross the Strait of Johor in minutes to shop cheaply, but a study projects a net S$290 million spending outflow, worrying retailers. The Asia Competitiveness Institute argues welfare should be judged by output and real incomes, not spending leakage. Its modelling finds the RTS could raise Singapore's GDP by about 1.8 per cent and lift Johor's population 2.3 per cent, enlarging the corridor market for Singapore's finance, logistics and services, with a modest 0.1 per cent real income gain per resident. Gains spread widely while costs concentrate on northern grocers and pharmacies. The authors urge helping exposed businesses adapt rather than subsidising home shopping.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20BT/The%20RTS%20will%20make%20Singaporeans%20better%20off,%20but%20it%20will%20take%20time.pdf"}, {"id": "bt-11", "title": "With higher-than-usual FX volatility, how do investors manage currency risk in portfolios?", "source": "BT", "date": "3 Aug 2026", "tags": ["Finance & Markets"], "summary": "Currencies have shown sharper-than-usual divergence over the past year, prompting investors to guard portfolios against swings. The US dollar slid to a multi-year low in late 2025 amid Fed cuts, hitting US$1.26 against the Singapore dollar, before surging to a one-year high by June. The yen erased gains to a 40-year low, while Malaysia's ringgit staged a historic recovery, gaining 7 per cent. Experts warn currency concentration can erase returns and urge diversification across currencies with different drivers. The Singapore dollar and Swiss franc are seen as resilient; the rupiah and yen more volatile. Options offer flexible hedging but carry costlier premiums. Bond investors typically hedge fully; equity investors hedge selectively or stay unhedged.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20BT/With%20higher-than-usual%20FX%20volatility,%20how%20do%20investors%20manage%20currency%20risk%20in%20portfolios.pdf"}, {"id": "scmp-01", "title": "AI boom enters its 'nasty' phase as economic realities set in", "source": "SCMP", "date": "3 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Artificial intelligence has entered a volatile \"nasty\" phase where economic reality constrains ambition and markets separate winners from losers, the article argues. Hyperscalers Amazon, Alphabet, Microsoft and Meta are set to spend nearly US$700 billion on capex in 2026, while US$4-8 trillion may flow into AI infrastructure over five years. AI firms now make up a record 45 per cent of the S&P 500's value. China's rivals, including Moonshot's Kimi K3, DeepSeek-V4 and Alibaba's Qwen, match US models at up to 90 per cent lower prices, undermining the thesis that ever-larger spending secures leadership. Investors now prize free cash flow and margins. Like the 1990s fibre-optic glut, infrastructure may outlast the bubble while creators struggle to profit.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20SCMP/AI%20boom%20enters%20its%20%E2%80%98nasty%E2%80%99%20phase%20as%20economic%20realities%20set%20in.pdf"}, {"id": "scmp-02", "title": "AIIB explores digital payments, eyes Hong Kong hub as it raises record funds", "source": "SCMP", "date": "3 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "The Asian Infrastructure Investment Bank is exploring tokenised payments and digital settlement systems while tapping Hong Kong's digital finance ecosystem, treasurer and acting CFO Domenico Nardelli told the Post. The Beijing-headquartered bank is targeting a record US$11 billion in fundraising this year, after US$10 billion in each of the past two, and plans to open a Hong Kong hub before year-end, its second outside mainland China after Abu Dhabi. Nardelli cited geopolitical tensions, elevated oil prices and distorted US dollar yield curves as key headwinds, prompting a dedicated facility for members hit by food and energy shocks from the Middle East conflict. By 2025 the AIIB had disbursed over US$38.4 billion across infrastructure sectors.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20SCMP/AIIB%20explores%20digital%20payments,%20eyes%20Hong%20Kong%20hub%20as%20it%20raises%20record%20funds.pdf"}, {"id": "scmp-03", "title": "Beijing warns Manila of 'powerful' South China Sea toolbox ready for 'head-on blow'", "source": "SCMP", "date": "3 Aug 2026", "tags": ["Geopolitics", "Defence", "Southeast Asia"], "summary": "China's military mouthpiece PLA Daily warned that Beijing has a \"rich and powerful\" toolkit against those who \"make waves\" in the South China Sea, following Manila's move to map its claim to disputed Scarborough Shoal. The warning came a day after the Chinese military held joint naval and air drills near the shoal, known as Huangyan Island in China. The article, under pen name Jun Sheng, called Manila's July 29 filing of its nautical chart with the UN a \"nonsense\" provocation and accused Philippine politicians of colluding with external forces. Other countermeasures included China Coast Guard exercises and nature-reserve regulations. Beijing's foreign ministry earlier denounced the delimitation as \"illegal, null and void.\" Tensions have escalated in recent weeks.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20SCMP/Beijing%20warns%20Manila%20of%20%E2%80%98powerful%E2%80%99%20South%20China%20Sea%20toolbox%20ready%20for%20%E2%80%98head-on%20blow%E2%80%99.pdf"}, {"id": "scmp-04", "title": "China floods: large parts of country remain on alert as Gansu province death toll rises", "source": "SCMP", "date": "3 Aug 2026", "tags": ["Society", "Environment"], "summary": "China raised the death toll from last week's flash floods in northwestern Gansu's Weiyuan county from 10 to 25, with 23 injured, as large parts of the country battle heavy rainfall and swollen rivers. The Ministry of Water Resources activated a level 4 flood response for Heilongjiang, where 19 rivers flooded and the Sandaohezi hit its highest levels since records began in 1958. Level 4 alerts also cover Shaanxi, Sichuan, Henan and Hubei. Authorities sent 11,000 relief items to Heilongjiang and Jilin, and are bracing for Typhoon Dolphin, which could make landfall within two weeks after Typhoon Noul forced nearly 900,000 evacuations in Guangdong. China is developing AI-powered ensemble weather forecasting to improve storm-track predictions.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20SCMP/China%20floods%20large%20parts%20of%20country%20remain%20on%20alert%20as%20Gansu%20province%20death%20toll%20rises.pdf"}, {"id": "scmp-05", "title": "China hopes to banish blackouts as quantum tech puts power grid in superposition", "source": "SCMP", "date": "3 Aug 2026", "tags": ["Technology & AI", "Energy"], "summary": "China will roll out quantum technology nationwide to boost power-grid reliability after a successful 18-month trial at a substation in Hefei, Anhui province, according to state-run People's Daily. Quantum sensors detect equipment defects, weak partial electrical discharges, and pinpoint fault locations in real time, while quantum encryption secures fibre-optic and 5G links. The facility used the Origin Wukong superconducting quantum computer to model grid operational states. A diamond-based precision measurement technology is estimated to cut electricity measurement errors by more than 500,000 kilowatt-hours per year. Researcher Tian Teng said quantum tech is a \"hard support\" for power supply, not a showpiece. Parts of China suffered blackouts in 2020-2022. Insights will inform demonstration projects at higher-level substations.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20SCMP/China%20hopes%20to%20banish%20blackouts%20as%20quantum%20tech%20puts%20power%20grid%20in%20superposition.pdf"}, {"id": "scmp-06", "title": "China sees flurry of commercial property deals as investors sniff out bargains", "source": "SCMP", "date": "3 Aug 2026", "tags": ["Finance & Markets", "Society"], "summary": "Commercial property transactions are surging in major Chinese cities as investors bet on a market rebound after years of price declines. In Shanghai, deal numbers jumped 77 per cent year on year in the first half of 2026, with total value up 18 per cent at 27.4 billion yuan (US$4.05 billion), CBRE data showed; half involved office assets. CBRE's Candice Wang said office prices had plunged 30-40 per cent from peaks, leav
