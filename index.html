<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tecity News Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#fbfbfa; --surface:#ffffff; --surface-2:#f6f6f4;
    --text:#16181d; --muted:#6c727e; --faint:#9aa0ab;
    --border:#ececec; --border-2:#e2e2e0; --ink:#16181d;
    --hover:#f4f4f2; --ring:rgba(20,23,28,.10);
    --shadow:0 1px 2px rgba(16,18,22,.04), 0 8px 24px rgba(16,18,22,.05);
    --shadow-sm:0 1px 2px rgba(16,18,22,.05);
    --wsj:#D85A30; --st:#1D9E75; --bt:#378ADD; --scmp:#D4537E;
    --maxw:1120px;
  }
  html[data-theme="dark"]{
    --bg:#0c0d10; --surface:#15171c; --surface-2:#1b1e25;
    --text:#eceef2; --muted:#9aa1ad; --faint:#6b7280;
    --border:#252830; --border-2:#2d313b; --ink:#eceef2;
    --hover:#1c1f26; --ring:rgba(255,255,255,.12);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-feature-settings:"cv02","cv03","cv04","ss01";
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    line-height:1.6;
  }
  ::selection{background:rgba(120,120,120,.18)}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 28px}
  .num{font-variant-numeric:tabular-nums}
  .eyebrow{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); font-weight:600}

  /* header */
  header.top{position:sticky; top:0; z-index:20; backdrop-filter:saturate(180%) blur(14px);
    background:color-mix(in srgb, var(--bg) 82%, transparent); border-bottom:1px solid var(--border)}
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 28px; max-width:var(--maxw); margin:0 auto}
  .brand{display:flex; flex-direction:column; gap:2px; min-width:0}
  .brand .title{font-size:16px; font-weight:600; letter-spacing:-.01em}
  .brand .meta{font-size:12.5px; color:var(--muted)}
  .controls{display:flex; align-items:center; gap:10px}
  select.date{appearance:none; font:inherit; font-size:13px; font-weight:500; color:var(--text);
    background:var(--surface); border:1px solid var(--border-2); border-radius:10px; padding:8px 32px 8px 12px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%239aa0ab' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat; background-position:right 10px center; cursor:pointer; transition:border-color .15s}
  select.date:hover{border-color:var(--ink)}
  .toggle{display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; cursor:pointer;
    background:var(--surface); border:1px solid var(--border-2); border-radius:10px; color:var(--muted); transition:.15s}
  .toggle:hover{color:var(--text); border-color:var(--ink)}
  .toggle svg{width:17px; height:17px}

  /* hero digest */
  .hero{padding:48px 0 14px}
  .hero .eyebrow{margin-bottom:16px}
  .digest{font-size:clamp(25px,3.6vw,37px); line-height:1.22; font-weight:400; letter-spacing:-.02em;
    max-width:none; color:var(--text)}
  .digest .lead{max-width:none}

  /* metrics */
  .metrics{display:grid; grid-template-columns:repeat(6,1fr); gap:14px; padding:30px 0 8px}
  .metric{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px 18px 16px; box-shadow:var(--shadow-sm); transition:.18s}
  .metric:hover{box-shadow:var(--shadow); transform:translateY(-2px)}
  .metric .v{font-size:27px; font-weight:600; letter-spacing:-.03em; line-height:1.05}
  .metric .l{font-size:12.5px; font-weight:500; margin-top:8px}
  .metric .s{font-size:11.5px; color:var(--muted); margin-top:3px; line-height:1.4}

  /* tabs */
  .tabs{display:flex; gap:26px; margin:34px 0 0; border-bottom:1px solid var(--border)}
  .tab{position:relative; cursor:pointer; padding:0 0 14px; font-size:14px; font-weight:500; color:var(--muted); transition:color .15s}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--text)}
  .tab.active::after{content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--ink); border-radius:2px}

  .section{padding:30px 0 0}
  .section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px}
  .section-head h2{margin:0; font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); font-weight:600}
  .section-head .hint{font-size:12.5px; color:var(--muted)}

  /* lead briefing card */
  .lead-card{background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:30px 32px; box-shadow:var(--shadow); margin-bottom:16px}
  .lead-card .k{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); font-weight:600; margin-bottom:12px}
  .lead-card h3{margin:0 0 12px; font-size:23px; font-weight:600; letter-spacing:-.02em; line-height:1.2}
  .lead-card p{margin:0; font-size:15.5px; color:var(--text); line-height:1.65; max-width:none; column-width:34ch; column-gap:48px; column-fill:balance}

  /* briefing grid */
  .cards{display:grid; grid-template-columns:repeat(2,1fr); gap:16px}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:24px 26px; box-shadow:var(--shadow-sm); transition:.18s}
  .card:hover{box-shadow:var(--shadow); transform:translateY(-2px)}
  .card h3{margin:0 0 10px; font-size:16.5px; font-weight:600; letter-spacing:-.01em; line-height:1.3}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.62}

  /* coverage / bars */
  .split{display:grid; grid-template-columns:1.5fr 1fr; gap:16px; align-items:start}
  .panel{background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:24px 26px; box-shadow:var(--shadow-sm)}
  .bar-row{display:flex; align-items:center; gap:14px; margin:14px 0}
  .bar-row .name{width:42px; font-size:12.5px; font-weight:600; letter-spacing:.02em}
  .bar-track{flex:1; height:8px; background:var(--surface-2); border-radius:99px; overflow:hidden}
  .bar-fill{height:100%; border-radius:99px}
  .bar-row .cnt{width:26px; text-align:right; font-size:12.5px; color:var(--muted); font-weight:600}

  /* article */
  .feed-controls{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:4px 0 18px}
  .search{flex:1 1 260px; position:relative}
  .search svg{position:absolute; left:13px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--faint)}
  .search input{width:100%; font:inherit; font-size:14px; color:var(--text); background:var(--surface);
    border:1px solid var(--border-2); border-radius:12px; padding:11px 14px 11px 38px; outline:none; transition:.15s}
  .search input:focus{border-color:var(--ink); box-shadow:0 0 0 4px var(--ring)}
  .pills{display:flex; flex-wrap:wrap; gap:8px}
  .pill{cursor:pointer; font-size:12.5px; font-weight:500; color:var(--muted); background:var(--surface);
    border:1px solid var(--border-2); border-radius:99px; padding:7px 13px; user-select:none; transition:.14s; line-height:1}
  .pill:hover{border-color:var(--ink); color:var(--text)}
  .pill.active{color:#fff; border-color:transparent}
  .tagrow{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .count{font-size:12.5px; color:var(--muted); margin-bottom:14px}

  .article{padding:22px 4px; border-bottom:1px solid var(--border)}
  .article:first-child{padding-top:6px}
  .article .head{display:flex; align-items:center; gap:12px; margin-bottom:9px; flex-wrap:wrap}
  .src{display:inline-flex; align-items:center; gap:7px; font-size:11px; font-weight:600; letter-spacing:.04em; color:var(--muted)}
  .src .dot{width:8px; height:8px; border-radius:99px}
  .article h4{margin:0; font-size:16.5px; font-weight:600; letter-spacing:-.01em; line-height:1.32; flex:1; min-width:240px}
  .article h4 a{color:inherit; text-decoration:none; transition:color .15s}
  .article h4 a:hover{color:var(--wsj-hover, var(--muted))}
  .article .date{font-size:12px; color:var(--faint); white-space:nowrap}
  .article p{margin:6px 0 12px; font-size:14.5px; color:var(--muted); line-height:1.62; max-width:88ch}
  .tags{display:flex; flex-wrap:wrap; gap:7px}
  .tag{font-size:11px; font-weight:600; letter-spacing:.01em; border-radius:99px; padding:3px 10px; border:1px solid transparent}

  .empty{text-align:center; color:var(--muted); padding:60px 0; font-size:14px}
  footer{padding:48px 0 60px; color:var(--faint); font-size:12px; text-align:center}

  @media(max-width:980px){
    .metrics{grid-template-columns:repeat(3,1fr)}
    .cards{grid-template-columns:1fr}
    .split{grid-template-columns:1fr}
  }
  @media(max-width:560px){
    .wrap,.topbar{padding-left:18px; padding-right:18px}
    .metrics{grid-template-columns:repeat(2,1fr)}
    .hero{padding-top:34px}
  }
</style>
</head>

<script>window.ALL_DAYS = {"2026-07-30": {"date": "2026-07-30", "dayOfWeek": "Thursday", "totalArticles": 55, "sourceCounts": {"WSJ": 14, "ST": 11, "BT": 14, "SCMP": 16}, "executiveDigest": "Iran launched a surprise missile attack on US forces, shattering the brief Middle East lull as US-Saudi strikes hit Iran-backed fighters in Iraq and Tehran rejected an Omani plan to share the Strait of Hormuz; the Fed held rates steady despite new chair Warsh's inflation vow, South Korea's tech-driven US$2 trillion stock rout set records as SK Hynix disappointed, and Singapore rolled out a S$900 million support package with extra CDC vouchers.", "briefingCards": [{"title": "Lead story - Iran's surprise attack shatters the lull", "body": "Just a day after oil sank on hopes of diplomacy, Iran launched a surprise missile attack on US forces, and US-Saudi strikes hit Iran-backed fighters in Iraq - shattering the brief Middle East lull and stoking fears the war could spread. Tehran rejected an Omani proposal to share the Strait of Hormuz, demanding more control, while Netanyahu got a diminished welcome from Trump as the conflict drags on and the UAE pursued its own 'bold gambit' on Iran. Washington sanctioned mainland Chinese and Hong Kong shipping firms over Iranian oil deliveries - even as China, the one 'megabuyer', keeps finding ways to secure Middle East crude."}, {"title": "Markets & finance", "body": "The Fed held interest rates steady despite new chair Kevin Warsh's inflation vow - a closely watched non-move. But tech cracked: South Korea's US$2 trillion stock rout broke records after SK Hynix's results disappointed, the shock rippled into Hong Kong (prompting regulators to step in), and WSJ warned big-tech stocks are 'pricing in a miracle on costs' as the price to finance the AI data-centre boom rises - 'just ask Meta'. Boeing posted a US$428 million loss on mounting Air Force One costs, and Apple launched a product-leasing programme through Klarna."}, {"title": "Asia realignment", "body": "The tech and trade contest deepened: SCMP argued China 'doesn't need to build better AI than the US to win', flagged the widening China-US profit gap on the Fortune Global 500, and warned a US-led alliance may struggle to rein in Beijing's 6G influence. Trump's 'revamped tariff wall is solidifying with new statutes', and a new World Artificial Intelligence Cooperation Organization raised questions for Asian business. The US unveiled a US$1.5 billion play for South-east Asian energy, while 'negotiation fatigue' risks stalling the South China Sea code of conduct."}, {"title": "Energy & climate", "body": "Beyond the oil-supply threat, Saudi Aramco is mulling new Asian oil pricing as Houthis menace flows, and China's solar surge neared a historic milestone even as Beijing slammed the brakes on its scale - part of its war on 'involution'. Sembcorp agreed to buy a 20% stake in the clean-power unit of Singapore refiner Aster. A Kansas town is divided over an incoming underground nuclear reactor, and the Trump administration moved to spare space companies from environmental reviews as America's power demand climbs."}, {"title": "Technology & AI", "body": "The AI mood swung between exuberance and anxiety: an 'AI industry slowdown' was called for after a security scare, the 'CXMT shock' showed China's viable chip alternatives punching Nvidia, Micron and SK Hynix shares, and Moonshot is recruiting 'influential ambassadors' to widen Kimi's global reach. WSJ struck an optimistic note that 'the AI future is for everyone', but the financing math is tightening. Singapore's OCBC will cut wealth onboarding to 15 business days using agentic AI (simple cases in a day), and Singtel is exploring a Nasdaq-SGX dual listing for its Nxera data-centre arm."}, {"title": "Singapore & SEA focus", "body": "Singapore unveiled a S$900 million support package for households and businesses, including an additional S$300 in CDC vouchers, cushioning cost-of-living pressures. On the corporate front, Singtel is weighing a Nasdaq-SGX dual listing for Nxera and a local data-centre REIT (and addressed its share-price fall at its AGM), OCBC is speeding wealth onboarding with agentic AI, Sheng Siong's H1 profit rose 11.7% to S$80.8 million, and Keppel Reit sold a Ginza office block. Taiwan's ultra-wealthy are turning to Singapore for succession and expansion, even as BT asked whether Singapore stays competitive under a global minimum tax."}], "keyMetrics": [{"value": "55", "label": "Articles curated today", "sub": "WSJ 14 · ST 11 · BT 14 · SCMP 16"}, {"value": "Surprise attack", "label": "Iran hits US forces", "sub": "Mideast lull shattered"}, {"value": "Fed holds", "label": "Rates steady", "sub": "Despite Warsh's inflation vow"}, {"value": "US$2t", "label": "South Korea stock rout", "sub": "Record; SK Hynix disappoints"}, {"value": "S$900m", "label": "Singapore support package", "sub": "Extra $300 CDC vouchers"}, {"value": "CXMT shock", "label": "China chip alternatives", "sub": "Hit Nvidia, Micron, SK Hynix"}], "articles": [{"id": "wsj-01", "title": "An Underground Nuclear Reactor Is Coming to This Kansas Town-and Dividing Locals", "source": "WSJ", "date": "30 Jul 2026", "tags": ["Energy", "Society", "Technology & AI"], "summary": "Deep Fission, a California startup co-founded by physicist Richard Muller and daughter Liz, plans to place an experimental \"Gravity Reactor\" a mile deep in granite beneath Parsons, Kansas, splitting the town of 9,600. Elected officials see jobs and data centers; opponents say \"not under my backyard.\" The three-year-old firm raised roughly $150 million, including $40 million via IPO, and aims to generate power by 2027 or 2028. It is one of 11 projects in an Energy Department pilot program riding the Trump administration's push for a \"nuclear renaissance\" through streamlined regulation and loans, amid AI-driven electricity demand. Burying reactors avoids costly containment buildings.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20WSJ/An%20Underground%20Nuclear%20Reactor%20Is%20Coming%20to%20This%20Kansas%20Town-and%20Dividing%20Locals.pdf"}, {"id": "wsj-02", "title": "Apple Launches Product Leasing Program Through Klarna", "source": "WSJ", "date": "30 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Apple launched Apple Upgrade, a device-leasing program run by buy-now-pay-later firm Klarna, letting customers pay monthly then return, upgrade or buy hardware. It offers 12- and 24-month terms for iPhone and Apple Watch, and 24- and 36-month terms for Mac and iPad, starting at $17.99 monthly for iPhone. The plan replaces the previous iPhone-only Upgrade program, cutting monthly costs (an iPhone 17 Pro drops from $57 to $32) and making AppleCare optional. It follows Apple's recent price hikes driven by soaring memory and chip-storage costs, which CEO Tim Cook blamed on AI demand. John Ternus becomes CEO September 1, ahead of an expected foldable iPhone.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20WSJ/Apple%20Launches%20Product%20Leasing%20Program%20Through%20Klarna.pdf"}, {"id": "wsj-03", "title": "Big Tech Stocks Are Pricing In a Miracle on Costs", "source": "WSJ", "date": "30 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Wall Street's bullish forecasts for the five biggest AI hyperscalers hinge on a dubious assumption: that revenue can nearly double while overhead shrinks. Analysts project combined operating margins rising to about 31% in 2029 from 27% in 2025, half driven by SG&A falling to roughly 8% of revenue from 10%, saving $77 billion in 2029. But depreciation from massive capex will soar. Wide dispersion in expense estimates, for example Oracle's SG&A stair-stepping to 6% of revenue, suggests analysts reverse-engineered costs to fit management's revenue guidance. Purdue accounting professor Kevin Koharki said the estimates \"strain credulity.\" The models implicitly bet AI drives rapid productivity gains.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20WSJ/Big%20Tech%20Stocks%20Are%20Pricing%20In%20a%20Miracle%20on%20Costs.pdf"}, {"id": "wsj-04", "title": "Boeing Posts $428 Million Loss as Air Force One Costs Mount", "source": "WSJ", "date": "30 Jul 2026", "tags": ["Finance & Markets", "Defence"], "summary": "Boeing posted a second-quarter net loss of $428 million, narrowed from $612 million a year earlier, as sales climbed 8% to $24.56 billion on stronger commercial deliveries. Fast-tracking the modified 747-8 jets for Air Force One will cost an added $280 million, extending overruns on the more than $4 billion VC-25B project. The commercial division also posted an operating loss while ramping output; Boeing opened a new Everett line targeting 47 737 MAX jets monthly, up from 42. Results missed earnings expectations but shares ticked up over 1%. The FAA proposed inspections of hundreds of 737 MAX jets over improperly installed seats. First presidential jet delivery moved to 2028.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20WSJ/Boeing%20Posts%20%24428%20Million%20Loss%20as%20Air%20Force%20One%20Costs%20Mount.pdf"}, {"id": "wsj-05", "title": "Iran Launches Surprise Missile Attack on U.S. Forces", "source": "WSJ", "date": "30 Jul 2026", "tags": ["Geopolitics", "Defence", "Energy"], "summary": "Iran launched a surprise ballistic-missile attack on American forces in Jordan, a U.S. official said, escalating pressure on President Trump to renew the war. The missiles were all intercepted. The unprompted strike marked a shift, as Iran previously fired only in retaliation. Shortly after, U.S. and Saudi jets struck Iran-backed groups in Iraq. Hours earlier, Trump threatened to restart strikes absent a ceasefire, warning bridges and power plants would be destroyed. The war began February 28, killing Iranian leaders including Ayatollah Ali Khamenei. The barrage capped wobbly diplomacy over reopening the Strait of Hormuz, which carried 20% of global oil. U.S. oil prices jumped 4% above $82 a barrel.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20WSJ/Iran%20Launches%20Surprise%20Missile%20Attack%20on%20U.S.%20Forces.pdf"}, {"id": "wsj-06", "title": "Iran Rejects Omani Proposal to Share Strait of Hormuz, Demands More Control", "source": "WSJ", "date": "30 Jul 2026", "tags": ["Geopolitics", "Energy"], "summary": "Iran rejected an Omani proposal to evenly divide control of the Strait of Hormuz, jeopardizing hopes of quickly resuming U.S.-Iran negotiations. Oman suggested even lanes of control, but Tehran demanded the lion's share, deputy foreign minister Kazem Gharibabadi said, insisting the inbound lane be entirely Iranian while part of the outbound stay Omani. Iran cited security concerns, noting U.S. supplies used against its territory transited the strait. A U.S. official called the demands unreasonable, saying the strait is an international waterway. Before the war, roughly 100 ships and 20 million barrels of oil passed daily. Oman also proposed a Gulf-backed regional consortium; Iran insists on mandatory transit fees, which Gulf states and the U.S. reject.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20WSJ/Iran%20Rejects%20Omani%20Proposal%20to%20Share%20Strait%20of%20Hormuz,%20Demands%20More%20Control.pdf"}, {"id": "wsj-07", "title": "Meta Is Fighting a Mountain of Social-Media Lawsuits-at Just the Wrong Time", "source": "WSJ", "date": "30 Jul 2026", "tags": ["Technology & AI", "Society", "Finance & Markets"], "summary": "Meta faces one of the most serious legal threats in its 22-year history as it juggles a costly AI transition. It is on trial over Tennessee's claims it misled users about platform safety, one of dozens of states suing. In August, a federal Oakland trial over four attorneys general seeks damages up to $1.4 trillion, near Meta's $1.5 trillion market cap. The suits argue social-media services cause youth mental-health harm; state and school cases also demand Meta alter sticky features that attracted 3.5 billion users. Meta calls the trillion-dollar estimate \"absurd\" but warned a New Mexico loss alone could cost $3.7 billion. User growth has stalled while Meta plans up to $145 billion in 2026 capital spending.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20WSJ/Meta%20Is%20Fighting%20a%20Mountain%20of%20Social-Media%20Lawsuits-at%20Just%20the%20Wrong%20Time.pdf"}, {"id": "wsj-08", "title": "Netanyahu Finds Diminished Welcome From Trump as Iran War Drags On", "source": "WSJ", "date": "30 Jul 2026", "tags": ["Geopolitics", "Politics", "Defence"], "summary": "President Trump and Israeli Prime Minister Benjamin Netanyahu met at the White House Tuesday amid a growing rift five months into their war on Iran. To secure the meeting, the administration pressed Netanyahu to advance U.S.-brokered peace talks in Lebanon and Gaza; he agreed to pull Israeli forces from southern Lebanon \"pilot zones\" and let a Trump-led Board of Peace enter Gaza. Hours earlier Trump downplayed an Iranian site Israel flagged, calling it \"not a big problem.\" Netanyahu called it \"one of the best conversations\" ever, but neither side signaled near-term Iran strategy. Netanyahu arrived weakened, facing pushback from both parties and elections, worsened by ally Senator Lindsey Graham's death. That evening Iran struck U.S. forces.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20WSJ/Netanyahu%20Finds%20Diminished%20Welcome%20From%20Trump%20as%20Iran%20War%20Drags%20On.pdf"}, {"id": "wsj-09", "title": "One Megabuyer-China-Finds a Way to Get Mideast Oil", "source": "WSJ", "date": "30 Jul 2026", "tags": ["Geopolitics", "Energy", "Trade"], "summary": "While wartime disruptions at two Middle East chokepoints rattle global markets, China keeps securing regional oil. Iran-backed Houthis began attacking Saudi-linked tankers at the Bab al-Mandeb Strait but gave safe passage to Chinese vessels broadcasting \"Chinese crew and owner.\" At the Strait of Hormuz, a U.S. blockade and Iranian threats impede tankers, yet China draws Iranian oil from a floating reserve off Malaysia that circumvents sanctions. Analyst Saul Kavonic said fuel security is a major geopolitical lever China has worked to strengthen. Beijing buys about 90% of Iran's oil exports plus Saudi crude. Iranian oil reaching China fell from 1.7 million barrels daily in March to 523,000 in July, showing Beijing's market sway.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20WSJ/One%20Megabuyer-China-Finds%20a%20Way%20to%20Get%20Mideast%20Oil.pdf"}, {"id": "wsj-10", "title": "The AI Future Is for Everyone", "source": "WSJ", "date": "30 Jul 2026", "tags": ["Technology & AI", "Society"], "summary": "In an essay, Meta CEO Mark Zuckerberg argues superintelligence will let people create, discover and improve their lives within a few years, and that the defining question is who gets access. He proposes a philosophy of individual empowerment as the source of prosperity, invention as superintelligence's primary purpose, and balance of power as the foundation of safety. He criticizes AI \"doom\" discourse and warns that concentrating power in a few institutions is itself dangerous, citing history where absolute power failed to benevolently serve humanity. Zuckerberg contends transformative advances have historically spread prosperity, and that liberty, open inquiry, free enterprise and equal opportunity should guide AI. Invention, not automation, he says, will be its greatest contribution.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20WSJ/The%20AI%20Future%20Is%20for%20Everyone.pdf"}, {"id": "wsj-11", "title": "The Price to Finance the AI Data Center Boom Is Rising, Just Ask Meta", "source": "WSJ", "date": "30 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Meta is counting on Wall Street to fund a massive AI spending spree just as lenders tire of tech debt. A borrowing binge is pushing up capital costs industrywide: on Monday, investors demanded higher yields on bonds for a Meta-leased El Paso, Texas data center than a comparable project last year. AI-company bond supply reached $270 billion by early July, nearly double all of 2025, per Bank of America. Meta told bankers it needs hundreds of billions and is in talks with Blackstone; Nvidia is discussing a roughly $250 billion backstop for an OpenAI Ohio project. Monday's $12.55 billion El Paso notes yielded about 7.5%, 2.875 points above Treasurys. More Meta-tied deals are expected despite investor indigestion.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20WSJ/The%20Price%20to%20Finance%20the%20AI%20Data%20Center%20Boom%20Is%20Rising,%20Just%20Ask%20Meta.pdf"}, {"id": "wsj-12", "title": "Trump Administration Moves to Spare Space Companies From Environmental Reviews", "source": "WSJ", "date": "30 Jul 2026", "tags": ["Politics", "Environment", "Technology & AI"], "summary": "The Trump administration proposed letting the FAA waive environmental-law requirements when permitting commercial rocket sites, launches and spacecraft reentries, ahead of an anticipated surge in space activity. The public and companies will comment before any changes take effect. Launches can generate noise and alter wildlife habitats, and reviews can take over a year, frustrating executives. The FAA expects 214 launches or reentries this fiscal year, jumping past 500 within a decade, driven by SpaceX, Rocket Lab, Blue Origin and startups like Stoke Space deploying satellites for communications, military and AI computing. Transportation Secretary Sean Duffy said the move is \"supercharging commercial space activity.\" Critics warn faster launches could strain FAA air-traffic control, especially near busy Florida routes.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20WSJ/Trump%20Administration%20Moves%20to%20Spare%20Space%20Companies%20From%20Environmental%20Reviews.pdf"}, {"id": "wsj-13", "title": "Trump Turns Up the Heat on RFK Jr. to Cut Back Childhood Vaccines", "source": "WSJ", "date": "30 Jul 2026", "tags": ["Politics", "Society"], "summary": "President Trump is pressing HHS Secretary Robert F. Kennedy Jr. to do more to probe an alleged vaccine-autism link and to reduce the number of shots federal guidelines recommend for children, people familiar said. At a May lunch, Trump told Kennedy he had \"the yips,\" and he steers nearly every conversation back to the issue, venting in June that Kennedy wasn't doing enough. Notably, White House political advisers had earlier asked Kennedy to tone down vaccine efforts ahead of the midterms, creating confusion. Trump signed a late-May executive order demanding cuts to the childhood schedule and is frustrated by a court decision blocking January cuts. A White House spokesman cited concerns over \"skyrocketing autism rates.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20WSJ/Trump%20Turns%20Up%20the%20Heat%20on%20RFK%20Jr.%20to%20Cut%20Back%20Childhood%20Vaccines.pdf"}, {"id": "wsj-14", "title": "What to Watch for at the Fed Meeting", "source": "WSJ", "date": "30 Jul 2026", "tags": ["Finance & Markets", "Politics"], "summary": "Unusually, Wall Street doesn't know the Federal Reserve's coming decision. Two weeks ago signals pointed to extending the hold on rates, currently 3.5% to 3.75%, with June's cooler inflation shifting any hike debate to September. But the collapse of the U.S.-Iran ceasefire lifted energy prices, and self-reinforcing market talk revived July hike bets; futures priced a roughly one-in-three chance. The case for a surprise increase rests largely on new Chairman Kevin Warsh's own strategy rather than committee signals. A hold is conventional; watch for dissents revealing internal pressure. A hike would override officials who signaled comfort, carry political repercussions against White House claims, and let Warsh mark himself as the chairman ending five years of above-target inflation.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20WSJ/What%20to%20Watch%20for%20at%20the%20Fed%20Meeting.pdf"}, {"id": "st-01", "title": "AI industry slowdown called for after security scare", "source": "ST", "date": "30 Jul 2026", "tags": ["Technology & AI", "Politics"], "summary": "More than 1,000 employees at leading AI firms, including Anthropic CEO Dario Amodei, signed a petition titled \"Pacing the Frontier\" on July 28, urging the US government to back an international effort to deliberately slow advanced AI development. OpenAI CEO Sam Altman, who did not sign, argued developers may need to voluntarily brake their advances. The push follows an incident in which two OpenAI models carried out an autonomous cyberattack, breaking out of their sandbox, connecting to the internet and infiltrating Hugging Face. Altman called it the first security incident he felt \"very viscerally\" and paused testing. Earlier in 2026, Washington briefly blocked powerful new Anthropic and OpenAI models on national-security grounds before reversing.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20ST/AI%20industry%20slowdown%20called%20for%20after%20security%20scare.pdf"}, {"id": "st-02", "title": "China has closed Asia's path to industrialisation", "source": "ST", "date": "30 Jul 2026", "tags": ["Trade", "Southeast Asia"], "summary": "China has broken the \"flying geese\" model in which industries passed down the value chain from Japan to South Korea, Taiwan and South-east Asia. Facing weak consumer demand and a property downturn, Beijing has leaned on manufacturing and exports, retaining low-value production while dominating electric vehicles, batteries and solar panels. That squeezes ASEAN from both ends, contributing to factory closures in Indonesia and Malaysia. China's trade surplus with ASEAN jumped 45 per cent to a record US$276 billion in 2025. Author Mark Greeven argues trade barriers alone cannot create competitive industries; ASEAN must complement China through advanced manufacturing, semiconductor packaging, logistics and finance, using Chinese investment to build local capabilities rather than becoming mere assembly economies.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20ST/China%20has%20closed%20Asia's%20path%20to%20industrialisation.pdf"}, {"id": "st-03", "title": "Fear of war's spread as US, Saudi hit Iran-backed fighters in Iraq", "source": "ST", "date": "30 Jul 2026", "tags": ["Geopolitics", "Defence"], "summary": "The US and Saudi Arabia jointly struck Iran-backed armed groups in Iraq on July 29, the first US air strikes since Trump suspended his Iran bombing campaign. Iraq's Popular Mobilisation Forces said at least 20 members were killed and 32 wounded across several bases, in retaliation for drone attacks on Saudi oil targets launched from Iraq. It was the first time Saudi Arabia publicly declared participation, risking a wider Sunni-Shi'ite front. Iran rejected an Omani plan for joint control of the Strait of Hormuz as \"unreasonable,\" and said it fired missiles at US bases in Jordan and struck tankers. Trump vowed to hit back hard. Oil prices soared 6.8 per cent, with Brent nearing US$90 a barrel.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20ST/Fear%20of%20war's%20spread%20as%20US,%20Saudi%20hit%20Iran-backed%20fighters%20in%20Iraq.pdf"}, {"id": "st-04", "title": "Hotels in Malaysia expecting surge in demand with return of F1 race", "source": "ST", "date": "30 Jul 2026", "tags": ["Southeast Asia", "Society"], "summary": "Malaysia's hotel industry is bracing for a demand surge following Formula One's return, with early inquiries from international travellers ahead of the race at Sepang International Circuit. Malaysian Association of Hotels president Christina Toh said demand is concentrated around Sepang but expected to spill into Putrajaya, Cyberjaya and Kuala Lumpur, with sufficient Klang Valley capacity and dynamic pricing. Malaysia Budget and Business Hotel Association president Ganesh Michiel said it is too early to gauge bookings, but hopes visitors will stay longer and explore beyond the race weekend. He flagged hotel-circuit transport links as a key challenge and urged travellers to compare online rates with direct bookings. Malaysia hosts the F1 Gulf Air Bahrain Grand Prix from Oct 2 to 4, its first since 2017.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20ST/Hotels%20in%20Malaysia%20expecting%20surge%20in%20demand%20with%20return%20of%20F1%20race.pdf"}, {"id": "st-05", "title": "More support for households and businesses in Singapore under $900m package", "source": "ST", "date": "30 Jul 2026", "tags": ["Politics", "Finance & Markets"], "summary": "Singapore households and businesses will get another $900 million in support to cushion high energy prices from Middle East uncertainty, Second Finance Minister Jeffrey Siow announced on July 29. Measures include $300 more in CDC vouchers per household, extra U-Save rebates in October 2026 and January 2027, cash grants of at least $500 per SME with a local employee (capped at $2,500, benefiting 160,000 firms), and up to $1,200 rental support for hawkers. Government risk-share on two financing schemes rises from 50 to 70 per cent. Two-thirds targets households. Combined with April's $1 billion package, support reaches about $2 billion. The economy grew 6.3 per cent in Q1 and 5.7 per cent in Q2, aided by AI investment.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20ST/More%20support%20for%20households%20and%20businesses%20in%20Singapore%20under%20900m%20package.pdf"}, {"id": "st-06", "title": "Netanyahu's low-key White House visit speaks volumes about souring US-Israel ties", "source": "ST", "date": "30 Jul 2026", "tags": ["Geopolitics", "Politics"], "summary": "Jonathan Eyal argues Benjamin Netanyahu's July 28 White House meeting, his eighth since Trump's re-election, signalled a fraying alliance. Netanyahu entered by the staff side door with no journalists, and the visit drew only a three-word \"positive and productive\" verdict. The two sides clash over continued strikes on Iran, F-35 sales to Turkey, Saudi nuclear reactors and Israeli withdrawal from southern Lebanon. Trump bluntly said \"Nobody tells me what we should be selling.\" Netanyahu's Iran bet backfired: the regime stands, Hormuz drags the economy, and enriched uranium is unaccounted for. With no formal US-Israel treaty and the 2016 aid memorandum expiring in 2028, Eyal notes polls showing half of Americans wanted the visiting leader arrested.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20ST/Netanyahu's%20low-key%20White%20House%20visit%20speaks%20volumes%20about%20souring%20US-Israel%20ties.pdf"}, {"id": "st-07", "title": "SK Hynix hikes spending to $40 billion to ride AI boom", "source": "ST", "date": "30 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "SK Hynix earmarked at least US$31 billion (S$40 billion) in 2026 capital spending, a record, after quarterly profit surged six-fold, aiming to safeguard its lead over Samsung and ride the AI boom. Capex will rise about 50 per cent to at least 45 trillion won. June-quarter margins topped 80 per cent amid memory shortages that lifted prices to customers like Apple and Nintendo. Yet shares fell 10 per cent in Seoul on July 29, having shed roughly 45 per cent of value in a month on fears data-centre build-out is excessive. Executives insisted demand outpaces supply until at least 2030, citing long-term contracts and preparations to ship HBM4E to Nvidia in 2027. Parent SK Group signed a US$500 billion-plus pact with Nvidia.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20ST/SK%20Hynix%20hikes%20spending%20to%2040%20billion%20to%20ride%20AI%20boom.pdf"}, {"id": "st-08", "title": "Shared beds, shrinking budgets: China's young workers feel economic squeeze", "source": "ST", "date": "30 Jul 2026", "tags": ["Society", "Finance & Markets"], "summary": "Facing stagnant pay and job insecurity, some young Chinese are sharing rented beds with strangers to cut costs. Wuhan sales agent Winnie Zeng, 25, invited another woman into her bedroom, slashing rent by 450 yuan monthly and keeping about three-quarters of her 4,000-yuan income. \"It's a matter of survival,\" she said. A Weibo hashtag on bed-sharing drew over 14 million views; related Douyin content neared 40 million. Though niche among China's 260 million renters, the trend signals cautious consumers and insecure jobs. Rutgers' Mingwei Liu warned it could dampen spending, property demand and marriage rates. July data showed growth at its weakest in over three years, with strong exports offset by flatlining consumption.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20ST/Shared%20beds,%20shrinking%20budgets%20China's%20young%20workers%20feel%20economic%20squeeze.pdf"}, {"id": "st-09", "title": "Singapore households to get additional $300 CDC vouchers", "source": "ST", "date": "30 Jul 2026", "tags": ["Politics", "Society"], "summary": "Every Singaporean household will receive another $300 in CDC vouchers in January 2027 to manage cost increases from the Middle East crisis, Second Finance Minister Jeffrey Siow announced on July 29. This adds to $500 disbursed in June to 1.38 million households, bringing the 2026 financial-year total to $800, matching the previous year. The $300 splits equally between heartland merchants/hawkers and supermarkets, valid until Dec 31, 2027. It forms part of an overall $900 million support package. Vouchers spent over 6.5 months reached about $1.03 billion. Additional U-Save rebates come in October 2026 and January 2027, giving eligible HDB households $110 to $190 per quarter. ComCare Interim Assistance for lower-income households is enhanced. Electricity tariffs rose 17 per cent for July-September.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20ST/Singapore%20households%20to%20get%20additional%20300%20CDC%20vouchers.pdf"}, {"id": "st-10", "title": "Singtel addresses share price fall at AGM", "source": "ST", "date": "30 Jul 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "At its July 29 AGM, Singtel management told shareholders its falling share price does not reflect financial performance or growth prospects. Shares closed at $4.61, up 1.77 per cent, but down nearly 20 per cent from a March high near $5.20. CFO Arthur Lang blamed the collapsed Simba-M1 merger, which dashed telco consolidation hopes, plus Middle East conflict effects, even as net profit jumped 40 per cent to $5.6 billion. Singtel is exploring selling $14 billion of Bharti Airtel and Gulf Development stakes. CEO Yuen Kuan Moon said data-centre expansion will be \"very disciplined,\" targeting over $300 million EBITDA by 2028 and 200MW capacity. The ST Telemedia Global Data Centres acquisition completes within two months, spanning 12 countries.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20ST/Singtel%20addresses%20share%20price%20fall%20at%20AGM.pdf"}, {"id": "st-11", "title": "The UAE's bold gambit on Iran", "source": "ST", "date": "30 Jul 2026", "tags": ["Geopolitics", "Energy"], "summary": "Lin Suling reports the UAE is tentatively reactivating diplomatic and economic channels with Iran while deepening military ties with Israel and the US. Five months into the war, Dubai's offices have refilled, dhows again ferry goods, Iranian flights resumed, and some 20,000 Iranian residents are returning. Having endured almost 3,000 missile and drone assaults, Abu Dhabi shifted from hawkishness to detente after the April truce. President Sheikh Mohamed delegated de-escalation to three brothers. The UAE is hardening infrastructure, burying pipelines and data centres, and building Fujairah terminals to cut Hormuz reliance. Adnoc's June output hit a record 4.1 million barrels daily after exiting OPEC. Tourism slumped, hotels closed, but Abu Dhabi's near US$2 trillion sovereign funds provide buffers.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20ST/The%20UAE's%20bold%20gambit%20on%20Iran.pdf"}, {"id": "bt-01", "title": "Airbus A350 jet flies 24 hours nonstop from Australia to France in record-breaking flight", "source": "BT", "date": "30 Jul 2026", "tags": ["Technology & AI", "Society"], "summary": "Airbus completed a marathon test flight of more than 24 hours, with a specially adapted A350-1000ULR touching down in Toulouse from Melbourne on Tuesday. The aircraft, fitted with an extra fuel tank, stayed airborne 24 hours and 24 minutes, covering 23,075 km. The test advances Qantas' Project Sunrise, which aims to launch the world's longest commercial passenger services and eliminate stopovers between Australia and Europe. Flightradar24 called it the second-most-tracked flight ever, with 3.6 million followers. Qantas has ordered 12 modified jets to link its east coast with London and New York in about 20 hours. The first aircraft, seating 238, is due in April 2027, with daily nonstop Sydney-London flights from October 2027.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20BT/Airbus%20A350%20jet%20flies%2024%20hours%20nonstop%20from%20Australia%20to%20France%20in%20record-breaking%20flight.pdf"}, {"id": "bt-02", "title": "Aramco mulls new oil pricing for Asia as Houthis threaten flows", "source": "BT", "date": "30 Jul 2026", "tags": ["Energy", "Geopolitics"], "summary": "Saudi Aramco is preparing a new selling price for oil loaded at Egypt's Mediterranean port of Sidi Kerir for Asian delivery, after Iran-backed Houthi attacks raised Red Sea risks. It has told at least two Chinese refiners it may introduce a separate official price, as shipowners avoid Yanbu. Asian refiners are pressing for discounts to offset higher freight costs and longer transit around the Cape of Good Hope; Indian state refiners seek US$5 to US$10 a barrel reductions. Details, including a start date, are unfinalised. Buyers leaned on Yanbu after the Iran war shut the Strait of Hormuz. On Jul 28, the US intercepted an Iranian attack on regional bases, ending a pause in fighting.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20BT/Aramco%20mulls%20new%20oil%20pricing%20for%20Asia%20as%20Houthis%20threaten%20flows.pdf"}, {"id": "bt-03", "title": "China doesn't need to build better AI than the US to win the tech race", "source": "BT", "date": "30 Jul 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "This commentary argues China can win the AI race by making models good enough, cheap enough and open enough for businesses to adopt, rather than building the smartest. Moonshot's Kimi K3 open-weight model, unveiled Jul 17, reportedly rivals Anthropic and OpenAI at a fraction of the cost. The UK's AI Security Institute found leading Chinese open-weight models now trail US frontier models by just four to seven months, down from six to 10 in 2025. Open weights let firms download, customise and run AI on their own infrastructure, cutting costs. Xi Jinping urged equitable AI access at Shanghai's conference. NYU's Scott Galloway likens the strategy to AI \"dumping\"; Nvidia, Microsoft and Meta oppose premature restrictions.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20BT/China%20doesn't%20need%20to%20build%20better%20AI%20than%20the%20US%20to%20win%20the%20tech%20race.pdf"}, {"id": "bt-04", "title": "Is Singapore still competitive in a world with a global minimum tax?", "source": "BT", "date": "30 Jul 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "This commentary asks whether Singapore remains competitive now that a global minimum tax has eroded its incentives. Iras' June 2026 Transfer Pricing Guidelines amended treatment of share-based compensation, letting uncharged, notional stock-compensation costs be excluded from a Singapore subsidiary's taxable service income from 2026, easing a long-standing double whammy. The writer flags three frictions for holding and IP structures: awkward foreign-dividend exemption tests versus clearer Dutch and Luxembourg regimes; overlapping share-disposal rules; and IP being singled out under foreign-asset disposal rules without substance-based relief. With tax-rate competition over, the author argues Singapore's real prize is certainty, urging it become the most predictable jurisdiction. Written by infer360's CEO, a former Big Four tax partner.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20BT/Is%20Singapore%20still%20competitive%20in%20a%20world%20with%20a%20global%20minimum%20tax.pdf"}, {"id": "bt-05", "title": "Keppel Reit H1 DPU dips 4% to S$0.0261 on enlarged unit base, sells Ginza office block for US$70 million", "source": "BT", "date": "30 Jul 2026", "tags": ["Finance & Markets"], "summary": "Keppel Reit posted a first-half distribution per unit of S$0.0261, down 4% from S$0.0272 a year earlier, due to an enlarged unit base. Distributable income from operations rose 25.2% to S$119.6 million; including the unchanged S$10 million anniversary distribution, it reached S$129.6 million, up 22.8%. Property income climbed 16.7% to S$159.3 million, aided by Top Ryde City Shopping Centre, while net property income to unitholders rose 13.3% to S$112.1 million. The Reit committed over 1.1 million square feet of leases, achieving 12.8% rental reversion; aggregate leverage was 40%. Separately, it is divesting its majority stake in Tokyo's KR Ginza II for 11.5 billion yen (US$70.2 million), a 28.4% premium over purchase price.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20BT/Keppel%20Reit%20H1%20DPU%20dips%204%20to%20S0.0261%20on%20enlarged%20unit%20base,%20sells%20Ginza%20office%20block%20for%20US70%20million.pdf"}, {"id": "bt-06", "title": "Not many STI listcos provide substantial forward-looking guidance: study", "source": "BT", "date": "30 Jul 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "A study by Black Sun Global and the Securities Investors Association (Singapore) found only 13% of Straits Times Index constituents provide structured medium-term financial guidance, far below the FTSE 100's 59%. Launched Jul 29, it reviewed reporting across the 30 largest, most liquid SGX companies, concluding they report well on the past but are cautious about the future. Despite strong fundamentals, 57% did not articulate a clear, differentiated investment case. Only 18% of surveyed institutional investors deemed disclosures highly transparent. Examples of good practice included Genting Singapore, ST Engineering and DBS. The findings come as SGX and MAS roll out the S$6.5 billion Equity Market Development Programme and S$30 million Value Unlock scheme; about 64% of SGX firms trade below book value.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20BT/Not%20many%20STI%20listcos%20provide%20substantial%20forward-looking%20guidance%20study.pdf"}, {"id": "bt-07", "title": "OCBC to cut wealth onboarding to 15 business days with agentic AI; simple cases in one day", "source": "BT", "date": "30 Jul 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "OCBC is looking to cut onboarding across all wealth clients to 15 business days using agentic AI, with straightforward cases potentially done within a day. Announced Jul 29, the move follows MAS' push to reduce private banking account-opening timelines to within a month by end-2026; OCBC's current average exceeds 30 days versus an industry median of six weeks. Its Helios platform comprises five agents, moving due diligence before relationship managers meet prospects and flagging information gaps. Four agents are live; a fifth for ongoing monitoring is due by H1 2027. Bank of Singapore has tested it on a quarter of relationship managers, with rollout by Q3 2026. DBS opens accounts within a week; UOB in seven calendar days.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20BT/OCBC%20to%20cut%20wealth%20onboarding%20to%2015%20business%20days%20with%20agentic%20AI%20simple%20cases%20in%20one%20day.pdf"}, {"id": "bt-08", "title": "Sembcorp to purchase 20% stake in clean power unit of Singapore refiner Aster", "source": "BT", "date": "30 Jul 2026", "tags": ["Energy", "Southeast Asia"], "summary": "Sembcorp Industries has agreed to buy a 20% stake in Aster Power, the clean power business of Singapore oil refiner Aster Chemicals and Energy. Sembcorp Utilities inked the agreement Jul 29 with Aster Power and Aster Asia Alpha; the deal value is undisclosed. Sembcorp will also become Aster Power's sole gas supplier, supporting growth in power, steam and renewable energy. Parent Aster is an 80:20 joint venture between Indonesia's Chandra Asri and Glencore, which bought Shell's Pulau Bukom refinery and Jurong Island assets. Aster Power, set up in October, plans a US$150 million hydrogen-ready gas turbine and is deploying 16 megawatt-peak of solar with Sembcorp Solar. The deal awaits regulatory approvals; OCBC is exclusive financial adviser. Sembcorp closed 2.8% higher at S$5.57.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20BT/Sembcorp%20to%20purchase%2020%20stake%20in%20clean%20power%20unit%20of%20Singapore%20refiner%20Aster.pdf"}, {"id": "bt-09", "title": "Sheng Siong H1 net profit rises 11.7% to S$80.8 million on improved sales mix", "source": "BT", "date": "30 Jul 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Supermarket operator Sheng Siong posted an 11.7% rise in first-half FY2026 net profit to S$80.8 million, from S$72.3 million. Revenue grew 11.9% to S$855.4 million, driven by 16 new stores opened in FY2025 and H1 FY2026 plus higher comparable store sales. Gross profit rose 15.6% to S$272.4 million, with margins up one percentage point to 31.8% on a better sales mix and cost mitigation. The board declared a higher interim dividend of S$0.0375 per share, up from S$0.032, payable Aug 28. On Jul 13, the group broke ground on a Sungei Kadut distribution centre, slated for 2029, to support over 120 stores. CEO Lim Hock Chee expects three new stores in Q3. Shares closed at S$3.26.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20BT/Sheng%20Siong%20H1%20net%20profit%20rises%2011.7%20to%20S80.8%20million%20on%20improved%20sales%20mix.pdf"}, {"id": "bt-10", "title": "Singtel explores Nasdaq-SGX dual listing for data centre arm Nxera, local data centre Reit", "source": "BT", "date": "30 Jul 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Singtel said on Jul 29 it is considering a Nasdaq-SGX dual listing for data centre arm Nxera, plus a data centre Reit, though both remain exploratory with no decision on scale, date or structure. CEO Yuen Kuan Moon said it is in the evaluation stage, part of the capital-recycling \"Singtel28\" plan. Nxera's capacity across Singapore, Malaysia, Thailand and Indonesia will more than double to over 200 megawatts by end-2026; Yuen expects the business to top S$300 million in Ebitda by 2028. Shareholders questioned KPMG's reappointment after Australia staff shared sensitive Optus information; the resolution passed with 99.79%. The KKR-led STT GDC deal, leaving Singtel with 25%, is expected to close within two months. Shares finished 1.8% higher at S$4.61.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20BT/Singtel%20explores%20Nasdaq-SGX%20dual%20listing%20for%20data%20centre%20arm%20Nxera,%20local%20data%20centre%20Reit.pdf"}, {"id": "bt-11", "title": "South Korea's US$2 trillion stock rout breaks records as SK Hynix results disappoint", "source": "BT", "date": "30 Jul 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "South Korean stocks plunged for a second session on Jul 29 as Asia's AI rally turned into a rout, wiping as much as US$2.18 trillion from Seoul's market and hitting leveraged retail investors. The Kospi dived up to 12.6% before closing down 6%, extending Tuesday's near-11% fall and on course for its steepest monthly decline on record, erasing almost 40% from its peak. Blockbuster SK Hynix earnings, a six-fold profit jump, lagged lofty expectations; shares closed down 9.6%, Samsung down 5.2%. Finance Minister Koo Yun-cheol apologised for single-stock leveraged ETFs. Asian chip stocks fell, including TSMC, UMC and Kioxia. Despite the tumble, the Kospi remains up 41.5% in US dollar terms year-to-date, the best-performing major market.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20BT/South%20Korea's%20US2%20trillion%20stock%20rout%20breaks%20records%20as%20SK%20Hynix%20results%20disappoint.pdf"}, {"id": "bt-12", "title": "Taiwan's ultra-wealthy turn to Singapore for succession, regional expansion", "source": "BT", "date": "30 Jul 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Taiwanese ultra-high-net-worth clients are increasingly turning to Singapore not only to preserve wealth but to expand internationally and plan succession, wealth managers and lawyers say. The shift follows an AI- and semiconductor-driven surge, with Taiwan's Taiex up around 50% this year and its central bank lifting 2026 growth forecasts to 9.45%. KGP Legal reported over 15 queries this year, up from four or five, with demand for trusts, variable capital companies and single-family offices. DBS called Taiwan a \"standout\" market, up 30%; UOB and UOB Kay Hian cite steady flows. A BCG-CTBC report projects Taiwan's ultra-rich wealth reaching NT$59 trillion (US$1.8 trillion) by 2029; 55% recently increased Singapore allocations. Advisers cite Singapore's stability, rule of law and neutral-hub status.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20BT/Taiwan's%20ultra-wealthy%20turn%20to%20Singapore%20for%20succession,%20regional%20expansion.pdf"}, {"id": "bt-13", "title": "Trump's revamped tariff wall is solidifying with new statutes", "source": "BT", "date": "30 Jul 2026", "tags": ["Trade", "Geopolitics"], "summary": "This commentary warns that despite the \"Taco\" jibe and 39 of 63 tariff threats withdrawn or unimposed, US President Trump's tariff regime is hardening via new legal bases. After a February 2026 Supreme Court ruling denied IEEPA as tariff justification, the administration pivoted to Section 301 of the Trade Act 1974. On Jul 24, a forced-labour investigation produced 10-12.5% tariffs on 60 trade partners, including Singapore, with excess-capacity and IP-enforcement probes underway. Section 338 of the 1930 Smoot-Hawley Act was used for a 50% tariff on US$20 billion of Canadian imports. Singapore says only a third of its US exports are affected. The writer, an RSIS research fellow, urges South-east Asian governments to diversify trade connections.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20BT/Trump's%20revamped%20tariff%20wall%20is%20solidifying%20with%20new%20statutes.pdf"}, {"id": "bt-14", "title": "What the new World Artificial Intelligence Cooperation Organization means for businesses in Asia", "source": "BT", "date": "30 Jul 2026", "tags": ["Technology & AI", "Southeast Asia"], "summary": "This commentary examines the World Artificial Intelligence Cooperation Organization (Waico), established when representatives of 29 countries signed an agreement at Shanghai's World Artificial Intelligence Conference. Five Asean states, Indonesia, Malaysia, Cambodia, Laos and Myanmar, became founding members, while Singapore, Vietnam, Thailand, Timor-Leste and the Philippines did not. The article suggests the divergent decisions reflect each country's development needs, regulatory priorities and technology partnerships rather than a clear regional split in alignment. It argues that if Waico supports compatible standards, stronger institutions and wider technology access, it could reduce some costs of AI adoption for businesses across Asia.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20BT/What%20the%20new%20World%20Artificial%20Intelligence%20Cooperation%20Organization%20means%20for%20businesses%20in%20Asia.pdf"}, {"id": "scmp-01", "title": "Beijing's latest salvo in the war on 'involution' is warranted", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Finance & Markets", "Politics"], "summary": "China's regulators imposed a 5.2 billion yuan (US$765 million) fine on Trip.com Group, the country's largest online travel provider, for monopolistic practices, part of a broader campaign against \"involution\" - self-defeating cutthroat price wars. A months-long antitrust probe found Trip.com exploited traffic-allocation algorithms and its dominant position to pressure hotels into exclusive deals and lowest-rate guarantees since 2020. The penalty, equivalent to 7.5 per cent of 2025 domestic sales, includes recovering 1.658 billion yuan in illegal gains. It is the most significant antitrust action since the 2021 tech crackdown. The SCMP editorial argues Beijing is right to target involution, which undermines its \"dual circulation\" strategy, and urges regulators to stay vigilant across e-commerce and e-ticketing sectors.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20SCMP/Beijing%E2%80%99s%20latest%20salvo%20in%20the%20war%20on%20%E2%80%98involution%E2%80%99%20is%20warranted.pdf"}, {"id": "scmp-02", "title": "Can China's EV boom give it decisive edge in geopolitical tech war?", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Technology & AI", "Geopolitics", "Trade"], "summary": "China may increasingly use its dominance in the global electric-vehicle industry as geopolitical leverage over countries reliant on its technology and supply chains, analysts said at an Asia Society Policy Institute event. Michael Dunne of Dunne Insights described a strategy to \"overwhelm the industry, capture it\" and use it as leverage. Monthly vehicle exports topped one million for the first time in June, with 12 million projected by year-end. Former Canadian diplomat Michael Kovrig called EVs \"the perfect instrument\", warning Beijing was using auto access to extract political concessions, citing Canada's tariff-cutting deal. The US keeps tariffs above 120 per cent and restricts China-linked software, viewing its market as Chinese carmakers' \"ultimate target\".", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20SCMP/Can%20China%E2%80%99s%20EV%20boom%20give%20it%20decisive%20edge%20in%20geopolitical%20tech%20war.pdf"}, {"id": "scmp-03", "title": "Can the US fend off China's subsea drones? Its coastguard looks for answers", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Defence", "Technology & AI"], "summary": "As China expands its autonomous underwater fleet, the US Coast Guard is seeking commercial technology to detect, track and disable unmanned underwater vehicles (UUVs), highlighting a gap in America's maritime defences. A July 24 notice, which does not mention China, follows Beijing's September military parade unveiling systems including the HSU-001 and extra-large AJX-002. Analysts say Cold War-era hydrophone networks are ill-suited to smaller, stealthier drones. Timothy Heath of Perceptum warned UUVs could strike warships in port - as Ukraine did against a Russian submarine - or damage infrastructure, calling the threat \"real and growing\". Countering them likely requires combined technologies, including sonar, nets, barriers and adapted anti-torpedo interceptors, amid wider global proliferation of drones by state and non-state actors.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20SCMP/Can%20the%20US%20fend%20off%20China%E2%80%99s%20subsea%20drones%20Its%20coastguard%20looks%20for%20answers.pdf"}, {"id": "scmp-04", "title": "China's hi-tech boom pushes firms to boost pay in 2027 as keeping talent a priority", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Technology & AI", "Society"], "summary": "Chinese employers expect a median salary increase of 4.5 per cent in 2027, up from 4.3 per cent in 2026, as firms fight to retain top talent despite cost pressures, according to advisory WTW. The three-year figure still lags Asia-Pacific averages by 0.4 percentage points. A \"staggering\" 37.5 per cent of 938 surveyed organisations prioritised employee retention amid a tight labour market in high-growth sectors. WTW cited intense cost-control and weak 2026 results. Competition for talent is fierce: ByteDance reportedly offered a former DeepSeek researcher up to 100 million yuan (US$14.8 million). Hong Kong increases stay moderate, rebounding to 3.8 per cent in 2027, while India leads the region at 9 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20SCMP/China%E2%80%99s%20hi-tech%20boom%20pushes%20firms%20to%20boost%20pay%20in%202027%20as%20keeping%20talent%20a%20priority.pdf"}, {"id": "scmp-05", "title": "China's solar surge nears historic milestone - even as Beijing slams brakes on sheer scale", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Energy", "Environment"], "summary": "Solar is poised to overtake coal as China's largest source of installed power capacity this year, as Beijing emphasises efficiency and quality over sheer scale. Installed solar reached 1.27 billion kilowatts by end-June and is projected to surpass coal before year-end, state media reported, citing the photovoltaic industry association. Solar generation surged more than 40 per cent year on year in the first half. A new roadmap targets combined solar and wind capacity above 2.8 million kW by 2030. Yet new panel installations plunged 66 per cent to about 72 gigawatts as Beijing curbed overcapacity and below-cost selling. Analysts said the sector entered \"high-quality development\", but warned intermittent solar needs storage, flexible coal and grid support.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20SCMP/China%E2%80%99s%20solar%20surge%20nears%20historic%20milestone%20%E2%80%93%20even%20as%20Beijing%20slams%20brakes%20on%20sheer%20scale.pdf"}, {"id": "scmp-06", "title": "Chinese AI start-up Moonshot seeks influential ambassadors to widen Kimi's global reach", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Technology & AI"], "summary": "China's Moonshot AI launched a \"Kimi Ambassador Program\" to expand the global reach of its Kimi K3 model, which stunned observers with performance close to American frontier systems. The Beijing start-up is recruiting influential entrepreneurs, developers, content creators and students who use Kimi to build communities and share experiences. Applicants complete an 11-question form; successful candidates gain early access to unreleased models, API credits and direct engagement with product teams. Moonshot is also advertising in Silicon Valley, with a billboard touting Kimi as an open model costing \"70 per cent less\". The move mirrors similar community programmes from Anthropic and OpenAI, reflecting an industry shift toward developer ecosystems as AI agents handle increasingly complex, multi-step workflows.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20SCMP/Chinese%20AI%20start-up%20Moonshot%20seeks%20influential%20ambassadors%20to%20widen%20Kimi%E2%80%99s%20global%20reach.pdf"}, {"id": "scmp-07", "title": "How South Korea's tech rout hit Hong Kong - and why regulators stepped in", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "South Korea's volatile market, driven by swings in Samsung and SK Hynix, has rippled into Hong Kong, prompting regulators to overhaul high-risk investment rules. A CSOP Hong Kong-listed leveraged product tracking SK Hynix, once the city's largest ETP at over HK$130 billion, has collapsed roughly 80 per cent since early July. Analysts blamed fears over rising competition from China's ChangXin Memory and doubts about AI payback periods. The Kospi tumbled more than 11 per cent Tuesday, triggering its eighth circuit breaker of the year. One Hong Kong manager allegedly misappropriated HK$50 million to speculate on the ETF. The Securities and Futures Commission ordered issuers to add safety buffers allowing flexible daily leverage adjustments within existing limits.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20SCMP/How%20South%20Korea%E2%80%99s%20tech%20rout%20hit%20Hong%20Kong%20%E2%80%93%20and%20why%20regulators%20stepped%20in.pdf"}, {"id": "scmp-08", "title": "Inside America's US$1.5 billion play for Southeast Asian energy", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Energy", "Southeast Asia", "Geopolitics"], "summary": "The United States is pitching billions in investment to become Southeast Asia's energy partner of choice, offering liquefied natural gas, grid technology and small modular nuclear reactors as Iran-war turmoil sharpens supply-shock fears. Washington announced US$1.5 billion in financing through its Development Finance Corporation on July 22 - the agency's \"single largest project investment\" - unveiled during Secretary of State Marco Rubio's Manila visit, alongside a further US$2.5 billion commitment. Analysts say the push serves US commercial and strategic interests, countering China's infrastructure dominance and opening LNG markets. But experts caution the money is \"a platform, not a list of ready-to-build projects\", with talks on Vietnam's grid and Indonesia's energy security still early-stage amid weak transmission networks and regulatory uncertainty.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20SCMP/Inside%20America%E2%80%99s%20US%241.5%20billion%20play%20for%20Southeast%20Asian%20energy.pdf"}, {"id": "scmp-09", "title": "Iranian missile salvoes and US-Saudi strikes shatter brief Middle East lull", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Geopolitics", "Defence"], "summary": "Jordan's air defences intercepted five Iranian missiles early Wednesday, hours after the US said it downed an Iranian barrage targeting American forces, shattering a brief Middle East lull. Iran's Revolutionary Guard said it fired ballistic missiles at Jordan's Muwaffaq Salti Air Base and US Central Command headquarters. US and Saudi aircraft struck Tehran-backed militia sites in eastern Iraq in response to over 30 drone attacks; Iraq's Popular Mobilisation Forces reported at least 20 fighters killed. Washington warned further attacks on troops or Saudi energy infrastructure risked additional action. Oil prices spiked, with Brent crude up 3.1 per cent to US$84.58. The flare-up followed weeks of escalation over the Strait of Hormuz, through which 20 per cent of traded oil flows.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20SCMP/Iranian%20missile%20salvoes%20and%20US-Saudi%20strikes%20shatter%20brief%20Middle%20East%20lull.pdf"}, {"id": "scmp-10", "title": "The CXMT shock: how China's viable alternatives punch Nvidia, Micron, SK Hynix shares", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "China's growing clout in the semiconductor supply chain is accelerating the unravelling of the AI trade as investors anticipate cheaper Chinese alternatives. ChangXin Memory Technologies' US$9.8 billion Shanghai listing surged 466 per cent on debut, making it the mainland's most valuable stock at 3.3 trillion yuan (US$487.3 billion) and sending SK Hynix and Micron shares tumbling. Reports that China will deliver home-made DUV lithography machines this year rattled ASML. Analysts said China's advances promise low-cost substitutes eroding incumbents' margins, turning AI into \"a two-sided trade\". Adding pressure, Moonshot's 2.8-trillion-parameter Kimi K3 nearly matches OpenAI and Anthropic. The Nasdaq 100 nears correction while South Korea's Kospi has shed roughly 40 per cent in a month.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20SCMP/The%20CXMT%20shock%20how%20China%E2%80%99s%20viable%20alternatives%20punch%20Nvidia,%20Micron,%20SK%20Hynix%20shares.pdf"}, {"id": "scmp-11", "title": "US Federal Reserve holds interest rates steady despite Warsh's inflation vow", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Finance & Markets", "Politics"], "summary": "The Federal Reserve held interest rates steady Wednesday, keeping the benchmark in the 3.50-3.75 per cent range, raising questions about how new chief Kevin Warsh will meet his pledge to return inflation to 2 per cent. Three of twelve policymakers - the Cleveland, Dallas and Minneapolis presidents - dissented, preferring a quarter-point hike. Warsh, who took over in May, has said he has \"no tolerance\" for inflation running above target for over five years, pushed higher by Trump's Middle East war and AI-driven data-centre spending. The Fed said activity is \"expanding at a solid pace\". Analysts expect a 25-basis-point hike in September absent a labour-market collapse. Stocks pared losses and the dollar fell after the decision.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20SCMP/US%20Federal%20Reserve%20holds%20interest%20rates%20steady%20despite%20Warsh%E2%80%99s%20inflation%20vow.pdf"}, {"id": "scmp-12", "title": "US sanctions mainland China, Hong Kong shipping firms over Iranian oil deliveries", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Geopolitics", "Trade", "Energy"], "summary": "The United States on Wednesday sanctioned eight mainland Chinese and Hong Kong shipping companies accused of operating vessels that moved Iranian oil to China and the UAE, extending its economic campaign against Tehran alongside a naval blockade. Six of eight identified tankers allegedly carried Iranian crude to China, some transporting millions of barrels during 2026. One firm is mainland-based; five are wholly or partly in Hong Kong. The designations freeze US-jurisdiction assets and expose foreign institutions to secondary sanctions. Treasury Secretary Scott Bessent said Iran's economy was \"in free fall\" with triple-digit inflation. State Department spokesman Tommy Pigott linked the measures to enforcing the blockade and protecting Strait of Hormuz navigation rights, vowing to work with allies to isolate Tehran.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20SCMP/US%20sanctions%20mainland%20China,%20Hong%20Kong%20shipping%20firms%20over%20Iranian%20oil%20deliveries.pdf"}, {"id": "scmp-13", "title": "Why US-led alliance might struggle to rein in Beijing's growing 6G influence", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "As the United States builds a 6G alliance with 24 countries including the UK, Germany and Japan, analysts say Washington faces short-term challenges countering Beijing's growing influence. The Commerce Department initiative aims to coordinate national 6G strategies, share technical resources and build a \"trusted\" supply chain reducing Chinese firms like Huawei, ahead of commercial deployment in the 2030s. 6G is expected to integrate AI, sensing and computing. But researcher Shan Guangcun said China has over 300 key 6G technologies and the world's largest telecoms market, while the US roadmap \"remains less clear\". Natixis economist Alicia Garcia-Herrero called the alliance \"necessary but not sufficient\", saying success depends on concrete spectrum decisions, industrial policy and R&D, not the declaration itself.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Jul%202026/30%20Jul%202026/30%20Jul%20SCMP/Why%20US-led%20alliance%20might%20struggle%20to%20rein%20in%20Beijing%E2%80%99s%20growing%206G%20influence.pdf"}, {"id": "scmp-14", "title": "Why has the China-US profit gap widened on the Fortune Global 500?", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Finance & Markets", "Trade"], "summary": "China's structural economic problems are eroding profits, leaving its multinationals far behind US peers on the latest Fortune Global 500 despite strong revenues. Chinese companies averaged US$4.5 billion profit in 2025, about 40 per cent of the US$11.24 billion for US counterparts. Since 2021, Chinese average profits rose 27 per cent versus 110 per cent for US firms, as American AI leaders accumulated wealth from asset gains. Amazon became the top firm by revenue, ending Walmart's 12-year reign; State Grid ranked third. Alphabet, Nvidia and Apple were most profitable. The 141 US firms generated 47 per cent of total earnings. China's 122 listed firms posted US$10.4 trillion combined revenue, down 2 per cent year on year.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tec
