ing \"limited room\" for further declines. Beijing's transaction value rose 50 per cent and Chengdu's jumped 92.5 per cent. The launch of China's first exchange-traded Reits backed by commercial properties in late June has spurred buying. Pacific Securities predicts the Reits could deliver annual returns of 4.4-5.65 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20SCMP/China%20sees%20flurry%20of%20commercial%20property%20deals%20as%20investors%20sniff%20out%20bargains.pdf"}, {"id": "scmp-07", "title": "China's debt ratio dips as households cut borrowing and firms slash investment: report", "source": "SCMP", "date": "3 Aug 2026", "tags": ["Finance & Markets", "Politics"], "summary": "China's debt-to-GDP ratio fell in the second quarter for the first time since 2022, slipping 1.1 points to 308.2 per cent, the National Institution for Finance and Development said. But the improvement masks private-sector contraction: households cut debt to 57.7 per cent of GDP, mortgage lending shrank for a 13th straight quarter, and private company investment fell 8.5 per cent year on year. The report blamed weak income growth on a \"jobless boom\" of AI-driven investment that boosted growth without jobs, echoing K-shaped economy concerns. Government was the only sector where leverage rose, up to 71 per cent, driven by central government borrowing. The findings came as the Politburo pledged more macroeconomic support after second-quarter real GDP growth slowed to 4.3 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20SCMP/China%E2%80%99s%20debt%20ratio%20dips%20as%20households%20cut%20borrowing%20and%20firms%20slash%20investment%20report.pdf"}, {"id": "scmp-08", "title": "China's forex regulator pledges to open up market, tighten capital oversight", "source": "SCMP", "date": "3 Aug 2026", "tags": ["Finance & Markets", "Politics"], "summary": "China's State Administration of Foreign Exchange pledged to steadily expand institutional opening-up in the forex sector while strengthening monitoring of cross-border capital flows and cracking down on illegal financial activities using AI. Announced Sunday after a Saturday work meeting, SAFE said it would cut hedging costs for SMEs, pilot reforms in the Hainan free-trade port, and advance capital-account opening. Separately, the People's Bank of China pledged to continue a moderately loose monetary policy, support more panda bond issuance, and develop the offshore yuan market by consolidating Hong Kong's role. The statements followed the Politburo's pledge to accelerate fiscal spending amid a slowdown, with second-quarter GDP growth at 4.3 per cent. PBOC governor Pan Gongsheng recently expanded Southbound Bond Connect quotas.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20SCMP/China%E2%80%99s%20forex%20regulator%20pledges%20to%20open%20up%20market,%20tighten%20capital%20oversight.pdf"}, {"id": "scmp-09", "title": "China's offshore yuan hits 3-year high as Beijing signals policy support", "source": "SCMP", "date": "3 Aug 2026", "tags": ["Finance & Markets"], "summary": "China's offshore yuan rose to a fresh three-year high on Friday after the PBOC set the daily fixing stronger than 6.79 per US dollar for three straight days and the Politburo signalled further policy support. The central bank set the midpoint at 6.7894, and the offshore yuan extended its rally to 6.7433, its strongest since February 2023. RBC's Abbas Keshvani said the bank is \"bullish\" on the yuan as a war hedge, noting it has outperformed the Singapore dollar, yen and Swiss franc since the US-Israel war on Iran. The Politburo vowed to step up macroeconomic support and enhance capital-market resilience. Separately, the yen briefly rose over 3 per cent on suspected Japanese intervention, trading at 160.476 per dollar by Friday afternoon.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20SCMP/China%E2%80%99s%20offshore%20yuan%20hits%203-year%20high%20as%20Beijing%20signals%20policy%20support.pdf"}, {"id": "scmp-10", "title": "Chinese police AI algorithm tracks bitcoin money laundering with 90% accuracy", "source": "SCMP", "date": "3 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Researchers from the People's Public Security University of China, affiliated with the Ministry of Public Security, have developed an AI framework that detects illicit cryptocurrency transactions with nearly 90 per cent accuracy, according to a May study in the Journal of Intelligence. The system combines a dynamic graph neural network, a memory module retrieving historical illicit patterns, and a large language model that generates natural-language risk assessments, scores and reasoning chains. Tested on the public Elliptic bitcoin dataset of 203,769 nodes, it achieved 89.4 per cent overall accuracy, 89.1 per cent precision and 64.5 per cent recall. Corresponding author Dr Sun Jingchao said it offers a \"precise, generalisable and interpretable\" solution. In 2025 prosecutors indicted 3,259 people for crypto-linked money laundering.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20SCMP/Chinese%20police%20AI%20algorithm%20tracks%20bitcoin%20money%20laundering%20with%2090%25%20accuracy.pdf"}, {"id": "scmp-11", "title": "China's military goal is to stand neck and neck with the US: ex-PLA colonel Zhou Bo", "source": "SCMP", "date": "3 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "Retired PLA senior colonel Zhou Bo, now a Tsinghua University fellow, discussed the PLA's centenary goals in an interview. China aims to basically modernise its national defence by 2035 and build a world-class military by 2049, meaning the PLA will not be fully modernised at its 2027 centenary. Zhou said the ultimate 2049 objective is \"to stand neck and neck with the United States.\" He noted China's defence budget is about a quarter of America's but 1.8 times Russia's, with the world's largest armed forces and navy. China faces a peacetime dilemma, unable to verify weapons in real combat, but he cited successful missile launches and Pakistan's use of Chinese jets against India as proof of capability. He argued anti-corruption efforts strengthen rather than weaken the PLA.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20SCMP/ExclusiveChina%E2%80%99s%20military%20goal%20is%20to%20stand%20neck%20and%20neck%20with%20the%20US%20ex-PLA%20colonel%20Zhou%20Bo.pdf"}, {"id": "scmp-12", "title": "Hong Kong, CSRC deepen financial ties ahead of first yuan bond futures launch", "source": "SCMP", "date": "3 Aug 2026", "tags": ["Finance & Markets", "Politics"], "summary": "Hong Kong Chief Executive John Lee met China Securities Regulatory Commission chairman Wu Qing at Government House to discuss deepening mutual market access, ahead of Monday's debut of China's first yuan-denominated five-year bond futures on the Hong Kong stock exchange. Lee said the product would provide an \"effective\" offshore risk-management tool and help attract international investors to the mainland bond market and Chinese treasury bonds, describing it as a key step consolidating Hong Kong's status as the world's offshore renminbi hub. He said the government was drafting the city's first five-year development plan and would deepen cooperation through Stock Connect, Bond Connect and Cross-boundary Wealth Management Connect. Financial Secretary Paul Chan and SFC officials attended the meeting.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20SCMP/Hong%20Kong,%20CSRC%20deepen%20financial%20ties%20ahead%20of%20first%20yuan%20bond%20futures%20launch.pdf"}, {"id": "scmp-13", "title": "How sell-off at flashy AI-focused US hedge fund is a wake-up call for Chinese investors", "source": "SCMP", "date": "3 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "The collapse of US hedge fund Situational Awareness, whose portfolio value plunged 67 per cent in July, has served as a warning to Chinese tech investors about leverage. The fund, founded in 2024 by former OpenAI researcher Leopold Aschenbrenner and once worth US$45 billion, bet heavily on AI supply-chain stocks like SK Hynix, SanDisk and Nebius using bank loans, then offloaded billions to Citadel at a discount after failing to meet collateral demands. Shanghai analysts urged investors: \"Don't use leverage!\" One Shanghai investor who borrowed to buy AI and chip stocks said his gains were \"all been wiped out,\" paying 8 per cent margin interest. Experts remain divided on whether AI is a bubble; a BofA survey found 23 per cent of clients rank it their top concern.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20SCMP/How%20sell-off%20at%20flashy%20AI-focused%20US%20hedge%20fund%20is%20a%20wake-up%20call%20for%20Chinese%20investors.pdf"}, {"id": "scmp-14", "title": "Iran's foreign minister warns of any 'adventurous action' by US", "source": "SCMP", "date": "3 Aug 2026", "tags": ["Geopolitics", "Energy", "Defence"], "summary": "Iran warned against any \"adventurous action\" by the US and said it would retaliate decisively if American forces act on President Trump's threats of fresh attacks. Foreign Minister Abbas Araqchi conveyed the message in weekend phone calls with Turkish, Pakistani and Saudi officials, hours after Kuwait's army said it destroyed hostile Iranian drones targeting vital facilities. Iran-affiliated Nournews said US strikes on Iranian energy infrastructure would trigger Iranian attacks on Gulf oilfields. Trump said he was losing faith in negotiations but believed a deal was still possible. Oil has stayed high since US and Israeli strikes on Iran began February 28, with Brent up 24 per cent in July. Iranian attack risks have deterred shipping through the Strait of Hormuz, while incidents were reported off Oman.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20SCMP/Iran%E2%80%99s%20foreign%20minister%20warns%20of%20any%20%E2%80%98adventurous%20action%E2%80%99%20by%20US.pdf"}, {"id": "scmp-15", "title": "New Zealand seals trio of Pacific defence pacts to counter China's reach", "source": "SCMP", "date": "3 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "New Zealand has sealed three major Pacific security agreements in under four months, driven by concerns over China's expanding security and policing links. Since April, Wellington signed a defence pact with Papua New Guinea, a security declaration with the Cook Islands, and floated joining an Australia-Fiji defence alliance. Analysts say the campaign aims to prevent China establishing security agreements with Pacific states, following Beijing's 2022 pact with Solomon Islands. University of Waikato's Estelle Denton-Townshend said Beijing's defence influence risked leaving Wellington \"more vulnerable to coercion.\" Otago's Robert Patman cited growing doubts about US reliability under Trump's erratic tariff policies, which have opened space for Beijing. New Zealand also held its first high-level security exchanges with the EU in May.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20SCMP/New%20Zealand%20seals%20trio%20of%20Pacific%20defence%20pacts%20to%20counter%20China%E2%80%99s%20reach.pdf"}, {"id": "scmp-16", "title": "OpenAI blinks in face-off with Chinese rivals, drops pricing for some models up to 80%", "source": "SCMP", "date": "3 Aug 2026", "tags": ["Technology & AI", "Trade"], "summary": "OpenAI has launched an aggressive price war against lower-cost Chinese rivals, slashing pricing for its GPT-5.6 line-up by up to 80 per cent. CEO Sam Altman announced the lightweight GPT-5.6 Luna's developer pricing dropped to US$0.20 per million input tokens and US$1.20 per million output tokens, while mid-tier Terra fell 20 per cent and flagship Sol gained a faster mode. The cuts propelled Luna to the \"most attractive\" tier in Artificial Analysis intelligence-per-dollar rankings, above Zhipu AI's GLM-5.2 and MiniMax's M3. The move follows Moonshot AI's launch of open-weight Kimi K3, which outperformed GPT-5.6 Sol and Anthropic's Claude on web-development benchmarks. Jefferies said cost-efficiency is now a key competitive metric, with US cuts narrowing the historic gap to Chinese models.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20SCMP/OpenAI%20blinks%20in%20face-off%20with%20Chinese%20rivals,%20drops%20pricing%20for%20some%20models%20up%20to%2080%25.pdf"}, {"id": "scmp-17", "title": "Pain or gain? US moves to decouple its defence industry from China's rare earths", "source": "SCMP", "date": "3 Aug 2026", "tags": ["Defence", "Trade", "Geopolitics"], "summary": "A US executive order signed by Trump on July 20 requires major arms manufacturers to trace multi-tier supply chains and phase out Chinese rare earths, tightening conditions for Pentagon waivers on defence-critical imports from China, Russia, Iran and North Korea. From next year, routine exemptions will end and contractors must submit mitigation plans proving \"exhaustive efforts\" to source compliant materials, with supply-chain mapping required within 180 days. China controls about 90 per cent of processed rare earths and two-thirds of mining capacity. Analysts described the directive as an overdue enforcement crackdown inflicting \"short-term contractor pain for long-term national security gain,\" though full traceability faces obstacles from China's midstream refining. Notre Dame's Eugene Gholz said market adjustments are manageable and unlikely to compromise readiness.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20SCMP/Pain%20or%20gain%20US%20moves%20to%20decouple%20its%20defence%20industry%20from%20China%E2%80%99s%20rare%20earths.pdf"}, {"id": "scmp-18", "title": "Politburo meeting signals cautious confidence in China's economy", "source": "SCMP", "date": "3 Aug 2026", "tags": ["Politics", "Finance & Markets"], "summary": "This SCMP editorial reads the midyear Politburo meeting as signalling cautious confidence, with policymakers choosing a steady, targeted approach over broad-based stimulus. Fiscal support will focus on hi-tech emerging sectors such as AI and semiconductors rather than real estate, while infrastructure investment shifts to power grids, computing grids and data networks. Beijing is signalling a more conciliatory trade stance to ease \"China shock 2.0\" concerns from partners like the EU, as growth remains sustained by a record trade surplus. China unveiled its first stand-alone five-year consumption plan targeting 60 trillion yuan in retail sales by 2030. The editorial argues Hong Kong must align with Beijing's hi-tech self-sufficiency and balanced-trade priorities, sustaining its \"superconnector\" role, ahead of next year's leadership reshuffle.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20SCMP/Politburo%20meeting%20signals%20cautious%20confidence%20in%20China%E2%80%99s%20economy.pdf"}, {"id": "scmp-19", "title": "Price war fears grip China's EV market after woeful July sales figures", "source": "SCMP", "date": "3 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Fears of another brutal price war have intensified in China's EV sector after three premium carmakers reported weak July sales amid an economic slowdown. Xpeng deliveries fell 5.2 per cent from June to 38,027, ending a four-month streak; Nio dropped 11.5 per cent to 35,934; and Li Auto logged a fourth straight monthly decline to 30,468. BYD and Geely posted month-on-month upticks but were down 9 and 29.1 per cent year on year respectively. First-half mainland EV deliveries plunged 14 per cent to 4.7 million units as Beijing pared subsidies. AlixPartners predicts full-year deliveries falling 10 per cent to 24.6 million units. Carmakers selling 100,000-yuan vehicles now make just 1,500 yuan on average, a 1.5 per cent margin, down from 3.4 per cent in May.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20SCMP/Price%20war%20fears%20grip%20China%E2%80%99s%20EV%20market%20after%20woeful%20July%20sales%20figures.pdf"}, {"id": "scmp-20", "title": "The international hotel chains targeting China's value-driven travellers", "source": "SCMP", "date": "3 Aug 2026", "tags": ["Society", "Finance & Markets"], "summary": "Global hotel groups are expanding into China's midscale and upper-midscale segments as price-sensitive travellers seek value without sacrificing brand trust. One 24-year-old graduate was surprised to find a Hampton by Hilton in Shenzhen for about 600 yuan (US$89) a night. First-quarter domestic tourist trips reached 1.90 billion generating 1.86 trillion yuan in spending, but average spending per trip slipped to about 980 yuan amid a property downturn and weak job market. Hilton is bringing Tempo to the mainland and doubling its lifestyle presence; Marriott launched Series by Marriott; IHG opened its first Garner hotel; and Hyatt partnered with Dossen. Consultant Zhou Mingqi warned that domestic players like Atour and H World, with strong local networks and loyalty, add competitive uncertainty as global chains move downmarket.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20SCMP/The%20international%20hotel%20chains%20targeting%20China%E2%80%99s%20value-driven%20travellers.pdf"}, {"id": "scmp-21", "title": "Trump faces ethics storm for 'pimping' fast access to his Truth Social posts", "source": "SCMP", "date": "3 Aug 2026", "tags": ["Politics", "Finance & Markets"], "summary": "President Trump's Truth Social began selling Wall Street traders sneak peeks of his market-moving posts on Saturday, raising insider-trading and ethics concerns. Dubbed Truth API, the service offers fast feeds of posts that regularly move markets on tariffs, war and central bank leadership. Critics warned it enables high-frequency traders to profit from advance knowledge; Able Alpha's Irene Aldridge said if a public-company CEO did this \"this would be jail time.\" Trump Media, whose stock has plunged 75 per cent since he took office, could double its US$3.7 million annual revenue if just three firms pay the US$100,000 monthly fee. The company said posts are released to traders and the public simultaneously, but critics call that a red herring. Senator Elizabeth Warren vowed investigations if Democrats take Congress.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20SCMP/Trump%20faces%20ethics%20storm%20for%20%E2%80%98pimping%E2%80%99%20fast%20access%20to%20his%20Truth%20Social%20posts.pdf"}, {"id": "scmp-22", "title": "Trump says US hasn't agreed to Ukraine building Patriot missiles", "source": "SCMP", "date": "3 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "President Trump said on Friday that the US has not agreed to Ukraine building Patriot missiles, though talks are ongoing, walking back an earlier pledge to grant Kyiv a manufacturing licence. Speaking at a Camp David cabinet meeting, Trump said the US must be \"very careful about letting somebody build them,\" citing concerns about sharing advanced missile technology that recipients \"can someday turn on you.\" He had told Ukrainian President Volodymyr Zelensky in Turkey he would provide a licence, surprising many, but has since backed away despite hosting Zelensky at the White House. Ukraine has run chronically low on Patriots, its only weapon capable of downing ballistic missiles, and has long sought a PAC-3 co-production deal. Lockheed Martin executives are planning to visit Ukraine soon.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20SCMP/Trump%20says%20US%20hasn%E2%80%99t%20agreed%20to%20Ukraine%20building%20Patriot%20missiles.pdf"}, {"id": "scmp-23", "title": "What a visit to China's AI labs reveals about the battle for global soft power", "source": "SCMP", "date": "3 Aug 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "In this first-person account of touring AI labs, tech firms and think tanks across Shanghai and Hangzhou, the writer argues the China-US technology contest has evolved beyond chips and models into a struggle over soft power and the power to dictate AI's rules and ethics. Beijing recently unveiled the World Artificial Intelligence Cooperation Organisation, courting the Global South, while Moonshot AI released the 2.8-trillion-parameter open-weight Kimi K3. Fudan's Dai Jiarun argued \"openness is not the fundamental aspect of AI risk.\" Researchers warned that fracturing the global AI community erodes shared standards, and cited rising visa denials for Chinese PhD candidates. At Ant Group, model-safety head Wang Weiqiang described governing through development. Washington and Beijing were expected to hold formal AI talks in September.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20SCMP/What%20a%20visit%20to%20China%E2%80%99s%20AI%20labs%20reveals%20about%20the%20battle%20for%20global%20soft%20power.pdf"}, {"id": "scmp-24", "title": "Why US, EU curbs on Chinese power inverters risk upending green supply chains", "source": "SCMP", "date": "3 Aug 2026", "tags": ["Energy", "Trade", "Geopolitics"], "summary": "A US ban on new foreign-made connected power inverters has aligned Washington with Brussels in pushing Chinese suppliers off Western grids, a shift analysts warn will be neither quick nor painless in a market China dominates. Announced last week citing national security, the restriction most affects Chinese suppliers, who supplied about a third of American inverter imports in 2024. Huawei and Sungrow together hold about 55 per cent of the global solar inverter market. Analysts are divided over whether the moves reflect genuine cybersecurity risks or geopolitics; Natixis's Alicia Garcia-Herrero cited reports of undocumented communication modules. China holds about 80 per cent of world inverter production capacity, versus 8 per cent in Europe. Chinese inverter exports rose 30.7 per cent to US$5.53 billion in the first half of 2026.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/03%20Aug%202026/03%20Aug%20SCMP/Why%20US,%20EU%20curbs%20on%20Chinese%20power%20inverters%20risk%20upending%20green%20supply%20chains.pdf"}]}, "2026-08-04": {"date": "2026-08-04", "dayOfWeek": "Tuesday", "totalArticles": 54, "sourceCounts": {"WSJ": 11, "ST": 11, "BT": 13, "SCMP": 19}, "executiveDigest": "The AI trade wobbled: OpenAI cut ChatGPT prices on customer-cost concerns, Big Tech earnings split valuations, and ST asked whether the AI boom will unwind - even as China's DeepSeek V4 'jolted Silicon Valley' and Alibaba's new Qwen was pitched as rivalling Anthropic's Fable. Trump pivoted back to diplomacy on Iran as OPEC raised output a sixth straight time, and Singapore neared a demographic turning point - 2025 births barely exceeded deaths - while its PMI edged up to 51.4 and reserves delivered returns through the volatility.", "briefingCards": [{"title": "Lead story - The AI trade wobbles", "body": "The market's central question became whether the AI trade is about to unwind: ST asked outright, WSJ found 'Big Tech earnings are sending valuations in opposite directions', and OpenAI cut ChatGPT prices as Sam Altman cited customer cost concerns. Yet WSJ argued America is 'great at creating stock-market bubbles - and shrugging them off', and that 'Wall Street thinks it knows how tech giants will make AI pay'. The competitive centre of gravity kept shifting east: China's DeepSeek beefed up agentic AI with a V4 model that 'jolted Silicon Valley', Alibaba released a new Qwen model pitched as rivalling Anthropic's Fable, and BT warned Asia is becoming 'a self-supporting AI ecosystem' that Western firms are missing."}, {"title": "Markets & finance", "body": "Currencies and rates set the tone: the yen rose sharply against the Singdollar amid speculation of more intervention, and BT said firmer rates and wealth gains should lift Singapore banks' Q2 results. Temasek Financial priced a S$750 million 10-year Singapore-dollar bond at a 2.65% yield, and Singapore's reserves 'delivered returns amid market volatility'. Risk appetite cooled in China - stock traders cut leveraged positions 14% in July amid a tech sell-off - even as Chinese brokers forecast an A-share tech and chip rebound. South Korea tightened its grip on high-risk ETFs as investor losses mounted, and AstraZeneca and Bristol Myers Squibb were reported in talks on a US$512 billion mega-deal."}, {"title": "Asia realignment", "body": "The US-China contest sharpened across tech and defence: analyst Lyle Goldstein called it 'surprising' how quickly China's military is closing the gap, China's military unveiled an AI system to plan and coordinate mass air strikes, and the US signed a deal to boost Patriot and THAAD missile-parts production. SCMP asked whether Silicon Valley's lobbying could breed 'mutual suspicion', while BT argued Washington's ban on new Chinese robots 'could backfire'. Democratic US states sued to challenge Trump's latest tariffs, the State Department was said to be closing consulates in Canada, Japan and Indonesia, and WuXi AppTec's earnings surged despite US scrutiny."}, {"title": "Energy & climate", "body": "Trump 'pivoted back to diplomacy as an Iran victory eluded him', calling it Tehran's 'last chance' to strike a deal; Iran denied it was negotiating, and an economist warned the war could still alter Beijing's policy calculus. OPEC and its allies raised oil output for a sixth straight time, yet BT cautioned the global oil cushion 'isn't really hitting tank bottoms', and an Italian-led EU force boarded a sanctioned tanker from Russia's 'shadow fleet' in the Mediterranean. On climate, China is working towards 100% renewable power at its Antarctic bases by 2035, while experts warned against reading a warming China as a return to a Tang-dynasty 'golden age'."}, {"title": "Technology & AI", "body": "Beyond OpenAI's price cuts, the frontier race intensified: DeepSeek's V4 and Alibaba's new Qwen underscored China's fast-closing capabilities, and the US invited its tech giants to the White House to discuss AI security tests. BT profiled how AI and chips are turning Malaysia into 'Asia's growth standout' and argued Asia's self-supporting AI ecosystem is leaving Western firms out, while OCBC tapped Beijing's ZGC to capture Chinese tech interest in ASEAN. WSJ chronicled 'the rise of million-dollar companies with just one employee' - a sign of AI leverage - even as it insisted Wall Street can see how the hyperscalers will eventually make AI pay."}, {"title": "Singapore & SEA focus", "body": "Singapore neared a demographic turning point as 2025 births barely exceeded deaths, and more rental options are being studied for young Singaporeans. The economy held up: the PMI edged up to 51.4 in July despite Middle East supply-chain pressures, reserves delivered returns through the volatility, and banks' Q2 results should get a lift. Chan Chun Sing urged ASEAN to share data to boost growth, BT mapped how Singapore can lead in green finance and 'turn constraints into assets' amid global fragmentation, and OCBC deepened China-ASEAN tech links via ZGC - even as ST weighed whether the region-wide AI trade will unwind."}], "keyMetrics": [{"value": "54", "label": "Articles curated today", "sub": "WSJ 11 · ST 11 · BT 13 · SCMP 19"}, {"value": "Will it unwind?", "label": "The AI trade wobbles", "sub": "OpenAI cuts ChatGPT prices"}, {"value": "51.4", "label": "Singapore PMI (July)", "sub": "Edges up despite supply pressures"}, {"value": "Turning point", "label": "SG demographics", "sub": "2025 births barely top deaths"}, {"value": "S$750m", "label": "Temasek Financial bond", "sub": "10-year at 2.65% yield"}, {"value": "Diplomacy", "label": "Trump pivots on Iran", "sub": "OPEC lifts output 6th time"}], "articles": [{"id": "wsj-01", "title": "America Is Great at Creating Stock Market Bubbles-and Shrugging Them Off", "source": "WSJ", "date": "4 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Columnist James Mackintosh argues US markets now inflate and pop mini-bubbles rapidly yet keep rising. The memory-chip bubble ballooned and burst in four months, wiping out trillions and sinking a hedge fund, yet the S&P 500 sits just 1.6% below its record and the equal-weighted index hit a new high. He attributes recurring booms to easy money, the gambling instinct, gamified zero-fee trading and technological hope, from crypto to clean energy. Because most bubbles were not debt-financed, bursts spared the banking system. He warns AI is different: an estimated $7 trillion in data-center spending, increasingly debt-funded, could damage the economy and hit finance if productivity gains disappoint.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20WSJ/America%20Is%20Great%20at%20Creating%20Stock%20Market%20Bubbles-and%20Shrugging%20Them%20Off.pdf"}, {"id": "wsj-02", "title": "Big Tech Earnings Are Sending Valuations in Opposite Directions", "source": "WSJ", "date": "4 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Big Tech earnings split sharply, exposing churn beneath calm indexes. Microsoft jumped 16%, adding roughly $450 billion in the largest one-day US market-cap gain ever, while Apple slid 7.4% on a weak forecast and Meta fell 8% on negative free-cash-flow projections. Amazon surged 15% on accelerating cloud sales. The Nasdaq dropped 3.2% in July as investors demanded proof of returns on AI spending. New Fed chairman Kevin Warsh implied a near-term rate rise might be unneeded, sparking a selloff; the 30-year Treasury yield hit a 19-year high. Analysts warn sustained higher yields and Middle East oil risks could drag stocks, though S&P earnings growth near 47% offers a tailwind.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20WSJ/Big%20Tech%20Earnings%20Are%20Sending%20Valuations%20in%20Opposite%20Directions.pdf"}, {"id": "wsj-03", "title": "California Billionaire Tax Wins Support From State Democratic Party", "source": "WSJ", "date": "4 Aug 2026", "tags": ["Politics", "Finance & Markets"], "summary": "California's Democratic Party endorsed a proposed billionaire tax, clearing the 60% threshold at a San Diego executive-board meeting three months before the November vote. The measure, Prop 40, would impose a one-time 5% levy on the state's roughly 200 billionaires, raising an estimated $100 billion aimed largely at offsetting Trump administration healthcare cuts. Proposed by healthcare union SEIU-UHW, it has split Democrats: Gov. Gavin Newsom and candidate Xavier Becerra oppose it, warning wealthy residents could flee, while Sen. Bernie Sanders and Rep. Ro Khanna back it. The No on Prop 40 campaign, funded by medical groups, paid about $7,000 covering costs for some voting board members, calling the tax bad for the economy.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20WSJ/California%20Billionaire%20Tax%20Wins%20Support%20From%20State%20Democratic%20Party.pdf"}, {"id": "wsj-04", "title": "High-Stakes Michigan Primary Tests Progressive Clout and the Democratic Direction", "source": "WSJ", "date": "4 Aug 2026", "tags": ["Politics", "Society"], "summary": "Tuesday's Democratic Senate primary in Michigan pits progressive former public-health official Abdul El-Sayed against four-term Rep. Haley Stevens, testing whether a socialist groundswell has reached the heartland. The tossup seat, vacated by Sen. Gary Peters, is critical to Democrats' hopes of netting four seats to flip the Senate. El-Sayed, backed by Sanders, Ocasio-Cortez, Omar and the UAW, is aligned with the Democratic Socialists of America, which Republicans brand \"communism.\" Stevens, backed by Schumer, Whitmer and pro-Israel groups, casts herself as a workhorse. Spending is lopsided: Stevens's side spent $61 million versus $6.5 million for El-Sayed, with an Aipac-linked group the biggest spender at $30 million. Republicans are set to nominate Mike Rogers.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20WSJ/High-Stakes%20Michigan%20Primary%20Tests%20Progressive%20Clout%20and%20the%20Democratic%20Direction.pdf"}, {"id": "wsj-05", "title": "Homeowners Say Mamdani's New Tax Rollout Wrongly Targets Them", "source": "WSJ", "date": "4 Aug 2026", "tags": ["Politics", "Society"], "summary": "New York City's rollout of a pied-a-terre tax championed by Mayor Zohran Mamdani has drawn complaints that longtime residents are being wrongly targeted. The tax applies to second homes worth $5 million or more, funding affordability pledges like city-owned grocery stores and free buses. But the city released a list of about 960,000 properties, far above the roughly 10,000 second homes Gov. Kathy Hochul's office estimated would be taxed, publishing owners' names, addresses and valuations. Some 17,000 owners received notices; about 3,800 have begun exemption applications. Residents like 82-year-old, blind Bob Ohlerking, billed a $44,048 surcharge, faced broken websites and confusion. Officials cited outdated records; critics questioned whether the city can administer the tax competently.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20WSJ/Homeowners%20Say%20Mamdani%E2%80%99s%20New%20Tax%20Rollout%20Wrongly%20Targets%20Them.pdf"}, {"id": "wsj-06", "title": "OPEC, Allies Increase Oil Output for Sixth Time in a Row", "source": "WSJ", "date": "4 Aug 2026", "tags": ["Energy", "Geopolitics"], "summary": "Seven OPEC+ members agreed Sunday to raise output by about 188,000 barrels a day in September, a sixth straight monthly increase completing the phased unwinding of 1.65 million barrels a day of voluntary cuts from 2023. Participants include Saudi Arabia, Russia, Iraq, Kuwait, Algeria, Kazakhstan and Oman; the UAE left OPEC earlier this year. Separate 2022 cuts of about 2 million barrels a day remain through year-end. Analysts warn Persian Gulf supply disruptions from the Iran war could prevent hikes from fully materializing. OPEC+ is reviewing capacity to set 2027 baselines, complicated by conflict. Oil posted its largest monthly gain since March; Houthi Red Sea attacks threatened the Bab al-Mandeb strait. Producers meet again September 6.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20WSJ/OPEC,%20Allies%20Increase%20Oil%20Output%20for%20Sixth%20Time%20in%20a%20Row.pdf"}, {"id": "wsj-07", "title": "OpenAI Cuts ChatGPT Prices as Sam Altman Cites Customer Cost Concerns", "source": "WSJ", "date": "4 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "OpenAI is cutting ChatGPT prices as it races to retain users amid intensifying competition. The company, which has over one billion active users and two million businesses, lowered the price of GPT-5.6 Luna by 80% and GPT-5.6 Terra by 20%. CEO Sam Altman said costs had become an increasingly big issue for customers, with business users shying away from high AI usage prices. OpenAI framed the cuts as expanding useful work and adoption: \"When the cost of useful intelligence falls, more work becomes worth doing.\" It faces pressure from rival Anthropic, whose private-market valuation now exceeds OpenAI's. The cuts could erode margins while the company operates at a loss, spending billions to advance its models.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20WSJ/OpenAI%20Cuts%20ChatGPT%20Prices%20as%20Sam%20Altman%20Cites%20Customer%20Cost%20Concerns.pdf"}, {"id": "wsj-08", "title": "The Democrats' Biggest Donors Have Gone on Strike", "source": "WSJ", "date": "4 Aug 2026", "tags": ["Politics", "Finance & Markets"], "summary": "Months before the midterms, major Democratic donors have pulled back from the party's central committee. George Soros and son Alex, who gave the DNC over $1 million in 2022, have given nothing this year; LinkedIn co-founder Reid Hoffman has also withheld money. Donors cite disillusionment, frustration over 2024 spending when Kamala Harris raised over $1 billion yet lost, and divisions over Gaza and Democratic socialists. Democratic committees and super PACs trail Republicans broadly. Critics, including Rufus Gifford, urged DNC Chairman Ken Martin to resign. Yet donors still fund star candidates: Texas Senate hopeful James Talarico raised $55 million versus Ken Paxton's $4 million, and Sen. Jon Ossoff raised $34 million, much from small online donors.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20WSJ/The%20Democrats%E2%80%99%20Biggest%20Donors%20Have%20Gone%20on%20Strike.pdf"}, {"id": "wsj-09", "title": "The Rise of Million-Dollar Companies With Just One Employee", "source": "WSJ", "date": "4 Aug 2026", "tags": ["Technology & AI", "Society"], "summary": "AI is enabling solo entrepreneurs to run million-dollar businesses without staff. Ben Broca launched an AI-tools company last December, added 10,000 paying customers and is on track for $10 million in revenue, using AI to handle emails, coding, customer requests and refunds. Stripe data show thousands of solo operators topping $1 million in revenue, their ranks doubling from 2023 to 2025, while those crossing $10 million nearly tripled. Census data show information-sector business applications up nearly 45%, even as hiring plans fall sharply. Costs remain a hurdle; Broca switched to free Chinese open-source models after losing money on Anthropic's Claude. A Harvard study of 50,000 startups found AI-focused firms operate with 25% fewer employees, raising labor-market questions.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20WSJ/The%20Rise%20of%20Million-Dollar%20Companies%20With%20Just%20One%20Employee.pdf"}, {"id": "wsj-10", "title": "Trump Pivots Back to Diplomacy as Iran Victory Eludes Him", "source": "WSJ", "date": "4 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "After days of threatening a new offensive, President Trump pivoted back to diplomacy over Iran, saying talks would begin Monday to reopen the Strait of Hormuz and lay groundwork for nuclear negotiations. He said he had been set to launch the biggest attack since World War II but was talked down by allies after speaking with Saudi Crown Prince Mohammed bin Salman. The five-month war has killed 18 US service members, pushed up gasoline prices and forced draws on oil reserves, with Iran attacking allies in Jordan, Bahrain and Kuwait. Iran's foreign minister said talks with Oman on ship transits were \"nearing completion.\" Critics, including Vali Nasr and Daniel Shapiro, say Trump lacks a clear path to declare victory.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20WSJ/Trump%20Pivots%20Back%20to%20Diplomacy%20as%20Iran%20Victory%20Eludes%20Him.pdf"}, {"id": "wsj-11", "title": "Wall Street Thinks It Knows How Tech Giants Will Make AI Pay", "source": "WSJ", "date": "4 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Wall Street increasingly sees cloud computing as the clearest path for Big Tech to profit from massive AI spending. Unlike chatbot ads or model subscriptions, the cloud model is well understood: firms buy gear and rent it out, recouping costs over years. Amazon Web Services posted a 39% operating margin and 37% quarterly revenue growth, beating expectations; CEO Andy Jassy suggested AWS could eventually reach $1 trillion in annual revenue. Microsoft's Azure grew 43% and Alphabet's cloud unit 82%; Microsoft and Amazon added about $950 billion in market value. AWS signed a $100 billion, 10-year contract with Anthropic. Risks remain if the AI bubble bursts. Meta, lacking a cloud business, is weighing launching one but starts far behind.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20WSJ/Wall%20Street%20Thinks%20It%20Knows%20How%20Tech%20Giants%20Will%20Make%20AI%20Pay.pdf"}, {"id": "st-01", "title": "AI trade: Will it unwind?", "source": "ST", "date": "4 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "With the semiconductor index down more than 20 per cent in a month, investors are questioning whether the AI trade could unwind, writes UBS's Tan Min Lan. The four largest US hyperscalers may spend about US$730 billion on AI capex in 2026, and global AI investment could reach US$1.2 trillion by 2027, yet cash capex will exceed operating cash flow for some giants by end-2026. She argues the supercycle stays intact: intensifying competition from Chinese open-weight models like Kimi K3, plus sovereign AI demand (already about one-third of compute), should sustain spending. She favours a barbell approach, preferring semiconductor capital equipment and foundries alongside defensive tech, while warning of \"capex taper tantrum\" risk and eyeing 2028 as potential capex digestion.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20ST/AI%20trade%20Will%20it%20unwind.pdf"}, {"id": "st-02", "title": "ASEAN should share data to boost growth: Chan Chun Sing", "source": "ST", "date": "4 Aug 2026", "tags": ["Southeast Asia", "Trade"], "summary": "Cooperation on data sharing, energy and finance could propel ASEAN's economic activities, Defence Minister Chan Chun Sing said on Aug 3 at the SIIA's 18th ASEAN and Asia Forum. He described data as \"the new lubricant for the future economy\", noting that unlike perishable oil it can be shared to generate more insights, products and services. ASEAN, potentially the world's fourth-largest economic entity by 2030, must overcome \"data protectionism\", he said. Chan cited ambitions for a fully integrated regional electricity grid by 2045, several members being potential renewable energy superpowers, and greater financial integration without a common currency. Transport Minister Jeffrey Siow said Singapore hopes to liberalise air services and boost port cooperation when it takes ASEAN chairmanship in 2027.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20ST/ASEAN%20should%20share%20data%20to%20boost%20growth%20Chan%20Chun%20Sing.pdf"}, {"id": "st-03", "title": "Foreign tourists' spending in South Korea surges with medical travel boom", "source": "ST", "date": "4 Aug 2026", "tags": ["Society", "Finance & Markets"], "summary": "Spending by foreign tourists in South Korea surged in the first half of 2026, driven by rebounding Chinese visitors and rapid growth in medical tourism, BC Card said on Aug 3. Analysing 3.3 million foreign-issued cards, it found total spending rose 53.6 per cent year on year, with transactions up 40.3 per cent. Chinese cardholders rose 56.6 per cent, ahead of Singapore, Taiwan and Japan; Chinese spending jumped 82.7 per cent. Medical-service spending nearly doubled, up 98 per cent, with Seoul accounting for 92.8 per cent. Dermatology overtook plastic surgery at 67.5 per cent of medical spending, and pharmacy spending soared 1,176.9 per cent. \"Medical tourism is expected to emerge as a new growth engine,\" BC Card said.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20ST/Foreign%20tourists'%20spending%20in%20South%20Korea%20surges%20with%20medical%20travel%20boom.pdf"}, {"id": "st-04", "title": "Iran denies negotiating with US", "source": "ST", "date": "4 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "Iran denied that negotiations with the United States were under way, contradicting President Donald Trump, who said new talks would begin on Aug 3 to end a war now in its sixth month. Washington and Tehran have been at war since Feb 28, when US and Israeli strikes hit Iran. Foreign Ministry spokesman Esmaeil Baghaei said Iran's only negotiations are with Oman over passage through the Strait of Hormuz, a key sticking point where Iran obstructs vessels and demands control and fees the US rejects. Trump said the talks would cover Hormuz and Iranian denuclearisation, and claimed Gulf states asked him to hold off strikes. A previous ceasefire collapsed in July; lawmakers said mediators are reviving a June memorandum.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20ST/Iran%20denies%20negotiating%20with%20US.pdf"}, {"id": "st-05", "title": "Italian-led EU force boards sanctioned tanker from Russia's 'shadow fleet' in Mediterranean", "source": "ST", "date": "4 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "An Italian-led EU naval mission boarded the Toa Payoh, a tanker under EU sanctions, on Aug 2 west of the Sicilian island of Pantelleria, the second such operation in under two weeks as Europe scrutinises Russia's \"shadow fleet\". Italy's Defence Ministry said the vessel, sailing from Benin to Istanbul, had switched to a Cameroon registry only last week; the inspection verified whether it was entitled to fly that flag. Operation EUNAVFOR MED Irini lacked authority to seize the ship, so it was not detained, but gathered documents could support later sequestration. Italian military personnel boarded by helicopter after the captain failed to cooperate. The two-hour inspection had Greek and Polish support. It followed the July 20 boarding of the MV South Star.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20ST/Italian-led%20EU%20force%20boards%20sanctioned%20tanker%20from%20Russia's%20'shadow%20fleet'%20in%20Mediterranean.pdf"}, {"id": "st-06", "title": "More rental options being studied for young S'poreans", "source": "ST", "date": "4 Aug 2026", "tags": ["Society", "Politics"], "summary": "More rental housing options, including co-living, long-stay serviced apartments and Build-To-Rent models, could come to market as the Government meets younger Singaporeans' demand for flexible accommodation, National Development Minister Chee Hong Tat said on Aug 3. Speaking at the opening of Mber Co-Living and Serviced Apartments in Serangoon, he said home ownership remains a key tenet of the social compact, but many young people want to rent before buying. Long-stay serviced apartments piloted in 2023, and a July 2026 independent living initiative under the SG Youth Plan offers over 100 subsidised units to those aged 21 to 35. Chee said rejuvenating older estates should honour heritage; Mber sits on the former Lim Tua Tow Market site, its tiered design echoing old shophouses.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20ST/More%20rental%20options%20being%20studied%20for%20young%20S'poreans.pdf"}, {"id": "st-07", "title": "Pharma giants AstraZeneca, Bristol Myers Squibb in talks on $512 billion mega deal: Report", "source": "ST", "date": "4 Aug 2026", "tags": ["Finance & Markets"], "summary": "Britain's AstraZeneca and US-based Bristol Myers Squibb held preliminary talks about a possible combination worth nearly US$400 billion (S$512 billion), a person familiar told Reuters, after the Financial Times first reported it. Such a deal would create one of the world's biggest drugmakers but carry regulatory risk, as a Britain-based firm would effectively buy a major US champion amid Trump-administration scrutiny of pharma mergers. AstraZeneca's shares have more than quadrupled under CEO Pascal Soriot, with cancer treatments generating about US$25 billion in 2025 sales. The companies' cancer immunotherapies directly compete, likely inviting FTC scrutiny and divestitures. Bristol Myers faces looming patent losses on Opdivo and Eliquis by 2028. Reuters could not confirm the talks are ongoing; AstraZeneca declined to comment.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20ST/Pharma%20giants%20AstraZeneca,%20Bristol%20Myers%20Squibb%20in%20talks%20on%20512%20billion%20mega%20deal%20Report.pdf"}, {"id": "st-08", "title": "Singapore nears demographic turning point as births barely more than deaths in 2025", "source": "ST", "date": "4 Aug 2026", "tags": ["Society"], "summary": "Singapore's natural population increase fell to 3,365 in 2025, its smallest in almost a century and a historic low, down from 22,323 in 2015, per the Report on Registration of Births and Deaths. Total births dropped 11.4 per cent to 29,864, the lowest post-independence, while deaths edged up to 26,499. The Chinese community, with the lowest birth rate, recorded 3,071 more deaths than births. Analysts cited fewer women of child-bearing age post-pandemic and ageing baby boomers; the resident total fertility rate hit a record 0.87. Without immigration, the citizen population could shrink from the early 2040s, warned DPM Gan Kim Yong, who flagged plans for 25,000-30,000 new citizens yearly and managed immigration to preserve ethnic balance.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20ST/Singapore%20nears%20demographic%20turning%20point%20as%20births%20barely%20more%20than%20deaths%20in%202025.pdf"}, {"id": "st-09", "title": "Singapore reserves deliver returns amid market volatility", "source": "ST", "date": "4 Aug 2026", "tags": ["Finance & Markets"], "summary": "Singapore's three reserve managers, GIC, Temasek and MAS, posted steady returns despite years of shocks from trade wars to the Iran conflict. GIC recorded its lowest 20-year annualised return since 2020 for the year to March 31, 2026, but nearly doubled its reserves' inflation-adjusted purchasing power. MAS booked a net profit of $20 billion on investment gains of $39.8 billion, and will contribute $1 billion to the Consolidated Fund. Temasek's net portfolio value hit a record $518 billion, up $49 billion, with a 10.5 per cent one-year shareholder return. Up to 50 per cent of expected returns flow into the budget via the NIRC, the largest revenue source. MAS warned an AI-investment pullback is a key risk, especially for Asian exports.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20ST/Singapore%20reserves%20deliver%20returns%20amid%20market%20volatility.pdf"}, {"id": "st-10", "title": "Taiwan minister says close ties with US Pacific Command boost defence readiness", "source": "ST", "date": "4 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "Taiwan's cooperation with the US may be closer than many imagine, Defence Minister Wellington Koo said on July 31, as the island deepens military exchanges with US Pacific Command to boost defensive combat capabilities. The command views Taiwan as occupying a key position in the first island chain from Japan through the Philippines. The US remains Taiwan's most important backer and arms supplier despite lacking formal ties, drawing repeated Chinese condemnation. Beijing has intensified military pressure, including coast guard operations, prompting Taipei drills simulating a blockade. Koo argued a Chinese blockade would carry major risks for Beijing, given its trade reliance and likely heavy international sanctions, and could threaten domestic stability and Xi Jinping's rule. \"I believe Xi Jinping must consider this,\" he said.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20ST/Taiwan%20minister%20says%20close%20ties%20with%20US%20Pacific%20Command%20boost%20defence%20readiness.pdf"}, {"id": "st-11", "title": "Yen rises sharply against Singdollar amid speculation of more intervention", "source": "ST", "date": "4 Aug 2026", "tags": ["Finance & Markets"], "summary": "The yen rallied on Aug 3 amid speculation that authorities intervened again to prop up the currency after coordinated US-Japan action last week. It gained as much as 1.4 per cent versus the US dollar before paring, trading up 0.5 per cent at 156.71, and rose 0.4 per cent to 122.24 per Singdollar, up more than 3 per cent since the July 30 intervention. Japan's Finance Ministry confirmed the joint operation and said it will not hesitate to act further; data suggested it may have spent US$36.58 billion. Treasury Secretary Scott Bessent pledged continued support, and Trump called it \"a signal of friendship\". The joint intervention, the first since 2011, aims to counter yen weakness driven by oil prices, deficits and rate gaps.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20ST/Yen%20rises%20sharply%20against%20Singdollar%20amid%20speculation%20of%20more%20intervention.pdf"}, {"id": "bt-01", "title": "AI and chips are turning Malaysia into Asia's growth standout", "source": "BT", "date": "4 Aug 2026", "tags": ["Technology & AI", "Southeast Asia", "Trade"], "summary": "Malaysia is emerging as an unlikely winner in the AI infrastructure race, drawing chip and data-centre investment across Sarawak, Johor and Penang. It is now among the world's four largest net exporters of AI-related hardware, with data-centre investment near 18 per cent of GDP, the highest globally, HSBC says. GDP grew 5.8 per cent in Q2, beating forecasts; JPMorgan lifted its 2026 outlook to 5.3 per cent. Infineon, Nvidia and ByteDance are building hubs, and approved data-centre investment hit 144.4 billion ringgit through mid-2025. Risks include political fragility after PM Anwar Ibrahim's coalition lost the Negeri Sembilan state election, plus mounting fuel-subsidy costs that could reach 40 billion ringgit and uneven growth.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20BT/AI%20and%20chips%20are%20turning%20Malaysia%20into%20Asia's%20growth%20standout.pdf"}, {"id": "bt-02", "title": "Alibaba releases new Qwen AI model with performance rivalling Anthropic's Fable", "source": "BT", "date": "4 Aug 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "Alibaba released its flagship Qwen3.8-Max model, built on 2.4 trillion parameters, with performance claims placing it alongside Anthropic's Fable 5 and ranking above Moonshot's Kimi K3 on several benchmarks. The firm intends to release the model weights for public download in the week starting Aug 10, letting users customise the technology. The debut intensifies China's AI race, which includes Moonshot, DeepSeek, Z.ai and ByteDance; DeepSeek expanded access to V4 Flash on Jul 31. Alibaba shares surged as much as 7.3 per cent in Hong Kong on Aug 3, the most in nearly a month. Qwen3.8-Max independently ran a software engineering project over 16 days in testing, and activates only some parts to cut costs.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20BT/Alibaba%20releases%20new%20Qwen%20AI%20model%20with%20performance%20rivalling%20Anthropic's%20Fable.pdf"}, {"id": "bt-03", "title": "Asia is becoming a self-supporting AI ecosystem. Western firms are missing out", "source": "BT", "date": "4 Aug 2026", "tags": ["Technology & AI", "Finance & Markets", "Southeast Asia"], "summary": "Asian markets are converging on capital, manufacturing, power and compute to form a standalone AI ecosystem, sidelining Western buyers, argues HSBC's global head of innovation banking. Fewer than 20 per cent of large venture-backed exits in Asia went to Western buyers, and Western acquisitions of Asian firms above US$100 million fell 65 per cent between 2024 and 2025. Asia-Pacific M&A rose 33 per cent to top US$1 trillion in 2025, with AI featuring in roughly a third of the biggest deals. Asia holds an energy edge: China's power use passed 10 trillion kilowatt-hours and it controls 63 per cent of humanoid-robot component makers. Singapore, Malaysia and Indonesia form a cross-border compute corridor; partnership, not capital, unlocks infrastructure.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20BT/Asia%20is%20becoming%20a%20self-supporting%20AI%20ecosystem.%20Western%20firms%20are%20missing%20out.pdf"}, {"id": "bt-04", "title": "Australia's housing market worsens with falls getting steeper", "source": "BT", "date": "4 Aug 2026", "tags": ["Finance & Markets", "Society"], "summary": "Australia's housing decline deepened, with prices falling in June and July by the most since December 2022, as rising interest rates and tax changes hit demand, Cotality data showed. National prices dropped 0.7 per cent last month, led by a 1.4 per cent fall in Sydney; June's decline was revised to 0.7 per cent. Fewer buyers are borrowing after three rate hikes and cut investor tax breaks, with National Australia Bank reporting a 15 per cent drop in Q2 mortgages. Yet outstanding home loans still rose 7.5 per cent year on year, with investor debt up 10.4 per cent, the fastest in over a decade. Supply lags: around 205,000 dwellings were approved, below the 240,000 Housing Accord target.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20BT/Australia's%20housing%20market%20worsens%20with%20falls%20getting%20steeper.pdf"}, {"id": "bt-05", "title": "Firmer rates, wealth gains likely to lift Singapore banks' Q2 results", "source": "BT", "date": "4 Aug 2026", "tags": ["Finance & Markets"], "summary": "Singapore's banks are expected to report resilient second-quarter earnings this week, buoyed by higher interest rates, robust loan growth and strong wealth management income, analysts said. Investors will watch for signs that pressure on net interest margins has yet to fully ease and whether earnings momentum can be sustained into the second half of 2026. DBS kicks off the reporting season on Aug 6, followed by OCBC and UOB on Aug 7. The local lenders are in focus as markets look for clues on whether the quarter's tailwinds can extend through the rest of the year.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20BT/Firmer%20rates,%20wealth%20gains%20likely%20to%20lift%20Singapore%20banks'%20Q2%20results.pdf"}, {"id": "bt-06", "title": "For a competitive circular economy, Singapore should measure what matters", "source": "BT", "date": "4 Aug 2026", "tags": ["Environment", "Society"], "summary": "As Singapore reviews its Zero Waste Masterplan, an academic argues recycling rates alone are an incomplete metric that ignores material quality, recovery energy and whether recyclate can replace virgin feedstock. A tonne of clean aluminium cans differs sharply from a tonne of mixed, contaminated packaging, which needs more sorting and processing, raising costs. Contaminated streams tend to be downcycled or rejected, while clean ones support higher-value production. The writer urges complementing statistics with material-outcome indicators, such as rejection rates and the share returned to manufacturing at agreed grade, plus energy used versus avoided. Better metrics would guide investment, cut reliance on imported raw materials and make Singapore's circular economy greener, more resilient and more competitive.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20BT/For%20a%20competitive%20circular%20economy,%20Singapore%20should%20measure%20what%20matters.pdf"}, {"id": "bt-07", "title": "How Singapore can lead in green finance amid global fragmentation", "source": "BT", "date": "4 Aug 2026", "tags": ["Finance & Markets", "Environment", "Southeast Asia"], "summary": "As the US retreats from climate policy and the EU pauses regulation, Singapore has carved a strategic niche in green finance, argues an NUS professor. Though too small to move global emissions, it can direct capital flows as a top-four financial centre and regional node. The government committed up to S$35 billion in green bonds by 2030, while AirTrunk secured a US$2.3 billion green loan via 23 institutions. MAS's Finance for Net Zero plan centres on transition finance, the Singapore-Asia Taxonomy, the TRACTION credits coalition and blended-finance Fast-P, plus 11 bilateral carbon-credit deals. Obstacles include coal-dependent neighbours, diverse regulations and greenwashing risks. Success rests on participants honouring the spirit, not just the letter, of transition frameworks.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20BT/How%20Singapore%20can%20lead%20in%20green%20finance%20amid%20global%20fragmentation.pdf"}, {"id": "bt-08", "title": "OCBC taps Beijing's ZGC to capture Chinese tech interest in Asean", "source": "BT", "date": "4 Aug 2026", "tags": ["Finance & Markets", "Technology & AI", "Southeast Asia"], "summary": "OCBC is partnering Beijing state-owned enterprise ZGC International to secure banking business from high-growth Chinese tech companies expanding into Asean. The deal, signed in Singapore on Jul 31, grants Singapore's second-largest lender access to ZGC's network of more than 14,000 technology firms across cities including Beijing, Guangzhou, Shandong and Tianjin. It follows China's Jul 1 outbound-investment rules, offering OCBC a pre-vetted pipeline, and supports its strategy on Greater China-Asean flows after a 50 per cent jump in 2025 in new Chinese clients aided. The collaboration targets AI, life sciences, software and advanced manufacturing. OCBC already hosted a June matchmaking event at ZGC Beijing Software Park, connecting with 25 firms; EDB and CapitaLand attended the signing.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20BT/OCBC%20taps%20Beijing's%20ZGC%20to%20capture%20Chinese%20tech%20interest%20in%20Asean.pdf"}, {"id": "bt-09", "title": "Singapore PMI edges up to 51.4 in July despite Middle East supply-chain pressures", "source": "BT", "date": "4 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Singapore's factory activity expanded slightly faster in July, with the PMI edging up 0.1 point to 51.4, a 12th straight month of expansion, SIPMM data showed. The electronics PMI rose 0.2 points to 52.4, a 14th consecutive gain; both readings were their highest since 2018, supported by the AI-driven semiconductor supercycle. However, the collapse of the Middle East ceasefire triggered a supply-chain crisis, sending input prices soaring and crippling supplier delivery times as shipments diverted around the Cape of Good Hope. Electronics new export orders hit 52.6, while finished-goods stocks kept contracting, pointing to a supply crunch. Regionally, China slipped into contraction at 49.2, while South Korea, Vietnam, Thailand and the Philippines strengthened.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20BT/Singapore%20PMI%20edges%20up%20to%2051.4%20in%20July%20despite%20Middle%20East%20supply-chain%20pressures.pdf"}, {"id": "bt-10", "title": "Temasek Financial prices S$750 million 10-year Singapore dollar bond at 2.65% yield per annum", "source": "BT", "date": "4 Aug 2026", "tags": ["Finance & Markets"], "summary": "Temasek Financial (I), a wholly owned subsidiary of Temasek Holdings, has priced a S$750 million 10-year bond with a yield to maturity of 2.65 per cent per annum, according to a Monday statement. Investors will be paid every six months. The bond is issued under Temasek Financial's US$30 billion Guaranteed Global Medium Term Note Programme, unconditionally and irrevocably guaranteed by Temasek, with proceeds funding the group's ordinary business. An application will be made to list it on the Singapore Exchange. The offering closes on Aug 11 and matures Aug 11, 2036. DBS, OCBC, Standard Chartered and UOB are joint lead managers and bookrunners. Temasek carries top-tier \"Aaa\" and \"AAA\" ratings from Moody's and S&P.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20BT/Temasek%20Financial%20prices%20S750%20million%2010-year%20Singapore%20dollar%20bond%20at%202.65%20yield%20per%20annum.pdf"}, {"id": "bt-11", "title": "The US ban on new Chinese robots could backfire", "source": "BT", "date": "4 Aug 2026", "tags": ["Geopolitics", "Technology & AI", "Trade"], "summary": "The US FCC on Jul 28 added foreign-made humanoid and quadruped robots to its \"Covered List\", barring new import authorisations in a move squarely aimed at China, which controls an estimated 85 per cent of the humanoid-robot market via Unitree, AgiBot and UBTech. The rule affects only new models, not existing inventory, effectively banning the next generation. Supporters cite surveillance risks and supply-chain dependence, echoing curbs on Chinese drones and routers. Critics, including Beijing, call it protectionist \"bullying\" that shields an uncompetitive US sector while raising costs, since American firms build on Chinese hardware; Nvidia's June robot reference design uses a Unitree chassis. The commentary frames it as another step in hardening tech decoupling ahead of a September Trump-Xi summit.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20BT/The%20US%20ban%20on%20new%20Chinese%20robots%20could%20backfire.pdf"}, {"id": "bt-12", "title": "The global oil cushion isn't really hitting 'tank bottoms'", "source": "BT", "date": "4 Aug 2026", "tags": ["Energy", "Geopolitics"], "summary": "A Bloomberg columnist rebuts fears that global oil storage is nearing \"tank bottoms\" amid the Iran conflict. Stocks did fall sharply, dropping nearly 3.9 million barrels a day from March to May, with 400 million to 600 million barrels drained overall; the US SPR sits at its lowest since 1983 and Cushing at a 10-year low. But the writer argues bulls overstate depletion, citing bypass pipelines, shuttle tankers, surging Americas output and China's cushion of over 1.4 billion barrels, from which it has drawn only about 100 million. IEA members released roughly 290 million of a promised 400 million barrels, leaving rich nations another billion in reserve. Depleted, not exhausted; reopening the Strait of Hormuz remains the fix.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20BT/The%20global%20oil%20cushion%20isn't%20really%20hitting%20'tank%20bottoms'.pdf"}, {"id": "bt-13", "title": "Turning constraints into assets could help Singapore remain competitive in an age of global fragmentation", "source": "BT", "date": "4 Aug 2026", "tags": ["Southeast Asia", "Energy", "Trade"], "summary": "Transport Minister Jeffrey Siow told the 18th Asean & Asia Forum that Singapore can turn constraints into strengths amid global fragmentation. He named demography, an ageing population and dismal fertility, rising costs and energy as the biggest challenges; even fully covered in solar panels, Singapore could not meet 10 per cent of its energy needs, and the Strait of Hormuz has been effectively blocked since late February. A smaller population lets Singapore invest more per person in reskilling via SkillsFuture. Siow cited port operator PSA, present in 45 countries, as able to reroute ships to ride out supply-chain shocks. Panellists from Evonik and Moody's highlighted Singapore's stability, connectivity and triple-A rating, plus potential as a regional food hub.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20BT/Turning%20constraints%20into%20assets%20could%20help%20Singapore%20remain%20competitive%20in%20an%20age%20of%20global%20fragmentation.pdf"}, {"id": "scmp-01", "title": "A military base, a displaced people and Trump's China fears: Burnham's Chagos test", "source": "SCMP", "date": "4 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "Britain's new prime minister faces an early foreign-policy test over Diego Garcia, the strategically vital US-British base in the Indian Ocean. Chagossians, forcibly removed in the late 1960s and 1970s, remain excluded: London-based campaigner Bertrice Pompe, born on the island in 1971, opposes a 2025 deal transferring sovereignty to Mauritius while leasing Diego Garcia for 99 years, saying \"there is nothing in that deal for us\". The International Court of Justice backed Mauritius's claim that British administration was unlawful. Former PM Keir Starmer defended the arrangement as necessary to block Chinese basing nearby, but President Trump reversed course, urging London to scrap what he called an \"act of great stupidity\" over China fears.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20SCMP/A%20military%20base,%20a%20displaced%20people%20and%20Trump%E2%80%99s%20China%20fears%20Burnham%E2%80%99s%20Chagos%20test.pdf"}, {"id": "scmp-02", "title": "China acknowledges 'temperature gap' between tech boom and traditional slump", "source": "SCMP", "date": "4 Aug 2026", "tags": ["Technology & AI", "Society"], "summary": "A top Communist Party theoretical journal, Qiushi, has acknowledged a stark \"gap in temperature\" between China's booming AI sector and struggling traditional industries, urging that rapid technological change must not leave ordinary citizens behind. It argued the divergence is common to large economies but is being sharpened by AI's speed, with 2026 iteration cycles now \"measured in days\". Data underscores the split: electronics-sector profits soared 96.9 per cent year on year in the first half, while general equipment grew just 1.5 per cent and food processing and autos fell by double digits. Second-quarter GDP growth slipped to 4.3 per cent, the weakest since 2022. Private investment dropped 8.5 per cent; Beijing targets 4.5-5 per cent growth.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20SCMP/China%20acknowledges%20%E2%80%98temperature%20gap%E2%80%99%20between%20tech%20boom%20and%20traditional%20slump.pdf"}, {"id": "scmp-03", "title": "China is working towards 100% renewable power at its Antarctic bases by 2035", "source": "SCMP", "date": "4 Aug 2026", "tags": ["Energy", "Environment"], "summary": "China aims to power all its Antarctic research stations entirely with renewable energy by 2035, according to Sun Hongbin, chief scientist of the country's polar clean-energy programme. Its newest base, Qinling Station, opened in 2024, already meets over 60 per cent of demand using solar, wind, hydrogen and battery storage, combining multiple sources to cope with extreme cold below minus 80 degrees Celsius, fierce winds and months of polar darkness. Diesel had powered Chinese expeditions for 37 years. During polar day, surplus electricity desalinates seawater and produces hydrogen stored in tanks and fuel cells. A clean-energy experimental base for Qinling launched last month in Taiyuan, Shanxi, alongside an upgraded facility simulating extreme polar environments.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20SCMP/China%20is%20working%20towards%20100%25%20renewable%20power%20at%20its%20Antarctic%20bases%20by%202035.pdf"}, {"id": "scmp-04", "title": "China stock traders cut leveraged positions by 14% in July amid tech sell-off", "source": "SCMP", "date": "4 Aug 2026", "tags": ["Finance & Markets"], "summary": "Chinese traders unwound leveraged positions through July, deepening a stock sell-off and undermining Beijing's efforts to support equities. Outstanding margin financing fell 14 per cent to 2.59 trillion yuan (US$383.4 billion) on Friday, down from a record 3.01 trillion yuan on June 25, according to Wind. The deleveraging, concentrated in Shanghai and Shenzhen tech boards, helped drive a 26 per cent slump in the Star Market 50 Index, its worst month ever, amid a global AI sell-off and Fed tightening fears. Analyst Wang Chen said exiting leveraged positions \"largely explains the big decline\", though fundamentals were little changed. Two state-backed entities bought about 60 billion yuan of stock. Margin exposure, at 2.7 per cent of free float, stays below 2015 levels.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20SCMP/China%20stock%20traders%20cut%20leveraged%20positions%20by%2014%25%20in%20July%20amid%20tech%20sell-off.pdf"}, {"id": "scmp-05", "title": "China's DeepSeek beefs up agentic AI with 'harness' tests as V4 model jolts Silicon Valley", "source": "SCMP", "date": "4 Aug 2026", "tags": ["Technology & AI"], "summary": "Chinese AI firm DeepSeek is recruiting open-source developers to beta-test DeepSeek Harness, software that turns large language models into autonomous agents, escalating its push into agentic technology as rivals chase Anthropic's Claude Code. The Hangzhou-based company announced the recruitment via Cui Tianyi, a former Jane Street engineer hired in March to lead its harness team. The move coincides with Friday's release of \"V4 Flash 0731\", a 284-billion-parameter model praised for near-frontier performance at rock-bottom prices. Artificial Analysis said it matched OpenAI's GPT-5.6 Luna while costing 60 per cent less per task, averaging US$0.03 - roughly 105 times cheaper than Anthropic's Claude Fable 5. CEO Liang Wenfeng is doubling down on cheap, capable models as a path towards AGI.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20SCMP/China%E2%80%99s%20DeepSeek%20beefs%20up%20agentic%20AI%20with%20%E2%80%98harness%E2%80%99%20tests%20as%20V4%20model%20jolts%20Silicon%20Valley.pdf"}, {"id": "scmp-06", "title": "Chinese biotech giant WuXi AppTec sees first-half earnings surge amid US scrutiny", "source": "SCMP", "date": "4 Aug 2026", "tags": ["Finance & Markets", "Trade"], "summary": "WuXi AppTec, Asia's largest contract pharmaceutical research provider, reported first-half net profit up 33.7 per cent to 11.08 billion yuan (US$1.64 billion), far exceeding a consensus estimate of 14.5 per cent growth, driven by demand tied to weight-loss and diabetes drugs and gains in its US business. Revenue rose 38.9 per cent to 28.9 billion yuan, with US sales climbing to 22.28 billion yuan, about 77 per cent of the total. Its GLP-1 peptide \"tides\" unit grew 44.3 per cent. Hong Kong shares are up about 62 per cent year to date. The firm faces US pressure: in June the Pentagon added it to a \"Chinese military companies\" list, and WuXi has sued the Defense Department, calling the designation baseless.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20SCMP/Chinese%20biotech%20giant%20WuXi%20AppTec%20sees%20first-half%20earnings%20surge%20amid%20US%20scrutiny.pdf"}, {"id": "scmp-07", "title": "Chinese military unveils AI system to plan and coordinate mass air strikes", "source": "SCMP", "date": "4 Aug 2026", "tags": ["Defence", "Technology & AI"], "summary": "China's air force is using an AI-enabled \"intelligent strike planning system\" to design operations involving more than 100 units, according to a CCTV documentary aired Sunday marking the PLA's 99th anniversary. The system prioritises targets, coordinates attack waves and allocates tasks, and has been used \"multiple\" times, supporting Beijing's push for \"system-of-systems\" warfare integrating many platforms. Developed by a team under Senior Colonel Deng Jianping, it addresses exercises with \"hundreds of targets and dozens of formations\" moving too fast for traditional calculation. Footage showed missiles from various platforms striking land and sea targets. President Xi Jinping urged the PLA to build an \"intelligent military system\". US efforts like Project Maven emphasise situational awareness and intelligence analysis instead.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/04%20Aug%202026/04%20Aug%20SCMP/Chinese%20military%20unveils%20AI%20system%20to%20plan%20and%20coordinate%20mass%20air%20strikes.pdf"}, {"id": "scmp-08", "title": "Could Silicon Valley's lobbying create 'mutual suspicion' between US and China?", "source": "SCMP", "date": "4 Aug 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "US tech firms' increasingly hawkish stance on China risks deepening mistrust between the two powers, some analysts warn. An article in the Journal of Contemporary Asia-Pacific Studies, overseen by the Chinese Academy of Social Sciences, argues tech lobbyists are \"systematically\" weaving the \"China threat\" into their advocacy to secure favourable policy. Authors Tan Yannan of Renmin University and Sun Chenghao of Tsinghua say an emerging generation of tech leaders uses Chinese competitors as a \"strategic lever\", citing OpenAI's argument that underinvesting would erode America's edge over China. They contrast this with Meta's \"defensive\" rhetoric amid antitrust scrutiny, warnin
