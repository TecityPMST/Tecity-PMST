ndustry, capture it\" and use it as leverage. Monthly vehicle exports topped one million for the first time in June, with 12 million projected by year-end. Former Canadian diplomat Michael Kovrig called EVs \"the perfect instrument\", warning Beijing was using auto access to extract political concessions, citing Canada's tariff-cutting deal. The US keeps tariffs above 120 per cent and restricts China-linked software, viewing its market as Chinese carmakers' \"ultimate target\".", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20SCMP/Can%20China%E2%80%99s%20EV%20boom%20give%20it%20decisive%20edge%20in%20geopolitical%20tech%20war.pdf"}, {"id": "scmp-03", "title": "Can the US fend off China's subsea drones? Its coastguard looks for answers", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Defence", "Technology & AI"], "summary": "As China expands its autonomous underwater fleet, the US Coast Guard is seeking commercial technology to detect, track and disable unmanned underwater vehicles (UUVs), highlighting a gap in America's maritime defences. A July 24 notice, which does not mention China, follows Beijing's September military parade unveiling systems including the HSU-001 and extra-large AJX-002. Analysts say Cold War-era hydrophone networks are ill-suited to smaller, stealthier drones. Timothy Heath of Perceptum warned UUVs could strike warships in port - as Ukraine did against a Russian submarine - or damage infrastructure, calling the threat \"real and growing\". Countering them likely requires combined technologies, including sonar, nets, barriers and adapted anti-torpedo interceptors, amid wider global proliferation of drones by state and non-state actors.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20SCMP/Can%20the%20US%20fend%20off%20China%E2%80%99s%20subsea%20drones%20Its%20coastguard%20looks%20for%20answers.pdf"}, {"id": "scmp-04", "title": "China's hi-tech boom pushes firms to boost pay in 2027 as keeping talent a priority", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Technology & AI", "Society"], "summary": "Chinese employers expect a median salary increase of 4.5 per cent in 2027, up from 4.3 per cent in 2026, as firms fight to retain top talent despite cost pressures, according to advisory WTW. The three-year figure still lags Asia-Pacific averages by 0.4 percentage points. A \"staggering\" 37.5 per cent of 938 surveyed organisations prioritised employee retention amid a tight labour market in high-growth sectors. WTW cited intense cost-control and weak 2026 results. Competition for talent is fierce: ByteDance reportedly offered a former DeepSeek researcher up to 100 million yuan (US$14.8 million). Hong Kong increases stay moderate, rebounding to 3.8 per cent in 2027, while India leads the region at 9 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20SCMP/China%E2%80%99s%20hi-tech%20boom%20pushes%20firms%20to%20boost%20pay%20in%202027%20as%20keeping%20talent%20a%20priority.pdf"}, {"id": "scmp-05", "title": "China's solar surge nears historic milestone - even as Beijing slams brakes on sheer scale", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Energy", "Environment"], "summary": "Solar is poised to overtake coal as China's largest source of installed power capacity this year, as Beijing emphasises efficiency and quality over sheer scale. Installed solar reached 1.27 billion kilowatts by end-June and is projected to surpass coal before year-end, state media reported, citing the photovoltaic industry association. Solar generation surged more than 40 per cent year on year in the first half. A new roadmap targets combined solar and wind capacity above 2.8 million kW by 2030. Yet new panel installations plunged 66 per cent to about 72 gigawatts as Beijing curbed overcapacity and below-cost selling. Analysts said the sector entered \"high-quality development\", but warned intermittent solar needs storage, flexible coal and grid support.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20SCMP/China%E2%80%99s%20solar%20surge%20nears%20historic%20milestone%20%E2%80%93%20even%20as%20Beijing%20slams%20brakes%20on%20sheer%20scale.pdf"}, {"id": "scmp-06", "title": "Chinese AI start-up Moonshot seeks influential ambassadors to widen Kimi's global reach", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Technology & AI"], "summary": "China's Moonshot AI launched a \"Kimi Ambassador Program\" to expand the global reach of its Kimi K3 model, which stunned observers with performance close to American frontier systems. The Beijing start-up is recruiting influential entrepreneurs, developers, content creators and students who use Kimi to build communities and share experiences. Applicants complete an 11-question form; successful candidates gain early access to unreleased models, API credits and direct engagement with product teams. Moonshot is also advertising in Silicon Valley, with a billboard touting Kimi as an open model costing \"70 per cent less\". The move mirrors similar community programmes from Anthropic and OpenAI, reflecting an industry shift toward developer ecosystems as AI agents handle increasingly complex, multi-step workflows.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20SCMP/Chinese%20AI%20start-up%20Moonshot%20seeks%20influential%20ambassadors%20to%20widen%20Kimi%E2%80%99s%20global%20reach.pdf"}, {"id": "scmp-07", "title": "How South Korea's tech rout hit Hong Kong - and why regulators stepped in", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "South Korea's volatile market, driven by swings in Samsung and SK Hynix, has rippled into Hong Kong, prompting regulators to overhaul high-risk investment rules. A CSOP Hong Kong-listed leveraged product tracking SK Hynix, once the city's largest ETP at over HK$130 billion, has collapsed roughly 80 per cent since early July. Analysts blamed fears over rising competition from China's ChangXin Memory and doubts about AI payback periods. The Kospi tumbled more than 11 per cent Tuesday, triggering its eighth circuit breaker of the year. One Hong Kong manager allegedly misappropriated HK$50 million to speculate on the ETF. The Securities and Futures Commission ordered issuers to add safety buffers allowing flexible daily leverage adjustments within existing limits.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20SCMP/How%20South%20Korea%E2%80%99s%20tech%20rout%20hit%20Hong%20Kong%20%E2%80%93%20and%20why%20regulators%20stepped%20in.pdf"}, {"id": "scmp-08", "title": "Inside America's US$1.5 billion play for Southeast Asian energy", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Energy", "Southeast Asia", "Geopolitics"], "summary": "The United States is pitching billions in investment to become Southeast Asia's energy partner of choice, offering liquefied natural gas, grid technology and small modular nuclear reactors as Iran-war turmoil sharpens supply-shock fears. Washington announced US$1.5 billion in financing through its Development Finance Corporation on July 22 - the agency's \"single largest project investment\" - unveiled during Secretary of State Marco Rubio's Manila visit, alongside a further US$2.5 billion commitment. Analysts say the push serves US commercial and strategic interests, countering China's infrastructure dominance and opening LNG markets. But experts caution the money is \"a platform, not a list of ready-to-build projects\", with talks on Vietnam's grid and Indonesia's energy security still early-stage amid weak transmission networks and regulatory uncertainty.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20SCMP/Inside%20America%E2%80%99s%20US%241.5%20billion%20play%20for%20Southeast%20Asian%20energy.pdf"}, {"id": "scmp-09", "title": "Iranian missile salvoes and US-Saudi strikes shatter brief Middle East lull", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Geopolitics", "Defence"], "summary": "Jordan's air defences intercepted five Iranian missiles early Wednesday, hours after the US said it downed an Iranian barrage targeting American forces, shattering a brief Middle East lull. Iran's Revolutionary Guard said it fired ballistic missiles at Jordan's Muwaffaq Salti Air Base and US Central Command headquarters. US and Saudi aircraft struck Tehran-backed militia sites in eastern Iraq in response to over 30 drone attacks; Iraq's Popular Mobilisation Forces reported at least 20 fighters killed. Washington warned further attacks on troops or Saudi energy infrastructure risked additional action. Oil prices spiked, with Brent crude up 3.1 per cent to US$84.58. The flare-up followed weeks of escalation over the Strait of Hormuz, through which 20 per cent of traded oil flows.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20SCMP/Iranian%20missile%20salvoes%20and%20US-Saudi%20strikes%20shatter%20brief%20Middle%20East%20lull.pdf"}, {"id": "scmp-10", "title": "The CXMT shock: how China's viable alternatives punch Nvidia, Micron, SK Hynix shares", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "China's growing clout in the semiconductor supply chain is accelerating the unravelling of the AI trade as investors anticipate cheaper Chinese alternatives. ChangXin Memory Technologies' US$9.8 billion Shanghai listing surged 466 per cent on debut, making it the mainland's most valuable stock at 3.3 trillion yuan (US$487.3 billion) and sending SK Hynix and Micron shares tumbling. Reports that China will deliver home-made DUV lithography machines this year rattled ASML. Analysts said China's advances promise low-cost substitutes eroding incumbents' margins, turning AI into \"a two-sided trade\". Adding pressure, Moonshot's 2.8-trillion-parameter Kimi K3 nearly matches OpenAI and Anthropic. The Nasdaq 100 nears correction while South Korea's Kospi has shed roughly 40 per cent in a month.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20SCMP/The%20CXMT%20shock%20how%20China%E2%80%99s%20viable%20alternatives%20punch%20Nvidia,%20Micron,%20SK%20Hynix%20shares.pdf"}, {"id": "scmp-11", "title": "US Federal Reserve holds interest rates steady despite Warsh's inflation vow", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Finance & Markets", "Politics"], "summary": "The Federal Reserve held interest rates steady Wednesday, keeping the benchmark in the 3.50-3.75 per cent range, raising questions about how new chief Kevin Warsh will meet his pledge to return inflation to 2 per cent. Three of twelve policymakers - the Cleveland, Dallas and Minneapolis presidents - dissented, preferring a quarter-point hike. Warsh, who took over in May, has said he has \"no tolerance\" for inflation running above target for over five years, pushed higher by Trump's Middle East war and AI-driven data-centre spending. The Fed said activity is \"expanding at a solid pace\". Analysts expect a 25-basis-point hike in September absent a labour-market collapse. Stocks pared losses and the dollar fell after the decision.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20SCMP/US%20Federal%20Reserve%20holds%20interest%20rates%20steady%20despite%20Warsh%E2%80%99s%20inflation%20vow.pdf"}, {"id": "scmp-12", "title": "US sanctions mainland China, Hong Kong shipping firms over Iranian oil deliveries", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Geopolitics", "Trade", "Energy"], "summary": "The United States on Wednesday sanctioned eight mainland Chinese and Hong Kong shipping companies accused of operating vessels that moved Iranian oil to China and the UAE, extending its economic campaign against Tehran alongside a naval blockade. Six of eight identified tankers allegedly carried Iranian crude to China, some transporting millions of barrels during 2026. One firm is mainland-based; five are wholly or partly in Hong Kong. The designations freeze US-jurisdiction assets and expose foreign institutions to secondary sanctions. Treasury Secretary Scott Bessent said Iran's economy was \"in free fall\" with triple-digit inflation. State Department spokesman Tommy Pigott linked the measures to enforcing the blockade and protecting Strait of Hormuz navigation rights, vowing to work with allies to isolate Tehran.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20SCMP/US%20sanctions%20mainland%20China,%20Hong%20Kong%20shipping%20firms%20over%20Iranian%20oil%20deliveries.pdf"}, {"id": "scmp-13", "title": "Why US-led alliance might struggle to rein in Beijing's growing 6G influence", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "As the United States builds a 6G alliance with 24 countries including the UK, Germany and Japan, analysts say Washington faces short-term challenges countering Beijing's growing influence. The Commerce Department initiative aims to coordinate national 6G strategies, share technical resources and build a \"trusted\" supply chain reducing Chinese firms like Huawei, ahead of commercial deployment in the 2030s. 6G is expected to integrate AI, sensing and computing. But researcher Shan Guangcun said China has over 300 key 6G technologies and the world's largest telecoms market, while the US roadmap \"remains less clear\". Natixis economist Alicia Garcia-Herrero called the alliance \"necessary but not sufficient\", saying success depends on concrete spectrum decisions, industrial policy and R&D, not the declaration itself.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20SCMP/Why%20US-led%20alliance%20might%20struggle%20to%20rein%20in%20Beijing%E2%80%99s%20growing%206G%20influence.pdf"}, {"id": "scmp-14", "title": "Why has the China-US profit gap widened on the Fortune Global 500?", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Finance & Markets", "Trade"], "summary": "China's structural economic problems are eroding profits, leaving its multinationals far behind US peers on the latest Fortune Global 500 despite strong revenues. Chinese companies averaged US$4.5 billion profit in 2025, about 40 per cent of the US$11.24 billion for US counterparts. Since 2021, Chinese average profits rose 27 per cent versus 110 per cent for US firms, as American AI leaders accumulated wealth from asset gains. Amazon became the top firm by revenue, ending Walmart's 12-year reign; State Grid ranked third. Alphabet, Nvidia and Apple were most profitable. The 141 US firms generated 47 per cent of total earnings. China's 122 listed firms posted US$10.4 trillion combined revenue, down 2 per cent year on year.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20SCMP/Why%20has%20the%20China-US%20profit%20gap%20widened%20on%20the%20Fortune%20Global%20500.pdf"}, {"id": "scmp-15", "title": "Zelensky pursues Patriot missile licences in White House meeting with Trump", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Geopolitics", "Defence"], "summary": "Ukrainian President Volodymyr Zelensky sought licences to produce Patriot air-defence interceptors during a \"good meeting\" with Donald Trump at the White House on Tuesday, as long-range strikes intensified and US-led peace efforts stalled. Zelensky said Trump \"accepted that he will give us\" the licences and that he met US arms firms hoping for co-production. Kyiv's priorities were fresh anti-ballistic missiles and reviving diplomacy, more than four years after Russia's invasion. Last month was the deadliest for Ukrainian civilians since April 2022. Zelensky also attended a memorial for the late senator Lindsey Graham and addressed senators before a procedural vote advancing a bipartisan Russia sanctions bill, which would expand Trump's power to tariff buyers of Russian energy.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20SCMP/Zelensky%20pursues%20Patriot%20missile%20licences%20in%20White%20House%20meeting%20with%20Trump.pdf"}, {"id": "scmp-16", "title": "'Negotiation fatigue' risks stalling South China Sea code of conduct progress", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Geopolitics", "Southeast Asia"], "summary": "Asean's optimism about concluding a South China Sea code of conduct (COC) with China this year is not shared by observers, who highlight persistent gaps, particularly between Beijing and Manila. Philippine Foreign Secretary Maria Theresa Lazaro said parties intended to finish \"within the year\", and Asean ministers welcomed \"significant progress\". But negotiations have dragged over two decades amid disputes over legal bindingness, geographic scope and external powers. Analyst Le Hong Hiep said only a scaled-back, \"largely symbolic\" deal could be reached by year-end, noting China and Vietnam continue island-building in the Paracels and Spratlys. Continued clashes near Scarborough and Second Thomas shoals underscore urgency, while \"negotiation fatigue\" risks stalling progress despite the importance of sustained dialogue.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20SCMP/%E2%80%98Negotiation%20fatigue%E2%80%99%20risks%20stalling%20South%20China%20Sea%20code%20of%20conduct%20progress.pdf"}]}, "2026-07-31": {"date": "2026-07-31", "dayOfWeek": "Friday", "totalArticles": 60, "sourceCounts": {"WSJ": 17, "ST": 12, "BT": 10, "SCMP": 21}, "executiveDigest": "Big Tech's AI bill came due: Meta stock dropped 10% on steeper AI costs, even a US$64 billion quarterly profit disappointed chip investors, and WSJ warned 'the China shock just came for your portfolio' - as the Fed held rates but three officials dissented for a hike and new chair Warsh pivoted to fighting inflation; the US retaliated against Iran for its surprise attack, sending oil higher, and Singapore opened feedback on its first climate-adaptation plan.", "briefingCards": [{"title": "Lead story - AI's cost reckoning hits Big Tech", "body": "The market's AI enthusiasm collided with the bill: Meta's stock dropped 10% on steeper AI costs and a missed forecast, and even a US$64 billion quarterly profit was branded 'a disappointment' for chip investors, while WSJ warned 'the China shock just came for your portfolio'. Microsoft was the bright spot - profit jumped 31% as Azure cloud sales surpassed US$100 billion - and Qualcomm said it will raise prices to offset costs. Mark Zuckerberg urged the US to accelerate, not restrict, AI, even as a backlash against Anthropic brewed in Silicon Valley and questions grew over whether China's tech giants can deliver long-term AI profits."}, {"title": "Markets & finance", "body": "The Fed held rates steady, but three officials voted for an increase and new chair Kevin Warsh pivoted his focus back to lowering inflation - a posture that 'sparked market inflation fears' and, analysts said, sets up a 'higher-for-longer' squeeze on Asia's tech sectors. Bank earnings impressed: Deutsche Bank unveiled a US$569 million buyback and UBS a US$3 billion one, while Airbus flagged confidence after strong deliveries. US-listed Chinese stocks benefited as the AI slump drove rotation, and ASEAN gold demand rose in Q2 - Hong Kong's gold imports hit an 11-year high - bucking a broader sell-off."}, {"title": "Asia realignment", "body": "US-China friction intensified: China voiced 'serious concern' over new US curbs in Bessent-He trade talks, warned of retaliation over a US robot-import ban that swept up its smart-vacuum giants, and its Politburo pledged fresh spending to counter sluggish growth ahead of an October plenum focused on party discipline. Trump sent mixed signals ('quite disappointed'?) before Xi's September trip and weighed a US$100,000 fee for foreign graduates to work in the US. US-led drills edged Japan and South Korea closer on defence, and Unitree will launch its IPO next week as US-China robotics rivalry sharpens."}, {"title": "Energy & climate", "body": "Oil jumped as fresh Middle East strikes threatened the fragile diplomacy - the US retaliated against Iran for Tuesday's surprise attack, a drone struck near Egypt's Suez Canal, and Pakistan said US-Iran talks were still ongoing 'as foes trade attacks'. WSJ charted how China went 'from dream customer to a nightmare for Big Oil'. Singapore called for public feedback on its first climate-adaptation plan, El Nino raised 2026 insurance risks across Asia, and a fusion-energy firm raised US$1 billion."}, {"title": "Technology & AI", "body": "Regulation and rivalry framed the day: ChatGPT and Roblox will fall under the EU's strictest platform rules, China warned of retaliation over the US robot ban, and ByteDance's projected US$4 billion AI revenue topped China as it restructured its Lark office tool. An NYSE-listed AI chip-design firm made a second listing in Singapore and is hiring for AI and engineering roles - a hub win. The pressing question, per SCMP, is whether soaring AI spending can translate into long-term profits - a doubt now visible in Meta's and the chipmakers' results."}, {"title": "Singapore & SEA focus", "body": "Singapore opened consultation on its first climate-adaptation plan and landed a second listing from an NYSE-listed AI chip-design firm that is hiring locally. Markets stayed active: more office buildings are lined up for sale ahead of an impending Marina One deal, Far East Hospitality Trust's H1 DPS slipped 8.4%, Eastspring launched an all-cap income-and-growth fund, and Sheng Siong signalled it will adjust pricing once the Johor-Singapore RTS opens. BT argued ASEAN's best defence against US tariff turmoil 'lies close to home', while Hong Kong debated scrapping its lunch break - noting SGX traders had little appetite for it."}], "keyMetrics": [{"value": "60", "label": "Articles curated today", "sub": "WSJ 17 · ST 12 · BT 10 · SCMP 21"}, {"value": "-10%", "label": "Meta on AI costs", "sub": "'China shock' hits portfolios"}, {"value": "Fed holds", "label": "3 dissent for a hike", "sub": "Warsh pivots to inflation"}, {"value": ">US$100b", "label": "Microsoft Azure sales", "sub": "Profit jumps 31%"}, {"value": "US retaliates", "label": "Iran surprise attack", "sub": "Oil jumps; talks 'ongoing'"}, {"value": "2nd SG listing", "label": "NYSE AI-chip firm", "sub": "Hiring for AI, engineering"}], "articles": [{"id": "wsj-01", "title": "A Backlash Against Anthropic Is Brewing in Silicon Valley", "source": "WSJ", "date": "31 Jul 2026", "tags": ["Technology & AI"], "summary": "A backlash against Anthropic is building in Silicon Valley over product launches that compete with partners and its advocacy for a closed AI ecosystem. Startup founders, executives and researchers say they are switching to cheaper models after Anthropic released tools like Claude Design, seen as rivaling partner Figma. Critics accuse the company of overstating open-weight AI security risks to win favorable regulation, noting Chinese open models now approach frontier U.S. capabilities. CEO Dario Amodei clarified Anthropic \"has never advocated for a ban on open-weights models,\" saying his concern is authoritarian regimes gaining military superiority. Anthropic and OpenAI accuse Chinese model-makers of \"distillation,\" copying technology through mass querying. The dispute followed a letter from Nvidia and Microsoft backing open models.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20WSJ/A%20Backlash%20Against%20Anthropic%20Is%20Brewing%20in%20Silicon%20Valley.pdf"}, {"id": "wsj-02", "title": "Airbus Logs Strong Earnings, Flags Confidence After Boost in Deliveries", "source": "WSJ", "date": "31 Jul 2026", "tags": ["Finance & Markets"], "summary": "Airbus posted sharply higher second-quarter earnings and expressed confidence it can meet annual delivery targets. Adjusted EBIT jumped 54% to 2.43 billion euros ($2.77 billion), while net profit more than doubled to 1.66 billion euros, beating analyst forecasts. Revenue grew 28% to 20.53 billion euros. CEO Guillaume Faury said strong deliveries fueled confidence in reaching roughly 870 commercial aircraft this year despite supply-chain hurdles that constrained engines. Airbus dispatched 351 planes in the first half, with a recent uptick easing fears it would cut its target as in 2022, 2024 and 2025. A Pratt & Whitney engine shortage had slowed A320 output. Airbus stock is up under 6% since January; it reaffirmed full-year EBIT guidance of around 7.5 billion euros.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20WSJ/Airbus%20Logs%20Strong%20Earnings,%20Flags%20Confidence%20After%20Boost%20in%20Deliveries.pdf"}, {"id": "wsj-03", "title": "China Shock Just Came for Your Portfolio", "source": "WSJ", "date": "31 Jul 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Columnist Spencer Jakab argues a \"China Shock 2.0\" now threatens U.S. investors, not just factory towns. Unlike China's post-2001 rise in basic goods, which boosted margins and curbed inflation, Beijing now competes in cutting-edge products rattling the AI trade. DeepSeek's January model wiped $1 trillion off U.S. stocks; such shocks now recur frequently. Chinese memory-chip maker CXMT debuted as the mainland's most valuable listed company, Moonshot's Kimi K3 nears U.S. rivals, and reported lithography advances hit ASML. Apple is lobbying to access cheaper Chinese memory chips, clashing with Micron. Markets are vulnerable because AI-related firms exceeded 40% of the S&P 500's value in early July. Two assumptions, U.S. export-control dominance and data-center profits, now look shaky.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20WSJ/China%20Shock%20Just%20Came%20for%20Your%20Portfolio.pdf"}, {"id": "wsj-04", "title": "Deutsche Bank Plans Fresh $569 Million Buyback After Earnings Beat Hopes", "source": "WSJ", "date": "31 Jul 2026", "tags": ["Finance & Markets"], "summary": "Deutsche Bank announced a fresh 500 million euro ($569.3 million) share buyback after quarterly profit beat expectations. Germany's largest lender made 2.68 billion euros in pretax profit in the quarter through June, up 11% year-on-year and above the 2.25 billion euros analysts expected. The new buyback adds to a recently completed 1 billion-euro repurchase. CEO Christian Sewing said performance suggests upside to 2028 targets and that AI offers scope for cost savings. Shares rose 4.5% in Frankfurt. Return on tangible equity climbed to 11.0% from 10.1%, though the CET1 capital ratio slipped to 13.9%. Net revenue rose 9% to 8.48 billion euros, keeping the bank on track for its roughly 33 billion euro full-year target despite higher costs.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20WSJ/Deutsche%20Bank%20Plans%20Fresh%20%24569%20Million%20Buyback%20After%20Earnings%20Beat%20Hopes.pdf"}, {"id": "wsj-05", "title": "Even $64 Billion in Quarterly Profit Is a Disappointment for Chip Investors", "source": "WSJ", "date": "31 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "South Korea's SK Hynix reported a record $64 billion quarterly net profit, yet its stock fell nearly 10%, illustrating fickle investor sentiment around the AI boom. The memory-chip maker's profit was 13 times a year earlier and exceeded its combined earnings over five years, but fell short of bullish expectations. Shares dropped as much as 19.6% before closing down 9.6%; Samsung and Kioxia also slid. SK Hynix, whose value topped $1 trillion and which raised $26 billion in a July Nasdaq debut, benefits from high-bandwidth memory demand. Concerns include circular AI financing, such as Nvidia's reported $250 billion OpenAI backstop, and rising Chinese competition. CXMT's Shanghai debut gave it a market value above $500 billion, nearing SK Hynix's $705 billion.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20WSJ/Even%20%2464%20Billion%20in%20Quarterly%20Profit%20Is%20a%20Disappointment%20for%20Chip%20Investors.pdf"}, {"id": "wsj-06", "title": "Fed Holds Rates Steady but Three Officials Vote for Increase", "source": "WSJ", "date": "31 Jul 2026", "tags": ["Finance & Markets"], "summary": "The Federal Reserve held its benchmark rate steady at 3.5%-3.75% in a 9-3 vote, with three bank presidents dissenting in favor of an increase, underscoring internal pressure over inflation running above target for five years. Dissenters were Cleveland's Beth Hammack, Minneapolis's Neel Kashkari and Dallas's Lorie Logan, the first triple same-direction dissent since 2016. Chairman Kevin Warsh said the Fed lacked a \"magic wand\" to lower inflation quickly and pointed to rising market rates as effectively tightening policy. Renewed U.S.-Iran fighting lifted energy prices, straining patience. Long-term yields climbed, with the 30-year bond hitting 5.228%, its highest since 2007, while the Dow fell more than 1,100 points. Mortgage rates reached 6.76%, and inflation remains stuck near 3%.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20WSJ/Fed%20Holds%20Rates%20Steady%20but%20Three%20Officials%20Vote%20for%20Increase.pdf"}, {"id": "wsj-07", "title": "How China Went From Dream Customer to a Nightmare for Big Oil", "source": "WSJ", "date": "31 Jul 2026", "tags": ["Energy", "Geopolitics"], "summary": "China has gained unprecedented control over its oil consumption, unsettling major producers. After the Strait of Hormuz closed, China slashed crude imports from an average 11.6 million barrels a day in 2025 to around seven million by June, a single-country drop without precedent even in recession. Analysts at Kpler say Beijing can suppress imports for another six months by drawing on stockpiles, still leaving 1.1 billion barrels. It restricted refinery runs, banned fuel exports, and benefited from surging EV adoption and renewables. The pullback acted as a global shock absorber, capping prices; China's return would push crude higher. Experts warn demand can now move markets, \"quite scary for suppliers,\" reversing assumptions that oil demand is inelastic and OPEC controls prices.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20WSJ/How%20China%20Went%20From%20Dream%20Customer%20to%20a%20Nightmare%20for%20Big%20Oil.pdf"}, {"id": "wsj-08", "title": "Mark Zuckerberg Says U.S. Should Accelerate AI Development, Not Restrict It", "source": "WSJ", "date": "31 Jul 2026", "tags": ["Technology & AI", "Politics"], "summary": "Meta CEO Mark Zuckerberg argued the U.S. should accelerate AI development rather than restrict it, warning that pessimists could limit who accesses the technology. In a Wall Street Journal op-ed and interview, he called \"superintelligence\" the most profound advance of our lifetimes, provided its power isn't restricted to a few institutions. He criticized doom-laden discourse from rivals like Anthropic and OpenAI and doubted banning foreign open-source models would be productive. Zuckerberg said any government model-review period, such as the Trump administration's voluntary 30-day window, should be as efficient as possible given the field's speed. Meta, lagging in AI, projects up to $145 billion in capital spending this year and laid off 8,000 workers in May citing AI costs.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20WSJ/Mark%20Zuckerberg%20Says%20U.S.%20Should%20Accelerate%20AI%20Development,%20Not%20Restrict%20It.pdf"}, {"id": "wsj-09", "title": "Meta Stock Drops 10% on Steeper AI Costs, Missed Forecast", "source": "WSJ", "date": "31 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Meta Platforms shares fell around 10% in after-hours trading after its second-quarter results heightened worries about AI spending. Despite record revenue of $60.8 billion, up 28%, free cash flow shrank to under $784 million from over $12 billion a quarter earlier, and net income fell 14%. Meta raised its minimum 2026 capital-spending forecast to $130 billion from $125 billion, keeping the $145 billion ceiling. Current-quarter revenue guidance of $61-$64 billion disappointed against roughly $63 billion expected. CEO Zuckerberg said Meta has offers to sell excess compute but prefers using it internally. Legal proceedings cost $2.4 billion, with youth social-media trials looming. Meta recently partnered with BlackRock to raise $12 billion for a Texas data center.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20WSJ/Meta%20Stock%20Drops%2010%25%20on%20Steeper%20AI%20Costs,%20Missed%20Forecast.pdf"}, {"id": "wsj-10", "title": "Microsoft Profit Jumps 31% as Azure Cloud Sales Surpass $100 Billion", "source": "WSJ", "date": "31 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Microsoft reported net income up 31% to $35.8 billion on revenue rising 18% to $90 billion, beating Wall Street forecasts. CEO Satya Nadella disclosed that Azure cloud revenue surpassed $100 billion for the first time in fiscal 2026, a rare breakout figure; Azure grew 43%, with 45% guided for the current quarter. Shares rose 8% after hours. Copilot reached 30 million paid users, up from 20 million. Nadella urged customers not to depend on any single AI model, citing an OpenAI system that hacked Hugging Face. Microsoft booked a $3.2 billion gain from its Anthropic investment. Capital expenditure hit $41 billion; the company cut its 2026 capex forecast to about $175 billion after extending data-center useful life to 25 years.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20WSJ/Microsoft%20Profit%20Jumps%2031%25%20as%20Azure%20Cloud%20Sales%20Surpass%20%24100%20Billion.pdf"}, {"id": "wsj-11", "title": "Oil Jumps as Fresh Middle East Strikes Threaten Fragile Diplomacy", "source": "WSJ", "date": "31 Jul 2026", "tags": ["Energy", "Geopolitics"], "summary": "Oil prices surged more than 7% after fresh Middle East fighting undermined diplomacy to end a five-month conflict. Brent rose 7.5% to $90.37 and WTI 7.1% to $84.89. U.S. forces intercepted Iranian ballistic missiles aimed at troops in Jordan, then the U.S. and Saudi Arabia struck Iran-backed groups in Iraq. Houthi attacks in the Red Sea threaten the Bab al-Mandeb Strait, while Hormuz flows fell about 61%. One strategist warned a war involving Saudi Arabia was the long-feared \"nightmare scenario.\" U.S. crude inventories dropped 7.2 million barrels. Attention turns to Sunday's OPEC+ meeting, expected to approve another 188,000-barrel-a-day September increase, completing the unwinding of 1.65 million barrels of voluntary cuts agreed in 2023.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20WSJ/Oil%20Jumps%20as%20Fresh%20Middle%20East%20Strikes%20Threaten%20Fragile%20Diplomacy.pdf"}, {"id": "wsj-12", "title": "Pentagon Commits Over $120 Billion for Patriot Missiles, Submarines", "source": "WSJ", "date": "31 Jul 2026", "tags": ["Defence"], "summary": "The Pentagon earmarked more than $120 billion for contractors to boost production of Patriot missiles and long-delayed submarines. General Dynamics Electric Boat and HII Newport News won a $76.6 billion deal for nine Virginia-class and five Columbia-class nuclear submarines to be delivered by 2038. A modified Army contract adds Patriot missiles, in heavy demand during the Iran war and in Ukraine. Lockheed also has a preliminary $35 billion Thaad interceptor deal. Both missile contracts span seven years and remain undefinitized, lacking full congressional funding amid skepticism over the administration's $1.5 trillion military spending request. The multiyear approach aims to spur factory investment by guaranteeing steady orders. Newer Patriots cost around $4 million each and take years to produce.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20WSJ/Pentagon%20Commits%20Over%20%24120%20Billion%20for%20Patriot%20Missiles,%20Submarines.pdf"}, {"id": "wsj-13", "title": "Poor Countries Are Aging Fast but Can't Keep Up With the Cost", "source": "WSJ", "date": "31 Jul 2026", "tags": ["Society", "Southeast Asia"], "summary": "Developing countries, especially in Asia, are growing old before growing rich, lacking the pensions and savings that support the elderly in wealthy nations. In a Thai farming village, health aide Boonma Klahan, 57, cares for her mother with dementia and 22 other elderly people on meager government allowances. One in six Thais is over 65, after fertility fell from nearly six children per woman to 0.9 today, while life expectancy jumped to 77. Thailand became an \"aged society\" just 18 years after an aging one, versus 70 years for the U.S., but at far lower income: per-capita GDP was $6,910 versus America's $55,264. Governments in Thailand, Vietnam and China now urge higher birthrates as labor forces shrink.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20WSJ/Poor%20Countries%20Are%20Aging%20Fast%20but%20Can%E2%80%99t%20Keep%20Up%20With%20the%20Cost.pdf"}, {"id": "wsj-14", "title": "Qualcomm to Raise Prices to Offset Higher Costs", "source": "WSJ", "date": "31 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Qualcomm said it will raise product prices to offset higher input costs after third-quarter profit fell on lower sales and rising expenses. Net profit dropped to $2 billion, or $1.87 a share, from $2.67 billion a year earlier; adjusted EPS of $2.21 narrowly missed the $2.23 expected. Revenue declined 4% to $9.95 billion, though above the $9.69 billion forecast. Handset sales slid 20%, offsetting gains in automotive and Internet of Things. The stock fell 7.6% to $143.84 after hours. CEO Cristiano Amon said the whole industry faces surging memory prices, higher manufacturing costs and supply-chain shortages driven by data-center demand. Qualcomm expects the price increases to lift gross margins over time. Current-quarter guidance came in soft.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20WSJ/Qualcomm%20to%20Raise%20Prices%20to%20Offset%20Higher%20Costs.pdf"}, {"id": "wsj-15", "title": "U.S. Retaliates Against Iran for Tuesday's Surprise Attack", "source": "WSJ", "date": "31 Jul 2026", "tags": ["Geopolitics", "Defence"], "summary": "American forces struck Iran on Wednesday night in what the U.S. military called a \"powerful response\" to Iran's ballistic missile attacks on U.S. troops in Jordan. The \"heavy wave\" hit dozens of targets, including command centers, missile and drone facilities, and coastal defense sites, U.S. Central Command said, though officials said it fell short of returning to major combat. President Trump vowed retaliation, saying \"it's our turn.\" Iran's surprise attack shattered a brief ceasefire after talks over Strait of Hormuz shipping collapsed Tuesday. Israeli Prime Minister Netanyahu met Defense Secretary Pete Hegseth in Washington; earlier he and Trump reviewed diplomatic, economic-pressure and military options. Hours after the Jordan strikes, U.S. and Saudi aircraft hit Iran-backed groups in Iraq.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20WSJ/U.S.%20Retaliates%20Against%20Iran%20for%20Tuesday%E2%80%99s%20Surprise%20Attack.pdf"}, {"id": "wsj-16", "title": "UBS Plans $3 Billion Buyback After Investment Bank, Wealth Units Lift Profit", "source": "WSJ", "date": "31 Jul 2026", "tags": ["Finance & Markets"], "summary": "UBS Group plans to buy back $3 billion in stock by mid-2027 after strong second-quarter results driven by its investment bank and wealth-management units. Net profit rose to $2.8 billion from $2.395 billion a year earlier, beating the $2.39 billion forecast, while underlying pretax profit jumped 70% to $3.89 billion. Revenue rose 13% to $13.7 billion. The buyback, with at least $1 billion planned over three months, follows $3 billion already repurchased this year. Its pace depends on Swiss parliamentary debate over tougher capital rules for foreign subsidiaries after the Credit Suisse rescue. Shares rose 3%. Wealth management drew $36 billion in net new money. UBS expects to substantially complete Credit Suisse integration by year-end.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20WSJ/UBS%20Plans%20%243%20Billion%20Buyback%20After%20Investment%20Bank,%20Wealth%20Units%20Lift%20Profit.pdf"}, {"id": "wsj-17", "title": "Warsh's Posture on Interest Rates Sparks Market Inflation Fears", "source": "WSJ", "date": "31 Jul 2026", "tags": ["Finance & Markets"], "summary": "Investors doubt Fed Chairman Kevin Warsh's commitment to fighting inflation, and those worries rippled across markets. Stocks fell and long-term yields jumped Wednesday after Warsh showed reluctance to raise rates even as renewed Middle East fighting threatened energy costs. The Fed held rates steady with three officials dissenting toward a hike; Warsh implied a near-term increase might be unnecessary given rising bond yields, which \"provided us some comfort.\" The S&P 500 fell 1.5% and the Dow dropped over 1,100 points, its biggest decline since April 2025. The 10-year Treasury yield neared 4.7%. One strategist said Warsh is \"strong on inflation in word, but isn't following through in deed.\" Rising yields may still suit the newly appointed chairman.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20WSJ/Warsh%E2%80%99s%20Posture%20on%20Interest%20Rates%20Sparks%20Market%20Inflation%20Fears.pdf"}, {"id": "st-01", "title": "Call for feedback on Spore's first climate adaptation plan", "source": "ST", "date": "31 Jul 2026", "tags": ["Environment", "Society"], "summary": "From July 30, Singapore residents can share feedback on the country's inaugural climate adaptation plan, targeted for publication in 2027, to shape a long-term strategy against climate change. The call was made at the Ministry of Sustainability and the Environment's first National Adaptation Conversation, where over 100 representatives from business, academia, community and youth groups gathered at Sentosa. Talks will cover heat, coastal, flood, water and food resilience, urban liveability, biodiversity and public health. Minister Grace Fu broke ground for a free \"living classroom\" climate adaptation hub on Sentosa's defunct Sijori Wondergolf course, opening by end-2026. Ideas floated included siestas and setting air-conditioning at 25 deg C. Since designating 2026 the Year of Adaptation, MSE has held some 50 stakeholder engagements.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20ST/Call%20for%20feedback%20on%20Spore's%20first%20climate%20adaptation%20plan.pdf"}, {"id": "st-02", "title": "ChatGPT, Roblox to fall under strictest EU rules for platforms", "source": "ST", "date": "31 Jul 2026", "tags": ["Technology & AI", "Politics"], "summary": "OpenAI's ChatGPT and gaming company Roblox will face stricter scrutiny under the European Union's Digital Services Act after surpassing 45 million monthly EU users. The European Commission will designate the two US firms as \"very large online platforms\" as soon as August, a person familiar said. Such platforms, which include Meta and Elon Musk's X, must clamp down on illegal and harmful content, file transparency reports, detail risk mitigation plans and pay an annual fee. Breaches risk fines of up to 6 per cent of annual global sales. Roblox, criticised over child-safety, recently tightened controls. The commission has opened over a dozen probes since 2022, angering the Trump administration, which accuses the EU of censoring US firms. X was fined 120 million euros last December.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20ST/ChatGPT,%20Roblox%20to%20fall%20under%20strictest%20EU%20rules%20for%20platforms.pdf"}, {"id": "st-03", "title": "China warns of retaliation if US sticks with robot import ban", "source": "ST", "date": "31 Jul 2026", "tags": ["Trade", "Geopolitics"], "summary": "China will \"resolutely retaliate\" and safeguard its interests if the US insists on acting unilaterally over an import ban on new Chinese robots and power inverters, the Commerce Ministry said on July 30. The ministry urged Washington to withdraw the measures and stop its \"erroneous actions\" immediately, saying they discriminate against and suppress Chinese companies and products. The US Federal Communications Commission released the measures on July 28, seeking to protect the US artificial intelligence build-out from national security threats and re-shore key industries slated for explosive growth. China said the FCC ignored Beijing's repeated representations and continued to intensify restrictions. The ministry accused the US of generalising national security, calling it \"market distortion and unilateral bullying behaviour\" that ignores the interests of both countries' industries.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20ST/China%20warns%20of%20retaliation%20if%20US%20sticks%20with%20robot%20import%20ban.pdf"}, {"id": "st-04", "title": "China's car sector seeking new stability amid headwinds", "source": "ST", "date": "31 Jul 2026", "tags": ["Finance & Markets", "Trade"], "summary": "China's domestic car market faces a reality check in 2026, with retail sales falling 20.2 per cent in the first half as government subsidies were pulled back and consumer confidence stayed low. The China Passenger Car Association cut its full-year forecast to a 14 per cent decline, projecting 20.4 million cars sold, down from a record 23.7 million in 2025, the worst year since 2021. Analysts cite a slowing economy, demographic change, cutthroat competition and a weak property market. Automakers flooded the market with over 500 new models in the first half. Beijing's partial removal of a purchase-tax exemption for electric and hybrid vehicles hit demand. Analysts see a gradual recovery later in 2026, with electrification and exports as core supports, though exports face rising trade barriers.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20ST/China's%20car%20sector%20seeking%20new%20stability%20amid%20headwinds.pdf"}, {"id": "st-05", "title": "El Nino raises insurance risks for Asia for 2026", "source": "ST", "date": "31 Jul 2026", "tags": ["Environment", "Finance & Markets"], "summary": "Reinsurer Munich Re warned on July 30 of growing risks from a predicted strong El Nino, already under way and strengthening in the Pacific, which forecasters fear will trigger extreme weather worldwide, including Asia. The pattern will push up global temperatures after record heat, heatwaves and wildfires across Europe and North America since May. Natural disasters caused worldwide losses of nearly US$112 billion in the first half of 2026, with twin Venezuela earthquakes and US storms each causing about US$30 billion. Munich Re said Asia-Pacific will suffer most, with higher typhoon risk in Japan and Korea and heatwaves, drought and wildfires across South-east Asia, India and Australia. The US Climate Prediction Center said the El Nino could be among the strongest in over 75 years. Malaysia could hit 40 deg C in early 2027.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20ST/El%20Nino%20raises%20insurance%20risks%20for%20Asia%20for%202026.pdf"}, {"id": "st-06", "title": "Fusion energy firm raises $1 billion", "source": "ST", "date": "31 Jul 2026", "tags": ["Energy", "Finance & Markets"], "summary": "Temasek-backed Commonwealth Fusion Systems raised US$1 billion in its latest funding round, taking total capital raised to US$4 billion to commercialise its nuclear fusion technology. The July 30 round drew pension funds, sovereign wealth funds and industrial partners, whom the firm declined to name. Commonwealth Fusion, the leading US developer, accounts for about 30 per cent of all global private fusion funding, chief executive Bob Mumgaard said. Its SPARC demonstration plant in Massachusetts is about 80 per cent complete and is expected to produce net energy by 2027. The firm, also backed by Google, Nvidia and others, plans its ARC commercial plant in Virginia in the early 2030s, with Google taking half the electricity. Temasek was an early investor from 2020. Singapore could become a regional fusion anchor.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20ST/Fusion%20energy%20firm%20raises%201%20billion.pdf"}, {"id": "st-07", "title": "Mediator Pakistan says US-Iran talks ongoing as foes trade attacks", "source": "ST", "date": "31 Jul 2026", "tags": ["Geopolitics", "Energy"], "summary": "Pakistan insisted on July 30 that US-Iran negotiations were ongoing even as Washington carried out a \"heavy wave of strikes\" retaliating for fresh Iranian attacks targeting Jordan. Recent days saw Saudi Arabia join US strikes on militants in Iraq, and Egypt hit for the first time by a drone at a Mediterranean gas hub. Jordan intercepted Iranian missiles for a second day, while Kuwait said a strike killed a worker at a Chinese company's building. A July ceasefire collapsed, with Iran again closing the Strait of Hormuz, a vital oil and gas conduit. Oil prices soared more than 8 per cent on July 29 before easing, with Brent just below US$90. US strikes hit Khuzestan cities and Qeshm Island; Iran reported civilian and Guard deaths. The war began in February.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20ST/Mediator%20Pakistan%20says%20US-Iran%20talks%20ongoing%20as%20foes%20trade%20attacks.pdf"}, {"id": "st-08", "title": "NYSE-listed AI chip design firm makes second listing in Singapore; hiring for AI and engineering roles", "source": "ST", "date": "31 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Chip designer Ambiq Micro made a secondary listing on the Singapore Exchange mainboard on July 30, giving local investors access to AI and semiconductors. As a listing by introduction, the Texas-headquartered firm, primarily listed on the New York Stock Exchange, is not issuing new shares or raising capital. Its New York shares closed at US$57.26 on July 29; the SGX shares opened at S$73.74 and closed at S$73.80. Ambiq specialises in ultra-low-power semiconductor solutions for edge AI on devices such as wearables, and runs one of its largest global R&D hubs in Singapore. Chief executive Fumihide Esaka said the dual listing reflects long-term commitment to Singapore. The firm is expanding its team, hiring across AI software, IC design and engineering, supported by the Economic Development Board.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20ST/NYSE-listed%20AI%20chip%20design%20firm%20makes%20second%20listing%20in%20Singapore%20hiring%20for%20AI%20and%20engineering%20roles.pdf"}, {"id": "st-09", "title": "Shelter gaps leave Ukrainians desperate, angry as Russian attacks mount", "source": "ST", "date": "31 Jul 2026", "tags": ["Geopolitics", "Society"], "summary": "Residents in one of Kyiv's hardest-hit districts gathered in July to press authorities to open a bomb shelter under preparation since 2023, exposing shelter gaps as Russian attacks intensify. Russia killed 73 people across Kyiv in June and July, its military administration said. Kyiv has 4,358 shelter facilities for three million residents but only around 500 are proper bomb shelters. A school shelter due to open in 2025 will not operate until September due to unfinished utilities and paperwork. Ballistic missiles reach Kyiv in under three minutes. The city's 47 metro stations have become its most reliable shelters; on July 23 a record 56,000 people sought refuge underground. Residents accuse authorities of complacency and say metro security sometimes turns people away before sirens sound.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20ST/Shelter%20gaps%20leave%20Ukrainians%20desperate,%20angry%20as%20Russian%20attacks%20mount.pdf"}, {"id": "st-10", "title": "Sheng Siong prepared to adjust pricing, product mix after RTS opens", "source": "ST", "date": "31 Jul 2026", "tags": ["Finance & Markets", "Society"], "summary": "Sheng Siong may review prices and product range to retain shoppers ahead of the Johor Bahru-Singapore Rapid Transit System Link opening in January 2027, which could intensify grocery competition. Chief executive Lim Hock Chee said on July 29 the chain stands ready to adapt pricing, promotions and product mix, particularly for packaged groceries and household products. A joint study projects Singaporeans will spend $1.05 billion more across the Causeway and a 51 per cent rise in crossings in 2027. Sheng Siong will open three new stores by September and is building a $520 million Sungei Kadut distribution centre, due 2029. First-half 2026 revenue rose 11.9 per cent to $855.4 million and net profit rose 11.9 per cent to $81 million. It declared a higher interim dividend of 3.75 cents.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20ST/Sheng%20Siong%20prepared%20to%20adjust%20pricing,%20product%20mix%20after%20RTS%20opens.pdf"}, {"id": "st-11", "title": "Will Japan finally shed its reputation as a spy paradise?", "source": "ST", "date": "31 Jul 2026", "tags": ["Defence", "Politics"], "summary": "Japan, long regarded as easy to spy on, is taking a first step to fortify its intelligence apparatus. Soviet spy Richard Sorge once likened the country to a crab, hard outside but soft within once penetrated. After 1945, fear of returning to militarism meant repressive laws like the 1925 Peace Preservation Law were annulled and agencies such as the Tokko and Kempeitai abolished, but no new espionage restrictions were introduced, leaving intelligence weak and fragmented. On July 31, the Takaichi government's newly created National Intelligence Council and National Intelligence Bureau formally come into being. The NIB, an upgraded version of the 1986 Cabinet Intelligence and Research Office, gains greater authority to compel agencies to share intelligence. The NIC, chaired by the prime minister, sets intelligence priorities. Partners hope Japan becomes a serious intelligence power.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20ST/Will%20Japan%20finally%20shed%20its%20reputation%20as%20a%20spy%20paradise.pdf"}, {"id": "st-12", "title": "Zelensky plays a new card: MAGA influencer diplomacy", "source": "ST", "date": "31 Jul 2026", "tags": ["Geopolitics", "Politics"], "summary": "Ukrainian President Volodymyr Zelensky's relationship with US President Donald Trump has warmed dramatically since Trump and Vice-President J.D. Vance publicly berated him in the Oval Office in early 2025 as a leader who \"has no cards\". Returning to the White House this week, Zelensky received a beaming welcome, a go-ahead to produce US-designed Patriot interceptor missiles under licence in Ukraine, and rapturous support from senators set to vote on tighter Russia sanctions. Underlining the shift is a conversion among MAGA social influencers such as Laura Loomer, who once called Zelensky \"an actual Nazi\" but travelled to Kyiv, spent a night in a bomb shelter, and admitted: \"I made a mistake.\" Analyst Jonathan Eyal argues Russia's own strategic miscalculations helped shift minds in Washington.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20ST/Zelensky%20plays%20a%20new%20card%20MAGA%20influencer%20diplomacy.pdf"}, {"id": "bt-01", "title": "After keeping rates intact, Fed's Warsh shifts focus back to lowering inflation", "source": "BT", "date": "31 Jul 2026", "tags": ["Finance & Markets"], "summary": "US Federal Reserve chairman Kevin Warsh, at his second FOMC meeting since taking over in May, held rates at 3.5-3.75 per cent, defying some strategists who predicted a hike. Stocks initially bounced given the close call, but Warsh's press conference insistence that returning inflation to 2 per cent remained the priority unsettled markets. The Dow suffered its biggest sell-off in over a year, and the yield curve steepened as 30-year yields hit their highest since 2007, signalling doubts about Fed credibility. Warsh defended weaning markets off constant guidance as \"tough love,\" but analysts warned the approach risks upheaval. September hike odds fell to a coin toss, evoking comparisons to 1970s-80s \"bond-market vigilantes.\"", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20BT/After%20keeping%20rates%20intact,%20Fed's%20Warsh%20shifts%20focus%20back%20to%20lowering%20inflation.pdf"}, {"id": "bt-02", "title": "Asean gold demand in Q2 buoyed by Indonesia, Thailand, bucks broader global sell-off", "source": "BT", "date": "31 Jul 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Asean gold demand stayed resilient in Q2 2026 even as global bar and coin demand fell 3 per cent year on year to 307.1 tonnes, per the World Gold Council. Singapore demand rose 6 per cent to 2.3 tonnes, while Indonesia surged 40 per cent to 14.5 tonnes on currency weakness. Thailand recorded its strongest Q2 since 2019 at 10.9 tonnes, aided by bargain hunting and younger investors; Malaysia grew 28 per cent. Vietnam bucked the trend, shrinking 31 per cent on import-quota constraints. Gold traded near US$4,069 an ounce, down about 26 per cent from January's US$5,500 record. Central banks added 288.9 tonnes to reserves, up 62 per cent. Jewellery demand weakened on high prices.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20BT/Asean%20gold%20demand%20in%20Q2%20buoyed%20by%20Indonesia,%20Thailand,%20bucks%20broader%20global%20sell-off.pdf"}, {"id": "bt-03", "title": "Asean's best defence against US tariff turmoil lies close to home", "source": "BT", "date": "31 Jul 2026", "tags": ["Trade", "Southeast Asia"], "summary": "This commentary argues that Asean's strongest response to US tariff turmoil is deeper regional integration, not just bilateral talks with Washington. Seven member states face US Section 301 actions on forced-labour imports and excess industrial capacity; Thailand was hit with a 12.5 per cent tariff on Jul 24 despite tightening safeguards. Because production networks cross borders, uneven national outcomes could fragment regional trade. Yet intra-Asean trade is only about 20 per cent of total, held back by customs delays and differing standards. The authors urge using existing tools like the Digital Economy Framework Agreement and Asean Power Grid, plus bilateral pathfinders such as Thailand-Singapore energy, PayNow-PromptPay payments and rice supply deals, to build resilience in a \"minus two\" world.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20BT/Asean's%20best%20defence%20against%20US%20tariff%20turmoil%20lies%20close%20to%20home.pdf"}, {"id": "bt-04", "title": "Drone strike near Suez Canal in Egypt raises new security threat in widening war", "source": "BT", "date": "31 Jul 2026", "tags": ["Geopolitics", "Energy"], "summary": "A drone strike on gas vessels at Egypt's Damietta port near the Suez Canal signalled a potential new front in the US-Iran war, threatening a key export route for Saudi oil. Egypt's Cabinet said an unidentified drone caused a fire on two vessels; trading sources named US-owned tanker Energos Winter. Overnight, the US struck Iran's Revolutionary Guards facilities, with Iranian media reporting civilian deaths; Iran retaliated against a US base in Jordan and hit Kuwait. Saudi Arabia publicly joined US strikes for the first time, then urged Washington against escalation. The five-month war, begun in February, has drawn in more countries, with Houthis blockading Saudi routes. Brent crude spiked over 8 per cent Wednesday before easing near US$90.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20BT/Drone%20strike%20near%20Suez%20Canal%20in%20Egypt%20raises%20new%20security%20threat%20in%20widening%20war.pdf"}, {"id": "bt-05", "title": "Eastspring launches EQDP fund targeting income and growth with all-cap strategy", "source": "BT", "date": "31 Jul 2026", "tags": ["Finance & Markets"], "summary": "Eastspring Investments, Prudential's asset management arm, launched an active all-cap Singapore equity fund under MAS's S$6.5 billion Equity Market Development Programme. The Singapore Income and Growth Equity Fund, structured as a unit trust, is \"relatively unique\" in its dual income-and-growth focus, allocating at least 35 per cent to small and mid-cap stocks. Open to institutional and retail investors, it requires a S$1,000 minimum initial investment and holds 20 to 40 stocks benchmarked to the FTSE Straits Times All-Share Index. Eastspring was appointed in November 2025 among a second batch of six managers sharing S$2.85 billion. CIO Vis Nayar noted the Straits Times Index gained 27 per cent over a year, arguing investors need not choose between income and growth.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20BT/Eastspring%20launches%20EQDP%20fund%20targeting%20income%20and%20growth%20with%20all-cap%20strategy.pdf"}, {"id": "bt-06", "title": "Far East Hospitality Trust H1 DPS declines 8.4% to S$0.0163", "source": "BT", "date": "31 Jul 2026", "tags": ["Finance & Markets"], "summary": "Far East Hospitality Trust posted a first-half distribution per stapled security of S$0.0163 for the period ended Jun 30, down 8.4 per cent from S$0.0178, as the prior year included divestment gains from Central Square. Distributable income rose 8.9 per cent to S$33.7 million on lower finance costs, while gross revenue climbed 4.3 per cent to S$53.8 million. Net property income slipped 0.6 per cent to S$45.4 million. Singapore hotels revenue fell 2.7 per cent, but Japan hotel revenue more than doubled to S$4.5 million after the Four Points Nagoya acquisition. Aggregate leverage stood at 32.8 per cent with 2.3 per cent debt cost. Managers cited upcoming F1 and BTS concerts supporting H2 demand. Units closed at S$0.59.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20BT/Far%20East%20Hospitality%20Trust%20H1%20DPS%20declines%208.4%20to%20S0.0163.pdf"}, {"id": "bt-07", "title": "HKSE wants to scrap lunch break; SGX's experience shows traders had little appetite for it", "source": "BT", "date": "31 Jul 2026", "tags": ["Finance & Markets"], "summary": "Hong Kong's exchange is proposing to scrap its one-hour lunch break and bring its open forward to 9 am, ending at 4 pm, part of a global trend toward longer trading hours. The Singapore Exchange tried the same in 2011 but reinstated the pause six years later after weak feedback. Market participants said the additional lunchtime session was thin and illiquid, even sapping enthusiasm from normal hours. Analysts argued longer hours alone do not create liquidity or listings, calling trading hours a \"hygiene factor.\" Others noted operational costs and strain on smaller firms. HKEX's move aims to strengthen its hub status and capture mainland Southbound flows, which made up about a fifth of turnover in 2025. Impact on SGX is seen as limited.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20BT/HKSE%20wants%20to%20scrap%20lunch%20break%20SGX's%20experience%20shows%20traders%20had%20little%20appetite%20for%20it.pdf"}, {"id": "bt-08", "title": "Higher-for-longer rates set to hit Asia's tech sectors as Fed stays the course: analysts", "source": "BT", "date": "31 Jul 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "The US Federal Reserve's decision to hold rates with hawkish messaging means Asia's tech sectors face higher-for-longer borrowing costs, analysts say. The FOMC's split vote, with three officials favouring a hike, and chair Kevin Warsh's avoidance of forward guidance injected volatility into long-end Treasuries. Warsh said the Fed \"will not waver\" on returning inflation to 2 per cent amid climbing energy costs from the Iran conflict. Analysts warned sustained rates could pressure AI capital expenditure, which relies heavily on debt and equity financing, weighing especially on North Asia's semiconductor supply chain. Still, some see Asia's healthier balance sheets as cushioning the impact. Regional central banks are expected to diverge, with MAS tightening, while China and Thailand battle deflation.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20BT/Higher-for-longer%20rates%20set%20to%20hit%20Asia's%20tech%20sectors%20as%20Fed%20stays%20the%20course%20analysts.pdf"}, {"id": "bt-09", "title": "More office buildings lined up for sale ahead of impending Marina One deal", "source": "BT", "date": "31 Jul 2026", "tags": ["Finance & Markets"], "summary": "Strong investment sales in Singapore's office market look set to continue in H2, driven by the impending Marina One mega deal and more assets coming to market. JLL data shows S$10.8 billion of offices transacted in H1 2026, already surpassing last year's S$4 billion, nearing 2007's S$13.3 billion peak. Assets on offer include Frasers Property's half stake in Frasers Tower (over S$1 billion), 30 Raffles Place (guide of at least S$1.1 billion) and Lazada One (S$755 million valuation). Income Centre drew about a dozen bids in the S$240 million-S$250 million range. Marina One, sought at about S$5.7 billion by developer M+S, may be awarded as early as August, with Hongkong Land reportedly the top bidder.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20BT/More%20office%20buildings%20lined%20up%20for%20sale%20ahead%20of%20impending%20Marina%20One%20deal.pdf"}, {"id": "bt-10", "title": "Why China isn't doing more to boost domestic demand", "source": "BT", "date": "31 Jul 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "This commentary examines why Beijing has resisted a large-scale stimulus despite mounting pressure to boost domestic demand. The case for stimulus appears compelling: China's property market remains in a prolonged downturn, consumer confidence is weak, local governments are heavily indebted, and deflationary pressures persist alongside demographic ageing and subdued private investment. Many economists inside and outside China argue Beijing should deploy far larger fiscal stimulus, strengthen the social safety net, raise household incomes, stabilise housing, and rebalance the economy toward consumption. The piece frames the central question as whether Beijing can compete in a prolonged technological and geopolitical rivalry while accepting slower growth, implying policymakers may be prioritising strategic resilience and financial discipline over short-term demand-side stimulus.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20BT/Why%20China%20isn't%20doing%20more%20to%20boost%20domestic%20demand.pdf"}, {"id": "scmp-01", "title": "Ant Group spin-offs pursue independent growth with strategic capital moves", "source": "SCMP", "date": "31 Jul 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Ant Group's three spun-off units are accelerating capital-raising after gaining operational autonomy in 2024. Ant Digital Technologies is preparing a pre-IPO financing round, per STAR Market Daily, without disclosing valuation or listing venue. Ant International, the overseas payments affiliate operating Alipay+, Antom, WorldFirst and Bettr, recently closed a US$1.2 billion Series A with Ant Group, Alibaba and international investors; it reaches roughly 150 million merchants and 2 billion consumer accounts. Database developer OceanBase is seeking its first external equity financing. Since March 2024 each unit runs its own board and employee share plans, with Ant Group as holding company. Ant Digital sells blockchain and enterprise AI, launching Agentar 2.0. Alibaba owns the SCMP.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20SCMP/Ant%20Group%20spin-offs%20pursue%20independent%20growth%20with%20strategic%20capital%20moves.pdf"}, {"id": "scmp-02", "title": "As AI spending soars, can China's tech giants deliver long-term profits?", "source": "SCMP", "date": "31 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "As US tech giants face scrutiny over swelling AI budgets, China's top firms confront the same test: proving infrastructure spending yields sustainable profits. Meta shares fell about 8 per cent after-hours despite US$60.8 billion revenue, following Alphabet's first negative quarterly free cash flow, fuelling bubble fears. Chinese players are matching capex, but the battle is shifting from model capability to capital efficiency. Alibaba's cloud revenue jumped 38 per cent year on year, with AI products generating nearly 9 billion yuan and annualised recurring revenue expected to reach 30 billion yuan by year-end. HSBC estimates China's enterprise AI market at US$178 billion. Analysts argue China's vast addressable market justifies the outlays over time. Alibaba owns the SCMP.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20SCMP/As%20AI%20spending%20soars,%20can%20China%E2%80%99s%20tech%20giants%20deliver%20long-term%20profits.pdf"}, {"id": "scmp-03", "title": "ByteDance's US$4b projected AI revenue tops China as it restructures office tool Lark", "source": "SCMP", "date": "31 Jul 2026", "tags": ["Technology & AI"], "summary": "ByteDance has folded its Lark enterprise-collaboration unit into other teams, sharpening its AI focus on corporate clients as annualised AI revenue hits US$4 billion, the largest publicly known among Chinese rivals. Per an internal memo, Lark's product team merges into the Doubao chatbot team under Zhao Qi; sales and services move to cloud unit Volcano Engine, and development joins AI-applications division Flow. ByteDance's US$4 billion annual recurring revenue from large language models outpaces Zhipu's US$1 billion and DeepSeek's near US$500 million, but trails US firms Anthropic and OpenAI. ByteDance introduced Doubao subscriptions costing 68-500 yuan monthly, losing about 6.1 million users but keeping 330 million, China's most popular AI app. Alibaba owns the SCMP.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20SCMP/ByteDance%E2%80%99s%20US%244b%20projected%20AI%20revenue%20tops%20China%20as%20it%20restructures%20office%20tool%20Lark.pdf"}, {"id": "scmp-04", "title": "China voices 'serious concern' over new US curbs in trade talks between Bessent and He", "source": "SCMP", "date": "31 Jul 2026", "tags": ["Trade", "Geopolitics"], "summary": "China voiced \"serious concern\" over recent US economic restrictions during a video call between Vice-Premier He Lifeng, Treasury Secretary Scott Bessent and Trade Representative Jamieson Greer, as both sides seek deliverables before Xi Jinping's expected September US visit. Bessent said he expected Beijing to fully meet commitments on rare earths and US farm goods. The call followed Washington's Tuesday bans on Chinese robots and power inverters, added to the FCC's Covered List, and last week's Section 301 tariffs on China and 59 economies over forced-labour allegations. China's rare-earth magnet shipments to the US fell 22.5 per cent early this year. Both sides are working to operationalise trade and investment boards, with agriculture and aviation flagged for tariff-reduced trade.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20SCMP/China%20voices%20%E2%80%98serious%20concern%E2%80%99%20over%20new%20US%20curbs%20in%20trade%20talks%20between%20Bessent%20and%20He.pdf"}, {"id": "scmp-05", "title": "China's October plenum plan reveals focus on party discipline ahead of 2027 congress", "source": "SCMP", "date": "31 Jul 2026", "tags": ["Politics"], "summary": "China's Politburo announced the Communist Party's fifth plenum will convene in October, focusing on \"full and rigorous governance over the party\" - shorthand for fighting corruption, tightening discipline and shoring up loyalty. The gathering is the most important before the 21st national congress in autumn 2027, where leadership reshuffles and a likely fourth term for Xi Jinping take centre stage. More than 370 Central Committee members attend. Because a delayed third plenum shifted the schedule, party governance replaced economic planning as the theme. Xi's anti-corruption drive has ensnared senior figures including CMC vice-chairman Zhang Youxia and former Xinjiang chief Ma Xingrui. Analysts say the screening aims to filter compromised candidates and elaborate on Xi's party-building thought ahead of the reshuffle.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20SCMP/China%E2%80%99s%20October%20plenum%20plan%20reveals%20focus%20on%20party%20discipline%20ahead%20of%202027%20congress.pdf"}, {"id": "scmp-06", "title": "China's Politburo pledges policy support, spending to counteract sluggish growth", "source": "SCMP", "date": "31 Jul 2026", "tags": ["Finance & Markets", "Politics"], "summary": "China's Politburo pledged to step up macro policy support, accelerate fiscal spending and bolster capital-market resilience for the rest of 2026, signalling intent to stabilise growth after second-quarter GDP slowed to 4.3 per cent, the weakest since late 2022. The body stopped short of large-scale stimulus, favouring targeted measures and better use of existing policies, analysts said. It urged more balanced trade development amid Western pushback over China's surplus, and vowed to expand domestic demand, strengthen social welfare and protect gig workers. The Politburo set the fifth Central Committee plenum for October, ahead of next year's congress. It also backed the \"six networks\" infrastructure push, tackling \"involution-style\" competition and stabilising the property market.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20SCMP/China%E2%80%99s%20Politburo%20pledges%20policy%20support,%20spending%20to%20counteract%20sluggish%20growth.pdf"}, {"id": "scmp-07", "title": "China's corporate crackdown: insider trading fines and bans intensify", "source": "SCMP", "date": "31 Jul 2026", "tags": ["Finance & Markets"], "summary": "Chinese regulators are intensifying a crackdown on corporate insiders, imposing heavy fines, criminal sentences and market bans to restore confidence in battered stock markets. At least 21 controlling shareholders, chairmen and executives across 20 listed firms were placed under investigation in the first half of 2026, with over two-thirds involving disclosure violations. Regulatory inquiries into 43 companies affected more than 2.5 million retail accounts. Cases include an environmental firm controller sentenced for insider trading and fined 10.6 million yuan, and Breo's chairman receiving a five-year market ban for price rigging. The CSRC issued 226 penalties totalling 3.77 billion yuan. Regulators also revised insider-trading prosecution guidelines for the first time in 14 years, broadening the \"sensitive period\" definition.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/31%20Jul%202026/31%20Jul%20SCMP/China%E2%80%99s%20corporate%20crackdown%20insider%20trading%20fines%20and%20bans%20intensify.pdf"}, {"id": "scmp-08", "title": "China's smart-vacuum giants swept up in US robot ban, hitting top options for Americans", "source": "SCMP", "date": "31 Jul 2026", "tags": ["Technology & AI", "Trade"], "summary": "Washington's fresh import ban on foreign robots threatens to lock market-dominating Chinese smart vacuums out of American homes. The FCC added foreign-made \"advanced robotic devices\" to its Covered List on Tuesday, blocking equipment authorisation for import and sale. Though initially framed around humanoids and quadrupeds, the ban covers mobile devices over 2kg, including robotic vacuums, lawnmowers, window cleaners and pool scrubbers. Chinese brands Roborock, Ec
