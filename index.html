 ever, with 3.6 million followers. Qantas has ordered 12 modified jets to link its east coast with London and New York in about 20 hours. The first aircraft, seating 238, is due in April 2027, with daily nonstop Sydney-London flights from October 2027.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20BT/Airbus%20A350%20jet%20flies%2024%20hours%20nonstop%20from%20Australia%20to%20France%20in%20record-breaking%20flight.pdf"}, {"id": "bt-02", "title": "Aramco mulls new oil pricing for Asia as Houthis threaten flows", "source": "BT", "date": "30 Jul 2026", "tags": ["Energy", "Geopolitics"], "summary": "Saudi Aramco is preparing a new selling price for oil loaded at Egypt's Mediterranean port of Sidi Kerir for Asian delivery, after Iran-backed Houthi attacks raised Red Sea risks. It has told at least two Chinese refiners it may introduce a separate official price, as shipowners avoid Yanbu. Asian refiners are pressing for discounts to offset higher freight costs and longer transit around the Cape of Good Hope; Indian state refiners seek US$5 to US$10 a barrel reductions. Details, including a start date, are unfinalised. Buyers leaned on Yanbu after the Iran war shut the Strait of Hormuz. On Jul 28, the US intercepted an Iranian attack on regional bases, ending a pause in fighting.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20BT/Aramco%20mulls%20new%20oil%20pricing%20for%20Asia%20as%20Houthis%20threaten%20flows.pdf"}, {"id": "bt-03", "title": "China doesn't need to build better AI than the US to win the tech race", "source": "BT", "date": "30 Jul 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "This commentary argues China can win the AI race by making models good enough, cheap enough and open enough for businesses to adopt, rather than building the smartest. Moonshot's Kimi K3 open-weight model, unveiled Jul 17, reportedly rivals Anthropic and OpenAI at a fraction of the cost. The UK's AI Security Institute found leading Chinese open-weight models now trail US frontier models by just four to seven months, down from six to 10 in 2025. Open weights let firms download, customise and run AI on their own infrastructure, cutting costs. Xi Jinping urged equitable AI access at Shanghai's conference. NYU's Scott Galloway likens the strategy to AI \"dumping\"; Nvidia, Microsoft and Meta oppose premature restrictions.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20BT/China%20doesn't%20need%20to%20build%20better%20AI%20than%20the%20US%20to%20win%20the%20tech%20race.pdf"}, {"id": "bt-04", "title": "Is Singapore still competitive in a world with a global minimum tax?", "source": "BT", "date": "30 Jul 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "This commentary asks whether Singapore remains competitive now that a global minimum tax has eroded its incentives. Iras' June 2026 Transfer Pricing Guidelines amended treatment of share-based compensation, letting uncharged, notional stock-compensation costs be excluded from a Singapore subsidiary's taxable service income from 2026, easing a long-standing double whammy. The writer flags three frictions for holding and IP structures: awkward foreign-dividend exemption tests versus clearer Dutch and Luxembourg regimes; overlapping share-disposal rules; and IP being singled out under foreign-asset disposal rules without substance-based relief. With tax-rate competition over, the author argues Singapore's real prize is certainty, urging it become the most predictable jurisdiction. Written by infer360's CEO, a former Big Four tax partner.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20BT/Is%20Singapore%20still%20competitive%20in%20a%20world%20with%20a%20global%20minimum%20tax.pdf"}, {"id": "bt-05", "title": "Keppel Reit H1 DPU dips 4% to S$0.0261 on enlarged unit base, sells Ginza office block for US$70 million", "source": "BT", "date": "30 Jul 2026", "tags": ["Finance & Markets"], "summary": "Keppel Reit posted a first-half distribution per unit of S$0.0261, down 4% from S$0.0272 a year earlier, due to an enlarged unit base. Distributable income from operations rose 25.2% to S$119.6 million; including the unchanged S$10 million anniversary distribution, it reached S$129.6 million, up 22.8%. Property income climbed 16.7% to S$159.3 million, aided by Top Ryde City Shopping Centre, while net property income to unitholders rose 13.3% to S$112.1 million. The Reit committed over 1.1 million square feet of leases, achieving 12.8% rental reversion; aggregate leverage was 40%. Separately, it is divesting its majority stake in Tokyo's KR Ginza II for 11.5 billion yen (US$70.2 million), a 28.4% premium over purchase price.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20BT/Keppel%20Reit%20H1%20DPU%20dips%204%20to%20S0.0261%20on%20enlarged%20unit%20base,%20sells%20Ginza%20office%20block%20for%20US70%20million.pdf"}, {"id": "bt-06", "title": "Not many STI listcos provide substantial forward-looking guidance: study", "source": "BT", "date": "30 Jul 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "A study by Black Sun Global and the Securities Investors Association (Singapore) found only 13% of Straits Times Index constituents provide structured medium-term financial guidance, far below the FTSE 100's 59%. Launched Jul 29, it reviewed reporting across the 30 largest, most liquid SGX companies, concluding they report well on the past but are cautious about the future. Despite strong fundamentals, 57% did not articulate a clear, differentiated investment case. Only 18% of surveyed institutional investors deemed disclosures highly transparent. Examples of good practice included Genting Singapore, ST Engineering and DBS. The findings come as SGX and MAS roll out the S$6.5 billion Equity Market Development Programme and S$30 million Value Unlock scheme; about 64% of SGX firms trade below book value.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20BT/Not%20many%20STI%20listcos%20provide%20substantial%20forward-looking%20guidance%20study.pdf"}, {"id": "bt-07", "title": "OCBC to cut wealth onboarding to 15 business days with agentic AI; simple cases in one day", "source": "BT", "date": "30 Jul 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "OCBC is looking to cut onboarding across all wealth clients to 15 business days using agentic AI, with straightforward cases potentially done within a day. Announced Jul 29, the move follows MAS' push to reduce private banking account-opening timelines to within a month by end-2026; OCBC's current average exceeds 30 days versus an industry median of six weeks. Its Helios platform comprises five agents, moving due diligence before relationship managers meet prospects and flagging information gaps. Four agents are live; a fifth for ongoing monitoring is due by H1 2027. Bank of Singapore has tested it on a quarter of relationship managers, with rollout by Q3 2026. DBS opens accounts within a week; UOB in seven calendar days.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20BT/OCBC%20to%20cut%20wealth%20onboarding%20to%2015%20business%20days%20with%20agentic%20AI%20simple%20cases%20in%20one%20day.pdf"}, {"id": "bt-08", "title": "Sembcorp to purchase 20% stake in clean power unit of Singapore refiner Aster", "source": "BT", "date": "30 Jul 2026", "tags": ["Energy", "Southeast Asia"], "summary": "Sembcorp Industries has agreed to buy a 20% stake in Aster Power, the clean power business of Singapore oil refiner Aster Chemicals and Energy. Sembcorp Utilities inked the agreement Jul 29 with Aster Power and Aster Asia Alpha; the deal value is undisclosed. Sembcorp will also become Aster Power's sole gas supplier, supporting growth in power, steam and renewable energy. Parent Aster is an 80:20 joint venture between Indonesia's Chandra Asri and Glencore, which bought Shell's Pulau Bukom refinery and Jurong Island assets. Aster Power, set up in October, plans a US$150 million hydrogen-ready gas turbine and is deploying 16 megawatt-peak of solar with Sembcorp Solar. The deal awaits regulatory approvals; OCBC is exclusive financial adviser. Sembcorp closed 2.8% higher at S$5.57.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20BT/Sembcorp%20to%20purchase%2020%20stake%20in%20clean%20power%20unit%20of%20Singapore%20refiner%20Aster.pdf"}, {"id": "bt-09", "title": "Sheng Siong H1 net profit rises 11.7% to S$80.8 million on improved sales mix", "source": "BT", "date": "30 Jul 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Supermarket operator Sheng Siong posted an 11.7% rise in first-half FY2026 net profit to S$80.8 million, from S$72.3 million. Revenue grew 11.9% to S$855.4 million, driven by 16 new stores opened in FY2025 and H1 FY2026 plus higher comparable store sales. Gross profit rose 15.6% to S$272.4 million, with margins up one percentage point to 31.8% on a better sales mix and cost mitigation. The board declared a higher interim dividend of S$0.0375 per share, up from S$0.032, payable Aug 28. On Jul 13, the group broke ground on a Sungei Kadut distribution centre, slated for 2029, to support over 120 stores. CEO Lim Hock Chee expects three new stores in Q3. Shares closed at S$3.26.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20BT/Sheng%20Siong%20H1%20net%20profit%20rises%2011.7%20to%20S80.8%20million%20on%20improved%20sales%20mix.pdf"}, {"id": "bt-10", "title": "Singtel explores Nasdaq-SGX dual listing for data centre arm Nxera, local data centre Reit", "source": "BT", "date": "30 Jul 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Singtel said on Jul 29 it is considering a Nasdaq-SGX dual listing for data centre arm Nxera, plus a data centre Reit, though both remain exploratory with no decision on scale, date or structure. CEO Yuen Kuan Moon said it is in the evaluation stage, part of the capital-recycling \"Singtel28\" plan. Nxera's capacity across Singapore, Malaysia, Thailand and Indonesia will more than double to over 200 megawatts by end-2026; Yuen expects the business to top S$300 million in Ebitda by 2028. Shareholders questioned KPMG's reappointment after Australia staff shared sensitive Optus information; the resolution passed with 99.79%. The KKR-led STT GDC deal, leaving Singtel with 25%, is expected to close within two months. Shares finished 1.8% higher at S$4.61.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20BT/Singtel%20explores%20Nasdaq-SGX%20dual%20listing%20for%20data%20centre%20arm%20Nxera,%20local%20data%20centre%20Reit.pdf"}, {"id": "bt-11", "title": "South Korea's US$2 trillion stock rout breaks records as SK Hynix results disappoint", "source": "BT", "date": "30 Jul 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "South Korean stocks plunged for a second session on Jul 29 as Asia's AI rally turned into a rout, wiping as much as US$2.18 trillion from Seoul's market and hitting leveraged retail investors. The Kospi dived up to 12.6% before closing down 6%, extending Tuesday's near-11% fall and on course for its steepest monthly decline on record, erasing almost 40% from its peak. Blockbuster SK Hynix earnings, a six-fold profit jump, lagged lofty expectations; shares closed down 9.6%, Samsung down 5.2%. Finance Minister Koo Yun-cheol apologised for single-stock leveraged ETFs. Asian chip stocks fell, including TSMC, UMC and Kioxia. Despite the tumble, the Kospi remains up 41.5% in US dollar terms year-to-date, the best-performing major market.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20BT/South%20Korea's%20US2%20trillion%20stock%20rout%20breaks%20records%20as%20SK%20Hynix%20results%20disappoint.pdf"}, {"id": "bt-12", "title": "Taiwan's ultra-wealthy turn to Singapore for succession, regional expansion", "source": "BT", "date": "30 Jul 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Taiwanese ultra-high-net-worth clients are increasingly turning to Singapore not only to preserve wealth but to expand internationally and plan succession, wealth managers and lawyers say. The shift follows an AI- and semiconductor-driven surge, with Taiwan's Taiex up around 50% this year and its central bank lifting 2026 growth forecasts to 9.45%. KGP Legal reported over 15 queries this year, up from four or five, with demand for trusts, variable capital companies and single-family offices. DBS called Taiwan a \"standout\" market, up 30%; UOB and UOB Kay Hian cite steady flows. A BCG-CTBC report projects Taiwan's ultra-rich wealth reaching NT$59 trillion (US$1.8 trillion) by 2029; 55% recently increased Singapore allocations. Advisers cite Singapore's stability, rule of law and neutral-hub status.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20BT/Taiwan's%20ultra-wealthy%20turn%20to%20Singapore%20for%20succession,%20regional%20expansion.pdf"}, {"id": "bt-13", "title": "Trump's revamped tariff wall is solidifying with new statutes", "source": "BT", "date": "30 Jul 2026", "tags": ["Trade", "Geopolitics"], "summary": "This commentary warns that despite the \"Taco\" jibe and 39 of 63 tariff threats withdrawn or unimposed, US President Trump's tariff regime is hardening via new legal bases. After a February 2026 Supreme Court ruling denied IEEPA as tariff justification, the administration pivoted to Section 301 of the Trade Act 1974. On Jul 24, a forced-labour investigation produced 10-12.5% tariffs on 60 trade partners, including Singapore, with excess-capacity and IP-enforcement probes underway. Section 338 of the 1930 Smoot-Hawley Act was used for a 50% tariff on US$20 billion of Canadian imports. Singapore says only a third of its US exports are affected. The writer, an RSIS research fellow, urges South-east Asian governments to diversify trade connections.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20BT/Trump's%20revamped%20tariff%20wall%20is%20solidifying%20with%20new%20statutes.pdf"}, {"id": "bt-14", "title": "What the new World Artificial Intelligence Cooperation Organization means for businesses in Asia", "source": "BT", "date": "30 Jul 2026", "tags": ["Technology & AI", "Southeast Asia"], "summary": "This commentary examines the World Artificial Intelligence Cooperation Organization (Waico), established when representatives of 29 countries signed an agreement at Shanghai's World Artificial Intelligence Conference. Five Asean states, Indonesia, Malaysia, Cambodia, Laos and Myanmar, became founding members, while Singapore, Vietnam, Thailand, Timor-Leste and the Philippines did not. The article suggests the divergent decisions reflect each country's development needs, regulatory priorities and technology partnerships rather than a clear regional split in alignment. It argues that if Waico supports compatible standards, stronger institutions and wider technology access, it could reduce some costs of AI adoption for businesses across Asia.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20BT/What%20the%20new%20World%20Artificial%20Intelligence%20Cooperation%20Organization%20means%20for%20businesses%20in%20Asia.pdf"}, {"id": "scmp-01", "title": "Beijing's latest salvo in the war on 'involution' is warranted", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Finance & Markets", "Politics"], "summary": "China's regulators imposed a 5.2 billion yuan (US$765 million) fine on Trip.com Group, the country's largest online travel provider, for monopolistic practices, part of a broader campaign against \"involution\" - self-defeating cutthroat price wars. A months-long antitrust probe found Trip.com exploited traffic-allocation algorithms and its dominant position to pressure hotels into exclusive deals and lowest-rate guarantees since 2020. The penalty, equivalent to 7.5 per cent of 2025 domestic sales, includes recovering 1.658 billion yuan in illegal gains. It is the most significant antitrust action since the 2021 tech crackdown. The SCMP editorial argues Beijing is right to target involution, which undermines its \"dual circulation\" strategy, and urges regulators to stay vigilant across e-commerce and e-ticketing sectors.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20SCMP/Beijing%E2%80%99s%20latest%20salvo%20in%20the%20war%20on%20%E2%80%98involution%E2%80%99%20is%20warranted.pdf"}, {"id": "scmp-02", "title": "Can China's EV boom give it decisive edge in geopolitical tech war?", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Technology & AI", "Geopolitics", "Trade"], "summary": "China may increasingly use its dominance in the global electric-vehicle industry as geopolitical leverage over countries reliant on its technology and supply chains, analysts said at an Asia Society Policy Institute event. Michael Dunne of Dunne Insights described a strategy to \"overwhelm the industry, capture it\" and use it as leverage. Monthly vehicle exports topped one million for the first time in June, with 12 million projected by year-end. Former Canadian diplomat Michael Kovrig called EVs \"the perfect instrument\", warning Beijing was using auto access to extract political concessions, citing Canada's tariff-cutting deal. The US keeps tariffs above 120 per cent and restricts China-linked software, viewing its market as Chinese carmakers' \"ultimate target\".", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20SCMP/Can%20China%E2%80%99s%20EV%20boom%20give%20it%20decisive%20edge%20in%20geopolitical%20tech%20war.pdf"}, {"id": "scmp-03", "title": "Can the US fend off China's subsea drones? Its coastguard looks for answers", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Defence", "Technology & AI"], "summary": "As China expands its autonomous underwater fleet, the US Coast Guard is seeking commercial technology to detect, track and disable unmanned underwater vehicles (UUVs), highlighting a gap in America's maritime defences. A July 24 notice, which does not mention China, follows Beijing's September military parade unveiling systems including the HSU-001 and extra-large AJX-002. Analysts say Cold War-era hydrophone networks are ill-suited to smaller, stealthier drones. Timothy Heath of Perceptum warned UUVs could strike warships in port - as Ukraine did against a Russian submarine - or damage infrastructure, calling the threat \"real and growing\". Countering them likely requires combined technologies, including sonar, nets, barriers and adapted anti-torpedo interceptors, amid wider global proliferation of drones by state and non-state actors.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20SCMP/Can%20the%20US%20fend%20off%20China%E2%80%99s%20subsea%20drones%20Its%20coastguard%20looks%20for%20answers.pdf"}, {"id": "scmp-04", "title": "China's hi-tech boom pushes firms to boost pay in 2027 as keeping talent a priority", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Technology & AI", "Society"], "summary": "Chinese employers expect a median salary increase of 4.5 per cent in 2027, up from 4.3 per cent in 2026, as firms fight to retain top talent despite cost pressures, according to advisory WTW. The three-year figure still lags Asia-Pacific averages by 0.4 percentage points. A \"staggering\" 37.5 per cent of 938 surveyed organisations prioritised employee retention amid a tight labour market in high-growth sectors. WTW cited intense cost-control and weak 2026 results. Competition for talent is fierce: ByteDance reportedly offered a former DeepSeek researcher up to 100 million yuan (US$14.8 million). Hong Kong increases stay moderate, rebounding to 3.8 per cent in 2027, while India leads the region at 9 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20SCMP/China%E2%80%99s%20hi-tech%20boom%20pushes%20firms%20to%20boost%20pay%20in%202027%20as%20keeping%20talent%20a%20priority.pdf"}, {"id": "scmp-05", "title": "China's solar surge nears historic milestone - even as Beijing slams brakes on sheer scale", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Energy", "Environment"], "summary": "Solar is poised to overtake coal as China's largest source of installed power capacity this year, as Beijing emphasises efficiency and quality over sheer scale. Installed solar reached 1.27 billion kilowatts by end-June and is projected to surpass coal before year-end, state media reported, citing the photovoltaic industry association. Solar generation surged more than 40 per cent year on year in the first half. A new roadmap targets combined solar and wind capacity above 2.8 million kW by 2030. Yet new panel installations plunged 66 per cent to about 72 gigawatts as Beijing curbed overcapacity and below-cost selling. Analysts said the sector entered \"high-quality development\", but warned intermittent solar needs storage, flexible coal and grid support.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20SCMP/China%E2%80%99s%20solar%20surge%20nears%20historic%20milestone%20%E2%80%93%20even%20as%20Beijing%20slams%20brakes%20on%20sheer%20scale.pdf"}, {"id": "scmp-06", "title": "Chinese AI start-up Moonshot seeks influential ambassadors to widen Kimi's global reach", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Technology & AI"], "summary": "China's Moonshot AI launched a \"Kimi Ambassador Program\" to expand the global reach of its Kimi K3 model, which stunned observers with performance close to American frontier systems. The Beijing start-up is recruiting influential entrepreneurs, developers, content creators and students who use Kimi to build communities and share experiences. Applicants complete an 11-question form; successful candidates gain early access to unreleased models, API credits and direct engagement with product teams. Moonshot is also advertising in Silicon Valley, with a billboard touting Kimi as an open model costing \"70 per cent less\". The move mirrors similar community programmes from Anthropic and OpenAI, reflecting an industry shift toward developer ecosystems as AI agents handle increasingly complex, multi-step workflows.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20SCMP/Chinese%20AI%20start-up%20Moonshot%20seeks%20influential%20ambassadors%20to%20widen%20Kimi%E2%80%99s%20global%20reach.pdf"}, {"id": "scmp-07", "title": "How South Korea's tech rout hit Hong Kong - and why regulators stepped in", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "South Korea's volatile market, driven by swings in Samsung and SK Hynix, has rippled into Hong Kong, prompting regulators to overhaul high-risk investment rules. A CSOP Hong Kong-listed leveraged product tracking SK Hynix, once the city's largest ETP at over HK$130 billion, has collapsed roughly 80 per cent since early July. Analysts blamed fears over rising competition from China's ChangXin Memory and doubts about AI payback periods. The Kospi tumbled more than 11 per cent Tuesday, triggering its eighth circuit breaker of the year. One Hong Kong manager allegedly misappropriated HK$50 million to speculate on the ETF. The Securities and Futures Commission ordered issuers to add safety buffers allowing flexible daily leverage adjustments within existing limits.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20SCMP/How%20South%20Korea%E2%80%99s%20tech%20rout%20hit%20Hong%20Kong%20%E2%80%93%20and%20why%20regulators%20stepped%20in.pdf"}, {"id": "scmp-08", "title": "Inside America's US$1.5 billion play for Southeast Asian energy", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Energy", "Southeast Asia", "Geopolitics"], "summary": "The United States is pitching billions in investment to become Southeast Asia's energy partner of choice, offering liquefied natural gas, grid technology and small modular nuclear reactors as Iran-war turmoil sharpens supply-shock fears. Washington announced US$1.5 billion in financing through its Development Finance Corporation on July 22 - the agency's \"single largest project investment\" - unveiled during Secretary of State Marco Rubio's Manila visit, alongside a further US$2.5 billion commitment. Analysts say the push serves US commercial and strategic interests, countering China's infrastructure dominance and opening LNG markets. But experts caution the money is \"a platform, not a list of ready-to-build projects\", with talks on Vietnam's grid and Indonesia's energy security still early-stage amid weak transmission networks and regulatory uncertainty.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20SCMP/Inside%20America%E2%80%99s%20US%241.5%20billion%20play%20for%20Southeast%20Asian%20energy.pdf"}, {"id": "scmp-09", "title": "Iranian missile salvoes and US-Saudi strikes shatter brief Middle East lull", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Geopolitics", "Defence"], "summary": "Jordan's air defences intercepted five Iranian missiles early Wednesday, hours after the US said it downed an Iranian barrage targeting American forces, shattering a brief Middle East lull. Iran's Revolutionary Guard said it fired ballistic missiles at Jordan's Muwaffaq Salti Air Base and US Central Command headquarters. US and Saudi aircraft struck Tehran-backed militia sites in eastern Iraq in response to over 30 drone attacks; Iraq's Popular Mobilisation Forces reported at least 20 fighters killed. Washington warned further attacks on troops or Saudi energy infrastructure risked additional action. Oil prices spiked, with Brent crude up 3.1 per cent to US$84.58. The flare-up followed weeks of escalation over the Strait of Hormuz, through which 20 per cent of traded oil flows.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20SCMP/Iranian%20missile%20salvoes%20and%20US-Saudi%20strikes%20shatter%20brief%20Middle%20East%20lull.pdf"}, {"id": "scmp-10", "title": "The CXMT shock: how China's viable alternatives punch Nvidia, Micron, SK Hynix shares", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "China's growing clout in the semiconductor supply chain is accelerating the unravelling of the AI trade as investors anticipate cheaper Chinese alternatives. ChangXin Memory Technologies' US$9.8 billion Shanghai listing surged 466 per cent on debut, making it the mainland's most valuable stock at 3.3 trillion yuan (US$487.3 billion) and sending SK Hynix and Micron shares tumbling. Reports that China will deliver home-made DUV lithography machines this year rattled ASML. Analysts said China's advances promise low-cost substitutes eroding incumbents' margins, turning AI into \"a two-sided trade\". Adding pressure, Moonshot's 2.8-trillion-parameter Kimi K3 nearly matches OpenAI and Anthropic. The Nasdaq 100 nears correction while South Korea's Kospi has shed roughly 40 per cent in a month.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20SCMP/The%20CXMT%20shock%20how%20China%E2%80%99s%20viable%20alternatives%20punch%20Nvidia,%20Micron,%20SK%20Hynix%20shares.pdf"}, {"id": "scmp-11", "title": "US Federal Reserve holds interest rates steady despite Warsh's inflation vow", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Finance & Markets", "Politics"], "summary": "The Federal Reserve held interest rates steady Wednesday, keeping the benchmark in the 3.50-3.75 per cent range, raising questions about how new chief Kevin Warsh will meet his pledge to return inflation to 2 per cent. Three of twelve policymakers - the Cleveland, Dallas and Minneapolis presidents - dissented, preferring a quarter-point hike. Warsh, who took over in May, has said he has \"no tolerance\" for inflation running above target for over five years, pushed higher by Trump's Middle East war and AI-driven data-centre spending. The Fed said activity is \"expanding at a solid pace\". Analysts expect a 25-basis-point hike in September absent a labour-market collapse. Stocks pared losses and the dollar fell after the decision.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20SCMP/US%20Federal%20Reserve%20holds%20interest%20rates%20steady%20despite%20Warsh%E2%80%99s%20inflation%20vow.pdf"}, {"id": "scmp-12", "title": "US sanctions mainland China, Hong Kong shipping firms over Iranian oil deliveries", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Geopolitics", "Trade", "Energy"], "summary": "The United States on Wednesday sanctioned eight mainland Chinese and Hong Kong shipping companies accused of operating vessels that moved Iranian oil to China and the UAE, extending its economic campaign against Tehran alongside a naval blockade. Six of eight identified tankers allegedly carried Iranian crude to China, some transporting millions of barrels during 2026. One firm is mainland-based; five are wholly or partly in Hong Kong. The designations freeze US-jurisdiction assets and expose foreign institutions to secondary sanctions. Treasury Secretary Scott Bessent said Iran's economy was \"in free fall\" with triple-digit inflation. State Department spokesman Tommy Pigott linked the measures to enforcing the blockade and protecting Strait of Hormuz navigation rights, vowing to work with allies to isolate Tehran.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20SCMP/US%20sanctions%20mainland%20China,%20Hong%20Kong%20shipping%20firms%20over%20Iranian%20oil%20deliveries.pdf"}, {"id": "scmp-13", "title": "Why US-led alliance might struggle to rein in Beijing's growing 6G influence", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "As the United States builds a 6G alliance with 24 countries including the UK, Germany and Japan, analysts say Washington faces short-term challenges countering Beijing's growing influence. The Commerce Department initiative aims to coordinate national 6G strategies, share technical resources and build a \"trusted\" supply chain reducing Chinese firms like Huawei, ahead of commercial deployment in the 2030s. 6G is expected to integrate AI, sensing and computing. But researcher Shan Guangcun said China has over 300 key 6G technologies and the world's largest telecoms market, while the US roadmap \"remains less clear\". Natixis economist Alicia Garcia-Herrero called the alliance \"necessary but not sufficient\", saying success depends on concrete spectrum decisions, industrial policy and R&D, not the declaration itself.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20SCMP/Why%20US-led%20alliance%20might%20struggle%20to%20rein%20in%20Beijing%E2%80%99s%20growing%206G%20influence.pdf"}, {"id": "scmp-14", "title": "Why has the China-US profit gap widened on the Fortune Global 500?", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Finance & Markets", "Trade"], "summary": "China's structural economic problems are eroding profits, leaving its multinationals far behind US peers on the latest Fortune Global 500 despite strong revenues. Chinese companies averaged US$4.5 billion profit in 2025, about 40 per cent of the US$11.24 billion for US counterparts. Since 2021, Chinese average profits rose 27 per cent versus 110 per cent for US firms, as American AI leaders accumulated wealth from asset gains. Amazon became the top firm by revenue, ending Walmart's 12-year reign; State Grid ranked third. Alphabet, Nvidia and Apple were most profitable. The 141 US firms generated 47 per cent of total earnings. China's 122 listed firms posted US$10.4 trillion combined revenue, down 2 per cent year on year.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20SCMP/Why%20has%20the%20China-US%20profit%20gap%20widened%20on%20the%20Fortune%20Global%20500.pdf"}, {"id": "scmp-15", "title": "Zelensky pursues Patriot missile licences in White House meeting with Trump", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Geopolitics", "Defence"], "summary": "Ukrainian President Volodymyr Zelensky sought licences to produce Patriot air-defence interceptors during a \"good meeting\" with Donald Trump at the White House on Tuesday, as long-range strikes intensified and US-led peace efforts stalled. Zelensky said Trump \"accepted that he will give us\" the licences and that he met US arms firms hoping for co-production. Kyiv's priorities were fresh anti-ballistic missiles and reviving diplomacy, more than four years after Russia's invasion. Last month was the deadliest for Ukrainian civilians since April 2022. Zelensky also attended a memorial for the late senator Lindsey Graham and addressed senators before a procedural vote advancing a bipartisan Russia sanctions bill, which would expand Trump's power to tariff buyers of Russian energy.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20SCMP/Zelensky%20pursues%20Patriot%20missile%20licences%20in%20White%20House%20meeting%20with%20Trump.pdf"}, {"id": "scmp-16", "title": "'Negotiation fatigue' risks stalling South China Sea code of conduct progress", "source": "SCMP", "date": "30 Jul 2026", "tags": ["Geopolitics", "Southeast Asia"], "summary": "Asean's optimism about concluding a South China Sea code of conduct (COC) with China this year is not shared by observers, who highlight persistent gaps, particularly between Beijing and Manila. Philippine Foreign Secretary Maria Theresa Lazaro said parties intended to finish \"within the year\", and Asean ministers welcomed \"significant progress\". But negotiations have dragged over two decades amid disputes over legal bindingness, geographic scope and external powers. Analyst Le Hong Hiep said only a scaled-back, \"largely symbolic\" deal could be reached by year-end, noting China and Vietnam continue island-building in the Paracels and Spratlys. Continued clashes near Scarborough and Second Thomas shoals underscore urgency, while \"negotiation fatigue\" risks stalling progress despite the importance of sustained dialogue.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/30%20Jul%202026/30%20Jul%20SCMP/%E2%80%98Negotiation%20fatigue%E2%80%99%20risks%20stalling%20South%20China%20Sea%20code%20of%20conduct%20progress.pdf"}]}};</script>
