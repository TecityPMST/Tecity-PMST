's Green Bond Framework, it funds the Green Plan 2030, including the Jurong Region and Cross Island MRT lines.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/24%20Jul%202026/24%20Jul%20BT/Singapore%20prices%20S2.6%20billion%20of%2020-year%20green%20bonds%20at%202.4.pdf"}, {"id": "scmp-01", "title": "Alibaba unit says 5-in-1 AI gives robots unified brain, body and limbs", "source": "SCMP", "date": "24 Jul 2026", "tags": ["Technology & AI"], "summary": "Alibaba's mapping unit Amap has unveiled an upgrade to its ABot framework, which it calls the world's first technology system uniting a robot's \"feet, hands, brains, central nerves and motor nerves\" into one embodied-intelligence platform. Five specialised foundation models work in concert: ABot-N1 achieves a 92.9 per cent outdoor navigation success rate using only standard cameras, while ABot-M0.5 lets robots grasp objects while walking. ABot-ER and ABot-AgentOS act as brain and nervous system, and ABot-C0 as motor nerves. Amap says the framework secured state-of-the-art results across 17 global robotics benchmarks. The move intensifies a Chinese tech race in embodied AI, with Tencent debuting Hy-Embodied models and Ant Group's Robbyant launching a spatial-perception model.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/24%20Jul%202026/24%20Jul%20SCMP/Alibaba%20unit%20says%205-in-1%20AI%20gives%20robots%20unified%20brain,%20body%20and%20limbs.pdf"}, {"id": "scmp-02", "title": "China vows to defend Brazil's sovereignty as Trump's 25% tariff bites", "source": "SCMP", "date": "24 Jul 2026", "tags": ["Geopolitics", "Trade"], "summary": "Chinese Foreign Minister Wang Yi told Brazil that Beijing would keep supporting its \"sovereignty, security and development interests\", hours after a 25 per cent US tariff on Brazilian goods took effect. Meeting Brazilian counterpart Mauro Vieira in Manila on the Asean sidelines, Wang paired the pledge with a request that Brazil respect China's core interests over Taiwan, Tibet, Xinjiang and Hong Kong. The US share of Brazilian exports fell to 9.4 per cent, a record low, while China's rose to 31.5 per cent; Brazilian exports to China hit US$58.3 billion in six months. Washington's tariffs are tied partly to Bolsonaro's prosecution. Brazil joined China's Waico AI initiative on July 16 as one of 29 signatories; no US or EU government signed.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/24%20Jul%202026/24%20Jul%20SCMP/China%20vows%20to%20defend%20Brazil%E2%80%99s%20sovereignty%20as%20Trump%E2%80%99s%2025%25%20tariff%20bites.pdf"}, {"id": "scmp-03", "title": "China's new chip stores data with a single electron, breaking AI memory bottleneck", "source": "SCMP", "date": "24 Jul 2026", "tags": ["Technology & AI"], "summary": "A Fudan University team led by microelectronics professor Zhou Peng has built a two-dimensional flash memory that traps and reads a single electron at room temperature, versus the roughly 200,000 electrons needed per bit in advanced DRAM from Samsung and SK Hynix. Published in Science on July 16, the device, named Guiyi, lifts a faint signal of tens of millivolts to a robust 0.5 volts, a tenfold improvement over prior single-electron attempts, using graphene to reshape the chip structure. The breakthrough could let large language models run on phones with minimal power without \"losing memory\" during conversations. The design revealed two new quantum behaviours. Zhou plans a company this year, aiming to commercialise within three to five years and \"shake up the existing storage market\".", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/24%20Jul%202026/24%20Jul%20SCMP/China%E2%80%99s%20new%20chip%20stores%20data%20with%20a%20single%20electron,%20breaking%20AI%20memory%20bottleneck.pdf"}, {"id": "scmp-04", "title": "China's power grid no longer keeping pace with green energy capacity, study says", "source": "SCMP", "date": "24 Jul 2026", "tags": ["Energy", "Environment"], "summary": "China is building more wind and solar capacity than the rest of the world combined, but transmission bottlenecks risk prolonging its reliance on coal, according to a Global Energy Monitor report. More than 500GW of a planned 1,360GW of utility-scale projects are under construction, putting China ahead of its 2030 target. But much power generated in the northwest cannot reach eastern demand centres; roughly 315GW of megabase capacity will need about 27 ultra-high voltage lines by 2030, while the latest five-year plan outlines only about 10. Solar curtailment hit 10 to 17 per cent last year in northwestern regions. Coal still accounts for 42 per cent of UHVDC transmission. GEM warned of a possible \"coal lock-in\" as renewables meet only minimum compliance standards.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/24%20Jul%202026/24%20Jul%20SCMP/China%E2%80%99s%20power%20grid%20no%20longer%20keeping%20pace%20with%20green%20energy%20capacity,%20study%20says.pdf"}, {"id": "scmp-05", "title": "EU push to remove Huawei, other Chinese telecoms gear could cost US$46 billion: report", "source": "SCMP", "date": "24 Jul 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "Removing equipment made by Huawei and other Chinese vendors from EU telecoms networks would cost operators 30 billion to 40 billion euros (US$34 billion to US$46 billion), roughly three times the European Commission's estimate, according to a GSMA Intelligence report commissioned by seven operator groups including Deutsche Telekom, Vodafone and Orange. Brussels wants operators to strip out high-risk suppliers, chiefly Huawei and ZTE, within three years of a revised Cybersecurity Act. The report says reduced competition would raise equipment prices by up to 24 per cent for mobile networks, adding about 24 billion euros by 2035. Huawei holds about a quarter of the EU's mobile equipment market. Removing Chinese vendors would leave Ericsson and Nokia controlling roughly 96 per cent of mobile.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/24%20Jul%202026/24%20Jul%20SCMP/EU%20push%20to%20remove%20Huawei,%20other%20Chinese%20telecoms%20gear%20could%20cost%20US%2446%20billion%20report.pdf"}, {"id": "scmp-06", "title": "EU waters down Russia sanctions over fears China could seize key LNG assets", "source": "SCMP", "date": "24 Jul 2026", "tags": ["Geopolitics", "Energy"], "summary": "The EU has softened its 21st package of Russia sanctions after concluding that banning Greek companies from transporting Russian gas to third countries could hand strategically important shipping assets to China. To remove a Greek veto, member states agreed to let EU operators keep carrying Russian LNG to third countries for one year. Officials said China's role in maritime finance was behind the carve-out, warning that vessels bought via Chinese loans could pass to Beijing-backed owners if operators default. At the centre is Greek firm Dynagas, owned by billionaire George Prokopiou, who has ordered more than 155 vessels from Chinese shipyards. The EU still listed 14 mainland and Hong Kong entities for allegedly aiding Russia's war effort. Brussels considers Beijing a \"key enabler\" of the conflict.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/24%20Jul%202026/24%20Jul%20SCMP/EU%20waters%20down%20Russia%20sanctions%20over%20fears%20China%20could%20seize%20key%20LNG%20assets.pdf"}, {"id": "scmp-07", "title": "Global AI experts push back on US 'distillation' claims against Moonshot's Kimi K3 model", "source": "SCMP", "date": "24 Jul 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "The global AI community has rejected Trump administration claims that Moonshot AI's Kimi K3 distilled US models, citing a lack of evidence and arguing the practice is not intellectual property theft. White House science adviser Michael Kratsios accused the Chinese firm of \"large-scale, covert industrial distillation\" against models including Anthropic's Fable 5; State's Jacob Helberg called it \"a heist of invaluable American Intellectual Property\". A Moonshot employee noted the narrow window, saying the team \"trained a brand new frontier model in JUST 15 DAYS\". Experts including Hong Kong's Michael Chau said there is insufficient evidence Kimi K3 was distilled, while others highlighted innovations like Kimi Delta Attention. Kevin Xu called the IP-theft framing \"a political and lobbying talking point\".", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/24%20Jul%202026/24%20Jul%20SCMP/Global%20AI%20experts%20push%20back%20on%20US%20%E2%80%98distillation%E2%80%99%20claims%20against%20Moonshot%E2%80%99s%20Kimi%20K3%20model.pdf"}, {"id": "scmp-08", "title": "Iran war: Chinese tanker passes Red Sea choke point despite Houthi blockade", "source": "SCMP", "date": "24 Jul 2026", "tags": ["Geopolitics", "Energy"], "summary": "The Houthi militia in Yemen appears to be letting some ships through the Bab al-Mandab strait despite its declared blockade of shipping to Saudi Arabia, experts said. Cosco Shipping's VLCC Xin Long Yang was granted permission to pass, according to Lloyd's List, which said Chinese tankers returning from the Saudi port of Yanbu may negotiate passage case-by-case with the Iranian-backed Houthis. The Institute for the Study of War counted seven ships that altered course to avoid the strait. The militia declared the blockade on Monday after a fresh confrontation with Saudi Arabia; the Saudi tanker Encelia was attacked and set ablaze late Wednesday. Oman warned against escalation, and the EU-led Aspides mission advised ships linked to Israel, the US or Saudi Arabia to avoid the Red Sea.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/24%20Jul%202026/24%20Jul%20SCMP/Iran%20war%20Chinese%20tanker%20passes%20Red%20Sea%20choke%20point%20despite%20Houthi%20blockade.pdf"}, {"id": "scmp-09", "title": "Japan's deadliest fault line shifts, frustrating megaquake forecasts", "source": "SCMP", "date": "24 Jul 2026", "tags": ["Society", "Environment"], "summary": "A Japanese study has found that the locked zone in the Nankai Trough is not permanent but changes over time, further complicating efforts to predict megaquakes along the 900km fault where the Philippine plate slips under the Eurasian plate at 4-6cm a year. Using crustal deformation data from 2013 to 2023, a University of Tokyo and coastguard team found some areas remained continuously locked while others were more fluid, and that locking occurred only at certain depths. Lead author Yusuke Yokota said the release of plate locking \"could occur anywhere\", requiring new scenarios. Japan warns of a 60 to 90 per cent chance of a megaquake within 30 years, with up to 298,000 potential deaths. Seismic clustering, with 21 magnitude-4-plus quakes early this year, may be a precursor.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/24%20Jul%202026/24%20Jul%20SCMP/Japan%E2%80%99s%20deadliest%20fault%20line%20shifts,%20frustrating%20megaquake%20forecasts.pdf"}, {"id": "scmp-10", "title": "More Americans think China is world leader in AI, new survey reveals", "source": "SCMP", "date": "24 Jul 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "More than one-third of Americans see China, not the US, as the global leader in artificial intelligence, according to a Pew Research Centre survey released Thursday. Some 36 per cent believe China is more advanced, versus 12 per cent for the US, 18 per cent seeing them as equal and 33 per cent unsure. The perception cut across party lines, with 30 per cent of Republicans and 43 per cent of Democrats saying China leads. The findings come as the AI race accelerates and technology features high on the agenda for a planned Trump-Xi summit on September 24. Trump insisted \"We're leading China\" and touted America's lead \"by a lot\". The survey followed White House claims that Moonshot AI stole from Anthropic via distillation, which experts have disputed.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/24%20Jul%202026/24%20Jul%20SCMP/More%20Americans%20think%20China%20is%20world%20leader%20in%20AI,%20new%20survey%20reveals.pdf"}, {"id": "scmp-11", "title": "On tariffs, China and US ask industry a US$30 billion question", "source": "SCMP", "date": "24 Jul 2026", "tags": ["Trade", "Geopolitics"], "summary": "Beijing and Washington are actively soliciting industry feedback on potential bilateral tariff reductions under a newly established board of trade, China's commerce ministry said. Official Meng Huating said China is gathering views from domestic firms, associations, local governments and American firms on tariff-reduction arrangements, and that the US is collecting public feedback too as both sides refine the board's framework and operations. The board of trade and a board of investment, announced after Trump's May state visit, target tariff relief on about US$30 billion of goods each side. Secretary of State Marco Rubio called the boards a potential \"concrete deliverable\" before Xi's expected US visit. Meanwhile USTR's Jamieson Greer signalled a fresh global tariff round to replace expiring 10 per cent duties, potentially under Section 301.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/24%20Jul%202026/24%20Jul%20SCMP/On%20tariffs,%20China%20and%20US%20ask%20industry%20a%20US%2430%20billion%20question.pdf"}, {"id": "scmp-12", "title": "Path opened for Malaysian firms to pursue secondary share listings in Hong Kong", "source": "SCMP", "date": "24 Jul 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Bursa Malaysia will become the 21st stock exchange recognised by Hong Kong Exchanges and Clearing, clearing the way for Malaysia-listed companies to pursue secondary listings in the city, announced during a visit by Hong Kong's financial services secretary Christopher Hui. It becomes the fourth Asian bourse recognised, after Indonesia, Singapore and Thailand. Capital A Berhad, which runs travel app AirAsia Move and food brand Santan, is actively exploring a dual listing to access global and mainland investors. The move supports Hong Kong's push to broaden its appeal beyond mainland China, which supplies over 90 per cent of new listings. Hui also signed two MOUs in Kuala Lumpur covering mutual fund recognition and regulatory cooperation. HKEX recently lost its top IPO crown to Nasdaq after SpaceX's US$75 billion listing.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/24%20Jul%202026/24%20Jul%20SCMP/Path%20opened%20for%20Malaysian%20firms%20to%20pursue%20secondary%20share%20listings%20in%20Hong%20Kong.pdf"}, {"id": "scmp-13", "title": "Pentagon expands blacklist to include China's top civilian universities", "source": "SCMP", "date": "24 Jul 2026", "tags": ["Geopolitics", "Defence"], "summary": "The Pentagon has added Fudan University and Shanghai Jiao Tong University to a list of foreign institutions deemed a national security threat, extending its research-security crackdown to two of China's most prestigious civilian universities. The updated Section 1286 list identifies 88 mainland institutions and bars Defence Department-funded researchers from collaborating with them or using their equipment from the 2026 financial year. Undersecretary Emil Michael said the department was protecting \"taxpayer-funded research\". A Chinese embassy spokesperson accused the US of \"overstretching the concept of national security\" and politicising academic exchanges, urging it to drop its \"Cold War mentality\". The list is not a sanctions register but governs Pentagon research funding eligibility. Newly named institutions also include Shandong University and Xidian University in its entirety.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/24%20Jul%202026/24%20Jul%20SCMP/Pentagon%20expands%20blacklist%20to%20include%20China%E2%80%99s%20top%20civilian%20universities.pdf"}, {"id": "scmp-14", "title": "Seoul drops 'denuclearisation-first' stance on Pyongyang", "source": "SCMP", "date": "24 Jul 2026", "tags": ["Geopolitics", "Defence"], "summary": "South Korea has abandoned its campaign prioritising pressure on North Korea to dismantle its nuclear weapons, marking a fresh overture by Seoul's dovish government under President Lee Jae Myung, who took power in June 2025 and has offered Pyongyang talks without preconditions. Unification Minister Chung Dong-young said the government had \"effectively abandoned the previous administration's denuclearisation-first approach\" and its insistence on prior dismantlement, focusing instead on halting the expansion of the North's nuclear activities. The long-term goal of denuclearisation remains unchanged, but \"the immediate priority is to stop it\". Pyongyang, believed to hold dozens of warheads, has not responded to Lee's repeated offers and this month vowed to strengthen its nuclear forces. The two Koreas remain technically at war under a 1953 armistice.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/24%20Jul%202026/24%20Jul%20SCMP/Seoul%20drops%20%E2%80%98denuclearisation-first%E2%80%99%20stance%20on%20Pyongyang.pdf"}, {"id": "scmp-15", "title": "Trump throws newly signed Saudi nuclear deal into doubt with Israel recognition demand", "source": "SCMP", "date": "24 Jul 2026", "tags": ["Geopolitics", "Energy"], "summary": "The White House threw a US-Saudi Arabia civil nuclear deal into question a day after signing, saying it hinges on Riyadh joining the 2020 Abraham Accords by recognising Israel. Trump wrote the deal \"will be approved, but is totally subject to Saudi Arabia joining\" the accords, adding it would exclude enrichment and cover only non-military use. The demand cast doubt on the pact, as Riyadh has long refused to normalise ties with Israel without a credible path to Palestinian statehood, a stance hardened by the Gaza war. Press secretary Karoline Leavitt backed the messaging, saying it was not added at Netanyahu's insistence \"to my knowledge\". Netanyahu called potential recognition a \"historic leap forward for peace\". Analysts say Riyadh is unlikely to accept, amid the ongoing US-Israel war with Iran.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/24%20Jul%202026/24%20Jul%20SCMP/Trump%20throws%20newly%20signed%20Saudi%20nuclear%20deal%20into%20doubt%20with%20Israel%20recognition%20demand.pdf"}, {"id": "scmp-16", "title": "Trump vows to punish Iran for Houthi attacks in Red Sea, as oil surges over US$100", "source": "SCMP", "date": "24 Jul 2026", "tags": ["Geopolitics", "Energy"], "summary": "President Trump promised \"major military punishment\" for Iran and its Houthi allies after Yemeni fighters struck two Saudi oil tankers in the Red Sea, extending the Middle East war to a second shipping chokepoint. Fears of wider disruption sent Brent crude up more than 6 per cent, past US$100 for the first time since May. The US launched fresh air strikes on Iran overnight, prompting Iran to fire at Arab countries hosting US bases. Trump said the US would hold Iran responsible as the Houthis are its \"Surrogate and/or Proxy\", and told Axios he was close to deciding on relaunching major combat operations. The Houthis said they struck the tankers Encelia and Layla; Red Sea shipping insurance costs doubled for some firms.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/24%20Jul%202026/24%20Jul%20SCMP/Trump%20vows%20to%20punish%20Iran%20for%20Houthi%20attacks%20in%20Red%20Sea,%20as%20oil%20surges%20over%20US%24100.pdf"}, {"id": "scmp-17", "title": "Trump's manufacturing push meets reality as costs rise and investment stalls", "source": "SCMP", "date": "24 Jul 2026", "tags": ["Trade", "Politics"], "summary": "Trump's push to revive US manufacturing is faltering 18 months into his second term, executives and economists say, as policy churn, higher costs and structural weakness undercut competitiveness. Colorado's Zion Foodtrucks says 50 per cent steel and aluminium tariffs, truck delivery costs up US$1,000 from the Iran war, and cheaper Mexican rivals have squeezed it. Factory construction spending fell 20 per cent and factory jobs dropped 80,000 between January 2025 and mid-2026, while manufacturing narrowed from 9.8 to 9.4 per cent of GDP. Trump claimed US$17 trillion in new investment, which critics dispute; Democrat Robert Garcia said \"Donald Trump is living in a fantasy world\". Analysts contrast China's multi-year plans with Trump's mercurial policies, warning of high opportunity costs as firms repackage old investments and sign non-binding letters of intent.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/24%20Jul%202026/24%20Jul%20SCMP/Trump%E2%80%99s%20manufacturing%20push%20meets%20reality%20as%20costs%20rise%20and%20investment%20stalls.pdf"}, {"id": "scmp-18", "title": "US senators clash over scope of Chinese connected-vehicle ban", "source": "SCMP", "date": "24 Jul 2026", "tags": ["Politics", "Trade"], "summary": "US senators broadly agree Chinese connected vehicles should be kept off American roads, but a bipartisan bill has exposed divisions over scope. The Senate Commerce Committee advanced the Connected Vehicle Security Act of 2026, which would prohibit importing, making or selling connected vehicles linked to China and other adversaries, and bar vehicles from firms more than 15 per cent Chinese-owned. Sponsor Bernie Moreno warned against ceding the industry and \"automotive fentanyl\". Chairman Ted Cruz called the language \"overly broad\", warning it could ensnare Mercedes-Benz, whose Chinese investors BAIC and Geely's Li Shufu together exceed 15 per cent, and said the \"punitive provision attacking Mercedes\" would sink the bill. Cruz proposed and withdrew a CFIUS-based amendment. Lawmakers also clashed over whether Chinese-made batteries should be included.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/24%20Jul%202026/24%20Jul%20SCMP/US%20senators%20clash%20over%20scope%20of%20Chinese%20connected-vehicle%20ban.pdf"}, {"id": "scmp-19", "title": "US slaps fresh tariffs on China, 50-plus countries in latest wave", "source": "SCMP", "date": "24 Jul 2026", "tags": ["Trade", "Geopolitics"], "summary": "The US imposed a fresh wave of tariffs on 60 countries late Thursday, including China, Japan, South Korea, India and EU states, hours before a temporary 10 per cent blanket levy expired. The 10 to 12.5 per cent duties stem from a Section 301 forced-labour investigation, with USTR Jamieson Greer citing \"a human rights abuse and distortive trade practice\". China faces 12.5 per cent. Experts call forced labour a pretext for Trump's America-first agenda; consultant Ashley Kalyn said \"it's the uncertainty, not the rate, that's the real cost\". The move follows the Supreme Court striking down Trump's IEEPA levies in February. Recent measures include 25 per cent tariffs on Brazil and Section 338 threats of 50 per cent tariffs on Canada. China warned of \"necessary measures\".", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/24%20Jul%202026/24%20Jul%20SCMP/US%20slaps%20fresh%20tariffs%20on%20China,%2050-plus%20countries%20in%20latest%20wave.pdf"}, {"id": "scmp-20", "title": "Why Japan's fighter jet future looks 'more optimistic' with Canada's entry", "source": "SCMP", "date": "24 Jul 2026", "tags": ["Defence", "Geopolitics"], "summary": "Canada's decision to take an observer role in the next-generation Global Combat Air Programme has eased Japan's fears over its fighter jet future, with Germany also reportedly exploring joining the project involving Britain and Italy. GCAP is critical to replacing Japan's ageing F-2 fleet, and Tokyo had been frustrated by London dragging its feet amid defence funding shortfalls. Analysts said the extra partners underline new alliances as Nato and Indo-Pacific states view Trump's administration as unreliable. Analyst William Yang said Tokyo will \"feel more supported\" and sees GCAP as \"the pilot project for much broader defence cooperation without US involvement\", noting the US industrial base is clogged by the Iran conflict. Airbus signalled interest at Farnborough. Scholar Stephen Nagy called it part of Japan diversifying defence partners.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/24%20Jul%202026/24%20Jul%20SCMP/Why%20Japan%E2%80%99s%20fighter%20jet%20future%20looks%20%E2%80%98more%20optimistic%E2%80%99%20with%20Canada%E2%80%99s%20entry.pdf"}, {"id": "scmp-21", "title": "Why PLA fighter jet sorties near Taiwan dropped to a 3-year low in the first half of 2026", "source": "SCMP", "date": "24 Jul 2026", "tags": ["Defence", "Geopolitics"], "summary": "The number of PLA fighter jets detected near Taiwan more than halved year on year to 1,334 in the first half of 2026, a three-year low and the lowest tempo since 2023, per an SCMP tally of Taiwan defence ministry data. The number of days with no PLA jets hit a new high of 38, and the PLA staged no large-scale drills, a first since 2022. Air sorties had topped 5,400 in 2025. Observers attribute the shift to improved Beijing-Washington ties, pending US arms sales and internal cost control. RSIS's Collin Koh cited a \"leaders' consensus\" from the Xi-Trump summit to turn down tensions, with reports Trump might delay arms sales. Renmin University's Shi Yinhong said Beijing is withholding reasons for the US to boost support for Taipei.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/24%20Jul%202026/24%20Jul%20SCMP/Why%20PLA%20fighter%20jet%20sorties%20near%20Taiwan%20dropped%20to%20a%203-year%20low%20in%20the%20first%20half%20of%202026.pdf"}, {"id": "scmp-22", "title": "Why the spectre of 'climate black swan' events is haunting global investors", "source": "SCMP", "date": "24 Jul 2026", "tags": ["Finance & Markets", "Environment"], "summary": "As a potentially record El Nino threatens to push up global food prices, investment banks are warning investors to prepare for \"climate black swan\" events: sudden, unexpected climate shifts capable of upending markets. HSBC said geopolitical and weather risks are colliding in Asia's rice market as importers stockpile grain. NOAA sees an 81 per cent chance of a \"very strong\" El Nino in October-December. Malaysia extended its rice-reserve target to nine months and Indonesia is building a record 5.3 million-tonne stockpile; Thai broken rice prices rose over 20 per cent. Fertiliser flows through the Persian Gulf have slowed amid Strait of Hormuz tensions. JPMorgan said abrupt climate shifts remain largely absent from valuation models; a survey found none of 32 global banks had fully incorporated climate tipping points.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/24%20Jul%202026/24%20Jul%20SCMP/Why%20the%20spectre%20of%20%E2%80%98climate%20black%20swan%E2%80%99%20events%20is%20haunting%20global%20investors.pdf"}]}, "2026-07-27": {"date": "2026-07-27", "dayOfWeek": "Monday", "totalArticles": 70, "sourceCounts": {"WSJ": 14, "ST": 11, "BT": 15, "SCMP": 30}, "executiveDigest": "Corporate America has suddenly reined in AI spending - a sharp shift after months of records - even as WSJ noted the biggest stock selloff since Black Monday; oil's surge past US$100 rekindled an inflation threat that left global bonds reeling and pushed US 30-year yields toward 5%, while the US and Iran paused strikes after Gulf states hit Iran, and Singapore weighed the risks of an AI-led growth spurt turning into a headwind.", "briefingCards": [{"title": "Lead story - Corporate America reins in AI spending", "body": "In a notable turn, WSJ reported 'Corporate America has suddenly decided to stop blowing money on AI' - a sharp reversal after months of record capex - and framed the moment against the biggest stock selloff since Black Monday, though IBM's CEO said he isn't worried. SAP shares jumped on cloud-business resilience and Verizon is chasing AI-boom opportunities, but the mood has cooled. China, meanwhile, is in an 'all-out push' to catch up with American AI chips, Silicon Valley is divided over whether to restrict Chinese AI as the gap narrows, and DeepSeek suspended fundraising after its founder's alleged US-China AI comments went viral."}, {"title": "Markets & finance", "body": "Oil's surge past US$100 rekindled an inflation threat, leaving global bonds reeling; SCMP asked how 5% US 30-year Treasury yields will reshape global capital flows, and WSJ weighed whether the Fed is about to hike. The global economy had picked up just before the fresh energy hit. China's CXMT is poised to become the biggest China-listed firm on its trading debut amid a memory-chip frenzy, US blockbuster IPOs are minting new millionaires, and prediction markets heated up as Robinhood and Crypto.com held talks. In Singapore, GIC's new course drew scrutiny - 'should it throw caution to the wind?' - amid a structurally changed world."}, {"title": "Asia realignment", "body": "Trump's trade wars are 'back - despite the Supreme Court', with fresh tariff threats on the EU over tech fines (a US$1 billion Google penalty) and new duties that SCMP warns threaten Washington's credibility in ASEAN. Japan is courting India and Malaysia to escape a US-China AI 'duopoly', and Japan, the UK and Italy eye a Japanese factory to build their next fighter jet. China is positioning for unique access to Indonesian minerals, cracking down on offshore trusts of the wealthy, and showing 'growing AI caution' as its tech firms snubbed US Congress advisers. Russia asked North Korea for 30,000 more troops for Ukraine, Zelensky said."}, {"title": "Energy & climate", "body": "The Iran war kept reshaping energy: it spread to the Red and Caspian seas even as the Gulf went quiet and the US paused strikes, with Bahrain and Kuwait warplanes striking Iran in rare retaliation and a Houthi blockade of Saudi trade threatening a wider conflict. Chevron is scrambling to keep its Kazakh assets out of the Russia-Ukraine war. Europe's heat waves fuelled a rash of wildfires - even melting French resistance to air-conditioning - while CATL posted record quarterly profits on the green-energy boom and a Chinese energy giant's new South Korea plant intensified a power crunch."}, {"title": "Technology & AI", "body": "Beneath the capex pullback, the US-China contest sharpened: WSJ went 'inside China's all-out push' to catch up on AI chips, SCMP explained why 'supernodes' matter for the rivalry, and surging memory-chip prices are making profitable budget phones 'impossible'. Apple's biggest-ever leak - in India - may prompt firms to rethink China relocations. A Nobel laureate, Simon Johnson, warned of China's 'over-automation' problem, and leaked comments shed light on the low profile but high ambition of DeepSeek's Liang Wenfeng, whose firm paused fundraising amid the furore."}, {"title": "Singapore & SEA focus", "body": "Singapore weighed the double edge of its AI-led growth - ST asked whether it 'could turn into a headwind some day' - while Ong Ye Kung argued the 'longevity economy' must improve lives, not drive unnecessary healthcare spending. Property momentum built: the S$950 million Tan Boon Liat sale added to en-bloc momentum, Dunearn House sold 56% of 380 units at an average S$3,140 psf, and investors are homing in on Singapore co-living within Apac's US$13.8 billion 'living' boom. Temasek is eyeing defence deals as Europe rearms, GIC is charting a new course, and BT urged Temasek to state its position on a rumoured CapitaLand-Mapletree merger."}], "keyMetrics": [{"value": "70", "label": "Articles curated today", "sub": "WSJ 14 · ST 11 · BT 15 · SCMP 30"}, {"value": "Capex pullback", "label": "Corporate AI spend", "sub": "WSJ: firms stop 'blowing money'"}, {"value": "~5%", "label": "US 30-year yields", "sub": "Oil surge; global bonds reeling"}, {"value": "US$100+", "label": "Oil price", "sub": "Rekindles inflation threat"}, {"value": "Strikes paused", "label": "US-Iran", "sub": "Gulf quiet; Red/Caspian spread"}, {"value": "S$3,140 psf", "label": "Dunearn House launch", "sub": "56% of 380 units sold"}], "articles": [{"id": "wsj-01", "title": "Bahrain, Kuwait Warplanes Struck Iran in Rare Gulf Retaliation", "source": "WSJ", "date": "27 Jul 2026", "tags": ["Geopolitics", "Defence", "Energy"], "summary": "Bahrain and Kuwait secretly sent jets to strike drone- and missile-storage depots inside Iran early this month, their first direct retaliation against Tehran, people familiar said. The UAE provided intelligence and defensive air cover, signaling budding Arab cooperation. Iran had focused retaliatory strikes on the two Gulf states, both hosting US bases, targeting a Kuwaiti power plant and desalination facility. Kuwait's US ambassador denied any participation. The article details Gulf Arab governments caught between a war they didn't want and an aggrieved Iran, absorbing the bulk of the punishment. Now in its fifth month, the conflict has crippled oil exports via Iran's chokehold on the Strait of Hormuz, with a new Red Sea threat emerging.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20WSJ/Bahrain,%20Kuwait%20Warplanes%20Struck%20Iran%20in%20Rare%20Gulf%20Retaliation.pdf"}, {"id": "wsj-02", "title": "Chevron Is Trying to Keep Its Kazakh Assets Out of the Russia-Ukraine War", "source": "WSJ", "date": "27 Jul 2026", "tags": ["Energy", "Geopolitics", "Finance & Markets"], "summary": "Chevron CEO Mike Wirth lobbied Trump officials to shield the company's Kazakh operations from Ukraine-Russia crossfire. A Ukrainian drone attack hit four tankers near Novorossiysk, a hub and terminus for the Caspian Pipeline Consortium, which carries 2% of daily global oil supply and is 15%-owned by Chevron. Crude loadings were restricted, forcing Kazakhstan to curb output given limited storage. After industry talks, the administration warned Ukraine against attacking non-Russian vessels, calling CPC a vital alternative to Russian energy. Chevron holds a 50% stake in the Tengiz field, about 12% of its global production and projected to generate $6 billion free cash flow. It spent $48 billion expanding Tengiz and seeks a post-2033 extension.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20WSJ/Chevron%20Is%20Trying%20to%20Keep%20Its%20Kazakh%20Assets%20Out%20of%20the%20Russia-Ukraine%20War.pdf"}, {"id": "wsj-03", "title": "Corporate America Has Suddenly Decided to Stop Blowing Money on AI", "source": "WSJ", "date": "27 Jul 2026", "tags": ["Technology & AI", "Finance & Markets", "Geopolitics"], "summary": "Companies fed up with ballooning AI costs are adopting lower-priced models, including cheaper open-weight ones built in China, shopping a la carte alongside OpenAI and Anthropic products. Cursor, a startup SpaceX is buying for $60 billion, advises clients on \"tokenomics\"; a field CTO likened using top models for mundane tasks to driving a Lamborghini for milk. The shift is also geopolitical: US models are closed, while Chinese models like DeepSeek, MiniMax and Moonshot are cheaper and downloadable. Anthropic and OpenAI accuse them of ripping off technology, and some officials weigh bans. Nvidia, Microsoft and Palantir signed a letter backing open models. Vendors are offering aggressive free-usage deals to retain customers amid what one CEO called a bloodbath.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20WSJ/Corporate%20America%20Has%20Suddenly%20Decided%20to%20Stop%20Blowing%20Money%20on%20AI.pdf"}, {"id": "wsj-04", "title": "Europe's Heat Waves Fuel Rash of Wildfires", "source": "WSJ", "date": "27 Jul 2026", "tags": ["Environment", "Society"], "summary": "A summer of repeated heat waves has left southwestern Europe's vegetation dangerously dry, fueling wildfires that forced tens of thousands to evacuate. France ordered 40,000 people out of the Cap Ferret peninsula near Bordeaux, where at least 50 homes were destroyed; a nearby Biscarrosse fire displaced 23,000. Spain declared its first-ever national wildfire emergency, evacuating over 19,000 as two blazes southwest of Madrid merged. More than 628,606 acres have burned across Europe this year. Macron sought reinforcements including Croatian Canadair aircraft and Czech and Slovak Black Hawks. Spain has lost roughly 284,000 acres, nearly five times last year's pace, and an earlier Andalusia fire killed 13. Fontainebleau forest saw the Paris region's first water-bomber deployment.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20WSJ/Europe%E2%80%99s%20Heat%20Waves%20Fuel%20Rash%20of%20Wildfires.pdf"}, {"id": "wsj-05", "title": "Global Economy Picked Up Before Fresh Energy Hit", "source": "WSJ", "date": "27 Jul 2026", "tags": ["Finance & Markets", "Energy", "Geopolitics"], "summary": "Business activity in the US, Europe and parts of Asia picked up in July, S&P Global surveys showed, indicating moderate growth before the fresh energy-price surge from renewed US-Iran hostilities takes a toll. The US PMI rose to 53.6 from 51.9, an eight-month high, partly aided by the World Cup. The eurozone PMI climbed to 51.9, a five-month high, with German activity returning to growth and eurozone new orders rising fastest since April 2023. Japan and Australia accelerated; India slowed. Economist Chris Williamson warned Middle East events raise downside risks. The conflict's impact has been milder than feared as other producers boosted supply and reserves were drawn, but the IMF says buffers are depleting. The ECB flagged weaker growth risks.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20WSJ/Global%20Economy%20Picked%20Up%20Before%20Fresh%20Energy%20Hit.pdf"}, {"id": "wsj-06", "title": "Inside China's All-Out Push to Catch Up With American AI Chips", "source": "WSJ", "date": "27 Jul 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "China is mounting a state-driven effort to close the AI-chip gap with the US after Washington restricted access to cutting-edge chips and tools. Vice Premier Ding Xuexiang, with Xi Jinping's blessing, revived the all-out approach used for China's 1960s atomic-bomb program, forming committees across top firms and labs and warning that resisting domestic chips made users traitors. Huawei says it cut China's dependence on foreign AI chips from 90% in 2021 to under 60% by 2025, aiming for 25% within five years, and claims workarounds for near-state-of-the-art silicon without leading-edge machinery. In software, Moonshot's Kimi K3 nearly matches top US models. But China still lags in hardware, with capacity shortages forcing Moonshot to pause premium sign-ups after launch.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20WSJ/Inside%20China%E2%80%99s%20All-Out%20Push%20to%20Catch%20Up%20With%20American%20AI%20Chips.pdf"}, {"id": "wsj-07", "title": "Is the Fed About to Hike Rates?", "source": "WSJ", "date": "27 Jul 2026", "tags": ["Finance & Markets", "Politics", "Energy"], "summary": "Next week's Fed decision is unusually \"live\" after months of predictability. Futures now imply about a one-third chance of a quarter-point hike, up from near zero in May, as oil prices jumped a third this month, reigniting inflation fears. New Chair Kevin Warsh has scrapped forward guidance, pledging to follow the data, and told Congress he'd have no tolerance for inflation, now above target over five years. At the June meeting, nine of 18 participants foresaw at least one hike this year. Still, the columnist bets the Fed stands pat: commodity-driven inflation is hard to fight, market turbulence and rising bond yields are already tightening conditions, and hiking before midterms would enrage the White House. Odds of any 2026 hike topped 90%.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20WSJ/Is%20the%20Fed%20About%20to%20Hike%20Rates.pdf"}, {"id": "wsj-08", "title": "Prediction-Markets Race Heats Up as Robinhood and Crypto.com Hold Talks", "source": "WSJ", "date": "27 Jul 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Robinhood is in talks with digital-currency exchange Crypto.com to expand its prediction-markets foothold, people familiar said. The deal would add Crypto.com's business to Robinhood's hub, letting users place yes-or-no bets from the crypto exchange. Robinhood has relied on Kalshi and others for contracts, but the partnership is turning into direct competition as both push onto each other's turf. Existing partners include Interactive Brokers' ForecastEx and Rothera, a Susquehanna joint venture. Crypto.com launched its OG platform in February and struck a deal with Trump's media business for Truth Social, not yet live. Kalshi leads the surging US market, seeing $27 billion in World Cup volumes versus $1 billion for the Super Bowl, and plans to expand tradable assets. No deal is guaranteed.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20WSJ/Prediction-Markets%20Race%20Heats%20Up%20as%20Robinhood%20and%20Crypto.com%20Hold%20Talks.pdf"}, {"id": "wsj-09", "title": "SAP Shares Jump After Strong Quarter Reassures Investors of Cloud Business Resilience", "source": "WSJ", "date": "27 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "SAP shares rose more than 6% in Frankfurt after the German software group posted strong second-quarter revenue, easing fears that AI could disrupt its cloud business. Its closely watched current cloud backlog grew 26% at constant currencies, above the roughly 24% expected, prompting Jefferies and Deutsche Bank to signal accelerating growth. Total revenue rose 11% to 9.88 billion euros ($11.24 billion), with cloud revenue up 24% to 6.28 billion euros. The stock remains down about 35% since January amid the software \"SaaSpocalypse\" selloff. Net profit reached 1.83 billion euros, though operating profit of 2.74 billion euros and a 27.8% margin missed forecasts. SAP slightly trimmed full-year operating-profit guidance, citing Dremio and Prior Labs acquisitions, while maintaining cloud-revenue targets.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20WSJ/SAP%20Shares%20Jump%20After%20Strong%20Quarter%20Reassures%20Investors%20of%20Cloud%20Business%20Resilience.pdf"}, {"id": "wsj-10", "title": "The U.S. and Iran Are Stuck in a Cycle of Military Escalation", "source": "WSJ", "date": "27 Jul 2026", "tags": ["Geopolitics", "Defence", "Energy"], "summary": "The US-Iran conflict is escalating even as both sides hit the limits of military force. Iranian-allied Houthis began striking ships at a key Red Sea chokepoint, helping push oil above $100 a barrel for the first time in two months. The US intensified its bombing of Iran in the most intense fighting since Trump and Israel began strikes in late February, threatening a suspected nuclear site at Pickaxe Mountain and Iran's power plants. Secretary Rubio warned \"the price will continue to get higher every single night,\" describing US policy as \"a head for an eye.\" Analysts say neither side can achieve decisive advantage, risking months more war. Houthis declared a maritime blockade of Saudi Arabia; a Saudi vessel was struck in the Red Sea.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20WSJ/The%20U.S.%20and%20Iran%20Are%20Stuck%20in%20a%20Cycle%20of%20Military%20Escalation.pdf"}, {"id": "wsj-11", "title": "Trump Threatens New Tariffs on EU Over Tech Fines", "source": "WSJ", "date": "27 Jul 2026", "tags": ["Trade", "Politics", "Technology & AI"], "summary": "President Trump threatened additional tariffs on European Union goods after the bloc fined US tech firms, including a $1 billion penalty on Alphabet's Google for breaching digital competition rules. On Truth Social, Trump said he would open a Section 301 investigation into the EU \"robbing\" American companies, promising a substantial tariff soon. The probe, run by the US Trade Representative, allows tariffs on countries discriminating against US firms; Trump used the same provision this week for 10% to 12.5% forced-labor tariffs replacing levies the Supreme Court struck down in February. Section 301 tariffs are seen as more legally durable but require lengthy investigation. Most EU goods face 10% now, autos 15%; new tariffs could stack. A prior 15% cap deal left digital regulation unresolved.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20WSJ/Trump%20Threatens%20New%20Tariffs%20on%20EU%20Over%20Tech%20Fines.pdf"}, {"id": "wsj-12", "title": "Trump's Trade Wars Are Back-Despite the Supreme Court", "source": "WSJ", "date": "27 Jul 2026", "tags": ["Trade", "Politics", "Geopolitics"], "summary": "After the Supreme Court struck down Trump's main tariff weapon in February, he rerouted to forgotten trade statutes, treating rulings as road maps not roadblocks. This week he invoked Section 338 of the 1930 Smoot-Hawley law for the first time in its near-century existence to hit Canada with 50% tariffs. In two weeks he announced 25% on Brazil, 50% on Canada, up to 200% on generic drugs, and 10% to 12.5% across as many as 60 partners. The Court had rejected his use of the 1977 IEEPA, saying it didn't authorize tariffs. Now using Sections 122, 232 and 301, Evercore ISI estimates Trump will still raise $240 billion to $260 billion yearly, just 20% below pre-ruling levels. One expert called Section 338 \"possibly the new Ieepa.\"", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20WSJ/Trump%E2%80%99s%20Trade%20Wars%20Are%20Back-Despite%20the%20Supreme%20Court.pdf"}, {"id": "wsj-13", "title": "Verizon Seeks Opportunities From AI Boom as Turnaround Continues", "source": "WSJ", "date": "27 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Verizon beat Wall Street on postpaid phone additions, gaining a net 184,000 in the second quarter, and is pursuing new revenue from the AI infrastructure boom as its turnaround continues. Companywide revenue slipped 0.7% to $34.25 billion, below the $35.16 billion estimate, hurt by a nearly 20% drop in equipment revenue as customers hold devices longer. CEO Dan Schulman announced a Google deal worth over $1 billion to use Verizon's dark fiber connecting data centers, with more partner deals expected. Verizon is retrofitting facilities into data centers, with AI revenue starting next year. Quarterly profit fell to $3.95 billion, or 92 cents a share, on $1.8 billion in special items. Adjusted EPS of $1.30 beat estimates; Schulman's contract was extended to 2028.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20WSJ/Verizon%20Seeks%20Opportunities%20From%20AI%20Boom%20as%20Turnaround%20Continues.pdf"}, {"id": "wsj-14", "title": "Why IBM's CEO Isn't Worried About the Biggest Stock Selloff Since Black Monday", "source": "WSJ", "date": "27 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "IBM stock has languished since July 14, when a disappointing pre-announcement revealed delayed orders as customers moderated spending amid rising AI-driven IT costs. CEO Arvind Krishna says the AI boom is only a temporary disruption and expects most delayed deals to close within six months. IBM remains dominant infrastructure: 70% by value of all transactions flow through the mainframe daily, and it reported $4.8 billion in free cash flow in the first half of 2026, while Alphabet turned cash-flow negative for the first time. IBM designs its own processors, including the Power architecture and Tellum II. For every dollar spent on mainframes, customers spend $3 to $4 more across IBM. The company employs nearly 300,000 and eyes quantum computing as its next trillion-dollar business.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20WSJ/Why%20IBM%E2%80%99s%20CEO%20Isn%E2%80%99t%20Worried%20About%20the%20Biggest%20Stock%20Selloff%20Since%20Black%20Monday.pdf"}, {"id": "st-01", "title": "AI is driving GDP growth, but could it turn into a headwind some day?", "source": "ST", "date": "27 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Singapore's economy is running hot, with GDP expanding 5.7 per cent year on year in Q2 2026 after 6.3 per cent in Q1, far above the 2-4 per cent forecast, and the Straits Times Index hitting a record. The commentary attributes this to the global AI investment cycle, which has turbocharged semiconductor and electronics exports: electronics NODX surged 105.1 per cent in June. But growth is narrow and \"K-shaped\", with traditional services and SMEs squeezed by higher fuel and freight costs from the Iran war. It warns the AI tailwind could reverse if hyperscaler spending is cut, risking widening inequality, and urges policy to spread AI adoption and diversify beyond a few superstar firms.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20ST/AI%20is%20driving%20GDP%20growth,%20but%20could%20it%20turn%20into%20a%20headwind%20some%20day.pdf"}, {"id": "st-02", "title": "Burnham offers sweeteners, hopeful vibes in first week as British PM", "source": "ST", "date": "27 Jul 2026", "tags": ["Politics", "Geopolitics"], "summary": "British Prime Minister Andy Burnham, 56, used his first week to break from predecessor Keir Starmer, centring his agenda on the cost of living. He announced removing a tax on household electricity bills, a planned cap on most bus fares in England and a 20 per cent business rates cut for pubs, clubs and live music venues, framing them as a \"re-prioritisation\" of spending. Arriving in Downing Street on July 20, he spoke without notes or lectern and opened a No. 10 North office in Manchester to boost devolution. Critics question his fiscal discipline and mandate, since Labour MPs installed him without an election. Reform UK's Nigel Farage demands a national vote; the US-Iran conflict and soaring energy prices threaten his plans.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20ST/Burnham%20offers%20sweeteners,%20hopeful%20vibes%20in%20first%20week%20as%20British%20PM.pdf"}, {"id": "st-03", "title": "China bets on local consumers to power its AI ambitions", "source": "ST", "date": "27 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "On July 13, China published its first Five-Year Plan devoted entirely to consumption, aiming to rebalance an economy long driven by exports and investment. A key concept is \"AI + Consumption\", casting artificial intelligence as an engine of consumer spending by promoting AI phones, wearables, robots, smart homes and connected vehicles. The strategy tries to absorb overcapacity in EVs, batteries and semiconductors, where price wars and \"involution\" have squeezed margins and triggered foreign tariffs. It extends a trade-in subsidy programme running since 2024. Analysts warn it could deepen involution and note China's problem is weak consumer confidence, not lack of goods, driven by falling property prices, job insecurity and a thin safety net. Xi Jinping also proposed a World AI Cooperation Organization.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20ST/China%20bets%20on%20local%20consumers%20to%20power%20its%20AI%20ambitions.pdf"}, {"id": "st-04", "title": "French aversion to air-conditioning melts as homes sizzle", "source": "ST", "date": "27 Jul 2026", "tags": ["Environment", "Society"], "summary": "As a European heatwave leaves millions sweltering, more French people are abandoning their traditional aversion to air-conditioning, with units flying off shelves. France recorded its hottest day since measurements began in 1947 on June 24. A survey found eight in 10 French people view air-conditioning as environmentally unfriendly, but experts note nuclear power supplied almost 70 per cent of France's electricity in 2025, limiting the climate impact. Specialists warn AC can locally raise urban temperatures, citing a Lyon simulation showing a 1.75 deg C rise, and stress better building design and insulation. The issue has become political ahead of the 2027 presidential election, with Marine Le Pen backing \"air-conditioning for all\" and Jean-Luc Melenchon calling it a false solution.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20ST/French%20aversion%20to%20air-conditioning%20melts%20as%20homes%20sizzle.pdf"}, {"id": "st-05", "title": "Iran war spreads to Red and Caspian seas, Gulf quiet as US halts strikes", "source": "ST", "date": "27 Jul 2026", "tags": ["Geopolitics", "Defence", "Energy"], "summary": "The Iran war broadened over the weekend despite a US pause in strikes after 13 nights of escalation. Yemen's Iran-aligned Houthis attacked Saudi Aramco oil installations at Jizan and Yanbu along the Red Sea, threatening a second major shipping route beyond the blockaded Strait of Hormuz and risking reigniting Yemen's civil war. The US said its naval blockade \"remains in full effect\". The New York Times reported Trump backed away from ramping up attacks amid concerns over depleting munitions stockpiles, alienating Gulf allies and hitting energy supplies; Vance and General Dan Caine flagged stockpile worries. Iran accused Ukraine of striking an Iranian vessel in the Caspian Sea, killing one sailor. Saudi-led forces struck Houthi sites in Marib and al-Jawf.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20ST/Iran%20war%20spreads%20to%20Red%20and%20Caspian%20seas,%20Gulf%20quiet%20as%20US%20halts%20strikes.pdf"}, {"id": "st-06", "title": "Private markets for retail investors in Singapore", "source": "ST", "date": "27 Jul 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Retail investors in Singapore cannot directly buy shares of private firms like ByteDance, Carousell or Stripe, with the closest option being Temasek-linked Astrea private equity bonds listed on SGX. Options are widening: MAS proposed the Long-term Investment Fund framework in March 2025 to let retail investors access private market funds under strict guard rails. Experts explain private assets are illiquid and once required millions; ADDX has cut minimums to $5,000-$10,000, making them viable for those with $100,000-$200,000 in assets. Semi-liquid products now allow periodic withdrawals. Lawyers and executives stress education, clear risk disclosures and a food-label-style Product Highlights Sheet, cautioning investors must accept that private holdings cannot be sold at will before committing capital.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20ST/Private%20markets%20for%20retail%20investors%20in%20Singapore.pdf"}, {"id": "st-07", "title": "Schools must help students build discernment, problem-solving skills in AI age: Jasmin Lau", "source": "ST", "date": "27 Jul 2026", "tags": ["Society", "Technology & AI"], "summary": "With AI making information readily accessible, students need to develop discernment, problem-solving and communication skills key to future workplaces, said Minister of State for Education Jasmin Lau. Speaking on July 26 at a session organised by Lianhe Zaobao and supported by MOE, she said the education system must examine how to cultivate and assess such qualities and give students more chances to practise them. Her biggest concern is the gradual loss of human communication as children and parents increasingly turn to AI for answers. About 80 members of the public discussed holistic development and reduced grade emphasis. Participants suggested banning tuition for pre-primary children. MOE's Sng Chern Wei said schools should let children experience failure safely. Lau becomes Acting Manpower Minister on July 27.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20ST/Schools%20must%20help%20students%20build%20discernment,%20problem-solving%20skills%20in%20AI%20age%20Jasmin%20Lau.pdf"}, {"id": "st-08", "title": "Tan Boon Liat's $950m sale adds to en bloc momentum as sellers turn realistic on pricing", "source": "ST", "date": "27 Jul 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "The $950 million collective sale of the freehold Tan Boon Liat building in Outram signals a selective recovery in Singapore's en bloc market, following Loyang Valley's $880 million sale in April and the $810 million Thomson View deal in 2025. All three closed below initial reserve prices, sharing exceptional scale, strong locations and re-priced reserves. Analysts say pricing realism is now decisive, with owners of ageing leasehold sites facing rising maintenance costs, lease decay and competition from government land sales. Rezoning Tan Boon Liat to residential with commercial and raising its plot ratio from 3.1 to 4.9 boosted its appeal, while its Business 1 status avoids ABSD. International Plaza will hold an EGM on Aug 1 for a second sale attempt.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20ST/Tan%20Boon%20Liat's%20950m%20sale%20adds%20to%20en%20bloc%20momentum%20as%20sellers%20turn%20realistic%20on%20pricing.pdf"}, {"id": "st-09", "title": "Temasek eyes defence deals as Europe boosts military spending, executive says", "source": "ST", "date": "27 Jul 2026", "tags": ["Defence", "Finance & Markets"], "summary": "Singapore's investment company Temasek is looking to increase defence investments as the war in Ukraine prompts European governments to boost military spending, said Nagi Hamiyeh, president of global investments and head of Europe, Middle East and Africa. Defence forms part of a broader push into EMEA, which accounts for just 12 per cent of Temasek's $518 billion portfolio; it has invested about 13 billion euros there over two years and aims for up to 17 billion euros by 2029. Temasek will mainly target dual-use technologies rather than pure defence makers, adhering to ESG guidelines that exclude biological and chemical warfare. It focuses on larger deals of 500 million to 1 billion euros. Around 73 per cent of its exposure is outside Singapore.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20ST/Temasek%20eyes%20defence%20deals%20as%20Europe%20boosts%20military%20spending,%20executive%20says.pdf"}, {"id": "st-10", "title": "Trump faces midterm reckoning with 100 days to US vote", "source": "ST", "date": "27 Jul 2026", "tags": ["Politics", "Geopolitics"], "summary": "One hundred days before the US midterm elections, President Donald Trump's Republicans face polling pointing to the loss of the House and a tough fight for the Senate. Decision Desk HQ gives Democrats a 59 per cent chance of winning the House, forecasting a 224-211 majority, while narrowly favouring Republicans to hold the Senate through a 50-50 split. A Democratic House would enable investigations, subpoenas and a possible third impeachment drive. Voters are unhappy over living costs and the Iran war, with petrol above US$4 a gallon. Republicans tout border enforcement, tax cuts and favourable redistricting. Trump's approval sits near record lows at 36 per cent; analysts note approval under 40 typically means losing chambers.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20ST/Trump%20faces%20midterm%20reckoning%20with%20100%20days%20to%20US%20vote.pdf"}, {"id": "st-11", "title": "US strikes Iran amid 'existential war' threat", "source": "ST", "date": "27 Jul 2026", "tags": ["Geopolitics", "Defence", "Energy"], "summary": "The US launched two waves of attacks on Iran's coastal defences and missile sites on July 15 after re-imposing a naval blockade, while Iran struck US military sites in neighbouring countries in what it called an \"existential war\" with America. The escalation followed the collapse of a fragile truce, with Iran again threatening regional energy exports after closing the Strait of Hormuz, which carried about a fifth of global oil and gas shipments. Brent crude closed at a one-month high of US$84.95. US Central Command said it hit command centres, air defences and missile capabilities, including at Bandar Abbas. Iran's Revolutionary Guard said it targeted US bases in Bahrain, Kuwait and Jordan. July US attacks killed 35 people; Trump said Iran wants to settle.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20ST/US%20strikes%20Iran%20amid%20'existential%20war'%20threat.pdf"}, {"id": "bt-01", "title": "'Asia will be the growth engine': FedEx's Salil Chari on riding the AI boom", "source": "BT", "date": "27 Jul 2026", "tags": ["Technology & AI", "Trade", "Southeast Asia"], "summary": "FedEx Asia-Pacific regional president Salil Chari told The Business Times he wants to seize artificial intelligence-driven growth opportunities across the region while helping customers navigate the new norms of trade amid geopolitical instability. Speaking at FedEx's Singapore office, he said \"Asia will be the growth engine for FedEx\", and made realising that his goal. Global logistics is in a volatile era, but Chari says this has not derailed his focus on regional high-value trade. He frames the disruption as opportunity, positioning FedEx to support businesses adapting to shifting supply chains and evolving trade rules. His strategy centres on capturing high-value cross-border flows in a fast-growing but unstable Asia-Pacific market as the AI boom accelerates.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20BT/'Asia%20will%20be%20the%20growth%20engine'%20FedEx's%20Salil%20Chari%20on%20riding%20the%20AI%20boom.pdf"}, {"id": "bt-02", "title": "A practical pathway to AI-led productivity", "source": "BT", "date": "27 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Singapore Budget 2026 renewed a push to embed AI across the economy, establishing a National AI Council and expanding support through the National AI Impact Programme. Against uneven revenue visibility and tighter capital discipline, the writer, SGX's market strategist, argues structured, staged approaches matter more. IMDA's Open Innovation Platform (OIP) links defined business challenges to deployable solutions with measurable KPIs over a 12-to-16-week cycle. Since 2018 it has mobilised more than 450 challenge statements, offering around S$25 million total, roughly S$55,000 per challenge, and provides access to over 21,000 solvers across domains including AI, robotics and analytics. Companies fund development via prize funding, testing feasibility before scaling. OIP offers SGX-listed firms a disciplined, de-risked pathway to adopt AI and digital solutions.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20BT/A%20practical%20pathway%20to%20AI-led%20productivity.pdf"}, {"id": "bt-03", "title": "CXMT poised to become biggest China-listed firm on trading debut amid memory chip investment frenzy", "source": "BT", "date": "27 Jul 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Investor excitement over memory chips has set outsize expectations for CXMT's Shanghai debut on Monday (Jul 27). The DRAM maker, formerly ChangXin Memory Technologies, raised 66.6 billion yuan (US$9.8 billion) in a near-record IPO and is poised to become the biggest China-listed firm on day one. Its retail tranche was 212 times oversubscribed. As the world's fourth-largest DRAM maker, CXMT is central to Beijing's drive to cut reliance on foreign chips, including high-bandwidth memory for AI data centres. The IPO priced at 2.4 times book, a discount to global peers. Shadow-market futures imply a valuation near US$428 billion. A roughly 330 per cent gain would overtake ICBC as China's most valuable listed firm. Analysts see \"enormous room for growth\".", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20BT/CXMT%20poised%20to%20become%20biggest%20China-listed%20firm%20on%20trading%20debut%20amid%20memory%20chip%20investment%20frenzy.pdf"}, {"id": "bt-04", "title": "DeepSeek suspends fundraising after founder's alleged US-China AI comments go viral: sources", "source": "BT", "date": "27 Jul 2026", "tags": ["Technology & AI", "Finance & Markets", "Geopolitics"], "summary": "DeepSeek has told prospective investors it is suspending its second fundraising round, sources said, days after comments attributed to founder Liang Wenfeng about US-China AI competition went viral. Chinese media reported Liang discussed reliance on Nvidia chips and China's persistent lag in AI sophistication versus the US. The suspension reportedly stemmed from his frustration over leaks from his first round, which closed in June raising US$7 billion. DeepSeek had targeted at least 10 billion yuan (US$1.5 billion) more at a premoney valuation of at least 480 billion yuan, up from a roughly US$50 billion first-round tag. Backers included Tencent and CATL. The startup is preparing a possible 2026 IPO. Liang, now worth US$36 billion, is the richest AI-model creator, per Bloomberg.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20BT/DeepSeek%20suspends%20fundraising%20after%20founder's%20alleged%20US-China%20AI%20comments%20go%20viral%20sources.pdf"}, {"id": "bt-05", "title": "Dunearn House sells 56% of 380 units at average of S$3,140 psf at launch", "source": "BT", "date": "27 Jul 2026", "tags": ["Finance & Markets", "Society"], "summary": "Dunearn House, a Frasers Property-led development in Bukit Timah's upcoming Turf City precinct, sold 56 per cent of its 380 units at its weekend launch, with 212 units going at an average S$3,140 per square foot and all three-bedroom units sold out. Prices started at S$1.475 million for two-bedders. The project is a consortium of Frasers Property, CSC Land and Sekisui House; about 86 per cent of buyers were Singaporeans. Analysts were divided: PropNex's Kelvin Fong cited first-mover appeal in the new estate, while Nicholas Mak of Mogul.sg said take-up lagged first-half launches averaging 75.8 per cent and River Modern's 90 per cent. Mak warned of buyer fatigue after 39 projects and 17,917 units launched in 18 months.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20BT/Dunearn%20House%20sells%2056%20of%20380%20units%20at%20average%20of%20S3,140%20psf%20at%20launch.pdf"}, {"id": "bt-06", "title": "GIC is charting a new course, but should it throw caution to the wind?", "source": "BT", "date": "27 Jul 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "As GIC released FY2025/2026 results, its annualised 20-year real return slipped to 3.4 per cent, down 0.4 point and the lowest in six years, while its five-year nominal return of 3.6 per cent was the worst since FY2012/2013. Beyond the numbers, Singapore's sovereign wealth fund is overhauling its playbook. From April 2026 it adopts a \"strategic portfolio\" grouping capital, estimated at US$936 billion, into three economic-function categories: growth equities, income-generating fixed income and inflation-shielding real assets, erasing public-private walls and rigid quotas. GIC will add US$30 billion to hedge funds over three years to diversify from AI-concentration risk. Critics note it resembles GIC's 1980s four-bucket structure, but leadership warns of \"elevated uncertainty\". The piece questions whether new flexibility invites reckless return-chasing.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20BT/GIC%20is%20charting%20a%20new%20course,%20but%20should%20it%20throw%20caution%20to%20the%20wind.pdf"}, {"id": "bt-07", "title": "GIC's portfolio resilience in a structurally changed world", "source": "BT", "date": "27 Jul 2026", "tags": ["Finance & Markets", "Geopolitics", "Energy"], "summary": "In an adapted Letter from the CEO in GIC's 2025/2026 report, the chief executive argues the Middle East conflict and Strait of Hormuz disruptions show how fast the global environment shifts, with oil prices spiking and inflation risks returning. GIC frames geopolitical risk as structural, not episodic, producing enduring country risk premiums and wider divergence between winners and losers. It responds with three principles: diversification, granularity and agility. The fund has broadened exposure to durable cash flows, intellectual property, music royalties, gold and inflation-resilient real assets. On AI, it invests granularly across enablers, monetisers and adopters, backing hyperscalers, advanced semiconductors and data-centre power. On energy, it favours regulated networks and grid efficiency. Marking 45 years, its mandate to preserve Singapore's reserves is unchanged.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20BT/GIC's%20portfolio%20resilience%20in%20a%20structurally%20changed%20world.pdf"}, {"id": "bt-08", "title": "Global bonds reeling as oil surge rekindles inflation threat", "source": "BT", "date": "27 Jul 2026", "tags": ["Finance & Markets", "Energy"], "summary": "Global bonds were battered last week as resurgent energy prices rekindled inflation fears, hitting investors who bet this year's rout had ended. UK gilt yields logged their longest run of closes above 5 per cent in nearly two decades; Germany's 10-year yield hit its highest since 2011 and Japan's 40-year jumped 10 basis points Friday. The Bloomberg Global Treasury Index yield reached 3.68 per cent, the highest since the 2008 crisis. Brent topped US$100 amid renewed Middle East hostilities. Markets now see a one-in-three chance of a Fed hike at its Jul 28-29 meeting, complicated by chair Kevin Warsh's reduced forward guidance. The BoJ and Bank of England also decide soon. Moody's warned of a \"new macro regime\" of structurally higher inflation and wider deficits.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20BT/Global%20bonds%20reeling%20as%20oil%20surge%20rekindles%20inflation%20threat.pdf"}, {"id": "bt-09", "title": "Investors home in on Singapore co-living, Hong Kong student housing in Apac's US$13.8 billion living boom", "source": "BT", "date": "27 Jul 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Asia-Pacific's living real estate sector is seeing a US$13.8 billion boom, per CapitaLand Investment research, with investors targeting Singapore co-living and Hong Kong student housing. Living was the only sector to grow investment through the pandemic and the 2022-2024 rate-hiking cycle. Japan's multifamily share of Apac living volume fell from around 75 per cent in 2019 to about 50 per cent in 2025 as capital shifted to Australian build-to-rent, student housing and Singapore co-living. Singapore's co-living inventory grew 17 per cent in 2023-2025, drawing S$1.4 billion despite tight yields around 4 per cent. Hong Kong student-housing deals more than doubled to HK$3.3 billion, yielding 4.5 to 5 per cent amid a bed shortfall. BlackRock, Mapletree, Keppel and SC Capital are active, though scalability remains the main constraint.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20BT/Investors%20home%20in%20on%20Singapore%20co-living,%20Hong%20Kong%20student%20housing%20in%20Apac%E2%80%99s%20US%2413.8%20billion%20living%20boom.pdf"}, {"id": "bt-10", "title": "Should you be afraid of Elon Musk?", "source": "BT", "date": "27 Jul 2026", "tags": ["Technology & AI", "Society"], "summary": "In a wide-ranging interview, Elon Musk sets out two paradoxes and a contradiction about AI, notes this Economist opinion piece. First, the power-hungry tycoon is helping build technology he says will render all humans powerless within five to ten years. Second, the world's richest man, worth US$750 billion, says he is preparing for infinite abundance where money becomes obsolete, yet acts otherwise. Musk urges AI pioneers in America and China to vet each other's models and imbue them with a love of truth, with governments providing enforcement. The Economist calls his largely institution-free proposal flimsy and self-serving, and warns his fatalism is dangerous and potentially infectious, distracting from serious thinking about preparing society while the race for advanced AI charges ahead.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20BT/Should%20you%20be%20afraid%20of%20Elon%20Musk.pdf"}, {"id": "bt-11", "title": "Silicon Valley divided over restricting Chinese AI as China closes gap with US", "source": "BT", "date": "27 Jul 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "A long-running Silicon Valley split over open-versus-closed AI reached a boiling point this week. Anthropic and OpenAI argue advanced models are too dangerous to develop openly and lobbied Washington over Chinese open-source models; Microsoft, Nvidia, Meta, Palantir and IBM signed a letter backing open source. Nvidia's Jensen Huang said the world needs both frontier closed and open models; Microsoft's Satya Nadella called open source \"essential\". The clash stems from China's rapid progress: Z.ai and Moonshot AI released models rivalling US labs, which accuse Chinese firms of \"distilling\" their systems. US officials including Treasury Secretary Scott Bessent weighed sanctions but lean toward case-by-case national-security regulation over a blanket ban. Nearly 200 startups urged no limits; Musk, Zuckerberg, Altman and Pichai backed open source.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20BT/Silicon%20Valley%20divided%20over%20restricting%20Chinese%20AI%20as%20China%20closes%20gap%20with%20US.pdf"}, {"id": "bt-12", "title": "Singapore's longevity economy must improve lives, not drive unnecessary healthcare spending, says Ong Ye Kung", "source": "BT", "date": "27 Jul 2026", "tags": ["Society", "Finance & Markets"], "summary": "Health Minister Ong Ye Kung said Singapore, becoming a super-aged society, should build a longevity economy by strengthening biomedical sciences, nutrition and AI. Speaking at The Business Times Longevity Forum, presented by HSBC Life, he said ageing will create economic opportunities as older, wealthier generations spend on retirement living, insurance, tourism and wellness; boomers spend about three times as much as Gen Z travellers. The global wellness industry grew from about US$4 trillion a decade ago to US$7 trillion in 2024, nearing US$10 trillion by decade's end. But he warned against \"the wrong kind of growth\", citing a \"buffet syndrome\" of over-servicing from overly generous insurance. Biomedical manufacturing generated over S$30 billion in 2024. He urged government-industry partnership anchored on dignity and affordability.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20BT/Singapore's%20longevity%20economy%20must%20improve%20lives,%20not%20drive%20unnecessary%20healthcare%20spending,%20says%20Ong%20Ye%20Kung.pdf"}, {"id": "bt-13", "title": "Temasek should publicly state its position on the long-rumoured CapitaLand-Mapletree merger", "source": "BT", "date": "27 Jul 2026", "tags": ["Finance & Markets"], "summary": "The columnist argues Temasek should publicly state its position on the long-rumoured CapitaLand Investment (CLI)-Mapletree merger, which reportedly stalled over valuation, personnel and weak-business concerns. CLI shares are down more than 8.1 per cent this year amid China property weakness. Merging their Reits looks tricky: CapitaLand Integrated Commercial Trust trades at 1.14 times NAV while Mapletree Pan Asia Commercial Trust trades at 0.77 times, risking objections from minority unitholders. Citing an OECD report on concentrated Asian ownership and valuation discounts, the writer says controlling shareholders should not stay silent about intentions. Temasek, which controls both groups, previously backed transformations at Keppel, Sembcorp, CapitaLand and Sats. Stating support would align the market; boards would then structure a deal respecting minorities and installing accountable managers.", "url": "https://stcsg-my.sharepoint.com/personal/teoqingwei_tecity_com_sg/Documents/Tecity%20News%20Dashboard/27%20Jul%202026/27%20Jul%20BT/Temasek%20should%20publicly%20state%20its%20position%20on%20the%20long-rumoured%20CapitaLand-Mapletree%20merger.pdf"}, {"id": "bt-14", "title": "US blockbuster IPOs are creating new millionaires. Philanthropies want to share in the bonanza", "source": "BT", "date": "27 Jul 2026", "tags": ["Finance & Markets", "Society"], "summary": "As blockbust
